 {id:"d1", t:"Development", kind:"theory", q:"Describe and evaluate Piaget's stage theory of cognitive development.",
  desc:"Piaget argued that children build schemas (mental frameworks of knowledge) through experience, and pass through four stages in a fixed order: sensorimotor (0–2), pre-operational (2–7), concrete operational (7–11) and formal operational (11+). In the sensorimotor stage children develop object permanence, which Piaget tested by hiding a toy under a blanket. Pre-operational children are egocentric: in the three mountains task they described their own view rather than the doll's. Children then learn to conserve (understanding quantity stays the same when appearance changes) and think logically about concrete objects, and finally, in the formal operational stage, to think abstractly.",
  tdee:[
   ["One weakness of Piaget's theory is that later research has challenged it.","This means other researchers found results that go against his stages.","For example, Hughes found 90% of children aged 3½–5 could hide a boy doll from two policeman dolls, and McGarrigle and Donaldson found more children could conserve when 'naughty teddy' messed up the counters.","This is a weakness because it suggests children lose egocentrism and can conserve earlier than Piaget claimed, so he underestimated them."],
   ["Another weakness is that Piaget's research may have suffered from researcher bias.","This means the researcher's expectations may have affected how the results were collected or interpreted.","For example, Piaget studied his own children, and designed and interpreted the tasks himself.","This is a weakness because his findings may not be objective, so the theory is less scientific."],
   ["However, one strength is that the theory has had a big impact on education.","This means it has been used to change how children are taught in the real world.","For example, it informed the Plowden Report (1967), which encouraged discovery learning in primary schools.","This is a strength because it shows the theory is useful outside psychology. However, a counterargument is that Bennett (1976) found traditional teaching was more effective in maths, English and reading."]],
  ao:{AO1:["Schemas built through experience","Four stages in a fixed order, with ages","Object permanence (blanket) and egocentrism (three mountains)","Conservation, logical and then abstract thinking"],
      AO3:["TDEE: later research challenges it (Hughes 90%, naughty teddy)","TDEE: researcher bias (his own children)","TDEE: impact on education (Plowden), with a counterargument (Bennett)"]}},
 {id:"d2", t:"Development", kind:"theory", sc:"Ellie often says 'I'm just not a maths person'. When a question gets hard she stops trying, and she only cares about the grade she gets.",
  q:"Using Dweck's mindset theory, explain Ellie's behaviour and how her teacher could help. Evaluate the theory.",
  desc:"Carol Dweck proposed two mindsets. With a fixed mindset, you believe intelligence and abilities are set in your genes, so you are more likely to give up if you don't succeed. With a growth mindset, you believe intelligence and ability can increase with effort, and you see failure as an opportunity to learn. Praise should be for effort, not success or ability, to create a growth mindset. High self-efficacy also helps learning: knowing you have been capable in the past makes you less likely to give up.",
  apply:"Ellie has a fixed mindset: she believes maths ability can't change ('not a maths person'), gives up when work is hard, and focuses on her grade rather than learning. Her teacher could praise her effort rather than her ability, and teach her that the brain grows with practice, like a muscle.",
  tdee:[
   ["One strength of Dweck's theory is that there is supporting research.","This means studies have found evidence that mindsets can be changed and affect learning.","For example, Yeager et al. (2019) found that just one hour of growth mindset teaching raised the maths grades of low-achieving students.","This shows that teaching a growth mindset can improve results, increasing the credibility of the theory."],
   ["Another strength is that the theory can be applied in schools.","This means it can be used to improve learning in the real world.","For example, teachers can praise effort rather than ability, and teach students like Ellie that the brain grows with practice.","This is a strength because it is a cheap, simple way to improve students' motivation and grades."],
   ["However, one weakness of Dweck's theory is that it may be culturally biased.","This means it may only apply to the culture it was developed in.","For example, most mindset research has been carried out in individualist cultures such as the USA, where personal achievement is highly valued.","This is a weakness because the theory may not apply to students in collectivist cultures, so it cannot be generalised to everyone."]],
  ao:{AO1:["Fixed mindset: ability set in the genes; gives up","Growth mindset: ability grows with effort; failure is a chance to learn","Praise effort, not ability or success","Self-efficacy helps learning"],
      AO2:["Ellie shows a fixed mindset ('not a maths person')","She gives up and focuses on her grade","Teacher: praise effort, teach that the brain grows"],
      AO3:["TDEE: supporting research (Yeager 2019)","TDEE: applications to schools","TDEE: culturally biased (individualist cultures)"]}},
 {id:"d3", t:"Development", kind:"theory", q:"Discuss Willingham's learning theory. In your answer, include strengths and weaknesses.",
  desc:"Willingham's theory says learning should be based on scientific evidence from cognitive psychology and neuroscience, rather than learning styles: students don't learn better just because information is presented in their preferred way, so they should be taught in the style that suits the content. He said praise should be sincere and unexpected, so students are intrinsically motivated and work hard for themselves, not just for the praise. Learning is helped by developing delayed gratification and by planning for cued recall and retrieval practice, which build knowledge in long-term memory. He also said neuroscience (brain scans) can be used to discover learning difficulties early and plan support.",
  tdee:[
   ["One strength of Willingham's theory is that it is scientific.","This means it is based on objective research and evidence rather than opinion.","For example, his ideas come from cognitive psychology and neuroscience, and Willingham and Lloyd (2007) found different brain-wave patterns in people with dyslexia.","This is a strength because it is more reliable than ideas based on opinion, such as learning styles, enhancing the credibility of the theory."],
   ["Another strength is that the theory has practical applications in the classroom.","This means it can be used to improve learning in the real world.","For example, teachers can use retrieval practice in 'do now' activities, which focus on retaining information in long-term memory.","This is a strength because it makes the theory useful to teachers and students every day."],
   ["However, one weakness is that the theory neglects creativity in education.","This means it doesn't value creative, imaginative or physical learning.","For example, it focuses on traditional learning of knowledge, so its techniques won't work as well in settings that focus on physical skills or creative tasks.","This is a weakness because its applications are limited, and some may see it as outdated."]],
  ao:{AO1:["Learning should be based on cognitive psychology and neuroscience, not learning styles","Teach in the style that suits the content","Sincere, unexpected praise leads to intrinsic motivation","Delayed gratification, cued recall / retrieval practice, brain scans for learning difficulties"],
      AO3:["TDEE: scientific (Willingham and Lloyd 2007)","TDEE: practical applications (retrieval practice 'do now')","TDEE: neglects creativity (limited applications)"]}},
 {id:"r1", t:"RM", kind:"design", sc:"A teacher believes that students who revise with music playing remember less than students who revise in silence.",
  q:"Design an experiment to test this. Include a hypothesis, the IV and DV, an experimental design, a sampling method and at least one control. Justify your choices.",
  model:"Hypothesis: students who revise a list of 20 words in silence will recall more words than students who revise with music playing. The IV is whether students revise with music or in silence. The DV is the number of words correctly recalled out of 20 after a two-minute revision period.\n\nI would use an independent groups design, randomly allocating participants to the music or silence condition. This avoids order effects such as practice or boredom, which would happen if the same students did both conditions. Random allocation also helps spread out participant variables. For the sample, I would use a random sample, putting the names of all Year 10 students in a hat and drawing 30, because everyone in the target population has an equal chance of selection, making the sample more representative.\n\nControls: every participant gets the same word list, the same standardised instructions, the same room and the same time to revise and recall, and the music is played at the same volume. This makes it more likely that the IV caused any difference in recall. Ethically, I would gain informed consent, tell students they can withdraw at any time, keep results confidential and debrief them afterwards.",
  ao:{AO2:["Directional (or non-directional) hypothesis that is operationalised","IV: music vs silence; DV operationalised (words recalled out of 20)","Named design applied to the study and justified","Named sampling method applied and justified","At least one relevant control, e.g. same list, time, room, instructions, volume","Ethics applied, e.g. informed consent, right to withdraw, debrief"],
      AO3:["Justification links choices to validity/reliability (e.g. avoids order effects)","Recognises a limitation, e.g. participant variables in independent groups"]}},
 {id:"r2", t:"RM", kind:"other", q:"Describe what is meant by a laboratory experiment and evaluate the use of laboratory experiments in psychology. Refer to at least one study in your answer.",
  desc:"A laboratory experiment is carried out in an unnatural, controlled environment, where the researcher manipulates the independent variable (IV) and measures its effect on the dependent variable (DV), while controlling extraneous variables. Participants usually know they are taking part. Murdock's serial position study is an example: psychology students heard lists of words, and the position of each word (IV) was compared with recall (DV). Bruner and Minturn's study of expectation and Asch's conformity study were also laboratory experiments.",
  tdee:[
   ["One strength of laboratory experiments is that extraneous variables can be controlled.","This means variables other than the IV that might affect the DV are kept the same.","For example, in Murdock's study random words were used and every word was presented in the same way.","This is a strength because we can be more confident the IV caused the change in the DV, and standardised procedures mean the study can be replicated to check reliability."],
   ["One weakness of laboratory experiments is that they often lack mundane realism.","This means the tasks are not like everyday life.","For example, recalling lists of random words (Murdock) or judging line lengths (Asch) is not how we use memory or behave in real life.","This is a weakness because the results may not generalise to real-world settings, lowering external validity."],
   ["Another weakness is that participants may show demand characteristics.","This means participants guess the aim of the study and change their behaviour.","For example, in Bruner and Minturn's study the aim is fairly obvious if participants realise the '13' is an ambiguous figure.","This is a weakness because participants' behaviour may not be natural, so the results may lack validity."]],
  ao:{AO1:["Definition: controlled, artificial setting; the IV is manipulated and the DV measured","Reference to a lab study (e.g. Murdock, Asch, Bruner and Minturn)"],
      AO3:["TDEE: control of extraneous variables, so cause and effect + replicable","TDEE: lacks mundane realism, so low external validity","TDEE: demand characteristics"]}},
 {id:"r3", t:"RM", kind:"other", sc:"A researcher wants to find out whether students are more likely to cheat on a test if the teacher leaves the room. Students would not be told the real aim of the study.",
  q:"Explain the ethical issues the researcher would face and how they could deal with them. Evaluate the use of deception in this study.",
  desc:"Psychologists must follow the BPS ethical guidelines, which include informed consent, deception, the right to withdraw, protection from harm, confidentiality and debriefing.",
  apply:"Students would not be told the real aim, so this is deception and they cannot give fully informed consent. Being caught cheating could cause embarrassment, so there is a risk of psychological harm, and results about who cheated are sensitive, so confidentiality matters. The researcher could debrief students straight after the test, telling them the true aim and checking they are not distressed; give them the right to withdraw their results; not record or publish names; make sure no one is punished; and gain consent from parents in advance with a general description of the study.",
  tdee:[
   ["One strength of using deception is that it reduces demand characteristics.","This means participants are less likely to guess the aim and change their behaviour.","For example, if students knew the study was about cheating, they would probably not cheat, just as Piliavin's subway passengers behaved naturally because they didn't know they were being studied.","This is a strength because the results are more likely to reflect real behaviour, increasing validity."],
   ["One weakness is that deception can cause psychological harm.","This means participants may feel distressed, embarrassed or anxious because of the study.","For example, students might feel ashamed when they find out they were observed cheating.","This is a weakness because it breaks the BPS guideline of protection from harm, so the researcher must balance valid results against students' wellbeing, for example with a full debrief and the right to withdraw their data."]],
  ao:{AO1:["Names relevant BPS ethical guidelines","Explains what they mean"],
      AO2:["Applies deception and lack of informed consent","Applies harm (embarrassment) and confidentiality","Ways to deal with them: debrief, withdraw data, anonymity, parental consent"],
      AO3:["TDEE: deception reduces demand characteristics (validity)","TDEE: deception can cause psychological harm (balance)"]}},
 // ---------- SOCIAL INFLUENCE ----------
 {id:"s1", t:"Social influence", kind:"study", q:"Describe and evaluate Milgram's study of obedience.",
  desc:"Milgram aimed to investigate whether ordinary people would obey an unjust order from an authority figure to harm an innocent person. 40 American men aged 20–50, recruited through newspaper adverts, were told at Yale University that the study was about punishment and learning. In a rigged draw, the participant was always the 'teacher' and had to give electric shocks from 15V to 450V to the 'learner', a confederate called Mr Wallace, for every wrong answer. All participants went to 300V and 65% went to the full 450V, many showing signs of stress. Milgram concluded that obedience is due to the situation, such as a legitimate authority figure, rather than personality.",
  tdee:[
   ["One strength of the study is that it used standardised procedures.","This means every participant experienced the same thing.","For example, every participant had the same rigged draw, the same learner and the same verbal prods from the experimenter.","This is a strength because the study can be replicated to check the results are reliable."],
   ["One weakness is that the study broke ethical guidelines.","This means participants were not treated in line with the BPS guidelines.","For example, participants were deceived (it wasn't about memory and the shocks weren't real), suffered psychological harm such as sweating, trembling and even seizures, and the prods made it hard to withdraw.","This is a weakness because participants could have been left distressed, so the study would not be allowed today."],
   ["Another weakness is that the study lacks generalisability.","This means the results may not apply to the wider target population.","For example, the sample was only 40 American men who had volunteered.","This is a weakness because there is gender bias, so we can't be sure women, or people from other cultures, would obey in the same way."]],
  ao:{AO1:["Aim: obedience to an unjust order from an authority figure","Sample: 40 American men aged 20–50, volunteers, Yale","Procedure: rigged draw, learner Mr Wallace, shocks 15–450V","Results: 100% to 300V, 65% to 450V; conclusion: situational"],
      AO3:["TDEE: standardised procedures, so replicable/reliable","TDEE: broke ethical guidelines (deception, harm, withdrawal)","TDEE: lacks generalisability (gender bias)"]}},
 {id:"s2", t:"Social influence", kind:"study", sc:"A man collapses on a crowded high street. Dozens of people walk past without helping. Later the same day, on a quiet road, a single passer-by stops immediately to help a woman who has fallen.",
  q:"Using your knowledge of bystander behaviour, explain why help was given in one situation but not the other. Evaluate Piliavin's study of bystander behaviour.",
  desc:"Bystander behaviour is affected by social factors such as the presence of others and the cost of helping, and by dispositional factors such as similarity to the victim and expertise. Diffusion of responsibility means the more people present, the less likely any one person is to help, because responsibility is shared. Piliavin carried out a field experiment on the New York subway, where a victim carrying a cane or a victim who appeared drunk collapsed. The cane victim was helped 95% of the time and the drunk victim 50%, and there was no diffusion of responsibility on the busy train.",
  apply:"On the crowded high street, each passer-by may assume someone else will help, so responsibility is diffused and no one acts. On the quiet road there is only one bystander, so they feel fully responsible and help straight away.",
  tdee:[
   ["One strength of Piliavin's study is that it has high ecological validity.","This means the findings reflect behaviour in real-life settings.","For example, it was a field experiment on a real subway train, and passengers didn't know they were being studied.","This is a strength because passengers behaved naturally, so the results are likely to show how people really respond in emergencies."],
   ["One weakness is that the study broke ethical guidelines.","This means participants were not protected in the way the BPS guidelines require.","For example, passengers gave no informed consent, were not debriefed, and may have been distressed by seeing someone collapse.","This is a weakness because participants could have been upset by the study without ever knowing it wasn't real."],
   ["Another weakness is that the study may lack temporal validity.","This means the results may not apply to the present day.","For example, it was carried out in 1969, and attitudes to strangers and drunkenness may have changed.","This is a weakness because people today may not help in the same way, so the findings may be out of date."]],
  ao:{AO1:["Diffusion of responsibility / presence of others","Cost of helping (and/or dispositional factors)","Piliavin: subway field experiment, cane vs drunk victim","Findings: cane 95%, drunk 50%, no diffusion on the busy train"],
      AO2:["Crowd on the high street: diffused responsibility, so no help","Single bystander on the quiet road feels fully responsible, so helps"],
      AO3:["TDEE: high ecological validity (field experiment)","TDEE: broke ethical guidelines (no consent or debrief)","TDEE: lacks temporal validity (1969)"]}},
 {id:"s3", t:"Social influence", kind:"study", q:"Describe and evaluate Asch's study of conformity, including what he found about factors affecting conformity.",
  desc:"Asch aimed to see whether people would conform to a majority giving an obviously wrong answer. American male college students sat with 7–8 confederates and each said aloud which of three comparison lines matched a stimulus line; on 12 of the 18 trials the confederates all gave the same wrong answer. The average conformity rate was 36.8%, 75% conformed at least once, and conformity rose from 13.6% with 2 confederates to 31.8% with 3, with little change after that. Conformity dropped when answers were written down (anonymity) and rose when the task was harder. Asch concluded that people conform to group pressure even when the majority is clearly wrong.",
  tdee:[
   ["One strength of Asch's study is that it used standardised procedures.","This means every participant experienced the same thing.","For example, all participants saw the same lines, and the confederates gave the same wrong answers on the same 12 critical trials.","This is a strength because the study can be replicated to check the results are reliable."],
   ["One weakness is that the study lacks mundane realism.","This means the task is not like everyday life.","For example, judging the length of lines in a lab is not like the situations where people feel pressure to conform in real life.","This is a weakness because the results may not show how people conform in everyday situations, lowering validity."],
   ["Another weakness is that the study lacks generalisability.","This means the results may not apply to the wider target population.","For example, only American male college students were tested, in the 1950s.","This is a weakness because there is gender and cultural bias, and people today may be less conformist, so the results may not apply to everyone."]],
  ao:{AO1:["Aim and procedure: line judgements with confederates, 12 critical trials","Results: 36.8% average, 75% at least once","Group size: 13.6% with 2, 31.8% with 3","Anonymity lowers and task difficulty raises conformity"],
      AO3:["TDEE: standardised procedures, so reliable","TDEE: lacks mundane realism (line task)","TDEE: lacks generalisability (male, American, 1950s)"]}},
 // ---------- LANGUAGE, THOUGHT & COMMUNICATION ----------
 {id:"l1", t:"Language, thought & communication", kind:"theory", q:"Describe and evaluate the Sapir-Whorf hypothesis.",
  desc:"The Sapir-Whorf hypothesis says language comes before thought: the language we speak shapes how we think. The strong version says language determines thought, so if you don't have the words for a concept you can't think about it. The weak version says language influences thought, so you are less likely to think about things you don't have the vocabulary for. Whorf studied the Hopi, who don't have the same words for time passing, and concluded they didn't think about time in the same way, and Boas claimed the Inuit have many words for snow.",
  tdee:[
   ["One strength of the Sapir-Whorf hypothesis is that there is research to support it.","This means studies have found that language affects thinking.","For example, Brown and Lenneberg (1954) found the Zuni, who have one word for both orange and yellow, could not tell these shades apart as well as English speakers.","This suggests that the words we have affect how we perceive and remember colours, supporting the weak version."],
   ["One weakness is that evidence from Boas may have exaggerated the differences between languages.","This means some of the key evidence for the hypothesis may not be accurate.","For example, Pullum (1989) argued the Inuit really have only two root words for snow: 'qanik' (snow in the air) and 'aput' (snow on the ground).","This suggests the evidence for the hypothesis is weaker than it seemed, reducing its credibility."],
   ["Another weakness is that Piaget's theory offers an alternative explanation.","This means the same evidence can be explained in a different way.","For example, Piaget would argue the Inuit experience a lot of snow, so their thinking about snow develops first and the words follow.","This suggests thought could come before language, so the Sapir-Whorf hypothesis may have the order the wrong way round."]],
  ao:{AO1:["Language comes before and shapes thought","Strong version: language determines thought","Weak version: language influences thought","Hopi (time) and/or Boas' Inuit snow words"],
      AO3:["TDEE: supporting research (Brown and Lenneberg, Zuni)","TDEE: exaggerated evidence (Pullum: two root words)","TDEE: alternative explanation (Piaget: thought first)"]}},
 {id:"l2", t:"Language, thought & communication", kind:"study", q:"Describe and evaluate von Frisch's study of bee communication.",
  desc:"Von Frisch aimed to investigate how bees communicate the location of a food source to each other. In a controlled naturalistic study, with over 1,000 observations over 20 years, he placed glass containers of sugar water at different distances from a glass hive and marked visiting bees with tiny spots of paint so he could identify them. When food was close (under about 100 m), the bees did a round dance; when it was further away (about 100–350 m), they did a figure-of-eight waggle dance, where the slower the dance, the further the food, and the central run showed its direction. He concluded that bees use different movements to communicate the distance and direction of food.",
  tdee:[
   ["One strength of von Frisch's study is that it made an important contribution to science.","This means it changed what scientists knew and influenced later research.","For example, it was one of the first studies of animal communication, showing that bees can communicate the distance and direction of food, and von Frisch won a Nobel Prize.","This is a strength because it encouraged other researchers to study animal communication."],
   ["One weakness is that the study lacks ecological validity.","This means the findings may not apply to bees' behaviour in their natural environment.","For example, von Frisch used sugar water in glass containers and a clear glass hive, which are not realistic.","This is a weakness because the bees may not communicate in the same way with real food sources in the wild."],
   ["Another weakness is that the study may give an incomplete explanation of how bees communicate.","This means it may miss out important parts of their communication.","For example, later research found that bees also make buzzing sounds and vibrations during the dance, which help other bees understand it.","This suggests that movement alone does not fully explain bee communication, limiting the validity of the conclusions."]],
  ao:{AO1:["Aim: how bees communicate the location of food","Method: over 1,000 observations, 20 years; sugar water at different distances; paint marks; glass hive","Results: round dance under about 100 m; waggle dance about 100–350 m (speed = distance, central run = direction)","Conclusion: movements communicate distance and direction"],
      AO3:["TDEE: contribution to science (first study, Nobel Prize)","TDEE: lacks ecological validity (sugar water, glass hive)","TDEE: incomplete explanation (buzzing sounds and vibrations)"]}},
 {id:"l3", t:"Language, thought & communication", kind:"theory", sc:"In a job interview, Marcus avoids eye contact, sits with his arms folded and legs crossed, and pulls his chair very close to the interviewer.",
  q:"Using your knowledge of non-verbal communication, explain why the interview might not go well for Marcus. Evaluate research into non-verbal communication.",
  desc:"Non-verbal communication is sending and receiving messages without words, for example through eye contact, body language and personal space. Eye contact regulates the flow of conversation, signals attraction and expresses emotion; when participants wore dark glasses, conversations had more pauses and interruptions. A closed posture, with arms folded or legs crossed, may show disagreement or feeling closed off. Personal space is the distance we like to keep from others, and it is affected by culture, gender and status; Zahn found people approach higher-status colleagues less closely.",
  apply:"By avoiding eye contact, Marcus makes the conversation harder to regulate, so there may be awkward pauses and he may seem uninterested. His closed posture may make him look defensive. Sitting very close to a higher-status interviewer invades their personal space and may make them uncomfortable.",
  tdee:[
   ["One strength of research into non-verbal communication is that it often has high validity.","This means it measures natural behaviour.","For example, in Fisher's touch study students didn't know they were being studied when the librarian touched their hands.","This is a strength because participants behaved naturally. However, a counterargument is that this means they couldn't give informed consent."],
   ["Another strength is that the research has practical applications.","This means it can be used to improve everyday life.","For example, people can be trained to use open posture and appropriate eye contact in job interviews.","This is a strength because it could help people like Marcus perform better in interviews."],
   ["One weakness is that the findings lack generalisability across cultures.","This means they may not apply to everyone.","For example, Collett found English men who used Arab-style personal space were liked more by Arab men.","This is a weakness because rules about eye contact and personal space differ between cultures, so findings can't be applied to everyone."]],
  ao:{AO1:["Definition of NVC","Functions of eye contact (dark glasses study)","Closed vs open posture","Personal space and its factors (culture, gender, status)"],
      AO2:["Avoiding eye contact: poorly regulated conversation / seems uninterested","Folded arms: appears closed off","Too close to a higher-status interviewer invades personal space"],
      AO3:["TDEE: high validity (Fisher), with a counterargument about consent","TDEE: practical application (interview training)","TDEE: lacks generalisability across cultures (Collett)"]}},
 // ---------- BRAIN & NEUROPSYCHOLOGY ----------
 {id:"l4", t:"Language, thought & communication", kind:"study", q:"Describe Yuki's study into emoticons. Evaluate the research method used.",
  desc:"Yuki aimed to investigate whether there are cultural differences in how people interpret emotions from facial expressions, focusing on the eyes and mouth. In a lab experiment, 95 Japanese and 118 American students were shown emoticons with different combinations of eyes and mouths (happy, neutral or sad) and rated how happy each looked on a scale of 1 (very sad) to 9 (very happy). Japanese students gave happier ratings to faces with happy eyes, even if the mouth was sad, whereas Americans gave happier ratings when the mouth was happy, even if the eyes were sad. Yuki concluded there are cultural differences in how people read facial expressions, which must be learned, perhaps because American people are brought up to express emotions more openly than Japanese people.",
  tdee:[
   ["One weakness of lab experiments is that they lack mundane realism.","This means the task used does not reflect tasks in everyday life.","For example, Yuki used emoticons instead of real human faces.","This is a weakness because lab experiments often give a simplified understanding of psychological concepts, making it difficult to apply them to the real world."],
   ["However, one strength of lab experiments is that they have high control over extraneous variables.","This means all conditions are kept the same for participants, except for the independent variable.","For example, Yuki made sure all participants were shown the same emoticons under the same conditions.","This is a strength because it increases internal validity, so researchers can be more confident about cause and effect."],
   ["A final weakness of lab experiments is that they can lead to demand characteristics.","This means participants may guess the aim of the study and change their behaviour.","For example, in Yuki's study participants rated emoticons in a controlled setting and may have answered in the way they thought was expected.","This is a weakness because it lowers internal validity, making it harder to know if we measured what we intended to."]],
  ao:{AO1:["Aim: cultural differences in reading eyes vs mouths","Method: lab experiment; 95 Japanese and 118 American students rated emoticons from 1 to 9","Results: Japanese focused on the eyes, Americans on the mouth","Conclusion: reading facial expressions is learned (culture)"],
      AO3:["TDEE: lab experiments lack mundane realism (emoticons)","TDEE: high control of extraneous variables, so internal validity","TDEE: demand characteristics"]}},
 {id:"b1", t:"Brain & neuropsychology", kind:"study", q:"Describe and evaluate Penfield's study of the interpretive cortex.",
  desc:"Penfield aimed to investigate what happens when different areas of the brain are stimulated. During brain surgery on over 1,000 patients with epilepsy, he stimulated areas of the brain with a mild electrical current while the patients were awake, so they could report what they experienced. Stimulating the temporal lobe caused about 8% of patients to relive vivid memories, sounds or feelings. He concluded that there is an interpretive cortex in the temporal lobe, where memories or our interpretations of them are stored, which is evidence for localisation of function.",
  tdee:[
   ["One weakness of Penfield's study is that it lacks generalisability.","This means the results may not apply to the wider population.","For example, all the participants had epilepsy, and only about 8% of them had interpretive cortex responses.","This is a weakness because their brains may not be typical, so we can't be sure everyone's brain works this way."],
   ["Another weakness is that the study lacks ecological validity.","This means the situation is not like how the brain works in everyday life.","For example, electrical stimulation during surgery is not how the brain is normally stimulated.","This is a weakness because the memories produced may not reflect how we normally recall memories."],
   ["However, one strength is that the research has practical applications.","This means it has been used in the real world.","For example, it led to the Montreal Procedure, which is still used to treat epilepsy.","This is a strength because it has improved the lives of people with epilepsy."]],
  ao:{AO1:["Aim: what happens when brain areas are stimulated","Method: 1,000+ epilepsy patients, awake, mild electrical stimulation","Results: temporal lobe stimulation triggered vivid memories (about 8%)","Conclusion: interpretive cortex / localisation of function"],
      AO3:["TDEE: lacks generalisability (epilepsy, only about 8%)","TDEE: lacks ecological validity (artificial stimulation)","TDEE: practical application (Montreal Procedure)"]}},
 {id:"b2", t:"Brain & neuropsychology", kind:"theory", sc:"Leah is walking home in the dark when she hears footsteps behind her. Her heart pounds, her breathing speeds up and she starts to run. Only then does she realise she is terrified.",
  q:"Using your knowledge of the fight or flight response and the James-Lange theory of emotion, explain Leah's reaction. Evaluate the James-Lange theory.",
  desc:"The fight or flight response is an automatic physical reaction to a threat that prepares the body to fight or run away. It is controlled by the sympathetic nervous system, and adrenaline is released from the adrenal glands, increasing heart rate and breathing, dilating the pupils and slowing digestion. The James-Lange theory says physical arousal comes first and we then interpret it as an emotion. The stages are: event, physiological arousal, interpretation of the arousal, then emotion.",
  apply:"The footsteps are the event. Leah's sympathetic nervous system triggers fight or flight: adrenaline makes her heart pound and her breathing speed up, and she runs. According to James-Lange, she only feels terrified after interpreting her body's arousal, which matches her realising she is scared once she is already running.",
  tdee:[
   ["One weakness of the James-Lange theory is that there is contradictory evidence.","This means research has found results that go against the theory.","For example, people with paralysis and no bodily sensation still feel emotions.","This is a weakness because emotion can't depend on noticing physical arousal first, so the theory can't be completely right."],
   ["Another weakness is that there is an alternative theory.","This means a different theory may explain emotion better.","For example, Cannon argued that emotion and physical arousal happen at the same time.","This is a weakness because the order James-Lange describes may be wrong."],
   ["A further weakness is that the theory is reductionist.","This means it explains emotion using only physical arousal.","For example, Schachter and Singer's two-factor theory adds a cognitive element: we use social cues to decide what our arousal means.","This is a weakness because James-Lange ignores the role of thinking, so it is an incomplete explanation of emotion."]],
  ao:{AO1:["Sympathetic nervous system and adrenaline (adrenal glands)","Physiological changes (heart rate, breathing, pupils, digestion)","James-Lange: arousal comes before emotion","Stages: event, arousal, interpretation, emotion"],
      AO2:["Footsteps = event; pounding heart and running = arousal","Leah realises she is terrified after the arousal, as predicted"],
      AO3:["TDEE: contradictory evidence (paralysis)","TDEE: alternative theory (Cannon-Bard)","TDEE: reductionist (Schachter and Singer's cognitive element)"]}},
 {id:"b3", t:"Brain & neuropsychology", kind:"theory", q:"Describe and evaluate Hebb's theory of learning and neuronal growth.",
  desc:"Hebb's theory says the brain changes as we learn, because connections between neurons get stronger the more they are used. When we learn something, a memory trace called an engram is left in the brain, and it is strengthened through repeated practice and rehearsal. When one neuron repeatedly excites another, the synaptic knob grows (neuronal growth), and groups of neurons that fire together form cell assemblies, so skills become more efficient. This means the brain is not fixed and can change with learning (plasticity).",
  tdee:[
   ["One strength of Hebb's theory is that it has practical applications in education.","This means it can be used to improve learning in the real world.","For example, it suggests practice and revision strengthen learning, so students should revise regularly.","This is a strength because it gives students and teachers a clear, scientific reason to use repeated practice."],
   ["Another strength is that it has practical applications in rehabilitation.","This means it can help people recover after brain damage.","For example, if the brain can form new connections, people may regain skills after damage through practice.","This is a strength because it gives hope and a method for people recovering from brain injuries."],
   ["However, one weakness is that the theory is reductionist.","This means it explains learning using only its most basic parts.","For example, it explains all learning in terms of neuron connections and ignores motivation, environment and emotion.","This is a weakness because these factors also affect how well we learn, so the theory is an incomplete explanation."]],
  ao:{AO1:["Connections between neurons strengthen with use","Engram strengthened by repeated practice","Neuronal growth / cell assemblies","Plasticity: the brain is not fixed"],
      AO3:["TDEE: practical application (education / revision)","TDEE: practical application (rehabilitation)","TDEE: reductionist (ignores motivation, environment, emotion)"]}},
 // ---------- PSYCHOLOGICAL PROBLEMS ----------
 {id:"x1", t:"Psychological problems", kind:"theory", q:"Describe and evaluate the biological explanation of depression and the use of antidepressants to treat it.",
  desc:"The biological explanation says depression is caused by low levels of the neurotransmitter serotonin, which regulates mood, sleep, appetite and aggression. Low serotonin may be genetic (we inherit a poor ability to produce it) or environmental (not enough tryptophan, which the body needs to make serotonin, in the diet). Antidepressants such as SSRIs (selective serotonin reuptake inhibitors) block the reuptake of serotonin into the presynaptic neuron. This means more serotonin stays in the synapse and is passed on, improving mood, sleep and energy.",
  tdee:[
   ["One strength of SSRIs is that they are a practical treatment.","This means they are easy to use in the real world.","For example, they are cheap, quick and easy to take compared with therapy such as CBT.","This is a strength because many people can get treatment quickly without waiting for therapy."],
   ["One weakness of SSRIs is that they have side effects.","This means they cause unwanted effects as well as treating depression.","For example, side effects include insomnia, weight change, nausea, anxiety and sometimes suicidal thoughts.","This is a weakness because people may stop taking them, so the treatment may not work."],
   ["Another weakness is that the biological explanation is reductionist.","This means it explains depression using only brain chemistry.","For example, it ignores the negative thinking described by the cognitive explanation, and SSRIs raise serotonin straight away but take weeks to work, suggesting other factors (or a placebo effect) are involved.","This is a weakness because depression may have psychological causes too, so treating only brain chemistry may not be enough."]],
  ao:{AO1:["Low serotonin causes depression","Genetic and/or environmental (tryptophan) causes","SSRIs block reuptake","More serotonin stays in the synapse and improves mood"],
      AO3:["TDEE: practical (cheap, quick, easy)","TDEE: side effects","TDEE: reductionist (ignores cognitive factors / delay suggests placebo)"]}},
 {id:"x2", t:"Psychological problems", kind:"theory", sc:"After failing one test, Sam says: 'I'm useless at everything, nobody likes me, and I'll never pass anything.' He has felt low for several weeks.",
  q:"Using the cognitive explanation of depression, explain Sam's thinking. Evaluate CBT as a treatment for depression.",
  desc:"The cognitive explanation says depression is caused by negative, irrational thinking. A negative self-schema is a set of negative beliefs about yourself, often developed through negative experiences in childhood, which is used to interpret new information. Beck's negative triad is negative views about the self, the world and the future. CBT (cognitive behavioural therapy) aims to challenge and change irrational thoughts and behaviours, using disputing (the therapist asks 'Where is the evidence?') and thought diaries recording unpleasant emotions, the thoughts behind them and a rational response.",
  apply:"Sam shows Beck's negative triad: negative about himself ('I'm useless'), the world ('nobody likes me') and the future ('I'll never pass'). He also makes a global attribution, believing one failure applies to every area of his life, which fits a negative self-schema.",
  tdee:[
   ["One strength of CBT is that it is a long-term treatment.","This means its benefits can last after treatment has ended.","For example, clients learn skills such as disputing and thought diaries that they can use again whenever symptoms return.","This is a strength because Sam could use these skills to challenge negative thoughts in the future, reducing the chance of relapse."],
   ["Another strength is that CBT is holistic.","This means it treats the whole person rather than just one part.","For example, it targets both thoughts and behaviour, rather than only brain chemistry like antidepressants.","This is a strength because it tackles the negative thinking that the cognitive explanation says causes depression."],
   ["However, one weakness is that CBT takes time and effort.","This means clients must work hard over many sessions for it to succeed.","For example, keeping thought diaries and challenging thoughts is demanding, especially for someone with low energy and motivation.","This is a weakness because some clients may drop out before it helps them."]],
  ao:{AO1:["Negative, irrational thinking causes depression","Negative self-schema and Beck's negative triad","CBT described: disputing / thought diary"],
      AO2:["Sam shows the negative triad: self, world and future","Sam makes a global attribution from one failed test"],
      AO3:["TDEE: long-term (skills)","TDEE: holistic","TDEE: time and effort (possible drop-out)"]}},
 {id:"x3", t:"Psychological problems", kind:"theory", sc:"Jake's father and uncle both had alcohol problems. Jake started drinking at 15 with a group of older friends, and now at 19 he cannot stop, even though it is affecting his health.",
  q:"Using your knowledge of explanations of addiction, explain Jake's addiction. Evaluate the genetic explanation of addiction.",
  desc:"Addiction is being unable to stop or control using a substance or doing a behaviour. A genetic vulnerability is a biological predisposition, inherited in the genes, to develop a condition. Kaij studied 174 pairs of male twins in Sweden, where at least one twin was registered with the temperance board; MZ twins had a higher concordance rate than DZ twins, but not 100%. Peer influence is the effect that people similar to us have on our behaviour, and it is most powerful in adolescence. The diathesis-stress model says a disorder develops when a genetic vulnerability (diathesis) is triggered by stressful experiences, such as peer pressure.",
  apply:"Jake's father and uncle had alcohol problems, suggesting he has inherited a genetic vulnerability. He started drinking at 15 with older friends, so peer influence during adolescence acted as the trigger. This fits the diathesis-stress model.",
  tdee:[
   ["One strength of the genetic explanation is that it has supporting research.","This means studies have found evidence that addiction runs in families because of genes.","For example, Kendler et al. (1997) found MZ twins had a 48% chance and DZ twins a 33% chance of a co-twin also being addicted to alcohol.","This is a strength because the higher MZ concordance suggests genes play a role, increasing the validity of the explanation."],

   ["Another weakness is that the genetic explanation is reductionist.","This means it explains addiction using only genes.","For example, MZ concordance is not 100%, so environmental factors such as peer influence must also play a role.","This is a weakness because it ignores the environment; the diathesis-stress model, which combines genes and environment, is a more complete explanation."]],
  ao:{AO1:["Genetic vulnerability; Kaij's twin study (174 male twin pairs, Sweden)","MZ concordance higher than DZ but not 100%","Peer influence (strongest in adolescence)","Diathesis-stress model"],
      AO2:["Father/uncle with alcohol problems suggests genetic vulnerability","Drinking at 15 with older friends shows peer influence as the trigger","Combines both through diathesis-stress"],

const SKILLS = [{"n":1,"title":"Interpreting results","icon":"📊","tag":"Read the table, quote the numbers, say what it suggests.","steps":[["State","the obvious difference or similarity in the table."],["Figures","Quote the numbers from the table (both conditions)."],["Suggests","Say what this suggests about behaviour: 'This suggests that…'"],["Theory (extension)","Link it to a theory, e.g. which of Piaget's stages it supports."]],"watch":"No figures, no top marks. 'Group A did better' only gets 1 mark: 'Group A recalled 14.2 facts on average compared with 9.6' gets both.","items":[{"id":"v1-1","stim":[{"p":"A psychologist tested whether caffeine affects reaction time. 24 adults were randomly split into two groups. One group drank a coffee, the other drank decaf. Twenty minutes later each person pressed a button as soon as a light came on. Reaction time was measured in milliseconds (ms)."},{"table":[["","Caffeine","Decaf"],["Mean reaction time (ms)","245","290"],["Range","40","95"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the decaf group had a higher mean reaction time (ms) (290) than the caffeine group (245), so caffeine may make people react faster (a lower time is faster).","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: the range was bigger in the decaf group (95) than the caffeine group (40), so reaction times varied more without caffeine; caffeine made people respond more consistently.","1 mark: only states that the decaf range is bigger."]}]}]},{"id":"v1-2","stim":[{"p":"A researcher tested context-dependent memory. 30 students learned 25 words in a classroom. Half recalled them in the same classroom; half recalled them in the sports hall."},{"table":[["","Same room","Different room"],["Mean number of words recalled (out of 25)","15.3","11.1"],["Range","5","9"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the same room group had a higher mean number of words recalled (out of 25) (15.3) than the different room group (11.1), so recalling in the same place as learning may help recall (context acts as a cue).","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: the range was bigger in the different room group (9) than the same room group (5), so recall was more varied in a different room, so the change of context may affect some people more than others.","1 mark: only states that the different room range is bigger."]}]}]},{"id":"v1-3","stim":[{"p":"A psychologist investigated whether sleep affects memory. 20 volunteers learned a list of 20 words. Ten then slept for 8 hours; ten slept for 4 hours. The next morning they recalled the words."},{"table":[["","8 hours","4 hours"],["Mean words recalled (out of 20)","17.5","12"],["Range","4","11"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the 8 hours group had a higher mean words recalled (out of 20) (17.5) than the 4 hours group (12), so more sleep may lead to better recall.","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: the range was bigger in the 4 hours group (11) than the 8 hours group (4), so recall was much more spread out after 4 hours' sleep, so lack of sleep may affect some people far more than others.","1 mark: only states that the 4 hours range is bigger."]}]}]},{"id":"v1-4","stim":[{"p":"A researcher investigated whether eye contact affects conversation. Pairs of strangers chatted for 5 minutes. In one condition one person wore dark glasses; in the other, neither did. The researcher counted the pauses in each conversation."},{"table":[["","Dark glasses","No glasses"],["Mean number of pauses","9.2","4.1"],["Range","7","3"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the dark glasses group had a higher mean number of pauses (9.2) than the no glasses group (4.1), so being unable to see someone's eyes may make conversation less smooth, because eye contact helps regulate turn-taking.","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: the range was bigger in the dark glasses group (7) than the no glasses group (3), so the number of pauses varied more when dark glasses were worn.","1 mark: only states that the dark glasses range is bigger."]}]}]},{"id":"v1-5","stim":[{"p":"A psychologist tested whether hunger affects perception. Hungry participants (no food for 15 hours) and participants who had just eaten rated how bright pictures of food looked, from 1 (very dull) to 10 (very bright)."},{"table":[["","Hungry","Not hungry"],["Mean brightness rating","7.4","5.1"],["Range","4","4"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the hungry group had a higher mean brightness rating (7.4) than the not hungry group (5.1), so hunger (motivation) may make food seem brighter, so we notice things we need.","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: both groups had the same range (4), so the spread of ratings was similar; the difference is in the average, not the variation.","1 mark: only states that the ranges are the same."]}]}]},{"id":"v1-6","stim":[{"p":"A researcher compared CBT with a waiting list for people with depression. Depression was measured with a questionnaire (higher score = more depressed) after 12 weeks."},{"table":[["","Cbt","Waiting list"],["Mean depression score after 12 weeks","14","25"],["Range","18","9"]]}],"parts":[{"no":"a","q":"What conclusion can be drawn from the means in the table?","m":2,"ms":[{"h":"","b":["2 marks: the waiting list group had a higher mean depression score after 12 weeks (25) than the CBT group (14), so CBT may reduce depression more than waiting for treatment.","1 mark: a correct conclusion without figures, or figures with no conclusion."]}]},{"no":"b","q":"What conclusion can be drawn from the ranges in the table?","m":2,"ms":[{"h":"","b":["2 marks: the range was bigger in the CBT group (18) than the waiting list group (9), so scores varied more after CBT, so CBT may work very well for some people but less well for others.","1 mark: only states that the CBT range is bigger."]}]}]},{"id":"v1-7","stim":[{"p":"A researcher tested at what age children can conserve. 15 children of each age watched water poured from a short wide glass into a tall thin glass and were asked if there was the same amount."},{"table":[["Age","5","6","7","8"],["Said 'the same' (conserved)","3","5","10","13"],["Said there was more in the tall glass","12","10","5","2"]]}],"parts":[{"no":"a","q":"Calculate the percentage of 7-year-olds who conserved. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 67%.","2 marks: 66.6667 (not rounded to 2 s.f.) or rounded wrongly.","1 mark: workings only – 10 ÷ 15 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. older children were more likely to conserve – 3 of 15 5-year-olds compared with 13 of 15 8-year-olds – with the biggest jump between 6 and 7, which fits Piaget's claim that conservation develops at about 7 (concrete operational stage).","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-8","stim":[{"p":"A psychologist praised children after a puzzle. 30 were praised for effort ('You worked really hard') and 30 for intelligence ('You're so clever'). Each child then chose an easy or a harder puzzle."},{"table":[["","Praised for effort","Praised for intelligence"],["Chose the harder puzzle","24","10"],["Chose the easy puzzle","6","20"]]}],"parts":[{"no":"a","q":"Calculate the percentage of children praised for intelligence who chose the harder puzzle. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 33%.","2 marks: 33.3333 (not rounded to 2 s.f.) or rounded wrongly.","1 mark: workings only – 10 ÷ 30 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. praising effort made children more likely to take on a challenge – 24 of 30 chose the harder puzzle compared with 10 of 30 praised for intelligence – which supports Dweck's view that praising effort encourages a growth mindset.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-9","stim":[{"p":"A researcher staged an emergency in a waiting room. A participant was either alone or with four other people (confederates who did nothing) when a loud crash and a cry for help came from next door."},{"table":[["","Alone","With 4 others"],["Went to help","17","6"],["Did not help","3","14"],["Total","20","20"]]}],"parts":[{"no":"a","q":"Calculate the percentage of participants who went to help when they were with 4 others. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 6 ÷ 20 × 100 = 30%.","2 marks: 30% with no workings.","1 mark: workings only – 6 ÷ 20 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. people were far less likely to help when others were present – 17 of 20 helped alone compared with 6 of 20 with others – suggesting diffusion of responsibility: responsibility is shared, so each person feels less need to act.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-10","stim":[{"p":"A psychologist repeated a conformity study. Participants judged line lengths with groups of confederates of different sizes who all gave the same wrong answer."},{"table":[["Number of confederates","1","2","3","4","8"],["Participants who conformed at least once (out of 30)","1","4","9","10","10"]]}],"parts":[{"no":"a","q":"Calculate the percentage of participants who conformed at least once with 3 confederates. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 9 ÷ 30 × 100 = 30%.","2 marks: 30% with no workings.","1 mark: workings only – 9 ÷ 30 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. conformity increased with group size up to 3 confederates (1 of 30 with one, 9 of 30 with three) but barely changed after that (10 of 30 with four and eight), suggesting a majority of about 3 is enough to create group pressure.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-11","stim":[{"p":"A researcher read 15-word lists to 50 participants and recorded how many recalled each word, grouped by position in the list."},{"table":[["Position in list","Words 1–3","Words 4–12","Words 13–15"],["Average number of participants who recalled each word (out of 50)","39","17","41"]]}],"parts":[{"no":"a","q":"Calculate the percentage of participants who recalled each of the first three words, on average. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 39 ÷ 50 × 100 = 78%.","2 marks: 78% with no workings.","1 mark: workings only – 39 ÷ 50 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. words at the start (39/50) and end (41/50) of the list were recalled far more than the middle (17/50) – the primacy and recency effects – suggesting the first words were rehearsed into LTM and the last were still in STM, supporting the multi-store model.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-12","stim":[{"p":"A psychologist ran variations of an obedience study, recording how many of 40 participants went to the highest shock level."},{"table":[["Variation","Original (Yale)","Run-down office","Learner in same room","Orders by phone"],["Went to the highest level (out of 40)","26","19","16","8"]]}],"parts":[{"no":"a","q":"Calculate the percentage of participants who went to the highest level when orders were given by phone. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 8 ÷ 40 × 100 = 20%.","2 marks: 20% with no workings.","1 mark: workings only – 8 ÷ 40 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. obedience was highest at the prestigious university (26 of 40) and dropped when the setting was less official (19) or the authority figure wasn't present (8 by phone), suggesting the legitimacy and closeness of the authority figure affects obedience (agency theory).","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-13","stim":[{"p":"A researcher showed 60 participants an ambiguous figure that could be a B or a 13. Half first saw a row of letters; half first saw a row of numbers."},{"table":[["","Saw letters first","Saw numbers first"],["Reported 'B'","26","7"],["Reported '13'","4","23"]]}],"parts":[{"no":"a","q":"Calculate the percentage of participants who saw numbers first and reported '13'. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 77%.","2 marks: 76.6667 (not rounded to 2 s.f.) or rounded wrongly.","1 mark: workings only – 23 ÷ 30 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. what people saw first affected how they perceived the figure – 26 of 30 who saw letters reported a B, while 23 of 30 who saw numbers reported 13 – suggesting expectation creates a perceptual set.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]},{"id":"v1-14","stim":[{"p":"A researcher compared how often identical (MZ) and non-identical (DZ) twins were both diagnosed with depression, when at least one twin had depression."},{"table":[["","MZ twins","DZ twins"],["Both twins depressed","27","11"],["Only one twin depressed","33","49"],["Total pairs","60","60"]]}],"parts":[{"no":"a","q":"Calculate the percentage of MZ pairs where both twins were depressed. State your answer to two significant figures and show your workings.","m":3,"ms":[{"h":"","b":["3 marks: 27 ÷ 60 × 100 = 45%.","2 marks: 45% with no workings.","1 mark: workings only – 27 ÷ 60 × 100."]}]},{"no":"b","q":"Explain one conclusion that the researcher could draw from the results.","m":3,"ms":[{"h":"","b":["3 marks: e.g. MZ twins were more likely to both be depressed (27 of 60 pairs) than DZ twins (11 of 60), suggesting a genetic vulnerability, because MZ twins share 100% of their genes; but concordance was not 100%, so the environment must also play a part.","2 marks: correct conclusion with limited figures or explanation. 1 mark: correct conclusion only."]}]}]}]},{"n":2,"title":"Improving a study","icon":"🔧","tag":"Name the problem, the change, and why the change helps.","steps":[["Problem","Name the weakness IN THIS STUDY (e.g. only 10 psychology students from her own class)."],["Change","Say exactly what you would change it to."],["Why it helps","Explain what the change fixes: generalisability, validity, reliability or ethics."],["Checklist","Ethics · Method · Design · Sample · Variables. Run through all five to find a problem."]],"watch":"'Use more participants' gets 1 mark at most. Which study? How many did it use? Why does more help?","items":[{"id":"v2-1","stim":[{"p":"A student tested whether music affects memory. She asked 8 friends from her Year 11 class to learn 20 words in silence at lunchtime, then learn a different 20 words with music after school."}],"parts":[{"no":"a","q":"Identify one weakness of the sample. Suggest how the sample could be improved.","m":3,"ms":[{"h":"","b":["1 mark for the weakness: small (8) / all her friends / all from one Year 11 class – not representative, and friends may guess the aim (demand characteristics).","Up to 2 marks for a suitable improvement, explained, e.g. a larger random sample from every year group, so the results can be generalised and participants are less likely to know the aim."]}]},{"no":"b","q":"Identify one extraneous variable in this study. Explain how it could be controlled.","m":3,"ms":[{"h":"","b":["1 mark: time of day – the music condition was after school, when they may be more tired.","Up to 2 marks: do both conditions at the same time of day, or counterbalance, so tiredness can't explain the difference."]}]}]},{"id":"v2-2","stim":[{"p":"A researcher wanted to see if people remember more in the morning or the evening. 20 participants learned a list of 30 words at 9 am and were tested. At 7 pm the same participants learned the same list again and were tested."}],"parts":[{"no":"","q":"Explain one problem with the way this study was carried out. Suggest how the problem could be overcome.","m":4,"ms":[{"h":"","b":["1 mark: the same list was used both times, so they may remember words from the morning (practice effect / order effect).","1 mark: the evening condition always came second, so tiredness or practice could explain the difference.","Up to 2 marks: use two different but equally difficult lists, and counterbalance (half do evening first on a different day), so the difference is due to the time of day."]}]}]},{"id":"v2-3","stim":[{"p":"A teacher wanted to know how many hours her class revise each week. She gave each student a questionnaire with their name at the top and collected them in at the end of the lesson."}],"parts":[{"no":"","q":"Explain one weakness of the way the data was collected. Suggest an improvement and explain why it would help.","m":4,"ms":[{"h":"","b":["1–2 marks: students wrote their names on the questionnaire and the teacher collected it, so they may exaggerate how much they revise to look good (social desirability bias), making the data less valid.","1–2 marks: make it anonymous (no names, put in a sealed box), or use a revision diary checked by parents, so answers are more honest."]}]}]},{"id":"v2-4","stim":[{"p":"A psychologist sat in a town centre and watched whether people helped when a confederate dropped a bag of shopping. She wrote down anything she thought counted as helping."}],"parts":[{"no":"","q":"Identify one weakness of how the observation was carried out. Explain how it could be improved.","m":3,"ms":[{"h":"","b":["1 mark: only one observer, so there could be observer bias – she might record what she expects to see; or no clear behavioural categories (what counts as 'helping'?).","Up to 2 marks: use two observers with the same behavioural categories (e.g. picks up item, points, asks if okay) and compare their records to check inter-observer reliability."]}]}]},{"id":"v2-5","stim":[{"p":"A researcher tested whether an energy drink improves reaction time. She gave the drink to 15 members of a sports club and plain water to 15 members of a chess club, then tested their reaction times."}],"parts":[{"no":"","q":"Explain one problem with the way participants were put into groups. Suggest how this could be improved.","m":4,"ms":[{"h":"","b":["1–2 marks: participant variables – the sports club members may already have faster reactions, so the difference may not be caused by the energy drink.","1–2 marks: randomly allocate participants from one larger group to the two conditions, or use matched pairs (match on age and how often they play sport), or repeated measures with counterbalancing."]}]}]},{"id":"v2-6","stim":[{"p":"A researcher wanted to see if hunger affects how people perceive food. Participants went without food for 24 hours before rating pictures of meals."}],"parts":[{"no":"","q":"Identify one ethical issue in this study. Suggest how the researcher could deal with it.","m":3,"ms":[{"h":"","b":["1 mark: protection from harm – going without food for 24 hours may make people unwell or distressed.","Up to 2 marks: reduce the time without food (e.g. skip one meal), check health first, remind them of the right to withdraw, and give food straight after, so they leave in the same state they arrived."]}]}]},{"id":"v2-7","stim":[{"p":"A researcher tested obedience in a lab. Participants were told by a researcher in a lab coat to give 'shocks' to a cartoon character in a computer game whenever it made an error."}],"parts":[{"no":"","q":"Explain one weakness of this study and how it could be improved.","m":4,"ms":[{"h":"","b":["1–2 marks: lab setting with an artificial task (shocks on a computer game), so low ecological validity / mundane realism – people may not obey like this in real life.","1–2 marks: a field experiment, e.g. a real-life request from someone in uniform, such as asking people in the street to pick up litter, so behaviour is natural."]}]}]},{"id":"v2-8","stim":[],"parts":[{"no":"","q":"Explain one way Bartlett's War of the Ghosts study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a specific weakness: e.g. only 20 Cambridge University students (biased sample); no standardised instructions or set times for recall (low reliability); an unfamiliar story.","Up to 2 marks for a specific improvement and why it helps: e.g. use people of different ages and cultures, so findings can be generalised; give every participant the same instructions and the same recall times, so it can be replicated."]}]}]},{"id":"v2-9","stim":[],"parts":[{"no":"","q":"Explain one way Murdock's serial position study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a specific weakness: e.g. word lists are an artificial task (low mundane realism); psychology students may guess the aim.","Up to 2 marks for a specific improvement: e.g. use a realistic task such as remembering a shopping list or a list of names at a party, so it shows how memory works in everyday life; use non-psychology students."]}]}]},{"id":"v2-10","stim":[],"parts":[{"no":"","q":"Explain one way Gilchrist and Nesberg's study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a weakness: e.g. small sample of 26 student volunteers; going without food for 20 hours is uncomfortable (protection from harm); pictures of food lack mundane realism.","Up to 2 marks for an improvement: e.g. a larger, more varied sample; a shorter time without food, so it is more ethical; use real food in a canteen, so it is more realistic."]}]}]},{"id":"v2-11","stim":[],"parts":[{"no":"","q":"Explain one way Hughes' policeman doll study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a weakness: e.g. 30 children all from Edinburgh (small, ethnocentric sample); children may pick up cues from the researcher.","Up to 2 marks for an improvement: e.g. test a larger sample of children from different countries, so findings can be generalised; use a researcher who doesn't know the aim, or record instructions, so there are fewer cues."]}]}]},{"id":"v2-12","stim":[],"parts":[{"no":"","q":"Explain one way Piliavin's subway study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a weakness: e.g. passengers couldn't consent or be debriefed; only one city (New York) in 1969; observers may have been biased.","Up to 2 marks for an improvement: e.g. debrief passengers when they leave the carriage; repeat it in other cities and countries today, so it can be generalised; use video so observations can be checked."]}]}]},{"id":"v2-13","stim":[],"parts":[{"no":"","q":"Explain one way Yuki's emoticon study could be improved. Explain why your improvement would make the study better.","m":4,"ms":[{"h":"","b":["Up to 2 marks for a weakness: e.g. only university students from two countries (USA and Japan); emoticons are simple, artificial faces.","Up to 2 marks for an improvement: e.g. include people of different ages from more cultures, so it can be generalised; use photos or videos of real faces, so it is more like reading emotions in real life."]}]}]}]},{"n":3,"title":"Research methods in context","icon":"🔬","tag":"Use the study's own words and numbers in every answer.","steps":[["IV","What the researcher changes: give BOTH conditions."],["DV","What is measured and how (operationalised)."],["Hypothesis","A prediction, not a question, with both conditions of the IV and the operationalised DV."],["Extraneous variable","Something other than the IV that could affect the DV, and HOW it could affect the results."],["Design / sampling","Name it AND say how you know, using the study. Describe sampling step by step."],["Ethics","Name the issue AND how you would deal with it in THIS study."],["Correlation","It can't show cause and effect: suggest a third variable from the study."]],"watch":"Test: could your answer be about any study? If yes, it's generic and gets 1 mark at most. 'The DV is the results' gets 0.","items":[{"id":"v3-1","stim":[{"p":"A researcher tested whether chewing gum improves test performance. 25 Year 8 students chewed gum during a 20-question spelling test. A different 25 Year 8 students did the same test without gum."}],"parts":[{"no":"a","q":"Identify the independent variable (both conditions) and the dependent variable.","m":3,"ms":[{"h":"","b":["IV: whether students chewed gum or not (2 marks for both conditions, 1 for 'gum'). DV: their score on the 20-question spelling test (1)."]}]},{"no":"b","q":"Write a suitable alternative hypothesis for this study.","m":2,"ms":[{"h":"","b":["2 marks: e.g. Students who chew gum will score higher on a 20-question spelling test than students who do not chew gum. 1 mark: lacks clarity, e.g. 'gum affects memory'. A question = 0."]}]},{"no":"c","q":"Name the experimental design used. Explain your answer.","m":2,"ms":[{"h":"","b":["Independent groups (1) – different students were in the gum and no-gum conditions (1)."]}]}]},{"id":"v3-2","stim":[{"p":"A researcher tested whether having a phone on the desk affects concentration. 20 students solved puzzles for 10 minutes with their phone face down on the desk. Then the same students solved different puzzles for 10 minutes with their phone in another room."}],"parts":[{"no":"a","q":"Name the experimental design used. Explain one weakness of this design in this study.","m":3,"ms":[{"h":"","b":["Repeated measures (1). Order effects (1): e.g. in the second condition students may do better because they've practised puzzles, or worse because they're bored, so the difference may not be caused by the phone (1)."]}]},{"no":"b","q":"Explain how the researcher could deal with this weakness.","m":2,"ms":[{"h":"","b":["Counterbalancing (1): half the students do the phone condition first and half do it second, so order effects are balanced out across the conditions (1)."]}]}]},{"id":"v3-3","stim":[{"p":"A psychologist asked 20 teenagers how many hours a day they spend on social media and gave them a self-esteem questionnaire (higher score = higher self-esteem). The more time spent on social media, the lower the self-esteem score. She concluded that social media causes low self-esteem."}],"parts":[{"no":"a","q":"What type of correlation has the psychologist found?","m":1,"ms":[{"h":"","b":["Negative correlation (1)."]}]},{"no":"b","q":"Explain why the psychologist is not correct to conclude that social media causes low self-esteem.","m":2,"ms":[{"h":"","b":["A correlation only shows a relationship, not cause and effect (1). A third variable could cause both, e.g. being lonely or bullied could make someone use social media more and have lower self-esteem; or low self-esteem could cause more social media use (1). Answers not about this study: max 1."]}]},{"no":"c","q":"Identify one ethical issue in this study. Describe how the psychologist could deal with it.","m":2,"ms":[{"h":"","b":["1 mark: an issue, e.g. confidentiality, protection from harm (self-esteem questions may be upsetting), consent (under 16). 1 mark: how, in this study, e.g. no names on the questionnaires; parental consent; give details of where to get support."]}]}]},{"id":"v3-4","stim":[{"p":"A psychologist watched children in a primary school playground from a staffroom window. She recorded every time a child shared a toy. The children did not know they were being observed."}],"parts":[{"no":"a","q":"Is this a covert or an overt observation? Explain your answer.","m":2,"ms":[{"h":"","b":["Covert (1) – the children did not know they were being watched, because she watched from a window (1)."]}]},{"no":"b","q":"Explain one strength of this type of observation in this study.","m":2,"ms":[{"h":"","b":["Children behave naturally because they don't know they're being watched (1), so the data on sharing is more valid / high ecological validity (1)."]}]},{"no":"c","q":"Identify one ethical issue with this observation and how it could be dealt with.","m":2,"ms":[{"h":"","b":["1 mark: no informed consent / the children are under 16. 1 mark: get consent from parents and the school beforehand, and keep the data anonymous."]}]}]},{"id":"v3-5","stim":[{"p":"A researcher wanted to study the sleep habits of the 300 students at a secondary school. She needed a sample of 30."}],"parts":[{"no":"a","q":"Describe how the researcher could select 30 participants using random sampling.","m":3,"ms":[{"h":"","b":["1 mark: get a list of all 300 students (the target population). 1 mark: give each a number / put all names in a hat or use a random number generator. 1 mark: pick 30 names, so everyone has an equal chance of being chosen."]}]},{"no":"b","q":"Explain one weakness of random sampling in this study.","m":2,"ms":[{"h":"","b":["e.g. it may still not be representative by chance, e.g. mostly Year 7s (1), so the findings about sleep might not apply to the whole school (1). Or: students chosen may refuse to take part, so it becomes a volunteer sample."]}]}]},{"id":"v3-6","stim":[{"p":"A researcher dropped a pile of books in a shopping centre 20 times while dressed smartly and 20 times while dressed scruffily. She recorded whether anyone stopped to help."}],"parts":[{"no":"a","q":"Identify the independent variable (both conditions) and the dependent variable.","m":3,"ms":[{"h":"","b":["IV: whether the confederate was dressed smartly or scruffily (2 marks for both conditions, 1 for 'clothes'). DV: whether passers-by helped pick up the books / the number of people who helped (1)."]}]},{"no":"b","q":"Is this a laboratory or a field experiment? Explain your answer.","m":2,"ms":[{"h":"","b":["Field experiment (1) – it took place in a natural setting (a shopping centre) and the researcher still manipulated the IV (1)."]}]},{"no":"c","q":"Identify one extraneous variable in this study and explain how it could affect the results.","m":3,
