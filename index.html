<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Wakefield's Fount of Knowledge and Wisdom (GCSE)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F7; --card:#FFFFFF; --ink:#18203A; --muted:#566082; --line:#D3D9E6; --soft:#E3E8F2;
  --good:#1C8A5E; --good-bg:#DDF3E8; --warn:#B4531B; --warn-bg:#FBE7D9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
    --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
  --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #4D7CFE;outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:.95;letter-spacing:-.02em;margin:0}
h1 span{display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1.2}
h1 span b{font-weight:500}
.meter{min-width:220px;flex:0 1 300px}
.meter p{margin:0 0 6px;font-size:15px;color:var(--muted)}
.meter b{color:var(--ink);font-family:var(--display);font-size:22px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;width:max-content;max-width:100%;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* topics */
.topics{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:22px}
.topics-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.topics-head h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.chip{--c:#888;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 11px 9px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.chip .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.2}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;opacity:.35}
.chip .foot2{display:flex;align-items:center;gap:8px}
.chip .n{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.chip .bar{flex:1;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip[aria-pressed="true"] .dot{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}

/* shared */
.panel[hidden]{display:none}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:12px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
kbd{font-family:var(--body);font-size:12px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7;margin-left:6px}
.spacer{flex:1}

/* flashcard: the one bold thing */
.stage{perspective:1600px}
.card{--c:#888;position:relative;display:grid;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px 30px 46px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--c);border-radius:20px 0 0 20px}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.tag{font-size:14px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;gap:10px;position:relative}
.tag .muted{font-weight:400}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.01em;margin:auto 0;padding:20px 0}
.face.back .q-small{font-size:15px;color:var(--muted);margin:14px 0 10px;position:relative}
.a{font-size:clamp(18px,2.2vw,21px);line-height:1.55;position:relative;margin-bottom:auto}
.a ul{margin:0;padding-left:1.1em}
.a li{margin:3px 0}
.a li::marker{color:var(--c)}
.hint{position:relative;margin-top:14px;font-size:14px;color:var(--muted)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.card-actions .btn{flex:1 1 120px}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px}
.progressline{height:4px;background:var(--soft);border-radius:4px;margin:0 0 14px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--ink);transition:width .3s}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:40px 28px;text-align:center}
.empty h3{font-family:var(--display);font-size:26px;margin:0 0 8px}
.empty p{margin:0 auto 18px;max-width:46ch;color:var(--muted)}

/* quiz */
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;border-top:10px solid var(--c)}
.quiz-q .q{margin:10px 0 18px;padding:0;font-size:clamp(22px,3vw,30px)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;resize:vertical;font-size:17px;line-height:1.5}
textarea:focus{border-color:var(--c);outline:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.compare > div{border-radius:12px;padding:14px 16px;background:var(--soft)}
.compare h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.compare .model{background:color-mix(in srgb,var(--c) 12%,var(--card))}
@media (max-width:640px){.compare{grid-template-columns:1fr}}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;margin:0}
.results{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:8px}
.results li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 44px;position:relative}
.results li::before{position:absolute;left:14px;top:11px;font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.results li.ok::before{content:"✓";background:var(--good-bg);color:var(--good)}
.results li.no::before{content:"✗";background:var(--warn-bg);color:var(--warn)}
.results li .ans{font-size:15px;color:var(--muted);margin-top:4px}
.size-pick{display:flex;gap:10px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}
.size-pick button{width:74px;height:74px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:28px}
.size-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* browse */
.search{flex:1 1 260px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;font-size:16px}
.search:focus{border-color:var(--ink);outline:none}
.list{display:grid;gap:8px}
.item{--c:#888;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px}
.item summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.item summary::-webkit-details-marker{display:none}
.item summary .num{font-size:13px;color:var(--muted);min-width:2.6em}
.item summary .qt{font-weight:700;flex:1}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.k{background:var(--good-bg);color:var(--good)}
.pill.l{background:var(--warn-bg);color:var(--warn)}
.item .body{padding:0 16px 14px calc(16px + 2.6em + 12px)}
.item .body .a{font-size:17px}
.item .body .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .body .mini button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 12px;font-size:14px}
.item .body .mini button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
mark{background:#FFE17A;color:#18203A;border-radius:3px;padding:0 1px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

@media (max-width:560px){
  .wrap{padding:18px 14px 40px}
  .face{padding:24px 20px 24px 34px}
  .face::before{width:10px}
  .card{min-height:300px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .chip{padding:6px 9px 7px;border-width:1.5px}
  .chip .row{font-size:14px}
  .topics{padding:12px 10px 10px}
  .card-actions .nav{order:3;width:100%;justify-content:center}
  .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .progressline i{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Mr Wakefield's Fount of Knowledge and Wisdom<span>GCSE psychology revision, <b id="totalQ"></b> questions</span></h1>
    <div class="meter" aria-live="polite">
      <p><b id="knownCount">0</b> known · <span id="learningCount">0</span> still learning</p>
      <div class="stack" id="stack" aria-hidden="true"></div>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Revision mode">
    <button role="tab" aria-selected="true" data-tab="cards" id="tab-cards" aria-controls="p-cards">Flashcards</button>
    <button role="tab" aria-selected="false" data-tab="quiz" id="tab-quiz" aria-controls="p-quiz">Quick quiz</button>
    <button role="tab" aria-selected="false" data-tab="browse" id="tab-browse" aria-controls="p-browse">Browse all</button>
  </div>

  <section class="topics" aria-labelledby="topicsTitle">
    <div class="topics-head">
      <h2 id="topicsTitle">Topics to revise</h2>
      <div><button class="linkbtn" id="allTopics">Select all</button><button class="linkbtn" id="noTopics">Clear</button></div>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <!-- FLASHCARDS -->
  <section class="panel" id="p-cards" role="tabpanel" aria-labelledby="tab-cards">
    <div class="bar-row">
      <div class="seg" role="group" aria-label="Which cards">
        <button aria-pressed="true" data-filter="all">All cards</button>
        <button aria-pressed="false" data-filter="notknown">Not known yet</button>
        <button aria-pressed="false" data-filter="learning">Still learning</button>
      </div>
      <span class="spacer"></span>
      <button class="btn ghost" id="shuffleBtn" style="padding:8px 14px">Shuffle a new deck</button>
    </div>
    <div id="cardArea"></div>
  </section>

  <!-- QUIZ -->
  <section class="panel" id="p-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
    <div id="quizArea"></div>
  </section>

  <!-- BROWSE -->
  <section class="panel" id="p-browse" role="tabpanel" aria-labelledby="tab-browse" hidden>
    <div class="bar-row">
      <input class="search" id="search" type="search" placeholder="Search questions and answers, e.g. Milgram" aria-label="Search questions and answers">
      <span class="muted" id="browseCount"></span>
    </div>
    <div class="list" id="list"></div>
    <p class="muted" id="moreWrap" style="text-align:center"></p>
  </section>

  <footer class="foot">
    <span>Your progress is saved in this browser only.</span>
    <button class="linkbtn" id="resetBtn">Reset my progress</button>
  </footer>
</div>

<script>
const DATA = [{"q":"What is encoding?","a":"Changing information into a form that can be stored in the brain","t":"Memory","id":1},{"q":"What are the three types of encoding?","a":"Visual, Acoustic, Semantic","t":"Memory","id":2},{"q":"What is visual encoding?","a":"Storing information as pictures or images","t":"Memory","id":3},{"q":"What is acoustic encoding?","a":"Storing information as sounds","t":"Memory","id":4},{"q":"What is semantic encoding?","a":"Storing information by its meaning","t":"Memory","id":5},{"q":"What is storage?","a":"Holding information in the memory over time so it can be used later","t":"Memory","id":6},{"q":"What is retrieval?","a":"Recovering information from a memory store","t":"Memory","id":7},{"q":"What is the difference between recall and recognition?","a":"Recall is retrieving information without it being present; recognition is identifying information when you see it again","t":"Memory","id":8},{"q":"What is free recall?","a":"Remembering information in any order, without help or cues","t":"Memory","id":9},{"q":"What is cued recall?","a":"Recalling information with the help of a cue or clue","t":"Memory","id":10},{"q":"What is procedural memory?","a":"Stored knowledge used to carry out motor skills and tasks (muscle memory), recalled without conscious effort","t":"Memory","id":11},{"q":"What is semantic memory?","a":"Memory for general knowledge that is shared with other people and is not time-stamped","t":"Memory","id":12},{"q":"What is episodic memory?","a":"Memory for personal experiences and events from your life, which is time-stamped (time, place, people, feelings)","t":"Memory","id":13},{"q":"What is the easy way to tell episodic from semantic memory?","a":"If the memory is about YOU (a personal experience) it is episodic; if it is general knowledge, it is semantic","t":"Memory","id":14},{"q":"Name the three types of long-term memory.","a":"Episodic, Semantic, Procedural","t":"Memory","id":15},{"q":"What is declarative memory?","a":"Memory that can be consciously recalled and put into words ('knowing that') – episodic and semantic memory","t":"Memory","id":16},{"q":"What is non-declarative memory?","a":"Memory that we don't need to consciously recall or put into words ('knowing how') – procedural memory","t":"Memory","id":17},{"q":"Which type of memory is non-declarative?","a":"Procedural memory","t":"Memory","id":18},{"q":"Which types of memory are declarative?","a":"Episodic and semantic memory","t":"Memory","id":19},{"q":"Which brain areas are linked to the three types of long-term memory?","a":"Episodic – right pre-frontal area, Semantic – left pre-frontal area, Procedural – motor cortex","t":"Memory","id":20},{"q":"Who proposed the multi-store model of memory?","a":"Atkinson and Shiffrin (1968)","t":"Memory","id":21},{"q":"What are the three stores of the multi-store model?","a":"Sensory register (sensory memory), Short-term memory, Long-term memory","t":"Memory","id":22},{"q":"What is the capacity of the sensory register?","a":"Very large (e.g. more than a million cells in one eye storing data)","t":"Memory","id":23},{"q":"What is the duration of the sensory register?","a":"Very brief – less than half a second","t":"Memory","id":24},{"q":"What is the encoding of the sensory register?","a":"Modality specific – it depends on the sense (visual, auditory etc.)","t":"Memory","id":25},{"q":"What is the capacity of short-term memory?","a":"7 plus or minus 2 items (5–9)","t":"Memory","id":26},{"q":"What is the duration of short-term memory?","a":"18–30 seconds (longer if the information is rehearsed)","t":"Memory","id":27},{"q":"What is the encoding of short-term memory?","a":"Mainly acoustic (sounds)","t":"Memory","id":28},{"q":"What is the capacity of long-term memory?","a":"Unlimited","t":"Memory","id":29},{"q":"What is the duration of long-term memory?","a":"Unlimited – up to a lifetime","t":"Memory","id":30},{"q":"What is the encoding of long-term memory?","a":"Mainly semantic (meaning)","t":"Memory","id":31},{"q":"How does information move from the sensory register to short-term memory?","a":"By paying attention to it","t":"Memory","id":32},{"q":"How does information move from short-term memory to long-term memory?","a":"Through prolonged rehearsal (repeating it over and over)","t":"Memory","id":33},{"q":"What is maintenance rehearsal?","a":"Repeating information verbally or mentally to keep it in short-term memory beyond 30 seconds","t":"Memory","id":34},{"q":"What is prolonged rehearsal?","a":"Repeating information over and over so that it is transferred to long-term memory","t":"Memory","id":35},{"q":"What happens to information in STM that is not rehearsed?","a":"It is forgotten (it decays or is displaced)","t":"Memory","id":36},{"q":"How does information get out of long-term memory when we need it?","a":"Retrieval – it is passed back to short-term memory","t":"Memory","id":37},{"q":"Who found that the average digit span is 7 plus or minus 2?","a":"Miller","t":"Memory","id":38},{"q":"What is a digit span test?","a":"A test of STM capacity where people repeat back increasingly long strings of digits in the correct order","t":"Memory","id":39},{"q":"What is chunking?","a":"Grouping individual pieces of information into larger units, which 'increases' the capacity of STM","t":"Memory","id":40},{"q":"Describe Bahrick et al.'s (1975) study.","a":"About 400 people aged 17–74 were tested on their memory of names and faces of classmates from their high school yearbooks","t":"Memory","id":41},{"q":"What did Bahrick et al. (1975) find?","a":"People who graduated within 15 years were 90% accurate at face recognition; after 48 years they were still 70–80% accurate","t":"Memory","id":42},{"q":"How does Bahrick's study support the multi-store model?","a":"It shows long-term memory can last up to a lifetime","t":"Memory","id":43},{"q":"Who is Clive Wearing?","a":"A musician whose brain was damaged by a virus; he can't form new long-term memories but can still play the piano","t":"Memory","id":44},{"q":"How does Clive Wearing challenge the multi-store model?","a":"He can still play the piano (procedural memory) but can't form new episodic memories, so there must be more than one type of LTM – the MSM is too simple","t":"Memory","id":45},{"q":"Give a strength of the multi-store model.","a":"Research support – e.g. Murdock's serial position study and Bahrick's study show separate STM and LTM stores","t":"Memory","id":46},{"q":"Give a weakness of the multi-store model.","a":"It is too simplistic/reductionist – it says there is only one LTM store but Clive Wearing shows there are different types","t":"Memory","id":47},{"q":"Why is the multi-store model said to be reductionist?","a":"It simplifies memory into three stores and suggests rehearsal is the only way to transfer to LTM","t":"Memory","id":48},{"q":"What was the aim of Murdock's (1962) study?","a":"To investigate free recall and whether the position of a word in a list affects how likely it is to be remembered","t":"Memory","id":49},{"q":"Describe the method of Murdock's study.","a":"Participants were shown a list of 20 words, one at a time (each for about 2 seconds), then asked to recall as many as possible in any order","t":"Memory","id":50},{"q":"What was the IV in Murdock's study?","a":"The position of the word in the list","t":"Memory","id":51},{"q":"What was the DV in Murdock's study?","a":"The number of words recalled","t":"Memory","id":52},{"q":"What type of experiment was Murdock's study?","a":"A laboratory experiment","t":"Memory","id":53},{"q":"What is the name of Murdock's study?","a":"The serial position curve (serial position effect)","t":"Memory","id":54},{"q":"What did Murdock find?","a":"Words at the start and end of the list were recalled better than words in the middle","t":"Memory","id":55},{"q":"What is the primacy effect?","a":"Recalling more of the first information received, because it has been rehearsed the longest and has entered LTM","t":"Memory","id":56},{"q":"What is the recency effect?","a":"Recalling more of the last information received, because it is still in STM","t":"Memory","id":57},{"q":"How does the primacy effect show there is a long-term memory?","a":"The first words have been rehearsed and transferred to LTM, so they are recalled well","t":"Memory","id":58},{"q":"How does Murdock's study show there is a short-term memory?","a":"The recency effect – the last words are still in STM when recall begins","t":"Memory","id":59},{"q":"Why are words in the middle of the list poorly recalled?","a":"They haven't been rehearsed enough to reach LTM and have been pushed out of STM","t":"Memory","id":60},{"q":"What was the conclusion of Murdock's study?","a":"The likelihood of recalling a word depends on its position in the list, supporting separate STM and LTM stores","t":"Memory","id":61},{"q":"Write a one-tailed hypothesis for Murdock's study.","a":"Words at the start and end of a list will be recalled more than words in the middle of the list","t":"Memory","id":62},{"q":"Who is the target population for Murdock's study?","a":"People in general (anyone with a memory)","t":"Memory","id":63},{"q":"Identify a standardised procedure in Murdock's study.","a":"Each word was shown for the same amount of time and all participants had the same word list","t":"Memory","id":64},{"q":"Did Murdock's study have mundane realism?","a":"No – learning lists of words is an artificial task that doesn't reflect how we use memory in everyday life","t":"Memory","id":65},{"q":"Murdock used an artificial task. What does this mean the study lacks?","a":"Mundane realism (and ecological validity)","t":"Memory","id":66},{"q":"Does Murdock's study have high or low internal validity, and why?","a":"High – it was a controlled lab experiment with standardised procedures, so the position of the word is likely to have caused the difference in recall","t":"Memory","id":67},{"q":"Give an evaluation point for Murdock's study in terms of reliability.","a":"It is reliable because it used standardised procedures (same time per word, same list), so it can be replicated to check results","t":"Memory","id":68},{"q":"Give a practical application of Murdock's study.","a":"Revising – students could place the most important information at the start and end of revision sessions","t":"Memory","id":69},{"q":"Who proposed the theory of reconstructive memory?","a":"Bartlett (1932)","t":"Memory","id":70},{"q":"What does the theory of reconstructive memory say?","a":"Fragments of stored information are reassembled during recall, and the gaps are filled in by our expectations and beliefs","t":"Memory","id":71},{"q":"According to reconstructive memory, memory is not like what?","a":"A tape recorder (or video) – it is not an exact copy of what happened","t":"Memory","id":72},{"q":"When we recall things there are gaps we have to fill. What is this process called?","a":"Confabulation","t":"Memory","id":73},{"q":"What do we use to fill in the gaps in memory according to reconstructive memory?","a":"Our schemas – expectations and beliefs based on past experience","t":"Memory","id":74},{"q":"What is effort after meaning?","a":"Focusing on the meaning of an event and trying to fit it into what we already know about the world","t":"Memory","id":75},{"q":"What is levelling?","a":"Removing or downplaying details from a memory so it becomes shorter","t":"Memory","id":76},{"q":"What is sharpening?","a":"Adding or exaggerating certain details in a memory","t":"Memory","id":77},{"q":"What is rationalisation?","a":"Changing a memory so that it makes more sense to us and fits our culture/schemas","t":"Memory","id":78},{"q":"What is a schema?","a":"A 'packet of information' based on previous experience that helps us organise and interpret information","t":"Memory","id":79},{"q":"What is assimilation?","a":"Adding new information to an existing schema","t":"Memory","id":80},{"q":"What is accommodation?","a":"Changing an existing schema or creating a new one when new information doesn't fit","t":"Memory","id":81},{"q":"How do social and cultural influences affect memory?","a":"We store and recall information in a way that fits our culture, e.g. Bartlett's participants changed 'hunting seals' to 'fishing'","t":"Memory","id":82},{"q":"What was the name of Bartlett's study?","a":"The War of the Ghosts (1932)","t":"Memory","id":83},{"q":"What theory of memory was Bartlett testing?","a":"Reconstructive memory","t":"Memory","id":84},{"q":"Describe the method of Bartlett's War of the Ghosts study.","a":"English participants read a Native American folk story, then retold it after different amounts of time (e.g. 15 minutes, days, months, years)","t":"Memory","id":85},{"q":"What was the sample in Bartlett's study?","a":"English (Cambridge University) students","t":"Memory","id":86},{"q":"Bartlett made people retell a story after 15 minutes, a day, a week and so on. What is this called?","a":"Repeated reproduction","t":"Memory","id":87},{"q":"In some variations the story was passed from person to person. What is this called?","a":"Serial reproduction","t":"Memory","id":88},{"q":"What was the DV in Bartlett's study?","a":"The changes made to the story when it was recalled (the accuracy of recall)","t":"Memory","id":89},{"q":"What did Bartlett find?","a":"The story became shorter, details were left out, and unfamiliar parts were changed to fit English culture","t":"Memory","id":90},{"q":"Bartlett found the story was shortened and things were left out. What is this process called?","a":"Levelling","t":"Memory","id":91},{"q":"Give an example of sharpening in Bartlett's study.","a":"Participants added or exaggerated details, e.g. making the ending more dramatic","t":"Memory","id":92},{"q":"Give an example of participants changing the story to fit their schemas.","a":"'Hunting seals' became 'fishing', and 'canoe' became 'boat'","t":"Memory","id":93},{"q":"Give an example of a quantitative result from Bartlett's study.","a":"The number of words in the story decreased with each retelling (the story got shorter)","t":"Memory","id":94},{"q":"What did Bartlett conclude?","a":"Memory is reconstructive – we change memories to fit our schemas and culture","t":"Memory","id":95},{"q":"Write a two-tailed hypothesis for Bartlett's study.","a":"There will be a difference in the accuracy of recall of a story between people from a culture that matches the story and those from a different culture","t":"Memory","id":96},{"q":"Identify an extraneous variable in Bartlett's study.","a":"The time between retellings varied, or participants' individual memory ability","t":"Memory","id":97},{"q":"Why is Bartlett's study ethnocentric?","a":"Only English students were tested, and the story was judged against English cultural norms","t":"Memory","id":98},{"q":"Why is Bartlett's study not very reliable?","a":"There were no standardised procedures – participants recalled at different times and Bartlett interpreted changes subjectively","t":"Memory","id":99},{"q":"Why does Bartlett's study lack generalisability?","a":"It used only Cambridge University students, who may not represent all people","t":"Memory","id":100},{"q":"Give a strength of the theory of reconstructive memory.","a":"It can be practically applied, e.g. to eyewitness testimony, showing memories may be inaccurate","t":"Memory","id":101},{"q":"How can the theory of reconstructive memory be practically applied?","a":"In police interviews – witnesses' memories may be distorted, so multiple eyewitness accounts should be collected","t":"Memory","id":102},{"q":"What is forgetting?","a":"The inability to retrieve a previously stored memory","t":"Memory","id":103},{"q":"Name the three factors affecting the accuracy of memory.","a":"Interference, Context, False memories","t":"Memory","id":104},{"q":"What is interference?","a":"Forgetting because other memories get in the way and prevent us accessing a memory","t":"Memory","id":105},{"q":"When is interference most likely to occur?","a":"When the two memories are similar","t":"Memory","id":106},{"q":"What is proactive interference?","a":"When old information interferes with learning or recalling new information","t":"Memory","id":107},{"q":"What is retroactive interference?","a":"When new information interferes with recalling old information","t":"Memory","id":108},{"q":"What did McGeoch and McDonald's study aim to investigate?","a":"The effect of a second activity (learning a new list) on the accuracy of memory for an original list","t":"Memory","id":109},{"q":"Describe McGeoch and McDonald's method.","a":"12 participants learned a list of 10 words to 100% accuracy, then learned a second list (synonyms, antonyms, unrelated words, nonsense syllables, numbers, or nothing) before recalling the first list","t":"Memory","id":110},{"q":"Which type of second list gave the worst recall in McGeoch and McDonald's study?","a":"Synonyms (words with the same meaning)","t":"Memory","id":111},{"q":"What did McGeoch and McDonald conclude?","a":"Interference is strongest when the second activity is similar to the first","t":"Memory","id":112},{"q":"Give a weakness of interference as an explanation for accuracy of memory.","a":"It is reductionist – many other factors affect memory, such as context","t":"Memory","id":113},{"q":"What is context in memory?","a":"The situation or surroundings in which something happens, which can act as a cue to recall","t":"Memory","id":114},{"q":"What was the aim of Godden and Baddeley's study?","a":"To see if recall is better when it happens in the same context (underwater or on land) as learning","t":"Memory","id":115},{"q":"Describe Godden and Baddeley's method.","a":"18 divers learned 36 unrelated words either on the beach or 10 feet underwater, then recalled them on land or underwater (4 conditions)","t":"Memory","id":116},{"q":"What is the IV in Godden and Baddeley's study?","a":"Whether the learning and recall environments matched (land/underwater)","t":"Memory","id":117},{"q":"What did Godden and Baddeley find?","a":"Recall was best when the learning and recall environments were the same","t":"Memory","id":118},{"q":"Referring to learning and recall environments, when is recall best?","a":"When the recall environment matches the learning environment","t":"Memory","id":119},{"q":"What did Godden and Baddeley conclude?","a":"Context acts as a cue to recall, enhancing the accuracy of memory","t":"Memory","id":120},{"q":"Give a strength of Godden and Baddeley's study.","a":"Standardised procedures – all divers had the same word lists and time delays, so it is reliable","t":"Memory","id":121},{"q":"Give a weakness of Godden and Baddeley's study.","a":"Lacks mundane realism – learning word lists underwater isn't an everyday task","t":"Memory","id":122},{"q":"How can research on context be practically applied?","a":"Police can take witnesses back to the crime scene; students could revise in a similar room to the exam","t":"Memory","id":123},{"q":"When we first encode a memory, what does it leave on our brain?","a":"A memory trace","t":"Memory","id":124},{"q":"What do we require as a trigger to access memories?","a":"A cue","t":"Memory","id":125},{"q":"What is a false memory?","a":"A memory of something that did not happen but which feels as if it were a true memory","t":"Memory","id":126},{"q":"What study did Loftus and Pickrell (1995) conduct?","a":"The 'lost in the mall' study – they tried to implant a false memory of being lost in a shopping mall as a child","t":"Memory","id":127},{"q":"Describe Loftus and Pickrell's method.","a":"24 participants read four childhood stories from relatives – three true and one false (lost in a mall and rescued by an elderly woman) – then were interviewed about them twice","t":"Memory","id":128},{"q":"What did Loftus and Pickrell find?","a":"25% (6 of 24) recalled the false story fully or partially; 68% of true events were remembered","t":"Memory","id":129},{"q":"What did Loftus and Pickrell conclude?","a":"Just imagining an event can create a false memory, so memory is not always accurate","t":"Memory","id":130},{"q":"What is suggestion?","a":"A psychological process where one person guides the thoughts, feelings or behaviour of another","t":"Memory","id":131},{"q":"What are repressed memories?","a":"Memories that are blocked because they are too traumatic to remember","t":"Memory","id":132},{"q":"How might people implant false memories?","a":"Through suggestion or leading questions, e.g. telling someone about an event that didn't happen","t":"Memory","id":133},{"q":"How can research into false memories be practically applied?","a":"To eyewitness testimony – police should avoid leading questions that could create false memories","t":"Memory","id":134},{"q":"Give an ethical issue with Loftus and Pickrell's study.","a":"Deception and potential distress – participants were lied to about a childhood event","t":"Memory","id":135},{"q":"Give a weakness of Loftus and Pickrell's study.","a":"The false story was artificial and not traumatic, so it may not reflect real false memories","t":"Memory","id":136},{"q":"What are the named studies for the Memory topic?","a":"Murdock (serial position curve), Bartlett (War of the Ghosts)","t":"Memory","id":137},{"q":"What is the difference between a study and a theory?","a":"A theory is an explanation of behaviour; a study is research carried out to test a theory","t":"Memory","id":138},{"q":"What does reductionism mean?","a":"Explaining complex behaviour by breaking it down into simple parts","t":"Memory","id":139},{"q":"What are the five criteria (GRAVE) to evaluate a study?","a":"Generalisability, Reliability, Application, Validity, Ethics","t":"Memory","id":140},{"q":"What does TDEE stand for when writing evaluation?","a":"Term, Define, Evidence, Explain","t":"Memory","id":141},{"q":"What does generalisability mean?","a":"Whether the findings can be applied to the target population","t":"Memory","id":142},{"q":"What does mundane realism mean?","a":"How much a task reflects real, everyday life","t":"Memory","id":143},{"q":"What is psychology?","a":"The scientific study of the mind (thoughts and feelings) and behaviour","t":"RM","id":144},{"q":"What is an aim?","a":"A general statement of the purpose of a study – what is being investigated","t":"RM","id":145},{"q":"How do we normally write an aim?","a":"'To investigate whether (DV) is affected by (IV)'","t":"RM","id":146},{"q":"What is an independent variable?","a":"The variable that is changed or manipulated by the researcher","t":"RM","id":147},{"q":"What is a dependent variable?","a":"The variable that is measured","t":"RM","id":148},{"q":"What is an extraneous variable?","a":"Any variable other than the IV that could affect the DV and ruin the results","t":"RM","id":149},{"q":"What is operationalisation?","a":"Making variables specific and measurable, e.g. 'memory' becomes 'number of words recalled from a list of 20'","t":"RM","id":150},{"q":"What is a hypothesis?","a":"A testable statement or prediction about the relationship between two variables","t":"RM","id":151},{"q":"What is a null hypothesis?","a":"A hypothesis that says there will be no difference or relationship between variables","t":"RM","id":152},{"q":"What is an alternative hypothesis?","a":"A hypothesis that predicts there will be a difference or relationship between variables","t":"RM","id":153},{"q":"What is a directional (one-tailed) hypothesis?","a":"A hypothesis that says which direction the results will go, e.g. 'Pupils in a noisy room will recall fewer words than pupils in silence'","t":"RM","id":154},{"q":"What is a non-directional (two-tailed) hypothesis?","a":"A hypothesis that predicts a difference but not its direction, e.g. 'There will be a difference in recall between pupils in noise and silence'","t":"RM","id":155},{"q":"What is the formula for writing a hypothesis?","a":"There will be a difference in (DV) between (condition 1 of IV) and (condition 2 of IV)","t":"RM","id":156},{"q":"What is a laboratory experiment?","a":"An experiment in a controlled, artificial environment where the researcher manipulates the IV","t":"RM","id":157},{"q":"What is a field experiment?","a":"An experiment in a natural, real-life setting where the researcher still manipulates the IV","t":"RM","id":158},{"q":"What is a natural experiment?","a":"An experiment where the IV occurs naturally and is not manipulated by the researcher","t":"RM","id":159},{"q":"Which type of experiment has the most control?","a":"A laboratory experiment","t":"RM","id":160},{"q":"Explain a strength of a lab experiment.","a":"High control over extraneous variables, so cause and effect can be established and it can be replicated","t":"RM","id":161},{"q":"Explain a weakness of a lab experiment.","a":"Lacks mundane realism; participants know they are being studied so may show demand characteristics","t":"RM","id":162},{"q":"Explain a strength of a field experiment.","a":"Natural setting, so behaviour is more realistic (higher ecological validity)","t":"RM","id":163},{"q":"Explain a weakness of a field experiment.","a":"Less control of extraneous variables; ethical issues if participants don't know they are being studied","t":"RM","id":164},{"q":"Explain a strength of a natural experiment.","a":"Allows research into IVs that couldn't ethically be manipulated, and has high external validity","t":"RM","id":165},{"q":"Explain a disadvantage of a natural experiment.","a":"The researcher has no control over the IV or who is in each group, and the IV may occur rarely","t":"RM","id":166},{"q":"What are demand characteristics?","a":"Cues that make participants guess the aim of a study and change their behaviour","t":"RM","id":167},{"q":"Name the four types of data.","a":"Quantitative, Qualitative, Primary, Secondary","t":"RM","id":168},{"q":"What is quantitative data?","a":"Numerical data","t":"RM","id":169},{"q":"What is qualitative data?","a":"Descriptive data in words, not numbers","t":"RM","id":170},{"q":"Which type of data is easier to compare – quantitative or qualitative?","a":"Quantitative, because it is numerical","t":"RM","id":171},{"q":"What is a drawback of quantitative data?","a":"It lacks detail and doesn't explain why people behave as they do","t":"RM","id":172},{"q":"Identify a strength of qualitative data.","a":"It is rich and detailed, giving insight into people's thoughts and feelings","t":"RM","id":173},{"q":"Why is qualitative data harder to analyse?","a":"It can't be easily turned into numbers and needs to be interpreted, which can be subjective","t":"RM","id":174},{"q":"What is primary data?","a":"Data collected first-hand by the researcher for their study","t":"RM","id":175},{"q":"What is secondary data?","a":"Data that has already been collected by someone else for another purpose","t":"RM","id":176},{"q":"Explain a strength of primary research.","a":"The researcher controls how the data is collected, so it fits the aim exactly","t":"RM","id":177},{"q":"Name a drawback of secondary data.","a":"It may not fit the aim of the study and may be inaccurate or out of date","t":"RM","id":178},{"q":"Give an example of a source of secondary data.","a":"Government statistics, previous research studies, school records, the internet","t":"RM","id":179},{"q":"Explain how counterbalancing works.","a":"In repeated measures, half the participants do condition A then B, and half do B then A, to balance out order effects","t":"RM","id":180},{"q":"What does validity mean?","a":"Whether a study measures what it claims to measure and reflects real life","t":"RM","id":181},{"q":"What does reliability mean?","a":"Whether results are consistent – if the study were repeated, would the same results be found?","t":"RM","id":182},{"q":"What is sensation?","a":"The physical stimulation of sense receptors by the environment, e.g. light hitting the retina","t":"Perception","id":183},{"q":"What is perception?","a":"The organisation and interpretation of sensory information by the brain, based on memories and past experience","t":"Perception","id":184},{"q":"What is the difference between sensation and perception?","a":"Sensation is detecting a stimulus ('feeling'); perception is making sense of it ('thinking')","t":"Perception","id":185},{"q":"Name the five senses and their type of perception.","a":"Sight – visual, Hearing – auditory, Smell – olfactory, Taste – gustatory, Touch – tactile","t":"Perception","id":186},{"q":"What do we use to make sense of what we sense?","a":"Our brain uses past experience, memories and knowledge to interpret sensory information","t":"Perception","id":187},{"q":"What is an ambiguous figure?","a":"An image that can be perceived in more than one way, e.g. the duck-rabbit or Rubin's vase","t":"Perception","id":188},{"q":"What are visual cues?","a":"Features of the environment that give us information about movement, distance and where things are in relation to each other","t":"Perception","id":189},{"q":"What is a depth cue?","a":"A feature of the environment that helps us understand depth or distance","t":"Perception","id":190},{"q":"What is a monocular depth cue?","a":"A depth cue that works using only one eye","t":"Perception","id":191},{"q":"What is a binocular depth cue?","a":"A depth cue that only works when using both eyes","t":"Perception","id":192},{"q":"Name the two binocular depth cues.","a":"Retinal disparity, Convergence","t":"Perception","id":193},{"q":"What is convergence?","a":"How hard the eye muscles have to work to look at an object – the closer the object, the harder they work","t":"Perception","id":194},{"q":"How does convergence help us judge depth?","a":"The brain uses the strain on the eye muscles – more strain means the object is closer","t":"Perception","id":195},{"q":"Is convergence a monocular or binocular depth cue?","a":"Binocular","t":"Perception","id":196},{"q":"What is retinal disparity?","a":"The way the left and right eyes each get a slightly different view of the world","t":"Perception","id":197},{"q":"How does retinal disparity help us judge depth?","a":"The bigger the difference between the two images, the closer the object is","t":"Perception","id":198},{"q":"Is retinal disparity a monocular or binocular depth cue?","a":"Binocular","t":"Perception","id":199},{"q":"Name four monocular depth cues.","a":"Height in plane, Relative size, Occlusion, Linear perspective","t":"Perception","id":200},{"q":"What is height in plane?","a":"Objects higher up in the visual field appear further away","t":"Perception","id":201},{"q":"What is relative size?","a":"Smaller objects appear further away","t":"Perception","id":202},{"q":"What is occlusion?","a":"Objects that hide (are in front of) other objects appear closer","t":"Perception","id":203},{"q":"What is linear perspective?","a":"Parallel lines appear to come together (converge) in the distance, suggesting distance","t":"Perception","id":204},{"q":"What is texture gradient?","a":"Textures appear smoother and less detailed further away","t":"Perception","id":205},{"q":"What is motion parallax?","a":"When moving, near objects seem to move past quickly while far objects seem to move slowly","t":"Perception","id":206},{"q":"What are visual constancies?","a":"Our ability to perceive an object as the same even when the image on our retina changes","t":"Perception","id":207},{"q":"What is size constancy?","a":"Perceiving an object as the same size even though its image on the retina gets smaller as it moves away","t":"Perception","id":208},{"q":"What is shape constancy?","a":"Perceiving an object as the same shape even when it is rotated or seen from a different angle","t":"Perception","id":209},{"q":"What is colour constancy?","a":"Perceiving an object as the same colour even under different lighting","t":"Perception","id":210},{"q":"What is a visual illusion?","a":"When we perceive an image differently from how it really is – our perception is tricked","t":"Perception","id":211},{"q":"What are the three explanations for visual illusions?","a":"Misinterpreted depth cues, Ambiguity, Fiction","t":"Perception","id":212},{"q":"What causes the Ponzo illusion?","a":"Misinterpreted depth cues – linear perspective makes the top line seem further away, so size constancy makes it look longer","t":"Perception","id":213},{"q":"What causes the Müller-Lyer illusion?","a":"Misinterpreted depth cues – the fins make one line look like the far corner of a room, so size constancy makes it look longer","t":"Perception","id":214},{"q":"Why are we fooled by the Ames room?","a":"The room is really a trapezoid, but we assume it is square, so we don't apply size constancy and one person looks much bigger","t":"Perception","id":215},{"q":"Which explanation of illusions does Rubin's vase show?","a":"Ambiguity – it can be seen as a vase or two faces","t":"Perception","id":216},{"q":"Which explanation of illusions does the Kanizsa triangle show?","a":"Fiction – we perceive a triangle that isn't actually there","t":"Perception","id":217},{"q":"What is fiction in visual illusions?","a":"Perceiving something that isn't there, e.g. the Kanizsa triangle","t":"Perception","id":218},{"q":"What is ambiguity in visual illusions?","a":"When an image can be interpreted in more than one way, e.g. the duck-rabbit","t":"Perception","id":219},{"q":"What is Gregory's theory of perception called?","a":"The constructivist theory","t":"Perception","id":220},{"q":"What does Gregory's constructivist theory say?","a":"We build our perceptions using incoming sensory data plus what we already know about the world","t":"Perception","id":221},{"q":"Is Gregory's theory top-down or bottom-up?","a":"Top-down","t":"Perception","id":222},{"q":"What does top-down processing mean?","a":"Perception is driven by our knowledge, expectations and past experience","t":"Perception","id":223},{"q":"What is inference in Gregory's theory?","a":"Drawing a conclusion about what we see based on what we already know","t":"Perception","id":224},{"q":"What is a perceptual hypothesis?","a":"A 'best guess' about what we are seeing, based on sensory information and past experience","t":"Perception","id":225},{"q":"Is Gregory's theory nature or nurture?","a":"Nurture – perception is learned through experience","t":"Perception","id":226},{"q":"Why does perception get better as we get older according to Gregory?","a":"We gain more experience and knowledge to make inferences","t":"Perception","id":227},{"q":"How do visual illusions support Gregory's theory?","a":"They show we make mistaken hypotheses based on past experience, e.g. misapplying size constancy","t":"Perception","id":228},{"q":"How do cultural differences in perception support Gregory?","a":"If people from different cultures perceive images differently, perception must be learned (nurture)","t":"Perception","id":229},{"q":"Give a weakness of Gregory's theory.","a":"It is based on artificial 2D illusions designed to fool us, so it may not explain everyday perception","t":"Perception","id":230},{"q":"How does research on babies challenge Gregory?","a":"Babies have some perceptual abilities at birth (e.g. the visual cliff), so not all perception is learned","t":"Perception","id":231},{"q":"What is Gibson's theory of perception called?","a":"The direct theory","t":"Perception","id":232},{"q":"What does Gibson's direct theory say?","a":"All the information we need to perceive the world is in the sensory information – sensation and perception are the same","t":"Perception","id":233},{"q":"Is Gibson's theory top-down or bottom-up?","a":"Bottom-up","t":"Perception","id":234},{"q":"What does bottom-up processing mean?","a":"Perception is driven directly by the sensory information coming in","t":"Perception","id":235},{"q":"What is the optic array?","a":"The structure of patterns of light that reaches the eyes, which contains all the information needed for perception","t":"Perception","id":236},{"q":"What are affordances?","a":"The possible actions an object offers us, e.g. a chair affords sitting","t":"Perception","id":237},{"q":"What does Gibson mean when he says affordances are evolved?","a":"We are born able to perceive what objects can be used for, because this helped our ancestors survive","t":"Perception","id":238},{"q":"Is Gibson's theory nature or nurture?","a":"Nature – we are born able to perceive the world directly","t":"Perception","id":239},{"q":"Who conducted the visual cliff study?","a":"Gibson and Walk","t":"Perception","id":240},{"q":"Describe Gibson and Walk's visual cliff study.","a":"6-month-old babies were placed on a glass table that looked like a steep drop; most would not crawl over the 'cliff' even when called by their mothers","t":"Perception","id":241},{"q":"How does the visual cliff study support Gibson?","a":"Babies perceive depth very early, suggesting perception is innate","t":"Perception","id":242},{"q":"Why do visual illusions challenge Gibson's theory?","a":"If perception were direct, we wouldn't be fooled by illusions","t":"Perception","id":243},{"q":"Give a weakness of the visual cliff study.","a":"The babies were 6 months old, so they may have already learned depth perception","t":"Perception","id":244},{"q":"What is perceptual set?","a":"A tendency to notice certain things in our environment and ignore others","t":"Perception","id":245},{"q":"What are the four factors affecting perceptual set?","a":"Culture, Emotion, Expectation, Motivation","t":"Perception","id":246},{"q":"What is culture?","a":"A group of people who share similar customs, beliefs, expectations and behaviour","t":"Perception","id":247},{"q":"Why would people from different cultures perceive things differently?","a":"They have different experiences, e.g. of 2D pictures or built environments, so they learn to interpret images differently","t":"Perception","id":248},{"q":"Which study investigated culture and perceptual set?","a":"Hudson (1960)","t":"Perception","id":249},{"q":"Where were the participants in Hudson's study from?","a":"South Africa – black South Africans and white Europeans, schooled and unschooled","t":"Perception","id":250},{"q":"What was shown in Hudson's study?","a":"A 2D drawing of a hunter with a spear, an antelope and an elephant; depth cues suggest the hunter is aiming at the antelope","t":"Perception","id":251},{"q":"What did Hudson find?","a":"Schooled participants were more likely to perceive depth; unschooled participants thought the hunter was aiming at the elephant","t":"Perception","id":252},{"q":"Why did unschooled participants in Hudson's study think the hunter was aiming for the elephant?","a":"They had less experience with 2D pictures, so they didn't interpret the depth cues","t":"Perception","id":253},{"q":"Why did schooled participants notice what the hunter was aiming for?","a":"They had more experience with books and pictures, so they had learned to use depth cues in 2D images","t":"Perception","id":254},{"q":"What did Hudson conclude?","a":"Culture affects perceptual set – the ability to interpret depth cues in pictures is learned","t":"Perception","id":255},{"q":"Give a weakness of Hudson's study.","a":"There may have been a language barrier, it lacks mundane realism, and it lacks temporal validity","t":"Perception","id":256},{"q":"How does emotion affect perceptual set?","a":"We notice things that fit our emotions and take longer to perceive things that are unpleasant or threatening","t":"Perception","id":257},{"q":"What is perceptual defence?","a":"The brain 'blocking out' unpleasant or offensive stimuli, so they take longer to perceive","t":"Perception","id":258},{"q":"Do we take longer to perceive things we find pleasant or unpleasant?","a":"Unpleasant","t":"Perception","id":259},{"q":"Who studied emotion and perceptual set using taboo words?","a":"McGinnies (1949)","t":"Perception","id":260},{"q":"Describe McGinnies' study.","a":"16 students were shown neutral and taboo words one at a time and said them aloud; their emotional arousal was measured by GSR","t":"Perception","id":261},{"q":"What did McGinnies find?","a":"Taboo words took longer to recognise and caused bigger GSR changes than neutral words","t":"Perception","id":262},{"q":"What is GSR?","a":"Galvanic skin response – tiny electrical changes on the skin caused by emotional arousal","t":"Perception","id":263},{"q":"How does expectation affect perceptual set?","a":"We are more likely to notice what we expect to see, based on past experience","t":"Perception","id":264},{"q":"Which factor affecting perceptual set did Bruner and Minturn study?","a":"Expectation","t":"Perception","id":265},{"q":"What year was Bruner and Minturn's study?","a":"1955","t":"Perception","id":266},{"q":"Where was Bruner and Minturn's study carried out?","a":"In a laboratory (at Harvard University)","t":"Perception","id":267},{"q":"What was the methodology of Bruner and Minturn's study?","a":"A laboratory experiment","t":"Perception","id":268},{"q":"What design was Bruner and Minturn's study?","a":"Independent groups","t":"Perception","id":269},{"q":"Describe Bruner and Minturn's study.","a":"Participants saw either a sequence of letters or a sequence of numbers, then an ambiguous figure, and drew what they saw","t":"Perception","id":270},{"q":"What were the two interpretations of the ambiguous figure in Bruner and Minturn?","a":"The letter B or the number 13","t":"Perception","id":271},{"q":"What did Bruner and Minturn find?","a":"Participants who saw letters perceived a B; those who saw numbers perceived 13","t":"Perception","id":272},{"q":"What did Bruner and Minturn conclude?","a":"Expectation, created by context, affects perceptual set","t":"Perception","id":273},{"q":"Why does Bruner and Minturn's study lack mundane realism?","a":"Looking at a quick sequence of letters or numbers is an artificial task","t":"Perception","id":274},{"q":"Why might Bruner and Minturn's study show demand characteristics?","a":"Participants may have realised the figure was ambiguous and guessed the aim","t":"Perception","id":275},{"q":"Why does motivation affect perceptual set?","a":"We notice things that meet our needs, e.g. hungry people notice food","t":"Perception","id":276},{"q":"Which study investigated motivation and perceptual set?","a":"Gilchrist and Nesberg (1952)","t":"Perception","id":277},{"q":"In Gilchrist and Nesberg's study, what were participants shown?","a":"Pictures of food (e.g. a meal)","t":"Perception","id":278},{"q":"What were participants in Gilchrist and Nesberg's study shown first?","a":"A picture of food at a set brightness","t":"Perception","id":279},{"q":"In Gilchrist and Nesberg's study, the image became dull. What did participants have to do?","a":"Adjust the brightness to match the original picture","t":"Perception","id":280},{"q":"What was the IV in Gilchrist and Nesberg's study?","a":"How long participants had gone without food (hungry vs not hungry)","t":"Perception","id":281},{"q":"What did Gilchrist and Nesberg find?","a":"Hungry participants rated food pictures as brighter, and this increased the longer they went without food","t":"Perception","id":282},{"q":"What did Gilchrist and Nesberg conclude?","a":"Motivation (hunger) affects perceptual set – we pay more attention to things we need","t":"Perception","id":283},{"q":"What was the design of Gilchrist and Nesberg's study?","a":"Independent groups (a hungry group and a control group)","t":"Perception","id":284},{"q":"Give a weakness of Gilchrist and Nesberg's study.","a":"Lacks mundane realism – people rarely go without food for 20 hours and then look at pictures","t":"Perception","id":285},{"q":"What did Bruner and Goodman (1947) find?","a":"Poorer children overestimated the size of coins more than wealthier children – motivation affects perception","t":"Perception","id":286},{"q":"What are the named studies for Perception?","a":"Bruner and Minturn (expectation), Gilchrist and Nesberg (motivation)","t":"Perception","id":287},{"q":"Why do variables need to be operationalised?","a":"So they can be measured clearly and the study can be replicated","t":"RM","id":288},{"q":"Write an alternative hypothesis for Murdock's study.","a":"Words at the start and end of a list will be recalled more than words in the middle","t":"RM","id":289},{"q":"Write a null hypothesis for Murdock's study.","a":"There will be no difference in recall of words at the start, middle and end of a list","t":"RM","id":290},{"q":"What is a target population?","a":"The group of people the researcher wants to study and apply the findings to","t":"RM","id":291},{"q":"What is a sample?","a":"The group of people who actually take part in the study, taken from the target population","t":"RM","id":292},{"q":"How does the target population link to generalisability?","a":"If the sample represents the target population, the results can be generalised to it","t":"RM","id":293},{"q":"What is random sampling?","a":"Every member of the target population has an equal chance of being selected, e.g. names from a hat","t":"RM","id":294},{"q":"Why might a random sample still be unrepresentative?","a":"By chance, it might pick lots of people with similar characteristics","t":"RM","id":295},{"q":"What is opportunity sampling?","a":"Using people who are available at the time","t":"RM","id":296},{"q":"Why is an opportunity sample unlikely to be representative?","a":"It only includes people who happen to be there, who may share characteristics","t":"RM","id":297},{"q":"What is systematic sampling?","a":"Selecting every nth person from a list of the target population","t":"RM","id":298},{"q":"Who has a chance of being selected in a systematic sample?","a":"Only people in the nth positions on the list","t":"RM","id":299},{"q":"What is stratified sampling?","a":"Selecting people in proportion to subgroups in the target population","t":"RM","id":300},{"q":"What is selector (researcher) bias?","a":"When the researcher chooses participants who suit their hypothesis","t":"RM","id":301},{"q":"Why is selector bias an extraneous variable?","a":"The researcher's choices, not the IV, may affect the results","t":"RM","id":302},{"q":"What are the three experimental designs?","a":"Independent groups, Repeated measures, Matched pairs","t":"RM","id":303},{"q":"What is independent groups design?","a":"Different participants take part in each condition","t":"RM","id":304},{"q":"What is repeated measures design?","a":"The same participants take part in all conditions","t":"RM","id":305},{"q":"What is matched pairs design?","a":"Participants are matched on key characteristics and one of each pair goes into each condition","t":"RM","id":306},{"q":"What are the two order effects?","a":"Practice effect, Fatigue (boredom) effect","t":"RM","id":307},{"q":"Which design reduces participant variables?","a":"Repeated measures (or matched pairs)","t":"RM","id":308},{"q":"Why are few studies a matched pairs design?","a":"Matching participants is time-consuming and difficult","t":"RM","id":309},{"q":"What is random allocation?","a":"Using chance to decide which group each participant goes into","t":"RM","id":310},{"q":"Why do standardised procedures increase reliability?","a":"Everyone experiences the same procedure, so the study can be repeated and results compared","t":"RM","id":311},{"q":"What is a correlation?","a":"The relationship between two co-variables","t":"RM","id":312},{"q":"What is a positive correlation?","a":"As one variable increases, the other increases","t":"RM","id":313},{"q":"What is a negative correlation?","a":"As one variable increases, the other decreases","t":"RM","id":314},{"q":"What is a zero correlation?","a":"No relationship between the variables","t":"RM","id":315},{"q":"How is a correlation displayed?","a":"On a scattergram (scatter graph)","t":"RM","id":316},{"q":"What does a correlation coefficient of -0.8 show?","a":"A strong negative correlation","t":"RM","id":317},{"q":"What range of values can a correlation coefficient take?","a":"From -1 to +1","t":"RM","id":318},{"q":"Write a correlational hypothesis.","a":"There will be a positive correlation between height and shoe size","t":"RM","id":319},{"q":"Why do psychologists rarely find causation in correlations?","a":"Correlations only show a relationship – another variable could cause both","t":"RM","id":320},{"q":"Give a strength of correlations.","a":"They can be used when it would be unethical to manipulate variables, and can show relationships to study further","t":"RM","id":321},{"q":"Give a weakness of correlations.","a":"They can't show cause and effect, and need numerical data","t":"RM","id":322},{"q":"What is an anomalous result?","a":"An extreme score that doesn't fit the pattern of the other results","t":"RM","id":323},{"q":"If an observation is controlled, is it likely to have high or low internal and external validity?","a":"High internal validity but low external (ecological) validity","t":"RM","id":324},{"q":"Why might a covert observation be unethical?","a":"Participants don't know they are being watched, so they can't give informed consent","t":"RM","id":325},{"q":"Why are demand characteristics a problem in overt observations?","a":"Participants know they are being watched so may change their behaviour","t":"RM","id":326},{"q":"Why can the observer being a participant reduce validity?","a":"They may become too involved and lose objectivity","t":"RM","id":327},{"q":"Why are longitudinal studies often subject to researcher bias?","a":"The researcher spends a long time with participants and may become attached or subjective","t":"RM","id":328},{"q":"What is social influence?","a":"The effects that other people can have on our opinions or behaviour","t":"Social influence","id":329},{"q":"What is conformity?","a":"Changing your opinions or behaviour to fit in with a group, because of real or imagined group pressure","t":"Social influence","id":330},{"q":"What is normative social influence?","a":"Conforming because we want to be liked and accepted by the group, to avoid rejection","t":"Social influence","id":331},{"q":"What is informational social influence?","a":"Conforming because we want to be right – we assume others know better, especially in ambiguous situations","t":"Social influence","id":332},{"q":"Who proposed normative and informational social influence?","a":"Deutsch and Gerard","t":"Social influence","id":333},{"q":"What is a social (situational) factor?","a":"A feature of the situation or other people that affects our behaviour","t":"Social influence","id":334},{"q":"What is a dispositional factor?","a":"A personal characteristic (e.g. personality) that affects our behaviour","t":"Social influence","id":335},{"q":"Identify the three social factors that affect conformity.","a":"Group size, Anonymity, Task difficulty","t":"Social influence","id":336},{"q":"Identify two dispositional factors that affect conformity.","a":"Personality (locus of control), Expertise","t":"Social influence","id":337},{"q":"In what decade was Asch's study of conformity?","a":"The 1950s (1951)","t":"Social influence","id":338},{"q":"What was Asch's aim?","a":"To see whether people would conform to a majority giving an obviously wrong answer","t":"Social influence","id":339},{"q":"In what country was Asch's study conducted?","a":"The USA","t":"Social influence","id":340},{"q":"What gender were the participants in Asch's study?","a":"All male (American college students)","t":"Social influence","id":341},{"q":"Describe the procedure of Asch's study.","a":"A real participant sat with a group of confederates and they each said aloud which of three comparison lines matched a stimulus line; on critical trials the confederates all gave the same wrong answer","t":"Social influence","id":342},{"q":"How many confederates were there in each run of Asch's original experiment?","a":"7–8 confederates (with one real participant)","t":"Social influence","id":343},{"q":"How many critical trials were there in Asch's study?","a":"12 (out of 18 trials)","t":"Social influence","id":344},{"q":"What was the average conformity rate in Asch's study?","a":"36.8%","t":"Social influence","id":345},{"q":"What percentage of participants conformed at least once in Asch's study?","a":"75%","t":"Social influence","id":346},{"q":"What percentage of participants never conformed in Asch's study?","a":"25%","t":"Social influence","id":347},{"q":"What percentage of participants conformed every time in Asch's study?","a":"5%","t":"Social influence","id":348},{"q":"What did Asch find when he varied group size?","a":"With 2 confederates conformity was 13.6%, with 3 it rose to 31.8%, and adding more made little difference","t":"Social influence","id":349},{"q":"What did Asch find when participants wrote their answers down (anonymity)?","a":"Conformity dropped","t":"Social influence","id":350},{"q":"What did Asch find when he made the task more difficult?","a":"Conformity increased, as participants were less certain and looked to others","t":"Social influence","id":351},{"q":"Is the effect of task difficulty on conformity due to normative or informational social influence?","a":"Informational – people look to others for the right answer","t":"Social influence","id":352},{"q":"Is the effect of anonymity on conformity due to normative or informational social influence?","a":"Normative – when answers are private there is no fear of rejection","t":"Social influence","id":353},{"q":"Give a strength of Asch's study.","a":"Lab experiment with standardised procedures, so it can be replicated and is reliable","t":"Social influence","id":354},{"q":"Give a weakness of Asch's study relating to the task.","a":"Low mundane realism – judging line lengths is not an everyday task","t":"Social influence","id":355},{"q":"Give an ethical issue with Asch's study.","a":"Deception – participants were told it was a vision test; they may have felt embarrassed","t":"Social influence","id":356},{"q":"Why does Asch's study lack generalisability?","a":"Only white, male American college students were used","t":"Social influence","id":357},{"q":"Asch's study lacks temporal validity. What does that mean?","a":"The results may not apply today because the 1950s USA was a very conformist time","t":"Social influence","id":358},{"q":"Write a two-tailed hypothesis for Asch's study.","a":"There will be a difference in the number of wrong answers given when participants are alone and when they are with a group giving wrong answers","t":"Social influence","id":359},{"q":"In a study on conformity, who is the target population?","a":"People in general","t":"Social influence","id":360},{"q":"Who developed locus of control?","a":"Julian Rotter (1966)","t":"Social influence","id":361},{"q":"What is an internal locus of control?","a":"Believing you are mostly responsible for what happens to you","t":"Social influence","id":362},{"q":"What is an external locus of control?","a":"Believing that what happens to you is due to outside forces, like luck or other people","t":"Social influence","id":363},{"q":"Who is more likely to conform – people with an internal or external locus of control?","a":"External locus of control","t":"Social influence","id":364},{"q":"Describe Burger and Cooper's (1979) study.","a":"Participants rated cartoons for funniness beside a confederate who gave his ratings aloud; people with an external locus of control agreed with the confederate more","t":"Social influence","id":365},{"q":"What personality traits might make a person more likely to conform?","a":"External locus of control, low self-esteem, low confidence, need for approval","t":"Social influence","id":366},{"q":"What is expertise?","a":"Competence, skill or knowledge in a particular area","t":"Social influence","id":367},{"q":"How does being an expert affect your likelihood of conforming?","a":"Experts are less likely to conform because they are confident in their own answer","t":"Social influence","id":368},{"q":"How does having an expert in the group affect conformity?","a":"Others are more likely to conform to the expert, because they assume the expert is right","t":"Social influence","id":369},{"q":"What did Lucas et al. (2006) find?","a":"Students conformed to wrong answers more on difficult maths problems, especially if they thought they were poor at maths","t":"Social influence","id":370},{"q":"Define obedience.","a":"Following direct orders from someone with authority","t":"Social influence","id":371},{"q":"What is the difference between conformity and obedience?","a":"Conformity involves peers and pressure can be imagined; obedience involves a direct order from an authority figure in a hierarchy","t":"Social influence","id":372},{"q":"What was the aim of Milgram's study?","a":"To investigate whether ordinary people would obey an unjust order from an authority figure to harm an innocent person","t":"Social influence","id":373},{"q":"What did Milgram tell participants his study was about?","a":"The effect of punishment on memory and learning","t":"Social influence","id":374},{"q":"Describe the sample in Milgram's study.","a":"40 American men aged 20–50, with jobs from unskilled to professional, recruited by newspaper adverts (volunteer sample)","t":"Social influence","id":375},{"q":"Where was Milgram's study conducted?","a":"Yale University, USA","t":"Social influence","id":376},{"q":"Who was the 'learner' in Milgram's study?","a":"A confederate called Mr Wallace","t":"Social influence","id":377},{"q":"How were roles decided in Milgram's study?","a":"A rigged draw – the real participant was always the 'teacher'","t":"Social influence","id":378},{"q":"What did the participant have to do in Milgram's study?","a":"Give electric shocks (from 15V to 450V) to the learner every time he got an answer wrong","t":"Social influence","id":379},{"q":"What percentage of participants shocked up to 300 volts in Milgram's study?","a":"100%","t":"Social influence","id":380},{"q":"What percentage of participants went to the full 450 volts?","a":"65%","t":"Social influence","id":381},{"q":"How many participants stopped at 300 volts?","a":"5 (12.5%)","t":"Social influence","id":382},{"q":"What signs of stress did Milgram's participants show?","a":"Sweating, trembling, biting lips, groaning, digging nails into hands; three had seizures","t":"Social influence","id":383},{"q":"What did Milgram conclude?","a":"Obedience is due to the situation (e.g. a legitimate authority figure), not personality","t":"Social influence","id":384},{"q":"Give an ethical issue with Milgram's study.","a":"Deception (it wasn't about memory and shocks weren't real), Psychological harm (extreme stress), Right to withdraw was made difficult (prods)","t":"Social influence","id":385},{"q":"Give a strength of Milgram's study.","a":"It was highly controlled with standardised procedures, so it could be replicated","t":"Social influence","id":386},{"q":"Did Milgram's study have gender bias?","a":"Yes – only men were used, so results may not apply to women","t":"Social influence","id":387},{"q":"Why might Milgram's study lack internal validity?","a":"Participants may have guessed the shocks were fake and just played along","t":"Social influence","id":388},{"q":"Give a social factor affecting obedience.","a":"Agency theory, Culture (social hierarchy), Proximity","t":"Social influence","id":389},{"q":"What is Milgram's agency theory?","a":"People obey by acting as an 'agent' for an authority figure, believing the authority will take responsibility","t":"Social influence","id":390},{"q":"What is the autonomous state?","a":"When a person acts on their own free will and feels responsible for their actions","t":"Social influence","id":391},{"q":"What is the agentic state?","a":"When a person sees themselves as carrying out someone else's wishes and not responsible for their actions","t":"Social influence","id":392},{"q":"What is the agentic shift?","a":"Moving from the autonomous state to the agentic state when faced with an authority figure","t":"Social influence","id":393},{"q":"What is moral strain?","a":"The anxiety we feel when we are asked to do something we believe is wrong","t":"Social influence","id":394},{"q":"What is a social hierarchy?","a":"A system where some people have more authority than others, e.g. parents over children","t":"Social influence","id":395},{"q":"How does culture affect obedience?","a":"We learn from our culture to respect authority and social hierarchies","t":"Social influence","id":396},{"q":"How does location affect obedience?","a":"Obedience fell when Milgram moved the study from prestigious Yale to a run-down office, because authority seemed less legitimate","t":"Social influence","id":397},{"q":"How does proximity to the victim affect obedience?","a":"When the participant was closer to the learner, obedience fell because moral strain increased","t":"Social influence","id":398},{"q":"How does proximity to the authority figure affect obedience?","a":"When the experimenter gave orders by phone, obedience fell","t":"Social influence","id":399},{"q":"How does a uniform affect obedience?","a":"A uniform (e.g. a lab coat) is a visual symbol of authority, so it increases obedience","t":"Social influence","id":400},{"q":"Give an example of how someone may make their authority legitimate.","a":"Wearing a uniform, being in a prestigious setting, or having an official title","t":"Social influence","id":401},{"q":"What is the 'obedience alibi' criticism of Milgram?","a":"His situational explanation could excuse people for terrible acts, e.g. Nazis saying they were just following orders","t":"Social influence","id":402},{"q":"Whose theory is the authoritarian personality?","a":"Adorno (1950)","t":"Social influence","id":403},{"q":"What is the authoritarian personality?","a":"A personality type with exaggerated respect for authority, who obeys orders and looks down on people of lower status","t":"Social influence","id":404},{"q":"What relationship with parents did Adorno find people with an authoritarian personality had?","a":"Very strict parents who used harsh discipline and conditional love","t":"Social influence","id":405},{"q":"What questionnaire did Adorno use?","a":"The F-scale (fascism scale)","t":"Social influence","id":406},{"q":"Give a weakness of Adorno's research.","a":"It used a flawed questionnaire (the F-scale) created by Adorno, and it is correlational so can't show cause","t":"Social influence","id":407},{"q":"What is the difference between Milgram's and Adorno's explanations of obedience?","a":"Milgram says obedience is caused by the situation; Adorno says it is caused by personality (disposition)","t":"Social influence","id":408},{"q":"What is a bystander?","a":"A person who witnesses an event where someone needs help","t":"Social influence","id":409},{"q":"What is bystander intervention?","a":"When a person helps someone in need","t":"Social influence","id":410},{"q":"What is bystander apathy?","a":"When people do not help someone in need","t":"Social influence","id":411},{"q":"What is diffusion of responsibility?","a":"Being less likely to help when other bystanders are present, because responsibility is shared","t":"Social influence","id":412},{"q":"What is pluralistic ignorance?","a":"When no-one helps because everyone assumes the situation isn't an emergency, as no-one else is reacting","t":"Social influence","id":413},{"q":"Who was Kitty Genovese?","a":"A woman murdered in New York in 1964; many neighbours heard or saw the attack but didn't intervene","t":"Social influence","id":414},{"q":"Describe Latané and Darley's (1968) smoke-filled room study.","a":"Participants filled in a survey as a room filled with smoke, either alone, with 2 confederates who ignored it, or with 2 real participants; people alone were much more likely to report it","t":"Social influence","id":415},{"q":"What was Piliavin's study called
