,"t":"Brain & neuropsychology","id":1365},{"q":"Give an ethical issue with Penfield's study.","a":"Patients were having brain surgery and may have been in a vulnerable state to consent","t":"Brain & neuropsychology","id":1366},{"q":"Why is Penfield's study high in reliability?","a":"The procedure was repeated on over 1,000 patients","t":"Brain & neuropsychology","id":1367},{"q":"Why is Penfield's study not very generalisable?","a":"Only a small percentage showed interpretive cortex responses and all had epilepsy","t":"Brain & neuropsychology","id":1368},{"q":"Give an ethical issue with Tulving's study.","a":"Participants were injected with a radioactive substance","t":"Brain & neuropsychology","id":1369},{"q":"Why might Tulving's study show researcher bias?","a":"Tulving and his wife were participants, and they knew the aim","t":"Brain & neuropsychology","id":1370},{"q":"How could brain scanning research be applied?","a":"Diagnosing brain damage and tumours, and understanding mental illnesses","t":"Brain & neuropsychology","id":1371},{"q":"Give a strength of the fight or flight response.","a":"It helps survival by preparing the body to deal with danger quickly","t":"Brain & neuropsychology","id":1372},{"q":"Why can the fight or flight response be unhelpful today?","a":"Modern stressors (like exams) aren't physical threats, so the response can cause anxiety and health problems","t":"Brain & neuropsychology","id":1373},{"q":"What does the sympathetic nervous system do to the pupils?","a":"Dilates them","t":"Brain & neuropsychology","id":1374},{"q":"What does the parasympathetic nervous system do to heart rate?","a":"Slows it down","t":"Brain & neuropsychology","id":1375},{"q":"What does the sympathetic nervous system do to saliva?","a":"Reduces saliva production (dry mouth)","t":"Brain & neuropsychology","id":1376},{"q":"Give a strength of localisation of function.","a":"Supported by case studies such as Tan (Broca) and brain scans","t":"Brain & neuropsychology","id":1377},{"q":"Give a weakness of localisation of function.","a":"Some functions involve many areas working together, and the brain can reorganise after damage (plasticity)","t":"Brain & neuropsychology","id":1378},{"q":"What is brain plasticity?","a":"The brain's ability to change and form new connections as a result of learning or after damage","t":"Brain & neuropsychology","id":1379},{"q":"Why is Hebb's theory useful for rehabilitation?","a":"If the brain can form new connections, people may regain skills after damage through practice","t":"Brain & neuropsychology","id":1380},{"q":"What is the role of the hypothalamus in fight or flight?","a":"It detects a threat and activates the sympathetic nervous system","t":"Brain & neuropsychology","id":1381},{"q":"Jess remembers her first day at secondary school and how nervous she felt. Which type of memory is this?","a":"Episodic memory","t":"Memory","id":1382},{"q":"Jess knows that water boils at 100°C. Which type of memory is this?","a":"Semantic memory","t":"Memory","id":1383},{"q":"Jess can tie her shoelaces without thinking. Which type of memory is this?","a":"Procedural memory","t":"Memory","id":1384},{"q":"Ali repeats a phone number over and over until he dials it. What is this?","a":"Maintenance rehearsal","t":"Memory","id":1385},{"q":"Ali remembers a list better by grouping the numbers into threes. What is this?","a":"Chunking","t":"Memory","id":1386},{"q":"A student learns French then Spanish and mixes up words. If Spanish words get in the way of recalling French, which interference is this?","a":"Retroactive interference","t":"Memory","id":1387},{"q":"A student revises in the exam hall and recalls more in the exam. Which factor affecting memory explains this?","a":"Context","t":"Memory","id":1388},{"q":"A witness 'remembers' a detail that was only suggested by a police officer. What is this?","a":"A false memory","t":"Memory","id":1389},{"q":"When retelling a film, Sara leaves out many details and adds some exciting ones. Which processes are these?","a":"Levelling and sharpening","t":"Memory","id":1390},{"q":"A student remembers the first and last items on a shopping list. What explains this?","a":"The serial position effect (primacy and recency)","t":"Memory","id":1391},{"q":"Give a strength of Bartlett's study.","a":"It used a realistic task (a story) rather than word lists, so it had more mundane realism than lab memory studies","t":"Memory","id":1392},{"q":"Give an ethical issue with Bartlett's study.","a":"There were few ethical issues – participants just recalled a story","t":"Memory","id":1393},{"q":"Give a strength of McGeoch and McDonald's study.","a":"It was a controlled lab experiment with standardised word lists","t":"Memory","id":1394},{"q":"Give a weakness of McGeoch and McDonald's study.","a":"Small sample (12) and artificial word lists, so it lacks mundane realism","t":"Memory","id":1395},{"q":"What was the IV in McGeoch and McDonald's study?","a":"The type of second list learned (synonyms, antonyms, unrelated words, etc.)","t":"Memory","id":1396},{"q":"What was the DV in McGeoch and McDonald's study?","a":"Recall of the original word list","t":"Memory","id":1397},{"q":"What design was Godden and Baddeley's study?","a":"Repeated measures – each diver took part in all four conditions","t":"Memory","id":1398},{"q":"What sampling method did Godden and Baddeley use?","a":"Volunteer/opportunity sampling – members of a diving club","t":"Memory","id":1399},{"q":"What was the DV in Godden and Baddeley's study?","a":"The number of words recalled","t":"Memory","id":1400},{"q":"What sampling method did Loftus and Pickrell use?","a":"Volunteers (participants recruited with their relatives' help)","t":"Memory","id":1401},{"q":"Give a strength of Loftus and Pickrell's study.","a":"Real childhood events were used, and relatives confirmed which stories were true","t":"Memory","id":1402},{"q":"How could the multi-store model be applied to revision?","a":"Rehearse information repeatedly to transfer it to LTM, and pay attention to avoid losing it from sensory memory","t":"Memory","id":1403},{"q":"How could interference research be applied to revision?","a":"Don't revise similar subjects back-to-back; leave gaps between similar topics","t":"Memory","id":1404},{"q":"Why might context effects be weak in everyday life?","a":"Most everyday contexts aren't as different as land and underwater","t":"Memory","id":1405},{"q":"Give a weakness of the theory of reconstructive memory.","a":"It doesn't explain why some memories (e.g. important events) are very accurate","t":"Memory","id":1406},{"q":"How does Clive Wearing's case support the idea of separate memory types?","a":"He lost episodic memory but kept procedural memory (playing piano)","t":"Memory","id":1407},{"q":"Write a null hypothesis for Godden and Baddeley's study.","a":"There will be no difference in recall whether the learning and recall environments match or not","t":"Memory","id":1408},{"q":"Give an ethical issue with Godden and Baddeley's study.","a":"Diving in cold water could be risky, so participants needed protection from harm","t":"Memory","id":1409},{"q":"Dan has felt low for three weeks, has stopped enjoying football and can't sleep. Could he be diagnosed with depression?","a":"Possibly – symptoms have lasted over 2 weeks, but a doctor would check how many ICD symptoms he has and rule out physical causes","t":"Psychological problems","id":1410},{"q":"Ruby feels extremely excited, talks fast and hardly sleeps, but was very low last month. Which disorder might she have?","a":"Bipolar depression (bipolar affective disorder)","t":"Psychological problems","id":1411},{"q":"Zak thinks 'I failed because I'm stupid, I'll always be stupid, and I ruin everything'. Which attributional style is this?","a":"Internal, stable and global","t":"Psychological problems","id":1412},{"q":"Chloe thinks 'I failed because the test was unfair and it's just this once'. Which attributional style is this? const TOPICS = [
  {key:"Memory", name:"Memory", c:"#3B7DD8"},
  {key:"Perception", name:"Perception", c:"#D98E0F"},
  {key:"Development", name:"Development", c:"#6E9E1E"},
  {key:"RM", name:"Research methods", c:"#2596B0"},
  {key:"Social influence", name:"Social influence", c:"#E0533D"},
  {key:"Language, thought & communication", name:"Language & communication", c:"#D6478F"},
  {key:"Brain & neuropsychology", name:"Brain & neuro", c:"#7B5BE0"},
  {key:"Psychological problems", name:"Psychological problems", c:"#4A58B8"}
];
const TMAP = Object.fromEntries(TOPICS.map(t=>[t.key,t]));
const BY_ID = Object.fromEntries(DATA.map(d=>[d.id,d]));

/* ---------- storage ---------- */
const KEY = "rr-psych-gcse-v1";
let store = {p:{}, sel:TOPICS.map(t=>t.key), all:TOPICS.map(t=>t.key)};
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.p){ store.p = s.p; if(Array.isArray(s.sel)){ const seen=new Set(Array.isArray(s.all)?s.all:s.sel.concat([])); store.sel = [...new Set(s.sel.map(k=>k.startsWith("Issues and Debates")?"Issues and Debates part I":k))].filter(k=>TMAP[k]).concat(TOPICS.map(t=>t.key).filter(k=>!seen.has(k))); } } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
const status = id => store.p[id] || "";
function mark(id, s){ if(s) store.p[id]=s; else delete store.p[id]; save(); renderMeter(); renderChips(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function splitTop(s){ const out=[]; let d=0, cur=""; for(let i=0;i<s.length;i++){const ch=s[i]; if(ch==="(")d++; if(ch===")")d=Math.max(0,d-1); if(ch===","&&d===0&&s[i+1]===" "){out.push(cur.trim());cur="";i++;continue;} cur+=ch;} if(cur.trim())out.push(cur.trim()); return out; }
function fmtAnswer(a,id){
  const parts = splitTop(a);
  if(parts.length>=2 && parts.every(p=>p.length<95 && !/\.\s/.test(p)) && (!(id>=1000) || parts.every(p=>/^[A-Z0-9]/.test(p)))){
    return "<ul>"+parts.map(p=>"<li>"+esc(p.charAt(0).toUpperCase()+p.slice(1))+"</li>").join("")+"</ul>";
  }
  return "<p style='margin:0'>"+esc(a)+"</p>";
}
function pool(){ const s=new Set(store.sel); return DATA.filter(d=>s.has(d.t)); }

/* ---------- meter + chips ---------- */
$("#totalQ").textContent = DATA.length;
function renderMeter(){
  let k=0,l=0; DATA.forEach(d=>{const s=status(d.id); if(s==="k")k++; else if(s==="l")l++;});
  $("#knownCount").textContent=k; $("#learningCount").textContent=l;
  $("#stack").innerHTML = `<i style="width:${k/DATA.length*100}%;background:var(--good)"></i><i style="width:${l/DATA.length*100}%;background:var(--warn);opacity:.7"></i>`;
}
function renderChips(){
  $("#chips").innerHTML = TOPICS.map(t=>{
    const items = DATA.filter(d=>d.t===t.key); const k = items.filter(d=>status(d.id)==="k").length;
    const on = store.sel.includes(t.key);
    return `<button class="chip" style="--c:${t.c}" aria-pressed="${on}" data-key="${esc(t.key)}"><span class="row"><span class="dot"></span>${esc(t.name)}</span><span class="foot2"><span class="bar"><i style="width:${items.length?k/items.length*100:0}%"></i></span><span class="n">${k}/${items.length}</span></span></button>`;
  }).join("");
}
$("#chips").addEventListener("click", e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const k=b.dataset.key; store.sel = store.sel.includes(k)? store.sel.filter(x=>x!==k) : [...store.sel,k];
  save(); renderChips(); topicsChanged();
});
$("#allTopics").onclick=()=>{store.sel=TOPICS.map(t=>t.key);save();renderChips();topicsChanged();};
$("#noTopics").onclick=()=>{store.sel=[];save();renderChips();topicsChanged();};
function topicsChanged(){ newDeck(); if(quiz.phase!=="run") renderQuiz(); renderBrowse(); }

/* ---------- tabs ---------- */
let tab="cards";
document.querySelectorAll("[role=tab]").forEach(b=>b.addEventListener("click",()=>{
  tab=b.dataset.tab;
  document.querySelectorAll("[role=tab]").forEach(x=>x.setAttribute("aria-selected", x===b));
  document.querySelectorAll(".panel").forEach(p=>p.hidden = p.id!=="p-"+tab);
  if(tab==="browse") renderBrowse();
}));

/* ---------- flashcards ---------- */
let filter="all", deck=[], pos=0, flipped=false, sessionRes={};
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.filter; document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",x===b)); newDeck();
}));
$("#shuffleBtn").onclick=newDeck;
function newDeck(){
  let p = pool();
  if(filter==="notknown") p=p.filter(d=>status(d.id)!=="k");
  if(filter==="learning") p=p.filter(d=>status(d.id)==="l");
  deck=shuffle(p).map(d=>d.id); pos=0; flipped=false; sessionRes={}; renderCard();
}
function renderCard(){
  const area=$("#cardArea");
  if(!store.sel.length){ area.innerHTML=`<div class="empty"><h3>Pick a topic to start</h3><p>Tap one or more topics above and your flashcards will appear here.</p></div>`; return; }
  if(!deck.length){
    const msg = filter==="learning" ? ["Nothing marked as still learning","When you mark a card as still learning, it will show up here so you can go over it again."] : ["You know every card here","Every question in these topics is marked as known. Try another topic, or switch to all cards for a refresher."];
    area.innerHTML=`<div class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p></div>`; return;
  }
  if(pos>=deck.length){
    const vals=Object.values(sessionRes), k=vals.filter(v=>v==="k").length, l=vals.filter(v=>v==="l").length;
    area.innerHTML=`<div class="empty"><h3>Deck finished</h3><p>You marked ${k} as got it and ${l} as still learning.${l?" Go round again on the ones that didn't stick yet.":" Nice work."}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${l?'<button class="btn" id="againL">Go again: still learning</button>':''}<button class="btn ghost" id="againAll">Shuffle a new deck</button></div></div>`;
    const a=$("#againL"); if(a) a.onclick=()=>{ deck=shuffle(Object.keys(sessionRes).filter(id=>sessionRes[id]==="l").map(Number)); pos=0; sessionRes={}; flipped=false; renderCard(); };
    $("#againAll").onclick=newDeck; return;
  }
  const d=BY_ID[deck[pos]], t=TMAP[d.t], st=status(d.id);
  const stLabel = st==="k"?'<span class="pill k">Known</span>':st==="l"?'<span class="pill l">Still learning</span>':'';
  area.innerHTML=`
    <div class="progressline"><i style="width:${pos/deck.length*100}%"></i></div>
    <div class="stage">
      <div class="card ${flipped?"flipped":""}" id="card" style="--c:${t.c}" tabindex="0" role="button" aria-label="Flashcard. Press to ${flipped?"see the question":"reveal the answer"}">
        <div class="face front" aria-hidden="${flipped}">
          <div class="tag">${esc(t.name)} <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          <div class="q">${esc(d.q)}</div>
          <div class="hint">Say or write your answer, then tap the card to check. ${stLabel}</div>
        </div>
        <div class="face back" aria-hidden="${!flipped}">
          <div class="tag">Answer <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          <div class="q-small">${esc(d.q)}</div>
          <div class="a">${fmtAnswer(d.a,d.id)}</div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <div class="nav"><button id="prevC" aria-label="Previous card" ${pos===0?"disabled":""}>‹</button><button id="nextC" aria-label="Skip to next card">›</button></div>
      <span id="acts" style="display:contents">${actionsHTML()}</span>
    </div>`;
  const card=$("#card");
  card.onclick=flip; card.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();flip();} };
  $("#prevC").onclick=()=>{ if(pos>0){pos--;flipped=false;renderCard();} };
  $("#nextC").onclick=()=>{ pos++;flipped=false;renderCard(); };
  wireActions();
}
function actionsHTML(){ return flipped
  ? `<button class="btn warn" id="learnBtn">Still learning<kbd>1</kbd></button><button class="btn good" id="gotBtn">Got it<kbd>2</kbd></button>`
  : `<button class="btn" id="flipBtn">Show answer<kbd>Space</kbd></button>`; }
function wireActions(){ if(flipped){ $("#learnBtn").onclick=()=>rate("l"); $("#gotBtn").onclick=()=>rate("k"); } else $("#flipBtn").onclick=flip; }
function flip(){
  const c=$("#card"); if(!c) return;
  const hadFocus = document.activeElement && ["flipBtn","gotBtn","learnBtn"].includes(document.activeElement.id);
  flipped=!flipped; c.classList.toggle("flipped",flipped);
  c.querySelector(".front").setAttribute("aria-hidden",flipped); c.querySelector(".back").setAttribute("aria-hidden",!flipped);
  c.setAttribute("aria-label","Flashcard. Press to "+(flipped?"see the question":"reveal the answer"));
  $("#acts").innerHTML=actionsHTML(); wireActions();
  if(hadFocus) $(flipped?"#gotBtn":"#flipBtn").focus({preventScroll:true});
}
function rate(s){ const id=deck[pos]; sessionRes[id]=s; mark(id,s); pos++; flipped=false; renderCard(); const b=$("#flipBtn"); if(b) b.focus({preventScroll:true}); }
document.addEventListener("keydown",e=>{
  if(tab!=="cards" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  if(pos>=deck.length) return;
  if(e.key===" "){ e.preventDefault(); flip(); }
  else if(flipped && e.key==="1") rate("l");
  else if(flipped && e.key==="2") rate("k");
  else if(e.key==="ArrowRight"){ pos++; flipped=false; renderCard(); }
  else if(e.key==="ArrowLeft" && pos>0){ pos--; flipped=false; renderCard(); }
});

/* ---------- quiz ---------- */
const quiz={phase:"setup", size:10, items:[], i:0, shown:false, answers:[], marks:[]};
function renderQuiz(){
  const area=$("#quizArea");
  if(quiz.phase==="setup"){
    const n=pool().length;
    area.innerHTML=`<div class="empty">
      <h3>Quick quiz</h3>
      <p>Get a random set of questions from your chosen topics. Write your answer, check it against the mark scheme, then be honest about whether you got it.</p>
      <div class="size-pick" role="group" aria-label="Number of questions">${[6,8,10].map(s=>`<button aria-pressed="${quiz.size===s}" data-size="${s}" aria-label="${s} questions">${s}</button>`).join("")}</div>
      <button class="btn" id="startQuiz" ${n?"":"disabled"}>Start ${quiz.size}-question quiz</button>
      ${n?"":'<p style="margin-top:14px">Pick at least one topic above first.</p>'}
    </div>`;
    area.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{quiz.size=+b.dataset.size;renderQuiz();});
    const s=$("#startQuiz"); if(s) s.onclick=()=>{ quiz.items=shuffle(pool()).slice(0,quiz.size).map(d=>d.id); quiz.i=0; quiz.shown=false; quiz.answers=[]; quiz.marks=[]; quiz.phase="run"; renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
    return;
  }
  if(quiz.phase==="run"){
    const d=BY_ID[quiz.items[quiz.i]], t=TMAP[d.t], mine=quiz.answers[quiz.i]||"";
    area.innerHTML=`
      <div class="progressline"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div>
      <div class="quiz-q" style="--c:${t.c}">
        <div class="tag">${esc(t.name)} <span class="muted">Question ${quiz.i+1} of ${quiz.items.length}</span></div>
        <div class="q">${esc(d.q)}</div>
        ${quiz.shown
          ? `<div class="compare"><div><h4>Your answer</h4>${mine?esc(mine).replace(/\n/g,"<br>"):'<span class="muted">You didn\'t write anything.</span>'}</div><div class="model"><h4>Model answer</h4><div class="a" style="font-size:17px">${fmtAnswer(d.a,d.id)}</div></div></div>
             <div class="card-actions"><button class="btn warn" id="qNo">Not quite</button><button class="btn good" id="qYes">I got it</button></div>`
          : `<label for="qAns" class="muted" style="display:block;margin-bottom:6px;font-size:15px">Your answer</label>
             <textarea id="qAns" placeholder="Write what you remember">${esc(mine)}</textarea>
             <div class="card-actions"><button class="btn" id="qShow">Check answer</button></div>`}
      </div>
      <p style="text-align:right;margin-top:10px"><button class="linkbtn" id="qQuit">Quit quiz</button></p>`;
    $("#qQuit").onclick=()=>{quiz.phase="setup";renderQuiz();};
    if(quiz.shown){
      const next=ok=>{ quiz.marks[quiz.i]=ok; mark(d.id, ok?"k":"l"); quiz.i++; quiz.shown=false; if(quiz.i>=quiz.items.length) quiz.phase="done"; renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
      $("#qYes").onclick=()=>next(true); $("#qNo").onclick=()=>next(false);
      $("#qYes").focus({preventScroll:true});
    } else {
      $("#qShow").onclick=()=>{ quiz.answers[quiz.i]=$("#qAns").value.trim(); quiz.shown=true; renderQuiz(); };
    }
    return;
  }
  const score=quiz.marks.filter(Boolean).length, n=quiz.items.length;
  area.innerHTML=`<div class="empty">
    <p class="score">${score}/${n}</p>
    <p style="margin-top:10px">${score===n?"Full marks. Everything here is now marked as known.":score>=n*0.7?"Solid. The ones you missed are saved as still learning.":"The ones you missed are saved as still learning, so you can drill them in Flashcards."}</p>
    <ul class="results">${quiz.items.map((id,i)=>{const d=BY_ID[id];return `<li class="${quiz.marks[i]?"ok":"no"}"><b>${esc(d.q)}</b>${quiz.marks[i]?"":`<div class="ans">${esc(d.a)}</div>`}</li>`}).join("")}</ul>
    <button class="btn" id="qAgain">New quiz</button>
  </div>`;
  $("#qAgain").onclick=()=>{quiz.phase="setup";renderQuiz();};
}

/* ---------- browse ---------- */
let bLimit=60;
$("#search").addEventListener("input",()=>{bLimit=60;renderBrowse();});
function hl(text,q){ const e=esc(text); if(!q) return e; const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"); return e.replace(re,"<mark>$1</mark>"); }
function renderBrowse(){
  const q=$("#search").value.trim(); const ql=q.toLowerCase();
  const items=pool().filter(d=>!ql || d.q.toLowerCase().includes(ql) || d.a.toLowerCase().includes(ql));
  $("#browseCount").textContent = items.length+" question"+(items.length===1?"":"s");
  const shown=items.slice(0,bLimit);
  $("#list").innerHTML = items.length ? shown.map(d=>{
    const t=TMAP[d.t], st=status(d.id);
    return `<details class="item" style="--c:${t.c}" data-id="${d.id}" ${ql&&d.a.toLowerCase().includes(ql)&&!d.q.toLowerCase().includes(ql)?"open":""}>
      <summary><span class="num">${d.id}</span><span class="qt">${hl(d.q,q)}</span>${st==="k"?'<span class="pill k">Known</span>':st==="l"?'<span class="pill l">Learning</span>':''}</summary>
      <div class="body"><div class="a">${ql?"<p style='margin:0'>"+hl(d.a,q)+"</p>":fmtAnswer(d.a,d.id)}</div>
      <div class="mini"><button data-s="l" aria-pressed="${st==="l"}">Still learning</button><button data-s="k" aria-pressed="${st==="k"}">Known</button></div></div>
    </details>`;}).join("")
    : `<div class="empty"><h3>No matches</h3><p>${store.sel.length?"Try a different word, or select more topics above.":"Pick at least one topic above to see its questions."}</p></div>`;
  $("#moreWrap").innerHTML = items.length>bLimit ? `<button class="btn ghost" id="more">Show more (${items.length-bLimit} left)</button>` : "";
  const m=$("#more"); if(m) m.onclick=()=>{bLimit+=120;renderBrowse();};
}
$("#list").addEventListener("click",e=>{
  const b=e.target.closest(".mini button"); if(!b) return;
  const det=b.closest(".item"), id=+det.dataset.id, s=b.dataset.s;
  mark(id, status(id)===s? "" : s);
  const st=status(id);
  det.querySelectorAll(".mini button").forEach(x=>x.setAttribute("aria-pressed", x.dataset.s===st));
  const sum=det.querySelector("summary"); const old=sum.querySelector(".pill"); if(old) old.remove();
  if(st) sum.insertAdjacentHTML("beforeend", st==="k"?'<span class="pill k">Known</span>':'<span class="pill l">Learning</span>');
});

/* ---------- reset ---------- */
$("#resetBtn").onclick=()=>{ if(confirm("Clear all your known and still-learning marks? This can't be undone.")){ store.p={}; save(); renderMeter(); renderChips(); newDeck(); renderBrowse(); } };

renderMeter(); renderChips(); newDeck(); renderQuiz();
</script>
</body>
