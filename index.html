<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Wakefield's Fount of Knowledge and Wisdom (GCSE)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7B5BE0">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fount GCSE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F7; --card:#FFFFFF; --ink:#18203A; --muted:#566082; --line:#D3D9E6; --soft:#E3E8F2;
  --good:#1C8A5E; --good-bg:#DDF3E8; --warn:#B4531B; --warn-bg:#FBE7D9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
    --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
  --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #4D7CFE;outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:.95;letter-spacing:-.02em;margin:0}
h1 span:not(.h1t){display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1.2}
h1 span b{font-weight:500}
.meter{min-width:220px;flex:0 1 300px}
.meter p{margin:0 0 6px;font-size:15px;color:var(--muted)}
.meter b{color:var(--ink);font-family:var(--display);font-size:22px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;width:max-content;max-width:100%;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* topics */
.topics{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:22px}
.topics-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.topics-head h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.chip{--c:#888;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 11px 9px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.chip .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.2}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;opacity:.35}
.chip .foot2{display:flex;align-items:center;gap:8px}
.chip .n{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.chip .bar{flex:1;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip[aria-pressed="true"] .dot{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}

/* shared */
.panel[hidden]{display:none}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:12px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
kbd{font-family:var(--body);font-size:12px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7;margin-left:6px}
.spacer{flex:1}

/* flashcard: the one bold thing */
.stage{perspective:1600px}
.card{--c:#888;position:relative;display:grid;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px 30px 46px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--c);border-radius:20px 0 0 20px}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.tag{font-size:14px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;gap:10px;position:relative}
.tag .muted{font-weight:400}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.01em;margin:auto 0;padding:20px 0}
.face.back .q-small{font-size:15px;color:var(--muted);margin:14px 0 10px;position:relative}
.a{font-size:clamp(18px,2.2vw,21px);line-height:1.55;position:relative;margin-bottom:auto}
.a ul{margin:0;padding-left:1.1em}
.a li{margin:3px 0}
.a li::marker{color:var(--c)}
.hint{position:relative;margin-top:14px;font-size:14px;color:var(--muted)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.card-actions .btn{flex:1 1 120px}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px}
.progressline{height:4px;background:var(--soft);border-radius:4px;margin:0 0 14px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--ink);transition:width .3s}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:40px 28px;text-align:center}
.empty h3{font-family:var(--display);font-size:26px;margin:0 0 8px}
.empty p{margin:0 auto 18px;max-width:46ch;color:var(--muted)}

/* quiz */
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;border-top:10px solid var(--c)}
.quiz-q .q{margin:10px 0 18px;padding:0;font-size:clamp(22px,3vw,30px)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;resize:vertical;font-size:17px;line-height:1.5}
textarea:focus{border-color:var(--c);outline:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.compare > div{border-radius:12px;padding:14px 16px;background:var(--soft)}
.compare h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.compare .model{background:color-mix(in srgb,var(--c) 12%,var(--card))}
@media (max-width:640px){.compare{grid-template-columns:1fr}}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;margin:0}
.results{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:8px}
.results li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 44px;position:relative}
.results li::before{position:absolute;left:14px;top:11px;font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.results li.ok::before{content:"✓";background:var(--good-bg);color:var(--good)}
.results li.no::before{content:"✗";background:var(--warn-bg);color:var(--warn)}
.results li .ans{font-size:15px;color:var(--muted);margin-top:4px}
.size-pick{display:flex;gap:10px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}
.size-pick button{width:74px;height:74px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:28px}
.size-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* browse */
.search{flex:1 1 260px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;font-size:16px}
.search:focus{border-color:var(--ink);outline:none}
.list{display:grid;gap:8px}
.item{--c:#888;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px}
.item summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.item summary::-webkit-details-marker{display:none}
.item summary .num{font-size:13px;color:var(--muted);min-width:2.6em}
.item summary .qt{font-weight:700;flex:1}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.k{background:var(--good-bg);color:var(--good)}
.pill.l{background:var(--warn-bg);color:var(--warn)}
.item .body{padding:0 16px 14px calc(16px + 2.6em + 12px)}
.item .body .a{font-size:17px}
.item .body .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .body .mini button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 12px;font-size:14px}
.item .body .mini button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
mark{background:#FFE17A;color:#18203A;border-radius:3px;padding:0 1px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

@media (max-width:560px){
  .wrap{padding:18px 14px 40px}
  .face{padding:24px 20px 24px 34px}
  .face::before{width:10px}
  .card{min-height:300px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .chip{padding:6px 9px 7px;border-width:1.5px}
  .chip .row{font-size:14px}
  .topics{padding:12px 10px 10px}
  .card-actions .nav{order:3;width:100%;justify-content:center}
  .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .progressline i{transition:none}
}

/* ================= GAME LAYER ================= */
.hud{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px;margin:0 0 18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
.hud .lvl{position:relative;width:50px;height:50px;border:0;background:none;padding:0;flex:none}
.hud .lvl svg{width:50px;height:50px;transform:rotate(-90deg)}
.hud .lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.hud .lvl small{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--paper);border-radius:5px;padding:0 4px}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:5}
.ring-fg{fill:none;stroke:url(#xpGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1)}
.xpbox{flex:1 1 180px;min-width:150px}
.xprow{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.xprow b{font-family:var(--display);font-size:16px}
.xprow span{color:var(--muted);white-space:nowrap}
.xpbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7B5BE0,#D6478F,#F39A3C);transition:width .6s cubic-bezier(.3,.7,.2,1)}
.hud-stat{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;border:0;background:var(--soft);border-radius:12px;padding:8px 11px;white-space:nowrap}
.hud-stat .lab{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.hud-stat .ico{font-size:22px}
.hud-stat.cold .ico{filter:grayscale(1);opacity:.5}
.goalring{width:30px;height:30px;transform:rotate(-90deg);flex:none}
.goalring .ring-fg{stroke:var(--good)}
.goalring .ring-bg{stroke:var(--line)}
.combo{pointer-events:none;display:none;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#F39A3C,#E0533D);border-radius:12px;padding:8px 12px;white-space:nowrap}
.combo.on{display:flex}
.combo.hot{background:linear-gradient(135deg,#D6478F,#7B5BE0)}
.combo.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
.hud-spacer{display:none}
.iconbtn{border:0;background:var(--soft);border-radius:12px;width:42px;height:42px;font-size:19px;flex:none}
@media (max-width:560px){
  .hud{gap:8px;padding:8px 10px;border-radius:14px;margin-bottom:14px}
  .hud{flex-wrap:wrap;row-gap:6px}
  .hud-spacer{display:block;flex:1}
  .xpbox{order:5;flex:1 1 100%;min-width:0}
  .xprow{margin-bottom:3px;font-size:12px}
  .xprow span{display:none}
  .xprow b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xpbar{height:6px}
  .hud .lvl,.hud .lvl svg{width:44px;height:44px}
  .iconbtn{width:36px;height:36px;font-size:16px}
  .combo{position:absolute;right:8px;top:calc(100% + 6px);font-size:16px;padding:6px 10px}
  .hud-stat{font-size:16px;padding:7px 8px;gap:4px}
  .hud-stat .ico{font-size:18px}
  .hud-stat .lab{display:none}
}

/* floaters, toasts, modal, fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.floater{position:fixed;z-index:95;pointer-events:none;font-family:var(--display);font-weight:800;font-size:22px;color:var(--good);text-shadow:0 2px 0 var(--card);animation:floatUp 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.floater.big{font-size:30px;color:#E0A100}
.floater.meh{color:var(--warn);font-size:18px}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-80px}}
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;z-index:96;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .4s cubic-bezier(.2,1.4,.4,1)}
.toast .ti{font-size:30px;line-height:1}
.toast b{display:block;font-family:var(--display);font-size:17px}
.toast span{font-size:14px;opacity:.8}
.toast.out{animation:toastOut .3s forwards}
@media (min-width:900px){#toasts{left:auto;right:20px;transform:none;width:340px}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.overlay{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:rgba(10,14,30,.55);padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.levelup{background:var(--card);border-radius:24px;padding:32px 28px;text-align:center;max-width:360px;width:100%;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.levelup .kick{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);text-transform:uppercase}
.levelup .num{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;margin:6px 0;background:linear-gradient(135deg,#7B5BE0,#D6478F,#F39A3C);-webkit-background-clip:text;background-clip:text;color:transparent}
.levelup h3{font-family:var(--display);font-size:24px;margin:0 0 6px}
.levelup p{color:var(--muted);margin:0 0 20px}

/* golden card */
.card.golden .face{border:2px solid #E0A100;box-shadow:0 0 0 4px color-mix(in srgb,#E0A100 22%,transparent)}
.card.golden .face.front{background:linear-gradient(135deg,color-mix(in srgb,#FFD54A 16%,var(--card)),var(--card) 55%,color-mix(in srgb,#FFD54A 12%,var(--card)))}
.card.golden .face.front::after{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(110deg,transparent 35%,rgba(255,236,150,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.goldtag{color:#B07E00;font-weight:800}
:root[data-theme="dark"] .goldtag{color:#FFD54A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .goldtag{color:#FFD54A}}
.chip .medal{margin-left:auto;font-size:15px}

/* arcade */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{--c:#7B5BE0;position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--c)}
.mode .mi{font-size:40px;line-height:1}
.mode h3{font-family:var(--display);font-size:24px;margin:4px 0 0}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .best{margin-top:auto;padding-top:10px;font-weight:700;font-size:15px;color:var(--c)}
.mode .new{position:absolute;top:14px;right:14px;background:#E0533D;color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.arc-note{margin:14px 2px 0;font-size:14px;color:var(--muted)}
.arc-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-weight:700}
.arc-top .big{font-family:var(--display);font-size:26px;font-weight:800}
.arc-top .spacer{flex:1}
.timebar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,#1C8A5E,#4CC896);border-radius:99px}
.timebar.low i{background:linear-gradient(90deg,#E0533D,#F39A3C)}
.hearts{font-size:22px;letter-spacing:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--c);transform:translateY(-1px)}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:800}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg);animation:shake .35s}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.newbest{display:inline-block;background:linear-gradient(135deg,#F39A3C,#E0533D);color:#fff;font-weight:800;border-radius:99px;padding:4px 14px;margin-bottom:8px;animation:pulse 1.2s infinite}
.share{font-family:ui-monospace,Menlo,monospace;background:var(--soft);border-radius:12px;padding:12px;white-space:pre-wrap;display:inline-block;text-align:left;margin:4px 0 14px;font-size:15px}


.sc{font-family:var(--body);font-weight:400;font-size:17px;line-height:1.5;color:var(--muted);margin:14px 0 0;position:relative}
.q.has-sc{font-size:clamp(20px,2.6vw,26px);padding:10px 0 16px;margin:0}
.quiz-q .sc{margin:10px 0 0}
.def{font-size:clamp(19px,2.4vw,23px);line-height:1.5;margin:12px 0 14px}
.blanks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;align-items:flex-end}
.gapbox{width:26px;height:32px;border-bottom:3px solid var(--c);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px}
.gapbox.on{background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:6px 6px 0 0}
.gapsp{width:14px}
.gapch{font-weight:800;font-size:18px;padding:0 2px}
.gapin{width:100%;font-size:19px}
.gapfb{min-height:26px;margin-top:8px;font-size:16px}
.shake{animation:shake .35s}
.mode.featured{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--card))}
@media (max-width:560px){.gapbox{width:20px;height:28px;font-size:15px}}
.optlist{list-style:upper-alpha;margin:0 0 14px;padding-left:1.6em;font-size:17px;line-height:1.45;position:relative}
.optlist li{margin:4px 0}
.optlist li::marker{font-weight:800;color:var(--c)}

/* spaced repetition */
.duebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-bg);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:16px}
.duebar span{flex:1}
/* boss battles */
.bossbar{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--c);border-radius:20px;padding:14px 16px;margin-bottom:10px}
.boss-ico{font-size:58px;line-height:1;flex:none;transition:transform .1s}
.boss-ico.big{font-size:90px;margin-bottom:6px}
.boss-ico.hit{animation:bossHit .45s}
@keyframes bossHit{20%{transform:translateX(-10px) rotate(-8deg);filter:brightness(2)}50%{transform:translateX(10px) rotate(6deg)}80%{transform:translateX(-4px)}}
.boss-info{flex:1;min-width:0}
.boss-info b{font-family:var(--display);font-size:20px;display:block}
.hp{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 2px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#B91C1C,#EF4444);border-radius:99px;transition:width .4s cubic-bezier(.3,.7,.2,1)}
.boss-info .muted{font-size:13px}
.boss-say{font-style:italic;font-size:14px;color:var(--warn);min-height:1.2em}
.boss-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
#arcArea.hurt{animation:hurt .4s}
@keyframes hurt{0%{box-shadow:inset 0 0 0 0 rgba(224,83,61,0)}30%{box-shadow:inset 0 0 0 9999px rgba(224,83,61,.12)}100%{box-shadow:inset 0 0 0 0 rgba(224,83,61,0)}}
@media (max-width:560px){.boss-ico{font-size:42px}.bossbar{gap:10px;padding:12px}.boss-info b{font-size:17px}}
/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.theme .sw{display:flex;gap:4px;margin-bottom:4px}
.theme .sw i{width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.12)}
.theme b{font-size:15px}
.theme span:last-child{font-size:13px;color:var(--muted)}
.theme.on{border-color:var(--ink)}
.theme:disabled{opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){.boss-ico.hit,#arcArea.hurt{animation:none}}

/* ---------- teacher page + projector ---------- */
#teacherApp[hidden]{display:none}
.teacher-mode .wrap,.teacher-mode #toasts{display:none}
.t-wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.t-h{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);margin:0;line-height:1.1}
.t-lock{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
.t-err{color:var(--warn);min-height:1.4em;margin:8px 0 0}
.t-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.t-top .spacer{flex:1}
.t-check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted)}
.t-note{font-size:14px;margin-top:18px}
.t-weak ol{margin:0;padding-left:1.3em}.t-weak li{margin:6px 0}
.t-scroll{overflow-x:auto}
.t-table{border-collapse:collapse;width:100%;font-size:15px;min-width:640px}
.t-table th,.t-table td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;white-space:nowrap}
.t-heat td{text-align:center;font-weight:700;font-size:14px}.t-heat td:first-child{text-align:left;font-weight:700}
.t-table tr.t-avg td{border-top:2px solid var(--ink);font-weight:800}
.t-table tr.t-inactive td:first-child::after{content:" 😴"}
.t-sort{border:0;background:none;font-weight:800;padding:0;font-size:14px;color:var(--ink)}
.proj{max-width:1300px;margin:0 auto;padding:16px 20px 40px;min-height:100vh}
.proj-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:20px}
.proj-bar .spacer{flex:1}
.proj-topic{color:var(--c);font-weight:800}
.proj-time{font-family:var(--display);font-weight:800;font-size:36px;min-width:2.5em;text-align:right}
.proj-setup{display:grid;gap:4px}
.proj-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.proj-names label{display:flex;align-items:center;gap:8px}
.proj-names label span{font-weight:800;width:1.4em}
.proj-names input{flex:1;min-width:0}
.proj-go{font-size:22px;padding:14px 28px}
.proj-card{background:var(--card);border:1px solid var(--line);border-top:12px solid var(--c);border-radius:24px;padding:clamp(20px,3vw,40px);min-height:44vh;display:flex;flex-direction:column;justify-content:center}
.proj-sc{font-size:clamp(20px,2.2vw,30px);color:var(--muted);margin-bottom:14px;line-height:1.4}
.proj-q{font-family:var(--display);font-weight:800;font-size:clamp(32px,4.4vw,64px);line-height:1.12}
.proj-opts{margin:22px 0 0;padding-left:1.4em;list-style:upper-alpha;font-size:clamp(22px,2.4vw,34px);line-height:1.35}
.proj-opts li{margin:8px 0;padding:4px 10px;border-radius:12px}
.proj-opts li.right{background:var(--good-bg);color:var(--good);font-weight:800}
.proj-opts li.dim{opacity:.35}
.proj-a{margin-top:24px;padding:18px 22px;border-radius:16px;background:color-mix(in srgb,var(--c) 12%,var(--card))}
.proj-a .a{font-size:clamp(22px,2.6vw,36px)}
.proj-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.proj-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.proj-team{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px 16px;font-size:20px;text-align:left}
.proj-team b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-team .k{font-weight:800;color:var(--muted);font-size:15px}
.proj-team .pts{font-family:var(--display);font-weight:800;font-size:36px}
.proj-team.won{border-color:var(--good);background:var(--good-bg);animation:bump .3s}
.proj-team:disabled{cursor:default;opacity:1}
.proj-win{font-family:var(--display);font-weight:800;font-size:clamp(36px,5vw,72px);text-align:center;margin:20px 0}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;max-width:760px;margin:0 auto 20px}
.pod{text-align:center;font-size:22px}.pod b{display:block;font-family:var(--display);font-size:26px}
.pod .block{margin-top:8px;border-radius:14px 14px 0 0;color:#fff;font-family:var(--display);font-weight:800;font-size:48px;display:grid;place-items:center}
.pod.p1 .block{height:220px;background:linear-gradient(#E0A100,#B07E00)}
.pod.p2 .block{height:160px;background:linear-gradient(#9AA4B5,#6B7487)}
.pod.p3 .block{height:110px;background:linear-gradient(#C8783A,#9A5422)}
@media print{
  .t-noprint,.t-top button,.proj-bar button{display:none!important}
  body{background:#fff}
  .box,.tile{break-inside:avoid}
}

/* today's plan */
.plan{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 16px}
.plan:empty{display:none}
.plan-count{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:17px}
.plan-count > span{flex:1;min-width:200px}
.plan-days{font-family:var(--display);font-size:24px}
.plan-btn{padding:6px 12px;font-size:14px}
.plan-tasks{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-h{font-family:var(--display);font-size:16px;margin-right:4px}
.task{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font-size:15px;text-align:left}
.task.done{background:var(--good-bg);border-color:transparent;color:var(--ink)}
.task.done span:last-child{text-decoration:line-through;text-decoration-color:var(--good)}
.task:disabled{cursor:default;opacity:1}
.plan-bonus{font-size:14px;color:var(--muted);margin-left:auto}
.plan-bonus.got{color:var(--good);font-weight:700}
@media (max-width:560px){.plan{padding:10px 12px}.task{width:100%}.plan-bonus{margin-left:0}}

/* 9-mark practice */
#extArea[hidden],#quizArea[hidden],#skillArea[hidden],#mockArea[hidden],#parentArea[hidden]{display:none}
.parent-box h4{margin:16px 0 8px}
.parent-box h4 small{font-weight:400}
.parent-how{margin:0 0 6px;padding-left:22px;line-height:1.6}
.parent-topics{display:flex;flex-wrap:wrap;gap:6px}
.parent-q .q{font-size:24px;line-height:1.35}
.parent-ans{background:var(--good-bg);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;flex-direction:column;gap:4px}
.parent-ans b{font-size:20px;line-height:1.4}
.parent-rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:560px){.parent-rate{grid-template-columns:1fr}}
.seg{flex-wrap:wrap}
.mock-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.mock-resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-left:6px solid #1C8A5E}
.mock-resume .spacer,.mock-bar .spacer{flex:1}
.mock-bar{position:sticky;top:76px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:10px}
.mock-tabs{margin-bottom:6px}
@media (max-width:700px){.mock-bar{position:static}}
.mock-opts{display:grid;gap:6px}
.mock-opts .opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.mock-model summary{cursor:pointer;font-weight:700;margin:8px 0}
.mock-row{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;margin:6px 0;font-size:15px}
.mock-row .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.mock-row .bar i{display:block;height:100%}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sk-card{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid #9A6324;border-radius:12px;padding:12px 14px}
.sk-card:hover{background:var(--soft)}
.sk-ic{font-size:28px;line-height:1}
.sk-tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.sk-tx b{font-size:16px;line-height:1.3}
.sk-no{font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.sk-tag{font-size:14px;color:var(--muted);line-height:1.35}
.sk-pr{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.sk-pr .bar{flex:1;height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.sk-pr .bar i{display:block;height:100%;background:#9A6324}
.sk-method{border-left:6px solid #9A6324}
.sk-method h3{font-family:var(--display);font-size:24px;margin:2px 0 4px}
.sk-lead{font-size:17px;font-weight:700;margin:0 0 10px}
.sk-steps{margin:0 0 12px;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.sk-steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:4px 10px;align-items:start}
.sk-steps li::before{content:counter(s);grid-row:span 2;width:30px;height:30px;border-radius:50%;background:#9A6324;color:#fff;font-weight:800;display:grid;place-items:center}
.sk-steps li span{color:var(--ink);font-size:15px;line-height:1.4}
.sk-watch{background:var(--soft);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:15px;line-height:1.45}
.sk-h{font-family:var(--display);font-size:20px;margin:18px 0 10px}
.sk-h .muted{font-family:var(--body);font-size:14px;font-weight:400}
.sk-item{margin-bottom:12px}
.sk-nav{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap;scroll-margin-top:90px}
.sk-dots{display:flex;flex-wrap:wrap;gap:4px;flex:1;min-width:0}
@media (max-width:700px){.sk-dots{order:-1;flex:1 1 100%}.sk-nav #skRand{margin-left:auto}}
.sk-dot{min-width:32px;height:32px;border-radius:8px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:13px}
.sk-dot.done{background:var(--good-bg);border-color:var(--good)}
.sk-dot[aria-current="true"]{border-color:#9A6324;box-shadow:0 0 0 2px #9A6324 inset}
.sk-ih{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.sk-done{font-size:13px;font-weight:700;color:var(--good)}
.sk-stim p{margin:0 0 8px}
.sk-tw{overflow-x:auto;margin:4px 0 8px}
.sk-t{border-collapse:collapse;font-size:14px}
.sk-t th,.sk-t td{border:1px solid var(--line);padding:4px 8px;text-align:center}
.sk-t th:first-child{text-align:left}
.sk-part{margin:10px 0}
.sk-q{margin:0 0 6px;font-size:16px;line-height:1.4}
.sk-m{color:var(--muted);font-size:14px;white-space:nowrap}
.sk-ans{width:100%;font-size:16px}
.sk-mine{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:6px}
.sk-ms{background:var(--good-bg);border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.45;margin:6px 0}
.sk-ms ul{margin:4px 0 0;padding-left:20px}
.sk-give{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:15px}
.sk-mb{min-width:40px;min-height:40px;border:2px solid var(--line);background:var(--paper);border-radius:10px;font-weight:800}
.sk-mb[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg)}
.sk-tot{font-weight:800;margin-right:auto;align-self:center}
.ext-intro{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.ext-intro h3{font-family:var(--display);font-size:24px;margin:0 0 4px}
.ext-intro p{margin:0;max-width:62ch}
.ext-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.extf{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px;font-weight:700;color:var(--muted)}
.extf[aria-pressed="true"]{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 10%,var(--card))}
.ext-list{display:grid;gap:8px}
.ext-item{--c:#888;display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px 16px}
.ext-item .tag{font-size:13px}
.ext-item b{font-size:16px;line-height:1.35}
.ext-st{font-size:13px;color:var(--muted)}
.ext-q .q.has-sc{margin-bottom:10px}
.ext-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.ext-tools .spacer{flex:1}
.ext-time{font-family:var(--display);font-weight:800;font-size:20px}
.ext-time.low{color:var(--warn)}
.ext-ans{min-height:280px;font-size:17px}
.ext-compare{margin:14px 0}

.ext-mark h4{margin:12px 0 6px;font-size:16px}

.ext-pt{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;font-size:16px;cursor:pointer;border-radius:8px}

.ext-pt input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--good)}
.ext-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.ext-lvl{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 12px}
.ext-lvl span{font-size:14px;color:var(--muted);line-height:1.35}
.ext-lvl[aria-pressed="true"]{border-color:var(--good);background:var(--good-bg)}

/* event banner */
.evbar{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 14px}
.evbar[hidden]{display:none}
.ev{flex:1 1 260px;background:linear-gradient(90deg,#7B5BE0,#D6478F);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:15px;animation:evGlow 3s ease-in-out infinite}
.ev small{font-weight:400;opacity:.9;margin-left:6px}
@keyframes evGlow{50%{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){.ev{animation:none}}

/* certificates */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.certbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid color-mix(in srgb,#E0A100 55%,var(--line));background:color-mix(in srgb,#FFD54A 10%,var(--card));border-radius:14px;padding:12px}
.certbtn .ci{font-size:28px}
.certbtn b{font-size:15px}
.certbtn span:last-child{font-size:13px;color:var(--muted)}
.certbtn.locked{border-color:var(--line);background:var(--paper);opacity:.6;cursor:default}
.cert-overlay{align-content:start;overflow:auto;gap:12px}
.cert-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;justify-content:center;background:var(--card);padding:12px;border-radius:14px;max-width:880px;width:100%}
.cert-tools label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;flex:1 1 220px}
.cert-tools input{flex:none;width:100%}
.cert{width:min(880px,100%);aspect-ratio:297/210;background:#FFFDF6;color:#2A2416;padding:2.2%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:Georgia,"Times New Roman",serif}
.cert-in{height:100%;border:3px double #B8860B;outline:1.5px solid #B8860B;outline-offset:-10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3% 6%;gap:.6em;background:radial-gradient(circle at 50% 40%,#FFF8E1 0,transparent 70%)}
.cert-seal{font-size:clamp(30px,5vw,54px);width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#FFE58A,#D4A017);box-shadow:0 0 0 4px #FFFDF6,0 0 0 6px #B8860B}
.cert-kick{font-family:var(--display);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(14px,2.4vw,26px);color:#8A6508}
.cert-small{margin:0;font-size:clamp(11px,1.6vw,17px);font-style:italic;color:#5A4E33}
.cert-name{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.4vw,58px);line-height:1.05;border-bottom:2px solid #B8860B;padding:0 .4em .1em;min-width:50%}
.cert-ach{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vw,32px);color:#1F3A5F}
.cert-foot{display:flex;justify-content:space-between;width:80%;margin-top:4%;gap:20px}
.cert-foot{align-items:flex-end}
.cert-foot > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1}
.cert-sig{font-size:clamp(12px,2vw,20px);min-height:1.4em}
.cert-sig.sig{font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;font-size:clamp(18px,3.4vw,36px);color:#1F3A5F}
.cert-line{border-top:1px solid #5A4E33;width:100%;font-size:clamp(10px,1.3vw,13px);color:#5A4E33;padding-top:2px}
@media (max-width:700px){.cert{aspect-ratio:auto}.cert-in{padding:8% 6%}.cert-seal{margin-top:6px}}
@page{size:A4 landscape;margin:0}
@media print{
  body.printing-cert > *:not(.cert-overlay){display:none!important}
  body.printing-cert .cert-overlay{position:static;background:none;padding:0;display:block}
  body.printing-cert .cert-tools{display:none}
  body.printing-cert .cert{width:297mm;height:210mm;max-width:none;box-shadow:none;border-radius:0;aspect-ratio:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* secret scrolls */

.scrolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scrollcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px dashed var(--line);background:var(--paper);border-radius:14px;padding:12px}
.scrollcard .si{font-size:26px}.scrollcard b{font-size:15px}.scrollcard span:last-child{font-size:13px;color:var(--muted);font-style:italic}

.scrollcard.got span:last-child{color:#6B5A2E;font-style:normal}
.badge.secret span{font-style:italic}
.scroll{width:min(460px,100%);animation:unroll .7s cubic-bezier(.2,.9,.3,1)}
@keyframes unroll{from{transform:scaleY(.06);opacity:.4}to{transform:none;opacity:1}}
.scroll-rod{height:18px;border-radius:9px;background:linear-gradient(#8A5A2B,#C68A4A,#8A5A2B);margin:0 -10px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.scroll-body{background:linear-gradient(90deg,#E9D6A6,#F8EBC8 15%,#F8EBC8 85%,#E9D6A6);color:#3B2F12;padding:26px 28px;text-align:center;font-family:Georgia,"Times New Roman",serif}

.scroll-body .btn{background:#3B2F12;border-color:#3B2F12;color:#F8EBC8}

.scroll.blues h3,.scroll.blues .scroll-kick{color:#fff}

.gapcard{margin-bottom:0}
.gapcard.golden{border:2px solid #E0A100;border-top:10px solid #E0A100;box-shadow:0 0 0 4px color-mix(in srgb,#E0A100 22%,transparent)}
.install-btn{padding:6px 14px;font-size:14px}
@media (display-mode: standalone){.install-btn{display:none!important}}

.ext-sec{font-family:var(--display);font-weight:800;font-size:14px;margin:12px 0 4px!important;text-transform:uppercase;letter-spacing:.04em}
.ext-sec span{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}

.td-t{background:color-mix(in srgb,#7B5BE0 16%,transparent)}.td-t .tdl{background:#7B5BE0}
.td-d{background:color-mix(in srgb,#2596B0 16%,transparent)}.td-d .tdl{background:#2596B0}

.td-x{background:color-mix(in srgb,#1C8A5E 16%,transparent)}.td-x .tdl{background:#1C8A5E}
.td-key{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px!important}
.fw-tag{display:inline-block;margin:10px 0 2px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ink);color:var(--paper)}

.mt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
.mt-col{display:grid;gap:8px;align-content:start}

.sw-stage{position:relative;min-height:220px;display:grid;place-items:center;margin:12px 0}

.sw-card p{margin:0}

.sw-fb{min-height:24px;text-align:center;margin-top:8px}
.sw-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sw-l{border-color:#2C6BE0!important}.sw-r{border-color:#C2410C!important}
.ws-clues{margin:8px 0 14px;padding-left:24px;display:grid;gap:6px;font-size:18px}

.psy-clue{margin:4px 0 12px;font-size:16px}

.psy-tile{width:clamp(34px,9vw,52px);height:clamp(34px,9vw,52px);display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.5vw,26px);background:var(--card)}

.psy-tile.y,.psy-k.y{background:#D9A400;border-color:#D9A400;color:#fff}
.psy-tile.b,.psy-k.b{background:#6B7280;border-color:#6B7280;color:#fff}
.psy-kb{display:grid;gap:6px;max-width:560px;margin:0 auto}
.psy-kr{display:flex;gap:4px;justify-content:center}
.psy-k{flex:1;min-width:0;max-width:44px;height:48px;border:0;border-radius:8px;background:var(--soft);font-weight:800;font-size:15px;color:var(--ink)}
.psy-k.wide{max-width:72px;flex:1.6;font-size:13px}
.petstrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px 2px 4px;margin:0 0 14px;color:var(--ink);font-size:16px;line-height:1.35}
.petstrip[hidden]{display:none}
.petstrip:hover{background:var(--soft)}
.petstrip .ps-art{flex:none;display:block;line-height:0}
.petstrip .ps-txt{flex:1;min-width:0}
.petstrip .ps-cheese{flex:none;font-size:18px;letter-spacing:2px}
.petstrip .ps-cheese i{font-style:normal;opacity:.25}
.petstrip.sleepy,.petstrip.asleep{border-style:dashed}
.petstrip.ecstatic{border-color:var(--good);background:var(--good-bg)}
@media (max-width:560px){.petstrip{font-size:14px;gap:8px}.petstrip .ps-art svg{width:84px;height:63px}.petstrip .ps-cheese{font-size:14px}}
.petbtn{width:auto;padding:0 4px;overflow:hidden}
.petbtn svg{display:block}
.petbtn.sleepy{filter:saturate(.6)}
.pet-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pet-art{flex:none}
.pet-info{flex:1;min-width:220px}
.pet-msg{margin:0;font-size:17px}
.box .pet-info h3{display:flex;align-items:baseline;gap:8px;justify-content:flex-start}
@media (max-width:560px){.petbtn svg{width:34px;height:26px}.hud{gap:6px!important}.hud .iconbtn{width:36px;min-width:36px;height:38px;padding:0}.hud .petbtn{width:auto;padding:0 2px}.hud .focusbtn{width:auto;min-width:36px;padding:0 6px}.hud .hud-stat{padding-left:8px;padding-right:8px}.hud #hudGoal .goalring{display:none}}
.pet-svg.ecstatic .pet-body{animation:petdance .7s ease-in-out infinite alternate;transform-origin:80px 110px;transform-box:view-box}
.pet-svg.happy .pet-tail{animation:petwag 1s ease-in-out infinite alternate;transform-origin:118px 96px;transform-box:view-box}
.pet-z text{animation:petz 2.4s ease-in-out infinite}
.pet-z text:nth-child(2){animation-delay:.4s}.pet-z text:nth-child(3){animation-delay:.8s}
@keyframes petdance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
@keyframes petwag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes petz{0%,100%{opacity:.2;transform:translateY(4px)}50%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.pet-svg *{animation:none!important}}
.proj-scores.race{grid-template-columns:1fr;gap:8px}
.race-lane{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px;align-items:center}
.race-track{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.race-sq{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--soft);border:2px solid var(--line);font-size:clamp(14px,1.6vw,22px)}
.race-sq.up{background:#DDF3E8}.race-sq.down{background:#FDE3D3}.race-sq.fin{background:#FFF3C4;border-color:#E0A100}
.race-tok{font-style:normal;width:80%;height:80%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:hsl(var(--h) 70% 45%);box-shadow:0 2px 6px rgba(0,0,0,.25);animation:bump .3s}
.gotd-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#FFF3C4,#FFE7A0);border:2px solid #E0A100;border-radius:16px;padding:12px 16px;margin-bottom:14px;color:#3A2A00}
.gotd-bar>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}

.gotd-ico{font-size:30px}
.mode.gotd{outline:3px solid #E0A100;outline-offset:2px}
.gotd-tag{background:#E0A100!important;color:#3A2A00!important}
.hardbtn{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:99px;background:#E0533D;color:#fff;font-weight:800;font-size:13px}
.hardbtn:hover{filter:brightness(1.1)}
.why{margin-top:8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#E0A100 14%,var(--card));font-size:15px;line-height:1.4;color:var(--ink)}
.ord-done{margin:10px 0 12px;padding-left:28px;display:grid;gap:6px}

.ord-done li.ord-empty{background:var(--soft);min-height:38px;border:2px dashed var(--line)}
.ord-pool{display:grid;gap:8px}
.ord-step{cursor:grab}
.ord-step.dragging{opacity:.4}
.ord-grip{color:var(--muted);font-size:18px;line-height:1}
.ord-done li.ord-empty.over{border-color:#9A6324;background:#FFF3C4}
.ord-tip{font-size:14px;margin:8px 0 0}

.ord-step{justify-content:flex-start}
.focusbtn{width:auto;min-width:44px;padding:0 10px;font-weight:800;white-space:nowrap}

.x2{display:inline-block;font-family:var(--body);font-size:11px;font-weight:800;color:#3b2f00;background:#ffe14d;border-radius:2px 2px 6px 2px;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:0;transform:rotate(-4deg);box-shadow:1px 2px 4px rgba(0,0,0,.18)}
.sticky{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;color:#3b2f00;background:linear-gradient(180deg,#fff27a,#ffe14d);padding:8px 10px 7px;margin-left:10px;transform:rotate(-5deg);box-shadow:2px 4px 8px rgba(0,0,0,.18);border-radius:2px 2px 10px 2px;vertical-align:middle;position:relative;letter-spacing:0}
.sticky::before{content:"";position:absolute;top:-6px;left:50%;width:34px;height:12px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06)}
.sticky small{font-family:var(--body);font-size:11px;font-weight:700;margin-top:2px}

.tp-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:5px;background:var(--soft);border-radius:14px}

/* unlockable skins (after the base theme so they win) */
:root[data-skin="night"]{--paper:#121829;--card:#1B233B;--ink:#E9EDF7;--muted:#9CA6C2;--line:#2B3557;--soft:#232C49;--good:#4CC896;--good-bg:#153A2E;--warn:#F39A63;--warn-bg:#3E2616;color-scheme:dark}
:root[data-skin="mint"]{--paper:#E6F4EE;--card:#FFFFFF;--ink:#12312A;--muted:#4F6F66;--line:#C9E2D8;--soft:#D9EEE5;--good:#13805A;--good-bg:#D4F0E3;--warn:#B4531B;--warn-bg:#FBE7D9;color-scheme:light}
:root[data-skin="sunset"]{--paper:#FFF0E6;--card:#FFFFFF;--ink:#3A1F1A;--muted:#7D5A50;--line:#F1D3C2;--soft:#FBE3D4;--good:#1C8A5E;--good-bg:#DDF3E8;--warn:#C2410C;--warn-bg:#FDE3D3;color-scheme:light}

<script>
const DATA = [{"q":"What is encoding?","a":"Changing information into a form that can be stored in the brain","t":"Memory","id":1},{"q":"What are the three types of encoding?","a":"Visual, Acoustic, Semantic","t":"Memory","id":2},{"q":"What is visual encoding?","a":"Storing information as pictures or images","t":"Memory","id":3},{"q":"What is acoustic encoding?","a":"Storing information as sounds","t":"Memory","id":4},{"q":"What is semantic encoding?","a":"Storing information by its meaning","t":"Memory","id":5},{"q":"What is storage?","a":"Holding information in the memory over time so it can be used later","t":"Memory","id":6},{"q":"What is retrieval?","a":"Recovering information from a memory store","t":"Memory","id":7},{"q":"What is the difference between recall and recognition?","a":"Recall is retrieving information without it being present; recognition is identifying information when you see it again","t":"Memory","id":8},{"q":"What is free recall?","a":"Remembering information in any order, without help or cues","t":"Memory","id":9},{"q":"What is cued recall?","a":"Recalling information with the help of a cue or clue","t":"Memory","id":10},{"q":"What is procedural memory?","a":"Stored knowledge used to carry out motor skills and tasks (muscle memory), recalled without conscious effort","t":"Memory","id":11},{"q":"What is semantic memory?","a":"Memory for general knowledge that is shared with other people and is not time-stamped","t":"Memory","id":12},{"q":"What is episodic memory?","a":"Memory for personal experiences and events from your life, which is time-stamped (time, place, people, feelings)","t":"Memory","id":13},{"q":"What is the easy way to tell episodic from semantic memory?","a":"If the memory is about YOU (a personal experience) it is episodic; if it is general knowledge, it is semantic","t":"Memory","id":14},{"q":"Name the three types of long-term memory.","a":"Episodic, Semantic, Procedural","t":"Memory","id":15},{"q":"What is declarative memory?","a":"Memory that can be consciously recalled and put into words ('knowing that') – episodic and semantic memory","t":"Memory","id":16},{"q":"What is non-declarative memory?","a":"Memory that we don't need to consciously recall or put into words ('knowing how') – procedural memory","t":"Memory","id":17},{"q":"Which type of memory is non-declarative?","a":"Procedural memory","t":"Memory","id":18},{"q":"Which types of memory are declarative?","a":"Episodic and semantic memory","t":"Memory","id":19},{"q":"Which brain areas are linked to the three types of long-term memory?","a":"Episodic – right pre-frontal area, Semantic – left pre-frontal area, Procedural – motor cortex","t":"Memory","id":20},{"q":"Who proposed the multi-store model of memory?","a":"Atkinson and Shiffrin (1968)","t":"Memory","id":21},{"q":"What are the three stores of the multi-store model?","a":"Sensory register (sensory memory), Short-term memory, Long-term memory","t":"Memory","id":22},{"q":"What is the capacity of the sensory register?","a":"Very large (e.g. more than a million cells in one eye storing data)","t":"Memory","id":23},{"q":"What is the duration of the sensory register?","a":"Very brief – less than half a second","t":"Memory","id":24},{"q":"What is the encoding of the sensory register?","a":"Modality specific – it depends on the sense (visual, auditory etc.)","t":"Memory","id":25},{"q":"What is the capacity of short-term memory?","a":"7 plus or minus 2 items (5–9)","t":"Memory","id":26},{"q":"What is the duration of short-term memory?","a":"18–30 seconds (longer if the information is rehearsed)","t":"Memory","id":27},{"q":"What is the encoding of short-term memory?","a":"Mainly acoustic (sounds)","t":"Memory","id":28},{"q":"What is the capacity of long-term memory?","a":"Unlimited","t":"Memory","id":29},{"q":"What is the duration of long-term memory?","a":"Unlimited – up to a lifetime","t":"Memory","id":30},{"q":"What is the encoding of long-term memory?","a":"Mainly semantic (meaning)","t":"Memory","id":31},{"q":"How does information move from the sensory register to short-term memory?","a":"By paying attention to it","t":"Memory","id":32},{"q":"How does information move from short-term memory to long-term memory?","a":"Through prolonged rehearsal (repeating it over and over)","t":"Memory","id":33},{"q":"What is maintenance rehearsal?","a":"Repeating information verbally or mentally to keep it in short-term memory beyond 30 seconds","t":"Memory","id":34},{"q":"What is prolonged rehearsal?","a":"Repeating information over and over so that it is transferred to long-term memory","t":"Memory","id":35},{"q":"What happens to information in STM that is not rehearsed?","a":"It is forgotten (it decays or is displaced)","t":"Memory","id":36},{"q":"How does information get out of long-term memory when we need it?","a":"Retrieval – it is passed back to short-term memory","t":"Memory","id":37},{"q":"Who found that the average digit span is 7 plus or minus 2?","a":"Miller","t":"Memory","id":38},{"q":"What is a digit span test?","a":"A test of STM capacity where people repeat back increasingly long strings of digits in the correct order","t":"Memory","id":39},{"q":"What is chunking?","a":"Grouping individual pieces of information into larger units, which 'increases' the capacity of STM","t":"Memory","id":40},{"q":"Describe Bahrick et al.'s (1975) study.","a":"About 400 people aged 17–74 were tested on their memory of names and faces of classmates from their high school yearbooks","t":"Memory","id":41},{"q":"What did Bahrick et al. (1975) find?","a":"People who graduated within 15 years were 90% accurate at face recognition; after 48 years they were still 70–80% accurate","t":"Memory","id":42},{"q":"How does Bahrick's study support the multi-store model?","a":"It shows long-term memory can last up to a lifetime","t":"Memory","id":43},{"q":"Who is Clive Wearing?","a":"A musician whose brain was damaged by a virus; he can't form new long-term memories but can still play the piano","t":"Memory","id":44},{"q":"How does Clive Wearing challenge the multi-store model?","a":"He can still play the piano (procedural memory) but can't form new episodic memories, so there must be more than one type of LTM – the MSM is too simple","t":"Memory","id":45},{"q":"Give a strength of the multi-store model.","a":"Research support – e.g. Baddeley's encoding study and Murdock's serial position study suggest STM and LTM are separate stores, increasing the validity of the model","t":"Memory","id":46},{"q":"Give a weakness of the multi-store model.","a":"It is too simplistic/reductionist – it says there is only one LTM store but Clive Wearing shows there are different types","t":"Memory","id":47},{"q":"Why is the multi-store model said to be reductionist?","a":"It simplifies memory into three stores and suggests rehearsal is the only way to transfer to LTM","t":"Memory","id":48},{"q":"What was the aim of Murdock's (1962) study?","a":"To investigate free recall and whether the position of a word in a list affects how likely it is to be remembered","t":"Memory","id":49},{"q":"Describe the method of Murdock's study.","a":"Psychology students heard lists of between 10 and 40 words, then recalled as many as they could in any order (free recall)","t":"Memory","id":50},{"q":"What was the IV in Murdock's study?","a":"The position of the word in the list","t":"Memory","id":51},{"q":"What was the DV in Murdock's study?","a":"The number of words recalled","t":"Memory","id":52},{"q":"What type of experiment was Murdock's study?","a":"A laboratory experiment","t":"Memory","id":53},{"q":"What is the name of Murdock's study?","a":"The serial position curve (serial position effect)","t":"Memory","id":54},{"q":"What did Murdock find?","a":"Words at the start and end of the list were recalled better than words in the middle","t":"Memory","id":55},{"q":"What is the primacy effect?","a":"Recalling more of the first information received, because it has been rehearsed the longest and has entered LTM","t":"Memory","id":56},{"q":"What is the recency effect?","a":"Recalling more of the last information received, because it is still in STM","t":"Memory","id":57},{"q":"How does the primacy effect show there is a long-term memory?","a":"The first words have been rehearsed and transferred to LTM, so they are recalled well","t":"Memory","id":58},{"q":"How does Murdock's study show there is a short-term memory?","a":"The recency effect – the last words are still in STM when recall begins","t":"Memory","id":59},{"q":"Why are words in the middle of the list poorly recalled?","a":"They haven't been rehearsed enough to reach LTM and have been pushed out of STM","t":"Memory","id":60},{"q":"What was the conclusion of Murdock's study?","a":"The likelihood of recalling a word depends on its position in the list, supporting separate STM and LTM stores","t":"Memory","id":61},{"q":"Write a one-tailed hypothesis for Murdock's study.","a":"Words at the start and end of a list will be recalled more than words in the middle of the list","t":"Memory","id":62},{"q":"Who is the target population for Murdock's study?","a":"People in general (anyone with a memory)","t":"Memory","id":63},{"q":"Identify a standardised procedure in Murdock's study.","a":"Every word was presented for the same amount of time and random words were used, so all participants had the same experience","t":"Memory","id":64},{"q":"Did Murdock's study have mundane realism?","a":"No – learning lists of words is an artificial task that doesn't reflect how we use memory in everyday life","t":"Memory","id":65},{"q":"Murdock used an artificial task. What does this mean the study lacks?","a":"Mundane realism (and ecological validity)","t":"Memory","id":66},{"q":"Does Murdock's study have high or low internal validity, and why?","a":"High – it was a controlled lab experiment with standardised procedures, so the position of the word is likely to have caused the difference in recall","t":"Memory","id":67},{"q":"Give an evaluation point for Murdock's study in terms of reliability.","a":"It is reliable because it used standardised procedures (same time per word, same list), so it can be replicated to check results","t":"Memory","id":68},{"q":"Give a practical application of Murdock's study.","a":"Revising – students could place the most important information at the start and end of revision sessions","t":"Memory","id":69},{"q":"Who proposed the theory of reconstructive memory?","a":"Bartlett (1932)","t":"Memory","id":70},{"q":"What does the theory of reconstructive memory say?","a":"Fragments of stored information are reassembled during recall, and the gaps are filled in by our expectations and beliefs","t":"Memory","id":71},{"q":"According to reconstructive memory, memory is not like what?","a":"A tape recorder (or video) – it is not an exact copy of what happened","t":"Memory","id":72},{"q":"When we recall things there are gaps we have to fill. What is this process called?","a":"Confabulation","t":"Memory","id":73},{"q":"What do we use to fill in the gaps in memory according to reconstructive memory?","a":"Our schemas – expectations and beliefs based on past experience","t":"Memory","id":74},{"q":"What is effort after meaning?","a":"Focusing on the meaning of an event and trying to fit it into what we already know about the world","t":"Memory","id":75},{"q":"What is levelling?","a":"Removing or downplaying details from a memory so it becomes shorter","t":"Memory","id":76},{"q":"What is sharpening?","a":"Adding or exaggerating certain details in a memory","t":"Memory","id":77},{"q":"What is rationalisation?","a":"Changing a memory so that it makes more sense to us and fits our culture/schemas","t":"Memory","id":78},{"q":"What is a schema?","a":"A 'packet of information' based on previous experience that helps us organise and interpret information","t":"Memory","id":79},{"q":"What is assimilation?","a":"Adding new information to an existing schema","t":"Memory","id":80},{"q":"What is accommodation?","a":"Changing an existing schema or creating a new one when new information doesn't fit","t":"Memory","id":81},{"q":"How do social and cultural influences affect memory?","a":"We store and recall information in a way that fits our culture, e.g. Bartlett's participants changed 'canoe' to 'boat', 'hunting seals' to 'fishing' and 'bows and arrows' to 'guns'","t":"Memory","id":82},{"q":"What was the name of Bartlett's study?","a":"The War of the Ghosts (1932)","t":"Memory","id":83},{"q":"What theory of memory was Bartlett testing?","a":"Reconstructive memory","t":"Memory","id":84},{"q":"Describe the method of Bartlett's War of the Ghosts study.","a":"English participants read a Native American folk story, then retold it after different amounts of time (e.g. 15 minutes, days, months, years)","t":"Memory","id":85},{"q":"What was the sample in Bartlett's study?","a":"20 students studying English at Cambridge University","t":"Memory","id":86},{"q":"Bartlett made people retell a story after 15 minutes, a day, a week and so on. What is this called?","a":"Repeated reproduction","t":"Memory","id":87},{"q":"In some variations the story was passed from person to person. What is this called?","a":"Serial reproduction","t":"Memory","id":88},{"q":"What was the DV in Bartlett's study?","a":"The changes made to the story when it was recalled (the accuracy of recall)","t":"Memory","id":89},{"q":"What did Bartlett find?","a":"The story became shorter, details were left out, and unfamiliar parts were changed to fit English culture","t":"Memory","id":90},{"q":"Bartlett found the story was shortened and things were left out. What is this process called?","a":"Levelling","t":"Memory","id":91},{"q":"Give an example of sharpening in Bartlett's study.","a":"Participants added or exaggerated details, e.g. making the ending more dramatic","t":"Memory","id":92},{"q":"Give an example of participants changing the story to fit their schemas.","a":"'Hunting seals' became 'fishing', and 'canoe' became 'boat'","t":"Memory","id":93},{"q":"Give an example of a quantitative result from Bartlett's study.","a":"The number of words in the story decreased with each retelling (the story got shorter)","t":"Memory","id":94},{"q":"What did Bartlett conclude?","a":"Memory is reconstructive – we change memories to fit our schemas and culture","t":"Memory","id":95},{"q":"Write a two-tailed hypothesis for Bartlett's study.","a":"There will be a difference in the accuracy of recall of a story between people from a culture that matches the story and those from a different culture","t":"Memory","id":96},{"q":"Identify an extraneous variable in Bartlett's study.","a":"The time between retellings varied, or participants' individual memory ability","t":"Memory","id":97},{"q":"Why is Bartlett's study ethnocentric?","a":"Only English students were tested, and the story was judged against English cultural norms","t":"Memory","id":98},{"q":"Why is Bartlett's study not very reliable?","a":"It lacked control: there were no standardised instructions, participants weren't told accurate recall was important, and Bartlett asked them to recall the story whenever it was convenient","t":"Memory","id":99},{"q":"Why does Bartlett's study lack generalisability?","a":"It used a biased sample of just 20 Cambridge University students, who may not represent all people","t":"Memory","id":100},{"q":"Give a strength of the theory of reconstructive memory.","a":"It can be practically applied, e.g. to eyewitness testimony, showing memories may be inaccurate","t":"Memory","id":101},{"q":"How can the theory of reconstructive memory be practically applied?","a":"In police interviews – witnesses' memories may be distorted, so multiple eyewitness accounts should be collected","t":"Memory","id":102},{"q":"What is forgetting?","a":"The inability to retrieve a previously stored memory","t":"Memory","id":103},{"q":"Name the three factors affecting the accuracy of memory.","a":"Interference, Context, False memories","t":"Memory","id":104},{"q":"What is interference?","a":"Forgetting because other memories get in the way and prevent us accessing a memory","t":"Memory","id":105},{"q":"When is interference most likely to occur?","a":"When the two memories are similar","t":"Memory","id":106},{"q":"What is proactive interference?","a":"When old information interferes with learning or recalling new information","t":"Memory","id":107},{"q":"What is retroactive interference?","a":"When new information interferes with recalling old information","t":"Memory","id":108},{"q":"What did McGeoch and McDonald's study aim to investigate?","a":"The effect of a second activity (learning a new list) on the accuracy of memory for an original list","t":"Memory","id":109},{"q":"Describe McGeoch and McDonald's method.","a":"12 participants learned a list of 10 words to 100% accuracy, then learned a second list (synonyms, antonyms, unrelated words, nonsense syllables, numbers, or nothing) before recalling the first list","t":"Memory","id":110},{"q":"Which type of second list gave the worst recall in McGeoch and McDonald's study?","a":"Synonyms (words with the same meaning)","t":"Memory","id":111},{"q":"What did McGeoch and McDonald conclude?","a":"Interference is strongest when the second activity is similar to the first","t":"Memory","id":112},{"q":"Give a weakness of interference as an explanation for accuracy of memory.","a":"It is reductionist – many other factors affect memory, such as context","t":"Memory","id":113},{"q":"What is context in memory?","a":"The situation or surroundings in which something happens, which can act as a cue to recall","t":"Memory","id":114},{"q":"What was the aim of Godden and Baddeley's study?","a":"To see if recall is better when it happens in the same context (underwater or on land) as learning","t":"Memory","id":115},{"q":"Describe Godden and Baddeley's method.","a":"18 divers learned 36 unrelated words either on the beach or 10 feet underwater, then recalled them on land or underwater (4 conditions)","t":"Memory","id":116},{"q":"What is the IV in Godden and Baddeley's study?","a":"Whether the learning and recall environments matched (land/underwater)","t":"Memory","id":117},{"q":"What did Godden and Baddeley find?","a":"Recall was best when the learning and recall environments were the same","t":"Memory","id":118},{"q":"Referring to learning and recall environments, when is recall best?","a":"When the recall environment matches the learning environment","t":"Memory","id":119},{"q":"What did Godden and Baddeley conclude?","a":"Context acts as a cue to recall, enhancing the accuracy of memory","t":"Memory","id":120},{"q":"Give a strength of Godden and Baddeley's study.","a":"Standardised procedures – all divers had the same word lists and time delays, so it is reliable","t":"Memory","id":121},{"q":"Give a weakness of Godden and Baddeley's study.","a":"Lacks mundane realism – learning word lists underwater isn't an everyday task","t":"Memory","id":122},{"q":"How can research on context be practically applied?","a":"Police can take witnesses back to the crime scene; students could revise in a similar room to the exam","t":"Memory","id":123},{"q":"When we first encode a memory, what does it leave on our brain?","a":"A memory trace","t":"Memory","id":124},{"q":"What do we require as a trigger to access memories?","a":"A cue","t":"Memory","id":125},{"q":"What is a false memory?","a":"A memory of something that did not happen but which feels as if it were a true memory","t":"Memory","id":126},{"q":"What study did Loftus and Pickrell (1995) conduct?","a":"The 'lost in the mall' study – they tried to implant a false memory of being lost in a shopping mall as a child","t":"Memory","id":127},{"q":"Describe Loftus and Pickrell's method.","a":"24 participants read four childhood stories from relatives – three true and one false (lost in a mall and rescued by an elderly woman) – then were interviewed about them twice","t":"Memory","id":128},{"q":"What did Loftus and Pickrell find?","a":"25% (6 of 24) recalled the false story fully or partially; 68% of true events were remembered","t":"Memory","id":129},{"q":"What did Loftus and Pickrell conclude?","a":"Just imagining an event can create a false memory, so memory is not always accurate","t":"Memory","id":130},{"q":"What is suggestion?","a":"A psychological process where one person guides the thoughts, feelings or behaviour of another","t":"Memory","id":131},{"q":"What are repressed memories?","a":"Memories that are blocked because they are too traumatic to remember","t":"Memory","id":132},{"q":"How might people implant false memories?","a":"Through suggestion or leading questions, e.g. telling someone about an event that didn't happen","t":"Memory","id":133},{"q":"How can research into false memories be practically applied?","a":"To eyewitness testimony – police should avoid leading questions that could create false memories","t":"Memory","id":134},{"q":"Give an ethical issue with Loftus and Pickrell's study.","a":"Deception and potential distress – participants were lied to about a childhood event","t":"Memory","id":135},{"q":"Give a weakness of Loftus and Pickrell's study.","a":"The false story was artificial and not traumatic, so it may not reflect real false memories","t":"Memory","id":136},{"q":"What are the named studies for the Memory topic?","a":"Murdock (serial position curve), Bartlett (War of the Ghosts)","t":"Memory","id":137},{"q":"What is the difference between a study and a theory?","a":"A theory is an explanation of behaviour; a study is research carried out to test a theory","t":"Memory","id":138},{"q":"What does reductionism mean?","a":"Explaining complex behaviour by breaking it down into simple parts","t":"Memory","id":139},{"q":"What are the five criteria (GRAVE) to evaluate a study?","a":"Generalisability, Reliability, Application, Validity, Ethics","t":"Memory","id":140},{"q":"What does TDEE stand for when writing evaluation?","a":"Term, Define, Evidence, Explain","t":"Memory","id":141},{"q":"What does generalisability mean?","a":"Whether the findings can be applied to the target population","t":"Memory","id":142},{"q":"What does mundane realism mean?","a":"How much a task reflects real, everyday life","t":"Memory","id":143},{"q":"What is psychology?","a":"The scientific study of the mind (thoughts and feelings) and behaviour","t":"RM","id":144},{"q":"What is an aim?","a":"A general statement of the purpose of a study – what is being investigated","t":"RM","id":145},{"q":"How do we normally write an aim?","a":"'To investigate whether (DV) is affected by (IV)'","t":"RM","id":146},{"q":"What is an independent variable?","a":"The variable that is changed or manipulated by the researcher","t":"RM","id":147},{"q":"What is a dependent variable?","a":"The variable that is measured","t":"RM","id":148},{"q":"What is an extraneous variable?","a":"Any variable other than the IV that could affect the DV and ruin the results","t":"RM","id":149},{"q":"What is operationalisation?","a":"Making variables specific and measurable, e.g. 'memory' becomes 'number of words recalled from a list of 20'","t":"RM","id":150},{"q":"What is a hypothesis?","a":"A testable statement or prediction about the relationship between two variables","t":"RM","id":151},{"q":"What is a null hypothesis?","a":"A hypothesis that says there will be no difference or relationship between variables","t":"RM","id":152},{"q":"What is an alternative hypothesis?","a":"A hypothesis that predicts there will be a difference or relationship between variables","t":"RM","id":153},{"q":"What is a directional (one-tailed) hypothesis?","a":"A hypothesis that says which direction the results will go, e.g. 'Pupils in a noisy room will recall fewer words than pupils in silence'","t":"RM","id":154},{"q":"What is a non-directional (two-tailed) hypothesis?","a":"A hypothesis that predicts a difference but not its direction, e.g. 'There will be a difference in recall between pupils in noise and silence'","t":"RM","id":155},{"q":"What is the formula for writing a hypothesis?","a":"There will be a difference in (DV) between (condition 1 of IV) and (condition 2 of IV)","t":"RM","id":156},{"q":"What is a laboratory experiment?","a":"An experiment in a controlled, artificial environment where the researcher manipulates the IV","t":"RM","id":157},{"q":"What is a field experiment?","a":"An experiment in a natural, real-life setting where the researcher still manipulates the IV","t":"RM","id":158},{"q":"What is a natural experiment?","a":"An experiment where the IV occurs naturally and is not manipulated by the researcher","t":"RM","id":159},{"q":"Which type of experiment has the most control?","a":"A laboratory experiment","t":"RM","id":160},{"q":"Explain a strength of a lab experiment.","a":"High control over extraneous variables, so cause and effect can be established and it can be replicated","t":"RM","id":161},{"q":"Explain a weakness of a lab experiment.","a":"Lacks mundane realism; participants know they are being studied so may show demand characteristics","t":"RM","id":162},{"q":"Explain a strength of a field experiment.","a":"Natural setting, so behaviour is more realistic (higher ecological validity)","t":"RM","id":163},{"q":"Explain a weakness of a field experiment.","a":"Less control of extraneous variables; ethical issues if participants don't know they are being studied","t":"RM","id":164},{"q":"Explain a strength of a natural experiment.","a":"Allows research into IVs that couldn't ethically be manipulated, and has high external validity","t":"RM","id":165},{"q":"Explain a disadvantage of a natural experiment.","a":"The researcher has no control over the IV or who is in each group, and the IV may occur rarely","t":"RM","id":166},{"q":"What are demand characteristics?","a":"Cues that make participants guess the aim of a study and change their behaviour","t":"RM","id":167},{"q":"Name the four types of data.","a":"Quantitative, Qualitative, Primary, Secondary","t":"RM","id":168},{"q":"What is quantitative data?","a":"Numerical data","t":"RM","id":169},{"q":"What is qualitative data?","a":"Descriptive data in words, not numbers","t":"RM","id":170},{"q":"Which type of data is easier to compare – quantitative or qualitative?","a":"Quantitative, because it is numerical","t":"RM","id":171},{"q":"What is a drawback of quantitative data?","a":"It lacks detail and doesn't explain why people behave as they do","t":"RM","id":172},{"q":"Identify a strength of qualitative data.","a":"It is rich and detailed, giving insight into people's thoughts and feelings","t":"RM","id":173},{"q":"Why is qualitative data harder to analyse?","a":"It can't be easily turned into numbers and needs to be interpreted, which can be subjective","t":"RM","id":174},{"q":"What is primary data?","a":"Data collected first-hand by the researcher for their study","t":"RM","id":175},{"q":"What is secondary data?","a":"Data that has already been collected by someone else for another purpose","t":"RM","id":176},{"q":"Explain a strength of primary research.","a":"The researcher controls how the data is collected, so it fits the aim exactly","t":"RM","id":177},{"q":"Name a drawback of secondary data.","a":"It may not fit the aim of the study and may be inaccurate or out of date","t":"RM","id":178},{"q":"Give an example of a source of secondary data.","a":"Government statistics, previous research studies, school records, the internet","t":"RM","id":179},{"q":"Explain how counterbalancing works.","a":"In repeated measures, half the participants do condition A then B, and half do B then A, to balance out order effects","t":"RM","id":180},{"q":"What does validity mean?","a":"Whether a study measures what it claims to measure and reflects real life","t":"RM","id":181},{"q":"What does reliability mean?","a":"Whether results are consistent – if the study were repeated, would the same
