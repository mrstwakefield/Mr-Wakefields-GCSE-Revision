const AO2 = [{"t":"Memory","sc":"Amir moved house and keeps writing his old postcode on forms.","q":"Which factor affecting memory explains this?","a":"Proactive interference","wrong":["Retroactive interference","Context","False memory"],"why":"Old information (old postcode) is disrupting new information: proactive interference."},{"t":"Memory","sc":"After learning Spanish, Erin finds she has forgotten most of her French vocabulary.","q":"Which factor affecting memory explains this?","a":"Retroactive interference","wrong":["Proactive interference","The primacy effect","Context"],"why":"New learning (Spanish) has disrupted old learning (French): retroactive interference."},{"t":"Memory","sc":"Jo can't remember her friend's name at a party, but remembers it straight away when she walks back into the café where they met.","q":"Which factor affecting memory explains this?","a":"Context","wrong":["Interference","False memory","The recency effect"],"why":"Being back in the same place gave cues that triggered recall."},{"t":"Memory","sc":"Leah reads a shopping list once and, at the shop, remembers the first three items and the last two.","q":"Which effect does this show?","a":"The serial position effect (primacy and recency)","wrong":["Interference","Reconstructive memory","Context-dependent forgetting"],"why":"Early items reached LTM through rehearsal; the last items were still in STM."},{"t":"Memory","sc":"Raj remembers his tenth birthday party in vivid detail: the cake, who came and how he felt.","q":"Which type of long-term memory is this?","a":"Episodic memory","wrong":["Semantic memory","Procedural memory","Short-term memory"],"why":"A personal event with a time and place is an episodic memory."},{"t":"Memory","sc":"Mia knows that Paris is the capital of France but can't remember when she learned it.","q":"Which type of long-term memory is this?","a":"Semantic memory","wrong":["Episodic memory","Procedural memory","Sensory memory"],"why":"Facts and knowledge, not tied to when you learned them, are semantic."},{"t":"Memory","sc":"Tom can ride a bike without thinking about how he balances.","q":"Which type of long-term memory is this?","a":"Procedural memory","wrong":["Episodic memory","Semantic memory","Short-term memory"],"why":"Knowing how to do something automatically is procedural memory."},{"t":"Memory","sc":"Sam repeats a phone number over and over until he can dial it.","q":"What is Sam doing, according to the multi-store model?","a":"Maintenance rehearsal, to keep it in STM","wrong":["Encoding it semantically into LTM","Retrieving it from LTM","Storing it in sensory memory"],"why":"Repeating information keeps it in STM; enough rehearsal can transfer it to LTM."},{"t":"Memory","sc":"After a lively family argument, each relative remembers it differently, adding details that fit their own view.","q":"Which theory explains this best?","a":"Reconstructive memory","wrong":["The multi-store model","Procedural memory","The primacy effect"],"why":"We fill gaps using our own schemas, so memories are reconstructed differently."},{"t":"Memory","sc":"A witness is asked 'How fast was the car going when it smashed into the bus?' and later 'remembers' broken glass that wasn't there.","q":"What has happened to the witness's memory?","a":"A false memory, created by a leading question","wrong":["Retroactive interference from a new list","Context-dependent forgetting","Displacement from STM"],"why":"New information in the question was used to reconstruct the memory."},{"t":"Perception","sc":"In a painting of a beach, the people near the top of the picture look further away.","q":"Which depth cue is this?","a":"Height in plane","wrong":["Relative size","Occlusion","Linear perspective"],"why":"Objects higher in the visual field are seen as further away."},{"t":"Perception","sc":"In a photo, one car hides part of another car behind it.","q":"Which depth cue is this?","a":"Occlusion","wrong":["Height in plane","Relative size","Texture gradient"],"why":"When one object covers part of another, the covering object looks closer."},{"t":"Perception","sc":"As Zara looks down a long corridor, the sides seem to meet in the distance.","q":"Which depth cue is this?","a":"Linear perspective","wrong":["Height in plane","Occlusion","Retinal disparity"],"why":"Parallel lines appear to converge as they get further away."},{"t":"Perception","sc":"Ben catches a ball easily with both eyes open but misses with one eye closed.","q":"Which kind of depth cue is he losing?","a":"A binocular cue, e.g. retinal disparity","wrong":["A monocular cue, e.g. height in plane","Size constancy","Motion parallax"],"why":"Binocular cues need both eyes, so closing one removes them."},{"t":"Perception","sc":"From a moving train, nearby fences rush past while distant hills hardly move.","q":"Which part of Gibson's theory is this?","a":"Motion parallax","wrong":["Affordances","Texture gradient","Size constancy"],"why":"Closer objects seem to move faster when you're moving: motion parallax."},{"t":"Perception","sc":"A hungry student walking through town notices every bakery but no other shops.","q":"Which factor affecting perception explains this?","a":"Motivation","wrong":["Culture","Expectation","Emotion"],"why":"We notice things that meet our needs: motivation affects perceptual set."},{"t":"Perception","sc":"Ella is told a film is terrifying. During the film she jumps at a harmless shadow.","q":"Which factor affecting perception explains this?","a":"Expectation","wrong":["Motivation","Culture","Size constancy"],"why":"She expected to be scared, so her perceptual set made the shadow seem threatening."},{"t":"Perception","sc":"A friend sees the face-or-vase picture as a vase, then suddenly sees two faces.","q":"Which explanation of illusions is this?","a":"Ambiguity","wrong":["Fiction","Misinterpreted depth cues","Size constancy"],"why":"An ambiguous figure has two equally likely interpretations."},{"t":"Perception","sc":"People see a white triangle in a drawing where no triangle is drawn, only three cut-out circles.","q":"Which explanation of illusions is this?","a":"Fiction","wrong":["Ambiguity","Size constancy","Linear perspective"],"why":"Fiction is perceiving something that isn't there, as the brain fills in the gaps."},{"t":"Perception","sc":"Someone who grew up in a round-house village is less fooled by the Müller-Lyer illusion than a city dweller.","q":"Whose theory does this support?","a":"Gregory's constructivist theory","wrong":["Gibson's direct theory","Piaget's stage theory","Hebb's theory"],"why":"Different experience leads to different perception: nurture, as Gregory says."},{"t":"Development","sc":"Ava, 18 months, looks for her toy after it is hidden under a cushion.","q":"What has Ava developed?","a":"Object permanence","wrong":["Conservation","Decentring","Abstract thinking"],"why":"Knowing that objects still exist when out of sight develops in the sensorimotor stage."},{"t":"Development","sc":"Leo, 4, thinks his grandma can see the picture he's holding up to the phone during a call.","q":"Which feature of the pre-operational stage is this?","a":"Egocentrism","wrong":["Conservation","Object permanence","Reversibility"],"why":"He can only see things from his own point of view."},{"t":"Development","sc":"Isla, 5, says a squashed ball of clay has 'less clay' than a round one.","q":"What can't Isla do yet?","a":"Conserve","wrong":["Show object permanence","Use symbols","Classify objects"],"why":"Pre-operational children can't understand that quantity stays the same when appearance changes."},{"t":"Development","sc":"Noah, 13, can think about 'What would happen if there were no gravity?'","q":"Which of Piaget's stages is Noah in?","a":"Formal operational","wrong":["Concrete operational","Pre-operational","Sensorimotor"],"why":"Hypothetical, abstract thinking appears in the formal operational stage (11+)."},{"t":"Development","sc":"A toddler who knows 'bird' sees a plane and calls it a bird.","q":"Which process is this?","a":"Assimilation","wrong":["Accommodation","Equilibrium","Conservation"],"why":"Fitting new information into an existing schema is assimilation."},{"t":"Development","sc":"The toddler is told 'that's a plane, not a bird' and creates a new idea for planes.","q":"Which process is this?","a":"Accommodation","wrong":["Assimilation","Egocentrism","Reversibility"],"why":"Changing a schema or creating a new one is accommodation."},{"t":"Development","sc":"Kai says 'I'm just not a science person, so there's no point trying.'","q":"Which mindset does Kai show?","a":"A fixed mindset","wrong":["A growth mindset","High self-efficacy","Learning goals"],"why":"Believing ability can't change is a fixed mindset."},{"t":"Development","sc":"A teacher wants her class to develop a growth mindset.","q":"What should she praise?","a":"Effort and strategies","wrong":["Intelligence","Natural talent","Speed of finishing"],"why":"Dweck says praising effort, not ability, encourages a growth mindset."},{"t":"Development","sc":"Priya did well in her last maths test, so she believes she can tackle the hard questions this time.","q":"Which concept is this?","a":"Self-efficacy","wrong":["Fixed mindset","Egocentrism","Assimilation"],"why":"Belief in your ability to succeed, based on past success, is self-efficacy."},{"t":"Development","sc":"A school spends money testing every student's 'learning style' and teaching visual learners only with pictures.","q":"Whose ideas does this go against?","a":"Willingham's","wrong":["Piaget's","Dweck's","Hebb's"],"why":"Willingham argues there's no evidence for teaching to learning styles."},{"t":"RM","sc":"A researcher compares memory scores of students who chew gum and students who don't.","q":"What is the IV?","a":"Whether students chew gum or not","wrong":["Their memory scores","The students' ages","The room they're tested in"],"why":"The IV is what the researcher changes between conditions."},{"t":"RM","sc":"The same 20 participants do a test in silence and then with music.","q":"Which experimental design is this?","a":"Repeated measures","wrong":["Independent groups","Matched pairs","A correlation"],"why":"The same people take part in both conditions."},{"t":"RM","sc":"A researcher picks every student whose name is drawn from a hat containing the whole year group's names.","q":"Which sampling method is this?","a":"Random sampling","wrong":["Opportunity sampling","Volunteer sampling","Stratified sampling"],"why":"Everyone in the target population had an equal chance of being picked."},{"t":"RM","sc":"A psychologist puts up a poster asking for people to take part in a sleep study.","q":"Which sampling method is this?","a":"Volunteer sampling","wrong":["Random sampling","Opportunity sampling","Stratified sampling"],"why":"Participants choose to take part by responding to an advert."},{"t":"RM","sc":"A study finds that the more time teens spend outdoors, the better their mood.","q":"What type of relationship is this?","a":"A positive correlation","wrong":["A negative correlation","No correlation","Cause and effect"],"why":"As one variable increases, so does the other."},{"t":"RM","sc":"Some participants in a quiz study were tested at 9am and others at 4pm.","q":"What problem is this?","a":"Time of day is an extraneous variable","wrong":["It is a confederate","It is the DV","It is a null hypothesis"],"why":"Something other than the IV that could affect the results."},{"t":"RM","sc":"Researchers watched people on a high street without them knowing.","q":"What kind of observation is this?","a":"Covert and naturalistic","wrong":["Overt and controlled","Participant and controlled","Overt and naturalistic"],"why":"Covert = they don't know; naturalistic = real-life setting."},{"t":"RM","sc":"After a study that used deception, the researcher explains its true aim to every participant.","q":"What is this called?","a":"Debriefing","wrong":["Informed consent","Confidentiality","Right to withdraw"],"why":"Explaining the true purpose at the end is debriefing."},{"t":"Social influence","sc":"Ruby changes her answer to match the rest of her group, even though she thinks they're wrong.","q":"What is this called?","a":"Conformity","wrong":["Obedience","Deindividuation","Bystander behaviour"],"why":"Changing behaviour to fit in with a group of equals is conformity."},{"t":"Social influence","sc":"A man in a hi-vis jacket tells people to move away from a door, and they do without asking why.","q":"Which explanation of obedience fits best?","a":"Agency theory: they see him as a legitimate authority","wrong":["The authoritarian personality","Deindividuation","Diffusion of responsibility"],"why":"They shift into the agentic state because of his apparent authority."},{"t":"Social influence","sc":"Someone trips in a busy shopping centre and nobody helps.","q":"Which concept explains this?","a":"Diffusion of responsibility","wrong":["Deindividuation","Obedience","Conformity"],"why":"With lots of people around, each person feels less responsible to help."},{"t":"Social influence","sc":"Fans in matching shirts and face paint chant things they'd never say on their own.","q":"Which concept explains this?","a":"Deindividuation","wrong":["Obedience","Agency theory","Diffusion of responsibility"],"why":"Anonymity in a crowd reduces a person's sense of individual identity and responsibility."},{"t":"Social influence","sc":"A student only gives the group's wrong answer when answering out loud, not when writing it down privately.","q":"Which factor affecting conformity is this?","a":"Anonymity","wrong":["Group size","Task difficulty","Expertise"],"why":"People conform less when their answers are private."},{"t":"Social influence","sc":"A first-aider at a train station helps straight away while others stand back.","q":"Which factor affecting bystander behaviour is this?","a":"Expertise","wrong":["Presence of others","Cost of helping","Similarity to the victim"],"why":"People with relevant skills are more likely to help."},{"t":"Social influence","sc":"A person raised by very strict, harsh parents is extremely obedient to people in charge.","q":"Which explanation of obedience fits best?","a":"The authoritarian personality","wrong":["Agency theory","Deindividuation","Social loafing"],"why":"Adorno linked a strict upbringing to an authoritarian personality."},{"t":"Social influence","sc":"Conformity rises when a maths problem is very hard.","q":"Which factor affecting conformity is this?","a":"Task difficulty","wrong":["Anonymity","Group size","Culture"],"why":"When unsure, people look to the group for the answer."},{"t":"Language, thought & communication","sc":"A child must first understand the idea of 'more' before using the word 'more' properly.","q":"Whose theory does this support?","a":"Piaget's: thought comes before language","wrong":["Sapir-Whorf: language comes before thought","Von Frisch's","Darwin's"],"why":"Piaget says children can only use words for concepts they already understand."},{"t":"Language, thought & communication","sc":"Speakers of a language with lots of words for blue are quicker at telling shades of blue apart.","q":"Which theory does this support?","a":"The Sapir-Whorf hypothesis (weak version)","wrong":["Piaget's theory of language","Darwin's theory","The multi-store model"],"why":"Language influences how easily we think about and perceive differences."},{"t":"Language, thought & communication","sc":"Two people talking keep making eye contact to show whose turn it is to speak.","q":"What is eye contact doing here?","a":"Regulating the flow of conversation","wrong":["Showing a closed posture","Showing personal space","Showing attraction only"],"why":"Eye contact signals turn-taking in conversation."},{"t":"Language, thought & communication","sc":"During an interview, Jamal folds his arms and crosses his legs.","q":"What might this suggest?","a":"A closed posture: feeling defensive or uncomfortable","wrong":["An open posture: feeling relaxed","Postural echo","High status"],"why":"Folded arms and crossed legs form a closed posture."},{"t":"Language, thought & communication","sc":"Two friends chatting unconsciously copy each other's position.","q":"What is this called?","a":"Postural echo","wrong":["Closed posture","Open posture","Personal space"],"why":"Mirroring someone's posture shows rapport."},{"t":"Language, thought & communication","sc":"An employee stands further away from the head teacher than from a colleague.","q":"Which factor affecting personal space is this?","a":"Status","wrong":["Gender","Culture","Familiarity only"],"why":"People keep more distance from those of higher status."},{"t":"Language, thought & communication","sc":"A forager bee returns and does a figure-of-eight dance.","q":"What does this tell other bees?","a":"The food is far away, and its direction","wrong":["The food is very close","There is danger nearby","The hive is full"],"why":"The waggle dance signals food further away and its direction."},{"t":"Language, thought & communication","sc":"A baby born blind smiles when happy, even though they've never seen a smile.","q":"Which theory does this support?","a":"Darwin's evolutionary theory of expressions","wrong":["Sapir-Whorf hypothesis","Piaget's theory","Social learning theory"],"why":"Expressions that appear without learning suggest they are innate and evolved."},{"t":"Brain & neuropsychology","sc":"Lucy's heart races and her palms sweat as she waits to perform in a show.","q":"Which part of the nervous system is active?","a":"The sympathetic nervous system","wrong":["The parasympathetic nervous system","The somatic nervous system","The central nervous system only"],"why":"The sympathetic branch triggers fight or flight."},{"t":"Brain & neuropsychology","sc":"After her performance, Lucy's heart rate slows and she feels calm again.","q":"Which part of the nervous system is responsible?","a":"The parasympathetic nervous system","wrong":["The sympathetic nervous system","The somatic nervous system","The motor cortex"],"why":"The parasympathetic branch returns the body to rest."},{"t":"Brain & neuropsychology","sc":"Owen sees a spider, notices his heart pounding, and then realises he's scared.","q":"Which theory of emotion fits this?","a":"James-Lange theory","wrong":["Cannon-Bard theory","Hebb's theory","Agency theory"],"why":"Arousal first, then interpretation, then emotion: James-Lange."},{"t":"Brain & neuropsychology","sc":"After a stroke, Dev can understand speech but struggles to produce words.","q":"Which area is most likely damaged?","a":"Broca's area (frontal lobe)","wrong":["Wernicke's area (temporal lobe)","The occipital lobe","The cerebellum"],"why":"Broca's area is involved in producing speech."},{"t":"Brain & neuropsychology","sc":"After a head injury, Kim has problems with her vision.","q":"Which lobe is most likely damaged?","a":"The occipital lobe","wrong":["The frontal lobe","The temporal lobe","The parietal lobe"],"why":"The visual area is in the occipital lobe."},{"t":"Brain & neuropsychology","sc":"Ana practises her violin every day and finds tricky passages get easier.","q":"Which theory explains this?","a":"Hebb's theory: practice strengthens connections between neurons","wrong":["James-Lange theory","Agency theory","Piaget's theory"],"why":"Repeated firing strengthens synaptic connections and forms cell assemblies."},{"t":"Brain & neuropsychology","sc":"A neurotransmitter makes the next neuron more likely to fire.","q":"What kind of effect is this?","a":"Excitation","wrong":["Inhibition","Reuptake","Myelination"],"why":"Excitatory neurotransmitters increase the chance the next neuron fires."},{"t":"Brain & neuropsychology","sc":"A doctor needs a detailed picture of the structure of a patient's brain, quickly.","q":"Which scan would they most likely use?","a":"A CT scan","wrong":["A PET scan","An fMRI scan","An EEG"],"why":"CT scans quickly show structure; PET and fMRI show activity."},{"t":"Psychological problems","sc":"Hana has felt low for over a month, has lost interest in her hobbies and is sleeping badly.","q":"Which condition do these symptoms suggest?","a":"Depression","wrong":["Addiction","A phobia","A stroke"],"why":"Persistent low mood, loss of interest and sleep changes are symptoms of depression."},{"t":"Psychological problems","sc":"Joel's twin brother has depression. Joel worries he might too.","q":"Which explanation of depression is this concern based on?","a":"The biological (genetic) explanation","wrong":["The cognitive explanation","Peer influence","Social learning"],"why":"Depression may run in families through inherited genes."},{"t":"Psychological problems","sc":"After failing a test, Mo thinks 'I'm useless, everyone hates me, nothing will ever get better.'","q":"What does this show?","a":"Beck's negative triad","wrong":["Serotonin deficiency","Peer influence","Genetic vulnerability"],"why":"Negative views of the self, the world and the future."},{"t":"Psychological problems","sc":"A therapist asks Mo, 'Where's the evidence that everyone hates you?'","q":"Which therapy is this?","a":"CBT","wrong":["Antidepressants","Aversion therapy","A self-management programme"],"why":"Challenging irrational thoughts (disputing) is part of CBT."},{"t":"Psychological problems","sc":"Ryan has to drink more and more alcohol to get the same effect.","q":"Which feature of addiction is this?","a":"Tolerance","wrong":["Withdrawal","Relapse","Self-efficacy"],"why":"Needing more of a substance for the same effect is tolerance."},{"t":"Psychological problems","sc":"When Ryan stops drinking he feels shaky, anxious and sick.","q":"Which feature of addiction is this?","a":"Withdrawal","wrong":["Tolerance","Relapse","Craving only"],"why":"Unpleasant symptoms when stopping a substance are withdrawal."},{"t":"Psychological problems","sc":"All of Jess's friends vape, so she starts too.","q":"Which explanation of addiction is this?","a":"Peer influence","wrong":["Genetic vulnerability","Serotonin deficiency","Classical conditioning"],"why":"People similar to us influence our behaviour, especially in adolescence."},{"t":"Psychological problems","sc":"Max takes a tablet that makes him sick if he drinks alcohol.","q":"Which treatment is this?","a":"Aversion therapy","wrong":["CBT","Antidepressants","A self-management programme"],"why":"Pairing alcohol with sickness uses classical conditioning."}];

const SPEC_EXTRA = [{"t":"RM","q":"What is a frequency table?","a":"A table showing how often each score or category occurs, often using tallies","why":"It turns raw data into counts, so patterns are easy to see."},{"t":"RM","q":"Why might a researcher put data into a frequency table?","a":"To organise raw data so it's easy to see which scores or categories are most common","why":"It's a quick summary before drawing a graph or finding the mode."},{"t":"RM","q":"What is a pilot study?","a":"A small trial run of a study before the main study, to check the procedure and materials work","why":"It catches problems early, such as confusing questions, saving time and money later."},{"t":"RM","q":"Give one reason for carrying out a pilot study.","a":"To find and fix problems (e.g. unclear instructions or a task that's too hard) before the real study","why":"Fixing problems first makes the main study more valid."},{"t":"RM","q":"In a normal distribution, what shape is the graph?","a":"A symmetrical bell-shaped curve, with most scores in the middle","why":"Most people score near the average and fewer score at the extremes."},{"t":"RM","q":"What is a case study?","a":"An in-depth study of one person or a small group, often using several methods","why":"Used for rare cases that couldn't be created deliberately, like HM or Clive Wearing."},{"t":"RM","q":"Give a strength of case studies.","a":"They give rich, detailed data about unusual cases that couldn't be studied any other way","why":"You can't ethically damage someone's brain, but you can study a person whose brain was damaged."},{"t":"RM","q":"Give a weakness of case studies.","a":"They focus on one person or a small group, so the findings can't easily be generalised","why":"One unusual person may not be typical of everyone."},{"t":"Perception","q":"What is the difference between sensation and perception?","a":"Sensation is detecting information with the senses; perception is the brain interpreting it","why":"The eye senses light; the brain decides 'that's a car'."},{"t":"Perception","q":"Which explanation of illusions does Rubin's vase show?","a":"Ambiguity – it can be seen as a vase or as two faces","why":"Two equally likely interpretations, so perception flips between them."},{"t":"Perception","q":"What do people see in the Kanizsa triangle?","a":"A white triangle that isn't actually drawn (fiction)","why":"The brain fills in the missing edges to make the most likely shape."},{"t":"Perception","q":"What happens in the Ponzo illusion?","a":"Two identical lines look different lengths because they sit between converging lines","why":"The converging lines act as a linear perspective cue, so we misapply size constancy."},{"t":"Perception","q":"What does the Müller-Lyer illusion look like?","a":"Two equal lines, one with outward-pointing fins and one with inward-pointing fins, which look different lengths","why":"Gregory says the fins look like building corners, so we misread depth."},{"t":"Development","q":"Describe Piaget's three mountains task.","a":"Children were shown a model of three mountains and asked to choose a picture of what a doll could see from another position","why":"It tested egocentrism: could they take another person's view?"},{"t":"Development","q":"What did Piaget find with the three mountains task?","a":"Children under about 7 usually chose a picture of their own view, not the doll's","why":"He concluded pre-operational children are egocentric."},{"t":"Development","q":"Give a weakness of the three mountains task.","a":"It was confusing and abstract for young children, so it may have underestimated their ability","why":"Hughes used a more meaningful task and found children could decentre earlier."},{"t":"Social influence","q":"What is moral strain in agency theory?","a":"The anxiety felt when someone obeys an order that goes against their conscience","why":"Milgram's participants sweated and trembled: signs of moral strain."},{"t":"Social influence","q":"How does the cost of helping affect bystander behaviour?","a":"The higher the cost of helping (danger, effort, embarrassment), the less likely people are to help","why":"In Piliavin's study, the 'drunk' victim seemed more costly to help, so got help less often."},{"t":"Social influence","q":"What is the cost of NOT helping?","a":"The guilt or blame a bystander might feel if they don't help","why":"If not helping feels worse than helping, people are more likely to step in."},{"t":"Social influence","q":"How does similarity to the victim affect bystander behaviour?","a":"People are more likely to help someone they see as similar to themselves","why":"For example, football fans were more likely to help an injured stranger wearing their own team's shirt."},{"t":"Social influence","q":"What is a prosocial crowd?","a":"A crowd that behaves helpfully, e.g. people raising money together at a charity event","why":"Crowds aren't always bad: they can encourage helping too."},{"t":"Social influence","q":"What is an antisocial crowd?","a":"A crowd that behaves in harmful or aggressive ways, e.g. a riot","why":"Deindividuation can make antisocial behaviour more likely."},{"t":"Language, thought & communication","q":"Name two things human communication can do that animal communication can't.","a":"Talk about the past and future (displacement) and create brand-new words and sentences","why":"Animal communication is mostly fixed and about the here and now."},{"t":"Language, thought & communication","q":"Give two functions of animal communication.","a":"Any two: survival (e.g. warning of predators), reproduction (attracting a mate), territory, food","why":"Animal signals are usually about staying alive and passing on genes."},{"t":"Language, thought & communication","q":"Is animal communication usually fixed or creative?","a":"Fixed – animals use a limited set of signals and can't invent new ones","why":"Humans can make an endless number of new sentences."},{"t":"Brain & neuropsychology","q":"What does a sensory neuron do?","a":"Carries messages from the senses (receptors) to the central nervous system","why":"Sensory = information IN."},{"t":"Brain & neuropsychology","q":"What does a relay neuron do?","a":"Passes messages between sensory and motor neurons inside the CNS","why":"Relay = the middle link, like a relay race."},{"t":"Brain & neuropsychology","q":"What does a motor neuron do?","a":"Carries messages from the CNS to muscles or glands (effectors)","why":"Motor = commands OUT to make you move."},{"t":"Brain & neuropsychology","q":"What does the myelin sheath do?","a":"Insulates the axon and speeds up the electrical impulse","why":"Like the plastic coating on a wire."},{"t":"Brain & neuropsychology","q":"What are dendrites?","a":"Branches on a neuron that receive messages from other neurons","why":"Dendrites = receivers."},{"t":"Brain & neuropsychology","q":"What is the axon?","a":"The long fibre that carries the electrical impulse away from the cell body","why":"The impulse travels along the axon to the terminal."},{"t":"Psychological problems","q":"What is the difference between unipolar and bipolar depression?","a":"Unipolar depression involves only low mood; bipolar involves episodes of depression and mania (very high mood)","why":"'Uni' = one pole (low); 'bi' = two poles (low and high)."},{"t":"Psychological problems","q":"What is mania?","a":"A period of extremely high mood and energy, with racing thoughts and risky behaviour","why":"Mania is the 'high' episode in bipolar depression."},{"t":"Psychological problems","q":"How has the number of people reporting mental health problems changed over time?","a":"It has increased","why":"More people are being diagnosed and asking for help."},{"t":"Psychological problems","q":"Give two reasons why reported mental health problems may have increased.","a":"Any two: more awareness, less stigma, better diagnosis, more pressure (e.g. exams, social media), more willingness to seek help","why":"Some of the rise may be more reporting rather than more illness."},{"t":"Psychological problems","q":"Give one effect of mental health problems on society.","a":"Any one: cost to the NHS, people missing work, pressure on families and carers","why":"The impact spreads beyond the individual."},{"t":"Psychological problems","q":"Give one effect of mental health problems on the individual.","a":"Any one: difficulty working or studying, damaged relationships, stigma, physical health problems","why":"Mental health affects every part of daily life."},{"t":"Psychological problems","q":"What is dependence syndrome in addiction?","a":"A pattern of symptoms such as strong craving, difficulty controlling use, tolerance and withdrawal","why":"Diagnosis usually needs several of these symptoms over the past year."},{"t":"Psychological problems","q":"What does it mean to persist with a substance despite harm?","a":"Carrying on using it even when you know it's damaging your health or life","why":"It's one of the signs used to diagnose addiction."}];

/* ---- topic stages: every topic must reach each 20% step before any topic can go further ---- */
const STAGE_STEP = 20;   // percent per stage. Set to 0 to switch topic locking off.
// a topic that comes back only counts towards stages from this date, so students get time to catch up
const stageCountsFor = (y, k, d) => k!=="Exam skills" && (d||dstr(new Date())) >= stageFromDate(y,k);

function topicFrac(key){ const it=DATA.filter(d=>d.t===key); return it.length ? it.filter(d=>status(d.id)==="k").length/it.length : 0; }
function stageInfo(){
  if(!STAGE_STEP || DEMO || stageTopics().length<2) return {on:false, cap:1, stage:0, locked:new Set(), fr:{}};   // stages need at least two topics
  const fr={}; stageTopics().forEach(t=>fr[t.key]=topicFrac(t.key));
  const step=STAGE_STEP/100, min=Math.min(...Object.values(fr));
  const stage=Math.floor(min/step+1e-9)+1, cap=Math.min(1,stage*step);
  const locked=new Set(cap>=1?[]:Object.keys(fr).filter(k=>fr[k]>=cap-1e-9));
  return {on:true, cap, stage, locked, fr, reached:Object.values(fr).filter(f=>f>=cap-1e-9).length, total:Object.keys(fr).length};
}
// locked topics are fully locked: nothing from them comes up until every other topic catches up

function mcPick(i){
  if(mcPicked!==null || !mcCur) return;

  const el=document.querySelector(`[data-mc="${i}"]`);
  // record the result like the other modes, but stay on the card so they can read the answer
  const wasDue=isDue(id); sessionRes[id]=ok?"k":"l";
  if(!ok){ G.st.learnMarks=(G.st.learnMarks||0)+1; G.lcount[id]=(G.lcount[id]||0)+1; } else if((G.lcount[id]||0)>=3) G.flags.finally=1;
  mark(id, ok?"k":"l"); trackMistake(id, ok);
  deckXP+=answer({ok, el, mode:"cards", gold:golds.has(id), review:wasDue&&ok, topic:BY_ID[id].t});
  deckCombo = ok ? deckCombo+1 : 0; if(deckCombo>deckBest) deckBest=deckCombo;
  renderCard();

}
function mcNext(){ if(mcPicked===null) return; pos++; mcPicked=null; renderCard(); }
function actionsHTML(){ return flipped
  ? `<button class="btn ${flipVerdict==="yes"?"good":""}" id="flipNext">Next card<kbd>Enter</kbd></button>`
  : `<button class="btn" id="flipBtn" ${flipReady()?"":"disabled"}>Check my answer<kbd>Enter</kbd></button>`; }
function wireActions(){ if(flipped){ const n=$("#flipNext"); if(n) n.onclick=flipNext; } else $("#flipBtn").onclick=flip; }
// record a flip result automatically (same effects as the other modes), without leaving the card

  mark(id, ok?"k":"l"); trackMistake(id, ok);

function rate(s){ const id=deck[pos], wasDue=isDue(id); sessionRes[id]=s; if(s==="l"){ G.st.learnMarks=(G.st.learnMarks||0)+1; G.lcount[id]=(G.lcount[id]||0)+1; } else if((G.lcount[id]||0)>=3) G.flags.finally=1;
  mark(id,s); trackMistake(id, s==="k");
  deckXP+=answer({ok:s==="k", el:$(s==="k"?"#gotBtn":"#learnBtn")||$("#cgIn"), mode:"cards", gold:golds.has(id), review:wasDue&&s==="k", topic:BY_ID[id].t, typed:cardMode==="gap"});
  deckCombo = s==="k" ? deckCombo+1 : 0; if(deckCombo>deckBest) deckBest=deckCombo;
  pos++; flipped=false; flipSaid=false; flipTyped=""; flipVerdict=null; flipTries=0; mcPicked=null; renderCard(); const b=$("#flipIn")||$("#flipBtn"); if(b) b.focus({preventScroll:true}); }
document.addEventListener("keydown",e=>{
  if(tab!=="cards" || cardMode==="gap" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  if(pos>=deck.length) return;
  if(cardMode==="mc"){ const oi=optKey(e.key); if(mcPicked===null && oi>=0 && mcCur && oi<mcCur.opts.length){ e.preventDefault(); mcPick(oi); } else if(mcPicked!==null && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); mcNext(); } return; }

/* ---- anonymous usage counts → Mr Wakefield's Google Sheet ----
   Sends only totals: which games are started, right/wrong per mode and per card, year group and date.
   No names, no device or browser IDs, no progress codes. Off until ANALYTICS_URL is filled in. */
const ANALYTICS_URL = "https://script.google.com/macros/s/AKfycbxYOYvCkZ9_7cUvtwZlptNa6HIGceFXp_MtJGnCt0fGi3Fb7YRBad25CysCIpaBI1cJng/exec";   // the Google Apps Script web-app URL (…/exec)
const AN_KEY = "fount-an-q";
const anOn = () => !!ANALYTICS_URL && !TEACHER && !DEMO && location.protocol!=="file:";
let AN = (()=>{ try{ const x=JSON.parse(localStorage.getItem(AN_KEY)||"null"); if(x && x.cards) return x; }catch(e){} return {plays:{}, modes:{}, cards:{}, n:0}; })();
function anSave(){ try{ localStorage.setItem(AN_KEY, JSON.stringify(AN)); }catch(e){} }
// assessment objective of a card, roughly: scenario/application cards are AO2, strengths and weaknesses AO3, the rest AO1
function anAO(d){ if(d.t==="Exam skills") return "Exam skills"; if((d.id>=7001 && d.id<7500) || d.sc) return "AO2"; const k=qKind(d.q); return k==="eval" ? "AO3" : k==="apply" ? "AO2" : "AO1"; }

function anAnswer(mode, ok){ if(!anOn()) return; const m=AN.modes[mode||"other"]=AN.modes[mode||"other"]||[0,0]; m[ok?0:1]++; AN.n++; if(AN.n>=25) anFlush(false); else anSave(); }
function anCard(id, ok){ if(!anOn() || !BY_ID[id] || (id>=5000 && id<6000)) return; const c=AN.cards[id]=AN.cards[id]||[0,0]; c[ok?0:1]++; anSave(); }
function anFlush(beacon){
  if(!anOn() || (!AN.n && !Object.keys(AN.plays).length && !Object.keys(AN.cards).length)) return;
  // one-off flags instead of an ID: "first batch ever from this device" and "first batch today" let the sheet count students without tracking anyone
  const u={}; try{ if(!localStorage.getItem("fount-an-ever")){ u.n=1; localStorage.setItem("fount-an-ever","1"); } if(localStorage.getItem("fount-an-day")!==today()){ u.d=1; localStorage.setItem("fount-an-day",today()); } }catch(e){}
  const body=JSON.stringify({v:1, k:"fount-gcse", d:today(), y:YEAR||"", u, plays:AN.plays, modes:AN.modes,
    cards:Object.entries(AN.cards).slice(0,300).map(([id,[r,w]])=>{ const d=BY_ID[id]; return [+id, r, w, d?d.t:"", d?String(d.q).slice(0,90):"", d?anAO(d):""]; })});
  AN={plays:{}, modes:{}, cards:{}, n:0}; anSave();
  try{ if(beacon && navigator.sendBeacon) navigator.sendBeacon(ANALYTICS_URL, new Blob([body],{type:"text/plain"}));
       else fetch(ANALYTICS_URL,{method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body, keepalive:true}).catch(()=>{}); }catch(e){}
}

let actx;
function tone(f,d,type="sine",t0=0,vol=.07){
  if(!G.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+t0;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
function sfx(k){
  if(k==="ok"){ const f=523*Math.pow(1.0595,Math.min(combo,14)); tone(f,.12,"triangle"); tone(f*1.5,.16,"triangle",.06); }
  else if(k==="no") tone(140,.22,"sawtooth",0,.04);
  else if(k==="lvl") [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",i*.09));
  else if(k==="badge") [784,1175,1568].forEach((f,i)=>tone(f,.25,"sine",i*.08));
  else if(k==="gold") [1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,"sine",i*.06,.05));
  else if(k==="tick") tone(880,.05,"square",0,.02);
}

/* ---- confetti ---- */
let parts=[], fxRun=false;
function confetti(n=140, colours){
  if(reduced()) return;
  const cv=$("#fx"), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const cols=colours||TOPICS.map(t=>t.c).concat(["#FFD54A","#4CC896"]);
  for(let i=0;i<n;i++){ const side=i%2; parts.push({x:(side?innerWidth*.85:innerWidth*.15), y:innerHeight*.6, vx:(side?-1:1)*(2+Math.random()*7), vy:-(8+Math.random()*9), r:4+Math.random()*5, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.4, life:0}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const cv=$("#fx"), ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30 && p.life<260);
  parts.forEach(p=>{ p.life++; p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9); ctx.restore(); });
  if(parts.length) requestAnimationFrame(fxLoop); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

  const f=document.createElement("div"); f.className="floater "+cls; f.textContent=text; f.style.left=x+"px"; f.style.top=(y-10)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),1200);
}

const HOLIDAYS = [["2026-12-19","2027-01-03"],["2027-02-13","2027-02-21"],["2027-03-27","2027-04-11"],["2027-05-29","2027-06-06"]];
const isHoliday = d => HOLIDAYS.some(([a,b])=>d>=a && d<=b);
function checkStreak(){
  if(!G.last) return;
  const gap=dayNum(today())-dayNum(G.last);
  if(gap<=1) return;
  let missed=0, hol=0; for(let i=1;i<gap;i++){ const d=new Date(G.last+"T12:00:00"); d.setDate(d.getDate()+i); isHoliday(ymd(d)) ? hol++ : missed++; }
  if(missed===0 && G.streak>0){ const y=new Date(); y.setDate(y.getDate()-1); G.last=ymd(y);
    setTimeout(()=>toast("🏖️","Holiday streak protection",`Your ${G.streak}-day streak was safe over the holiday. Hit today's goal to keep it going.`),800); save(); return; }
  if(G.streak>0 && G.freeze>=missed){
    G.freeze-=missed; const y=new Date(); y.setDate(y.getDate()-1); G.last=ymd(y);
    setTimeout(()=>toast("🧊","Streak freeze used",`Your ${G.streak}-day streak is safe. Hit today's goal to keep it.`),800);
  } else {
    if(G.streak>1) setTimeout(()=>toast("💔",`Your ${G.streak}-day streak ended`,"Start a new one today. Hit your daily goal."),800);
    G.streak=0;
  }
  save();
}
function goalMet(){

  G.last=t; if(G.streak>G.best) G.best=G.streak;

}
function answer({ok, el, mode, gold, x2, review, topic, boss, typed, unverified}){
  checkStreak(); anAnswer(mode, ok);
  const t=today();
  G.st.cards++; if(ok) G.st.right++;
  if(!ok && combo===7) G.flags.miller=1;
  if(t==="2026-12-03"||t==="2026-12-10") G.flags.nightbefore=1;
  if(t.slice(5)==="12-25") G.flags.festive=1;
  if(ok && !unverified){ combo++; if(combo>G.st.combo){ G.st.combo=combo; const th=THEMES.find(x=>x.streak===combo); if(th) setTimeout(()=>{ toast("🔥",`${combo.toLocaleString()} right in a row!`,`New theme unlocked: ${th.name}. Switch it on in 🎨 Themes.`,true); confetti(250); sfx("badge"); },400); } } else if(!ok) combo=0;
  const base = unverified ? 4 : (mode==="quiz" ? (ok?15:4) : mode==="arcade" ? (ok?6:1) : (ok?10:3)) * (typed && ok ? 2 : 1);   // unverified: self-marked right but the written answer didn't match   // typed answers earn double
  let mult = (ok && !unverified ? comboMult() : 1) * ((x2 || topic==="Exam skills") ? 2 : 1) * eventMult(topic, boss);   // exam skills always earn double XP
  if(gold && ok){ mult*=5; G.st.gold++; }
  if(mode==="arcade") mult*=gotdMult();   // game of the day: double XP
  const xp=Math.round(base*mult)+(review?5:0);
  G.hist[t]=(G.hist[t]||0)+1;
  if(topic && TMAP[topic]){ G.tacc=G.tacc||{}; const ta=G.tacc[topic]=G.tacc[topic]||[0,0]; ta[1]++; if(ok) ta[0]++; }   // per-topic accuracy for Weak spots
  if(topic){ if(!G.tday || G.tday.d!==t) G.tday={d:t, c:{}}; G.tday.c[topic]=(G.tday.c[topic]||0)+1; }
  if(gold && ok){ sfx("gold"); confetti(70); } else sfx(ok?"ok":"no");
  addXP(xp, el, "+"+xp+" XP"+(mult>1?"  ×"+mult:""));
  if(!ok) floater("+"+xp+" XP for honesty", el, "meh");
  bumpCombo(ok);
  if(G.hist[t]>=G.goal && G.last!==t) goalMet();
  checkBadges(); save(); renderHud();
  return xp;
}

  const jets=()=>{ const w=innerWidth, n=w<600?3:5; return [...Array(n)].map((_,i)=>({x:w*(i+0.5)/n, h:i===Math.floor(n/2)?1.25:0.85+0.15*Math.sin(i*2.1)})); };

  let J=jets(); addEventListener("resize",fountFx.rj=()=>{ J=jets(); });
  const draw=()=>{ const W=innerWidth,H=innerHeight; x.clearRect(0,0,W,H);
    // pools of light at the base of each fountain
    J.forEach(j=>{ const g=x.createRadialGradient(j.x,H,0,j.x,H,90); g.addColorStop(0,"rgba(127,219,255,.35)"); g.addColorStop(1,"rgba(127,219,255,0)"); x.fillStyle=g; x.fillRect(j.x-90,H-90,180,90); });

    for(const q of fountFx.p){ q.vy+=0.12; q.x+=q.vx; q.y+=q.vy; q.life++;

}

function gmRender(){

function gmPick(i){

function gmOrder(s, btn){

      gmRender(); $("#gmFb").innerHTML=`<b style="color:var(--good)">✓ ${pts}/3 points</b>`;

e use past experience. The converging lines look like railway tracks going into the distance, so we think the top line is further away. Because of size constancy our brain makes it look bigger, even though both lines are the same length.",3,"All three steps: past experience, the depth cue from converging lines, and misapplied size constancy."],["Perception","Describe one monocular depth cue.",2,["Names a monocular cue (1)","Describes how it signals depth (1)"],"Occlusion.",1,"Names a correct cue but doesn't describe it (e.g. 'when one object blocks part of another, the blocked one looks further away')."],["Development","Describe what Piaget meant by conservation.",2,["Understanding that quantity stays the same when appearance changes (1)","Example or link to stages, e.g. pre-operational children can't conserve (1)"],"Conservation is when a child understands that the amount of something stays the same even if it looks different, for example water poured into a taller glass. Pre-operational children can't do this.",2,"Accurate definition plus an example and a link to Piaget's stages."],["Development","Outline Dweck's mindset theory.",4,["Fixed mindset: belief that ability can't change (1)","Growth mindset: belief that ability grows with effort (1)","Fixed: performance goals / avoid challenge; growth: learning goals / embrace challenge (1)","Role of praise: praising effort encourages a growth mindset (1)"],"Dweck said some people have a fixed mindset and some have a growth mindset. A growth mindset is better.",1,"Naming the two mindsets earns a mark, but neither is described, and 'better' is a judgement, not description."],["RM","Explain one strength of using a repeated measures design.",2,["Identifies a strength, e.g. controls participant variables (1)","Explains why, e.g. the same people do both conditions so differences are due to the IV (1)"],"Participant variables are controlled because the same people do both conditions, so any difference is more likely to be due l lobe caused some patients to relive vivid memories.","This is a strength because it helps us understand the role of specific areas, such as the temporal lobe in memory."],["Penfield operated on patients with epilepsy.","The brain is very complicated."]],["Psychological problems","Evaluate CBT as a treatment for depression",["One strength of CBT is research support for its effectiveness.","This means studies show CBT really does help people with depression.","For example, Wiles found that adding CBT to antidepressants roughly doubled the improvement rate (46% vs 22%).","This is a strength because it suggests CBT is a worthwhile treatment for the NHS to offer."],["CBT uses thought diaries and homework tasks.","Lots of people have depression."]],["Psychological problems","Evaluate the biological explanation of depression",["One weakness of the biological explanation is that it is reductionist.","This means it reduces depression to one simple cause: low serotonin.","For example, it ignores the negative thinking patterns that Beck's cognitive explanation focuses on.","This is a weakness because depression probably has several causes, so serotonin-based treatments may not work for everyone."],["Serotonin is a neurotransmitter.","Depression is a common mental health problem."]],["Language, thought & communication","Evaluate von Frisch's bee research",["One strength of von Frisch's research is its reliability.","This means his findings were consistent and could be repeated.","For example, he made over 1,000 observations of paint-marked bees over about 20 years.","This is a strength because consistent findings make us more confident that bees communicate distance and direction through dance."],["Bees do a round dance when food is close to the hive.","Bees are interesting animals."]]], SYNOPTIC = [["Memory","Bartlett: memory is reconstructed using schemas","Development","Piaget: schemas grow through assimilation and accommodation","Both use schemas: mental frameworks built n strengthens memory: rehearsal in the MSM, cell assemblies in Hebb's theory."],["Brain & neuropsychology","Tulving: episodic and semantic memories activate different brain areas","Memory","Types of long-term memory","Brain-scan evidence that episodic and semantic memory really are different types of LTM."],["Brain & neuropsychology","Serotonin is a neurotransmitter passed across the synapse","Psychological problems","SSRIs and the biological explanation of depression","SSRIs stop serotonin being reabsorbed, so more stays in the synapse, linking synaptic transmission to treatment."],["Psychological problems","Kaij: concordance for alcohol abuse in twins","RM","Correlation does not show cause and effect","Concordance shows a relationship between genes and addiction, but twins also share environments."],["Language, thought & communication","Darwin: facial expressions are innate and universal","Perception","Gibson: perception is innate (direct theory)","Both argue for nature: abilities we are born with because they helped our ancestors survive."],["Memory","Godden and Baddeley tested divers underwater and on land","RM","Ecological validity","Testing in real settings (underwater) makes the findings more like real life than a lab task."],["Social influence","Authoritarian personality comes from a strict upbringing","Development","Nature vs nurture","An example of nurture: early experiences shape personality and obedience."]];

// --- Müller-Lyer ---
function labMuller(){
  const refs=[170,190,150]; let t=0; const errs=[];
  const line=(x1,x2,y,out)=>{ const d=out?-16:16; return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><polyline points="${x1+d},${y-13} ${x1},${y} ${x1+d},${y+13}"/><polyline points="${x2-d},${y-13} ${x2},${y} ${x2-d},${y+13}"/>`; };
  const draw=(ref,len)=>`<svg class="lab-ml" viewBox="0 0 340 170" role="img" aria-label="Two lines with arrow fins"><g stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">${line(170-ref/2,170+ref/2,50,false)}${line(170-len/2,170+len/2,125,true)}</g><text x="10" y="22" font-size="13" fill="currentColor" opacity=".6">A</text><text x="10" y="100" font-size="13" fill="currentColor" opacity=".6">B</text></svg>`;
  const run=()=>{ if(t>=refs.length) return done(); const ref=refs[t]; let len=Math.round(ref*(Math.random()<.5?.7:1.3));
    const render=()=>{ $("#arcArea").innerHTML=labShell(`<p class="muted" style="text-align:center">Go ${t+1} of 3</p><div class="q" style="text-align:center">Make line <b>B</b> the same length as line <b>A</b>.</div>${draw(ref,len)}
      <input type="range" id="mlR" min="80" max="300" value="${len}" style="width:100%" aria-label="Length of line B">
      <div class="card-actions" style="justify-content:center"><button class="btn ghost" id="mlM">− shorter</button><button class="btn ghost" id="mlP">+ longer</button><button class="btn" id="mlOk">They look the same</button></div>`); labWire();
      const upd=v=>{ len=Math.max(80,Math.min(300,v)); $(".lab-ml").outerHTML=draw(ref,len); $("#mlR").value=len; };
      $("#mlR").oninput=e=>upd(+e.target.value); $("#mlM").onclick=()=>upd(len-3); $("#mlP").onclick=()=>upd(len+3);
      $("#mlOk").onclick=()=>{ errs.push((len-ref)/ref*100); t++; run(); }; };
    render(); };
  $("#arcArea").innerHTML=labShell(`<div class="q">Two lines, two kinds of fins. Adjust the bottom line until both lines look exactly the same length.</div><p class="muted">Trust your eyes: no measuring!</p><div class="card-actions"><button class="btn" id="labGo">Start</button></div>`); labWire();
  $("#labGo").onclick=run;
  const done=()=>{ const avg=errs.reduce((a,b)=>a+b,0)/errs.length, r=Math.round(Math.abs(avg));
    labDone(25, `<div class="q">On average you made line B <b>${r}% ${avg<0?"shorter":"longer"}</b> than line A.</div>
      <p>${avg<-3?"🎯 <b>The illusion fooled you!</b> The line with outward fins looks longer, so you made it shorter to compensate.":Math.abs(avg)<=3?"👀 <b>Eagle eyes!</b> The illusion barely fooled you.":"Interesting: you went the other way. Most people make line B shorter."}</p>
      <p class="muted"><b>Gregory's explanation:</b> the fins look like the corners of buildings. Outward fins (B) look like the inside corner of a room, far away; inward fins (A) look like the outside corner of a building, close by. Our brain applies size constancy, so the 'further away' line looks longer.</p>`); };
}

function psyMarks(guess, ans){

function cleanName(raw){

/* ================= FOCUS TIMER ================= */
const FOCUS_MIN=25, FOCUS_NEED=15;   // answer at least 15 questions during the session to earn the bonus
let focusTimer=null;
function focusOn(){ return G.focus && G.focus.end > Date.now(); }
function focusBtnRender(){
  const b=$("#focusBtn"); if(!b) return;
  if(G.focus && G.focus.end){ const left=Math.max(0,G.focus.end-Date.now()), s=Math.ceil(left/1000);
    b.innerHTML=`🎯 <span>${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</span>`; b.classList.add("on"); b.setAttribute("aria-label",`Focus session: ${Math.floor(s/60)} minutes left. Click to stop.`);
  } else { b.innerHTML="🎯"; b.classList.remove("on"); b.setAttribute("aria-label","Start a 25-minute focus session"); }
}
function focusTick(){
  if(!G.focus || !G.focus.end){ clearInterval(focusTimer); focusBtnRender(); return; }
  if(Date.now()>=G.focus.end) return focusEnd(true);
  focusBtnRender();
}
function focusStart(){
  G.focus={end:Date.now()+FOCUS_MIN*60000, start:G.st.cards}; save();
  clearInterval(focusTimer); focusTimer=setInterval(focusTick,1000); focusBtnRender();
  toast("🎯", "Focus session started: 25 minutes", `Pop-ups are paused. Answer at least ${FOCUS_NEED} questions to earn the bonus.`, true);
}
function focusEnd(finished){
  const done=G.st.cards-(G.focus.start||0); G.focus=null; clearInterval(focusTimer); focusBtnRender();
  if(finished && done>=FOCUS_NEED){ const xp=60; G.st.focus=(G.st.focus||0)+1; addXP(xp,false); sfx("lvl"); confetti(120);
    toast("🎯", `Focus session complete! +${xp} XP`, `${done} questions in 25 minutes. Take a 5-minute break.`, true); }
  else if(finished) toast("🎯", "Focus session over", `You answered ${done} questions. Answer ${FOCUS_NEED}+ next time for the bonus.`, true);
  else toast("🎯", "Focus session stopped", "No bonus this time.", true);
  checkBadges(); save();
}
function focusClick(){ if(G.focus && G.focus.end){ if(confirm("Stop your focus session? You won't get the bonus.")) focusEnd(false); } else focusStart(); }

/* ---- save codes ---- */
const b64e = bytes => { let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function makeSave(){
  const json=JSON.stringify({v:1, p:store.p, sel:store.sel, all:store.all, g:store.g});
  if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); return "FOUNT-Z:"+b64e(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "FOUNT-J:"+b64e(new TextEncoder().encode(json));
}
async function readSave(code){
  code=code.trim().replace(/\s+/g,""); let json;
  if(code.startsWith("FOUNT-Z:")){ const st=new Blob([b64d(code.slice(8))]).stream().pipeThrough(new DecompressionStream("gzip")); json=await new Response(st).text(); }
  else if(code.startsWith("FOUNT-J:")) json=new TextDecoder().decode(b64d(code.slice(8)));
  else throw new Error("not a save code");
  const s=JSON.parse(json); if(!s || typeof s.p!=="object" || typeof s.g!=="object") throw new Error("bad save"); return s;
}
async function loadSave(code){
  const msg=$("#loadMsg")||$("#saveMsg");
  try{
    const s=await readSave(code), lv=lvlFor(s.g.xp||0), kn=Object.values(s.p).filter(v=>v==="k").length;
    if(!confirm(`Load this save? Level ${lv}, ${(s.g.xp||0).toLocaleString()} XP, ${kn} cards known.\n\nThis replaces the progress on this device (currently level ${lvlFor(G.xp)}).`)) return;
    localStorage.setItem(KEY, JSON.stringify({p:s.p, sel:s.sel||store.sel, all:s.all||store.all, g:s.g}));
    location.reload();
  }catch(e){ msg.innerHTML='<span style="color:var(--warn)">That doesn\'t look like a save code. It should start with <b>FOUNT-</b>. Make sure you copied all of it, right to the end.</span>'; }
}
function saveStatus(){
  if(!G.backupAt) return ["warn","⚠️ You haven't made a save code yet"];
  const d=dayNum(today())-dayNum(G.backupAt);
  return d===0?["ok","✅ Saved today"]:d===1?["ok","✅ Last saved yesterday"]:d<7?["ok",`✅ Last saved ${d} days ago`]:["warn",`⚠️ Last saved ${d} days ago: time for a new one`];
}

function wireSave(){
  const msg=$("#saveMsg"), done=()=>{ flag("backup"); markBackup(); const st=$(".save-status"); if(st){ const [c,t]=saveStatus(); st.className="save-status "+c; st.textContent=t; } };
  $("#saveCopy").onclick=async()=>{ const c=await makeSave(); $("#saveCode").value=c;
    try{ await navigator.clipboard.writeText(c); done(); $("#saveOut").hidden=true;
      msg.innerHTML=`<b style="color:var(--good)">✅ Copied!</b> Now do step 2: paste it somewhere safe.`; }
    catch(e){ $("#saveOut").hidden=false; $("#saveCode").select(); done();
      msg.textContent="Your browser wouldn't copy it automatically. Your code is in the box above: select all of it and copy it."; } };
  const sh=$("#saveShare"); if(sh) sh.onclick=async()=>{ const c=await makeSave();
    try{ await navigator.share({title:"My Fount GCSE save code", text:c}); done(); msg.innerHTML=`<b style="color:var(--good)">✅ Sent.</b> Keep that message safe.`; }
    catch(e){ if(e && e.name!=="AbortError"){ $("#saveCode").value=c; $("#saveOut").hidden=false; msg.textContent="Couldn't open the share menu. Copy the code from the box above instead."; } } };
  $("#saveFile").onclick=async()=>{ done(); const c=await makeSave(), a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([c],{type:"text/plain"})); a.download=`fount-save-level-${lvlFor(G.xp)}-${today()}.txt`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); msg.textContent="Backup file downloaded. Keep it somewhere safe."; };
  $("#saveLoad").onclick=()=>{ const v=$("#saveIn").value; if(v.trim()) loadSave(v); else { $("#loadMsg").innerHTML='<span style="color:var(--warn)">Paste your save code into the box first.</span>'; $("#saveIn").focus(); } };
  $("#saveUp").onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(loadSave); };
}

function weakData(){
  return TOPICS.map(t=>{ const it=DATA.filter(d=>d.t===t.key), n=it.length||1;
    const k=it.filter(d=>status(d.id)==="k").length, l=it.filter(d=>status(d.id)==="l").length;
    const acc=(G.tacc||{})[t.key]||[0,0], mist=it.filter(d=>G.mistakes[d.id]!==undefined).length;
    const ex=EXT.filter(x=>x.t===t.key), exDone=ex.filter(x=>G.ext.done[x.id]).length;
    const mockT=((G.mocks||{}).topic||{})[t.key], boss=G.bosses[t.key]||{};
    const parts=[k/n*100]; if(acc[1]>=10) parts.push(acc[0]/acc[1]*100); if(mockT&&mockT[1]) parts.push(mockT[0]/mockT[1]*100);
    const seen=k+l>0 || acc[1]>0;
    return {t, n, k, l, acc, mist, ex:ex.length, exDone, mockT, boss, seen, strength:Math.round(parts.reduce((a,b)=>a+b,0)/parts.length)};
  });
}

function topicStats(){

    return {key:t.key, k:Math.round(it.filter(d=>status(d.id)==="k").length/n*100), l:Math.round(it.filter(d=>status(d.id)==="l").length/n*100)}; });
}

/* ================= PROGRESS REPORT CODES ================= */
// Format "FR1." + base64url(bytes). Bytes: version, name, then varints/bytes in a fixed order, then a 16-bit checksum.
function varint(arr, n){ n=Math.max(0,Math.floor(n||0)); while(n>=128){ arr.push((n%128)|128); n=Math.floor(n/128); } arr.push(n); }
function readVar(b, p){ let n=0, m=1, x; do{ x=b[p.i++]; if(x===undefined) throw new Error("short"); n+=(x&127)*m; m*=128; }while(x&128); return n; }
const ck16 = bytes => { let h=0x811c9dc5; for(const x of bytes){ h^=x; h=Math.imul(h,16777619)>>>0; } return (h ^ (h>>>16)) & 0xffff; };
const b64u = bytes => b64e(bytes).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => b64d(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
const popcount = n => { let c=0; while(n){ c+=n&1; n=Math.floor(n/2); } return c; };
function makeReport(){
  const bytes=[3];
  const nm=[...new TextEncoder().encode((G.name||"").trim().slice(0,24))].slice(0,40); bytes.push(nm.length, ...nm);
  bytes.push(YEAR==="y10"?10:YEAR==="y11"?11:0);
  varint(bytes, dayNum(today())-dayNum("2026-01-01"));
  varint(bytes, G.xp); varint(bytes, knownTotal());
  const ts=topicStats(); ts.forEach(s=>bytes.push(s.k)); ts.forEach(s=>bytes.push(s.l));
  bytes.push(G.st.cards ? Math.round(G.st.right/G.st.cards*100) : 0);
  varint(bytes, liveStreak()); varint(bytes, G.best);
  let bm=0; TOPICS.forEach((t,i)=>{ if(G.bosses[t.key] && G.bosses[t.key].won) bm+=Math.pow(2,i); }); varint(bytes, bm);
  varint(bytes, G.st.cards);
  let act=0; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(G.hist[ymd(d)]) act+=Math.pow(2,i); } varint(bytes, act);
  const reps=Object.entries(G.creps||{}).filter(([id])=>canReport(+id)).slice(-40); bytes.push(reps.length); reps.forEach(([id,r])=>{ varint(bytes,+id); bytes.push((r.r&15)*8+(r.m&7)); });   // reported cards
  const c=ck16(bytes); bytes.push(c>>8, c&255);
  return "FR1."+b64u(new Uint8Array(bytes));
}
function parseReport(code){
  const b=unb64u(code.slice(4)); if(b.length<12) throw new Error("short");
  const body=b.slice(0,-2), c=(b[b.length-2]<<8)|b[b.length-1]; if(ck16(body)!==c) throw new Error("checksum");
  const p={i:0}, ver=body[p.i++]; if(ver<1 || ver>3) throw new Error("version");
  const nl=body[p.i++]; const name=new TextDecoder().decode(body.slice(p.i,p.i+nl)).trim(); p.i+=nl;
  const yb=ver>=2?body[p.i++]:0, year=yb===10?"y10":yb===11?"y11":"";
  const day=readVar(body,p), xp=readVar(body,p), known=readVar(body,p);
  const k=[], l=[]; for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); k.push(v); }
  for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); l.push(v); }
  const acc=body[p.i++], streak=readVar(body,p), best=readVar(body,p), bm=readVar(body,p), qs=readVar(body,p), act=readVar(body,p);
  const reps=[]; if(ver>=3){ const n=body[p.i++]; if(n===undefined||n>40) throw new Error("bad"); for(let j=0;j<n;j++){ const id=readVar(body,p), x=body[p.i++]; if(x===undefined) throw new Error("short"); reps.push({id, r:x>>3, m:x&7}); } }
  if(p.i!==body.length) throw new Error("length");
  const d=new Date(2026,0,1); d.setDate(d.getDate()+day);
  let last=-1; for(let i=0;i<14;i++) if(Math.floor(act/Math.pow(2,i))%2){ last=i; break; }
  return {reps, name:name||"(no name)", year, date:ymd(d), xp, level:lvlFor(xp), known, k, l, acc, streak, best, bosses:popcount(bm), qs, act14:popcount(act), act7:popcount(act%128), lastDaysAgo:last};
}

function persistCodes(){ try{ if($("#tRem") && $("#tRem").checked) localStorage.setItem(TKEY, [...T.reports.values()].map(r=>r.code).join("\n")); }catch(e){} }
function addCodes(text, quiet){

  persistCodes(); tRender();
}

  $("#pAll").onclick=()=>{ P.sel=TOPICS.map(t=>t.key); projSetup(); };
  $("#pY10").onclick=()=>{ P.sel=TOPICS.map(t=>t.key).filter(k=>k!=="Exam skills" && taughtFor("y10",k)); projSetup(); };
  tp.querySelectorAll("[data-teams]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.teams; while(P.teams.length<n) P.teams.push("Team "+(P.teams.length+1)); P.teams=P.teams.slice(0,n); projSetup(); });
  tp.querySelectorAll("[data-team]").forEach(inp=>inp.oninput=()=>{ P.teams[+inp.dataset.team]=inp.value||("Team "+(+inp.dataset.team+1)); });
  tp.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ P.n=+b.dataset.n; projSetup(); });
  tp.querySelectorAll("[data-pmode]").forEach(b=>b.onclick=()=>{ P.mode=b.dataset.pmode; if(P.mode==="race" && P.n<20) P.n=20; projSetup(); });
  tp.querySelectorAll("[data-secs]").forEach(b=>b.onclick=()=>{ P.secs=+b.dataset.secs; projSetup(); });
  $("#pFull").onclick=projFull; $("#pExit").onclick=()=>{ clearInterval(P.timer); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
  $("#pGo").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); P.pos=P.teams.map(()=>0); projQ(); };
}
function projFull(){ const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }
function projScore(){ if(P.mode==="race") return projTrack(); return `<div class="proj-scores">${P.teams.map((t,i)=>`<button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b><span class="pts">${P.scores[i]}</span></button>`).join("")}</div>`; }
function projQ(){
  clearInterval(P.timer); P.revealed=false; P.awarded=new Set();
  const d=P.items[P.i], t=TMAP[d.t];
  P.opts = d.wrong ? mcFor(d, rngFrom("proj-"+d.id+"-"+P.i)) : null;
  $("#teacherApp").innerHTML=`<div class="proj play" style="--c:${t.c}"><div class="proj-bar"><b>Question ${P.i+1} of ${P.items.length}</b><span class="proj-topic">${esc(t.name)}</span><span class="spacer"></span><span class="proj-time" id="pTime"></span><button class="btn ghost" id="pFull">⛶</button><button class="btn ghost" id="pEnd">End</button></div>
    ${P.secs?`<div class="timebar" id="ptb"><i id="ptbFill"></i></div>`:""}
    <div class="proj-card">${d.sc?`<div class="proj-sc">${esc(d.sc)}</div>`:""}<div class="proj-q">${esc(d.q)}</div>
      ${P.opts?`<ol class="proj-opts">${P.opts.opts.map((o,i)=>`<li data-o="${i}">${esc(o)}</li>`).join("")}</ol>`:""}
      <div class="proj-a" id="pAns" hidden><div class="tag">Answer</div><div class="a">${P.opts?esc(P.opts.opts[P.opts.correct]):fmtAnswer(d.a,d.id)}</div>${whyHTML(d)}</div></div>
    <div class="proj-actions"><button class="btn proj-go" id="pReveal">Reveal answer <kbd>Space</kbd></button></div>
    ${projScore()}</div>`;
  wireProj();
  if(P.secs){ P.end=Date.now()+P.secs*1000; P.timer=setInterval(projTick,100); projTick(); }
}
function projTick(){
  const left=P.end-Date.now(), f=$("#ptbFill"), tm=$("#pTime"); if(!f){ clearInterval(P.timer); return; }
  f.style.width=Math.max(0,left/(P.secs*1000)*100)+"%"; $("#ptb").classList.toggle("low", left<5000);
  tm.textContent=Math.max(0,Math.ceil(left/1000))+"s";
  if(left<=0){ clearInterval(P.timer); tm.textContent="Time!"; sfx("no"); }
}
function wireProj(){
  $("#pFull").onclick=projFull;
  $("#pEnd").onclick=projEnd;
  const r=$("#pReveal"); if(r) r.onclick=projReveal;
  document.querySelectorAll("[data-award]").forEach(b=>b.onclick=()=>projAward(+b.dataset.award));
  const n=$("#pNext"); if(n) n.onclick=projNext;
  const nb=$("#pNobody"); if(nb) nb.onclick=projNext;
}
function projReveal(){
  if(P.revealed) return; P.revealed=true; clearInterval(P.timer);
  $("#pAns").hidden=false; sfx("badge");
  if(P.opts){ document.querySelectorAll(".proj-opts li").forEach(li=>li.classList.add(+li.dataset.o===P.opts.correct?"right":"dim")); }
  document.querySelector(".proj-actions").innerHTML=`<button class="btn ghost" id="pNobody">Nobody got it</button><button class="btn proj-go" id="pNext">${P.i+1>=P.items.length?"See the winners":"Next question"} <kbd>Space</kbd></button>`;
  document.querySelector(".proj-scores").outerHTML=projScore();
  wireProj();
}
function projTrack(){
  const sq=n=>RACE_SQ[n]>0?"🪜":RACE_SQ[n]<0?"🐍":n===RACE_LEN?"🏁":"";
  return `<div class="proj-scores race">${P.teams.map((t,i)=>`<div class="race-lane"><button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b></button>
    <div class="race-track">${Array.from({length:RACE_LEN+1},(_,n)=>`<span class="race-sq ${n===RACE_LEN?"fin":""} ${RACE_SQ[n]>0?"up":RACE_SQ[n]<0?"down":""}">${P.pos[i]===n?`<i class="race-tok" style="--h:${i*57}">${i+1}</i>`:sq(n)}</span>`).join("")}</div></div>`).join("")}</div>`;
}
function projAward(i){
  if(!P.revealed || i>=P.teams.length) return;
  if(P.mode==="race"){
    if(P.awarded.has(i)){ P.awarded.delete(i); P.pos[i]=P.prev[i]; }
    else { P.awarded.add(i); P.prev[i]=P.pos[i]; let n=Math.min(RACE_LEN,P.pos[i]+1); const fx=RACE_SQ[n]||0; n=Math.max(0,Math.min(RACE_LEN,n+fx)); P.pos[i]=n; sfx(fx<0?"no":"ok"); confetti(fx>0?60:30); }
    P.scores=P.pos.slice(); document.querySelector(".proj-scores").outerHTML=projScore(); wireProj(); return;
  }
  if(P.awarded.has(i)){ P.awarded.delete(i); P.scores[i]--; } else { P.awarded.add(i); P.scores[i]++; sfx("ok"); confetti(40); }
  document.querySelector(".proj-scores").outerHTML=projScore(); wireProj();
}
function projNext(){ P.i++; if(P.i>=P.items.length || (P.mode==="race" && P.pos.some(x=>x>=RACE_LEN))) projEnd(); else projQ(); }
function projEnd(){
  clearInterval(P.timer);
  const order=P.teams.map((t,i)=>({t,s:P.scores[i]})).sort((a,b)=>b.s-a.s);
  const top=order[0]?order[0].s:0, winners=order.filter(o=>o.s===top);
  const pod=[order[1],order[0],order[2]];
  $("#teacherApp").innerHTML=`<div class="proj"><div class="proj-bar"><b>📽️ Final scores</b><span class="spacer"></span><button class="btn ghost" id="pFull">⛶</button></div>
    <h2 class="proj-win">${winners.length>1?"It's a draw! 🤝":"🏆 "+esc(winners[0].t)+" wins!"}</h2>
    <div class="podium">${pod.map((o,j)=>o?`<div class="pod p${[2,1,3][j]}"><b>${esc(o.t)}</b><span>${P.mode==="race"?(o.s>=RACE_LEN?"🏁 Finished":"Square "+o.s):`${o.s} pt${o.s===1?"":"s"}`}</span><div class="block">${[2,1,3][j]}</div></div>`:"<div></div>").join("")}</div>
    ${order.length>3?`<p class="muted" style="text-align:center">${order.slice(3).map((o,j)=>`${j+4}. ${esc(o.t)} (${o.s})`).join(" · ")}</p>`:""}
    <div class="proj-actions"><button class="btn proj-go" id="pAgain">Play again</button><button class="btn ghost" id="pSetup">Change settings</button><button class="btn ghost" id="pExit">Back to teacher tools</button></div></div>`;
  sfx("lvl"); confetti(260);
  $("#pFull").onclick=projFull;
  $("#pAgain").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); P.pos=P.teams.map(()=>0); projQ(); };
  $("#pSetup").onclick=projSetup;
  $("#pExit").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
}
document.addEventListener("keydown",e=>{
  if(!TEACHER || !document.querySelector(".proj.play") || e.target.matches("input,textarea")) return;
  if(e.key===" "){ e.preventDefault(); P.revealed ? projNext() : projReveal(); }

});

   Department structure: describe (4 marks: a study = aim, method, results, conclusion; a theory = four key points),
