const AO2 = [{"t":"Memory","sc":"Amir moved house and keeps writing his old postcode on forms.","q":"Which factor affecting memory explains this?","a":"Proactive interference","wrong":["Retroactive interference","Context","False memory"],"why":"Old information (old postcode) is disrupting new information: proactive interference."},{"t":"Memory","sc":"After learning Spanish, Erin finds she has forgotten most of her French vocabulary.","q":"Which factor affecting memory explains this?","a":"Retroactive interference","wrong":["Proactive interference","The primacy effect","Context"],"why":"New learning (Spanish) has disrupted old learning (French): retroactive interference."},{"t":"Memory","sc":"Jo can't remember her friend's name at a party, but remembers it straight away when she walks back into the café where they met.","q":"Which factor affecting memory explains this?","a":"Context","wrong":["Interference","False memory","The recency effect"],"why":"Being back in the same place gave cues that triggered recall."},{"t":"Memory","sc":"Leah reads a shopping list once and, at the shop, remembers the first three items and the last two.","q":"Which effect does this show?","a":"The serial position effect (primacy and recency)","wrong":["Interference","Reconstructive memory","Context-dependent forgetting"],"why":"Early items reached LTM through rehearsal; the last items were still in STM."},{"t":"Memory","sc":"Raj remembers his tenth birthday party in vivid detail: the cake, who came and how he felt.","q":"Which type of long-term memory is this?","a":"Episodic memory","wrong":["Semantic memory","Procedural memory","Short-term memory"],"why":"A personal event with a time and place is an episodic memory."},{"t":"Memory","sc":"Mia knows that Paris is the capital of France but can't remember when she learned it.","q":"Which type of long-term memory is this?","a":"Semantic memory","wrong":["Episodic memory","Procedural memory","Sensory memory"],"why":"Facts and knowledge, not tied to when you learned them, are semantic."},{"t":"Memory","sc":"Tom can ride a bike without thinking about how he balances.","q":"Which type of long-term memory is this?","a":"Procedural memory","wrong":["Episodic memory","Semantic memory","Short-term memory"],"why":"Knowing how to do something automatically is procedural memory."},{"t":"Memory","sc":"Sam repeats a phone number over and over until he can dial it.","q":"What is Sam doing, according to the multi-store model?","a":"Maintenance rehearsal, to keep it in STM","wrong":["Encoding it semantically into LTM","Retrieving it from LTM","Storing it in sensory memory"],"why":"Repeating information keeps it in STM; enough rehearsal can transfer it to LTM."},{"t":"Memory","sc":"After a lively family argument, each relative remembers it differently, adding details that fit their own view.","q":"Which theory explains this best?","a":"Reconstructive memory","wrong":["The multi-store model","Procedural memory","The primacy effect"],"why":"We fill gaps using our own schemas, so memories are reconstructed differently."},{"t":"Memory","sc":"A witness is asked 'How fast was the car going when it smashed into the bus?' and later 'remembers' broken glass that wasn't there.","q":"What has happened to the witness's memory?","a":"A false memory, created by a leading question","wrong":["Retroactive interference from a new list","Context-dependent forgetting","Displacement from STM"],"why":"New information in the question was used to reconstruct the memory."},{"t":"Perception","sc":"In a painting of a beach, the people near the top of the picture look further away.","q":"Which depth cue is this?","a":"Height in plane","wrong":["Relative size","Occlusion","Linear perspective"],"why":"Objects higher in the visual field are seen as further away."},{"t":"Perception","sc":"In a photo, one car hides part of another car behind it.","q":"Which depth cue is this?","a":"Occlusion","wrong":["Height in plane","Relative size","Texture gradient"],"why":"When one object covers part of another, the covering object looks closer."},{"t":"Perception","sc":"As Zara looks down a long corridor, the sides seem to meet in the distance.","q":"Which depth cue is this?","a":"Linear perspective","wrong":["Height in plane","Occlusion","Retinal disparity"],"why":"Parallel lines appear to converge as they get further away."},{"t":"Perception","sc":"Ben catches a ball easily with both eyes open but misses with one eye closed.","q":"Which kind of depth cue is he losing?","a":"A binocular cue, e.g. retinal disparity","wrong":["A monocular cue, e.g. height in plane","Size constancy","Motion parallax"],"why":"Binocular cues need both eyes, so closing one removes them."},{"t":"Perception","sc":"From a moving train, nearby fences rush past while distant hills hardly move.","q":"Which part of Gibson's theory is this?","a":"Motion parallax","wrong":["Affordances","Texture gradient","Size constancy"],"why":"Closer objects seem to move faster when you're moving: motion parallax."},{"t":"Perception","sc":"A hungry student walking through town notices every bakery but no other shops.","q":"Which factor affecting perception explains this?","a":"Motivation","wrong":["Culture","Expectation","Emotion"],"why":"We notice things that meet our needs: motivation affects perceptual set."},{"t":"Perception","sc":"Ella is told a film is terrifying. During the film she jumps at a harmless shadow.","q":"Which factor affecting perception explains this?","a":"Expectation","wrong":["Motivation","Culture","Size constancy"],"why":"She expected to be scared, so her perceptual set made the shadow seem threatening."},{"t":"Perception","sc":"A friend sees the face-or-vase picture as a vase, then suddenly sees two faces.","q":"Which explanation of illusions is this?","a":"Ambiguity","wrong":["Fiction","Misinterpreted depth cues","Size constancy"],"why":"An ambiguous figure has two equally likely interpretations."},{"t":"Perception","sc":"People see a white triangle in a drawing where no triangle is drawn, only three cut-out circles.","q":"Which explanation of illusions is this?","a":"Fiction","wrong":["Ambiguity","Size constancy","Linear perspective"],"why":"Fiction is perceiving something that isn't there, as the brain fills in the gaps."},{"t":"Perception","sc":"Someone who grew up in a round-house village is less fooled by the Müller-Lyer illusion than a city dweller.","q":"Whose theory does this support?","a":"Gregory's constructivist theory","wrong":["Gibson's direct theory","Piaget's stage theory","Hebb's theory"],"why":"Different experience leads to different perception: nurture, as Gregory says."},{"t":"Development","sc":"Ava, 18 months, looks for her toy after it is hidden under a cushion.","q":"What has Ava developed?","a":"Object permanence","wrong":["Conservation","Decentring","Abstract thinking"],"why":"Knowing that objects still exist when out of sight develops in the sensorimotor stage."},{"t":"Development","sc":"Leo, 4, thinks his grandma can see the picture he's holding up to the phone during a call.","q":"Which feature of the pre-operational stage is this?","a":"Egocentrism","wrong":["Conservation","Object permanence","Reversibility"],"why":"He can only see things from his own point of view."},{"t":"Development","sc":"Isla, 5, says a squashed ball of clay has 'less clay' than a round one.","q":"What can't Isla do yet?","a":"Conserve","wrong":["Show object permanence","Use symbols","Classify objects"],"why":"Pre-operational children can't understand that quantity stays the same when appearance changes."},{"t":"Development","sc":"Noah, 13, can think about 'What would happen if there were no gravity?'","q":"Which of Piaget's stages is Noah in?","a":"Formal operational","wrong":["Concrete operational","Pre-operational","Sensorimotor"],"why":"Hypothetical, abstract thinking appears in the formal operational stage (11+)."},{"t":"Development","sc":"A toddler who knows 'bird' sees a plane and calls it a bird.","q":"Which process is this?","a":"Assimilation","wrong":["Accommodation","Equilibrium","Conservation"],"why":"Fitting new information into an existing schema is assimilation."},{"t":"Development","sc":"The toddler is told 'that's a plane, not a bird' and creates a new idea for planes.","q":"Which process is this?","a":"Accommodation","wrong":["Assimilation","Egocentrism","Reversibility"],"why":"Changing a schema or creating a new one is accommodation."},{"t":"Development","sc":"Kai says 'I'm just not a science person, so there's no point trying.'","q":"Which mindset does Kai show?","a":"A fixed mindset","wrong":["A growth mindset","High self-efficacy","Learning goals"],"why":"Believing ability can't change is a fixed mindset."},{"t":"Development","sc":"A teacher wants her class to develop a growth mindset.","q":"What should she praise?","a":"Effort and strategies","wrong":["Intelligence","Natural talent","Speed of finishing"],"why":"Dweck says praising effort, not ability, encourages a growth mindset."},{"t":"Development","sc":"Priya did well in her last maths test, so she believes she can tackle the hard questions this time.","q":"Which concept is this?","a":"Self-efficacy","wrong":["Fixed mindset","Egocentrism","Assimilation"],"why":"Belief in your ability to succeed, based on past success, is self-efficacy."},{"t":"Development","sc":"A school spends money testing every student's 'learning style' and teaching visual learners only with pictures.","q":"Whose ideas does this go against?","a":"Willingham's","wrong":["Piaget's","Dweck's","Hebb's"],"why":"Willingham argues there's no evidence for teaching to learning styles."},{"t":"RM","sc":"A researcher compares memory scores of students who chew gum and students who don't.","q":"What is the IV?","a":"Whether students chew gum or not","wrong":["Their memory scores","The students' ages","The room they're tested in"],"why":"The IV is what the researcher changes between conditions."},{"t":"RM","sc":"The same 20 participants do a test in silence and then with music.","q":"Which experimental design is this?","a":"Repeated measures","wrong":["Independent groups","Matched pairs","A correlation"],"why":"The same people take part in both conditions."},{"t":"RM","sc":"A researcher picks every student whose name is drawn from a hat containing the whole year group's names.","q":"Which sampling method is this?","a":"Random sampling","wrong":["Opportunity sampling","Volunteer sampling","Stratified sampling"],"why":"Everyone in the target population had an equal chance of being picked."},{"t":"RM","sc":"A psychologist puts up a poster asking for people to take part in a sleep study.","q":"Which sampling method is this?","a":"Volunteer sampling","wrong":["Random sampling","Opportunity sampling","Stratified sampling"],"why":"Participants choose to take part by responding to an advert."},{"t":"RM","sc":"A study finds that the more time teens spend outdoors, the better their mood.","q":"What type of relationship is this?","a":"A positive correlation","wrong":["A negative correlation","No correlation","Cause and effect"],"why":"As one variable increases, so does the other."},{"t":"RM","sc":"Some participants in a quiz study were tested at 9am and others at 4pm.","q":"What problem is this?","a":"Time of day is an extraneous variable","wrong":["It is a confederate","It is the DV","It is a null hypothesis"],"why":"Something other than the IV that could affect the results."},{"t":"RM","sc":"Participants watched people on a high street without them knowing.","q":"What kind of observation is this?","a":"Covert and naturalistic","wrong":["Overt and controlled","Participant and controlled","Overt and naturalistic"],"why":"Covert = they don't know; naturalistic = real-life setting."},{"t":"RM","sc":"After a study that used deception, the researcher explains its true aim to every participant.","q":"What is this called?","a":"Debriefing","wrong":["Informed consent","Confidentiality","Right to withdraw"],"why":"Explaining the true purpose at the end is debriefing."},{"t":"Social influence","sc":"Ruby changes her answer to match the rest of her group, even though she thinks they're wrong.","q":"What is this called?","a":"Conformity","wrong":["Obedience","Deindividuation","Bystander behaviour"],"why":"Changing behaviour to fit in with a group of equals is conformity."},{"t":"Social influence","sc":"A man in a hi-vis jacket tells people to move away from a door, and they do without asking why.","q":"Which explanation of obedience fits best?","a":"Agency theory: they see him as a legitimate authority","wrong":["The authoritarian personality","Deindividuation","Diffusion of responsibility"],"why":"They shift into the agentic state because of his apparent authority."},{"t":"Social influence","sc":"Someone trips in a busy shopping centre and nobody helps.","q":"Which concept explains this?","a":"Diffusion of responsibility","wrong":["Deindividuation","Obedience","Conformity"],"why":"With lots of people around, each person feels less responsible to help."},{"t":"Social influence","sc":"Fans in matching shirts and face paint chant things they'd never say on their own.","q":"Which concept explains this?","a":"Deindividuation","wrong":["Obedience","Agency theory","Diffusion of responsibility"],"why":"Anonymity in a crowd reduces a person's sense of individual identity and responsibility."},{"t":"Social influence","sc":"A student only gives the group's wrong answer when answering out loud, not when writing it down privately.","q":"Which factor affecting conformity is this?","a":"Anonymity","wrong":["Group size","Task difficulty","Expertise"],"why":"People conform less when their answers are private."},{"t":"Social influence","sc":"A first-aider at a train station helps straight away while others stand back.","q":"Which factor affecting bystander behaviour is this?","a":"Expertise","wrong":["Presence of others","Cost of helping","Similarity to the victim"],"why":"People with relevant skills are more likely to help."},{"t":"Social influence","sc":"A person raised by very strict, harsh parents is extremely obedient to people in charge.","q":"Which explanation of obedience fits best?","a":"The authoritarian personality","wrong":["Agency theory","Deindividuation","Social loafing"],"why":"Adorno linked a strict upbringing to an authoritarian personality."},{"t":"Social influence","sc":"Conformity rises when a maths problem is very hard.","q":"Which factor affecting conformity is this?","a":"Task difficulty","wrong":["Anonymity","Group size","Culture"],"why":"When unsure, people look to the group for the answer."},{"t":"Language, thought & communication","sc":"A child must first understand the idea of 'more' before using the word 'more' properly.","q":"Whose theory does this support?","a":"Piaget's: thought comes before language","wrong":["Sapir-Whorf: language comes before thought","Von Frisch's","Darwin's"],"why":"Piaget says children can only use words for concepts they already understand."},{"t":"Language, thought & communication","sc":"Speakers of a language with lots of words for blue are quicker at telling shades of blue apart.","q":"Which theory does this support?","a":"The Sapir-Whorf hypothesis (weak version)","wrong":["Piaget's theory of language","Darwin's theory","The multi-store model"],"why":"Language influences how easily we think about and perceive differences."},{"t":"Language, thought & communication","sc":"Two people talking keep making eye contact to show whose turn it is to speak.","q":"What is eye contact doing here?","a":"Regulating the flow of conversation","wrong":["Showing a closed posture","Showing personal space","Showing attraction only"],"why":"Eye contact signals turn-taking in conversation."},{"t":"Language, thought & communication","sc":"During an interview, Jamal folds his arms and crosses his legs.","q":"What might this suggest?","a":"A closed posture: feeling defensive or uncomfortable","wrong":["An open posture: const SPEC_EXTRA = [{"t":"RM","q":"What is a frequency table?","a":"A table showing how often each score or category occurs, often using tallies","why":"It turns raw data into counts, so patterns are easy to see."},{"t":"RM","q":"Why might a researcher put data into a frequency table?","a":"To organise raw data so it's easy to see which scores or categories are most common","why":"It's a quick summary before drawing a graph or finding the mode."},{"t":"RM","q":"What is a pilot study?","a":"A small trial run of a study before the main study, to check the procedure and materials work","why":"It catches problems early, such as confusing questions, saving time and money later."},{"t":"RM","q":"Give one reason for carrying out a pilot study.","a":"To find and fix problems (e.g. unclear instructions or a task that's too hard) before the real study","why":"Fixing problems first makes the main study more valid."},{"t":"RM","q":"In a normal distribution, what shape is the graph?","a":"A symmetrical bell-shaped curve, with most scores in the middle","why":"Most people score near the average and fewer score at the extremes."},{"t":"RM","q":"What is a case study?","a":"An in-depth study of one person or a small group, often using several methods","why":"Used for rare cases that couldn't be created deliberately, like HM or Clive Wearing."},{"t":"RM","q":"Give a strength of case studies.","a":"They give rich, detailed data about unusual cases that couldn't be studied any other way","why":"You can't ethically damage someone's brain, but you can study a person whose brain was damaged."},{"t":"RM","q":"Give a weakness of case studies.","a":"They focus on one person or a small group, so the findings can't easily be generalised","why":"One unusual person may not be typical of everyone."},{"t":"Perception","q":"What is the difference between sensation and perception?","a":"Sensation is detecting information with the senses; perception is the brain interpreting it","why":"The eye senses light; the brain decides 'that's a car'."},{"t":"Perception","q":"Which explanation of illusions does Rubin's vase show?","a":"Ambiguity – it can be seen as a vase or as two faces","why":"Two equally likely interpretations, so perception flips between them."},{"t":"Perception","q":"What do people see in the Kanizsa triangle?","a":"A white triangle that isn't actually drawn (fiction)","why":"The brain fills in the missing edges to make the most likely shape."},{"t":"Perception","q":"What happens in the Ponzo illusion?","a":"Two identical lines look different lengths because they sit between converging lines","why":"The converging lines act as a linear perspective cue, so we misapply size constancy."},{"t":"Perception","q":"What does the Müller-Lyer illusion look like?","a":"Two equal lines, one with outward-pointing fins and one with inward-pointing fins, which look different lengths","why":"Gregory says the fins look like building corners, so we misread depth."},{"t":"Development","q":"Describe Piaget's three mountains task.","a":"Children were shown a model of three mountains and asked to choose a picture of what a doll could see from another position","why":"It tested egocentrism: could they take another person's view?"},{"t":"Development","q":"What did Piaget find with the three mountains task?","a":"Children under about 7 usually chose a picture of their own view, not the doll's","why":"He concluded pre-operational children are egocentric."},{"t":"Development","q":"Give a weakness of the three mountains task.","a":"It was confusing and abstract for young children, so it may have underestimated their ability","why":"Hughes used a more meaningful task and found children could decentre earlier."},{"t":"Social influence","q":"What is moral strain in agency theory?","a":"The anxiety felt when someone obeys an order that goes against their conscience","why":"Milgram's participants sweated and trembled: signs of moral strain."},{"t":"Social influence","q":"How does the cost of helping affect bystander behaviour?","a":"The higher the cost of helping (danger, effort, embarrassment), the less likely people are to help","why":"In Piliavin's study, the 'drunk' victim seemed more costly to help, so got help less often."},{"t":"Social influence","q":"What is the cost of NOT helping?","a":"The guilt or blame a bystander might feel if they don't help","why":"If not helping feels worse than helping, people are more likely to step in."},{"t":"Social influence","q":"How does similarity to the victim affect bystander behaviour?","a":"People are more likely to help someone they see as similar to themselves","why":"For example, football fans were more likely to help an injured stranger wearing their own team's shirt."},{"t":"Social influence","q":"What is a prosocial crowd?","a":"A crowd that behaves helpfully, e.g. people raising money together at a charity event","why":"Crowds aren't always bad: they can encourage helping too."},{"t":"Social influence","q":"What is an antisocial crowd?","a":"A crowd that behaves in harmful or aggressive ways, e.g. a riot","why":"Deindividuation can make antisocial behaviour more likely."},{"t":"Language, thought & communication","q":"Name two things human communication can do that animal communication can't.","a":"Talk about the past and future (displacement) and create brand-new words and sentences","why":"Animal communication is mostly fixed and about the here and now."},{"t":"Language, thought & communication","q":"Give two functions of animal communication.","a":"Any two: survival (e.g. warning of predators), reproduction (attracting a mate), territory, food","why":"Animal signals are usually about staying alive and passing on genes."},{"t":"Language, thought & communication","q":"Is animal communication usually fixed or creative?","a":"Fixed – animals use a limited set of signals and can't invent new ones","why":"Humans can make an endless number of new sentences."},{"t":"Brain & neuropsychology","q":"What does a sensory neuron do?","a":"Carries messages from the senses (receptors) to the central nervous system","why":"Sensory = information IN."},{"t":"Brain & neuropsychology","q":"What does a relay neuron do?","a":"Passes messages between sensory and motor neurons inside the CNS","why":"Relay = the middle link, like a relay race."},{"t":"Brain & neuropsychology","q":"What does a motor neuron do?","a":"Carries messages from the CNS to muscles or glands (effectors)","why":"Motor = commands OUT to make you move."},{"t":"Brain & neuropsychology","q":"What does the myelin sheath do?","a":"Insulates the axon and speeds up the electrical impulse","why":"Like the plastic coating on a wire."},{"t":"Brain & neuropsychology","q":"What are dendrites?","a":"Branches on a neuron that receive messages from other neurons","why":"Dendrites = receivers."},{"t":"Brain & neuropsychology","q":"What is the axon?","a":"The long fibre that carries the electrical impulse away from the cell body","why":"The impulse travels along the axon to the terminal."},{"t":"Psychological problems","q":"What is the difference between unipolar and bipolar depression?","a":"Unipolar depression involves only low mood; bipolar involves episodes of depression and mania (very high mood)","why":"'Uni' = one pole (low); 'bi' = two poles (low and high)."},{"t":"Psychological problems","q":"What is mania?","a":"A period of extremely high mood and energy, with racing thoughts and risky behaviour","why":"Mania is the 'high' episode in bipolar depression."},{"t":"Psychological problems","q":"How has the number of people reporting mental health problems changed over time?","a":"It has increased","why":"More people are being diagnosed and asking for help."},{"t":"Psychological problems","q":"Give two reasons why reported mental health problems may have increased.","a":"Any two: more awareness, less stigma, better diagnosis, more pressure (e.g. exams, social media), more willingness to seek help","why":"Some of the rise may be more reporting rather than more illness."},{"t":"Psychological problems","q":"Give one effect of mental health problems on society.","a":"Any one: cost to the NHS, people missing work, pressure on families and carers","why":"The impact spreads beyond the individual."},{"t":"Psychological problems","q":"Give one effect of mental health problems on the individual.","a":"Any one: difficulty working or studying, damaged relationships, stigma, physical health problems","why":"Mental health affects every part of daily life."},{"t":"Psychological problems","q":"What is dependence syndrome in addiction?","a":"A pattern of symptoms such as strong craving, difficulty controlling use, tolerance and withdrawal","why":"Diagnosis usually needs several of these symptoms over the past year."},{"t":"Psychological problems","q":"What does it mean to persist with a substance despite harm?","a":"Carrying on using it even when you know it's damaging your health or life","why":"It's one of the signs used to diagnose addiction."}];

/* ---- sound ---- */
let actx;
function tone(f,d,type="sine",t0=0,vol=.07){
  if(!G.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+t0;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
function sfx(k){
  if(k==="ok"){ const f=523*Math.pow(1.0595,Math.min(combo,14)); tone(f,.12,"triangle"); tone(f*1.5,.16,"triangle",.06); }
  else if(k==="no") tone(140,.22,"sawtooth",0,.04);
  else if(k==="lvl") [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",i*.09));
  else if(k==="badge") [784,1175,1568].forEach((f,i)=>tone(f,.25,"sine",i*.08));
  else if(k==="gold") [1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,"sine",i*.06,.05));
  else if(k==="tick") tone(880,.05,"square",0,.02);
}

/* ---- confetti ---- */
let parts=[], fxRun=false;
function confetti(n=140, colours){
  if(reduced()) return;
  const cv=$("#fx"), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const cols=colours||TOPICS.map(t=>t.c).concat(["#FFD54A","#4CC896"]);
  for(let i=0;i<n;i++){ const side=i%2; parts.push({x:(side?innerWidth*.85:innerWidth*.15), y:innerHeight*.6, vx:(side?-1:1)*(2+Math.random()*7), vy:-(8+Math.random()*9), r:4+Math.random()*5, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.4, life:0}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const cv=$("#fx"), ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30 && p.life<260);
  parts.forEach(p=>{ p.life++; p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9); ctx.restore(); });
  if(parts.length) requestAnimationFrame(fxLoop); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---- floaters, toasts, modal ---- */
function floater(text, el, cls=""){
  if(reduced()) return;
  let x=innerWidth/2, y=innerHeight/2;
  if(el && el.getBoundingClientRect){ const r=el.getBoundingClientRect(); if(r.width){ x=r.left+r.width/2; y=r.top; } }
  const f=document.createElement("div"); f.className="floater "+cls; f.textContent=text; f.style.left=x+"px"; f.style.top=(y-10)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),1200);
}
function toast(icon,title,sub="",force=false){
  if(!force && typeof focusOn==="function" && focusOn()) return;   // focus mode pauses pop-ups
  const w=$("#toasts"), t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`<span class="ti">${icon}</span><div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>`;
  w.appendChild(t); while(w.children.length>2) w.firstChild.remove();
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2800);
}
function levelUp(n){
  const old=rankFor(n-1), r=rankFor(n);
  sfx("lvl"); confetti(200);
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="levelup" role="dialog" aria-modal="true" aria-label="Level up"><div class="kick">Level up!</div><div class="num">${n}</div>
    <h3>${r!==old?"New rank: "+esc(r):esc(r)}</h3>${(()=>{const th=THEMES.find(t=>t.lvl===n);return th?`<p style="margin:0 0 8px;color:var(--ink)">🎨 New theme unlocked: <b>${esc(th.name)}</b>. Switch it on in the Themes tab.</p>`:""})()}${CERT_LEVELS.includes(n)?`<p style="margin:0 0 8px;color:var(--ink)">🏅 <b>Certificate unlocked!</b> Print it from the Progress tab.</p>`:""}<p>${lvlStart(n+1)-G.xp} XP to level ${n+1}. Keep it going.</p><button class="btn" id="luOk">Let's go</button></div>`;
  document.body.appendChild(o);
  const close=()=>{ o.remove(); document.removeEventListener("keydown",esc2,true); };
  const esc2=e=>{ if(e.key==="Tab") return; e.stopPropagation(); if(e.key==="Escape"||e.key==="Enter"||e.key===" "){ e.preventDefault(); close(); } };
  document.addEventListener("keydown",esc2,true);
  o.onclick=e=>{ if(e.target===o||e.target.id==="luOk") close(); };
  $("#luOk").focus();
}

/* ---- XP + streak core ---- */
function addXP(n, el, label){
  if(n<=0) return;
  G.xp+=n;
  if(el!==false) floater(label||("+"+n+" XP"), el, n>=40?"big":"");
  renderHud();
}
function checkStreak(){
  if(!G.last) return;
  const gap=dayNum(today())-dayNum(G.last);
  if(gap<=1) return;
  const missed=gap-1;
  if(G.streak>0 && G.freeze>=missed){
    G.freeze-=missed; const y=new Date(); y.setDate(y.getDate()-1); G.last=ymd(y);
    setTimeout(()=>toast("🧊","Streak freeze used",`Your ${G.streak}-day streak is safe. Hit today's goal to keep it.`),800);
  } else {
    if(G.streak>1) setTimeout(()=>toast("💔",`Your ${G.streak}-day streak ended`,"Start a new one today. Hit your daily goal."),800);
    G.streak=0;
  }
  save();
}
function goalMet(){
  const t=today();
  G.streak = (G.last && dayNum(t)-dayNum(G.last)===1) ? G.streak+1 : 1;
  G.last=t; if(G.streak>G.best) G.best=G.streak;
  confetti(160); sfx("badge");
  toast("🎯","Daily goal smashed! +50 XP", G.streak>1?`🔥 ${G.streak}-day streak`:"Streak started. Come back tomorrow to build it.");
  addXP(50,false);
  if(G.streak%7===0 && G.freeze<2){ G.freeze++; setTimeout(()=>toast("🧊","Streak freeze earned","It saves your streak if you miss a day."),1200); }
}
function answer({ok, el, mode, gold, x2, review, topic, boss}){
  checkStreak();
  const t=today();
  G.st.cards++; if(ok) G.st.right++;
  if(!ok && combo===7) G.flags.miller=1;
  if(t==="2026-12-03"||t==="2026-12-10") G.flags.nightbefore=1;
  if(t.slice(5)==="12-25") G.flags.festive=1;
  if(ok){ combo++; if(combo>G.st.combo) G.st.combo=combo; } else combo=0;
  const base = mode==="quiz" ? (ok?15:4) : mode==="arcade" ? (ok?6:1) : (ok?10:3);
  let mult = (ok ? comboMult() : 1) * ((x2 || topic==="Exam skills") ? 2 : 1) * eventMult(topic, boss);   // exam skills always earn double XP
  if(gold && ok){ mult*=5; G.st.gold++; }
  if(mode==="arcade") mult*=gotdMult();   // game of the day: double XP
  const xp=Math.round(base*mult)+(review?5:0);
  G.hist[t]=(G.hist[t]||0)+1;
  if(topic && TMAP[topic]){ G.tacc=G.tacc||{}; const ta=G.tacc[topic]=G.tacc[topic]||[0,0]; ta[1]++; if(ok) ta[0]++; }   // per-topic accuracy for Weak spots
  if(topic){ if(!G.tday || G.tday.d!==t) G.tday={d:t, c:{}}; G.tday.c[topic]=(G.tday.c[topic]||0)+1; }
  if(gold && ok){ sfx("gold"); confetti(70); } else sfx(ok?"ok":"no");
  addXP(xp, el, "+"+xp+" XP"+(mult>1?"  ×"+mult:""));
  if(!ok) floater("+"+xp+" XP for honesty", el, "meh");
  bumpCombo(ok);
  if(G.hist[t]>=G.goal && G.last!==t) goalMet();
  checkBadges(); save(); renderHud();
  return xp;
}
function resetCombo(){ combo=0; bumpCombo(false); }
function bumpCombo(ok){
  const c=$("#combo"); if(!c) return;
  c.classList.toggle("on", combo>=2); c.classList.toggle("hot", combo>=10);
  c.innerHTML=`🔥 ${combo}<small style="font-size:13px;opacity:.9">${comboMult()>1?"×"+comboMult():"combo"}</small>`;
  if(ok && combo>=2){ c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump"); }
  if(ok && [5,10,20].includes(combo)) toast("🔥",`${combo} in a row!`,`XP multiplier is now ×${comboMult()}`);
}

function onKnown(id, prevPct){
  if(!G.ever[id]){ G.ever[id]=1; G.xp+=5; renderHud(); }
  const d=BY_ID[id], t=TMAP[d.t], items=DATA.filter(x=>x.t===d.t);

}

// what kind of answer a card asks for, so wrong options are the same kind
function qKind(q){
  const s=q.toLowerCase();
  if(/\b(weakness|strength|criticis|evaluat|problem with|limitation|advantage|disadvantage|lack|why is .* (said|not|criticised)|how reliable|valid)/.test(s)) return "eval";
  if(/\b(how many|what percentage|what %|how long|how old|what age|how much)\b/.test(s)) return "num";
  if(/^(who|which psychologist|which researcher|which study|name (a|the|one|two)? ?(study|studies|researcher|psychologist)|what was the name|what are the named)/.test(s)) return "name";
  if(/\baim\b/.test(s)) return "aim";
  if(/\b(iv|dv|independent variable|dependent variable|extraneous)\b/.test(s)) return "var";
  if(/\bhypothesis\b/.test(s)) return "hyp";
  if(/\b(method|procedure|describe how|what did .* do|sample|design|how did)\b/.test(s)) return "method";
  if(/\b(found|result|discover|conclude|conclusion|show)\b/.test(s) || /\bfind\b(?! out)/.test(s)) return "find";
  if(/\b(applied|application|used in|real-life|real world|help)\b/.test(s)) return "apply";
  if(/\b(example|e\.g\.)\b/.test(s)) return "eg";
  if(/\b(which (process|stage|factor|cue|type|part|lobe|explanation)|what (process|stage|type))\b/.test(s)) return "term";
  if(/^(what is|what are|what does|define|what do we mean|explain what is meant)/.test(s)) return "def";
  return "other";
}
const NAMES_RE=/\b([A-Z][a-z]+(?:'s)?)\b/g, NOT_NAMES=new Set(["What","Which","Who","Give","Name","How","Why","Describe","Explain","Write","Is","Are","The","A","An","In","Outline","Identify","State","Does","Do","When","Where","If","One","Two","Under","CBT","DSM","ICD"]);
const qNames = q => new Set((q.match(NAMES_RE)||[]).map(n=>n.replace(/'s$/,"")).filter(n=>!NOT_NAMES.has(n)));
function mcFor(d, rng=Math.random){
  if(d.wrong){ const right=d.opt||d.a, opts=shuffleR([right,...d.wrong.slice(0,3)],rng); return {opts, correct:opts.indexOf(right)}; }
  const L=d.a.length, seen=new Set([d.a.toLowerCase()]), kind=qKind(d.q), names=qNames(d.q), hasNum=/\d/.test(d.a);
  const cands=DATA.filter(x=>!x.wrong && x.id!==d.id && x.id<5000 && x.t!=="Exam skills").map(x=>{
    const k=qKind(x.q);
    // never offer another valid answer about the same study/theory for evaluation or finding questions
    if((kind==="eval"||kind==="find") && k===kind && [...qNames(x.q)].some(n=>names.has(n))) return null;
    let s=Math.abs(x.a.length-L)*.6 + rng()*30;
    if(k!==kind) s+=400;
    if(x.t!==d.t) s+=80;
    if(/\d/.test(x.a)!==hasNum) s+=60;
    return [s, x.a];
  }).filter(Boolean).sort((a,b)=>a[0]-b[0]);
  const picks=[];
  for(const [,a] of cands.slice(0,10).sort(()=>rng()-.5)){ const k=a.toLowerCase(); if(!seen.has(k)){ seen.add(k); picks.push(a); } if(picks.length===3) break; }
  const opts=shuffleR([d.a,...picks],rng);
  return {opts, correct:opts.indexOf(d.a)};
}

/* ---- key-term gap fills (built from "What is X?" definitions) ---- */
const TERMS = (()=>{
  const res=[/^What (?:is|are) (?:an? |the )?(.+?)\?$/i, /^Key term: what is meant by '(.+?)'\?$/i], out=[], seen=new Set();
  DATA.forEach(d=>{
    if(d.id>=5000) return;
    let term=null; for(const r of res){ const m=d.q.match(r); if(m){ term=m[1]; break; } }
    if(!term) return;
    term=term.replace(/^['"]|['"]$/g,"").trim();
    if(term.split(/\s+/).length>4 || /\d|^(one|two|three|four|five|the difference|formula|capacity|duration|encoding of|role|aim|purpose|meant|main|key|strength|weakness)\b/i.test(term)) return;
    if(/\b(name|named|names|for|used|responsible|explanation|in|of|studies|study)\b/i.test(term)) return;
    if(/^(very|mainly|unlimited|limited|about|around|up to|\d)/i.test(d.a) || d.a.length<20) return;
    const k=term.toLowerCase(); if(seen.has(k)) return; seen.add(k);
    const main=term.replace(/\s*\(.*?\)\s*/g," ").trim(), paren=(term.match(/\((.*?)\)/)||[])[1];
    const alts=[main, term, paren, main.replace(/^\S+'s\s+/,"")].filter(Boolean);
    let def=d.a; alts.forEach(a=>{ if(a.length>3) def=def.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"_____"); });
    out.push({id:d.id, t:d.t, term:main, alts, def, q:"Key term: "+main, a:d.a});
  });
  return out;
})();
const TERM_BY_ID = Object.fromEntries(TERMS.map(x=>[x.id,x]));
const normT = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"").replace(/s$/,"");
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function termMatch(input, item){ const x=normT(input); if(!x) return false; return item.alts.some(a=>{ const y=normT(a), tol=y.length<5?0:y.length<10?1:2; return lev(x,y)<=tol; }); }

const gm = {kind:null, items:[], i:0, step:0, score:0, max:0, picked:[], wrongs:0, xp:0, log:[], locked:false};

function gmTop(){ const m=MODES[gm.kind]; return `<div class="arc-top"><span class="big">${m.icon} ${m.name}</span><span class="spacer"></span><span>Points</span><span class="big">${gm.score}</span><span class="big">${gm.i+1}/${gm.items.length}</span></div><div class="progressline"><i style="width:${gm.i/gm.items.length*100}%"></i></div>`; }

      <div class="q has-sc">${gm.step===0?"What is the main flaw in this study?":`Flaw: <i>${esc(f[1])}</i>. What is the best fix?`}</div>

function gmPick(i){
  if(gm.locked) return; gm.locked=true;
  const it=gm.items[gm.i], f=it.f, opts=gm.step===0?it.o1:it.o2, right=gm.step===0?f[1]:f[3], ok=opts[i]===right, btns=[...document.querySelectorAll(".opt")];

  setTimeout(()=>{ gm.locked=false; if(gm.step===0){ gm.step=1; } else { gm.step=0; gm.i++; } gmRender(); }, gm.step===1 ? (ok?1600:2600) : (ok?500:1300));

function gmOrder(s, btn){
  if(gm.locked) return;

}

/* ================= PSYCHLE (daily key term) ================= */
const PSY_WORDS = (()=>{ const seen=new Set(); return TERMS.filter(x=>/^[a-z]{5,8}$/i.test(x.term) && !seen.has(x.term.toLowerCase()) && seen.add(x.term.toLowerCase())); })();
const psyNo = () => dayNum(today())-dayNum("2026-11-01")+1;
const PSY_ORDER = shuffleR(PSY_WORDS, rngFrom("psychle-order-v1"));
function psyToday(){ const n=psyNo(); return PSY_ORDER[((n%PSY_ORDER.length)+PSY_ORDER.length)%PSY_ORDER.length]; }
function psyState(){ G.psychle=G.psychle||{}; return G.psychle[today()] = G.psychle[today()] || {g:[], done:false, won:false}; }
function psyMarks(guess, ans){
  const g=guess.split(""), a=ans.split(""), res=g.map(()=>"b"), left={};
  a.forEach((ch,i)=>{ if(g[i]===ch) res[i]="g"; else left[ch]=(left[ch]||0)+1; });
  g.forEach((ch,i)=>{ if(res[i]!=="g" && left[ch]){ res[i]="y"; left[ch]--; } });
  return res;
}
let psyCur="";
function psyStart(){ clearInterval(arc.timer); arc.phase="psychle"; arc.mode="psychle"; psyCur=""; psyRender(); arcToTop(); }
function psyRender(){
  const w=psyToday(), ans=w.term.toLowerCase(), L=ans.length, st=psyState(), t=TMAP[w.t];
  const rows=[]; for(let r=0;r<6;r++){ const g=st.g[r]; const m=g?psyMarks(g,ans):null; const cur=!g && r===st.g.length && !st.done;
    rows.push(`<div class="psy-row">${Array.from({length:L},(_,i)=>{ const ch=g?g[i]:cur?(psyCur[i]||""):""; return `<span class="psy-tile ${m?m[i]:""} ${cur&&psyCur[i]?"typed":""}">${esc(ch.toUpperCase())}</span>`; }).join("")}</div>`); }
  const used={}; st.g.forEach(g=>psyMarks(g,ans).forEach((m,i)=>{ const c=g[i], rank={g:3,y:2,b:1}; if(!used[c]||rank[m]>rank[used[c]]) used[c]=m; }));
  const kb=["qwertyuiop","asdfghjkl","zxcvbnm"].map((row,ri)=>`<div class="psy-kr">${ri===2?'<button class="psy-k wide" data-pk="enter">Enter</button>':""}${row.split("").map(c=>`<button class="psy-k ${used[c]||""}" data-pk="${c}">${c.toUpperCase()}</button>`).join("")}${ri===2?'<button class="psy-k wide" data-pk="back" aria-label="Delete">⌫</button>':""}</div>`).join("");
  $("#arcArea").innerHTML=`<div class="arc-top"><span class="big">🔤 Psychle #${psyNo()}</span><span class="spacer"></span><button class="btn ghost" id="arcMenu" style="padding:7px 14px">Back</button></div>
    <p class="muted" style="margin:0 0 6px">Guess today's ${L}-letter key term in 6 tries. 🟩 right letter, right place · 🟨 in the word, wrong place.</p>
    <p class="psy-clue"><span class="tag" style="color:${t.c}">${esc(t.name)}</span>${st.g.length>=3||st.done?` · <b>Clue:</b> ${esc(w.def)}`:` · <span class="muted">Definition clue after 3 guesses</span>`}</p>
    <div class="psy-board">${rows.join("")}</div>
    <div id="psyMsg" class="gapfb" aria-live="polite" style="text-align:center">${st.done?(st.won?`<b style="color:var(--good)">🎉 Got it in ${st.g.length}! It was ${esc(w.term)}.</b>`:`<b style="color:var(--warn)">It was ${esc(w.term)}. New word tomorrow!</b>`):""}</div>
    ${st.done?`<div class="share">${esc(psyShare())}</div><div class="card-actions" style="justify-content:center"><button class="btn ghost" id="psyCopy">Copy result</button></div><p class="muted" style="text-align:center">Next Psychle in ${untilMidnight()}.</p>`:`<div class="psy-kb">${kb}</div>`}`;
  $("#arcMenu").onclick=()=>{ arc.phase="menu"; renderArcade(); };
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>psyKey(b.dataset.pk));
  const c=$("#psyCopy"); if(c) c.onclick=()=>{ navigator.clipboard && navigator.clipboard.writeText(psyShare()).then(()=>{ c.textContent="Copied ✓"; }).catch(()=>{}); };
}
function psyShare(){ const ans=psyToday().term.toLowerCase(), st=psyState(); return `Psychle #${psyNo()} ${st.won?st.g.length:"X"}/6\n`+st.g.map(g=>psyMarks(g,ans).map(m=>m==="g"?"🟩":m==="y"?"🟨":"⬛").join("")).join("\n"); }
function psyKey(k){
  const st=psyState(); if(st.done) return; const ans=psyToday().term.toLowerCase(), L=ans.length;
  if(k==="back"){ psyCur=psyCur.slice(0,-1); psyRender(); return; }
  if(k==="enter"){
    if(psyCur.length<L){ const m=$("#psyMsg"); m.innerHTML=`<span style="color:var(--warn)">Not enough letters</span>`; return; }
    st.g.push(psyCur); const won=psyCur===ans; psyCur="";
    if(won||st.g.length>=6){ st.done=true; st.won=won; const xp=won?(10+(7-st.g.length)*8)*2:10; addXP(xp,false); sfx(won?"lvl":"no"); if(won) confetti(160);
      G.st.psyWins=(G.st.psyWins||0)+(won?1:0); G.hist[today()]=(G.hist[today()]||0)+1; checkBadges(); }
    else sfx("tick");
    save(); psyRender(); return;
  }
  if(/^[a-z]$/.test(k) && psyCur.length<L){ psyCur+=k; psyRender(); }
}
document.addEventListener("keydown",e=>{ if(arc.phase!=="psychle" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase(); if(k==="enter"){ e.preventDefault(); psyKey("enter"); } else if(k==="backspace"){ e.preventDefault(); psyKey("back"); } else if(/^[a-z]$/.test(k)){ e.preventDefault(); psyKey(k); } });

function cleanName(raw){
  // returns a tidy name, or null if it's empty, uses odd characters or contains a rude word
  const n=String(raw||"").replace(/\s+/g," ").trim().slice(0,20);
  if(n.length<2 || !/^[A-Za-zÀ-ÿ' .-]+$/.test(n)) return null;
  const leet=s=>s.toLowerCase().replace(/[0@]/g,m=>m==="0"?"o":"a").replace(/1|!|\|/g,"i").replace(/3/g,"e").replace(/4/g,"a").replace(/5|\$/g,"s").replace(/7/g,"t");
  const squash=s=>s.replace(/(.)\1+/g,"$1");
  const flat=squash(leet(n).replace(/[^a-z]/g,""));
  if(NAME_BLOCK[0].some(w=>flat.includes(squash(w)))) return null;
  const words=leet(n).split(/[^a-z]+/).filter(Boolean).map(squash);
  if(words.some(w=>NAME_BLOCK[1].some(b=>squash(b)===w)) || NAME_BLOCK[1].some(b=>squash(b)===flat)) return null;
  return n;
}

const FOCUS_MIN=25, FOCUS_NEED=15;   // answer at least 15 questions during the session to earn the bonus

    b.innerHTML=`🎯 <span>${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}</span>`; b.classList.add("on"); b.setAttribute("aria-label",`Focus session: ${Math.floor(s/60)} minutes left. Click to stop.`);

function focusTick(){

}
function focusStart(){

function focusEnd(finished){
  const done=G.st.cards-(G.focus.start||0); G.focus=null; clearInterval(focusTimer); focusBtnRender();

}

const b64e = bytes => { let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function makeSave(){
  const json=JSON.stringify({v:1, p:store.p, sel:store.sel, all:store.all, g:store.g});
  if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); return "FOUNT-Z:"+b64e(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "FOUNT-J:"+b64e(new TextEncoder().encode(json));
}
async function readSave(code){
  code=code.trim().replace(/\s+/g,""); let json;
  if(code.startsWith("FOUNT-Z:")){ const st=new Blob([b64d(code.slice(8))]).stream().pipeThrough(new DecompressionStream("gzip")); json=await new Response(st).text(); }
  else if(code.startsWith("FOUNT-J:")) json=new TextDecoder().decode(b64d(code.slice(8)));
  else throw new Error("not a save code");
  const s=JSON.parse(json); if(!s || typeof s.p!=="object" || typeof s.g!=="object") throw new Error("bad save"); return s;
}
async function loadSave(code){
  const msg=$("#saveMsg");
  try{
    const s=await readSave(code), lv=lvlFor(s.g.xp||0), kn=Object.values(s.p).filter(v=>v==="k").length;
    if(!confirm(`Load this save? Level ${lv}, ${(s.g.xp||0).toLocaleString()} XP, ${kn} cards known.\n\nThis replaces the progress on this device (currently level ${lvlFor(G.xp)}).`)) return;
    localStorage.setItem(KEY, JSON.stringify({p:s.p, sel:s.sel||store.sel, all:s.all||store.all, g:s.g}));
    location.reload();
  }catch(e){ msg.innerHTML='<span style="color:var(--warn)">That doesn\'t look like a valid save code. Make sure you copied all of it.</span>'; }
}
function wireSave(){
  const msg=$("#saveMsg");
  $("#saveCopy").onclick=async()=>{ flag("backup"); const c=await makeSave(); try{ await navigator.clipboard.writeText(c); msg.textContent=`Save code copied (${c.length.toLocaleString()} characters). Paste it somewhere safe, like an email to yourself or your notes app.`; }catch(e){ $("#saveIn").value=c; $("#saveIn").select(); msg.textContent="Couldn't copy automatically. Your code is in the box: select it all and copy it."; } };
  $("#saveFile").onclick=async()=>{ flag("backup"); const c=await makeSave(), a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([c],{type:"text/plain"})); a.download=`fount-save-level-${lvlFor(G.xp)}-${today()}.txt`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); msg.textContent="Backup file downloaded."; };
  $("#saveLoad").onclick=()=>{ const v=$("#saveIn").value; if(v.trim()) loadSave(v); };
  $("#saveUp").onchange=e=>{ const f=e.target.files[0]; if(f) f.text().then(loadSave); };
}

function weakData(){
  return TOPICS.map(t=>{ const it=DATA.filter(d=>d.t===t.key), n=it.length||1;
    const k=it.filter(d=>status(d.id)==="k").length, l=it.filter(d=>status(d.id)==="l").length;
    const acc=(G.tacc||{})[t.key]||[0,0], mist=it.filter(d=>G.mistakes[d.id]!==undefined).length;
    const ex=EXT.filter(x=>x.t===t.key), exDone=ex.filter(x=>G.ext.done[x.id]).length;
    const mockT=((G.mocks||{}).topic||{})[t.key], boss=G.bosses[t.key]||{};
    const parts=[k/n*100]; if(acc[1]>=10) parts.push(acc[0]/acc[1]*100); if(mockT&&mockT[1]) parts.push(mockT[0]/mockT[1]*100);
    const seen=k+l>0 || acc[1]>0;
    return {t, n, k, l, acc, mist, ex:ex.length, exDone, mockT, boss, seen, strength:Math.round(parts.reduce((a,b)=>a+b,0)/parts.length)};
  });
}

function topicStats(){

/* ================= PROGRESS REPORT CODES ================= */
// Format "FR1." + base64url(bytes). Bytes: version, name, then varints/bytes in a fixed order, then a 16-bit checksum.
function varint(arr, n){ n=Math.max(0,Math.floor(n||0)); while(n>=128){ arr.push((n%128)|128); n=Math.floor(n/128); } arr.push(n); }
function readVar(b, p){ let n=0, m=1, x; do{ x=b[p.i++]; if(x===undefined) throw new Error("short"); n+=(x&127)*m; m*=128; }while(x&128); return n; }
const ck16 = bytes => { let h=0x811c9dc5; for(const x of bytes){ h^=x; h=Math.imul(h,16777619)>>>0; } return (h ^ (h>>>16)) & 0xffff; };
const b64u = bytes => b64e(bytes).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => b64d(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
const popcount = n => { let c=0; while(n){ c+=n&1; n=Math.floor(n/2); } return c; };
function makeReport(){
  const bytes=[1];
  const nm=[...new TextEncoder().encode((G.name||"").trim().slice(0,24))].slice(0,40); bytes.push(nm.length, ...nm);
  varint(bytes, dayNum(today())-dayNum("2026-01-01"));
  varint(bytes, G.xp); varint(bytes, knownTotal());
  const ts=topicStats(); ts.forEach(s=>bytes.push(s.k)); ts.forEach(s=>bytes.push(s.l));
  bytes.push(G.st.cards ? Math.round(G.st.right/G.st.cards*100) : 0);
  varint(bytes, liveStreak()); varint(bytes, G.best);
  let bm=0; TOPICS.forEach((t,i)=>{ if(G.bosses[t.key] && G.bosses[t.key].won) bm+=Math.pow(2,i); }); varint(bytes, bm);
  varint(bytes, G.st.cards);
  let act=0; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(G.hist[ymd(d)]) act+=Math.pow(2,i); } varint(bytes, act);
  const c=ck16(bytes); bytes.push(c>>8, c&255);
  return "FR1."+b64u(new Uint8Array(bytes));
}
function parseReport(code){
  const b=unb64u(code.slice(4)); if(b.length<12) throw new Error("short");
  const body=b.slice(0,-2), c=(b[b.length-2]<<8)|b[b.length-1]; if(ck16(body)!==c) throw new Error("checksum");
  const p={i:0}; if(body[p.i++]!==1) throw new Error("version");
  const nl=body[p.i++]; const name=new TextDecoder().decode(body.slice(p.i,p.i+nl)).trim(); p.i+=nl;
  const day=readVar(body,p), xp=readVar(body,p), known=readVar(body,p);
  const k=[], l=[]; for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); k.push(v); }
  for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); l.push(v); }
  const acc=body[p.i++], streak=readVar(body,p), best=readVar(body,p), bm=readVar(body,p), qs=readVar(body,p), act=readVar(body,p);
  if(p.i!==body.length) throw new Error("length");
  const d=new Date(2026,0,1); d.setDate(d.getDate()+day);
  let last=-1; for(let i=0;i<14;i++) if(Math.floor(act/Math.pow(2,i))%2){ last=i; break; }
  return {name:name||"(no name)", date:ymd(d), xp, level:lvlFor(xp), known, k, l, acc, streak, best, bosses:popcount(bm), qs, act14:popcount(act), act7:popcount(act%128), lastDaysAgo:last};
}

    <div class="proj-card">${d.sc?`<div class="proj-sc">${esc(d.sc)}</div>`:""}<div class="proj-q">${esc(d.q)}</div>
      ${P.opts?`<ol class="proj-opts">${P.opts.opts.map((o,i)=>`<li data-o="${i}">${esc(o)}</li>`).join("")}</ol>`:""}
      <div class="proj-a" id="pAns" hidden><div class="tag">Answer</div><div class="a">${P.opts?esc(P.opts.opts[P.opts.correct]):fmtAnswer(d.a,d.id)}</div>${whyHTML(d)}</div></div>
    <div class="proj-actions"><button class="btn proj-go" id="pReveal">Reveal answer <kbd>Space</kbd></button></div>
    ${projScore()}</div>`;
  wireProj();
  if(P.secs){ P.end=Date.now()+P.secs*1000; P.timer=setInterval(projTick,100); projTick(); }
}
function projTick(){
  const left=P.end-Date.now(), f=$("#ptbFill"), tm=$("#pTime"); if(!f){ clearInterval(P.timer); return; }
  f.style.width=Math.max(0,left/(P.secs*1000)*100)+"%"; $("#ptb").classList.toggle("low", left<5000);
  tm.textContent=Math.max(0,Math.ceil(left/1000))+"s";
  if(left<=0){ clearInterval(P.timer); tm.textContent="Time!"; sfx("no"); }
}
function wireProj(){
  $("#pFull").onclick=projFull;
  $("#pEnd").onclick=projEnd;
  const r=$("#pReveal"); if(r) r.onclick=projReveal;
  document.querySelectorAll("[data-award]").forEach(b=>b.onclick=()=>projAward(+b.dataset.award));
  const n=$("#pNext"); if(n) n.onclick=projNext;
  const nb=$("#pNobody"); if(nb) nb.onclick=projNext;
}
function projReveal(){
  if(P.revealed) return; P.revealed=true; clearInterval(P.timer);
  $("#pAns").hidden=false; sfx("badge");
  if(P.opts){ document.querySelectorAll(".proj-opts li").forEach(li=>li.classList.add(+li.dataset.o===P.opts.correct?"right":"dim")); }
  document.querySelector(".proj-actions").innerHTML=`<button class="btn ghost" id="pNobody">Nobody got it</button><button class="btn proj-go" id="pNext">${P.i+1>=P.items.length?"See the winners":"Next question"} <kbd>Space</kbd></button>`;
  document.querySelector(".proj-scores").outerHTML=projScore();
  wireProj();
}
function projTrack(){
  const sq=n=>RACE_SQ[n]>0?"🪜":RACE_SQ[n]<0?"🐍":n===RACE_LEN?"🏁":"";
  return `<div class="proj-scores race">${P.teams.map((t,i)=>`<div class="race-lane"><button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b></button>
    <div class="race-track">${Array.from({length:RACE_LEN+1},(_,n)=>`<span class="race-sq ${n===RACE_LEN?"fin":""} ${RACE_SQ[n]>0?"up":RACE_SQ[n]<0?"down":""}">${P.pos[i]===n?`<i class="race-tok" style="--h:${i*57}">${i+1}</i>`:sq(n)}</span>`).join("")}</div></div>`).join("")}</div>`;
}
function projAward(i){
  if(!P.revealed || i>=P.teams.length) return;
  if(P.mode==="race"){
    if(P.awarded.has(i)){ P.awarded.delete(i); P.pos[i]=P.prev[i]; }
    else { P.awarded.add(i); P.prev[i]=P.pos[i]; let n=Math.min(RACE_LEN,P.pos[i]+1); const fx=RACE_SQ[n]||0; n=Math.max(0,Math.min(RACE_LEN,n+fx)); P.pos[i]=n; sfx(fx<0?"no":"ok"); confetti(fx>0?60:30); }
    P.scores=P.pos.slice(); document.querySelector(".proj-scores").outerHTML=projScore(); wireProj(); return;
  }
  if(P.awarded.has(i)){ P.awarded.delete(i); P.scores[i]--; } else { P.awarded.add(i); P.scores[i]++; sfx("ok"); confetti(40); }
  document.querySelector(".proj-scores").outerHTML=projScore(); wireProj();
}
function projNext(){ P.i++; if(P.i>=P.items.length || (P.mode==="race" && P.pos.some(x=>x>=RACE_LEN))) projEnd(); else projQ(); }
function projEnd(){
  clearInterval(P.timer);
  const order=P.teams.map((t,i)=>({t,s:P.scores[i]})).sort((a,b)=>b.s-a.s);
  const top=order[0]?order[0].s:0, winners=order.filter(o=>o.s===top);
  const pod=[order[1],order[0],order[2]];
  $("#teacherApp").innerHTML=`<div class="proj"><div class="proj-bar"><b>📽️ Final scores</b><span class="spacer"></span><button class="btn ghost" id="pFull">⛶</button></div>
    <h2 class="proj-win">${winners.length>1?"It's a draw! 🤝":"🏆 "+esc(winners[0].t)+" wins!"}</h2>
    <div class="podium">${pod.map((o,j)=>o?`<div class="pod p${[2,1,3][j]}"><b>${esc(o.t)}</b><span>${P.mode==="race"?(o.s>=RACE_LEN?"🏁 Finished":"Square "+o.s):`${o.s} pt${o.s===1?"":"s"}`}</span><div class="block">${[2,1,3][j]}</div></div>`:"<div></div>").join("")}</div>
    ${order.length>3?`<p class="muted" style="text-align:center">${order.slice(3).map((o,j)=>`${j+4}. ${esc(o.t)} (${o.s})`).join(" · ")}</p>`:""}
    <div class="proj-actions"><button class="btn proj-go" id="pAgain">Play again</button><button class="btn ghost" id="pSetup">Change settings</button><button class="btn ghost" id="pExit">Back to teacher tools</button></div></div>`;
  sfx("lvl"); confetti(260);
  $("#pFull").onclick=projFull;
  $("#pAgain").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); P.pos=P.teams.map(()=>0); projQ(); };
  $("#pSetup").onclick=projSetup;
  $("#pExit").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
}
document.addEventListener("keydown",e=>{
  if(!TEACHER || !document.querySelector(".proj.play") || e.target.matches("input,textarea")) return;
  if(e.key===" "){ e.preventDefault(); P.revealed ? projNext() : projReveal(); }
  else if(/^[1-6]$/.test(e.key)){ e.preventDefault(); projAward(+e.key-1); }
});
