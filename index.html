":1145},{"q":"Give a strength of McGarrigle and Donaldson's study.","a":"It used a repeated measures design, controlling participant variables","t":"Development","id":1146},{"q":"Give a weakness of McGarrigle and Donaldson's study.","a":"Children may have been distracted by naughty teddy: Moore and Frye (1986) found that when teddy really added or took away a counter, children still said the rows were the same","t":"Development","id":1147},{"q":"Write a directional hypothesis for McGarrigle and Donaldson's study.","a":"More children will conserve when naughty teddy moves the counters than when the adult moves them","t":"Development","id":1148},{"q":"Give an ethical issue with McGarrigle and Donaldson's study.","a":"Young children can't give informed consent themselves, so parental consent is needed","t":"Development","id":1149},{"q":"Why is Piaget's theory said to lack generalisability?","a":"It was based on a small number of Swiss children, including his own","t":"Development","id":1150},{"q":"Give a strength of Piaget's theory in terms of testability.","a":"His ideas can be tested experimentally, e.g. conservation and egocentrism tasks","t":"Development","id":1151},{"q":"Why might Piaget's stages be too rigid?","a":"Children may show abilities from different stages at the same time, and some develop earlier than he said","t":"Development","id":1152},{"q":"Give a weakness of applying Piaget to education.","a":"Discovery learning may not suit subjects that need direct teaching, such as reading and maths (Bennett, 1976)","t":"Development","id":1153},{"q":"Give a strength of applying Piaget to education.","a":"It encourages active, independent learning and matching tasks to pupils' readiness","t":"Development","id":1154},{"q":"Give a strength of Dweck's mindset theory.","a":"It can be easily applied in schools to improve motivation and grades","t":"Development","id":1155},{"q":"Give a weakness of Dweck's mindset theory.","a":"Mindsets are measured by questionnaires, which may be affected by social desirability bias","t":"Development","id":1156},{"q":"Why might mindset theory not apply the same in all cultures?","a":"Collectivist cultures may already value effort over ability, so the effect may differ","t":"Development","id":1157},{"q":"Give a weakness of Dweck's study of 48 students.","a":"Small sample of underachieving 12–13-year-olds, so it may not generalise","t":"Development","id":1158},{"q":"What was the IV in Dweck's study?","a":"Whether students had the growth mindset session or the memory session","t":"Development","id":1159},{"q":"What was the DV in Dweck's study?","a":"Students' motivation and grades","t":"Development","id":1160},{"q":"How can schools use self-efficacy research?","a":"Give pupils achievable tasks to build success, and use encouraging feedback","t":"Development","id":1161},{"q":"Give a weakness of the self-efficacy idea.","a":"It is hard to measure objectively and relies on self-report","t":"Development","id":1162},{"q":"Give a strength of Willingham's ideas.","a":"They are backed by scientific evidence and can be applied to improve learning","t":"Development","id":1163},{"q":"Give a weakness of Willingham's ideas.","a":"They may undervalue creativity and modern teaching methods","t":"Development","id":1164},{"q":"Why might learning styles questionnaires be unreliable?","a":"People's answers may change depending on the task or their mood","t":"Development","id":1165},{"q":"Give a weakness of teaching to learning styles.","a":"There is little evidence that it improves results, and there may be 71 styles, which is impractical","t":"Development","id":1166},{"q":"How does early brain development link to nature?","a":"The order in which brain structures develop is genetically programmed","t":"Development","id":1167},{"q":"How does early brain development link to nurture?","a":"The environment in the womb (e.g. smoking, infections) affects the developing brain","t":"Development","id":1168},{"q":"Why is Edwards' syndrome evidence for nature?","a":"It is caused by an extra chromosome, which disrupts development regardless of environment","t":"Development","id":1169},{"q":"Give a weakness of DeCasper and Spence's study.","a":"Babies' sucking could be affected by other factors like hunger, and the sample was small","t":"Development","id":1170},{"q":"What does DeCasper and Spence's study suggest about the womb?","a":"Babies can learn and remember sounds before they are born","t":"Development","id":1171},{"q":"Why are twin studies useful in the nature–nurture debate?","a":"Identical twins share all their genes, so differences between them must be due to environment","t":"Development","id":1172},{"q":"Why do most psychologists say nature and nurture interact?","a":"Genes provide the blueprint, but the environment affects how the brain develops from conception","t":"Development","id":1173},{"q":"Explain how Piaget's theory can be applied to the sensorimotor stage.","a":"Babies should play with noisy, moving toys to develop motor skills and object permanence","t":"Development","id":1174},{"q":"Explain how Piaget's theory can be applied to the pre-operational stage.","a":"Children should do role play to reduce egocentrism, and practical activities like cooking to learn conservation","t":"Development","id":1175},{"q":"Explain how Piaget's theory can be applied to the formal operational stage.","a":"Students can be given abstract, hypothetical problems and debates","t":"Development","id":1176},{"q":"A child points at a cat and says 'doggy' until they understand the difference. How would Piaget explain this?","a":"The child hasn't yet developed the correct schema, so their language reflects their current thinking","t":"Language, thought & communication","id":1177},{"q":"A child who has never seen snow can't understand the word 'slush'. Which theory does this support?","a":"Piaget's – you need the concept (thought) before you can understand the word","t":"Language, thought & communication","id":1178},{"q":"A Russian speaker, who has separate words for light and dark blue, spots differences between blues faster. Which theory does this support?","a":"The Sapir-Whorf hypothesis (weak version)","t":"Language, thought & communication","id":1179},{"q":"A tribe has no word for 'left' but still navigates perfectly using compass directions. Which version of Sapir-Whorf does this challenge?","a":"The strong version – they can still think about direction without the words","t":"Language, thought & communication","id":1180},{"q":"Give a strength of Piaget's theory of language.","a":"It is supported by research such as Cromer and Heider and Oliver, showing thought can exist without language","t":"Language, thought & communication","id":1181},{"q":"Give a weakness of Piaget's theory of language.","a":"It is hard to test because schemas can't be directly measured","t":"Language, thought & communication","id":1182},{"q":"Give a strength of the Sapir-Whorf hypothesis.","a":"Research on the Zuni and Berinmo supports the idea that language influences memory and perception of colour","t":"Language, thought & communication","id":1183},{"q":"Give a weakness of the Sapir-Whorf hypothesis.","a":"The strong version is not supported – people can think about things they have no words for (e.g. the Dani)","t":"Language, thought & communication","id":1184},{"q":"Why is the weak version of Sapir-Whorf more widely accepted?","a":"Research shows language makes some thinking easier, but doesn't completely limit it","t":"Language, thought & communication","id":1185},{"q":"What is the difference between the views of Piaget and Sapir-Whorf?","a":"Piaget says thought comes before language; Sapir-Whorf say language comes before (and shapes) thought","t":"Language, thought & communication","id":1186},{"q":"How could research on language and thought be applied?","a":"Teaching new vocabulary could help students think about new concepts; understanding other cultures","t":"Language, thought & communication","id":1187},{"q":"Why might cross-cultural research on language be difficult?","a":"Translation problems and researchers may misunderstand the culture (ethnocentrism)","t":"Language, thought & communication","id":1188},{"q":"How does the Inuit 'words for snow' example support Piaget?","a":"They experience lots of snow, so their thinking about snow develops first and words follow","t":"Language, thought & communication","id":1189},{"q":"A bird sings loudly at the edge of its area. Which function of animal communication is this?","a":"Territory","t":"Language, thought & communication","id":1190},{"q":"A monkey gives a special call when an eagle is overhead. Which function is this?","a":"Survival","t":"Language, thought & communication","id":1191},{"q":"A peacock displays its tail feathers. Which function is this?","a":"Reproduction","t":"Language, thought & communication","id":1192},{"q":"Ants follow a scent trail left by other ants. Which function is this?","a":"Food","t":"Language, thought & communication","id":1193},{"q":"A cat rubs its face on furniture to leave its scent. Which function is this?","a":"Territory (scent marking)","t":"Language, thought & communication","id":1194},{"q":"Why is human communication described as 'open'?","a":"We can create an unlimited number of new messages and ideas","t":"Language, thought & communication","id":1195},{"q":"Give an example of creativity in human language.","a":"Inventing new slang words or writing a poem","t":"Language, thought & communication","id":1196},{"q":"Give an example of multi-channel human communication.","a":"Using words, tone of voice and facial expressions at the same time","t":"Language, thought & communication","id":1197},{"q":"Explain one difference between animal and human communication.","a":"Humans can use displacement (talk about the past, future or things not present); animals communicate about the here and now","t":"Language, thought & communication","id":1198},{"q":"Write a directional hypothesis for von Frisch's study.","a":"Bees will perform the waggle dance more when food is placed far from the hive than when it is close","t":"Language, thought & communication","id":1199},{"q":"What was the IV in von Frisch's studies?","a":"The distance of the food source from the hive","t":"Language, thought & communication","id":1200},{"q":"What was the DV in von Frisch's studies?","a":"The type of dance performed by the bees","t":"Language, thought & communication","id":1201},{"q":"Give a strength of von Frisch's research method.","a":"The bees were observed in their natural environment, so behaviour was natural","t":"Language, thought & communication","id":1202},{"q":"Give a weakness of von Frisch's research.","a":"Bees are very different from humans, so findings may not apply to human communication","t":"Language, thought & communication","id":1203},{"q":"Give an ethical consideration of von Frisch's research.","a":"Bees may have been handled or marked, though animal research has fewer ethical guidelines than human research","t":"Language, thought & communication","id":1204},{"q":"Why is von Frisch's research reliable?","a":"He made over 1,000 observations over about 20 years with consistent results, and other researchers have replicated his findings","t":"Language, thought & communication","id":1205},{"q":"Alex looks away as he finishes speaking, then back at Jamie. Which function of eye contact is this?","a":"Regulating the flow of conversation","t":"Language, thought & communication","id":1206},{"q":"Two people across a room keep catching each other's gaze and smiling. Which function of eye contact is this?","a":"Signalling attraction","t":"Language, thought & communication","id":1207},{"q":"Maya stares at the floor with tearful eyes after bad news. Which function of eye contact is this?","a":"Expressing emotion","t":"Language, thought & communication","id":1208},{"q":"Give a strength of research into eye contact.","a":"It has practical applications, e.g. in interviews, teaching and therapy","t":"Language, thought & communication","id":1209},{"q":"Give a weakness of research into eye contact.","a":"Much of it is in labs or with photos, which may not reflect real conversations","t":"Language, thought & communication","id":1210},{"q":"Why might eye contact norms differ between cultures?","a":"In some cultures direct eye contact with elders or superiors is seen as rude","t":"Language, thought & communication","id":1211},{"q":"Two friends sit in the same position with legs crossed the same way. What is this?","a":"Postural echo","t":"Language, thought & communication","id":1212},{"q":"In an interview, Sam folds his arms and crosses his legs. What might the interviewer think?","a":"That he is closed-off, defensive or uncomfortable (closed posture)","t":"Language, thought & communication","id":1213},{"q":"A salesperson copies a customer's posture. Why might this help?","a":"Postural echo builds rapport and makes the customer feel liked","t":"Language, thought & communication","id":1214},{"q":"Give a strength of touch research.","a":"Field studies like Fisher et al. have high ecological validity as behaviour is natural","t":"Language, thought & communication","id":1215},{"q":"Give a weakness of Fisher et al.'s touch study.","a":"Only female students were studied, so it may not apply to men","t":"Language, thought & communication","id":1216},{"q":"Why might touch be interpreted differently in different cultures?","a":"Contact cultures touch more often, so non-contact cultures may see touch as intrusive","t":"Language, thought & communication","id":1217},{"q":"Luca, who is Italian, stands closer than his British classmates like. How might this be explained?","a":"He comes from a contact culture with smaller personal space preferences","t":"Language, thought & communication","id":1218},{"q":"A new employee keeps more distance from the headteacher than from other teachers. Which factor affects personal space here?","a":"Status","t":"Language, thought & communication","id":1219},{"q":"Two women sit side by side to chat while two men sit opposite each other. Which factor affects personal space here?","a":"Gender","t":"Language, thought & communication","id":1220},{"q":"Give a weakness of personal space research.","a":"Many studies look at one factor at a time (culture, gender or status) when in reality they interact","t":"Language, thought & communication","id":1221},{"q":"Explain how personal space research can be applied.","a":"Designing offices, classrooms or public transport to avoid discomfort, or helping people from different cultures interact","t":"Language, thought & communication","id":1222},{"q":"Give a strength of Darwin's evolutionary theory of non-verbal communication.","a":"It is supported by research showing facial expressions are similar across cultures and in blind children","t":"Language, thought & communication","id":1223},{"q":"Give a weakness of Darwin's evolutionary theory.","a":"It can't explain cultural differences in non-verbal communication, e.g. gestures","t":"Language, thought & communication","id":1224},{"q":"Why is Darwin's theory hard to test?","a":"We can't go back in time to see how behaviours evolved","t":"Language, thought & communication","id":1225},{"q":"Why does Thompson's study of blind children support the innate view?","a":"Blind children couldn't have learned expressions by watching others, yet they made the same ones","t":"Language, thought & communication","id":1226},{"q":"Give a weakness of Thompson's study.","a":"A small sample of blind children; some may not have been blind from birth or could learn through touch/sound","t":"Language, thought & communication","id":1227},{"q":"How do social releasers support the innate explanation of non-verbal communication?","a":"Babies smile and make eye contact from birth without learning it","t":"Language, thought & communication","id":1228},{"q":"Why does the 'OK' gesture meaning different things support the learned explanation?","a":"If non-verbal communication were innate, gestures would mean the same everywhere","t":"Language, thought & communication","id":1229},{"q":"Is non-verbal communication innate or learned?","a":"Probably both – some expressions seem innate, but culture shapes how and when they are used","t":"Language, thought & communication","id":1230},{"q":"What was the IV in Yuki's study?","a":"Culture (American or Japanese) and the combination of eyes and mouth in the emoticon","t":"Language, thought & communication","id":1231},{"q":"What was the DV in Yuki's study?","a":"Ratings of how happy or sad the emoticon/face looked","t":"Language, thought & communication","id":1232},{"q":"Write a directional hypothesis for Yuki's study.","a":"Japanese participants will focus more on the eyes, and American participants more on the mouth, when judging emotion","t":"Language, thought & communication","id":1233},{"q":"Give a strength of Yuki's study.","a":"It was a lab experiment with standardised emoticons, so it had high control and can be replicated","t":"Language, thought & communication","id":1234},{"q":"How could Yuki's findings be applied?","a":"Designing emojis or communication for international audiences, or understanding cross-cultural misunderstandings","t":"Language, thought & communication","id":1235},{"q":"Why might Yuki's study lack generalisability?","a":"It only used students from two countries","t":"Language, thought & communication","id":1236},{"q":"Give an example of non-verbal communication in texting.","a":"Emojis and emoticons","t":"Language, thought & communication","id":1237},{"q":"What does Yuki's study suggest about Western emoticons like :-)?","a":"Westerners focus on the mouth, so Western emoticons show emotion through the mouth","t":"Language, thought & communication","id":1238},{"q":"What does Yuki's study suggest about Japanese emoticons like (^_^)?","a":"Japanese people focus on the eyes, so their emoticons show emotion through the eyes","t":"Language, thought & communication","id":1239},{"q":"Kai laughs at a joke he doesn't find funny because everyone else laughs. Is this normative or informational social influence?","a":"Normative – he wants to fit in","t":"Social influence","id":1240},{"q":"On her first day, Ella follows everyone to the canteen because she doesn't know where it is. Is this normative or informational social influence?","a":"Informational – she assumes the others know the right answer","t":"Social influence","id":1241},{"q":"Josh copies his friends' answers on a hard quiz. Which social factor affecting conformity is this?","a":"Task difficulty","t":"Social influence","id":1242},{"q":"Maya votes differently in a secret ballot than she said in class. Which factor affecting conformity is this?","a":"Anonymity","t":"Social influence","id":1243},{"q":"Sam believes he failed because the test was unfair. What locus of control does he have?","a":"External locus of control","t":"Social influence","id":1244},{"q":"A football fan who is a qualified doctor helps an injured player. Which factor affecting bystander behaviour is this?","a":"Expertise","t":"Social influence","id":1245},{"q":"Many people walk past a man lying on a busy street. Which explanation of bystander apathy does this show?","a":"Diffusion of responsibility (presence of others)","t":"Social influence","id":1246},{"q":"People ignore smoke in an office because no-one else seems worried. Which concept is this?","a":"Pluralistic ignorance","t":"Social influence","id":1247},{"q":"A student runs to help another student from their own school team. Which factor affecting bystander behaviour is this?","a":"Similarity to the victim","t":"Social influence","id":1248},{"q":"A man doesn't help a fight victim because he fears getting hurt. Which factor affecting bystander behaviour is this?","a":"Cost of helping","t":"Social influence","id":1249},{"q":"A student puts less effort into a group project than an individual one. What is this?","a":"Social loafing","t":"Social influence","id":1250},{"q":"Football fans in matching shirts start chanting abuse they would never say alone. Which concept explains this?","a":"Deindividuation","t":"Social influence","id":1251},{"q":"A soldier says 'I was only following orders'. Which explanation of obedience is this?","a":"Agency theory (the agentic state)","t":"Social influence","id":1252},{"q":"Obedience drops when the teacher leaves the room and sets work by email. Which factor affecting obedience is this?","a":"Proximity to the authority figure","t":"Social influence","id":1253},{"q":"Priya refuses to join a riot because she believes it is wrong. Which dispositional factor explains this?","a":"Morality","t":"Social influence","id":1254},{"q":"Someone raised by very strict parents obeys all rules without question. Which theory explains this?","a":"Adorno's authoritarian personality","t":"Social influence","id":1255},{"q":"What was the IV in Asch's study?","a":"Whether confederates gave correct or incorrect answers (or the variation, e.g. group size)","t":"Social influence","id":1256},{"q":"What was the DV in Asch's study?","a":"The number of times the participant conformed to the wrong answer","t":"Social influence","id":1257},{"q":"What research method was Asch's study?","a":"A laboratory experiment","t":"Social influence","id":1258},{"q":"What was the IV in Milgram's study (in the variations)?","a":"The situational factor changed, e.g. proximity, location or uniform","t":"Social influence","id":1259},{"q":"What was the DV in Milgram's study?","a":"The maximum voltage the participant gave","t":"Social influence","id":1260},{"q":"What research method was Milgram's study?","a":"A controlled observation (lab-based)","t":"Social influence","id":1261},{"q":"What sampling method did Milgram use?","a":"Volunteer sampling (newspaper adverts)","t":"Social influence","id":1262},{"q":"Give a strength and weakness of Milgram's volunteer sample.","a":"Strength – range of ages and jobs; Weakness – volunteers may be more obedient or curious, so it is biased","t":"Social influence","id":1263},{"q":"How could Milgram justify his use of deception?","a":"Participants were debriefed and most said they were glad to have taken part; the knowledge gained was important","t":"Social influence","id":1264},{"q":"What was the IV in Piliavin's study?","a":"Whether the victim was carrying a cane or appeared drunk","t":"Social influence","id":1265},{"q":"What sampling method was used in Piliavin's study?","a":"Opportunity sampling – passengers on the train at the time","t":"Social influence","id":1266},{"q":"Give a strength of Piliavin's sample.","a":"It was large (around 4,450 passengers) and varied","t":"Social influence","id":1267},{"q":"How could Piliavin's findings be applied?","a":"Encouraging bystanders to help by reducing the costs of helping, or training people in first aid","t":"Social influence","id":1268},{"q":"Why might Latané and Darley's smoke study lack mundane realism?","a":"Sitting in a lab as a room fills with smoke is unusual","t":"Social influence","id":1269},{"q":"How can research into bystander behaviour be applied?","a":"Teaching people about diffusion of responsibility so they are more likely to help","t":"Social influence","id":1270},{"q":"Give a strength of the locus of control explanation of conformity.","a":"Supported by research such as Burger and Cooper (1979)","t":"Social influence","id":1271},{"q":"Give a weakness of locus of control as an explanation.","a":"It may not be consistent – people may be internal in some situations and external in others","t":"Social influence","id":1272},{"q":"Give a weakness of Burger and Cooper's study.","a":"Rating cartoons is a trivial task, so it lacks mundane realism","t":"Social influence","id":1273},{"q":"Give a strength of agency theory.","a":"It helps explain real events such as the Holocaust, where people obeyed destructive orders","t":"Social influence","id":1274},{"q":"Give a weakness of agency theory.","a":"It can't explain why some people disobey, e.g. the 35% who stopped in Milgram's study","t":"Social influence","id":1275},{"q":"Give a strength of Adorno's theory.","a":"It is supported by research linking strict upbringing and high F-scale scores with obedience","t":"Social influence","id":1276},{"q":"Why is Adorno's research correlational?","a":"He measured personality and attitudes but didn't manipulate any variables, so he couldn't show cause","t":"Social influence","id":1277},{"q":"How could research on deindividuation be applied?","a":"Police use CCTV and body cameras to reduce anonymity in crowds","t":"Social influence","id":1278},{"q":"Give a strength of research into deindividuation.","a":"Zimbardo's hood study was a controlled lab experiment showing anonymity increases antisocial behaviour","t":"Social influence","id":1279},{"q":"Give an ethical issue with Zimbardo's deindividuation study.","a":"Participants believed they were giving real electric shocks, which may cause distress","t":"Social influence","id":1280},{"q":"How can social loafing be reduced?","a":"Make individual contributions identifiable, and keep groups small","t":"Social influence","id":1281},{"q":"Give a strength of Latané's (1979) social loafing study.","a":"Controlled lab experiment measuring noise objectively","t":"Social influence","id":1282},{"q":"Give a weakness of Latané's social loafing study.","a":"Only male students, so it can't be generalised to women","t":"Social influence","id":1283},{"q":"Why might culture be a better explanation for crowd behaviour than personality?","a":"Earley found whole cultural groups behaved differently, suggesting social norms matter","t":"Social influence","id":1284},{"q":"Why is it too simplistic to say all collectivist cultures behave the same?","a":"There are individual differences within every culture","t":"Social influence","id":1285},{"q":"Give a strength of the morality explanation of crowd behaviour.","a":"It explains why some people resist antisocial crowds, e.g. Sophie Scholl","t":"Social influence","id":1286},{"q":"Give a weakness of the morality explanation.","a":"Morality is hard to measure objectively","t":"Social influence","id":1287},{"q":"Write a two-tailed hypothesis for Latané's social loafing study.","a":"There will be a difference in the noise produced per person when shouting alone compared with in a group","t":"Social influence","id":1288},{"q":"How can obedience research be applied?","a":"Training people (e.g. nurses, soldiers) to question unethical orders","t":"Social influence","id":1289},{"q":"A researcher tests whether music affects reaction time. What is the IV?","a":"Whether music is played or not","t":"RM","id":1290},{"q":"A researcher tests whether music affects reaction time. What is the DV?","a":"Reaction time (e.g. in milliseconds)","t":"RM","id":1291},{"q":"A researcher tests whether music affects reaction time. Give an extraneous variable.","a":"Time of day, tiredness, noise, or participants' age","t":"RM","id":1292},{"q":"Operationalise 'happiness'.","a":"A score out of 10 on a happiness questionnaire","t":"RM","id":1293},{"q":"Operationalise 'aggression' in an observation.","a":"The number of times a child hits, kicks or pushes in 10 minutes","t":"RM","id":1294},{"q":"Operationalise 'memory'.","a":"The number of words recalled from a list of 20","t":"RM","id":1295},{"q":"A study compares the memory of 15-year-olds and 70-year-olds. What type of experiment is this?","a":"A natural (quasi) experiment – the IV (age) occurs naturally","t":"RM","id":1296},{"q":"Researchers test pupils' recall in their own classroom, changing whether music is playing. What type of experiment is this?","a":"A field experiment","t":"RM","id":1297},{"q":"A researcher asks participants to name as many animals as they can with and without distraction, in a lab. What type of experiment is this?","a":"A laboratory experiment","t":"RM","id":1298},{"q":"Participants do a memory test in silence and then with noise. Which design is this?","a":"Repeated measures","t":"RM","id":1299},{"q":"One group revises with music and a different group revises without. Which design is this?","a":"Independent groups","t":"RM","id":1300},{"q":"Participants are paired by IQ and one of each pair goes into each condition. Which design is this?","a":"Matched pairs","t":"RM","id":1301},{"q":"Give a strength of independent groups design.","a":"No order effects, and participants are less likely to guess the aim","t":"RM","id":1302},{"q":"Give a weakness of independent groups design.","a":"Participant variables between the groups could affect the results","t":"RM","id":1303},{"q":"Give a strength of repeated measures design.","a":"No participant variables, as the same people are in both conditions","t":"RM","id":1304},{"q":"Give a weakness of repeated measures design.","a":"Order effects (practice or fatigue) and demand characteristics","t":"RM","id":1305},{"q":"Give a strength of matched pairs design.","a":"Reduces participant variables and avoids order effects","t":"RM","id":1306},{"q":"Give a weakness of matched pairs design.","a":"Time-consuming and it is impossible to match people exactly","t":"RM","id":1307},{"q":"How do you deal with order effects in repeated measures?","a":"Counterbalancing – half do condition A first and half do B first","t":"RM","id":1308},{"q":"A researcher picks every 10th name from the school register. Which sampling method is this?","a":"Systematic sampling","t":"RM","id":1309},{"q":"A researcher asks people walking past in the high street to take part. Which sampling method is this?","a":"Opportunity sampling","t":"RM","id":1310},{"q":"A researcher puts all students' names in a hat and draws 20. Which sampling method is this?","a":"Random sampling","t":"RM","id":1311},{"q":"A school is 60% girls and 40% boys; the researcher picks 6 girls and 4 boys. Which sampling method is this?","a":"Stratified sampling","t":"RM","id":1312},{"q":"Give a strength of opportunity sampling.","a":"Quick, easy and cheap","t":"RM","id":1313},{"q":"Give a weakness of random sampling.","a":"It can be time-consuming and needs a full list of the target population","t":"RM","id":1314},{"q":"Give a weakness of systematic sampling.","a":"It may not be representative if the list has a pattern","t":"RM","id":1315},{"q":"Give a weakness of stratified sampling.","a":"Time-consuming, and the researcher needs detailed information about the population","t":"RM","id":1316},{"q":"A researcher tells participants the study is about memory when it is really about conformity. Which ethical issue is this?","a":"Deception","t":"RM","id":1317},{"q":"A participant becomes upset but is told to carry on. Which ethical guideline is broken?","a":"Right to withdraw (and protection from harm)","t":"RM","id":1318},{"q":"A researcher publishes participants' names with their results. Which ethical guideline is broken?","a":"Confidentiality","t":"RM","id":1319},{"q":"How can researchers deal with deception?","a":"A full debrief at the end, explaining the true aim and offering to withdraw data","t":"RM","id":1320},{"q":"How can researchers protect participants from harm?","a":"Stop the study if anyone becomes distressed and offer support after","t":"RM","id":1321},{"q":"Calculate the mean of 4, 6, 8, 10, 12.","a":"8","t":"RM","id":1322},{"q":"Find the median of 3, 7, 9, 12, 15.","a":"9","t":"RM","id":1323},{"q":"Find the mode of 2, 4, 4, 5, 7.","a":"4","t":"RM","id":1324},{"q":"Calculate the range of 3, 7, 9, 12, 15.","a":"12","t":"RM","id":1325},{"q":"What is a measure of central tendency?","a":"An average – the mean, median or mode","t":"RM","id":1326},{"q":"When is the median better than the mean?","a":"When there are extreme scores (outliers)","t":"RM","id":1327},{"q":"What is the range?","a":"The difference between the highest and lowest scores – a measure of spread","t":"RM","id":1328},{"q":"What is standard deviation?","a":"A measure of how spread out scores are around the mean","t":"RM","id":1329},{"q":"What does a large standard deviation show?","a":"Scores are widely spread from the mean","t":"RM","id":1330},{"q":"What is a normal distribution?","a":"A symmetrical, bell-shaped curve where mean, median and mode are in the middle","t":"RM","id":1331},{"q":"What is a bar chart used for?","a":"Showing data in separate categories, e.g. mean scores for each condition","t":"RM","id":1332},{"q":"What is a histogram used for?","a":"Showing continuous data, with bars touching","t":"RM","id":1333},{"q":"What should go on the x-axis and y-axis of a bar chart for an experiment?","a":"x-axis – the conditions of the IV; y-axis – the DV","t":"RM","id":1334},{"q":"What is a pilot study?","a":"A small trial run of a study to check the procedure works before the main study","t":"RM","id":1335},{"q":"What is a control group?","a":"A group that doesn't receive the IV, used for comparison","t":"RM","id":1336},{"q":"Why are standardised instructions used?","a":"So every participant gets the same information, reducing extraneous variables","t":"RM","id":1337},{"q":"What is a longitudinal study?","a":"A study of the same participants over a long period of time","t":"RM","id":1338},{"q":"What is a cross-sectional study?","a":"A study comparing different groups (e.g. ages) at one point in time","t":"RM","id":1339},{"q":"Give a strength of a longitudinal study.","a":"It shows how behaviour changes over time in the same people","t":"RM","id":1340},{"q":"Give a weakness of a longitudinal study.","a":"It takes a long time and participants may drop out","t":"RM","id":1341},{"q":"What is a confederate?","a":"Someone who appears to be a participant but is actually working for the researcher","t":"RM","id":1342},{"q":"Why might a researcher use a confederate?","a":"To create a situation, e.g. giving wrong answers in Asch's study","t":"RM","id":1343},{"q":"Name a study that used confederates.","a":"Asch, Milgram, or Piliavin","t":"RM","id":1344},{"q":"What is peer review?","a":"When other experts check a study before it is published","t":"RM","id":1345},{"q":"Sophie touches a hot pan and pulls her hand away before feeling pain. Which part of the nervous system controls this?","a":"A reflex via the spinal cord and peripheral nervous system (without the brain)","t":"Brain & neuropsychology","id":1346},{"q":"Before a race, Jake's heart pounds and his mouth feels dry. Which division of the nervous system is active?","a":"The sympathetic nervous system","t":"Brain & neuropsychology","id":1347},{"q":"After the race, Jake's heart rate slows and he feels hungry. Which division is active now?","a":"The parasympathetic nervous system","t":"Brain & neuropsychology","id":1348},{"q":"Amir decides to raise his hand in class. Which nervous system controls this?","a":"The somatic nervous system","t":"Brain & neuropsychology","id":1349},{"q":"Hana sees a spider, her heart races, and then she realises she is scared. Which theory of emotion is this?","a":"The James-Lange theory","t":"Brain & neuropsychology","id":1350},{"q":"Lucas practises football every day and gets better. How would Hebb explain this?","a":"Repeated practice strengthens the connections between neurons (cell assemblies), so skills become more efficient","t":"Brain & neuropsychology","id":1351},{"q":"After a stroke, Mr Jones can understand speech but struggles to speak. Which area is likely damaged?","a":"Broca's area","t":"Brain & neuropsychology","id":1352},{"q":"After a stroke, Mrs Patel speaks fluently but her sentences make no sense. Which area is likely damaged?","a":"Wernicke's area","t":"Brain & neuropsychology","id":1353},{"q":"A patient can't feel touch on their left hand. Which brain area might be damaged?","a":"The right somatosensory area (parietal lobe)","t":"Brain & neuropsychology","id":1354},{"q":"A patient has lost part of their vision after head injury. Which lobe is likely damaged?","a":"The occipital lobe","t":"Brain & neuropsychology","id":1355},{"q":"A patient struggles with balance and coordination after a car crash. Which brain structure is likely damaged?","a":"The cerebellum","t":"Brain & neuropsychology","id":1356},{"q":"A doctor wants to see if a patient has a brain tumour. Which scan would show the structure?","a":"CT (CAT) scan","t":"Brain & neuropsychology","id":1357},{"q":"A researcher wants to see which brain areas are active during a memory task without using radiation. Which scan should they use?","a":"fMRI","t":"Brain & neuropsychology","id":1358},{"q":"Why might a doctor use a PET scan?","a":"To see which brain areas are active (metabolic activity), e.g. in depression or dementia","t":"Brain & neuropsychology","id":1359},{"q":"Give a strength of CT scans.","a":"Quick and good for detailed images of brain structure","t":"Brain & neuropsychology","id":1360},{"q":"Give a weakness of CT scans.","a":"They use X-rays (radiation) and don't show brain activity","t":"Brain & neuropsychology","id":1361},{"q":"Give a weakness of PET scans.","a":"They use radioactive tracers, are expensive and have poor detail compared with fMRI","t":"Brain & neuropsychology","id":1362},{"q":"Give a weakness of fMRI scans.","a":"Expensive, and people must lie still in a noisy, enclosed machine","t":"Brain & neuropsychology","id":1363},{"q":"What was the IV in Penfield's study?","a":"The area of the brain that was stimulated","t":"Brain & neuropsychology","id":1364},{"q":"What was the DV in Penfield's study?","a":"What the patient reported experiencing","t":"Brain & neuropsychology","id":1365},{"q":"Give an ethical issue with Penfield's study.","a":"Patients were having brain surgery and may have been in a vulnerable state to consent","t":"Brain & neuropsychology","id":1366},{"q":"Why is Penfield's study high in reliability?","a":"The procedure was repeated on over 1,000 patients","t":"Brain & neuropsychology","id":1367},{"q":"Why is Penfield's study not very generalisable?","a":"Only a small percentage showed interpretive cortex responses and all had epilepsy","t":"Brain & neuropsychology","id":1368},{"q":"Give an ethical issue with Tulving's study.","a":"Participants were injected with a radioactive substance","t":"Brain & neuropsychology","id":1369},{"q":"Why might Tulving's study show researcher bias?","a":"Tulving and his wife were participants, and they knew the aim","t":"Brain & neuropsychology","id":1370},{"q":"How could brain scanning research be applied?","a":"Diagnosing brain damage and tumours, and understanding mental illnesses","t":"Brain & neuropsychology","id":1371},{"q":"Give a strength of the fight or flight response.","a":"It helps survival by preparing the body to deal with danger quickly","t":"Brain & neuropsychology","id":1372},{"q":"Why can the fight or flight response be unhelpful today?","a":"Modern stressors (like exams) aren't physical threats, so the response can cause anxiety and health problems","t":"Brain & neuropsychology","id":1373},{"q":"What does the sympathetic nervous system do to the pupils?","a":"Dilates them","t":"Brain & neuropsychology","id":1374},{"q":"What does the parasympathetic nervous system do to heart rate?","a":"Slows it down","t":"Brain & neuropsychology","id":1375},{"q":"What does the sympathetic nervous system do to saliva?","a":"Reduces saliva production (dry mouth)","t":"Brain & neuropsychology","id":1376},{"q":"Give a strength of localisation of function.","a":"Supported by case studies such as Tan (Broca) and brain scans","t":"Brain & neuropsychology","id":1377},{"q":"Give a weakness of localisation of function.","a":"Some functions involve many areas working together, and the brain can reorganise after damage (plasticity)","t":"Brain & neuropsychology","id":1378},{"q":"What is brain plasticity?","a":"The brain's ability to change and form new connections as a result of learning or after damage","t":"Brain & neuropsychology","id":1379},{"q":"Why is Hebb's theory useful for rehabilitation?","a":"If the brain can form new connections, people may regain skills after damage through practice","t":"Brain & neuropsychology","id":1380},{"q":"What is the role of the hypothalamus in fight or flight?","a":"It detects a threat and activates the sympathetic nervous system","t":"Brain & neuropsychology","id":1381},{"q":"Jess remembers her first day at secondary school and how nervous she felt. Which type of memory is this?","a":"Episodic memory","t":"Memory","id":1382},{"q":"Jess knows that water boils at 100°C. Which type of memory is this?","a":"Semantic memory","t":"Memory","id":1383},{"q":"Jess can tie her shoelaces without thinking. Which type of memory is this?","a":"Procedural memory","t":"Memory","id":1384},{"q":"Ali repeats a phone number over and over until he dials it. What is this?","a":"Maintenance rehearsal","t":"Memory","id":1385},{"q":"Ali remembers a list better by grouping the numbers into threes. What is this?","a":"Chunking","t":"Memory","id":1386},{"q":"A student learns French then Spanish and mixes up words. If Spanish words get in the way of recalling French, which interference is this?","a":"Retroactive interference","t":"Memory","id":1387},{"q":"A student revises in the exam hall and recalls more in the exam. Which factor affecting memory explains this?","a":"Context","t":"Memory","id":1388},{"q":"A witness 'remembers' a detail that was only suggested by a police officer. What is this?","a":"A false memory","t":"Memory","id":1389},{"q":"When retelling a film, Sara leaves out many details and adds some exciting ones. Which processes are these?","a":"Levelling and sharpening","t":"Memory","id":1390},{"q":"A student remembers the first and last items on a shopping list. What explains this?","a":"The serial position effect (primacy and recency)","t":"Memory","id":1391},{"q":"Give a strength of Bartlett's study.","a":"It had higher mundane realism than other memory research: participants recalled a story rather than word lists, and English students are used to learning and recalling stories (counterargument: it was an unusual story)","t":"Memory","id":1392},{"q":"Give an ethical issue with Bartlett's study.","a":"There were few ethical issues – participants just recalled a story","t":"Memory","id":1393},{"q":"Give a strength of McGeoch and McDonald's study.","a":"It was a controlled lab experiment with standardised word lists","t":"Memory","id":1394},{"q":"Give a weakness of McGeoch and McDonald's study.","a":"Small sample (12) and artificial word lists, so it lacks mundane realism","t":"Memory","id":1395},{"q":"What was the IV in McGeoch and McDonald's study?","a":"The type of second list learned (synonyms, antonyms, unrelated words, etc.)","t":"Memory","id":1396},{"q":"What was the DV in McGeoch and McDonald's study?","a":"Recall of the original word list","t":"Memory","id":1397},{"q":"What design was Godden and Baddeley's study?","a":"Repeated measures – each diver took part in all four conditions","t":"Memory","id":1398},{"q":"What sampling method did Godden and Baddeley use?","a":"Volunteer/opportunity sampling – members of a diving club","t":"Memory","id":1399},{"q":"What was the DV in Godden and Baddeley's study?","a":"The number of words recalled","t":"Memory","id":1400},{"q":"What sampling method did Loftus and Pickrell use?","a":"Volunteers (participants recruited with their relatives' help)","t":"Memory","id":1401},{"q":"Give a strength of Loftus and Pickrell's study.","a":"Real childhood events were used, and relatives confirmed which stories were true","t":"Memory","id":1402},{"q":"How could the multi-store model be applied to revision?","a":"Rehearse information repeatedly to transfer it to LTM, and pay attention to avoid losing it from sensory memory","t":"Memory","id":1403},{"q":"How could interference research be applied to revision?","a":"Don't revise similar subjects back-to-back; leave gaps between similar topics","t":"Memory","id":1404},{"q":"Why might context effects be weak in everyday life?","a":"Most everyday contexts aren't as different as land and underwater","t":"Memory","id":1405},{"q":"Give a weakness of the theory of reconstructive memory.","a":"Some memories are accurate, especially distinctive ones, e.g. Bartlett's participants often recalled 'something black came out of his mouth'; traumatic events may be recalled vividly and high anxiety can even increase accuracy","t":"Memory","id":1406},{"q":"How does Clive Wearing's case support the idea of separate memory types?","a":"He lost episodic memory but kept procedural memory (playing piano)","t":"Memory","id":1407},{"q":"Write a null hypothesis for Godden and Baddeley's study.","a":"There will be no difference in recall whether the learning and recall environments match or not","t":"Memory","id":1408},{"q":"Give an ethical issue with Godden and Baddeley's study.","a":"Diving in cold water could be risky, so participants needed protection from harm","t":"Memory","id":1409},{"q":"Dan has felt low for three weeks, has stopped enjoying football and can't sleep. Could he be diagnosed with depression?","a":"Possibly – symptoms have lasted over 2 weeks, but a doctor would check how many ICD symptoms he has and rule out physical causes","t":"Psychological problems","id":1410},{"q":"Ruby feels extremely excited, talks fast and hardly sleeps, but was very low last month. Which disorder might she have?","a":"Bipolar depression (bipolar affective disorder)","t":"Psychological problems","id":1411},{"q":"Zak thinks 'I failed because I'm stupid, I'll always be stupid, and I ruin everything'. Which attributional style is this?","a":"Internal, stable and global","t":"Psychological problems","id":1412},{"q":"Chloe thinks 'I failed because the test was unfair and it's just this once'. Which attributional style is this?","a":"External and unstable","t":"Psychological problems","id":1413},{"q":"A therapist asks, 'Where is the evidence your friends hate you?'. Which CBT technique is this?","a":"Disputing","t":"Psychological problems","id":1414},{"q":"A therapist asks a client to plan a walk with a friend each day. Which CBT technique is this?","a":"Behavioural activation","t":"Psychological problems","id":1415},{"q":"Tom needs more and more alcohol to feel drunk. Which characteristic of addiction is this?","a":"Tolerance","t":"Psychological problems","id":1416},{"q":"Maria feels shaky and sick when she tries to stop smoking. Which characteristic of addiction is this?","a":"Withdrawal","t":"Psychological problems","id":1417},{"q":"Jay keeps gambling even though he has lost his house. Which characteristic of addiction is this?","a":"Persisting despite harm","t":"Psychological problems","id":1418},{"q":"A teenager starts vaping because all his friends do. Which explanation of addiction is this?","a":"Peer influence (social learning theory / social norms)","t":"Psychological problems","id":1419},{"q":"A man is given Antabuse so he feels sick when he drinks. Which treatment is this?","a":"Aversion therapy","t":"Psychological problems","id":1420},{"q":"Sara attends Alcoholics Anonymous meetings. Which type of treatment is this?","a":"A self-management programme (self-help group)","t":"Psychological problems","id":1421},{"q":"Give a strength of the biological explanation of depression.","a":"It is supported by research such as McNeal and Cimbolic, and it led to drug treatments","t":"Psychological problems","id":1422},{"q":"Give a strength of the genetic explanation of addiction.","a":"Twin studies such as Kaij and Kendler show MZ twins have higher concordance than DZ twins","t":"Psychological problems","id":1423},{"q":"Give a weakness of the genetic explanation of addiction.","a":"MZ concordance isn't 100%, and twins share environments, so nurture is also involved","t":"Psychological problems","id":1424},{"q":"Why is the diathesis-stress model a better explanation of addiction?","a":"It combines genetic vulnerability with environmental triggers, so it is more holistic","t":"Psychological problems","id":1425},{"q":"Give a strength of the peer influence explanation.","a":"It can be applied to prevention, e.g. using positive peer role models","t":"Psychological problems","id":1426},{"q":"Give a strength of aversion therapy.","a":"It can work quickly and deals directly with the addictive behaviour","t":"Psychological problems","id":1427},{"q":"Give an ethical issue with aversion therapy.","a":"It deliberately causes discomfort, such as vomiting, so clients may be distressed","t":"Psychological problems","id":1428},{"q":"Why might aversion therapy be combined with CBT?","a":"Aversion therapy tackles the behaviour and CBT tackles the underlying thoughts, reducing relapse","t":"Psychological problems","id":1429},{"q":"What was the IV in Wiles' study?","a":"Whether participants had antidepressants only or antidepressants plus CBT","t":"Psychological problems","id":1430},{"q":"What was the DV in Wiles' study?","a":"Depression symptoms measured by the BDI","t":"Psychological problems","id":1431},{"q":"What was the sample in Wiles' study?","a":"469 adults with treatment-resistant depression, recruited from GP practices in the UK","t":"Psychological problems","id":1432},{"q":"How did Wiles control participant variables?","a":"Participants were randomly allocated to the two conditions","t":"Psychological problems","id":1433},{"q":"What was the IV in Kaij's study?","a":"Type of twin (MZ or DZ)","t":"Psychological problems","id":1434},{"q":"What was the DV in Kaij's study?","a":"Whether the co-twin was also alcoholic (concordance)","t":"Psychological problems","id":1435},{"q":"What research method did Kaij use to find out about drinking?","a":"Interviews and questionnaires (self-report) plus temperance board records","t":"Psychological problems","id":1436},{"q":"Why might self-report be a problem in Kaij's study?","a":"Twins might under-report their drinking due to social desirability","t":"Psychological problems","id":1437},{"q":"Why might the rising number of mental health diagnoses not mean more illness?","a":"Less stigma and better awareness mean more people seek help and get diagnosed","t":"Psychological problems","id":1438},{"q":"Why is the link between mental illness and crime often misrepresented?","a":"Media headlines exaggerate it, although most violent crime isn't committed by people with mental illness","t":"Psychological problems","id":1439},{"q":"How could stigma around mental health be reduced?","a":"Education, positive media coverage, and people speaking openly about their experiences","t":"Psychological problems","id":1440},{"q":"Why might drugs alone not be enough to treat depression?","a":"They are reductionist and don't deal with negative thinking or life problems","t":"Psychological problems","id":1441},{"q":"Who were the participants in Murdock's study?","a":"Psychology students","t":"Memory","id":1442},{"q":"Why did Murdock's study use a biased sample?","a":"The participants were all psychology students, who may understand memory techniques and could show demand characteristics","t":"Memory","id":1443},{"q":"Give a strength of Murdock's study related to control.","a":"High control over extraneous variables, e.g. random words were used, so the position of the word is likely to have caused the difference in recall","t":"Memory","id":1444},{"q":"How does research on people with amnesia support Murdock's study?","a":"People with amnesia (damage to LTM) often still show a recency effect but a much weaker primacy effect, suggesting STM and LTM are separate stores","t":"Memory","id":1445},{"q":"Give a counterargument to the strength that Bartlett's study had mundane realism.","a":"The War of the Ghosts was an unusual, unfamiliar story, so recalling it is not like remembering everyday events","t":"Memory","id":1446},{"q":"Describe Baddeley's study of encoding.","a":"4 groups (independent measures) heard 12 sets of 5 words: acoustically similar, acoustically dissimilar, semantically similar or semantically dissimilar, then recalled them immediately or after 20 minutes","t":"Memory","id":1447},{"q":"What did Baddeley find in his study of encoding?","a":"Immediate recall (STM) was worse for acoustically similar words; recall after 20 minutes (LTM) was worse for semantically similar words","t":"Memory","id":1448},{"q":"What did Baddeley's encoding study show?","a":"STM mainly encodes acoustically (by sound) and LTM mainly encodes semantically (by meaning), supporting separate stores","t":"Memory","id":1449},{"q":"Give a weakness of the multi-store model related to its supporting research.","a":"The supporting research (e.g. Murdock, Baddeley) used random word lists, so it lacks mundane realism, which undermines the credibility of the model","t":"Memory","id":1450},{"q":"How do case studies support the multi-store model's separate stores?","a":"People with brain damage, such as Clive Wearing or KF, can have one store damaged while the other still works, suggesting STM and LTM are separate","t":"Memory","id":1451},{"q":"What did Tulving's gold study find about types of LTM?","a":"Semantic memories showed more blood flow at the back of the brain (occipital and parietal lobes), episodic memories at the front (frontal and temporal lobes)","t":"Memory","id":1452},{"q":"Give a weakness of the idea that there are three separate types of LTM.","a":"Episodic and semantic memories overlap, e.g. knowledge of your favourite band is linked to seeing them perform, and amnesic patients keep some semantic memory, so they may be one declarative memory","t":"Memory","id":1453},{"q":"What is the difference between PEE and TDEE?","a":"PEE (Point, Evidence, Explain) is for points with no key term to define; TDEE (Term, Define, Evidence, Explain) is for points that use a term you need to define","t":"Memory","id":1454},{"q":"What is optic flow?","a":"The pattern of movement in what we see, which tells us whether we are moving or not (Gibson)","t":"Perception","id":1455},{"q":"What is colour gradient?","a":"Closer objects appear more vibrant in colour, and further objects duller (Gibson)","t":"Perception","id":1456},{"q":"How does Fantz's study support Gibson's theory?","a":"Young babies spent longer looking at a real face pattern than a scrambled one, suggesting we are born able to perceive faces (nature)","t":"Perception","id":1457},{"q":"Give a weakness of the research supporting Gibson's theory.","a":"Methodological issues: Gibson and Walk and Fantz only studied babies, so they tell us little about adult perception; the visual cliff surface was also unfamiliar","t":"Perception","id":1458},{"q":"Why is Gibson's theory reductionist?","a":"It only considers nature and ignores the role of experience (nurture), which Gregory emphasises","t":"Perception","id":1459},{"q":"Why is Gregory's theory reductionist?","a":"It only considers nurture and ignores innate perceptual abilities, such as those Gibson describes","t":"Perception","id":1460},{"q":"Give a weakness of Bruner and Minturn's independent measures design.","a":"Individual differences between the two groups are an extraneous variable that could affect the results","t":"Perception","id":1461},{"q":"Describe Gilchrist and Nesberg's sample.","a":"26 student volunteers in 2 groups: one food-deprived for 20 hours and a control group","t":"Perception","id":1462},{"q":"What did Sanford (1936) find?","a":"The longer participants had gone without food, the more likely they were to interpret pictures as food, supporting Gilchrist and Nesberg","t":"Perception","id":1463},{"q":"What does SPACER help you evaluate, and what does GRAVE help you evaluate?","a":"SPACER is for theories (Scientific, Practical applications, Alternative theories, Credibility, Ethical issues, Reductionism); GRAVE is for studies (Generalisability, Reliability, Application, Validity, Ethics)","t":"Perception","id":1464},{"q":"Describe the sample and method of Yuki's study.","a":"95 Japanese and 118 American students rated six emoticons (combinations of happy, neutral or sad eyes and mouths) on a scale from 1 (very sad) to 9 (very happy)","t":"Language, thought & communication","id":1465},{"q":"What did Pullum (1989) argue about Inuit words for snow?","a":"Boas exaggerated the differences: the Inuit really have only two root words for snow, 'qanik' (snow in the air) and 'aput' (snow on the ground)","t":"Language, thought & communication","id":1466},{"q":"Who claimed the Inuit have many words for snow?","a":"Boas","t":"Language, thought & communication","id":1467},{"q":"What did Carmichael et al. (1932) find?","a":"The label given with a simple line drawing changed how people later drew it from memory, suggesting language affects our recall of events","t":"Language, thought & communication","id":1468},{"q":"Give a weakness of Carmichael et al.'s study.","a":"It lacks mundane realism: remembering simple line drawings with labels is not like recalling real events","t":"Language, thought & communication","id":1469},{"q":"Why does von Frisch's study give an incomplete explanation of bee communication?","a":"Later research found bees also use buzzing sounds and vibrations during the dance, which help other bees understand it","t":"Language, thought & communication","id":1470},{"q":"How does Ekman et al.'s (1972) research support Darwin's theory?","a":"People from different cultures recognise the same basic facial expressions of emotion, suggesting they are universal and evolved","t":"Language, thought & communication","id":1471},{"q":"Give an example of a gesture that means different things in different cultures.","a":"The 'OK' sign means different things in different cultures, and pointing with a finger is offensive in some Hindu cultures","t":"Language, thought & communication","id":1472},{"q":"What is an alternative explanation for the Inuit having lots of snow words?","a":"Piaget's theory: they experience lots of snow, so their thinking about snow develops first and the words follow","t":"Language, thought & communication","id":1473},{"q":"What did McGarrigle and Donaldson conclude?","a":"Children younger than 7 can conserve if the change looks accidental, so Piaget underestimated them","t":"Development","id":1474},{"q":"Give a strength of Hughes' study related to mundane realism.","a":"High mundane realism: playing with toys and hiding is a normal, familiar game for a child","t":"Development","id":1475},{"q":"What did Pashler et al. (2008) find about learning styles?","a":"They reviewed the research and found little evidence that teaching in someone's preferred learning style improves their results","t":"Development","id":1476},{"q":"Why might Dweck's mindset theory be culturally biased?","a":"Most mindset research has been done in individualist cultures (e.g. the USA), so it may not apply to collectivist cultures","t":"Development","id":1477},{"q":"Why is Willingham's theory described as scientific?","a":"It is based on evidence from cognitive psychology and neuroscience, e.g. Willingham and Lloyd (2007) found different brain-wave patterns in people with dyslexia","t":"Development","id":1478},{"q":"Give one way Willingham's ideas can be used in classrooms.","a":"Retrieval practice, e.g. 'do now' quizzes that make students recall earlier learning","t":"Development","id":1479}];

function rngFrom(seed){ let a=0; for(const ch of String(seed)) a=(a*31+ch.charCodeAt(0))|0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffleR(a,rng){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pickR = (a,rng) => a[Math.floor(rng()*a.length)];

function mk(sc,q,opt,cands,a,kind){

}

    return mk(`${intro(s)} The mean in the ${s.A} condition was ${fmtN(a)} and the mean in the ${s.B} condition was ${fmtN(b)} (${s.unit}).`,"Which statement about the results is correct?",`The ${hi} condition had a higher mean, by ${d}`,[`The ${lo} condition had a higher mean, by ${d}`,`The ${hi} condition had a higher mean, by ${fmtN(Math.abs(a-b)+1)}`,`The ${hi} condition had a higher mean, by ${fmtN(a+b)}`],`The ${hi} condition had a higher mean, by ${d} (${fmtN(Math.max(a,b))} − ${fmtN(Math.min(a,b))}).`,"maths"); },
};

const MATHS_KEYS = ["corr","mean","median","mode","range","pct","frac","ratio","stdform","sigfig","compare"];
function genRM(rng=Math.random, kind){ const keys = kind==="maths" ? RM_BAG.filter(k=>MATHS_KEYS.includes(k)) : kind==="rm" ? RM_BAG.filter(k=>!MATHS_KEYS.includes(k)) : RM_BAG; return RMGEN[pickR(keys,rng)](rng); }

const WHY = {"4":"Acoustic = sound (think 'acoustic guitar'). STM mainly uses this.","5":"Semantic = meaning. LTM mainly stores things by what they mean.","11":"Procedural = 'knowing how'. You do it without having to think about it, like riding a bike.","12":"Semantic = facts everyone can know, with no 'when' or 'where' attached.","13":"Episodic = episodes of YOUR life, each with a time and place, like an episode of a TV series.","16":"Declarative = you can 'declare' it in words: episodic and semantic.","17":"Non-declarative = you can't easily put it into words: procedural.","26":"Miller's 'magical number 7 ± 2', so 5 to 9 items.","27":"Without rehearsal, information in STM fades within about half a minute.","28":"STM codes mainly by sound, which is why similar-sounding words get muddled.","31":"LTM codes mainly by meaning, which is why similar-meaning words get muddled.","40":"Chunking groups items together (e.g. 0121 456 7890), so STM holds more.","45":"Losing one type of LTM but keeping another suggests LTM isn't just one store.","56":"The first items were rehearsed most, so they reached LTM.","57":"The last items are still in STM when you start recalling.","58":"Primacy items survived because rehearsal moved them into LTM.","59":"Recency items vanish if you delay recall, which shows they were only in STM.","66":"Mundane realism is about the TASK being like everyday life. Ecological validity is about the SETTING.","67":"Internal validity = confident the IV caused the DV. Lab control gives that.","80":"Assimilation: the new thing fits an existing schema with no change needed.","81":"Accommodation: the schema has to change to fit the new thing.","105":"Interference means memories get in each other's way; the memory isn't lost, just blocked.","106":"Similar memories compete, e.g. two similar phone numbers.","107":"PRO = forwards: old interferes with new.","108":"RETRO = backwards: new interferes with old.","114":"The surroundings at learning act as cues that help retrieval later.","120":"Divers recalled best when learning and recall happened in the same place.","139":"Reductionism is a weakness: it ignores the bigger picture.","142":"Can the results be applied to the whole target population, not just this sample?","143":"Is the TASK something people actually do in real life?","149":"Anything besides the IV that could change the DV, e.g. time of day or noise.","152":"Null = predicts no difference. You test whether the results let you reject it.","154":"Directional = says which way, e.g. 'more' or 'fewer'.","155":"Non-directional = just 'a difference', without saying which way.","161":"Control over extraneous variables means the IV is the likely cause.","162":"Artificial tasks and settings, and people know they're being studied.","163":"A natural setting means people behave as they normally would.","164":"Real-world settings are messy, so other variables can creep in.","169":"Numbers = quantitative. Think 'quantity'.","170":"Words and descriptions = qualitative. Think 'quality'.","175":"First-hand, collected by the researcher for this study.","176":"Second-hand, already collected by someone else for another reason.","180":"Order effects happen in both directions, so they cancel out across the sample.","181":"Validity = accuracy: is it measuring what it should?","182":"Reliability = consistency: would you get the same results again?","191":"Mono = one. Works with one eye, including in pictures.","192":"Bi = two. Needs both eyes, so pictures can't use it.","194":"Your eyes turn inwards more for close objects, and the brain reads the muscle strain.","197":"Your eyes are a few centimetres apart, so each sees a slightly different image.","198":"Close objects look very different to each eye; far ones look almost the same.","201":"Things nearer the horizon (higher up) look further away.","202":"If we assume two things are the same size, the smaller one must be further away.","203":"Whatever is blocking the view must be in front.","204":"Parallel lines, like railway tracks, seem to meet in the distance.","206":"Gibson's cue: watch fences vs hills from a train window.","208":"We know real sizes, so things don't seem to shrink as they move away.","213":"Converging lines make the top bar seem further away, so size constancy makes it look bigger.","214":"Gregory: the fins look like the corners of buildings, so we misapply size constancy.","215":"We assume rooms are rectangular, so we misjudge how far away each person is.","218":"Fiction = seeing something that isn't there, as the brain fills in the gaps.","222":"Gregory: knowledge and experience shape perception, so it works top-down.","223":"Top-down = from the brain down: expectations guide what we see.","234":"Gibson: the information in the light is enough, so it works bottom-up.","235":"Bottom-up = from the senses up: no experience needed.","238":"Affordances are innate because perceiving what objects are for helped our ancestors survive.","269":"Different people saw letters or numbers, so it was independent groups.","284":"A hungry group and a separate control group = independent groups.","296":"Whoever's around at the time: quick, but probably biased.","298":"Every nth person from a list, e.g. every 10th name.","300":"Subgroups appear in the same proportions as in the population.","304":"Different people in each condition.","305":"The same people do every condition.","306":"Pairs are matched on something like age or IQ, and one of each goes into each condition.","308":"Using the same people (or matched people) removes differences between the groups.","312":"Two things measured together to see if they're related, with nothing manipulated.","313":"Both go up together, e.g. revision time and test score.","314":"One goes up as the other goes down, e.g. screen time and sleep.","317":"The sign shows the direction (negative); 0.8 is close to 1, so it's strong.","324":"Control gives internal validity, but the artificial setting lowers ecological validity.","331":"Normative = wanting to fit in and be liked.","332":"Informational = wanting to be right, so we copy others who seem to know.","334":"Situational = about the situation, e.g. group size or a uniform.","335":"Dispositional = about the person, e.g. personality.","350":"Without public pressure, there's less fear of standing out.","352":"When a task is hard, we copy others because we think they know better.","353":"Privacy removes the fear of rejection, which drives normative influence.","358":"1950s America valued fitting in, so results might differ today.","391":"Autonomous = acting on your own free will and taking responsibility.","392":"Agentic = acting as someone else's 'agent', so you don't feel responsible.","393":"The switch from autonomous to agentic when an authority figure gives orders.","402":"The criticism: blaming the situation could let people off for terrible acts.","412":"Responsibility is spread across everyone there, so each person feels less of it.","430":"More people means more diffusion of responsibility, so less helping.","442":"In a crowd, you lose your sense of being an individual.","444":"Anonymity weakens the link between you and your actions.","468":"Inside the study: did the IV really cause the change in the DV?","469":"Outside the study: do the results apply to other people and settings?","471":"Real-life settings: would the results happen outside the lab?","472":"Over time: would the results still be found today?","478":"Every subgroup is included in proportion, so it mirrors the population.","499":"Open questions let people answer freely, giving qualitative data.","500":"Closed questions have fixed answers, giving numbers to count.","531":"Nature = what you're born with (genes).","532":"Nurture = what you experience (environment).","553":"Out of sight is NOT out of mind once a baby has this.","591":"Fixed = you are how you are; ability can't change.","592":"Growth = ability grows with effort, like a muscle.","595":"Fixed-mindset learners care about looking clever (the grade).","596":"Growth-mindset learners care about getting better (the learning).","601":"Praise what they DID (effort, strategy), not what they ARE (clever).","604":"Self-efficacy is belief in yourself for a specific task.","606":"If you believe you can do it, you try harder and keep going.","638":"Strong = language DETERMINES thought: no word, no thought.","639":"Weak = language INFLUENCES thought: words make some thinking easier.","672":"Displacement = talking about things not here and now. Only humans can do it.","750":"Sympathetic = fight or flight; parasympathetic = rest and digest.","753":"Sympathetic gets you ready for action.","754":"Parasympathetic calms things down after the threat.","763":"James-Lange: arousal first, then emotion ('I'm scared because I'm shaking').","767":"Cannon-Bard: arousal and emotion happen at the same time.","769":"If emotion needed bodily feedback, people without bodily sensation wouldn't feel emotions.","772":"Sensory brings information in, relay passes it on, motor sends commands out.","795":"Excitatory = 'go': more likely to fire.","796":"Inhibitory = 'stop': less likely to fire.","807":"Different jobs happen in different parts of the brain.","814":"Broca's = producing speech (frontal lobe).","815":"Wernicke's = understanding language (temporal lobe).","819":"Broca's aphasia: they know what they want to say but struggle to get it out.","820":"Wernicke's aphasia: speech flows but doesn't make sense.","909":"Low serotonin is linked to low mood.","920":"Blocking reuptake means serotonin stays in the synapse longer.","924":"If serotonin rises in days but mood takes weeks, something else may be happening.","927":"Self, world, future: three areas of negative thinking.","929":"A negative lens you see yourself through, used to interpret new events.","968":"Tolerance: the body gets used to it, so you need more for the same effect.","969":"Withdrawal: the body reacts badly when the substance stops.","970":"Dependence: you feel you need it, and stopping causes withdrawal.","971":"Misuse = right reason, wrong way (e.g. too many tablets).","972":"Abuse = using it to get a feeling, in a harmful way.","980":"The percentage of twin pairs who BOTH have the trait.","981":"MZ twins share 100% of genes, DZ about 50%, so higher MZ concordance points to genes.","987":"If it were all genes, identical twins would always match (100%).","1000":"Pairing the substance with sickness makes it a conditioned stimulus for sickness.","1126":"Fitting cats into the existing dog schema = assimilation.","1127":"Changing the schema to make room for cats = accommodation.","1240":"He wants to fit in, not to be right: normative.","1241":"She doesn't know the answer, so she copies others: informational.","1252":"'Following orders' = acting as an agent of authority.","1299":"Same people in both conditions = repeated measures.","1300":"Different people in each condition = independent groups.","1302":"Each person only does one condition, so practice and boredom can't build up.","1303":"The groups are different people, so they might differ in ability.","1304":"Same people, so no differences between groups.","1305":"Doing it twice can improve (practice) or worsen (boredom) performance.","1308":"Half do A then B, half do B then A, so order effects cancel out.","1312":"The sample matches the population's proportions (60:40).","1327":"The mean gets dragged by an extreme score; the median doesn't.","1331":"Symmetrical, with mean, median and mode all in the middle.","1347":"Racing heart and dry mouth = fight or flight = sympathetic.","1348":"Calming down and digestion restarting = parasympathetic."};
