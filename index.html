tart, 6 months and 12 months.","Results: the CBT group was more likely to improve (about 46% vs 22% had at least a 50% drop in symptoms at 6 months).","Conclusion: CBT plus antidepressants is more effective than antidepressants alone.","Levels: 3–4 accurate and detailed (aim, method, results, conclusion); 1–2 limited or muddled."]}]}]},{"id":"v11-15","stim":[],"parts":[{"no":"","q":"Describe the method used in Asch's study of conformity.","m":3,"ms":[{"h":"","b":["American male college students, each in a group with 7–8 confederates (1).","They said aloud which of three comparison lines matched a stimulus line; the real participant answered last or second to last (1).","On 12 of 18 trials (critical trials) the confederates all gave the same wrong answer (1). Method only – no results."]}]}]}]},{"n":12,"title":"Evaluating named studies","icon":"🔎","tag":"PEE, specific to THIS study.","steps":[["Point","Say whether it's a strength or a weakness, and what it's about."],["Evidence","Give the detail from THIS study that proves it: the sample, the task, a number."],["Explain","So what? What does it mean for validity, generalisability, reliability or ethics? Finish by linking back to the study's findings: that's what gets the top level."],["Pick points with GRAVE","Generalisability · Reliability · Application · Validity · Ethics."]],"watch":"Swap test: could you put a different study's name in and it still makes sense? Then it's generic. 'It was a lab experiment so it lacks ecological validity' fails the test.","items":[{"id":"v12-1","stim":[],"parts":[{"no":"","q":"Evaluate Milgram's study of obedience.","m":5,"ms":[{"h":"","b":["e.g. ethics – participants were deceived (the shocks weren't real) and many were very distressed, so they weren't protected from harm; but they were debriefed and most said they were glad to have taken part.","lab setting with standardised prods – high control and replicable; but giving electric shocks is an artificial task, so low mundane realism.","sample of 40 American men – may not apply to women or other cultures.","application – helps explain real-life obedience, e.g. in the Holocaust; variations showed which factors matter.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-2","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of Piliavin's subway study.","m":4,"ms":[{"h":"","b":["Strength (2): e.g. field experiment – passengers didn't know they were in a study, so behaviour was natural (high ecological validity); large sample of about 4,450 passengers.","Weakness (2): e.g. passengers couldn't consent or be debriefed and may have been distressed; observers may have missed things in a busy carriage; New York in 1969 – may lack temporal validity.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-3","stim":[],"parts":[{"no":"","q":"Briefly evaluate Bartlett's War of the Ghosts study.","m":3,"ms":[{"h":"","b":["e.g. no standardised instructions and recall times varied – low reliability; only 20 Cambridge students – hard to generalise; a story is more realistic than word lists (mundane realism), but the War of the Ghosts was very unusual; applied to eyewitness testimony.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-4","stim":[],"parts":[{"no":"","q":"Evaluate Asch's study of conformity.","m":5,"ms":[{"h":"","b":["e.g. lab setting with confederates and standardised trials – high control, so conformity can be linked to the group; replicable.","judging lines is an artificial task with no consequences – low mundane realism.","only American male students in the 1950s – may not apply to women, collectivist cultures or today (temporal validity).","deception – participants didn't know the others were confederates, and may have been embarrassed.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-5","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of Hughes' policeman doll study.","m":4,"ms":[{"h":"","b":["Strength (2): e.g. a meaningful, familiar task (hiding from a policeman makes 'human sense'), so it measured children's real ability better than the three mountains task; standardised.","Weakness (2): e.g. 30 children from Edinburgh – small and ethnocentric; children may have picked up cues from the researcher; still a model, not a real situation.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-6","stim":[],"parts":[{"no":"","q":"Evaluate McGarrigle and Donaldson's naughty teddy study.","m":4,"ms":[{"h":"","b":["e.g. repeated measures – controls participant variables; standardised procedure – replicable.","children may have been distracted by teddy rather than understanding conservation – Moore and Frye found children still said 'same' when teddy really added a counter (low validity).","80 children from Edinburgh – may not represent all children; parental consent needed, as children can't consent.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-7","stim":[],"parts":[{"no":"","q":"Briefly evaluate von Frisch's bee study.","m":3,"ms":[{"h":"","b":["e.g. many observations over 20 years with marked bees – reliable; a natural behaviour in a controlled setting; bees aren't humans, so it tells us little about human communication; few ethical issues (but marking/handling bees).","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-8","stim":[],"parts":[{"no":"","q":"Evaluate Penfield's study of the interpretive cortex.","m":5,"ms":[{"h":"","b":["e.g. over 1,000 patients – large; procedure repeated many times (reliable).","all had epilepsy, so their brains may not be typical; only about 8% had interpretive responses – hard to generalise.","electrical stimulation isn't how the brain normally works – low ecological validity; reports were qualitative and subjective.","application – led to the Montreal Procedure for epilepsy; ethics – patients were vulnerable when consenting.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-9","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of Tulving's 'gold' memory study.","m":4,"ms":[{"h":"","b":["Strength (2): objective, scientific measurement of brain activity with PET scans – not open to interpretation.","Weakness (2): only 6 participants including Tulving and his wife, who knew the aim (researcher bias); only 3 showed clear results; injecting a radioactive substance raises ethical issues.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-10","stim":[],"parts":[{"no":"","q":"Evaluate Kaij's twin study.","m":4,"ms":[{"h":"","b":["e.g. twin studies compare MZ and DZ twins to separate genes and environment – a useful method.","only male Swedish twins registered with the temperance board – biased sample, may not apply to women or less severe drinkers.","deciding whether twins were MZ or DZ was not always accurate in the 1950s.","twins share their environment, so concordance may be partly nurture; concordance not 100%.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-11","stim":[],"parts":[{"no":"","q":"Evaluate Wiles et al.'s study.","m":5,"ms":[{"h":"","b":["e.g. large sample (469) and random allocation – controls participant variables; about 90% stayed for 12 months.","used the BDI questionnaire – self-report, so participants may under- or over-report symptoms.","participants knew whether they had CBT, so expectations may have affected results (no placebo).","applications – evidence for offering CBT to people who don't respond to antidepressants (NHS).","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-12","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of Murdock's serial position study.","m":4,"ms":[{"h":"","b":["Strength (2): lab experiment – he controlled list length and presentation, so the position of the word is likely to be the cause; standardised, so replicable.","Weakness (2): learning word lists is artificial – low mundane realism; psychology students may guess the aim (demand characteristics).","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]},{"id":"v12-13","stim":[],"parts":[{"no":"","q":"Briefly evaluate Gilchrist and Nesberg's study.","m":3,"ms":[{"h":"","b":["e.g. standardised procedure and objective brightness ratings – replicable; 26 student volunteers – small, hard to generalise; going without food for 20 hours could cause discomfort (protection from harm); pictures of food lack mundane realism; applied to advertising.","Points must be specific to the study – generic points ('it was a lab experiment so it lacks ecological validity') max 1 each."]}]}]}]},{"n":13,"title":"Evaluating research methods","icon":"🧪","tag":"Strengths and weaknesses of the method, linked to a named study.","steps":[["Point","Name the strength or weakness of the method (e.g. high control, artificial task, order effects)."],["Evidence","Show it in the named study: 'Murdock controlled the list length and presentation speed…'"],["Explain","So what for the findings? Cause and effect, replication, ecological validity, demand characteristics."],["Use the study","If the question names a study, every point must link to it."]],"watch":"'Lab experiments are artificial' is 1 mark. WHAT is artificial? Give an example. So what?","items":[{"id":"v13-1","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of field experiments. Refer to Piliavin's study in your answer.","m":4,"ms":[{"h":"","b":["Strength (2): natural setting, so behaviour is realistic – the subway passengers didn't know they were being studied (high ecological validity).","Weakness (2): less control over extraneous variables, e.g. how busy the carriage was; ethical issues – no consent or debrief for passengers. Not linked to Piliavin: max 1 each."]}]}]},{"id":"v13-2","stim":[],"parts":[{"no":"","q":"Explain one strength and one weakness of questionnaires.","m":4,"ms":[{"h":"","b":["Strength (2): e.g. can reach lots of people quickly and cheaply; closed questions give quantitative data that is easy to compare.","Weakness (2): e.g. social desirability bias – people answer to look good, so data is less valid; closed questions may not let people give their real view."]}]}]},{"id":"v13-3","stim":[],"parts":[{"no":"","q":"Explain one strength and one weakness of interviews.","m":4,"ms":[{"h":"","b":["Strength (2): e.g. unstructured interviews give rich, detailed qualitative data and allow follow-up questions.","Weakness (2): e.g. interviewer effects / social desirability – people may say what they think the interviewer wants; hard to analyse and compare answers."]}]}]},{"id":"v13-4","stim":[],"parts":[{"no":"","q":"Explain one strength and one weakness of case studies. Refer to an example in your answer.","m":4,"ms":[{"h":"","b":["Strength (2): rich, in-depth data on unusual cases that couldn't be created deliberately, e.g. Penfield's patients or HM.","Weakness (2): one person or a small group – hard to generalise; often relies on memory or retrospective accounts."]}]}]},{"id":"v13-5","stim":[],"parts":[{"no":"","q":"Explain one strength and one weakness of correlations.","m":4,"ms":[{"h":"","b":["Strength (2): can study relationships that would be unethical or impossible to manipulate, e.g. social media use and mental health.","Weakness (2): cannot show cause and effect – a third variable could explain the relationship."]}]}]},{"id":"v13-6","stim":[],"parts":[{"no":"","q":"Explain one weakness of using an independent groups design.","m":2,"ms":[{"h":"","b":["Participant variables (1): the people in each group are different, so differences in the DV may be due to the people, not the IV (1). Or: needs more participants."]}]}]},{"id":"v13-7","stim":[],"parts":[{"no":"","q":"Explain one strength of using a matched pairs design.","m":2,"ms":[{"h":"","b":["Participant variables are controlled because each pair is matched on key characteristics (1), and there are no order effects because each person only does one condition (1)."]}]}]},{"id":"v13-8","stim":[],"parts":[{"no":"","q":"Explain one weakness of opportunity sampling. Refer to Piliavin's study in your answer.","m":2,"ms":[{"h":"","b":["It may be biased / unrepresentative, because only people available at that time and place are included (1) – e.g. only passengers on certain New York trains on weekday lunchtimes (1)."]}]}]},{"id":"v13-9","stim":[],"parts":[{"no":"","q":"Explain one strength and one weakness of volunteer sampling. Refer to Milgram's study in your answer.","m":4,"ms":[{"h":"","b":["Strength (2): easy and ethical – people choose to take part; Milgram got 40 men quickly from a newspaper advert.","Weakness (2): volunteer bias – people who answer adverts may be more helpful or obedient than others, so Milgram's sample may not be representative."]}]}]},{"id":"v13-10","stim":[],"parts":[{"no":"","q":"Evaluate the use of laboratory experiments in psychology. Refer to Asch's study in your answer.","m":5,"ms":[{"h":"","b":["High control of extraneous variables – Asch controlled the lines and what the confederates said, so cause and effect can be established.","Standardised procedure – easy to replicate.","Artificial task and setting – judging lines has no real consequences, so low ecological validity / mundane realism.","Participants know they're in a study – demand characteristics.","Levels: 4–5 at least two developed points linked to Asch; 2–3 points with some explanation; 1 a basic point."]}]}]},{"id":"v13-11","stim":[],"parts":[{"no":"","q":"Explain one weakness of covert observations.","m":2,"ms":[{"h":"","b":["Ethical issues (1): people don't know they are being observed, so they can't give informed consent or withdraw (1)."]}]}]},{"id":"v13-12","stim":[],"parts":[{"no":"","q":"Explain why psychologists use standardised procedures.","m":2,"ms":[{"h":"","b":["So all participants are treated in exactly the same way (1), so differences are caused by the IV and the study can be replicated to check reliability (1)."]}]}]}]},{"n":14,"title":"Evaluate research into…","icon":"🗂️","tag":"Evaluate the whole AREA, with studies as evidence.","steps":[["Area","Identify the area of research (e.g. obedience, perception)."],["What's asked","Strengths and weaknesses? Only one? A specific aspect like ethics or validity?"],["Jot down","The studies you know in this area, and the methods usually used to study it."],["Pick points","Points that apply to the area generally: e.g. obedience research often uses deception."],["TDEE","Write each one as Term, Define, Evidence (a study), Explain."]],"watch":"'Asch's sample was only American male students' is about one study, not the area. Make it general, then use Asch as evidence.","items":[{"id":"v14-1","stim":[],"parts":[{"no":"","q":"Evaluate research into conformity.","m":6,"ms":[{"h":"","b":["e.g. mostly lab experiments with confederates (Asch) – high control and replication.","artificial tasks (judging lines) – low mundane realism; may not reflect real-life group pressure.","samples often American male students – androcentric and ethnocentric; collectivist cultures may conform more.","deception – participants not told others were confederates; possible embarrassment.","temporal validity – 1950s America was a more conformist time.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-2","stim":[],"parts":[{"no":"","q":"Evaluate research into memory.","m":5,"ms":[{"h":"","b":["e.g. often lab experiments with word lists (Murdock) – controlled, replicable, but low mundane realism.","some research uses more realistic material (Bartlett's story), but lacks control.","case studies of brain damage (HM, Clive Wearing) give insight but can't be generalised.","samples often students; few ethical issues in most memory research.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-3","stim":[],"parts":[{"no":"","q":"Evaluate research into bystander behaviour.","m":5,"ms":[{"h":"","b":["e.g. field experiments (Piliavin) – natural behaviour, high ecological validity, but less control and no informed consent.","lab studies of bystanders give more control but participants know they're being studied.","staged emergencies may distress participants (protection from harm).","applications – first-aid training and campaigns to reduce diffusion of responsibility.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-4","stim":[],"parts":[{"no":"","q":"Evaluate research into depression.","m":5,"ms":[{"h":"","b":["e.g. often relies on self-report questionnaires such as the BDI – social desirability bias, but standardised.","twin studies separate genes and environment but twins share environments.","randomised controlled trials (Wiles) – large samples and random allocation, high control.","ethical issues – vulnerable participants, and withholding treatment from control groups.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-5","stim":[],"parts":[{"no":"","q":"Evaluate research into the development of thinking (cognitive development).","m":5,"ms":[{"h":"","b":["e.g. Piaget used small samples, including his own children – researcher bias, hard to generalise.","tasks may be confusing or meaningless to children (three mountains) – later research with more meaningful tasks (Hughes, McGarrigle and Donaldson) found children can do more.","children may respond to adult cues (asking the same question twice).","ethics – children can't consent; parental consent needed.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-6","stim":[],"parts":[{"no":"","q":"Evaluate research into non-verbal communication.","m":5,"ms":[{"h":"","b":["e.g. often observations – natural behaviour but observer bias; need inter-observer reliability.","cross-cultural studies (Yuki) show cultural differences but may have translation issues.","lab studies (e.g. dark glasses and conversation) give control but are artificial.","research into personal space can raise ethical issues if people are made uncomfortable.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-7","stim":[],"parts":[{"no":"","q":"Evaluate research into the brain and memory.","m":5,"ms":[{"h":"","b":["e.g. brain scans (Tulving's PET) are objective and scientific, but small samples and artificial conditions.","case studies of patients (Penfield, HM) give unique insights but brains may not be typical (epilepsy, damage).","ethical issues – radioactive tracers, vulnerable patients.","applications – helped develop treatments and surgery for epilepsy.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-8","stim":[],"parts":[{"no":"","q":"Evaluate research into addiction.","m":5,"ms":[{"h":"","b":["e.g. twin studies (Kaij) – MZ vs DZ comparison suggests genetic vulnerability; but biased samples (male, Swedish).","research into peer influence often uses questionnaires – social desirability bias.","hard to separate genes from shared environment.","applications – prevention programmes targeting adolescents; ethics of studying vulnerable people.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-9","stim":[],"parts":[{"no":"","q":"Evaluate research into obedience.","m":6,"ms":[{"h":"","b":["e.g. often lab experiments with high control (Milgram); variations show which factors matter (proximity, location).","deception and distress – ethical issues (Milgram, Hofling).","field research (Hofling's nurses, Bickman's uniforms) has higher ecological validity but less control.","samples often American, from one era – may lack temporal validity.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]},{"id":"v14-10","stim":[],"parts":[{"no":"","q":"Evaluate research into language and thought.","m":5,"ms":[{"h":"","b":["e.g. Whorf's Hopi research relied on translation and interpretation – may be biased.","claims about Inuit words for snow were exaggerated – the evidence was weak.","colour memory studies give quantitative, more objective data.","hard to separate the effect of language from culture.","Points must be about the AREA of research, with named studies used as evidence. Levels: top band needs at least three developed points."]}]}]}]},{"n":15,"title":"Describing a theory","icon":"🧠","tag":"Big idea · key terms · how it works · example.","steps":[["Big idea","What does the theory say, in one sentence?"],["Key terms, explained","Use the theory's own words and say what each one means."],["How it works","The process, stages or steps, in order."],["Example","A quick example that shows the theory in action."]],"watch":"Theory, not study: 'Words at the start and end of a list were recalled best' is Murdock's study. The theory is the multi-store model.","items":[{"id":"v15-1","stim":[],"parts":[{"no":"","q":"Outline the theory of reconstructive memory.","m":4,"ms":[{"h":"","b":["Memory is not an exact copy – it is an active process (1); we store fragments and fill in the gaps when recalling (confabulation) (1); we use schemas – knowledge based on past experience (1); effort after meaning – we focus on the overall meaning; culture and social expectations affect recall (1)."]}]}]},{"id":"v15-2","stim":[],"parts":[{"no":"","q":"Describe Gregory's constructivist theory of perception.","m":4,"ms":[{"h":"","b":["Perception is different from sensation and is learned (nurture) (1); we make inferences (educated guesses) using sensory information and past experience (1); most inferences are right (1); visual illusions show mistaken hypotheses when cues are misapplied (1)."]}]}]},{"id":"v15-3","stim":[],"parts":[{"no":"","q":"Describe Gibson's direct theory of perception.","m":4,"ms":[{"h":"","b":["Sensation and perception are the same; there's enough information in the environment to perceive directly (nature) (1); affordances – we see what objects can be used for (1); motion parallax – nearer objects seem to move faster when we move (1); texture gradient – nearer surfaces look more detailed (1)."]}]}]},{"id":"v15-4","stim":[],"parts":[{"no":"","q":"Describe the four stages of Piaget's theory of cognitive development.","m":4,"ms":[{"h":"","b":["1 mark per stage with a feature: sensorimotor (0–2) – object permanence; pre-operational (2–7) – egocentrism, can't conserve; concrete operational (7–11) – conservation, logical thinking about real objects; formal operational (11+) – abstract thinking."]}]}]},{"id":"v15-5","stim":[],"parts":[{"no":"","q":"Describe Dweck's mindset theory of learning.","m":3,"ms":[{"h":"","b":["Fixed mindset – believe ability is innate and can't change, so give up easily (1); growth mindset – believe ability improves with effort, see failure as a chance to learn (1); praise for effort, not ability, encourages a growth mindset; self-efficacy (1)."]}]}]},{"id":"v15-6","stim":[],"parts":[{"no":"","q":"Describe Willingham's learning theory.","m":3,"ms":[{"h":"","b":["e.g. learning should be based on evidence, not learning styles – teach in the way that suits the content (1); praise should be sincere and unexpected, to encourage intrinsic motivation (1); retrieval practice / cued recall builds LTM; neuroscience can identify learning difficulties early (1)."]}]}]},{"id":"v15-7","stim":[],"parts":[{"no":"","q":"Describe Adorno's theory of the authoritarian personality.","m":3,"ms":[{"h":"","b":["Some people have a personality that makes them very obedient to authority (1); caused by a strict, harsh upbringing with punishment and conditional love (1); they see the world in black and white, respect authority figures and look down on people of lower status (1)."]}]}]},{"id":"v15-8","stim":[],"parts":[{"no":"","q":"Describe the James-Lange theory of emotion.","m":3,"ms":[{"h":"","b":["An event causes physiological arousal first (1); we then interpret the arousal (1); the emotion comes after the interpretation – 'we are afraid because we tremble' (1). Event → arousal → interpretation → emotion."]}]}]},{"id":"v15-9","stim":[],"parts":[{"no":"","q":"Describe Hebb's theory of learning and neuronal growth.","m":4,"ms":[{"h":"","b":["Learning leaves a memory trace (engram) (1); when neurons repeatedly fire together, the connections between them strengthen (synaptic knobs grow) (1); groups of neurons that fire together form cell assemblies (1); practice makes pathways more efficient, so the brain changes with learning (plasticity) (1)."]}]}]},{"id":"v15-10","stim":[],"parts":[{"no":"","q":"Describe Piaget's theory of the relationship between language and thought.","m":3,"ms":[{"h":"","b":["Thought comes before language (1); language develops as a result of cognitive development – children can only use words for concepts they already understand (1); e.g. a child must understand object permanence before using words for things that are not present / pre-operational children's egocentric speech reflects egocentric thought (1)."]}]}]},{"id":"v15-11","stim":[],"parts":[{"no":"","q":"Describe the Sapir-Whorf hypothesis.","m":3,"ms":[{"h":"","b":["Language comes before thought and shapes it (1); strong version – language determines thought (1); weak version – language influences thought / perception; e.g. Hopi and time (1)."]}]}]},{"id":"v15-12","stim":[],"parts":[{"no":"","q":"Describe Darwin's evolutionary theory of facial expressions.","m":3,"ms":[{"h":"","b":["Facial expressions are innate and universal (1); they evolved because they helped survival, e.g. showing teeth when angry warned others (1); the same expressions are seen in all cultures, babies and blind people (1)."]}]}]},{"id":"v15-13","stim":[],"parts":[{"no":"","q":"Describe the cognitive explanation of depression.","m":3,"ms":[{"h":"","b":["Depression is caused by negative, irrational thinking (1); a negative self-schema, often from childhood experiences, is used to interpret new information (1); Beck's negative triad – negative views about the self, the world and the future (1)."]}]}]}]},{"n":16,"title":"Evaluating theories","icon":"🏛️","tag":"TDEE paragraphs, picked with SPACER.","steps":[["Term","Name the evaluation point: 'One strength of the theory is research support.'"],["Define","Say what that term means: 'This means that…'"],["Evidence","Give the study or example: 'For example…'"],["Explain","Why does it make the theory stronger or weaker? 'This is a strength because…'"],["Pick points with SPACER","Scientific · Practical applications · Alternative theories · Credibility · Ethical issues · Reductionism. S = can we check it? C = when we checked, was it right?"]],"watch":"'It has challenging evidence, this is evidence that challenges it. For example Willingham.' Name the study's finding and explain what it means for the theory.","items":[{"id":"v16-1","stim":[],"parts":[{"no":"","q":"Evaluate the multi-store model of memory.","m":5,"ms":[{"h":"","b":["C – research support: Murdock's serial position curve shows primacy (LTM) and recency (STM), suggesting separate stores.","C – case studies: HM couldn't form new LTMs but had normal STM, supporting separate stores; but KF had STM damage for words but not sounds, so STM may not be one store.","R – reductionist: oversimplifies memory; rehearsal isn't the only way to transfer to LTM (e.g. flashbulb memories).","S – scientific: based on lab experiments with controlled variables, so it can be tested.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-2","stim":[],"parts":[{"no":"","q":"Evaluate Gibson's direct theory of perception.","m":5,"ms":[{"h":"","b":["C – supporting research: Gibson and Walk's visual cliff – babies avoided the deep side, suggesting innate depth perception; counterargument – the babies were 6 months old and may have learned it.","A – can't explain visual illusions – if information is enough, why are we fooled? Gregory's theory explains them better.","P – applications to road safety, e.g. lines across roads that get closer together make drivers think they're speeding up.","R – ignores the role of experience and culture (Hudson).","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-3","stim":[],"parts":[{"no":"","q":"Briefly evaluate Piaget's theory of cognitive development.","m":3,"ms":[{"h":"","b":["e.g. C – later research challenges his ages (Hughes 90%, naughty teddy 62%); S – research bias, he studied his own children; P – applications to education: discovery learning, readiness (Plowden report).","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-4","stim":[],"parts":[{"no":"","q":"Evaluate Dweck's mindset theory.","m":5,"ms":[{"h":"","b":["C – supporting research: e.g. students praised for effort chose harder tasks and performed better (Mueller and Dweck).","P – practical applications: teachers praising effort; growth mindset interventions in schools.","C – some large studies find growth mindset interventions have only a small effect on grades.","R – reductionist: ignores other factors such as ability, home background or teaching quality.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-5","stim":[],"parts":[{"no":"","q":"Outline one strength and one weakness of the theory of learning styles.","m":4,"ms":[{"h":"","b":["Strength (2): e.g. makes lessons varied; encourages teachers to think about how students learn.","Weakness (2): research challenges it – students don't learn better when taught in their preferred style (Willingham), so it lacks credibility; questionnaires used to identify styles may not be valid.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-6","stim":[],"parts":[{"no":"","q":"Evaluate Milgram's agency theory of obedience.","m":5,"ms":[{"h":"","b":["C – supporting research: in Milgram's study many said 'I was only following orders', and obedience fell when the authority figure left the room.","P – helps explain real-life events (e.g. the Holocaust, soldiers following orders).","A – the authoritarian personality explains individual differences (35% disobeyed) – agency theory doesn't.","C – not everyone shifts into the agentic state, so it's an incomplete explanation.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-7","stim":[],"parts":[{"no":"","q":"Evaluate Adorno's authoritarian personality theory.","m":4,"ms":[{"h":"","b":["e.g. C – some research found highly obedient people scored higher on the F-scale; S – the F-scale questionnaire may suffer from social desirability bias / response bias; A – situational explanations (agency theory) explain obedience better – whole populations obeyed in Nazi Germany; R – ignores the situation.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-8","stim":[],"parts":[{"no":"","q":"Evaluate the James-Lange theory of emotion.","m":5,"ms":[{"h":"","b":["C – supporting research: people with spinal injuries who feel less arousal report less intense emotions.","A – Cannon-Bard: emotions can happen at the same time as arousal; the same arousal occurs in different emotions, so arousal alone can't tell us which emotion we feel.","C – challenging evidence: adrenaline injections don't cause a specific emotion on their own.","P – applications, e.g. breathing techniques to reduce arousal and so reduce anxiety.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-9","stim":[],"parts":[{"no":"","q":"Evaluate Hebb's theory of learning and neuronal growth.","m":4,"ms":[{"h":"","b":["S – scientific: supported by brain scans showing practice changes the brain (Maguire's taxi drivers).","P – applications to education: practice and retrieval strengthen pathways.","R – reductionist: explains learning only in terms of neurons, ignoring motivation and the environment.","C – hard to observe cell assemblies directly in humans.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-10","stim":[],"parts":[{"no":"","q":"Evaluate the Sapir-Whorf hypothesis.","m":5,"ms":[{"h":"","b":["C – challenging evidence: claims about Inuit words for snow were exaggerated; Rosch found the Dani, with only two colour words, could still recognise colours.","C – some support for the weak version, e.g. people with more colour words distinguish shades faster.","A – Piaget's theory says thought comes before language.","S – hard to test: translation problems and culture make it difficult to separate language from thought.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-11","stim":[],"parts":[{"no":"","q":"Evaluate Darwin's evolutionary theory of expressions.","m":4,"ms":[{"h":"","b":["e.g. C – support from cross-cultural research (Ekman) – basic expressions recognised everywhere; babies born blind still smile; C – challenge from Yuki – cultural differences in reading faces suggest learning; R – ignores cultural display rules.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-12","stim":[],"parts":[{"no":"","q":"Evaluate the biological explanation of depression.","m":5,"ms":[{"h":"","b":["C – supporting research: twin studies show higher MZ than DZ concordance; antidepressants that raise serotonin reduce symptoms.","R – reductionist: doesn't explain why some people with low serotonin aren't depressed; ignores thoughts and life events.","A – the cognitive explanation (negative triad) explains the role of thinking.","P – led to drug treatments that help many people.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]},{"id":"v16-13","stim":[],"parts":[{"no":"","q":"Evaluate the cognitive explanation of depression.","m":4,"ms":[{"h":"","b":["e.g. P – led to CBT, which is effective (Wiles); C – research shows depressed people have more negative thoughts, but it's correlational – depression could cause the negative thinking; A – biological explanation (serotonin); R – ignores genes and brain chemistry.","Each point needs developing (TDEE): Term, Define, Evidence, Explain. Pick points with SPACER."]}]}]}]},{"n":17,"title":"Outline the difference","icon":"↔️","tag":"The difference formula: A is… WHEREAS B is…","steps":[["One aspect","Pick ONE thing to compare: innate or learned? natural or artificial setting? who collected the data?"],["A is…","Say what A is like for that aspect."],["…whereas B is…","Say what B is like for the SAME aspect, in the same sentence."],["More marks?","Another difference, or an example: 'A further difference is…' 'For example…'"]],"watch":"'Gibson's theory is about affordances. Gregory used visual illusions.' Two facts, but no difference is stated. Compare the same aspect.","items":[{"id":"v17-1","stim":[],"parts":[{"no":"","q":"Explain one difference between a laboratory experiment and a natural experiment.","m":3,"ms":[{"h":"","b":["e.g. in a lab experiment the researcher manipulates the IV, whereas in a natural experiment the IV occurs naturally and the researcher just measures the effect.","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-2","stim":[],"parts":[{"no":"","q":"Explain one difference between primary data and secondary data.","m":2,"ms":[{"h":"","b":["Primary data is collected first-hand by the researcher for their own study (1), whereas secondary data has already been collected by someone else, e.g. government statistics (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-3","stim":[],"parts":[{"no":"","q":"Outline the difference between qualitative and quantitative data. Give an example of each.","m":4,"ms":[{"h":"","b":["Qualitative data is descriptive, in words (1), whereas quantitative data is numerical (1); examples: interview answers about feelings (1); number of words recalled (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-4","stim":[],"parts":[{"no":"","q":"Explain one difference between an independent groups design and a repeated measures design.","m":2,"ms":[{"h":"","b":["In independent groups, different participants do each condition (1), whereas in repeated measures the same participants do all conditions (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-5","stim":[],"parts":[{"no":"","q":"Outline two differences between episodic memory and semantic memory.","m":4,"ms":[{"h":"","b":["2 marks each, e.g. episodic memories are personal experiences, whereas semantic memories are facts and knowledge; episodic memories are linked to a time and place, whereas semantic memories are not; episodic memories involve the front of the brain, whereas semantic involve the back (Tulving).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-6","stim":[],"parts":[{"no":"","q":"Explain one difference between procedural memory and episodic memory.","m":2,"ms":[{"h":"","b":["Procedural memory is knowing how to do things, e.g. riding a bike, and is recalled without conscious effort (1), whereas episodic memory is consciously remembering personal events, e.g. your last birthday (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-7","stim":[],"parts":[{"no":"","q":"Explain one difference between sensation and perception.","m":2,"ms":[{"h":"","b":["Sensation is detecting information from the environment with the sense organs (1), whereas perception is the brain interpreting and making sense of that information (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-8","stim":[],"parts":[{"no":"","q":"Explain one difference between monocular and binocular depth cues. Give an example of each.","m":4,"ms":[{"h":"","b":["Monocular cues need only one eye (1), whereas binocular cues need both eyes working together (1); e.g. monocular: height in plane / relative size / occlusion / linear perspective (1); binocular: retinal disparity / convergence (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-9","stim":[],"parts":[{"no":"","q":"Outline the difference between the strong and weak versions of the Sapir-Whorf hypothesis.","m":2,"ms":[{"h":"","b":["The strong version says language determines thought, so without a word you can't think about the concept (1), whereas the weak version says language only influences thought (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-10","stim":[],"parts":[{"no":"","q":"Explain one difference between the sympathetic and parasympathetic nervous systems.","m":2,"ms":[{"h":"","b":["The sympathetic branch activates the fight or flight response, e.g. increasing heart rate (1), whereas the parasympathetic branch returns the body to its resting state, e.g. slowing heart rate (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-11","stim":[],"parts":[{"no":"","q":"Explain one difference between Piaget's view of language and thought and the Sapir-Whorf hypothesis.","m":2,"ms":[{"h":"","b":["Piaget says thought comes before language (1), whereas Sapir-Whorf says language comes before thought and shapes it (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-12","stim":[],"parts":[{"no":"","q":"Explain one difference between conformity and obedience.","m":2,"ms":[{"h":"","b":["Conformity is changing behaviour to fit in with a group of equals, with no direct order (1), whereas obedience is following a direct order from an authority figure (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]},{"id":"v17-13","stim":[],"parts":[{"no":"","q":"Explain one difference between the central nervous system and the peripheral nervous system.","m":2,"ms":[{"h":"","b":["The CNS is the brain and spinal cord, which process information (1), whereas the PNS is all the nerves outside it, which carry messages to and from the CNS (1).","The difference must be explicitly stated ('whereas') – two separate descriptions with no comparison: max 1."]}]}]}]},{"n":18,"title":"Treatments: depression and addiction","icon":"💊","tag":"How it works, applied to the person, then evaluated.","steps":[["How it works","Describe the treatment: what happens, and the theory behind it (AO1)."],["Apply it","Use the person in the stem: what would happen to Jade or Sam? (AO2)"],["Evaluate","Effectiveness (e.g. Wiles), side effects, effort needed, cost, reductionist or holistic? (AO3)"]],"watch":"Aversion therapy = classical conditioning. CBT = challenging faulty thoughts. Antidepressants = brain chemistry (serotonin). Know which is which.","items":[{"id":"v18-1","stim":[{"p":"Amira: 'My GP wants me to take antidepressants for my depression. I'm worried about side effects, but I'm too exhausted to go to lots of therapy sessions.'"}],"parts":[{"no":"","q":"Describe and evaluate antidepressants as a treatment for depression. Refer to Amira in your answer.","m":6,"ms":[{"h":"","b":["AO1 (2): SSRIs block the reuptake of serotonin, so more stays in the synapse, improving mood.","AO2 (2): Amira is exhausted – tablets need little effort or time compared with therapy; but she is worried about side effects (e.g. nausea, headaches).","AO3 (2): e.g. effective for many people and quick to prescribe; side effects; may treat symptoms not causes – relapse when stopped; reductionist (ignores thoughts and life events).","Levels: 5–6 detailed, applied and evaluated; 3–4 reasonable; 1–2 limited."]}]}]},{"id":"v18-2","stim":[{"p":"Kai drinks heavily every night and wants to stop."}],"parts":[{"no":"a","q":"Explain how aversion therapy could be used to help Kai.","m":3,"ms":[{"h":"","b":["Based on classical conditioning – the unwanted behaviour is paired with something unpleasant (1); Kai could take an emetic drug such as Antabuse that makes him vomit if he drinks alcohol (1); over time he associates alcohol with feeling sick, so he avoids it (1)."]}]},{"no":"b","q":"Give one weakness of aversion therapy.","m":2,"ms":[{"h":"","b":["e.g. it can be unpleasant and distressing, raising ethical issues (1), so many people drop out (1); or it doesn't treat the underlying cause, so relapse is likely."]}]}]},{"id":"v18-3","stim":[{"p":"Dan has been addicted to smoking for 15 years. He wants to quit but doesn't want medication."}],"parts":[{"no":"a","q":"Describe how a self-management programme could help Dan.","m":3,"ms":[{"h":"","b":["e.g. self-help groups such as a 12-step programme or quit-smoking groups (1); social support from others with the same problem (1); self-help books/apps, setting goals and tracking progress (1)."]}]},{"no":"b","q":"Explain one strength of self-management programmes compared with aversion therapy.","m":2,"ms":[{"h":"","b":["They are holistic – they deal with social and environmental factors such as stress and friends (1), whereas aversion therapy only targets the link between smoking and pleasure (1); or no unpleasant side effects."]}]}]},{"id":"v18-4","stim":[{"p":"Ella has depression. She says: 'I keep thinking everything I do is a failure. I'd like to understand why I feel like this.'"}],"parts":[{"no":"","q":"Describe how CBT could be used to help Ella.","m":4,"ms":[{"h":"","b":["AO1 (2): talking therapy; challenges irrational, negative thoughts; disputing ('Where is the evidence?'); thought diaries; homework between sessions.","AO2 (2): the therapist would challenge Ella's thought that 'everything is a failure' by asking for evidence; she could keep a diary of these thoughts and write rational responses; it would help her understand her thinking."]}]}]},{"id":"v18-5","stim":[{"p":"A psychologist compares two treatments for depression: antidepressants and CBT."}],"parts":[{"no":"a","q":"Explain one strength of CBT compared with antidepressants.","m":2,"ms":[{"h":"","b":["CBT has no physical side effects (1); or it treats the cause (thinking) rather than just symptoms, so it may prevent relapse (1)."]}]},{"no":"b","q":"Explain one weakness of CBT.","m":2,"ms":[{"h":"","b":["It requires effort and motivation – people with severe depression may struggle to engage (1), so it may not work for them; or it takes time and is expensive (1)."]}]}]},{"id":"v18-6","stim":[{"p":"Riya is addicted to gambling. Her counsellor suggests she joins Gamblers Anonymous."}],"parts":[{"no":"","q":"Explain how this 12-step programme could help Riya, and evaluate it.","m":6,"ms":[{"h":"","b":["AO1 (2): a self-management programme; meetings with others who have the same addiction; social support; working through 12 steps, with a sponsor.","AO2 (2): Riya would share her experiences and get support from people who understand; a sponsor could help her resist the urge to gamble.","AO3 (2): e.g. holistic and free; deals with social factors; but relies on motivation – high drop-out; hard to measure success as members are anonymous.","Levels: 5–6 detailed, applied and evaluated; 3–4 reasonable; 1–2 limited."]}]}]},{"id":"v18-7","stim":[{"p":"Joe is addicted to cigarettes. A doctor offers him electrical aversion therapy."}],"parts":[{"no":"","q":"Describe electrical aversion therapy and explain one ethical issue with it.","m":4,"ms":[{"h":"","b":["Description (2): a mild, safe electric shock is given whenever Joe smokes or thinks about smoking, so smoking becomes associated with pain (classical conditioning).","Ethical issue (2): it is deliberately painful and distressing (protection from harm), so Joe must give fully informed consent and be able to stop at any time."]}]}]},{"id":"v18-8","stim":[{"p":"Ben has depression and has been taking antidepressants for a year, but his symptoms have not improved."}],"parts":[{"no":"","q":"Use Wiles et al.'s research to explain what Ben's doctor might suggest. Explain why.","m":4,"ms":[{"h":"","b":["AO1 (2): Wiles found people with treatment-resistant depression who had CBT as well as antidepressants were more likely to improve than those on antidepressants alone (about 46% vs 22%).","AO2 (2): Ben hasn't improved on antidepressants, so his depression is treatment-resistant; the doctor might add CBT to his antidepressants, rather than stopping them."]}]}]},{"id":"v18-9","stim":[{"p":"Lucy wants to know which treatments for addiction are reductionist and which are holistic."}],"parts":[{"no":"a","q":"Explain why aversion therapy is reductionist.","m":2,"ms":[{"h":"","b":["It reduces addiction to a simple learned link between the behaviour and pleasure (1), and ignores social, emotional and genetic factors, e.g. stress or friends (1)."]}]},{"no":"b","q":"Explain why self-management programmes are more holistic.","m":2,"ms":[{"h":"","b":["They consider the whole person (1), e.g. past trauma, relationships, social support and lifestyle, not just the behaviour (1)."]}]}]},{"id":"v18-10","stim":[{"p":"Sophie has been diagnosed with depression using the ICD."}],"parts":[{"no":"a","q":"Name two symptoms the doctor would look for when diagnosing depression.","m":2,"ms":[{"h":"","b":["Any two (1 each): low mood; loss of interest or pleasure; reduced energy / tiredness; changes in sleep or appetite; low self-esteem; difficulty concentrating; thoughts of self-harm."]}]},{"no":"b","q":"Explain why the doctor would also consider how long the symptoms have lasted.","m":2,"ms":[{"h":"","b":["The ICD requires symptoms for at least two weeks (1), to distinguish depression from normal short-term sadness (1)."]}]}]},{"id":"v18-11","stim":[{"p":"Max is trying to give up alcohol. He takes a drug called Antabuse."}],"parts":[{"no":"","q":"Explain how Antabuse works using classical conditioning.","m":3,"ms":[{"h":"","b":["Antabuse makes you feel very sick if you drink alcohol (1); alcohol (neutral/conditioned stimulus) is paired with sickness (unconditioned response) (1); Max learns to associate alcohol with feeling sick, so he no longer wants to drink (conditioned response) (1)."]}]}]},{"id":"v18-12","stim":[{"p":"A researcher wants to compare how well CBT and antidepressants work for teenagers with depression."}],"parts":[{"no":"","q":"Explain one ethical issue the researcher would need to consider and how to deal with it.","m":2,"ms":[{"h":"","b":["1 mark: e.g. teenagers are vulnerable / under 16 – consent; protection from harm (one group gets a less effective treatment). 1 mark: parental consent; monitor everyone and offer the more effective treatment afterwards; right to withdraw."]}]}]}]},{"n":19,"title":"Synoptic and 9-mark questions","icon":"🧩","tag":"Describe for 4 (AMRC), evaluate for 5 (three TDEE paragraphs).","steps":[["AO1: describe (4)","Aim, method, results, conclusion. Or four key points of a theory."],["AO3: evaluate (5)","At least three developed paragraphs: Term, Define, Evidence, Explain."],["Evaluate the method","If it says 'evaluate the research method', evaluate the METHOD (e.g. lab experiment), linked to the study every time."],["Synoptic","Type A = a topic plus research methods. Type B = two topics: say HOW one supports or challenges the other."]],"watch":"Without the describe + three TDEE structure, students are unlikely to get more than 6/9.","items":[{"id":"v19-1","stim":[],"parts":[{"no":"","q":"Describe Murdock's serial position curve study. Evaluate the research method used in this study.","m":9,"ms":[{"h":"","b":["AO1 (4): aim – separate STM and LTM; lab experiment, psychology students heard lists of 10–40 words         <div class="sk-ms">${EXT_LEVELS.map(([,l,d])=>`<p style="margin:4px 0"><b>${l}:</b> ${esc(d)}</p>`).join("")}</div>${markBtns(q.key,9)}`}</div>`;

function mockScore(){
  const cur=mockCur(), built=mkp.built, res={score:0, of:0, secs:{}, ao:{AO1:[0,0],AO2:[0,0],AO3:[0,0]}};
  cur.secs.forEach(i=>{ const S=built[i]; let got=0;
    S.qs.forEach(q=>{ let g=0;
      if(q.type==="mcq") g = cur.ans[q.key]===q.correct ? 1 : 0;
      else if(q.type==="item") g = q.it.parts.reduce((a,p)=>a+(cur.marks[q.key+"|"+p.no]||0),0);
      else g = cur.marks[q.key]||0;
      got+=g; Object.entries(q.ao).forEach(([ao,f])=>{ res.ao[ao][0]+=g*f; res.ao[ao][1]+=q.m*f; });
    });
    res.secs[S.topic]=[got,S.of]; res.score+=got; res.of+=S.of; });
  return res;
}

function pmPickTopics(){ const W=weakData().filter(w=>w.t.key!=="Exam skills"); const started=W.filter(w=>w.seen).sort((a,b)=>a.strength-b.strength); return (started.length?started:W).slice(0,3).map(w=>w.t.key); }
function pmBuild(){
  const topics=pm.topics, prio=d=>status(d.id)==="l"?0:G.mistakes[d.id]!==undefined?0:isDue(d.id)?1:status(d.id)===""?2:3;
  let qs=[];
  if(pm.kind!=="terms") qs=qs.concat(DATA.filter(d=>topics.includes(d.t) && d.id<5000 && d.a.length<=160).map(d=>({id:d.id, t:d.t, q:d.q, a:d.a, kind:"q"})));
  if(pm.kind!=="qs") qs=qs.concat(TERMS.filter(x=>topics.includes(x.t)).map(x=>({id:x.id, t:x.t, q:`What is the key term for this? “${x.def}”`, a:x.term, kind:"term"})));

  $("#pmAgain").onclick=()=>{ pmBuild(); pm.i=0; pm.res=[]; pm.shown=false; pm.claimed=false; pm.phase="run"; renderParent(); };
  $("#pmBack").onclick=()=>{ pm.phase="setup"; pm.claimed=false; renderParent(); };
}
function pmRate(r, el){
  const d=pm.items[pm.i]; pm.res.push({d, r});
  const ok=r==="k";
  if(BY_ID[d.id]){ if(ok) mark(d.id,"k"); else if(status(d.id)!=="k" || r==="l") mark(d.id,"l"); trackMistake(d.id, ok); }
  answer({ok, el, mode:"cards", topic:d.t});
  pm.i++; pm.shown=false;
  if(pm.i>=pm.items.length){ pm.phase="done"; pm.claimed=false; }
  renderParent();
}

const CERT_LEVELS = [5,10,20,30,40,50,60,70,80];
function certList(){

  l.push({id:"dungeon", open:!!G.badges.bossall, title:"Dungeon cleared: every boss defeated", need:"Defeat all 9 bosses"});
  G.certs=G.certs||{}; l.forEach(c=>{ if(c.open && !G.certs[c.id]) G.certs[c.id]=today(); c.date=G.certs[c.id]; });

}
function certBoxHTML(){

function openCert(id){

  const o=document.createElement("div"); o.className="overlay cert-overlay";
  const draw=()=>`<div class="cert-tools"><label>Name on certificate <input id="certName" class="search" maxlength="24" value="${esc(G.name||"")}" placeholder="Type your name"></label><button class="btn" id="certPrint">🖨️ Print / save as PDF</button><button class="btn ghost" id="certClose">Close</button></div>

    </div></div>`;
  o.innerHTML=draw(); document.body.appendChild(o);

/* ================= DOUBLE XP EVENTS — edit dates here =================
   from/to: "MM-DD" repeats every year, "YYYY-MM-DD" is a one-off.
   mult = XP multiplier · scope:"boss" = boss battles only · topics = only these topics · gold = golden cards × as common.
   If two events overlap, the bigger multiplier wins (they don't stack). */
const EVENTS = [
  {id:"firstwknd", rule:"firstWeekend", mult:2,   banner:"⚡ Double XP weekend: everything earns 2× XP"},
  {id:"halloween", from:"10-25", to:"10-31", mult:2, scope:"boss", banner:"🎃 Halloween Boss Rush: 2× XP in boss battles"},
  {id:"advent",    from:"12-01", to:"12-24", gold:2, banner:"🎄 Advent: golden cards are twice as common"},
  {id:"mock",      from:"2026-11-20", to:"2026-12-11", mult:1.5, topics:MOCK_TOPICS, banner:"🎯 Mock countdown: 1.5× XP on mock topics"},
  {id:"newyear",   from:"01-01", to:"01-07", mult:1.5, banner:"🎆 New Year resolution week: 1.5× XP on everything"},
  {id:"final",     from:"2027-04-10", to:"2027-05-09", mult:1.5, banner:"🏁 Final countdown to Paper 1: 1.5× XP on everything"},
];
function eventActive(e, d=new Date()){
  if(e.rule==="firstWeekend"){ const day=d.getDay(), dt=d.getDate(); return (day===6 && dt<=7) || (day===0 && dt>=2 && dt<=8); }
  const s=ymd(d), md=s.slice(5);
  if(e.from.length===5) return e.from<=e.to ? (md>=e.from && md<=e.to) : (md>=e.from || md<=e.to);
  return s>=e.from && s<=e.to;
}
const activeEvents = (d) => EVENTS.filter(e=>eventActive(e,d));
function eventMult(topic, boss){ let m=1; activeEvents().forEach(e=>{ if(!e.mult) return; if(e.scope==="boss" && !boss) return; if(e.topics && !e.topics.includes(topic)) return; m=Math.max(m,e.mult); }); return m; }
function goldMult(){ return Math.max(1, ...activeEvents().map(e=>e.gold||1)); }
function eventUntil(e){ if(e.rule==="firstWeekend") return "until Sunday night"; const y=new Date().getFullYear(); const to=e.to.length===5?`${y}-${e.to}`:e.to; return "until "+niceDate(to); }
function renderEvents(){ const el=$("#evbar"); if(!el) return; const a=activeEvents(); el.hidden=!a.length;
  el.innerHTML=a.map(e=>`<span class="ev">${esc(e.banner)} <small>${eventUntil(e)}</small></span>`).join(""); }
