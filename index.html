l area?","a":"In the occipital lobe","t":"Brain & neuropsychology","id":811},{"q":"Where is the auditory area?","a":"In the temporal lobe","t":"Brain & neuropsychology","id":812},{"q":"Where is Broca's area?","a":"In the left frontal lobe","t":"Brain & neuropsychology","id":813},{"q":"What is Broca's area responsible for?","a":"Speech production","t":"Brain & neuropsychology","id":814},{"q":"What is Wernicke's area responsible for?","a":"Understanding language (comprehension)","t":"Brain & neuropsychology","id":815},{"q":"Where is Wernicke's area?","a":"In the left temporal lobe","t":"Brain & neuropsychology","id":816},{"q":"Who was 'Tan'?","a":"Broca's patient, who could only say the word 'tan'; after he died, Broca found damage to the left frontal lobe","t":"Brain & neuropsychology","id":817},{"q":"What does aphasia mean?","a":"Difficulty with language – producing or understanding speech – caused by brain damage","t":"Brain & neuropsychology","id":818},{"q":"What is Broca's aphasia?","a":"Difficulty producing speech – slow and effortful, but understanding is fine","t":"Brain & neuropsychology","id":819},{"q":"What is Wernicke's aphasia?","a":"Fluent speech that makes little sense, and difficulty understanding language","t":"Brain & neuropsychology","id":820},{"q":"What does the frontal lobe do?","a":"Controls behaviour, emotions, planning and decision-making","t":"Brain & neuropsychology","id":821},{"q":"What is the interpretive cortex?","a":"An area of the brain where memories, or our interpretations of them, are stored","t":"Brain & neuropsychology","id":822},{"q":"In which lobe is the interpretive cortex found?","a":"The temporal lobe","t":"Brain & neuropsychology","id":823},{"q":"What was the method of Penfield's study of the interpretive cortex?","a":"During brain surgery on awake patients, Penfield stimulated areas of the brain with a mild electrical current and recorded what they reported","t":"Brain & neuropsychology","id":824},{"q":"How many people were in Penfield's sample and what condition did they have?","a":"Over 1,000 patients, all with epilepsy","t":"Brain & neuropsychology","id":825},{"q":"Why did patients have to be awake during Penfield's procedure?","a":"So they could report what they experienced when each area was stimulated","t":"Brain & neuropsychology","id":826},{"q":"What did Penfield find?","a":"Stimulating the temporal lobe caused some patients to relive vivid memories, sounds or feelings","t":"Brain & neuropsychology","id":827},{"q":"In how many patients did Penfield find interpretive cortex responses?","a":"About 8%","t":"Brain & neuropsychology","id":828},{"q":"What did Penfield's study show evidence for?","a":"Localisation of function – the interpretive cortex in the temporal lobe stores memories and interpretations","t":"Brain & neuropsychology","id":829},{"q":"Were Penfield's results qualitative or quantitative?","a":"Qualitative – patients' descriptions of their experiences","t":"Brain & neuropsychology","id":830},{"q":"Penfield's stimulation isn't how the brain is really stimulated. What validity does it lack?","a":"Ecological validity (mundane realism)","t":"Brain & neuropsychology","id":831},{"q":"Why does Penfield's study lack generalisability?","a":"All participants had epilepsy, so their brains may not be typical","t":"Brain & neuropsychology","id":832},{"q":"Give a strength of Penfield's research.","a":"It led to the Montreal Procedure, which is still used to treat epilepsy","t":"Brain & neuropsychology","id":833},{"q":"What is cognitive psychology?","a":"The study of mental processes like memory and perception","t":"Brain & neuropsychology","id":834},{"q":"What is neuroscience?","a":"The study of the structure and function of the brain and nervous system","t":"Brain & neuropsychology","id":835},{"q":"What is cognitive neuroscience?","a":"The study of how mental processes and brain structures work together","t":"Brain & neuropsychology","id":836},{"q":"Give an example of cognitive neuroscience being used.","a":"Linking depression to low serotonin, or the amygdala to aggression","t":"Brain & neuropsychology","id":837},{"q":"What is a stroke?","a":"A sudden interruption to the blood supply to part of the brain, from a blockage or bleeding","t":"Brain & neuropsychology","id":838},{"q":"What might happen if a stroke affects Broca's area?","a":"Difficulty producing speech","t":"Brain & neuropsychology","id":839},{"q":"What is neurological damage?","a":"Damage to the nervous system that affects how the brain and nerves work","t":"Brain & neuropsychology","id":840},{"q":"What might happen after damage to the left motor area?","a":"Problems moving the right side of the body","t":"Brain & neuropsychology","id":841},{"q":"Name three types of brain scan.","a":"CT (CAT) scan, PET scan, fMRI scan","t":"Brain & neuropsychology","id":842},{"q":"How does a CT scan work?","a":"X-rays are taken from many angles and combined to make detailed images ('slices') of the brain","t":"Brain & neuropsychology","id":843},{"q":"Does a CT (CAT) scan show structure, function or both?","a":"Structure only","t":"Brain & neuropsychology","id":844},{"q":"How does a PET scan work?","a":"A radioactive substance (tracer) is injected and absorbed by the most active areas of the brain","t":"Brain & neuropsychology","id":845},{"q":"What is being measured in a PET scan?","a":"Metabolic activity – which areas of the brain are most active","t":"Brain & neuropsychology","id":846},{"q":"If there is high activity on a PET scan, what colour does it show?","a":"Red (yellow = moderate, blue = inactive)","t":"Brain & neuropsychology","id":847},{"q":"PET scans involve radiation. Why is this a problem?","a":"It can be harmful, so people can only have a limited number of scans","t":"Brain & neuropsychology","id":848},{"q":"How does an fMRI scan work?","a":"It uses a magnet and radio waves to detect changes in blood oxygen levels in active brain areas","t":"Brain & neuropsychology","id":849},{"q":"Which scan measures the haemodynamic response?","a":"fMRI","t":"Brain & neuropsychology","id":850},{"q":"What does BOLD stand for in fMRI?","a":"Blood Oxygen Levels Detected","t":"Brain & neuropsychology","id":851},{"q":"On an fMRI scan, what do high levels of oxygen indicate?","a":"That area of the brain is active","t":"Brain & neuropsychology","id":852},{"q":"How long is the delay between brain activity and the fMRI image?","a":"A few seconds","t":"Brain & neuropsychology","id":853},{"q":"Give a strength of fMRI scans.","a":"No radiation, so they are safe; they show brain activity in detail","t":"Brain & neuropsychology","id":854},{"q":"Give a weakness of brain scans.","a":"They are expensive, and they show correlations between activity and behaviour, not causes","t":"Brain & neuropsychology","id":855},{"q":"What was Tulving's study called?","a":"The 'gold' memory study (1989)","t":"Brain & neuropsychology","id":856},{"q":"What kind of scan did Tulving use?","a":"A PET scan (using radioactive gold)","t":"Brain & neuropsychology","id":857},{"q":"How big was the sample in Tulving's study?","a":"6 participants (including Tulving himself and his wife)","t":"Brain & neuropsychology","id":858},{"q":"What was the aim of Tulving's study?","a":"To see whether episodic and semantic memories are stored in different parts of the brain","t":"Brain & neuropsychology","id":859},{"q":"How many trials did each participant do in Tulving's study?","a":"8 (4 episodic, 4 semantic)","t":"Brain & neuropsychology","id":860},{"q":"What was the IV in Tulving's study?","a":"Whether participants thought about an episodic or a semantic memory","t":"Brain & neuropsychology","id":861},{"q":"What was the dependent variable in Tulving's study?","a":"Blood flow (brain activity) in different areas of the cortex","t":"Brain & neuropsychology","id":862},{"q":"Which memories were located at the front of the brain?","a":"Episodic memories (frontal cortex)","t":"Brain & neuropsychology","id":863},{"q":"Which memories were found to be located in the posterior cortex?","a":"Semantic memories","t":"Brain & neuropsychology","id":864},{"q":"What did Tulving conclude?","a":"Episodic and semantic memories are stored in different areas of the brain","t":"Brain & neuropsychology","id":865},{"q":"Give a weakness of Tulving's study.","a":"Tiny sample of 6, including himself and his wife, so it can't be generalised and may be biased","t":"Brain & neuropsychology","id":866},{"q":"Give a strength of Tulving's study.","a":"It used objective, scientific measurement (PET scans)","t":"Brain & neuropsychology","id":867},{"q":"What are the named studies for Brain and neuropsychology?","a":"Penfield (interpretive cortex), Tulving (gold memory study)","t":"Brain & neuropsychology","id":868},{"q":"What are mental health problems?","a":"Problems in the way people think, feel or behave that make them less able to cope with everyday life","t":"Psychological problems","id":869},{"q":"What is mental health?","a":"A person's emotional and psychological wellbeing, which lets them cope and function in everyday life","t":"Psychological problems","id":870},{"q":"Identify one characteristic of good mental health.","a":"High self-esteem, coping with stress, independence, accurate view of reality, reaching your potential","t":"Psychological problems","id":871},{"q":"Identify one characteristic of poor mental health.","a":"Low mood, excessive worry, being unable to cope with daily life, isolation","t":"Psychological problems","id":872},{"q":"Identify one serious mental health illness.","a":"Schizophrenia, bipolar disorder, or severe depression","t":"Psychological problems","id":873},{"q":"Who proposed a classification of ideal mental health?","a":"Jahoda","t":"Psychological problems","id":874},{"q":"What are Jahoda's six characteristics of ideal mental health?","a":"Positive self-attitudes, Personal growth (self-actualisation), Integration (coping with stress), Autonomy, Accurate perception of reality, Mastery of the environment","t":"Psychological problems","id":875},{"q":"What is autonomy?","a":"Being independent and self-regulating","t":"Psychological problems","id":876},{"q":"What is self-actualisation?","a":"Reaching your full potential","t":"Psychological problems","id":877},{"q":"Why is Jahoda's classification useful?","a":"It focuses on positive mental health rather than just listing symptoms","t":"Psychological problems","id":878},{"q":"Give a weakness of Jahoda's classification.","a":"Few people meet all the criteria, and the criteria are based on Western ideas, so it is culturally biased","t":"Psychological problems","id":879},{"q":"About how many adults in England experience a common mental health problem?","a":"About 1 in 6","t":"Psychological problems","id":880},{"q":"Identify one reason the number of mental health problems is rising in the UK.","a":"Less stigma so more people seek help, better diagnosis, modern living (stress, isolation, social media)","t":"Psychological problems","id":881},{"q":"How has the percentage of adults accessing mental health treatment changed?","a":"It rose from 24% in 2007 to 37% in 2014","t":"Psychological problems","id":882},{"q":"Which groups have higher rates of mental health problems according to MIND?","a":"People in lower income households, people living in cities, older people","t":"Psychological problems","id":883},{"q":"What is modern living?","a":"Life in a time of advanced science and technology, which may increase stress and isolation","t":"Psychological problems","id":884},{"q":"Define stigma.","a":"A mark of disapproval or disgrace attached to something, such as having a mental illness","t":"Psychological problems","id":885},{"q":"How do cultures differ in their views of mental health?","a":"E.g. hearing voices is seen as a symptom of illness in the West but may be seen as spiritual in some other cultures","t":"Psychological problems","id":886},{"q":"What is an individualistic culture?","a":"A culture that focuses on the individual's needs and independence, e.g. the UK","t":"Psychological problems","id":887},{"q":"Are more cases of poor mental health reported in collectivist or individualistic cultures?","a":"Individualistic cultures","t":"Psychological problems","id":888},{"q":"Identify one individual effect of poor mental health.","a":"Damaged relationships, Difficulty coping with daily life, Negative impact on physical health","t":"Psychological problems","id":889},{"q":"Identify one social effect of poor mental health.","a":"More need for social care, Possible link to crime, Cost to the economy","t":"Psychological problems","id":890},{"q":"What is the relationship between poor mental health and physical health?","a":"Stress and anxiety release cortisol, which weakens the immune system, so people get ill more easily","t":"Psychological problems","id":891},{"q":"What is social care?","a":"Personal care, protection or support services for adults and children in need","t":"Psychological problems","id":892},{"q":"How much did the McCrone report suggest the UK spends each year on mental health?","a":"About £22 billion","t":"Psychological problems","id":893},{"q":"What did Walsh et al. (2002) find?","a":"People with serious mental illness were about 4 times more likely to be violent","t":"Psychological problems","id":894},{"q":"Why can't we assume mental illness causes crime?","a":"Other factors such as substance abuse or poverty may explain the link, and only about 1 in 20 violent crimes are committed by people with mental illness","t":"Psychological problems","id":895},{"q":"What is isolation?","a":"Being lonely or emotionally, physically or socially separate from others","t":"Psychological problems","id":896},{"q":"What is the difference between sadness and depression?","a":"Sadness is a normal, temporary reaction to an event; depression is continuous and may have no obvious trigger","t":"Psychological problems","id":897},{"q":"What is unipolar depression?","a":"A mood disorder with continuous low mood, loss of interest and reduced energy – mood changes in one direction only","t":"Psychological problems","id":898},{"q":"Define bipolar depression.","a":"A mood disorder with periods of depression and periods of mania (extreme high mood)","t":"Psychological problems","id":899},{"q":"What is mania?","a":"A period of very high mood with lots of energy, excitement, talkativeness, little sleep and risk-taking","t":"Psychological problems","id":900},{"q":"Identify three characteristics of unipolar depression.","a":"Low mood, Reduced energy, Loss of interest and enjoyment, Changes in sleep, Changes in appetite, Feelings of worthlessness","t":"Psychological problems","id":901},{"q":"What are the behavioural, emotional and cognitive characteristics of depression?","a":"Behavioural – reduced activity; Emotional – sadness; Cognitive – focusing on the negative","t":"Psychological problems","id":902},{"q":"Which classification system is used to diagnose depression?","a":"The ICD (International Classification of Diseases), or the DSM","t":"Psychological problems","id":903},{"q":"Who produces the ICD?","a":"The World Health Organization (WHO)","t":"Psychological problems","id":904},{"q":"According to the ICD, how long must symptoms be present for a depression diagnosis?","a":"At least 2 weeks continuously","t":"Psychological problems","id":905},{"q":"Name the symptoms of depression in the ICD-10.","a":"Low mood, Lack of interest and enjoyment, Reduced energy, Reduced concentration, Decreased self-confidence, Guilt or worthlessness, Negative thoughts about the future, Suicidal thoughts, Changes to sleep, Changes to appetite","t":"Psychological problems","id":906},{"q":"What are the levels of depression in the ICD?","a":"Mild, moderate and severe – based on how many symptoms and how severe they are","t":"Psychological problems","id":907},{"q":"Why does a doctor also do a physical examination when diagnosing depression?","a":"Many physical conditions have similar symptoms, so they need to be ruled out","t":"Psychological problems","id":908},{"q":"Which neurotransmitter is linked with depression?","a":"Serotonin","t":"Psychological problems","id":909},{"q":"What is the biological explanation of depression?","a":"Depression is caused by low levels of serotonin in the brain","t":"Psychological problems","id":910},{"q":"What does serotonin do?","a":"Regulates mood, and also affects sleep, appetite and aggression","t":"Psychological problems","id":911},{"q":"What are the two reasons we might have low serotonin?","a":"Genetic (we inherit a poor ability to produce serotonin), Environmental (not enough tryptophan in the diet)","t":"Psychological problems","id":912},{"q":"What is tryptophan?","a":"An amino acid in food that the body needs to make serotonin","t":"Psychological problems","id":913},{"q":"What non-medical methods can increase serotonin levels?","a":"Exercise, a diet rich in tryptophan, sunlight","t":"Psychological problems","id":914},{"q":"What did McNeal and Cimbolic (1986) find?","a":"People with depression had lower levels of serotonin than a control group","t":"Psychological problems","id":915},{"q":"What did Trivedi et al. (2011) find?","a":"Exercise increases serotonin levels, which can improve mood","t":"Psychological problems","id":916},{"q":"Give a weakness of the biological explanation of depression.","a":"It is reductionist – low serotonin could be a result of depression rather than the cause, and it ignores thinking and life events","t":"Psychological problems","id":917},{"q":"What are antidepressants?","a":"Drugs used to prevent and treat depression","t":"Psychological problems","id":918},{"q":"What does SSRI stand for?","a":"Selective serotonin reuptake inhibitor","t":"Psychological problems","id":919},{"q":"What does an SSRI do?","a":"Blocks the reuptake of serotonin into the presynaptic neuron, so more serotonin stays in the synapse","t":"Psychological problems","id":920},{"q":"How do SSRIs reduce depression?","a":"More serotonin stays in the synapse and is passed on, which improves mood, sleep and energy","t":"Psychological problems","id":921},{"q":"In the presynaptic neuron, where are neurotransmitters stored?","a":"In vesicles","t":"Psychological problems","id":922},{"q":"What is a problem with using SSRIs to treat depression?","a":"Side effects – insomnia, weight change, nausea, anxiety, sometimes suicidal thoughts","t":"Psychological problems","id":923},{"q":"Why are some people sceptical that SSRIs work?","a":"Serotonin increases straight away but SSRIs take weeks or months to work, so the effect might be a placebo","t":"Psychological problems","id":924},{"q":"Give a strength of SSRIs.","a":"Cheap, quick and easy to take compared with therapy","t":"Psychological problems","id":925},{"q":"What is the cognitive explanation of depression?","a":"Depression is caused by negative, irrational thinking","t":"Psychological problems","id":926},{"q":"What is Beck's negative triad?","a":"Negative views about the self, the world and the future","t":"Psychological problems","id":927},{"q":"Give an example of the negative triad.","a":"'I'm useless' (self), 'Everyone is against me' (world), 'Things will never get better' (future)","t":"Psychological problems","id":928},{"q":"What is a negative self-schema?","a":"A set of negative beliefs about yourself, which is used to interpret new information","t":"Psychological problems","id":929},{"q":"How might someone develop a negative self-schema?","a":"Through negative experiences in childhood, such as criticism or rejection","t":"Psychological problems","id":930},{"q":"What is the link between negative self-schemas and depression?","a":"People interpret everything negatively, which leads to low mood","t":"Psychological problems","id":931},{"q":"What are attributions?","a":"How people explain the causes of their own and other people's behaviour","t":"Psychological problems","id":932},{"q":"Who proposed negative attributional style?","a":"Seligman","t":"Psychological problems","id":933},{"q":"What is the difference between an internal and an external attribution?","a":"Internal – the cause is within the person (e.g. 'I'm stupid'); external – the cause is outside the person (e.g. 'the test was hard')","t":"Psychological problems","id":934},{"q":"What is the difference between a stable and an unstable attribution?","a":"Stable – the cause will always be there; unstable – the cause is temporary","t":"Psychological problems","id":935},{"q":"What is a global attribution?","a":"Believing the cause applies to all areas of life","t":"Psychological problems","id":936},{"q":"Which attribution combination is most likely to lead to depression, and why?","a":"Internal, stable and global – the person blames themselves, thinks it won't change and that it affects everything","t":"Psychological problems","id":937},{"q":"Give a strength of Beck's cognitive explanation.","a":"It led to an effective treatment (CBT)","t":"Psychological problems","id":938},{"q":"Give a weakness of the cognitive explanation of depression.","a":"It may blame the person, and negative thinking may be a result of depression rather than the cause","t":"Psychological problems","id":939},{"q":"What does CBT stand for?","a":"Cognitive behavioural therapy","t":"Psychological problems","id":940},{"q":"What is the aim of CBT?","a":"To challenge and change irrational thoughts and behaviours to reduce depression","t":"Psychological problems","id":941},{"q":"What is the person having CBT called?","a":"The client","t":"Psychological problems","id":942},{"q":"What is catastrophising?","a":"Thinking one small mistake means everything will go wrong","t":"Psychological problems","id":943},{"q":"What is disputing, and how does it reduce depression?","a":"The therapist challenges irrational thoughts (e.g. 'Where is the evidence?') so the client thinks more rationally","t":"Psychological problems","id":944},{"q":"What is a thought diary?","a":"A record of unpleasant emotions, the negative thoughts behind them, and a rational response","t":"Psychological problems","id":945},{"q":"What is behavioural activation, and how does it reduce depression?","a":"Planning pleasant activities each day, because what we do affects how we feel","t":"Psychological problems","id":946},{"q":"Is CBT a long-term or short-term treatment for depression, and why?","a":"Long-term – clients learn skills they can use again whenever symptoms return","t":"Psychological problems","id":947},{"q":"Why is CBT described as holistic?","a":"It treats the whole person – thoughts and behaviour – rather than just brain chemistry","t":"Psychological problems","id":948},{"q":"Give a weakness of CBT.","a":"It takes time, commitment and homework, so some people drop out","t":"Psychological problems","id":949},{"q":"What is holistic?","a":"Understanding behaviour by looking at the whole person and the bigger picture","t":"Psychological problems","id":950},{"q":"What was the name of Wiles et al.'s study?","a":"The CoBalT trial (published 2013)","t":"Psychological problems","id":951},{"q":"What was the aim of Wiles et al.'s study?","a":"To see whether adding CBT to antidepressants helps people with treatment-resistant depression","t":"Psychological problems","id":952},{"q":"What is treatment-resistant depression?","a":"Depression that hasn't improved with antidepressants alone","t":"Psychological problems","id":953},{"q":"How many participants were in Wiles' study?","a":"469","t":"Psychological problems","id":954},{"q":"What were the two conditions in Wiles' study?","a":"Antidepressants only (usual care), Antidepressants plus CBT","t":"Psychological problems","id":955},{"q":"How many CBT sessions did participants in Wiles' study receive?","a":"12–18 sessions","t":"Psychological problems","id":956},{"q":"What is the Beck Depression Inventory (BDI)?","a":"A 21-item self-report questionnaire that measures symptoms of depression","t":"Psychological problems","id":957},{"q":"When was depression measured in Wiles' study?","a":"At the start, 6 months and 12 months","t":"Psychological problems","id":958},{"q":"What % of participants remained in Wiles' study for the full 12 months?","a":"About 90%","t":"Psychological problems","id":959},{"q":"For participants who received drugs and CBT, what % had more than a 50% reduction in symptoms?","a":"46.1%","t":"Psychological problems","id":960},{"q":"For participants who received just drugs, what % had more than a 50% reduction in symptoms?","a":"21.6%","t":"Psychological problems","id":961},{"q":"What did Wiles conclude?","a":"CBT combined with antidepressants is more effective than antidepressants alone for treatment-resistant depression","t":"Psychological problems","id":962},{"q":"What is a problem with using the BDI to measure the success of treatment?","a":"It is self-report, so people may exaggerate or play down their symptoms (social desirability bias)","t":"Psychological problems","id":963},{"q":"Give a strength of Wiles' study.","a":"Large sample and random allocation, and it has real-life applications for treating depression","t":"Psychological problems","id":964},{"q":"What is addiction?","a":"Being unable to stop or control using a substance or doing a behaviour, becoming entirely focused on it","t":"Psychological problems","id":965},{"q":"Identify three characteristics of addiction (ICD).","a":"Strong desire to use, Difficulty controlling use, Persisting despite harm, High priority given to it, Withdrawal symptoms, Tolerance","t":"Psychological problems","id":966},{"q":"How many ICD characteristics must be present to diagnose addiction?","a":"Three or more at the same time in the past year","t":"Psychological problems","id":967},{"q":"What is tolerance?","a":"Needing more of a substance to get the same effect","t":"Psychological problems","id":968},{"q":"What is withdrawal?","a":"Unpleasant physical or mental symptoms when the substance is stopped or reduced","t":"Psychological problems","id":969},{"q":"What is dependence?","a":"A compulsion to keep using a substance or doing a behaviour, with withdrawal symptoms if you stop","t":"Psychological problems","id":970},{"q":"What is substance misuse?","a":"Using a substance to treat an ailment but not in the recommended way, e.g. taking too many tablets","t":"Psychological problems","id":971},{"q":"What is substance abuse?","a":"Using a substance to get certain feelings in a harmful or dangerous way","t":"Psychological problems","id":972},{"q":"April takes 4 sleeping tablets instead of the prescribed 2. Is this substance abuse or misuse?","a":"Misuse – she is using medication for its purpose, but not as prescribed","t":"Psychological problems","id":973},{"q":"What is a genetic vulnerability?","a":"A biological predisposition, inherited in the genes, to develop a condition","t":"Psychological problems","id":974},{"q":"What is hereditary?","a":"Passed genetically from parent to child","t":"Psychological problems","id":975},{"q":"What is the diathesis-stress model?","a":"A disorder develops when a genetic vulnerability (diathesis) is triggered by stressful life experiences (stress)","t":"Psychological problems","id":976},{"q":"In addiction, what is the diathesis and what is the stress?","a":"Diathesis – genetic vulnerability; Stress – environmental triggers such as life events or peer pressure","t":"Psychological problems","id":977},{"q":"What are MZ twins?","a":"Monozygotic (identical) twins – from one egg, sharing 100% of their genes","t":"Psychological problems","id":978},{"q":"What are DZ twins?","a":"Dizygotic (non-identical) twins – from two eggs, sharing about 50% of their genes","t":"Psychological problems","id":979},{"q":"What is a concordance rate?","a":"The percentage of twin pairs where both twins share a trait","t":"Psychological problems","id":980},{"q":"What does it mean if MZ twins have higher concordance than DZ twins?","a":"The trait has a genetic basis","t":"Psychological problems","id":981},{"q":"Where did Kaij conduct his twin study of alcoholism?","a":"Sweden","t":"Psychological problems","id":982},{"q":"Where did Kaij get his sample?","a":"The Swedish temperance board (a register of people with alcohol problems)","t":"Psychological problems","id":983},{"q":"Describe Kaij's sample.","a":"174 pairs of male twins where at least one twin was registered with the temperance board","t":"Psychological problems","id":984},{"q":"What % of MZ twins had a co-twin registered with the temperance board?","a":"54.2%","t":"Psychological problems","id":985},{"q":"What % of DZ twins had a co-twin registered with the temperance board?","a":"28.3%","t":"Psychological problems","id":986},{"q":"Why did Kaij conclude that addiction is only partly genetic?","a":"MZ concordance was not 100%, so environmental factors must also play a role","t":"Psychological problems","id":987},{"q":"Give a weakness of Kaij's study.","a":"Only male Swedish twins, and people only got on the temperance board after public problems, so the sample is biased","t":"Psychological problems","id":988},{"q":"What did Kendler et al. (1997) find?","a":"MZ twins had a 48% chance and DZ twins a 33% chance of a co-twin addicted to alcohol – supporting Kaij","t":"Psychological problems","id":989},{"q":"What is a peer?","a":"Someone from the same social or age group","t":"Psychological problems","id":990},{"q":"What is peer influence?","a":"The effect that people similar to us have on our opinions and behaviour","t":"Psychological problems","id":991},{"q":"When is peer influence most powerful?","a":"During adolescence","t":"Psychological problems","id":992},{"q":"What is social learning theory, and how does it link to addiction?","a":"We learn by observing and imitating role models; people may start using substances by copying peers who use them","t":"Psychological problems","id":993},{"q":"What is vicarious reinforcement?","a":"Being more likely to copy a behaviour because you see someone else rewarded for it","t":"Psychological problems","id":994},{"q":"What is the social norms explanation of addiction?","a":"We learn what is normal from our peers, so if substance use is the norm in a group, we copy it","t":"Psychological problems","id":995},{"q":"What did Simons-Morton and Farhat (2010) find?","a":"In 39 of 40 studies there was a positive link between peers and smoking","t":"Psychological problems","id":996},{"q":"Give a weakness of peer influence as an explanation for addiction.","a":"It can't explain people who become addicted without being exposed to peers who use substances","t":"Psychological problems","id":997},{"q":"What is classical conditioning?","a":"Learning through association – a neutral stimulus becomes linked with an unconditioned stimulus","t":"Psychological problems","id":998},{"q":"What is aversion therapy?","a":"A treatment where the addictive behaviour is paired with something unpleasant so it becomes associated with discomfort","t":"Psychological problems","id":999},{"q":"How is aversion therapy a form of classical conditioning?","a":"The substance (neutral stimulus) is paired with an unpleasant response, so it becomes a conditioned stimulus that causes a conditioned response of nausea","t":"Psychological problems","id":1000},{"q":"Describe aversion therapy for alcoholism.","a":"The patient takes Antabuse, which causes nausea and vomiting, then drinks alcohol; after repeated pairings alcohol is associated with sickness","t":"Psychological problems","id":1001},{"q":"What is rapid smoking?","a":"A form of aversion therapy where a smoker smokes intensely in a closed room until they feel sick","t":"Psychological problems","id":1002},{"q":"Give a weakness of aversion therapy.","a":"The effect may fade (extinction) and there are high drop-out rates","t":"Psychological problems","id":1003},{"q":"What is extinction?","a":"When the conditioned response fades because the stimuli are no longer paired","t":"Psychological problems","id":1004},{"q":"What is a self-management programme?","a":"A treatment with no specialist leader, where the people involved organise their own treatment","t":"Psychological problems","id":1005},{"q":"What is a self-help group?","a":"A group of people with a shared problem who support each other","t":"Psychological problems","id":1006},{"q":"Give two examples of self-help groups.","a":"Alcoholics Anonymous, Narcotics Anonymous","t":"Psychological problems","id":1007},{"q":"What is a 12-step programme?","a":"A self-help programme where members follow 12 principles to stop using drugs or alcohol","t":"Psychological problems","id":1008},{"q":"Give a strength of self-management programmes.","a":"They are free and provide social support from people who understand","t":"Psychological problems","id":1009},{"q":"Give a weakness of self-management programmes.","a":"They don't suit everyone (e.g. people who don't like talking about emotions), and there is no professional support","t":"Psychological problems","id":1010},{"q":"What are the named studies for Psychological problems?","a":"Wiles et al. (depression), Kaij (addiction)","t":"Psychological problems","id":1011},{"q":"What does the W stand for in PCWIDD (ethical issues)?","a":"Right to withdraw","t":"Psychological problems","id":1012},{"q":"Key term: what is meant by 'Capacity'?","a":"A measure of how much information can be stored.","t":"Memory","id":1013},{"q":"Key term: what is meant by 'Coding'?","a":"The altering of received information into a suitable form for it to be stored in the memory.","t":"Memory","id":1014},{"q":"Key term: what is meant by 'Duration'?","a":"How long information can be stored in the memory.","t":"Memory","id":1015},{"q":"Key term: what is meant by 'Long-term store'?","a":"Memory store that has a very large capacity and holds information for a lengthy period of time.","t":"Memory","id":1016},{"q":"Key term: what is meant by 'Recognition'?","a":"By retrieving a memory, you are able to identify something or someone, previously known to you in some way.","t":"Memory","id":1017},{"q":"Key term: what is meant by 'Reconstructive memory'?","a":"Changing or filling in gaps in our recollection of experiences or information so that it makes more sense to us.","t":"Memory","id":1018},{"q":"Key term: what is meant by 'Reductionist'?","a":"The belief that something (such as human behaviour) is only fully able to be understood by simplifying it to its most fundamental and basic parts.","t":"RM","id":1019},{"q":"Key term: what is meant by 'Inference'?","a":"A process that involves taking information from what’s in front of you and drawing a conclusion about it based on other things you know.","t":"Perception","id":1020},{"q":"Key term: what is meant by 'Monocular depths cues'?","a":"Perceptual cues that can be detected with one eye.","t":"Perception","id":1021},{"q":"Key term: what is meant by 'Authority'?","a":"When a person has the right to give orders and be obeyed, or when they are perceived by others to have the right to do so.","t":"Social influence","id":1022},{"q":"Key term: what is meant by 'British Psychological Society guidelines'?","a":"The ethical guidelines that cover the work of all practising and research psychologists. Produced by the British Psychological Society in its Code of Ethics and Conduct (2006) and Code of Human Research Ethics (2014). Details how participants in psychological research should be treated.","t":"RM","id":1023},{"q":"Key term: what is meant by 'Bystander behaviour'?","a":"The way that an individual acts when they see someone needing help.","t":"Social influence","id":1024},{"q":"Key term: what is meant by 'Dispositional factors'?","a":"Personal characteristics which may affect a person's behaviour and choices.","t":"Social influence","id":1025},{"q":"Key term: what is meant by 'Majority influence'?","a":"When the opinions or behaviours of a large number of people influence the opinions or behaviours of a smaller number of people. This usually results in conformity.","t":"Social influence","id":1026},{"q":"Key term: what is meant by 'Observation study'?","a":"An investigative method where researchers collect data about people's behaviour by watching them and recording what they see.","t":"RM","id":1027},{"q":"Key term: what is meant by 'Stratified sample'?","a":"People are selected proportionally from several relevant subgroups within the target population.","t":"RM","id":1028},{"q":"Key term: what is meant by 'Systematic sample'?","a":"People are selected from a larger population according to a fixed interval, such as every nth person on a list.","t":"RM","id":1029},{"q":"Key term: what is meant by 'Ethical issues'?","a":"Concerns about what is moral right and best for participants when researchers are carrying out research.","t":"RM","id":1030},{"q":"Key term: what is meant by 'Concrete operational'?","a":"Using cognitive abilities to apply logic and solve problems, but limited to real situations and physical objects","t":"Development","id":1031},{"q":"Key term: what is meant by 'Formal operational'?","a":"Being able to reason in a way that uses logic and abstract thinking.","t":"Development","id":1032},{"q":"Key term: what is meant by 'Pre-operational'?","a":"Being able to think about things symbolically, but unable to apply logic and reasoning to solve problems.","t":"Development","id":1033},{"q":"Key term: what is meant by 'Neonates'?","a":"New-born babies, less than a month old.","t":"Language, thought & communication","id":1034},{"q":"Key term: what is meant by 'Survival'?","a":"Continued existence.","t":"Language, thought & communication","id":1035},{"q":"Key term: what is meant by 'Territory'?","a":"An area defended against others by individuals or groups of animals or humans.","t":"Language, thought & communication","id":1036},{"q":"Key term: what is meant by 'Touch'?","a":"Physical contact between people (and animals). Can be understood as a form of non-verbal communication.","t":"Language, thought & communication","id":1037},{"q":"Key term: what is meant by 'Excitation'?","a":"A neurotransmitter binding with a receptor on the next neuron and increasing the likelihood that the next neuron will fire an electrical impulse.","t":"Brain & neuropsychology","id":1038},{"q":"Key term: what is meant by 'Inhibition'?","a":"A neurotransmitter binding with a receptor on the next neuron and decreasing the likelihood that the next neuron will fire an electrical impulse.","t":"Brain & neuropsychology","id":1039},{"q":"Key term: what is meant by 'Localised function'?","a":"Different areas of the brain that are responsible for specific behaviours or functions.","t":"Brain & neuropsychology","id":1040},{"q":"Key term: what is meant by 'Motor Neuron'?","a":"Nerve cells that carry messages from the CNS to the muscles to make them move.","t":"Brain & neuropsychology","id":1041},{"q":"Key term: what is meant by 'Neuronal growth'?","a":"When a neuron frequently excites another neuron, it results in change or development in one or both of the neurons.","t":"Brain & neuropsychology","id":1042},{"q":"Key term: what is meant by 'Normal distribution'?","a":"A symmetrical arrangement of data in which the majority of values are grouped in the centre and the rest taper off towards each end, forming a bell-shaped curve. The mean, median and mode all fall in the centre of the curve.","t":"RM","id":1043},{"q":"Key term: what is meant by 'Occipital lobe'?","a":"One of the four major lobes of the cerebral cortex, the occipital lobe is at the back of the brain and is where visual information is processed.","t":"Brain & neuropsychology","id":1044},{"q":"Key term: what is meant by 'Parietal lobe'?","a":"One of the four major lobes of the cerebral cortex, the parietal lobe is at the top of the brain and is responsible for processing sensations such as touch, temperature and pain. It is also responsible for integrating information from other areas to form complex behaviours.","t":"Brain & neuropsychology","id":1045},{"q":"Key term: what is meant by 'Peripheral nervous system'?","a":"A system of nerve fibres that connects and relays information between the central nervous system (CNS) and the rest of the body. It is made up of the sympathetic nervous system (SNS) and the autonomic nervous system (ANS).","t":"Brain & neuropsychology","id":1046},{"q":"Key term: what is meant by 'Relay neuron'?","a":"A nerve cell in the central nervous system (CNS) that passes messages between sensory and motor neurons","t":"Brain & neuropsychology","id":1047},{"q":"Key term: what is meant by 'Sensory neuron'?","a":"A nerve cell that picks up information from the environment via sense receptors, like the skin, and carries it to the central nervous system (CNS).","t":"Brain & neuropsychology","id":1048},{"q":"Key term: what is meant by 'Somatic nervous system'?","a":"A system of sensory and motor neurons that run to and from the spinal cord and relay sensory information to and from the central nervous system (CNS). Also controls voluntary movements.","t":"Brain & neuropsychology","id":1049},{"q":"Key term: what is meant by 'Somatosensory area'?","a":"An area of the parietal lobe that is involved with the perception of touch, pain, pressure, etc.","t":"Brain & neuropsychology","id":1050},{"q":"Key term: what is meant by 'Synapse'?","a":"The small gap between two neurons that allows signals to pass between them.","t":"Brain & neuropsychology","id":1051},{"q":"Key term: what is meant by 'Temporal lobe'?","a":"One of the four major lobes of the cerebral cortex, the temporal lobe is an area of the brain that is responsible for things such as comprehension and creation of spoken language.","t":"Brain & neuropsychology","id":1052},{"q":"Key term: what is meant by 'Thalamus'?","a":"The part of the brain that relays sensory information to the cerebral cortex and regulates consciousness and alertness.","t":"Brain & neuropsychology","id":1053},{"q":"Key term: what is meant by '12-step recovery programmes'?","a":"A type of self-help group that gives group members 12 principles to follow in order to be able to stop using drugs, alcohol, etc.","t":"Psychological problems","id":1054},{"q":"Key term: what is meant by 'Coping'?","a":"The ability to use cognitive and behavioural strategies to manage the situations and deal with problems and responsibilities calmly and effectively.","t":"Psychological problems","id":1055},{"q":"Key term: what is meant by 'International Classification of Diseases'?","a":"A globally used list of symptoms and features of physical and mental health problems. Provides standard measures for diagnosis. Produced by the World Health Organization (WHO).","t":"Psychological problems","id":1056},{"q":"Key term: what is meant by 'Positive engagement'?","a":"Being curious, interested and motivated in studies, work or life in general.","t":"Psychological problems","id":1057},{"q":"Key term: what is meant by 'Sadness'?","a":"A common emotional reaction which involves feeling sorrow in response to an unpleasant, hurtful or unhappy experience or memory.","t":"Psychological problems","id":1058},{"q":"Key term: what is meant by 'Symptoms'?","a":"Physical or mental features that are seen as indicating a condition, disease or disorder.","t":"Psychological problems","id":1059},{"q":"Key term: what is meant by 'Therapies'?","a":"Treatments that are used in order to relieve symptoms or heal a condition, disease or disorder.","t":"Psychological problems","id":1060},{"q":"Jay closes one eye and can still tell the car is further away than the tree. Which type of depth cue is he using?","a":"Monocular depth cues","t":"Perception","id":1061},{"q":"Mia notices her eyes strain as she brings her phone closer to her face. Which depth cue is this?","a":"Convergence","t":"Perception","id":1062},{"q":"In a photo of a road, the edges seem to meet in the distance. Which depth cue is this?","a":"Linear perspective","t":"Perception","id":1063},{"q":"In a painting, a tree partly hides a house behind it. Which depth cue tells us the tree is closer?","a":"Occlusion","t":"Perception","id":1064},{"q":"In a picture, the birds higher up in the sky look further away. Which depth cue is this?","a":"Height in plane","t":"Perception","id":1065},{"q":"Two identical people are drawn at different sizes; the smaller one looks further away. Which depth cue is this?","a":"Relative size","t":"Perception","id":1066},{"q":"A pebble beach looks detailed close up but smooth in the distance. Which depth cue is this?","a":"Texture gradient","t":"Perception","id":1067},{"q":"From a train, nearby fences rush past but distant hills barely move. Which depth cue is this?","a":"Motion parallax","t":"Perception","id":1068},{"q":"A door opens towards you and looks like a trapezium, but you still see it as rectangular. Which visual constancy is this?","a":"Shape constancy","t":"Perception","id":1069},{"q":"A friend walks away from you and gets smaller on your retina, but you don't think they are shrinking. Which constancy is this?","a":"Size constancy","t":"Perception","id":1070},{"q":"Your white shirt looks white in both daylight and orange streetlight. Which constancy is this?","a":"Colour constancy","t":"Perception","id":1071},{"q":"Tom sees a vase, then suddenly sees two faces in the same image. Which explanation of illusions is this?","a":"Ambiguity","t":"Perception","id":1072},{"q":"Priya sees a white triangle in a picture made only of three 'Pac-Man' shapes. Which explanation of illusions is this?","a":"Fiction","t":"Perception","id":1073},{"q":"Two identical lines look different lengths because of arrow-shaped fins. Which explanation of illusions is this?","a":"Misinterpreted depth cues (and size constancy)","t":"Perception","id":1074},{"q":"A child hears a noise and says 'that's a car' before seeing it. Is this bottom-up or top-down processing?","a":"Top-down – using past experience to interpret the information","t":"Perception","id":1075},{"q":"A newborn follows a moving face with its eyes. Which theory of perception does this support?","a":"Gibson's direct theory – some perception is innate","t":"Perception","id":1076},{"q":"An adult who grew up in a forest village struggles to judge distance in open plains. Which theory does this support?","a":"Gregory's constructivist theory – perception depends on experience","t":"Perception","id":1077},{"q":"Leo is hungry and notices every food advert on the way home. Which factor affecting perceptual set is this?","a":"Motivation","t":"Perception","id":1078},{"q":"Hannah is anxious about a test and notices every negative comment from her teacher. Which factor affecting perceptual set is this?","a":"Emotion","t":"Perception","id":1079},{"q":"After reading lots of words, Sam reads an ambiguous shape as a letter. Which factor affecting perceptual set is this?","a":"Expectation","t":"Perception","id":1080},{"q":"People from a rural community misread depth cues in a 2D drawing. Which factor affecting perceptual set is this?","a":"Culture","t":"Perception","id":1081},{"q":"Explain how Gregory would explain the Müller-Lyer illusion.","a":"We use past experience of buildings: the outward fins look like the far corner of a room, so we think that line is further away and size constancy makes it look longer","t":"Perception","id":1082},{"q":"Why does Gregory's theory explain illusions better than Gibson's?","a":"Gregory says perception uses inference and experience, so we can make mistaken hypotheses; Gibson says perception is direct and accurate, so he can't explain why we are fooled","t":"Perception","id":1083},{"q":"Give a strength of Gibson's direct theory.","a":"It explains how we perceive quickly in real life, and research like the visual cliff supports innate depth perception","t":"Perception","id":1084},{"q":"Give a weakness of Gibson's direct theory.","a":"It can't explain visual illusions, or why culture and experience affect perception","t":"Perception","id":1085},{"q":"Give a strength of Gregory's constructivist theory.","a":"It explains visual illusions and cultural differences in perception (e.g. Hudson)","t":"Perception","id":1086},{"q":"Why might Gregory's theory not fully explain everyday perception?","a":"It is based on 2D illusions designed to trick us, not real 3D environments with rich information","t":"Perception","id":1087},{"q":"Is the nature–nurture debate linked to Gregory and Gibson?","a":"Yes – Gregory takes the nurture side (learned), Gibson the nature side (innate)","t":"Perception","id":1088},{"q":"Give a strength of Hudson's study.","a":"It used a standardised picture and questions, so it could be replicated with different groups","t":"Perception","id":1089},{"q":"Why might Hudson's study lack validity?","a":"Participants may not have understood the questions or the purpose of 2D drawings, so their answers may reflect confusion rather than perception","t":"Perception","id":1090},{"q":"Why does Hudson's study lack temporal validity?","a":"It was conducted in 1960; access to pictures and schooling has changed a lot since then","t":"Perception","id":1091},{"q":"Give an ethical strength of Hudson's study.","a":"It involved looking at pictures, so there was little risk of harm","t":"Perception","id":1092},{"q":"Give a strength of McGinnies' study.","a":"It measured emotion objectively using GSR, not just self-report","t":"Perception","id":1093},{"q":"Give a weakness of McGinnies' study.","a":"Participants may have recognised taboo words but been too embarrassed to say them aloud, so it may measure embarrassment not perception","t":"Perception","id":1094},{"q":"Why might McGinnies' sample be biased?","a":"It used only 16 students, who may not represent the general population","t":"Perception","id":1095},{"q":"What design was McGinnies' study?","a":"Repeated measures – all participants saw both neutral and taboo words","t":"Perception","id":1096},{"q":"Give a strength of Bruner and Minturn's study.","a":"It was a lab experiment with standardised procedures and high control, so it is reliable","t":"Perception","id":1097},{"q":"Give a weakness of Bruner and Minturn's study related to generalisability.","a":"The sample was small and made up of students, so it may not represent everyone","t":"Perception","id":1098},{"q":"What was the IV in Bruner and Minturn's study?","a":"Whether participants saw letters or numbers before the ambiguous figure (the context)","t":"Perception","id":1099},{"q":"What was the DV in Bruner and Minturn's study?","a":"Whether participants drew/reported the ambiguous figure as a B or a 13","t":"Perception","id":1100},{"q":"Why was Bruner and Minturn's study ethical?","a":"There was no harm or distress – participants just viewed and drew figures","t":"Perception","id":1101},{"q":"Write a directional hypothesis for Bruner and Minturn's study.","a":"Participants shown letters first will be more likely to perceive the ambiguous figure as a B than those shown numbers first","t":"Perception","id":1102},{"q":"What was the DV in Gilchrist and Nesberg's study?","a":"The brightness rating given to the pictures of food","t":"Perception","id":1103},{"q":"Give a strength of Gilchrist and Nesberg's study.","a":"It used standardised procedures and objective ratings of brightness, so it could be replicated","t":"Perception","id":1104},{"q":"Why is Gilchrist and Nesberg's study hard to generalise?","a":"It used a small sample of 26 students","t":"Perception","id":1105},{"q":"Give an ethical issue with Gilchrist and Nesberg's study.","a":"Participants went without food for up to 20 hours, which could cause discomfort","t":"Perception","id":1106},{"q":"Write a directional hypothesis for Gilchrist and Nesberg's study.","a":"Hungry participants will rate pictures of food as brighter than participants who are not hungry","t":"Perception","id":1107},{"q":"How could Gilchrist and Nesberg's research be applied?","a":"Supermarkets might place food adverts where hungry people will see them, e.g. near the end of the day","t":"Perception","id":1108},{"q":"How could research on perceptual set be applied in everyday life?","a":"Advertising, road safety signs, and understanding eyewitness mistakes","t":"Perception","id":1109},{"q":"Why might a lab experiment on perception lack mundane realism?","a":"Participants often look at flat images on screens, unlike real 3D scenes","t":"Perception","id":1110},{"q":"What is an example of an ambiguous figure used in perception research?","a":"The duck-rabbit, Rubin's vase, or Bruner and Minturn's B/13","t":"Perception","id":1111},{"q":"Why do we see the Ames room illusion?","a":"We assume the room is rectangular, so we think both people are the same distance away and one looks huge","t":"Perception","id":1112},{"q":"What does the Ponzo illusion show about perception?","a":"The brain uses depth cues automatically, even in flat drawings, and applies size constancy","t":"Perception","id":1113},{"q":"What is the key difference between sensation and perception theories?","a":"Gregory says sensation and perception are different; Gibson says they are the same","t":"Perception","id":1114},{"q":"What evidence suggests babies have some depth perception at birth?","a":"The visual cliff – babies refused to crawl over the 'drop'","t":"Perception","id":1115},{"q":"Why might the visual cliff study not show perception is innate?","a":"Six-month-olds can crawl and have had experience, so they may have learned depth perception","t":"Perception","id":1116},{"q":"Why is an independent groups design used in Bruner and Minturn's study?","a":"So participants only saw one context, avoiding order effects and guessing the aim","t":"Perception","id":1117},{"q":"Why might individual differences affect perceptual set?","a":"People's experiences, needs and emotions differ, so they notice different things","t":"Perception","id":1118},{"q":"Explain how culture could affect the perception of 2D pictures.","a":"People with less experience of books and pictures may not learn to read depth cues in 2D drawings","t":"Perception","id":1119},{"q":"Explain one weakness of using ambiguous figures in research.","a":"They are artificial and rarely encountered in daily life, lowering mundane realism","t":"Perception","id":1120},{"q":"A 9-month-old searches under a blanket for a hidden toy. Which ability is this?","a":"Object permanence","t":"Development","id":1121},{"q":"A 4-year-old thinks their gran can see the same view from the other side of a model. Which feature is this?","a":"Egocentrism (pre-operational stage)","t":"Development","id":1122},{"q":"A 5-year-old says a tall thin glass has more juice than a short wide glass with the same amount. What can't they do yet?","a":"Conserve","t":"Development","id":1123},{"q":"A 13-year-old can discuss 'what would happen if humans had no gravity'. Which stage are they in?","a":"Formal operational – hypothetical/abstract thinking","t":"Development","id":1124},{"q":"An 8-year-old can solve maths problems using counters but not in their head. Which stage are they in?","a":"Concrete operational","t":"Development","id":1125},{"q":"A toddler calls all four-legged animals 'dog'. Which process is this?","a":"Assimilation – fitting new animals into the dog schema","t":"Development","id":1126},{"q":"The toddler learns that some four-legged animals are cats. Which process is this?","a":"Accommodation – changing the schema or creating a new one","t":"Development","id":1127},{"q":"A 3-year-old uses a banana as a pretend phone. Which feature of the pre-operational stage is this?","a":"Symbolic thinking (pretend play)","t":"Development","id":1128},{"q":"A teacher gives Year 2 pupils blocks to work out subtraction. Which part of Piaget's education theory is this?","a":"Readiness (using concrete aids at the concrete stage) or discovery learning","t":"Development","id":1129},{"q":"A science teacher lets pupils find out which materials float by experimenting themselves. What is this?","a":"Discovery learning","t":"Development","id":1130},{"q":"Ellie says 'I'm just not a maths person'. Which mindset does she have?","a":"A fixed mindset","t":"Development","id":1131},{"q":"Omar says 'I got this wrong, but I'll get better if I practise'. Which mindset does he have?","a":"A growth mindset","t":"Development","id":1132},{"q":"A teacher says 'You worked really hard on that essay'. What type of praise is this?","a":"Process (effort) praise, which encourages a growth mindset","t":"Development","id":1133},{"q":"A teacher says 'You're so clever'. Why might this be unhelpful?","a":"It is ability praise, which may encourage a fixed mindset and fear of failure","t":"Development","id":1134},{"q":"Zara has always done well in PE, so she chooses the hardest sport club. Which concept explains this?","a":"High self-efficacy","t":"Development","id":1135},{"q":"Ben avoids art because he has failed in the past. Which concept explains this?","a":"Low self-efficacy","t":"Development","id":1136},{"q":"A teacher only uses diagrams because a pupil says they're a 'visual learner'. What would Willingham say?","a":"The method should suit the content, not the pupil's supposed learning style","t":"Development","id":1137},{"q":"A student tests themselves with flashcards instead of re-reading notes. Which of Willingham's ideas is this?","a":"Retrieval practice","t":"Development","id":1138},{"q":"Give a strength of Hughes' study.","a":"It used a more realistic, meaningful task than Piaget's three mountains, so it better measured children's real abilities","t":"Development","id":1139},{"q":"Give a weakness of Hughes' study.","a":"Small sample of Scottish children, so it may not be generalisable","t":"Development","id":1140},{"q":"Why might Hughes' task be easier than Piaget's?","a":"Hiding from a policeman makes 'human sense' to children, whereas the mountains task was abstract","t":"Development","id":1141},{"q":"What was the IV in Hughes' study?","a":"The positions of the policeman dolls (one or two policemen, different arrangements)","t":"Development","id":1142},{"q":"What was the DV in Hughes' study?","a":"Whether the child hid the boy doll correctly from the policemen","t":"Development","id":1143},{"q":"What was the IV in McGarrigle and Donaldson's study?","a":"Whether the adult or 'naughty teddy' changed the row of counters","t":"Development","id":1144},{"q":"What was the DV in McGarrigle and Donaldson's study?","a":"Whether the child correctly said the number of counters was the same (conserved)","t":"Development","id":1145},{"q":"Give a strength of McGarrigle and Donaldson's study.","a":"It used a repeated measures design, controlling participant variables","t":"Development","id":1146},{"q":"Give a weakness of McGarrigle and Donaldson's study.","a":"Children may have been distracted by the teddy rather than truly conserving","t":"Development","id":1147},{"q":"Write a directional hypothesis for McGarrigle and Donaldson's study.","a":"More children will conserve when naughty teddy moves the counters than when the adult moves them","t":"Development","id":1148},{"q":"Give an ethical issue with McGarrigle and Donaldson's study.","a":"Young children can't give informed consent themselves, so parental consent is needed","t":"Development","id":1149},{"q":"Why is Piaget's theory said to lack generalisability?","a":"It was based on a small number of Swiss children, including his own","t":"Development","id":1150},{"q":"Give a strength of Piaget's theory in terms of testability.","a":"His ideas can be tested experimentally, e.g. conservation and egocentrism tasks","t":"Development","id":1151},{"q":"Why might Piaget's stages be too rigid?","a":"Children may show abilities from different stages at the same time, and some develop earlier than he said","t":"Development","id":1152},{"q":"Give a weakness of applying Piaget to education.","a":"Discovery learning may not suit subjects that need direct teaching, such as reading and maths (Bennett, 1976)","t":"Development","id":1153},{"q":"Give a strength of applying Piaget to education.","a":"It encourages active, independent learning and matching tasks to pupils' readiness","t":"Development","id":1154},{"q":"Give a strength of Dweck's mindset theory.","a":"It can be easily applied in schools to improve motivation and grades","t":"Development","id":1155},{"q":"Give a weakness of Dweck's mindset theory.","a":"Mindsets are measured by questionnaires, which may be affected by social desirability bias","t":"Development","id":1156},{"q":"Why might mindset theory not apply the same in all cultures?","a":"Collectivist cultures may already value effort over ability, so the effect may differ","t":"Development","id":1157},{"q":"Give a weakness of Dweck's study of 48 students.","a":"Small sample of underachieving 12–13-year-olds, so it may not generalise","t":"Development","id":1158},{"q":"What was the IV in Dweck's study?","a":"Whether students had the growth mindset session or the memory session","t":"Development","id":1159},{"q":"What was the DV in Dweck's study?","a":"Students' motivation and grades","t":"Development","id":1160},{"q":"How can schools use self-efficacy research?","a":"Give pupils achievable tasks to build success, and use encouraging feedback","t":"Development","id":1161},{"q":"Give a weakness of the self-efficacy idea.","a":"It is hard to measure objectively and relies on self-report","t":"Development","id":1162},{"q":"Give a strength of Willingham's ideas.","a":"They are backed by scientific evidence and can be applied to improve learning","t":"Development","id":1163},{"q":"Give a weakness of Willingham's ideas.","a":"They may undervalue creativity and modern teaching methods","t":"Development","id":1164},{"q":"Why might learning styles questionnaires be unreliable?","a":"People's answers may change depending on the task or their mood","t":"Development","id":1165},{"q":"Give a weakness of teaching to learning styles.","a":"There is little evidence that it improves results, and there may be 71 styles, which is impractical","t":"Development","id":1166},{"q":"How does early brain development link to nature?","a":"The order in which brain structures develop is genetically programmed","t":"Development","id":1167},{"q":"How does early brain development link to nurture?","a":"The environment in the womb (e.g. smoking, infections) affects the developing brain","t":"Development","id":1168},{"q":"Why is Edwards' syndrome evidence for nature?","a":"It is caused by an extra chromosome, which disrupts development regardless of environment","t":"Development","id":1169},{"q":"Give a weakness of DeCasper and Spence's study.","a":"Babies' sucking could be affected by other factors like hunger, and the sample was small","t":"Development","id":1170},{"q":"What does DeCasper and Spence's study suggest about the womb?","a":"Babies can learn and remember sounds before they are born","t":"Development","id":1171},{"q":"Why are twin studies useful in the nature–nurture debate?","a":"Identical twins share all their genes, so differences between them must be due to environment","t":"Development","id":1172},{"q":"Why do most psychologists say nature and nurture interact?","a":"Genes provide the blueprint, but the environment affects how the brain develops from conception","t":"Development","id":1173},{"q":"Explain how Piaget's theory can be applied to the sensorimotor stage.","a":"Babies should play with noisy, moving toys to develop motor skills and object permanence","t":"Development","id":1174},{"q":"Explain how Piaget's theory can be applied to the pre-operational stage.","a":"Children should do role play to reduce egocentrism, and practical activities like cooking to learn conservation","t":"Development","id":1175},{"q":"Explain how Piaget's theory can be applied to the formal operational stage.","a":"Students can be given abstract, hypothetical problems and debates","t":"Development","id":1176},{"q":"A child points at a cat and says 'doggy' until they understand the difference. How would Piaget explain this?","a":"The child hasn't yet developed the correct schema, so their language reflects their current thinking","t":"Language, thought & communication","id":1177},{"q":"A child who has never seen snow can't understand the word 'slush'. Which theory does this support?","a":"Piaget's – you need the concept (thought) before you can understand the word","t":"Language, thought & communication","id":1178},{"q":"A Russian speaker, who has separate words for light and dark blue, spots differences between blues faster. Which theory does this support?","a":"The Sapir-Whorf hypothesis (weak version)","t":"Language, thought & communication","id":1179},{"q":"A tribe has no word for 'left' but still navigates perfectly using compass directions. Which version of Sapir-Whorf does this challenge?","a":"The strong version – they can still think about direction without the words","t":"Language, thought & communication","id":1180},{"q":"Give a strength of Piaget's theory of language.","a":"It is supported by research such as Cromer and Heider and Oliver, showing thought can exist without language","t":"Language, thought & communication","id":1181},{"q":"Give a weakness of Piaget's theory of language.","a":"It is hard to test because schemas can't be directly measured","t":"Language, thought & communication","id":1182},{"q":"Give a strength of the Sapir-Whorf hypothesis.","a":"Research on the Zuni and Berinmo supports the idea that language influences memory and perception of colour","t":"Language, thought & communication","id":1183},{"q":"Give a weakness of the Sapir-Whorf hypothesis.","a":"The strong version is not supported – people can think about things they have no words for (e.g. the Dani)","t":"Language, thought & communication","id":1184},{"q":"Why is the weak version of Sapir-Whorf more widely accepted?","a":"Research shows language makes some thinking easier, but doesn't completely limit it","t":"Language, thought & communication","id":1185},{"q":"What is the difference between the views of Piaget and Sapir-Whorf?","a":"Piaget says thought comes before language; Sapir-Whorf say language comes before (and shapes) thought","t":"Language, thought & communication","id":1186},{"q":"How could research on language and thought be applied?","a":"Teaching new vocabulary could help students think about new concepts; understanding other cultures","t":"Language, thought & communication","id":1187},{"q":"Why might cross-cultural research on language be difficult?","a":"Translation problems and researchers may misunderstand the culture (ethnocentrism)","t":"Language, thought & communication","id":1188},{"q":"How does the Inuit 'words for snow' example support Piaget?","a":"They experience lots of snow, so their thinking about snow develops first and words follow","t":"Language, thought & communication","id":1189},{"q":"A bird sings loudly at the edge of its area. Which function of animal communication is this?","a":"Territory","t":"Language, thought & communication","id":1190},{"q":"A monkey gives a special call when an eagle is overhead. Which function is this?","a":"Survival","t":"Language, thought & communication","id":1191},{"q":"A peacock displays its tail feathers. Which function is this?","a":"Reproduction","t":"Language, thought & communication","id":1192},{"q":"Ants follow a scent trail left by other ants. Which function is this?","a":"Food","t":"Language, thought & communication","id":1193},{"q":"A cat rubs its face on furniture to leave its scent. Which function is this?","a":"Territory (scent marking)","t":"Language, thought & communication","id":1194},{"q":"Why is human communication described as 'open'?","a":"We can create an unlimited number of new messages and ideas","t":"Language, thought & communication","id":1195},{"q":"Give an example of creativity in human language.","a":"Inventing new slang words or writing a poem","t":"Language, thought & communication","id":1196},{"q":"Give an example of multi-channel human communication.","a":"Using words, tone of voice and facial expressions at the same time","t":"Language, thought & communication","id":1197},{"q":"Explain one difference between animal and human communication.","a":"Humans can use displacement (talk about the past, future or things not present); animals communicate about the here and now","t":"Language, thought & communication","id":1198},{"q":"Write a directional hypothesis for von Frisch's study.","a":"Bees will perform the waggle dance more when food is placed far from the hive than when it is close","t":"Language, thought & communication","id":1199},{"q":"What was the IV in von Frisch's studies?","a":"The distance of the food source from the hive","t":"Language, thought & communication","id":1200},{"q":"What was the DV in von Frisch's studies?","a":"The type of dance performed by the bees","t":"Language, thought & communication","id":1201},{"q":"Give a strength of von Frisch's research method.","a":"The bees were observed in their natural environment, so behaviour was natural","t":"Language, thought & communication","id":1202},{"q":"Give a weakness of von Frisch's research.","a":"Bees are very different from humans, so findings may not apply to human communication","t":"Language, thought & communication","id":1203},{"q":"Give an ethical consideration of von Frisch's research.","a":"Bees may have been handled or marked, though animal research has fewer ethical guidelines than human research","t":"Language, thought & communication","id":1204},{"q":"Why is von Frisch's research reliable?","a":"He repeated his observations many times over about 20 years with consistent results","t":"Language, thought & communication","id":1205},{"q":"Alex looks away as he finishes speaking, then back at Jamie. Which function of eye contact is this?","a":"Regulating the flow of conversation","t":"Language, thought & communication","id":1206},{"q":"Two people across a room keep catching each other's gaze and smiling. Which function of eye contact is this?","a":"Signalling attraction","t":"Language, thought & communication","id":1207},{"q":"Maya stares at the floor with tearful eyes after bad news. Which function of eye contact is this?","a":"Expressing emotion","t":"Language, thought & communication","id":1208},{"q":"Give a strength of research into eye contact.","a":"It has practical applications, e.g. in interviews, teaching and therapy","t":"Language, thought & communication","id":1209},{"q":"Give a weakness of research into eye contact.","a":"Much of it is in labs or with photos, which may not reflect real conversations","t":"Language, thought & communication","id":1210},{"q":"Why might eye contact norms differ between cultures?","a":"In some cultures direct eye contact with elders or superiors is seen as rude","t":"Language, thought & communication","id":1211},{"q":"Two friends sit in the same position with legs crossed the same way. What is this?","a":"Postural echo","t":"Language, thought & communication","id":1212},{"q":"In an interview, Sam folds his arms and crosses his legs. What might the interviewer think?","a":"That he is closed-off, defensive or uncomfortable (closed posture)","t":"Language, thought & communication","id":1213},{"q":"A salesperson copies a customer's posture. Why might this help?","a":"Postural echo builds rapport and makes the customer feel liked","t":"Language, thought & communication","id":1214},{"q":"Give a strength of touch research.","a":"Field studies like Fisher et al. have high ecological validity as behaviour is natural","t":"Language, thought & communication","id":1215},{"q":"Give a weakness of Fisher et al.'s touch study.","a":"Only female students were studied, so it may not apply to men","t":"Language, thought & communication","id":1216},{"q":"Why might touch be interpreted differently in different cultures?","a":"Contact cultures touch more often, so non-contact cultures may see touch as intrusive","t":"Language, thought & communication","id":1217},{"q":"Luca, who is Italian, stands closer than his British classmates like. How might this be explained?","a":"He comes from a contact culture with smaller personal space preferences","t":"Language, thought & communication","id":1218},{"q":"A new employee keeps more distance from the headteacher than from other teachers. Which factor affects personal space here?","a":"Status","t":"Language, thought & communication","id":1219},{"q":"Two women sit side by side to chat while two men sit opposite each other. Which factor affects personal space here?","a":"Gender","t":"Language, thought & communication","id":1220},{"q":"Give a weakness of personal space research.","a":"Many studies look at one factor at a time (culture, gender or status) when in reality they interact","t":"Language, thought & communication","id":1221},{"q":"Explain how personal space research can be applied.","a":"Designing offices, classrooms or public transport to avoid discomfort, or helping people from different cultures interact","t":"Language, thought & communication","id":1222},{"q":"Give a strength of Darwin's evolutionary theory of non-verbal communication.","a":"It is supported by research showing facial expressions are similar across cultures and in blind children","t":"Language, thought & communication","id":1223},{"q":"Give a weakness of Darwin's evolutionary theory.","a":"It can't explain cultural differences in non-verbal communication, e.g. gestures","t":"Language, thought & communication","id":1224},{"q":"Why is Darwin's theory hard to test?","a":"We can't go back in time to see how behaviours evolved","t":"Language, thought & communication","id":1225},{"q":"Why does Thompson's study of blind children support the innate view?","a":"Blind children couldn't have learned expressions by watching others, yet they made the same ones","t":"Language, thought & communication","id":1226},{"q":"Give a weakness of Thompson's study.","a":"A small sample of blind children; some may not have been blind from birth or could learn through touch/sound","t":"Language, thought & communication","id":1227},{"q":"How do social releasers support the innate explanation of non-verbal communication?","a":"Babies smile and make eye contact from birth without learning it","t":"Language, thought & communication","id":1228},{"q":"Why does the 'OK' gesture meaning different things support the learned explanation?","a":"If non-verbal communication were innate, gestures would mean the same everywhere","t":"Language, thought & communication","id":1229},{"q":"Is non-verbal communication innate or learned?","a":"Probably both – some expressions seem innate, but culture shapes how and when they are used","t":"Language, thought & communication","id":1230},{"q":"What was the IV in Yuki's study?","a":"Culture (American or Japanese) and the combination of eyes and mouth in the emoticon","t":"Language, thought & communication","id":1231},{"q":"What was the DV in Yuki's study?","a":"Ratings of how happy or sad the emoticon/face looked","t":"Language, thought & communication","id":1232},{"q":"Write a directional hypothesis for Yuki's study.","a":"Japanese participants will focus more on the eyes, and American participants more on the mouth, when judging emotion","t":"Language, thought & communication","id":1233},{"q":"Give a strength of Yuki's study.","a":"It was a lab experiment with standardised emoticons, so it had high control and can be replicated","t":"Language, thought & communication","id":1234},{"q":"How could Yuki's findings be applied?","a":"Designing emojis or communication for international audiences, or understanding cross-cultural misunderstandings","t":"Language, thought & communication","id":1235},{"q":"Why might Yuki's study lack generalisability?","a":"It only used students from two countries","t":"Language, thought & communication","id":1236},{"q":"Give an example of non-verbal communication in texting.","a":"Emojis and emoticons","t":"Language, thought & communication","id":1237},{"q":"What does Yuki's study suggest about Western emoticons like :-)?","a":"Westerners focus on the mouth, so Western emoticons show emotion through the mouth","t":"Language, thought & communication","id":1238},{"q":"What does Yuki's study suggest about Japanese emoticons like (^_^)?","a":"Japanese people focus on the eyes, so their emoticons show emotion through the eyes","t":"Language, thought & communication","id":1239},{"q":"Kai laughs at a joke he doesn't find funny because everyone else laughs. Is this normative or informational social influence?","a":"Normative – he wants to fit in","t":"Social influence","id":1240},{"q":"On her first day, Ella follows everyone to the canteen because she doesn't know where it is. Is this normative or informational social influence?","a":"Informational – she assumes the others know the right answer","t":"Social influence","id":1241},{"q":"Josh copies his friends' answers on a hard quiz. Which social factor affecting conformity is this?","a":"Task difficulty","t":"Social influence","id":1242},{"q":"Maya votes differently in a secret ballot than she said in class. Which factor affecting conformity is this?","a":"Anonymity","t":"Social influence","id":1243},{"q":"Sam believes he failed because the test was unfair. What locus of control does he have?","a":"External locus of control","t":"Social influence","id":1244},{"q":"A football fan who is a qualified doctor helps an injured player. Which factor affecting bystander behaviour is this?","a":"Expertise","t":"Social influence","id":1245},{"q":"Many people walk past a man lying on a busy street. Which explanation of bystander apathy does this show?","a":"Diffusion of responsibility (presence of others)","t":"Social influence","id":1246},{"q":"People ignore smoke in an office because no-one else seems worried. Which concept is this?","a":"Pluralistic ignorance","t":"Social influence","id":1247},{"q":"A student runs to help another student from their own school team. Which factor affecting bystander behaviour is this?","a":"Similarity to the victim","t":"Social influence","id":1248},{"q":"A man doesn't help a fight victim because he fears getting hurt. Which factor affecting bystander behaviour is this?","a":"Cost of helping","t":"Social influence","id":1249},{"q":"A student puts less effort into a group project than an individual one. What is this?","a":"Social loafing","t":"Social influence","id":1250},{"q":"Football fans in matching shirts start chanting abuse they would never say alone. Which concept explains this?","a":"Deindividuation","t":"Social influence","id":1251},{"q":"A soldier says 'I was only following orders'. Which explanation of obedience is this?","a":"Agency theory (the agentic state)","t":"Social influence","id":1252},{"q":"Obedience drops when the teacher leaves the room and sets work by email. Which factor affecting obedience is this?","a":"Proximity to the authority figure","t":"Social influence","id":1253},{"q":"Priya refuses to join a riot because she believes it is wrong. Which dispositional factor explains this?","a":"Morality","t":"Social influence","id":1254},{"q":"Someone raised by very strict parents obeys all rules without question. Which theory explains this?","a":"Adorno's authoritarian personality","t":"Social influence","id":1255},{"q":"What was the IV in Asch's study?","a":"Whether confederates gave correct or incorrect answers (or the variation, e.g. group size)","t":"Social influence","id":1256},{"q":"What was the DV in Asch's study?","a":"The number of times the participant conformed to the wrong answer","t":"Social influence","id":1257},{"q":"What research method was Asch's study?","a":"A laboratory experiment","t":"Social influence","id":1258},{"q":"What was the IV in Milgram's study (in the variations)?","a":"The situational factor changed, e.g. proximity, location or uniform","t":"Social influence","id":1259},{"q":"What was
