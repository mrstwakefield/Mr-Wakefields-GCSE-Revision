the DV in Milgram's study?","a":"The maximum voltage the participant gave","t":"Social influence","id":1260},{"q":"What research method was Milgram's study?","a":"A controlled observation (lab-based)","t":"Social influence","id":1261},{"q":"What sampling method did Milgram use?","a":"Volunteer sampling (newspaper adverts)","t":"Social influence","id":1262},{"q":"Give a strength and weakness of Milgram's volunteer sample.","a":"Strength – range of ages and jobs; Weakness – volunteers may be more obedient or curious, so it is biased","t":"Social influence","id":1263},{"q":"How could Milgram justify his use of deception?","a":"Participants were debriefed and most said they were glad to have taken part; the knowledge gained was important","t":"Social influence","id":1264},{"q":"What was the IV in Piliavin's study?","a":"Whether the victim was carrying a cane or appeared drunk","t":"Social influence","id":1265},{"q":"What sampling method was used in Piliavin's study?","a":"Opportunity sampling – passengers on the train at the time","t":"Social influence","id":1266},{"q":"Give a strength of Piliavin's sample.","a":"It was large (around 4,450 passengers) and varied","t":"Social influence","id":1267},{"q":"How could Piliavin's findings be applied?","a":"Encouraging bystanders to help by reducing the costs of helping, or training people in first aid","t":"Social influence","id":1268},{"q":"Why might Latané and Darley's smoke study lack mundane realism?","a":"Sitting in a lab as a room fills with smoke is unusual","t":"Social influence","id":1269},{"q":"How can research into bystander behaviour be applied?","a":"Teaching people about diffusion of responsibility so they are more likely to help","t":"Social influence","id":1270},{"q":"Give a strength of the locus of control explanation of conformity.","a":"Supported by research such as Burger and Cooper (1979)","t":"Social influence","id":1271},{"q":"Give a weakness of locus of control as an explanation.","a":"It may not be consistent – people may be internal in some situations and external in others","t":"Social influence","id":1272},{"q":"Give a weakness of Burger and Cooper's study.","a":"Rating cartoons is a trivial task, so it lacks mundane realism","t":"Social influence","id":1273},{"q":"Give a strength of agency theory.","a":"It helps explain real events such as the Holocaust, where people obeyed destructive orders","t":"Social influence","id":1274},{"q":"Give a weakness of agency theory.","a":"It can't explain why some people disobey, e.g. the 35% who stopped in Milgram's study","t":"Social influence","id":1275},{"q":"Give a strength of Adorno's theory.","a":"It is supported by research linking strict upbringing and high F-scale scores with obedience","t":"Social influence","id":1276},{"q":"Why is Adorno's research correlational?","a":"He measured personality and attitudes but didn't manipulate any variables, so he couldn't show cause","t":"Social influence","id":1277},{"q":"How could research on deindividuation be applied?","a":"Police use CCTV and body cameras to reduce anonymity in crowds","t":"Social influence","id":1278},{"q":"Give a strength of research into deindividuation.","a":"Zimbardo's hood study was a controlled lab experiment showing anonymity increases antisocial behaviour","t":"Social influence","id":1279},{"q":"Give an ethical issue with Zimbardo's deindividuation study.","a":"Participants believed they were giving real electric shocks, which may cause distress","t":"Social influence","id":1280},{"q":"How can social loafing be reduced?","a":"Make individual contributions identifiable, and keep groups small","t":"Social influence","id":1281},{"q":"Give a strength of Latané's (1979) social loafing study.","a":"Controlled lab experiment measuring noise objectively","t":"Social influence","id":1282},{"q":"Give a weakness of Latané's social loafing study.","a":"Only male students, so it can't be generalised to women","t":"Social influence","id":1283},{"q":"Why might culture be a better explanation for crowd behaviour than personality?","a":"Earley found whole cultural groups behaved differently, suggesting social norms matter","t":"Social influence","id":1284},{"q":"Why is it too simplistic to say all collectivist cultures behave the same?","a":"There are individual differences within every culture","t":"Social influence","id":1285},{"q":"Give a strength of the morality explanation of crowd behaviour.","a":"It explains why some people resist antisocial crowds, e.g. Sophie Scholl","t":"Social influence","id":1286},{"q":"Give a weakness of the morality explanation.","a":"Morality is hard to measure objectively","t":"Social influence","id":1287},{"q":"Write a two-tailed hypothesis for Latané's social loafing study.","a":"There will be a difference in the noise produced per person when shouting alone compared with in a group","t":"Social influence","id":1288},{"q":"How can obedience research be applied?","a":"Training people (e.g. nurses, soldiers) to question unethical orders","t":"Social influence","id":1289},{"q":"A researcher tests whether music affects reaction time. What is the IV?","a":"Whether music is played or not","t":"RM","id":1290},{"q":"A researcher tests whether music affects reaction time. What is the DV?","a":"Reaction time (e.g. in milliseconds)","t":"RM","id":1291},{"q":"A researcher tests whether music affects reaction time. Give an extraneous variable.","a":"Time of day, tiredness, noise, or participants' age","t":"RM","id":1292},{"q":"Operationalise 'happiness'.","a":"A score out of 10 on a happiness questionnaire","t":"RM","id":1293},{"q":"Operationalise 'aggression' in an observation.","a":"The number of times a child hits, kicks or pushes in 10 minutes","t":"RM","id":1294},{"q":"Operationalise 'memory'.","a":"The number of words recalled from a list of 20","t":"RM","id":1295},{"q":"A study compares the memory of 15-year-olds and 70-year-olds. What type of experiment is this?","a":"A natural (quasi) experiment – the IV (age) occurs naturally","t":"RM","id":1296},{"q":"Researchers test pupils' recall in their own classroom, changing whether music is playing. What type of experiment is this?","a":"A field experiment","t":"RM","id":1297},{"q":"A researcher asks participants to name as many animals as they can with and without distraction, in a lab. What type of experiment is this?","a":"A laboratory experiment","t":"RM","id":1298},{"q":"Participants do a memory test in silence and then with noise. Which design is this?","a":"Repeated measures","t":"RM","id":1299},{"q":"One group revises with music and a different group revises without. Which design is this?","a":"Independent groups","t":"RM","id":1300},{"q":"Participants are paired by IQ and one of each pair goes into each condition. Which design is this?","a":"Matched pairs","t":"RM","id":1301},{"q":"Give a strength of independent groups design.","a":"No order effects, and participants are less likely to guess the aim","t":"RM","id":1302},{"q":"Give a weakness of independent groups design.","a":"Participant variables between the groups could affect the results","t":"RM","id":1303},{"q":"Give a strength of repeated measures design.","a":"No participant variables, as the same people are in both conditions","t":"RM","id":1304},{"q":"Give a weakness of repeated measures design.","a":"Order effects (practice or fatigue) and demand characteristics","t":"RM","id":1305},{"q":"Give a strength of matched pairs design.","a":"Reduces participant variables and avoids order effects","t":"RM","id":1306},{"q":"Give a weakness of matched pairs design.","a":"Time-consuming and it is impossible to match people exactly","t":"RM","id":1307},{"q":"How do you deal with order effects in repeated measures?","a":"Counterbalancing – half do condition A first and half do B first","t":"RM","id":1308},{"q":"A researcher picks every 10th name from the school register. Which sampling method is this?","a":"Systematic sampling","t":"RM","id":1309},{"q":"A researcher asks people walking past in the high street to take part. Which sampling method is this?","a":"Opportunity sampling","t":"RM","id":1310},{"q":"A researcher puts all students' names in a hat and draws 20. Which sampling method is this?","a":"Random sampling","t":"RM","id":1311},{"q":"A school is 60% girls and 40% boys; the researcher picks 6 girls and 4 boys. Which sampling method is this?","a":"Stratified sampling","t":"RM","id":1312},{"q":"Give a strength of opportunity sampling.","a":"Quick, easy and cheap","t":"RM","id":1313},{"q":"Give a weakness of random sampling.","a":"It can be time-consuming and needs a full list of the target population","t":"RM","id":1314},{"q":"Give a weakness of systematic sampling.","a":"It may not be representative if the list has a pattern","t":"RM","id":1315},{"q":"Give a weakness of stratified sampling.","a":"Time-consuming, and the researcher needs detailed information about the population","t":"RM","id":1316},{"q":"A researcher tells participants the study is about memory when it is really about conformity. Which ethical issue is this?","a":"Deception","t":"RM","id":1317},{"q":"A participant becomes upset but is told to carry on. Which ethical guideline is broken?","a":"Right to withdraw (and protection from harm)","t":"RM","id":1318},{"q":"A researcher publishes participants' names with their results. Which ethical guideline is broken?","a":"Confidentiality","t":"RM","id":1319},{"q":"How can researchers deal with deception?","a":"A full debrief at the end, explaining the true aim and offering to withdraw data","t":"RM","id":1320},{"q":"How can researchers protect participants from harm?","a":"Stop the study if anyone becomes distressed and offer support after","t":"RM","id":1321},{"q":"Calculate the mean of 4, 6, 8, 10, 12.","a":"8","t":"RM","id":1322},{"q":"Find the median of 3, 7, 9, 12, 15.","a":"9","t":"RM","id":1323},{"q":"Find the mode of 2, 4, 4, 5, 7.","a":"4","t":"RM","id":1324},{"q":"Calculate the range of 3, 7, 9, 12, 15.","a":"12","t":"RM","id":1325},{"q":"What is a measure of central tendency?","a":"An average – the mean, median or mode","t":"RM","id":1326},{"q":"When is the median better than the mean?","a":"When there are extreme scores (outliers)","t":"RM","id":1327},{"q":"What is the range?","a":"The difference between the highest and lowest scores – a measure of spread","t":"RM","id":1328},{"q":"What is standard deviation?","a":"A measure of how spread out scores are around the mean","t":"RM","id":1329},{"q":"What does a large standard deviation show?","a":"Scores are widely spread from the mean","t":"RM","id":1330},{"q":"What is a normal distribution?","a":"A symmetrical, bell-shaped curve where mean, median and mode are in the middle","t":"RM","id":1331},{"q":"What is a bar chart used for?","a":"Showing data in separate categories, e.g. mean scores for each condition","t":"RM","id":1332},{"q":"What is a histogram used for?","a":"Showing continuous data, with bars touching","t":"RM","id":1333},{"q":"What should go on the x-axis and y-axis of a bar chart for an experiment?","a":"x-axis – the conditions of the IV; y-axis – the DV","t":"RM","id":1334},{"q":"What is a pilot study?","a":"A small trial run of a study to check the procedure works before the main study","t":"RM","id":1335},{"q":"What is a control group?","a":"A group that doesn't receive the IV, used for comparison","t":"RM","id":1336},{"q":"Why are standardised instructions used?","a":"So every participant gets the same information, reducing extraneous variables","t":"RM","id":1337},{"q":"What is a longitudinal study?","a":"A study of the same participants over a long period of time","t":"RM","id":1338},{"q":"What is a cross-sectional study?","a":"A study comparing different groups (e.g. ages) at one point in time","t":"RM","id":1339},{"q":"Give a strength of a longitudinal study.","a":"It shows how behaviour changes over time in the same people","t":"RM","id":1340},{"q":"Give a weakness of a longitudinal study.","a":"It takes a long time and participants may drop out","t":"RM","id":1341},{"q":"What is a confederate?","a":"Someone who appears to be a participant but is actually working for the researcher","t":"RM","id":1342},{"q":"Why might a researcher use a confederate?","a":"To create a situation, e.g. giving wrong answers in Asch's study","t":"RM","id":1343},{"q":"Name a study that used confederates.","a":"Asch, Milgram, or Piliavin","t":"RM","id":1344},{"q":"What is peer review?","a":"When other experts check a study before it is published","t":"RM","id":1345},{"q":"Sophie touches a hot pan and pulls her hand away before feeling pain. Which part of the nervous system controls this?","a":"A reflex via the spinal cord and peripheral nervous system (without the brain)","t":"Brain & neuropsychology","id":1346},{"q":"Before a race, Jake's heart pounds and his mouth feels dry. Which division of the nervous system is active?","a":"The sympathetic nervous system","t":"Brain & neuropsychology","id":1347},{"q":"After the race, Jake's heart rate slows and he feels hungry. Which division is active now?","a":"The parasympathetic nervous system","t":"Brain & neuropsychology","id":1348},{"q":"Amir decides to raise his hand in class. Which nervous system controls this?","a":"The somatic nervous system","t":"Brain & neuropsychology","id":1349},{"q":"Hana sees a spider, her heart races, and then she realises she is scared. Which theory of emotion is this?","a":"The James-Lange theory","t":"Brain & neuropsychology","id":1350},{"q":"Lucas practises football every day and gets better. How would Hebb explain this?","a":"Repeated practice strengthens the connections between neurons (cell assemblies), so skills become more efficient","t":"Brain & neuropsychology","id":1351},{"q":"After a stroke, Mr Jones can understand speech but struggles to speak. Which area is likely damaged?","a":"Broca's area","t":"Brain & neuropsychology","id":1352},{"q":"After a stroke, Mrs Patel speaks fluently but her sentences make no sense. Which area is likely damaged?","a":"Wernicke's area","t":"Brain & neuropsychology","id":1353},{"q":"A patient can't feel touch on their left hand. Which brain area might be damaged?","a":"The right somatosensory area (parietal lobe)","t":"Brain & neuropsychology","id":1354},{"q":"A patient has lost part of their vision after head injury. Which lobe is likely damaged?","a":"The occipital lobe","t":"Brain & neuropsychology","id":1355},{"q":"A patient struggles with balance and coordination after a car crash. Which brain structure is likely damaged?","a":"The cerebellum","t":"Brain & neuropsychology","id":1356},{"q":"A doctor wants to see if a patient has a brain tumour. Which scan would show the structure?","a":"CT (CAT) scan","t":"Brain & neuropsychology","id":1357},{"q":"A researcher wants to see which brain areas are active during a memory task without using radiation. Which scan should they use?","a":"fMRI","t":"Brain & neuropsychology","id":1358},{"q":"Why might a doctor use a PET scan?","a":"To see which brain areas are active (metabolic activity), e.g. in depression or dementia","t":"Brain & neuropsychology","id":1359},{"q":"Give a strength of CT scans.","a":"Quick and good for detailed images of brain structure","t":"Brain & neuropsychology","id":1360},{"q":"Give a weakness of CT scans.","a":"They use X-rays (radiation) and don't show brain activity","t":"Brain & neuropsychology","id":1361},{"q":"Give a weakness of PET scans.","a":"They use radioactive tracers, are expensive and have poor detail compared with fMRI","t":"Brain & neuropsychology","id":1362},{"q":"Give a weakness of fMRI scans.","a":"Expensive, and people must lie still in a noisy, enclosed machine","t":"Brain & neuropsychology","id":1363},{"q":"What was the IV in Penfield's study?","a":"The area of the brain that was stimulated","t":"Brain & neuropsychology","id":1364},{"q":"What was the DV in Penfield's study?","a":"What the patient reported experiencing","t":"Brain & neuropsychology","id":1365},{"q":"Give an ethical issue with Penfield's study.","a":"Patients were having brain surgery and may have been in a vulnerable state to consent","t":"Brain & neuropsychology","id":1366},{"q":"Why is Penfield's study high in reliability?","a":"The procedure was repeated on over 1,000 patients","t":"Brain & neuropsychology","id":1367},{"q":"Why is Penfield's study not very generalisable?","a":"Only a small percentage showed interpretive cortex responses and all had epilepsy","t":"Brain & neuropsychology","id":1368},{"q":"Give an ethical issue with Tulving's study.","a":"Participants were injected with a radioactive substance","t":"Brain & neuropsychology","id":1369},{"q":"Why might Tulving's study show researcher bias?","a":"Tulving and his wife were participants, and they knew the aim","t":"Brain & neuropsychology","id":1370},{"q":"How could brain scanning research be applied?","a":"Diagnosing brain damage and tumours, and understanding mental illnesses","t":"Brain & neuropsychology","id":1371},{"q":"Give a strength of the fight or flight response.","a":"It helps survival by preparing the body to deal with danger quickly","t":"Brain & neuropsychology","id":1372},{"q":"Why can the fight or flight response be unhelpful today?","a":"Modern stressors (like exams) aren't physical threats, so the response can cause anxiety and health problems","t":"Brain & neuropsychology","id":1373},{"q":"What does the sympathetic nervous system do to the pupils?","a":"Dilates them","t":"Brain & neuropsychology","id":1374},{"q":"What does the parasympathetic nervous system do to heart rate?","a":"Slows it down","t":"Brain & neuropsychology","id":1375},{"q":"What does the sympathetic nervous system do to saliva?","a":"Reduces saliva production (dry mouth)","t":"Brain & neuropsychology","id":1376},{"q":"Give a strength of localisation of function.","a":"Supported by case studies such as Tan (Broca) and brain scans","t":"Brain & neuropsychology","id":1377},{"q":"Give a weakness of localisation of function.","a":"Some functions involve many areas working together, and the brain can reorganise after damage (plasticity)","t":"Brain & neuropsychology","id":1378},{"q":"What is brain plasticity?","a":"The brain's ability to change and form new connections as a result of learning or after damage","t":"Brain & neuropsychology","id":1379},{"q":"Why is Hebb's theory useful for rehabilitation?","a":"If the brain can form new connections, people may regain skills after damage through practice","t":"Brain & neuropsychology","id":1380},{"q":"What is the role of the hypothalamus in fight or flight?","a":"It detects a threat and activates the sympathetic nervous system","t":"Brain & neuropsychology","id":1381},{"q":"Jess remembers her first day at secondary school and how nervous she felt. Which type of memory is this?","a":"Episodic memory","t":"Memory","id":1382},{"q":"Jess knows that water boils at 100°C. Which type of memory is this?","a":"Semantic memory","t":"Memory","id":1383},{"q":"Jess can tie her shoelaces without thinking. Which type of memory is this?","a":"Procedural memory","t":"Memory","id":1384},{"q":"Ali repeats a phone number over and over until he dials it. What is this?","a":"Maintenance rehearsal","t":"Memory","id":1385},{"q":"Ali remembers a list better by grouping the numbers into threes. What is this?","a":"Chunking","t":"Memory","id":1386},{"q":"A student learns French then Spanish and mixes up words. If Spanish words get in the way of recalling French, which interference is this?","a":"Retroactive interference","t":"Memory","id":1387},{"q":"A student revises in the exam hall and recalls more in the exam. Which factor affecting memory explains this?","a":"Context","t":"Memory","id":1388},{"q":"A witness 'remembers' a detail that was only suggested by a police officer. What is this?","a":"A false memory","t":"Memory","id":1389},{"q":"When retelling a film, Sara leaves out many details and adds some exciting ones. Which processes are these?","a":"Levelling and sharpening","t":"Memory","id":1390},{"q":"A student remembers the first and last items on a shopping list. What explains this?","a":"The serial position effect (primacy and recency)","t":"Memory","id":1391},{"q":"Give a strength of Bartlett's study.","a":"It used a realistic task (a story) rather than word lists, so it had more mundane realism than lab memory studies","t":"Memory","id":1392},{"q":"Give an ethical issue with Bartlett's study.","a":"There were few ethical issues – participants just recalled a story","t":"Memory","id":1393},{"q":"Give a strength of McGeoch and McDonald's study.","a":"It was a controlled lab experiment with standardised word lists","t":"Memory","id":1394},{"q":"Give a weakness of McGeoch and McDonald's study.","a":"Small sample (12) and artificial word lists, so it lacks mundane realism","t":"Memory","id":1395},{"q":"What was the IV in McGeoch and McDonald's study?","a":"The type of second list learned (synonyms, antonyms, unrelated words, etc.)","t":"Memory","id":1396},{"q":"What was the DV in McGeoch and McDonald's study?","a":"Recall of the original word list","t":"Memory","id":1397},{"q":"What design was Godden and Baddeley's study?","a":"Repeated measures – each diver took part in all four conditions","t":"Memory","id":1398},{"q":"What sampling method did Godden and Baddeley use?","a":"Volunteer/opportunity sampling – members of a diving club","t":"Memory","id":1399},{"q":"What was the DV in Godden and Baddeley's study?","a":"The number of words recalled","t":"Memory","id":1400},{"q":"What sampling method did Loftus and Pickrell use?","a":"Volunteers (participants recruited with their relatives' help)","t":"Memory","id":1401},{"q":"Give a strength of Loftus and Pickrell's study.","a":"Real childhood events were used, and relatives confirmed which stories were true","t":"Memory","id":1402},{"q":"How could the multi-store model be applied to revision?","a":"Rehearse information repeatedly to transfer it to LTM, and pay attention to avoid losing it from sensory memory","t":"Memory","id":1403},{"q":"How could interference research be applied to revision?","a":"Don't revise similar subjects back-to-back; leave gaps between similar topics","t":"Memory","id":1404},{"q":"Why might context effects be weak in everyday life?","a":"Most everyday contexts aren't as different as land and underwater","t":"Memory","id":1405},{"q":"Give a weakness of the theory of reconstructive memory.","a":"It doesn't explain why some memories (e.g. important events) are very accurate","t":"Memory","id":1406},{"q":"How does Clive Wearing's case support the idea of separate memory types?","a":"He lost episodic memory but kept procedural memory (playing piano)","t":"Memory","id":1407},{"q":"Write a null hypothesis for Godden and Baddeley's study.","a":"There will be no difference in recall whether the learning and recall environments match or not","t":"Memory","id":1408},{"q":"Give an ethical issue with Godden and Baddeley's study.","a":"Diving in cold water could be risky, so participants needed protection from harm","t":"Memory","id":1409},{"q":"Dan has felt low for three weeks, has stopped enjoying football and can't sleep. Could he be diagnosed with depression?","a":"Possibly – symptoms have lasted over 2 weeks, but a doctor would check how many ICD symptoms he has and rule out physical causes","t":"Psychological problems","id":1410},{"q":"Ruby feels extremely excited, talks fast and hardly sleeps, but was very low last month. Which disorder might she have?","a":"Bipolar depression (bipolar affective disorder)","t":"Psychological problems","id":1411},{"q":"Zak thinks 'I failed because I'm stupid, I'll always be stupid, and I ruin everything'. Which attributional style is this?","a":"Internal, stable and global","t":"Psychological problems","id":1412},{"q":"Chloe thinks 'I failed because the test was unfair and it's just this once'. Which attributional style is this?","a":"External and unstable","t":"Psychological problems","id":1413},{"q":"A therapist asks, 'Where is the evidence your friends hate you?'. Which CBT technique is this?","a":"Disputing","t":"Psychological problems","id":1414},{"q":"A therapist asks a client to plan a walk with a friend each day. Which CBT technique is this?","a":"Behavioural activation","t":"Psychological problems","id":1415},{"q":"Tom needs more and more alcohol to feel drunk. Which characteristic of addiction is this?","a":"Tolerance","t":"Psychological problems","id":1416},{"q":"Maria feels shaky and sick when she tries to stop smoking. Which characteristic of addiction is this?","a":"Withdrawal","t":"Psychological problems","id":1417},{"q":"Jay keeps gambling even though he has lost his house. Which characteristic of addiction is this?","a":"Persisting despite harm","t":"Psychological problems","id":1418},{"q":"A teenager starts vaping because all his friends do. Which explanation of addiction is this?","a":"Peer influence (social learning theory / social norms)","t":"Psychological problems","id":1419},{"q":"A man is given Antabuse so he feels sick when he drinks. Which treatment is this?","a":"Aversion therapy","t":"Psychological problems","id":1420},{"q":"Sara attends Alcoholics Anonymous meetings. Which type of treatment is this?","a":"A self-management programme (self-help group)","t":"Psychological problems","id":1421},{"q":"Give a strength of the biological explanation of depression.","a":"It is supported by research such as McNeal and Cimbolic, and it led to drug treatments","t":"Psychological problems","id":1422},{"q":"Give a strength of the genetic explanation of addiction.","a":"Twin studies such as Kaij and Kendler show MZ twins have higher concordance than DZ twins","t":"Psychological problems","id":1423},{"q":"Give a weakness of the genetic explanation of addiction.","a":"MZ concordance isn't 100%, and twins share environments, so nurture is also involved","t":"Psychological problems","id":1424},{"q":"Why is the diathesis-stress model a better explanation of addiction?","a":"It combines genetic vulnerability with environmental triggers, so it is more holistic","t":"Psychological problems","id":1425},{"q":"Give a strength of the peer influence explanation.","a":"It can be applied to prevention, e.g. using positive peer role models","t":"Psychological problems","id":1426},{"q":"Give a strength of aversion therapy.","a":"It can work quickly and deals directly with the addictive behaviour","t":"Psychological problems","id":1427},{"q":"Give an ethical issue with aversion therapy.","a":"It deliberately causes discomfort, such as vomiting, so clients may be distressed","t":"Psychological problems","id":1428},{"q":"Why might aversion therapy be combined with CBT?","a":"Aversion therapy tackles the behaviour and CBT tackles the underlying thoughts, reducing relapse","t":"Psychological problems","id":1429},{"q":"What was the IV in Wiles' study?","a":"Whether participants had antidepressants only or antidepressants plus CBT","t":"Psychological problems","id":1430},{"q":"What was the DV in Wiles' study?","a":"Depression symptoms measured by the BDI","t":"Psychological problems","id":1431},{"q":"What was the sample in Wiles' study?","a":"469 adults with treatment-resistant depression, recruited from GP practices in the UK","t":"Psychological problems","id":1432},{"q":"How did Wiles control participant variables?","a":"Participants were randomly allocated to the two conditions","t":"Psychological problems","id":1433},{"q":"What was the IV in Kaij's study?","a":"Type of twin (MZ or DZ)","t":"Psychological problems","id":1434},{"q":"What was the DV in Kaij's study?","a":"Whether the co-twin was also alcoholic (concordance)","t":"Psychological problems","id":1435},{"q":"What research method did Kaij use to find out about drinking?","a":"Interviews and questionnaires (self-report) plus temperance board records","t":"Psychological problems","id":1436},{"q":"Why might self-report be a problem in Kaij's study?","a":"Twins might under-report their drinking due to social desirability","t":"Psychological problems","id":1437},{"q":"Why might the rising number of mental health diagnoses not mean more illness?","a":"Less stigma and better awareness mean more people seek help and get diagnosed","t":"Psychological problems","id":1438},{"q":"Why is the link between mental illness and crime often misrepresented?","a":"Media headlines exaggerate it, although most violent crime isn't committed by people with mental illness","t":"Psychological problems","id":1439},{"q":"How could stigma around mental health be reduced?","a":"Education, positive media coverage, and people speaking openly about their experiences","t":"Psychological problems","id":1440},{"q":"Why might drugs alone not be enough to treat depression?","a":"They are reductionist and don't deal with negative thinking or life problems","t":"Psychological problems","id":1441}];

function rngFrom(seed){ let a=0; for(const ch of String(seed)) a=(a*31+ch.charCodeAt(0))|0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffleR(a,rng){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pickR = (a,rng) => a[Math.floor(rng()*a.length)];

function goTab(name){
  if(tab==="arcade" && name!=="arcade" && arc.phase==="play") arcFinish();
  if(name!==tab) resetCombo();
  tab=name;
  document.querySelectorAll("[role=tab]").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===tab));
  document.querySelectorAll(".panel").forEach(p=>p.hidden = p.id!=="p-"+tab);
  $(".topics").hidden = tab==="trophies";
  if(tab==="browse") renderBrowse();
  if(tab==="arcade") renderArcade();
  if(tab==="trophies") renderTrophies();
}
document.querySelectorAll("[role=tab]").forEach(b=>b.addEventListener("click",()=>goTab(b.dataset.tab)));

/* ---------- flashcards ---------- */
let filter="all", deck=[], pos=0, flipped=false, sessionRes={}, golds=new Set(), deckXP=0, deckBest=0, deckCombo=0;
function setFilter(f){ filter=f; document.querySelectorAll("[data-filter]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.filter===f)); newDeck(); }
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>setFilter(b.dataset.filter)));
$("#shuffleBtn").onclick=newDeck;
function newDeck(){
  let p = pool();
  if(filter==="notknown") p=p.filter(d=>status(d.id)!=="k");
  if(filter==="learning") p=p.filter(d=>status(d.id)==="l");
  if(filter==="due") p=p.filter(d=>isDue(d.id));
  deck=shuffle(p).map(d=>d.id); pos=0; flipped=false; sessionRes={}; deckXP=0; deckBest=0; deckCombo=0;
  golds=new Set(deck.filter(()=>Math.random()<0.07)); renderCard();
}
function renderCard(){
  const area=$("#cardArea");
  if(!store.sel.length){ area.innerHTML=`<div class="empty"><h3>Pick a topic to start</h3><p>Tap one or more topics above and your flashcards will appear here.</p></div>`; return; }
  if(!deck.length){
    const msg = filter==="due" ? ["Nothing due today 🎉","Cards you know come back for a quick review after 1, 3, 7, 21 and 45 days, just before you'd forget them. Come back tomorrow."] : filter==="learning" ? ["Nothing marked as still learning","When you mark a card as still learning, it will show up here so you can go over it again."] : ["You know every card here","Every question in these topics is marked as known. Try another topic, or switch to all cards for a refresher."];
    area.innerHTML=`<div class="empty"><h3>${msg[0]}</h3><p>${msg[1]}</p></div>`; return;
  }
  if(pos>=deck.length){
    const vals=Object.values(sessionRes), k=vals.filter(v=>v==="k").length, l=vals.filter(v=>v==="l").length;
    area.innerHTML=`<div class="empty"><h3>Deck finished</h3><p>You marked ${k} as got it and ${l} as still learning.${l?" Go round again on the ones that didn't stick yet.":" Nice work."}</p>
      <p style="font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink)">+${deckXP} XP · best run ${deckBest} 🔥</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${l?'<button class="btn" id="againL">Go again: still learning</button>':''}<button class="btn ghost" id="againAll">Shuffle a new deck</button></div></div>`;
    const a=$("#againL"); if(a) a.onclick=()=>{ deck=shuffle(Object.keys(sessionRes).filter(id=>sessionRes[id]==="l").map(Number)); pos=0; sessionRes={}; deckXP=0; deckBest=0; deckCombo=0; golds=new Set(deck.filter(()=>Math.random()<0.1)); flipped=false; renderCard(); };
    $("#againAll").onclick=newDeck; return;
  }
  const d=BY_ID[deck[pos]], t=TMAP[d.t], st=status(d.id), gold=golds.has(d.id), due=isDue(d.id), dn=dueCount();
  const stLabel = st==="k"?'<span class="pill k">Known</span>':st==="l"?'<span class="pill l">Still learning</span>':'';
  area.innerHTML=`${filter!=="due"&&dn?`<div class="duebar">📅 <span><b>${dn} card${dn>1?"s":""}</b> due for review today</span><button class="btn" id="dueGo" style="padding:7px 14px">Review now</button></div>`:""}
    <div class="progressline"><i style="width:${pos/deck.length*100}%"></i></div>
    <div class="stage">
      <div class="card ${flipped?"flipped":""} ${gold?"golden":""}" id="card" style="--c:${t.c}" tabindex="0" role="button" aria-label="Flashcard. Press to ${flipped?"see the question":"reveal the answer"}">
        <div class="face front" aria-hidden="${flipped}">
          <div class="tag">${gold?'<span class="goldtag">✨ Golden card · 5× XP</span>':esc(t.name)+(due?' <span class="pill k" style="margin-left:6px">Review</span>':"")} <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          ${scHTML(d)}<div class="q ${d.sc?"has-sc":""}">${esc(d.q)}</div>${optsHTML(d)}
          <div class="hint">Say or write your answer, then tap the card to check. ${stLabel}</div>
        </div>
        <div class="face back" aria-hidden="${!flipped}">
          <div class="tag">Answer <span class="muted">Card ${pos+1} of ${deck.length}</span></div>
          <div class="q-small">${d.sc?esc(d.sc)+" ":""}${esc(d.q)}</div>
          <div class="a">${fmtAnswer(d.a,d.id)}</div>
        </div>
      </div>
    </div>
    <div class="card-actions">
      <div class="nav"><button id="prevC" aria-label="Previous card" ${pos===0?"disabled":""}>‹</button><button id="nextC" aria-label="Skip to next card">›</button></div>
      <span id="acts" style="display:contents">${actionsHTML()}</span>
    </div>`;
  const dg=$("#dueGo"); if(dg) dg.onclick=()=>setFilter("due");
  const card=$("#card");
  card.onclick=flip; card.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();flip();} };
  $("#prevC").onclick=()=>{ if(pos>0){pos--;flipped=false;renderCard();} };
  $("#nextC").onclick=()=>{ pos++;flipped=false;renderCard(); };
  wireActions();
}
function actionsHTML(){ return flipped
  ? `<button class="btn warn" id="learnBtn">Still learning<kbd>1</kbd></button><button class="btn good" id="gotBtn">Got it<kbd>2</kbd></button>`
  : `<button class="btn" id="flipBtn">Show answer<kbd>Space</kbd></button>`; }
function wireActions(){ if(flipped){ $("#learnBtn").onclick=()=>rate("l"); $("#gotBtn").onclick=()=>rate("k"); } else $("#flipBtn").onclick=flip; }
function flip(){
  const c=$("#card"); if(!c) return;
  const hadFocus = document.activeElement && ["flipBtn","gotBtn","learnBtn"].includes(document.activeElement.id);
  flipped=!flipped; c.classList.toggle("flipped",flipped);
  c.querySelector(".front").setAttribute("aria-hidden",flipped); c.querySelector(".back").setAttribute("aria-hidden",!flipped);
  c.setAttribute("aria-label","Flashcard. Press to "+(flipped?"see the question":"reveal the answer"));
  $("#acts").innerHTML=actionsHTML(); wireActions();
  if(hadFocus) $(flipped?"#gotBtn":"#flipBtn").focus({preventScroll:true});
}
function rate(s){ const id=deck[pos], wasDue=isDue(id); sessionRes[id]=s; mark(id,s);
  deckXP+=answer({ok:s==="k", el:$(s==="k"?"#gotBtn":"#learnBtn"), mode:"cards", gold:golds.has(id), review:wasDue&&s==="k"});
  deckCombo = s==="k" ? deckCombo+1 : 0; if(deckCombo>deckBest) deckBest=deckCombo;
  pos++; flipped=false; renderCard(); const b=$("#flipBtn"); if(b) b.focus({preventScroll:true}); }
document.addEventListener("keydown",e=>{
  if(tab!=="cards" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  if(pos>=deck.length) return;
  if(e.key===" "){ e.preventDefault(); flip(); }
  else if(flipped && e.key==="1") rate("l");
  else if(flipped && e.key==="2") rate("k");
  else if(e.key==="ArrowRight"){ pos++; flipped=false; renderCard(); }
  else if(e.key==="ArrowLeft" && pos>0){ pos--; flipped=false; renderCard(); }
});

/* ---------- quiz ---------- */
const quiz={phase:"setup", size:10, items:[], i:0, shown:false, answers:[], marks:[]};
function renderQuiz(){
  const area=$("#quizArea");
  if(quiz.phase==="setup"){
    const n=pool().length;
    area.innerHTML=`<div class="empty">
      <h3>Quick quiz</h3>
      <p>Get a random set of questions from your chosen topics. Write your answer, check it against the mark scheme, then be honest about whether you got it.</p>
      <div class="size-pick" role="group" aria-label="Number of questions">${[6,8,10].map(s=>`<button aria-pressed="${quiz.size===s}" data-size="${s}" aria-label="${s} questions">${s}</button>`).join("")}</div>
      <button class="btn" id="startQuiz" ${n?"":"disabled"}>Start ${quiz.size}-question quiz</button>
      ${n?"":'<p style="margin-top:14px">Pick at least one topic above first.</p>'}
    </div>`;
    area.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{quiz.size=+b.dataset.size;renderQuiz();});
    const s=$("#startQuiz"); if(s) s.onclick=()=>{ quiz.items=shuffle(pool()).slice(0,quiz.size).map(d=>d.id); quiz.i=0; quiz.shown=false; quiz.answers=[]; quiz.marks=[]; quiz.phase="run"; renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
    return;
  }
  if(quiz.phase==="run"){
    const d=BY_ID[quiz.items[quiz.i]], t=TMAP[d.t], mine=quiz.answers[quiz.i]||"";
    area.innerHTML=`
      <div class="progressline"><i style="width:${quiz.i/quiz.items.length*100}%"></i></div>
      <div class="quiz-q" style="--c:${t.c}">
        <div class="tag">${esc(t.name)} <span class="muted">Question ${quiz.i+1} of ${quiz.items.length}</span></div>
        ${scHTML(d)}<div class="q ${d.sc?"has-sc":""}">${esc(d.q)}</div>${optsHTML(d)}
        ${quiz.shown
          ? `<div class="compare"><div><h4>Your answer</h4>${mine?esc(mine).replace(/\n/g,"<br>"):'<span class="muted">You didn\'t write anything.</span>'}</div><div class="model"><h4>Model answer</h4><div class="a" style="font-size:17px">${fmtAnswer(d.a,d.id)}</div></div></div>
             <div class="card-actions"><button class="btn warn" id="qNo">Not quite</button><button class="btn good" id="qYes">I got it</button></div>`
          : `<label for="qAns" class="muted" style="display:block;margin-bottom:6px;font-size:15px">Your answer</label>
             <textarea id="qAns" placeholder="Write what you remember">${esc(mine)}</textarea>
             <div class="card-actions"><button class="btn" id="qShow">Check answer</button></div>`}
      </div>
      <p style="text-align:right;margin-top:10px"><button class="linkbtn" id="qQuit">Quit quiz</button></p>`;
    $("#qQuit").onclick=()=>{quiz.phase="setup";renderQuiz();};
    if(quiz.shown){
      const next=ok=>{ quiz.marks[quiz.i]=ok; const wasDue=isDue(d.id); mark(d.id, ok?"k":"l"); answer({ok, el:$(ok?"#qYes":"#qNo"), mode:"quiz", review:wasDue&&ok}); quiz.i++; quiz.shown=false; if(quiz.i>=quiz.items.length){ quiz.phase="done"; quizDone(); } renderQuiz(); const ta=$("#qAns"); if(ta) ta.focus(); };
      $("#qYes").onclick=()=>next(true); $("#qNo").onclick=()=>next(false);
      $("#qYes").focus({preventScroll:true});
    } else {
      $("#qShow").onclick=()=>{ quiz.answers[quiz.i]=$("#qAns").value.trim(); quiz.shown=true; renderQuiz(); };
    }
    return;
  }
  const score=quiz.marks.filter(Boolean).length, n=quiz.items.length;
  area.innerHTML=`<div class="empty">
    ${score===n?'<div class="newbest">💯 FLAWLESS · +50 XP</div>':""}
    <p class="score">${score}/${n}</p>
    <p style="margin-top:10px">${score===n?"Full marks. Everything here is now marked as known.":score>=n*0.7?"Solid. The ones you missed are saved as still learning.":"The ones you missed are saved as still learning, so you can drill them in Flashcards."}</p>
    <ul class="results">${quiz.items.map((id,i)=>{const d=BY_ID[id];return `<li class="${quiz.marks[i]?"ok":"no"}"><b>${esc(d.q)}</b>${quiz.marks[i]?"":`<div class="ans">${esc(d.a)}</div>`}</li>`}).join("")}</ul>
    <button class="btn" id="qAgain">New quiz</button>
  </div>`;
  $("#qAgain").onclick=()=>{quiz.phase="setup";renderQuiz();};
}

function quizDone(){ const score=quiz.marks.filter(Boolean).length, n=quiz.items.length; G.st.quizzes++;
  if(score===n){ G.st.perfect++; confetti(220); sfx("lvl"); addXP(50,false); } checkBadges(); save(); }

/* ---- sound ---- */
let actx;
function tone(f,d,type="sine",t0=0,vol=.07){
  if(!G.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+t0;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
function sfx(k){
  if(k==="ok"){ const f=523*Math.pow(1.0595,Math.min(combo,14)); tone(f,.12,"triangle"); tone(f*1.5,.16,"triangle",.06); }
  else if(k==="no") tone(140,.22,"sawtooth",0,.04);
  else if(k==="lvl") [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",i*.09));
  else if(k==="badge") [784,1175,1568].forEach((f,i)=>tone(f,.25,"sine",i*.08));
  else if(k==="gold") [1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,"sine",i*.06,.05));
  else if(k==="tick") tone(880,.05,"square",0,.02);
}

/* ---- confetti ---- */
let parts=[], fxRun=false;
function confetti(n=140){
  if(reduced()) return;
  const cv=$("#fx"), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const cols=TOPICS.map(t=>t.c).concat(["#FFD54A","#4CC896"]);
  for(let i=0;i<n;i++){ const side=i%2; parts.push({x:(side?innerWidth*.85:innerWidth*.15), y:innerHeight*.6, vx:(side?-1:1)*(2+Math.random()*7), vy:-(8+Math.random()*9), r:4+Math.random()*5, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.4, life:0}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const cv=$("#fx"), ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30 && p.life<260);
  parts.forEach(p=>{ p.life++; p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9); ctx.restore(); });
  if(parts.length) requestAnimationFrame(fxLoop); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---- floaters, toasts, modal ---- */
function floater(text, el, cls=""){
  if(reduced()) return;
  let x=innerWidth/2, y=innerHeight/2;
  if(el && el.getBoundingClientRect){ const r=el.getBoundingClientRect(); if(r.width){ x=r.left+r.width/2; y=r.top; } }
  const f=document.createElement("div"); f.className="floater "+cls; f.textContent=text; f.style.left=x+"px"; f.style.top=(y-10)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),1200);
}
function toast(icon,title,sub=""){
  const w=$("#toasts"), t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`<span class="ti">${icon}</span><div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>`;
  w.appendChild(t); while(w.children.length>2) w.firstChild.remove();
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2800);
}
function levelUp(n){
  const old=rankFor(n-1), r=rankFor(n);
  sfx("lvl"); confetti(200);
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="levelup" role="dialog" aria-modal="true" aria-label="Level up"><div class="kick">Level up!</div><div class="num">${n}</div>

function addXP(n, el, label){

function checkStreak(){
  if(!G.last) return;
  const gap=dayNum(today())-dayNum(G.last);
  if(gap<=1) return;
  const missed=gap-1;
  if(G.streak>0 && G.freeze>=missed){
    G.freeze-=missed; const y=new Date(); y.setDate(y.getDate()-1); G.last=ymd(y);
    setTimeout(()=>toast("🧊","Streak freeze used",`Your ${G.streak}-day streak is safe. Hit today's goal to keep it.`),800);
  } else {
    if(G.streak>1) setTimeout(()=>toast("💔",`Your ${G.streak}-day streak ended`,"Start a new one today. Hit your daily goal."),800);
    G.streak=0;
  }
  save();
}
function goalMet(){
  const t=today();
  G.streak = (G.last && dayNum(t)-dayNum(G.last)===1) ? G.streak+1 : 1;
  G.last=t; if(G.streak>G.best) G.best=G.streak;
  confetti(160); sfx("badge");
  toast("🎯","Daily goal smashed! +50 XP", G.streak>1?`🔥 ${G.streak}-day streak`:"Streak started. Come back tomorrow to build it.");
  addXP(50,false);
  if(G.streak%7===0 && G.freeze<2){ G.freeze++; setTimeout(()=>toast("🧊","Streak freeze earned","It saves your streak if you miss a day."),1200); }
}
function answer({ok, el, mode, gold, x2, review}){
  checkStreak();
  const t=today();
  G.st.cards++; if(ok) G.st.right++;
  if(ok){ combo++; if(combo>G.st.combo) G.st.combo=combo; } else combo=0;
  const base = mode==="quiz" ? (ok?15:4) : mode==="arcade" ? (ok?6:1) : (ok?10:3);
  let mult = (ok ? comboMult() : 1) * (x2 ? 2 : 1);
  if(gold && ok){ mult*=5; G.st.gold++; }
  const xp=Math.round(base*mult)+(review?5:0);
  G.hist[t]=(G.hist[t]||0)+1;
  if(gold && ok){ sfx("gold"); confetti(70); } else sfx(ok?"ok":"no");
  addXP(xp, el, "+"+xp+" XP"+(mult>1?"  ×"+mult:""));
  if(!ok) floater("+"+xp+" XP for honesty", el, "meh");
  bumpCombo(ok);
  if(G.hist[t]>=G.goal && G.last!==t) goalMet();
  checkBadges(); save(); renderHud();
  return xp;
}

function mcFor(d, rng=Math.random){
  if(d.wrong){ const right=d.opt||d.a, opts=shuffleR([right,...d.wrong.slice(0,3)],rng); return {opts, correct:opts.indexOf(right)}; }
  const L=d.a.length, seen=new Set([d.a.toLowerCase()]);
  const cands=DATA.filter(x=>x.t===d.t && !x.wrong && Math.abs(x.id-d.id)>2).map(x=>[Math.abs(x.a.length-L)+rng()*40, x.a]).sort((a,b)=>a[0]-b[0]);
  const picks=[];
  for(const [,a] of cands.slice(0,14).sort(()=>rng()-.5)){ const k=a.toLowerCase(); if(!seen.has(k)){ seen.add(k); picks.push(a); } if(picks.length===3) break; }
  const opts=shuffleR([d.a,...picks],rng);
  return {opts, correct:opts.indexOf(d.a)};
}

/* ---- key-term gap fills (built from "What is X?" definitions) ---- */
const TERMS = (()=>{
  const res=[/^What (?:is|are) (?:an? |the )?(.+?)\?$/i, /^Key term: what is meant by '(.+?)'\?$/i], out=[], seen=new Set();
  DATA.forEach(d=>{
    if(d.id>=5000) return;
    let term=null; for(const r of res){ const m=d.q.match(r); if(m){ term=m[1]; break; } }
    if(!term) return;
    term=term.replace(/^['"]|['"]$/g,"").trim();
    if(term.split(/\s+/).length>4 || /\d|^(one|two|three|four|five|the difference|formula|capacity|duration|encoding of|role|aim|purpose|meant|main|key|strength|weakness)\b/i.test(term)) return;
    if(/\b(name|named|names|for|used|responsible|explanation|in|of|studies|study)\b/i.test(term)) return;
    if(/^(very|mainly|unlimited|limited|about|around|up to|\d)/i.test(d.a) || d.a.length<20) return;
    const k=term.toLowerCase(); if(seen.has(k)) return; seen.add(k);
    const main=term.replace(/\s*\(.*?\)\s*/g," ").trim(), paren=(term.match(/\((.*?)\)/)||[])[1];
    const alts=[main, term, paren, main.replace(/^\S+'s\s+/,"")].filter(Boolean);
    let def=d.a; alts.forEach(a=>{ if(a.length>3) def=def.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"_____"); });
    out.push({id:d.id, t:d.t, term:main, alts, def, q:"Key term: "+main, a:d.a});
  });
  return out;
})();
const normT = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"").replace(/s$/,"");
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function termMatch(input, item){ const x=normT(input); if(!x) return false; return item.alts.some(a=>{ const y=normT(a), tol=y.length<5?0:y.length<10?1:2; return lev(x,y)<=tol; }); }

/* ---- save codes ---- */
const b64e = bytes => { let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function makeSave(){
  const json=JSON.stringify({v:1, p:store.p, sel:store.sel, all:store.all, g:store.g});
  if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); return "FOUNT-Z:"+b64e(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "FOUNT-J:"+b64e(new TextEncoder().encode(json));
}
async function readSave(code){
  code=code.trim().replace(/\s+/g,""); let json;
  if(code.startsWith("FOUNT-Z:")){ const st=new Blob([b64d(code.slice(8))]).stream().pipeThrough(new DecompressionStream("gzip")); json=await new Response(st).text(); }
  else if(code.startsWith("FOUNT-J:")) json=new TextDecoder().decode(b64d(code.slice(8)));
  else throw new Error("not a save code");
  const s=JSON.parse(json); if(!s || typeof s.p!=="object" || typeof s.g!=="object") throw new Error("bad save"); return s;
}
async function loadSave(code){
  const msg=$("#saveMsg");
  try{
    const s=await readSave(code), lv=lvlFor(s.g.xp||0), kn=Object.values(s.p).filter(v=>v==="k").length;
    if(!confirm(`Load this save? Level ${lv}, ${(s.g.xp||0).toLocaleString()} XP, ${kn} cards known.\n\nThis replaces the progress on this device (currently level ${lvlFor(G.xp)}).`)) return;
    localStorage.setItem(KEY, JSON.stringify({p:s.p, sel:s.sel||store.sel, all:s.all||store.all, g:s.g}));
    location.reload();
  }catch(e){ msg.innerHTML='<span style="color:var(--warn)">That doesn\'t look like a valid save code. Make sure you copied all of it.</span>'; }
}
function wireSave(){
  const msg=$("#saveMsg");
  $("#saveCopy").onclick=async()=>{ const c=await makeSave(); try{ await navigator.clipboard.writeText(c); msg.textContent=`Save code copied (${c.length.toLocaleString()} characters). Paste it somewhere safe, like an email to yourself or your notes app.`; }catch(e){ $("#saveIn").value=c; $("#saveIn").select(); msg.textContent="Couldn't copy automatically. Your code is in the box: select it all and copy it."; } };
  $("#saveFile").onclick=async()=>{ const c=await makeSave(), a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([c],{type:"text/plain"})); a.download=`fount-save-level-${lvlFor(G.xp)}-${today()}.txt`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); msg.textContent="Backup file downloaded."; };
  $("#saveLoad").onclick=()=>{ const v=$("#saveIn").value; if(v.trim()) loadSave(v); };

const liveStreak = () => { const t=today(); return (G.last===t || (G.last && dayNum(t)-dayNum(G.last)===1)) ? G.streak : 0; };

/* ================= PROGRESS REPORT CODES ================= */
// Format "FR1." + base64url(bytes). Bytes: version, name, then varints/bytes in a fixed order, then a 16-bit checksum.
function varint(arr, n){ n=Math.max(0,Math.floor(n||0)); while(n>=128){ arr.push((n%128)|128); n=Math.floor(n/128); } arr.push(n); }
function readVar(b, p){ let n=0, m=1, x; do{ x=b[p.i++]; if(x===undefined) throw new Error("short"); n+=(x&127)*m; m*=128; }while(x&128); return n; }
const ck16 = bytes => { let h=0x811c9dc5; for(const x of bytes){ h^=x; h=Math.imul(h,16777619)>>>0; } return (h ^ (h>>>16)) & 0xffff; };
const b64u = bytes => b64e(bytes).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => b64d(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
const popcount = n => { let c=0; while(n){ c+=n&1; n=Math.floor(n/2); } return c; };
function makeReport(){
  const bytes=[1];
  const nm=[...new TextEncoder().encode((G.name||"").trim().slice(0,24))].slice(0,40); bytes.push(nm.length, ...nm);
  varint(bytes, dayNum(today())-dayNum("2026-01-01"));
  varint(bytes, G.xp); varint(bytes, knownTotal());
  const ts=topicStats(); ts.forEach(s=>bytes.push(s.k)); ts.forEach(s=>bytes.push(s.l));
  bytes.push(G.st.cards ? Math.round(G.st.right/G.st.cards*100) : 0);
  varint(bytes, liveStreak()); varint(bytes, G.best);
  let bm=0; TOPICS.forEach((t,i)=>{ if(G.bosses[t.key] && G.bosses[t.key].won) bm+=Math.pow(2,i); }); varint(bytes, bm);
  varint(bytes, G.st.cards);
  let act=0; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(G.hist[ymd(d)]) act+=Math.pow(2,i); } varint(bytes, act);
  const c=ck16(bytes); bytes.push(c>>8, c&255);
  return "FR1."+b64u(new Uint8Array(bytes));
}
function parseReport(code){
  const b=unb64u(code.slice(4)); if(b.length<12) throw new Error("short");
  const body=b.slice(0,-2), c=(b[b.length-2]<<8)|b[b.length-1]; if(ck16(body)!==c) throw new Error("checksum");
  const p={i:0}; if(body[p.i++]!==1) throw new Error("version");
  const nl=body[p.i++]; const name=new TextDecoder().decode(body.slice(p.i,p.i+nl)).trim(); p.i+=nl;
  const day=readVar(body,p), xp=readVar(body,p), known=readVar(body,p);
  const k=[], l=[]; for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); k.push(v); }
  for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); l.push(v); }
  const acc=body[p.i++], streak=readVar(body,p), best=readVar(body,p), bm=readVar(body,p), qs=readVar(body,p), act=readVar(body,p);
  if(p.i!==body.length) throw new Error("length");
  const d=new Date(2026,0,1); d.setDate(d.getDate()+day);
  let last=-1; for(let i=0;i<14;i++) if(Math.floor(act/Math.pow(2,i))%2){ last=i; break; }
  return {name:name||"(no name)", date:ymd(d), xp, level:lvlFor(xp), known, k, l, acc, streak, best, bosses:popcount(bm), qs, act14:popcount(act), act7:popcount(act%128), lastDaysAgo:last};
}

      <p class="muted" style="text-align:center">Keys: <b>Space</b> reveal / next · <b>1–6</b> give a team the point · nothing here is saved or affects students' XP.</p>
    </div></div>`;
  tp.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; P.sel=P.sel.includes(k)?P.sel.filter(x=>x!==k):[...P.sel,k]; projSetup(); });
  $("#pMock").onclick=()=>{ P.sel=[...MOCK_TOPICS]; projSetup(); };
  $("#pAll").onclick=()=>{ P.sel=TOPICS.map(t=>t.key); projSetup(); };
  tp.querySelectorAll("[data-teams]").forEach(b=>b.onclick=()=>{ const n=+b.dataset.teams; while(P.teams.length<n) P.teams.push("Team "+(P.teams.length+1)); P.teams=P.teams.slice(0,n); projSetup(); });
  tp.querySelectorAll("[data-team]").forEach(inp=>inp.oninput=()=>{ P.teams[+inp.dataset.team]=inp.value||("Team "+(+inp.dataset.team+1)); });
  tp.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ P.n=+b.dataset.n; projSetup(); });
  tp.querySelectorAll("[data-secs]").forEach(b=>b.onclick=()=>{ P.secs=+b.dataset.secs; projSetup(); });
  $("#pFull").onclick=projFull; $("#pExit").onclick=()=>{ clearInterval(P.timer); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
  $("#pGo").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); projQ(); };
}
function projFull(){ const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }
function projScore(){ return `<div class="proj-scores">${P.teams.map((t,i)=>`<button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b><span class="pts">${P.scores[i]}</span></button>`).join("")}</div>`; }
function projQ(){
  clearInterval(P.timer); P.revealed=false; P.awarded=new Set();
  const d=P.items[P.i], t=TMAP[d.t];
  P.opts = d.wrong ? mcFor(d, rngFrom("proj-"+d.id+"-"+P.i)) : null;
  $("#teacherApp").innerHTML=`<div class="proj play" style="--c:${t.c}"><div class="proj-bar"><b>Question ${P.i+1} of ${P.items.length}</b><span class="proj-topic">${esc(t.name)}</span><span class="spacer"></span><span class="proj-time" id="pTime"></span><button class="btn ghost" id="pFull">⛶</button><button class="btn ghost" id="pEnd">End</button></div>
    ${P.secs?`<div class="timebar" id="ptb"><i id="ptbFill"></i></div>`:""}
    <div class="proj-card">${d.sc?`<div class="proj-sc">${esc(d.sc)}</div>`:""}<div class="proj-q">${esc(d.q)}</div>
      ${P.opts?`<ol class="proj-opts">${P.opts.opts.map((o,i)=>`<li data-o="${i}">${esc(o)}</li>`).join("")}</ol>`:""}
      <div class="proj-a" id="pAns" hidden><div class="tag">Answer</div><div class="a">${P.opts?esc(P.opts.opts[P.opts.correct]):fmtAnswer(d.a,d.id)}</div></div></div>
    <div class="proj-actions"><button class="btn proj-go" id="pReveal">Reveal answer <kbd>Space</kbd></button></div>
    ${projScore()}</div>`;
  wireProj();
  if(P.secs){ P.end=Date.now()+P.secs*1000; P.timer=setInterval(projTick,100); projTick(); }
}
function projTick(){
  const left=P.end-Date.now(), f=$("#ptbFill"), tm=$("#pTime"); if(!f){ clearInterval(P.timer); return; }
  f.style.width=Math.max(0,left/(P.secs*1000)*100)+"%"; $("#ptb").classList.toggle("low", left<5000);
  tm.textContent=Math.max(0,Math.ceil(left/1000))+"s";
  if(left<=0){ clearInterval(P.timer); tm.textContent="Time!"; sfx("no"); }
}
function wireProj(){
  $("#pFull").onclick=projFull;
  $("#pEnd").onclick=projEnd;
  const r=$("#pReveal"); if(r) r.onclick=projReveal;
  document.querySelectorAll("[data-award]").forEach(b=>b.onclick=()=>projAward(+b.dataset.award));
  const n=$("#pNext"); if(n) n.onclick=projNext;
  const nb=$("#pNobody"); if(nb) nb.onclick=projNext;
}
function projReveal(){
  if(P.revealed) return; P.revealed=true; clearInterval(P.timer);
  $("#pAns").hidden=false; sfx("badge");
  if(P.opts){ document.querySelectorAll(".proj-opts li").forEach(li=>li.classList.add(+li.dataset.o===P.opts.correct?"right":"dim")); }
  document.querySelector(".proj-actions").innerHTML=`<button class="btn ghost" id="pNobody">Nobody got it</button><button class="btn proj-go" id="pNext">${P.i+1>=P.items.length?"See the winners":"Next question"} <kbd>Space</kbd></button>`;
  document.querySelector(".proj-scores").outerHTML=projScore();
  wireProj();
}
function projAward(i){
  if(!P.revealed || i>=P.teams.length) return;
  if(P.awarded.has(i)){ P.awarded.delete(i); P.scores[i]--; } else { P.awarded.add(i); P.scores[i]++; sfx("ok"); confetti(40); }
  document.querySelector(".proj-scores").outerHTML=projScore(); wireProj();
}
function projNext(){ P.i++; if(P.i>=P.items.length) projEnd(); else projQ(); }
function projEnd(){
  clearInterval(P.timer);
  const order=P.teams.map((t,i)=>({t,s:P.scores[i]})).sort((a,b)=>b.s-a.s);
  const top=order[0]?order[0].s:0, winners=order.filter(o=>o.s===top);
  const pod=[order[1],order[0],order[2]];
  $("#teacherApp").innerHTML=`<div class="proj"><div class="proj-bar"><b>📽️ Final scores</b><span class="spacer"></span><button class="btn ghost" id="pFull">⛶</button></div>
    <h2 class="proj-win">${winners.length>1?"It's a draw! 🤝":"🏆 "+esc(winners[0].t)+" wins!"}</h2>
    <div class="podium">${pod.map((o,j)=>o?`<div class="pod p${[2,1,3][j]}"><b>${esc(o.t)}</b><span>${o.s} pt${o.s===1?"":"s"}</span><div class="block">${[2,1,3][j]}</div></div>`:"<div></div>").join("")}</div>
    ${order.length>3?`<p class="muted" style="text-align:center">${order.slice(3).map((o,j)=>`${j+4}. ${esc(o.t)} (${o.s})`).join(" · ")}</p>`:""}
    <div class="proj-actions"><button class="btn proj-go" id="pAgain">Play again</button><button class="btn ghost" id="pSetup">Change settings</button><button class="btn ghost" id="pExit">Back to teacher tools</button></div></div>`;
  sfx("lvl"); confetti(260);
  $("#pFull").onclick=projFull;
  $("#pAgain").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); projQ(); };
  $("#pSetup").onclick=projSetup;
  $("#pExit").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
}
document.addEventListener("keydown",e=>{
  if(!TEACHER || !document.querySelector(".proj.play") || e.target.matches("input,textarea")) return;
  if(e.key===" "){ e.preventDefault(); P.revealed ? projNext() : projReveal(); }
  else if(/^[1-6]$/.test(e.key)){ e.preventDefault(); projAward(+e.key-1); }
});

/* ---- student side: progress report box (rendered inside Trophies) ---- */
function reportBoxHTML(){
  return `<div class="box"><h3>📨 Send your progress to your teacher <small>A short code with your level, topics and streak</small></h3>
    <label class="muted" for="repName" style="display:block;font-size:15px;margin-bottom:6px">Your name or initials (only saved in this browser)</label>
    <input id="repName" class="search" maxlength="24" value="${esc(G.name||"")}" placeholder="e.g. Sam P" style="width:100%">
    <div class="card-actions"><button class="btn" id="repCopy">Copy progress report code</button></div>
    <p class="muted" style="margin:10px 0 0;font-size:15px">Paste it into Google Classroom, Teams or an email to your teacher. It doesn't include your save, just a summary.</p>
    <p id="repMsg" style="margin:8px 0 0;font-size:15px;word-break:break-all" aria-live="polite"></p></div>`;
}
function wireReport(){
  const n=$("#repName"); if(!n) return;
  n.oninput=()=>{ G.name=n.value.trim().slice(0,24); save(); };
  $("#repCopy").onclick=async()=>{
    if(!G.name){ n.focus(); $("#repMsg").innerHTML='<span style="color:var(--warn)">Type your name or initials first, so your teacher knows it\'s you.</span>'; return; }
    const c=makeReport();
    try{ await navigator.clipboard.writeText(c); $("#repMsg").innerHTML=`<span style="color:var(--good)">Copied ✓</span> <code>${esc(c)}</code>`; }
    catch(e){ $("#repMsg").innerHTML=`Copy this code: <code>${esc(c)}</code>`; }
  };
}

if(TEACHER){ startTeacher(); }
else { checkStreak(); checkBadges(); save(); renderMeter(); renderChips(); newDeck(); renderQuiz(); renderHud(); renderArcade(); }
</script>
</body>
</html>
