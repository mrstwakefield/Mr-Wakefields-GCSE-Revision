id":317},{"q":"What range of values can a correlation coefficient take?","a":"From -1 to +1","t":"RM","id":318},{"q":"Write a correlational hypothesis.","a":"There will be a positive correlation between height and shoe size","t":"RM","id":319},{"q":"Why do psychologists rarely find causation in correlations?","a":"Correlations only show a relationship – another variable could cause both","t":"RM","id":320},{"q":"Give a strength of correlations.","a":"They can be used when it would be unethical to manipulate variables, and can show relationships to study further","t":"RM","id":321},{"q":"Give a weakness of correlations.","a":"They can't show cause and effect, and need numerical data","t":"RM","id":322},{"q":"What is an anomalous result?","a":"An extreme score that doesn't fit the pattern of the other results","t":"RM","id":323},{"q":"If an observation is controlled, is it likely to have high or low internal and external validity?","a":"High internal validity but low external (ecological) validity","t":"RM","id":324},{"q":"Why might a covert observation be unethical?","a":"Participants don't know they are being watched, so they can't give informed consent","t":"RM","id":325},{"q":"Why are demand characteristics a problem in overt observations?","a":"Participants know they are being watched so may change their behaviour","t":"RM","id":326},{"q":"Why can the observer being a participant reduce validity?","a":"They may become too involved and lose objectivity","t":"RM","id":327},{"q":"Why are longitudinal studies often subject to researcher bias?","a":"The researcher spends a long time with participants and may become attached or subjective","t":"RM","id":328},{"q":"What is social influence?","a":"The effects that other people can have on our opinions or behaviour","t":"Social influence","id":329},{"q":"What is conformity?","a":"Changing your opinions or behaviour to fit in with a group, because of real or imagined group pressure","t":"Social influence","id":330},{"q":"What is normative social influence?","a":"Conforming because we want to be liked and accepted by the group, to avoid rejection","t":"Social influence","id":331},{"q":"What is informational social influence?","a":"Conforming because we want to be right – we assume others know better, especially in ambiguous situations","t":"Social influence","id":332},{"q":"Who proposed normative and informational social influence?","a":"Deutsch and Gerard","t":"Social influence","id":333},{"q":"What is a social (situational) factor?","a":"A feature of the situation or other people that affects our behaviour","t":"Social influence","id":334},{"q":"What is a dispositional factor?","a":"A personal characteristic (e.g. personality) that affects our behaviour","t":"Social influence","id":335},{"q":"Identify the three social factors that affect conformity.","a":"Group size, Anonymity, Task difficulty","t":"Social influence","id":336},{"q":"Identify two dispositional factors that affect conformity.","a":"Personality (locus of control), Expertise","t":"Social influence","id":337},{"q":"In what decade was Asch's study of conformity?","a":"The 1950s (1951)","t":"Social influence","id":338},{"q":"What was Asch's aim?","a":"To see whether people would conform to a majority giving an obviously wrong answer","t":"Social influence","id":339},{"q":"In what country was Asch's study conducted?","a":"The USA","t":"Social influence","id":340},{"q":"What gender were the participants in Asch's study?","a":"All male (American college students)","t":"Social influence","id":341},{"q":"Describe the procedure of Asch's study.","a":"A real participant sat with a group of confederates and they each said aloud which of three comparison lines matched a stimulus line; on critical trials the confederates all gave the same wrong answer","t":"Social influence","id":342},{"q":"How many confederates were there in each run of Asch's original experiment?","a":"7–8 confederates (with one real participant)","t":"Social influence","id":343},{"q":"How many critical trials were there in Asch's study?","a":"12 (out of 18 trials)","t":"Social influence","id":344},{"q":"What was the average conformity rate in Asch's study?","a":"36.8%","t":"Social influence","id":345},{"q":"What percentage of participants conformed at least once in Asch's study?","a":"75%","t":"Social influence","id":346},{"q":"What percentage of participants never conformed in Asch's study?","a":"25%","t":"Social influence","id":347},{"q":"What percentage of participants conformed every time in Asch's study?","a":"5%","t":"Social influence","id":348},{"q":"What did Asch find when he varied group size?","a":"With 2 confederates conformity was 13.6%, with 3 it rose to 31.8%, and adding more made little difference","t":"Social influence","id":349},{"q":"What did Asch find when participants wrote their answers down (anonymity)?","a":"Conformity dropped","t":"Social influence","id":350},{"q":"What did Asch find when he made the task more difficult?","a":"Conformity increased, as participants were less certain and looked to others","t":"Social influence","id":351},{"q":"Is the effect of task difficulty on conformity due to normative or informational social influence?","a":"Informational – people look to others for the right answer","t":"Social influence","id":352},{"q":"Is the effect of anonymity on conformity due to normative or informational social influence?","a":"Normative – when answers are private there is no fear of rejection","t":"Social influence","id":353},{"q":"Give a strength of Asch's study.","a":"Lab experiment with standardised procedures, so it can be replicated and is reliable","t":"Social influence","id":354},{"q":"Give a weakness of Asch's study relating to the task.","a":"Low mundane realism – judging line lengths is not an everyday task","t":"Social influence","id":355},{"q":"Give an ethical issue with Asch's study.","a":"Deception – participants were told it was a vision test; they may have felt embarrassed","t":"Social influence","id":356},{"q":"Why does Asch's study lack generalisability?","a":"Only white, male American college students were used","t":"Social influence","id":357},{"q":"Asch's study lacks temporal validity. What does that mean?","a":"The results may not apply today because the 1950s USA was a very conformist time","t":"Social influence","id":358},{"q":"Write a two-tailed hypothesis for Asch's study.","a":"There will be a difference in the number of wrong answers given when participants are alone and when they are with a group giving wrong answers","t":"Social influence","id":359},{"q":"In a study on conformity, who is the target population?","a":"People in general","t":"Social influence","id":360},{"q":"Who developed locus of control?","a":"Julian Rotter (1966)","t":"Social influence","id":361},{"q":"What is an internal locus of control?","a":"Believing you are mostly responsible for what happens to you","t":"Social influence","id":362},{"q":"What is an external locus of control?","a":"Believing that what happens to you is due to outside forces, like luck or other people","t":"Social influence","id":363},{"q":"Who is more likely to conform – people with an internal or external locus of control?","a":"External locus of control","t":"Social influence","id":364},{"q":"Describe Burger and Cooper's (1979) study.","a":"Participants rated cartoons for funniness beside a confederate who gave his ratings aloud; people with an external locus of control agreed with the confederate more","t":"Social influence","id":365},{"q":"What personality traits might make a person more likely to conform?","a":"External locus of control, low self-esteem, low confidence, need for approval","t":"Social influence","id":366},{"q":"What is expertise?","a":"Competence, skill or knowledge in a particular area","t":"Social influence","id":367},{"q":"How does being an expert affect your likelihood of conforming?","a":"Experts are less likely to conform because they are confident in their own answer","t":"Social influence","id":368},{"q":"How does having an expert in the group affect conformity?","a":"Others are more likely to conform to the expert, because they assume the expert is right","t":"Social influence","id":369},{"q":"What did Lucas et al. (2006) find?","a":"Students conformed to wrong answers more on difficult maths problems, especially if they thought they were poor at maths","t":"Social influence","id":370},{"q":"Define obedience.","a":"Following direct orders from someone with authority","t":"Social influence","id":371},{"q":"What is the difference between conformity and obedience?","a":"Conformity involves peers and pressure can be imagined; obedience involves a direct order from an authority figure in a hierarchy","t":"Social influence","id":372},{"q":"What was the aim of Milgram's study?","a":"To investigate whether ordinary people would obey an unjust order from an authority figure to harm an innocent person","t":"Social influence","id":373},{"q":"What did Milgram tell participants his study was about?","a":"The effect of punishment on memory and learning","t":"Social influence","id":374},{"q":"Describe the sample in Milgram's study.","a":"40 American men aged 20–50, with jobs from unskilled to professional, recruited by newspaper adverts (volunteer sample)","t":"Social influence","id":375},{"q":"Where was Milgram's study conducted?","a":"Yale University, USA","t":"Social influence","id":376},{"q":"Who was the 'learner' in Milgram's study?","a":"A confederate called Mr Wallace","t":"Social influence","id":377},{"q":"How were roles decided in Milgram's study?","a":"A rigged draw – the real participant was always the 'teacher'","t":"Social influence","id":378},{"q":"What did the participant have to do in Milgram's study?","a":"Give electric shocks (from 15V to 450V) to the learner every time he got an answer wrong","t":"Social influence","id":379},{"q":"What percentage of participants shocked up to 300 volts in Milgram's study?","a":"100%","t":"Social influence","id":380},{"q":"What percentage of participants went to the full 450 volts?","a":"65%","t":"Social influence","id":381},{"q":"How many participants stopped at 300 volts?","a":"5 (12.5%)","t":"Social influence","id":382},{"q":"What signs of stress did Milgram's participants show?","a":"Sweating, trembling, biting lips, groaning, digging nails into hands; three had seizures","t":"Social influence","id":383},{"q":"What did Milgram conclude?","a":"Obedience is due to the situation (e.g. a legitimate authority figure), not personality","t":"Social influence","id":384},{"q":"Give an ethical issue with Milgram's study.","a":"Deception (it wasn't about memory and shocks weren't real), Psychological harm (extreme stress), Right to withdraw was made difficult (prods)","t":"Social influence","id":385},{"q":"Give a strength of Milgram's study.","a":"It was highly controlled with standardised procedures, so it could be replicated","t":"Social influence","id":386},{"q":"Did Milgram's study have gender bias?","a":"Yes – only men were used, so results may not apply to women","t":"Social influence","id":387},{"q":"Why might Milgram's study lack internal validity?","a":"Participants may have guessed the shocks were fake and just played along","t":"Social influence","id":388},{"q":"Give a social factor affecting obedience.","a":"Agency theory, Culture (social hierarchy), Proximity","t":"Social influence","id":389},{"q":"What is Milgram's agency theory?","a":"People obey by acting as an 'agent' for an authority figure, believing the authority will take responsibility","t":"Social influence","id":390},{"q":"What is the autonomous state?","a":"When a person acts on their own free will and feels responsible for their actions","t":"Social influence","id":391},{"q":"What is the agentic state?","a":"When a person sees themselves as carrying out someone else's wishes and not responsible for their actions","t":"Social influence","id":392},{"q":"What is the agentic shift?","a":"Moving from the autonomous state to the agentic state when faced with an authority figure","t":"Social influence","id":393},{"q":"What is moral strain?","a":"The anxiety we feel when we are asked to do something we believe is wrong","t":"Social influence","id":394},{"q":"What is a social hierarchy?","a":"A system where some people have more authority than others, e.g. parents over children","t":"Social influence","id":395},{"q":"How does culture affect obedience?","a":"We learn from our culture to respect authority and social hierarchies","t":"Social influence","id":396},{"q":"How does location affect obedience?","a":"Obedience fell when Milgram moved the study from prestigious Yale to a run-down office, because authority seemed less legitimate","t":"Social influence","id":397},{"q":"How does proximity to the victim affect obedience?","a":"When the participant was closer to the learner, obedience fell because moral strain increased","t":"Social influence","id":398},{"q":"How does proximity to the authority figure affect obedience?","a":"When the experimenter gave orders by phone, obedience fell","t":"Social influence","id":399},{"q":"How does a uniform affect obedience?","a":"A uniform (e.g. a lab coat) is a visual symbol of authority, so it increases obedience","t":"Social influence","id":400},{"q":"Give an example of how someone may make their authority legitimate.","a":"Wearing a uniform, being in a prestigious setting, or having an official title","t":"Social influence","id":401},{"q":"What is the 'obedience alibi' criticism of Milgram?","a":"His situational explanation could excuse people for terrible acts, e.g. Nazis saying they were just following orders","t":"Social influence","id":402},{"q":"Whose theory is the authoritarian personality?","a":"Adorno (1950)","t":"Social influence","id":403},{"q":"What is the authoritarian personality?","a":"A personality type with exaggerated respect for authority, who obeys orders and looks down on people of lower status","t":"Social influence","id":404},{"q":"What relationship with parents did Adorno find people with an authoritarian personality had?","a":"Very strict parents who used harsh discipline and conditional love","t":"Social influence","id":405},{"q":"What questionnaire did Adorno use?","a":"The F-scale (fascism scale)","t":"Social influence","id":406},{"q":"Give a weakness of Adorno's research.","a":"It used a flawed questionnaire (the F-scale) created by Adorno, and it is correlational so can't show cause","t":"Social influence","id":407},{"q":"What is the difference between Milgram's and Adorno's explanations of obedience?","a":"Milgram says obedience is caused by the situation; Adorno says it is caused by personality (disposition)","t":"Social influence","id":408},{"q":"What is a bystander?","a":"A person who witnesses an event where someone needs help","t":"Social influence","id":409},{"q":"What is bystander intervention?","a":"When a person helps someone in need","t":"Social influence","id":410},{"q":"What is bystander apathy?","a":"When people do not help someone in need","t":"Social influence","id":411},{"q":"What is diffusion of responsibility?","a":"Being less likely to help when other bystanders are present, because responsibility is shared","t":"Social influence","id":412},{"q":"What is pluralistic ignorance?","a":"When no-one helps because everyone assumes the situation isn't an emergency, as no-one else is reacting","t":"Social influence","id":413},{"q":"Who was Kitty Genovese?","a":"A woman murdered in New York in 1964; many neighbours heard or saw the attack but didn't intervene","t":"Social influence","id":414},{"q":"Describe Latané and Darley's (1968) smoke-filled room study.","a":"Participants filled in a survey as a room filled with smoke, either alone, with 2 confederates who ignored it, or with 2 real participants; people alone were much more likely to report it","t":"Social influence","id":415},{"q":"What was Piliavin's study called?","a":"Good Samaritanism: an underground phenomenon? (1969)","t":"Social influence","id":416},{"q":"Where did Piliavin's study take place?","a":"On the New York subway","t":"Social influence","id":417},{"q":"What type of experiment was Piliavin's study?","a":"A field experiment","t":"Social influence","id":418},{"q":"In Piliavin's study there were two conditions. What were they?","a":"A victim carrying a cane (appeared ill/blind), A victim who appeared drunk (smelled of alcohol, carried a bottle)","t":"Social influence","id":419},{"q":"What did Piliavin measure?","a":"Whether people helped, how quickly, and who helped","t":"Social influence","id":420},{"q":"How often did the cane (blind) victim receive help?","a":"95% of the time","t":"Social influence","id":421},{"q":"How often did the drunk victim receive help?","a":"50% of the time","t":"Social influence","id":422},{"q":"What else did Piliavin find?","a":"Men were more likely to help, and there was no diffusion of responsibility on the busy train","t":"Social influence","id":423},{"q":"Write a one-tailed hypothesis for Piliavin's study.","a":"The victim with a cane will receive help more often than the drunk victim","t":"Social influence","id":424},{"q":"Give a strength of Piliavin's study.","a":"Field experiment, so passengers behaved naturally (high ecological validity)","t":"Social influence","id":425},{"q":"Give an ethical issue with Piliavin's study.","a":"Passengers didn't know they were in a study, so there was no informed consent or debrief, and they may have been distressed","t":"Social influence","id":426},{"q":"Why might Piliavin's study lack temporal validity?","a":"It took place in 1969; people's attitudes to strangers and drunkenness may have changed","t":"Social influence","id":427},{"q":"Identify two social factors which affect bystander behaviour.","a":"Presence of others, Cost of helping","t":"Social influence","id":428},{"q":"Identify two dispositional factors which affect bystander behaviour.","a":"Similarity to the victim, Expertise","t":"Social influence","id":429},{"q":"How does the presence of others affect bystander behaviour?","a":"The more people present, the less likely we are to help, due to diffusion of responsibility","t":"Social influence","id":430},{"q":"How does the cost of helping affect bystander behaviour?","a":"If the cost (e.g. risk or effort) is greater than the reward, we are less likely to help","t":"Social influence","id":431},{"q":"How does similarity to the victim affect bystander behaviour, and why?","a":"We are more likely to help people like us because we feel more empathy for them","t":"Social influence","id":432},{"q":"Describe Levine et al.'s (2005) study.","a":"Manchester United fans were more likely to help an injured stranger wearing a Man U shirt than one wearing a Liverpool shirt","t":"Social influence","id":433},{"q":"How does expertise affect bystander behaviour, and why?","a":"People with expertise (e.g. first aid) are more likely to help because they feel confident and responsible","t":"Social influence","id":434},{"q":"Describe Cramer et al.'s (1988) study.","a":"When a workman fell off a ladder, registered nurses were more likely to help than people without medical training","t":"Social influence","id":435},{"q":"Define antisocial behaviour.","a":"Acting in ways that are socially unacceptable and don't respect other people's rights","t":"Social influence","id":436},{"q":"What is pro-social behaviour?","a":"Behaviour that helps or benefits other people","t":"Social influence","id":437},{"q":"Define collective behaviour.","a":"Behaviour that emerges when people are part of a group, which may differ from how they behave alone","t":"Social influence","id":438},{"q":"What is crowd behaviour?","a":"The behaviour of a large, temporary gathering of people with a common focus","t":"Social influence","id":439},{"q":"Name the social factors affecting crowd and collective behaviour.","a":"Deindividuation, Social loafing, Culture","t":"Social influence","id":440},{"q":"Name the dispositional factors affecting crowd and collective behaviour.","a":"Personality (locus of control), Morality","t":"Social influence","id":441},{"q":"Define deindividuation.","a":"Losing your sense of personal identity and responsibility in a group, so you take on the group's values","t":"Social influence","id":442},{"q":"When is deindividuation most likely?","a":"In large groups, when anonymous, or when wearing a uniform","t":"Social influence","id":443},{"q":"How does anonymity affect deindividuation?","a":"The more anonymous we are, the more deindividuated we become and the more likely we are to behave antisocially","t":"Social influence","id":444},{"q":"Describe Zimbardo's (1969) deindividuation study.","a":"Female students gave electric shocks to a confederate; those wearing hoods and identical coats gave twice as many shocks as those with name badges","t":"Social influence","id":445},{"q":"What is social loafing?","a":"Putting in less effort when working in a group than when working alone","t":"Social influence","id":446},{"q":"Describe Ringelmann's research.","a":"He measured individual pulling in tug-of-war and found individual effort decreased as group size increased","t":"Social influence","id":447},{"q":"Describe Latané's (1979) social loafing study.","a":"84 male students shouted as loudly as possible alone, in pairs or in groups of six; individuals made less noise as the group got bigger","t":"Social influence","id":448},{"q":"Define individualist culture.","a":"A culture that focuses on the needs and goals of the individual, e.g. the USA and UK","t":"Social influence","id":449},{"q":"Define collectivist culture.","a":"A culture that focuses on the needs of the group, family and society, e.g. China or Korea","t":"Social influence","id":450},{"q":"Which type of culture is more likely to show social loafing?","a":"Individualist","t":"Social influence","id":451},{"q":"Describe Earley's (1989) study.","a":"Chinese participants put the same effort into tasks whether identifiable or not; American participants tried harder when identifiable","t":"Social influence","id":452},{"q":"How would culture affect antisocial behaviour?","a":"Collectivist cultures focus on the group, so people may be less likely to act antisocially in crowds","t":"Social influence","id":453},{"q":"How does personality affect crowd behaviour?","a":"People with an external locus of control are more influenced by the crowd","t":"Social influence","id":454},{"q":"How does morality affect crowd behaviour?","a":"People with strong moral principles guide their own behaviour and are less influenced by the group","t":"Social influence","id":455},{"q":"Give an example of someone with strong morality resisting the crowd.","a":"Sophie Scholl, who distributed anti-Nazi leaflets despite the danger","t":"Social influence","id":456},{"q":"What are the named studies for Social influence?","a":"Asch (conformity), Milgram (obedience), Piliavin (bystander intervention)","t":"Social influence","id":457},{"q":"What is the difference between an overt and a covert observation?","a":"In an overt observation participants know they are being watched; in a covert observation they don't","t":"RM","id":458},{"q":"What is a naturalistic observation?","a":"Watching behaviour in its natural setting without interfering","t":"RM","id":459},{"q":"What is a controlled observation?","a":"Watching behaviour in a controlled environment set up by the researcher","t":"RM","id":460},{"q":"What is a participant observation?","a":"The observer joins in with the group being observed","t":"RM","id":461},{"q":"What is a non-participant observation?","a":"The observer watches from outside the group","t":"RM","id":462},{"q":"What are behavioural categories?","a":"Clearly defined, measurable behaviours that observers look for and record","t":"RM","id":463},{"q":"Give a weakness of observations.","a":"Observers don't know why behaviour happens; observer bias; categories may miss behaviours","t":"RM","id":464},{"q":"What is observer bias?","a":"When the observer's expectations affect what they record","t":"RM","id":465},{"q":"What is inter-observer reliability?","a":"When two or more observers watch the same behaviour and agree on what they recorded","t":"RM","id":466},{"q":"I collect my class's test scores as percentages. What type of data is this?","a":"Quantitative (and primary) data","t":"RM","id":467},{"q":"What is internal validity?","a":"Whether a study measures what it intended to measure (the IV caused the change in the DV)","t":"RM","id":468},{"q":"What is external validity?","a":"Whether the results can be applied outside the study to other settings and people","t":"RM","id":469},{"q":"Does external validity mean confidence inside or outside the confines of the experiment?","a":"Outside – that the results apply beyond the study","t":"RM","id":470},{"q":"What is ecological validity?","a":"Whether the results can be applied to real-life settings","t":"RM","id":471},{"q":"What is temporal validity?","a":"Whether the results still apply over time","t":"RM","id":472},{"q":"What is a standardised procedure?","a":"Using the same method and instructions for every participant","t":"RM","id":473},{"q":"Name the four sampling methods.","a":"Random, Opportunity, Systematic, Stratified","t":"RM","id":474},{"q":"Name a sampling method which cannot have selector bias.","a":"Random sampling","t":"RM","id":475},{"q":"Why might a systematic sample be subject to selector bias?","a":"The researcher chooses the starting point and interval","t":"RM","id":476},{"q":"Why might a stratified sample be subject to selector bias?","a":"The researcher decides which subgroups to use","t":"RM","id":477},{"q":"Give a strength of stratified sampling.","a":"It is the most representative method, as all subgroups are included in proportion","t":"RM","id":478},{"q":"What is generalisability?","a":"Whether results from the sample can be applied to the whole target population","t":"RM","id":479},{"q":"In independent groups, how many conditions does each participant take part in?","a":"One","t":"RM","id":480},{"q":"What are the BPS guidelines?","a":"The ethical guidelines from the British Psychological Society that psychologists must follow","t":"RM","id":481},{"q":"Name five ethical guidelines.","a":"Informed consent, Deception, Right to withdraw, Protection from harm, Confidentiality, Debriefing","t":"RM","id":482},{"q":"What is informed consent?","a":"Participants agree to take part knowing what the study involves","t":"RM","id":483},{"q":"What is deception?","a":"Misleading participants or withholding information about the study","t":"RM","id":484},{"q":"What is the right to withdraw?","a":"Participants can leave the study at any time, and withdraw their data","t":"RM","id":485},{"q":"What is protection from harm?","a":"Participants should not be physically or psychologically harmed","t":"RM","id":486},{"q":"What is confidentiality?","a":"Participants' personal information is kept private","t":"RM","id":487},{"q":"What is debriefing?","a":"Telling participants the true aim of the study afterwards and checking they are OK","t":"RM","id":488},{"q":"What is a case study?","a":"An in-depth investigation of an individual, small group or organisation, using several methods","t":"RM","id":489},{"q":"Give a strength of case studies.","a":"Very detailed information, often collected over a long time","t":"RM","id":490},{"q":"Give a weakness of case studies.","a":"Unique cases so results can't be generalised; data may be subjective","t":"RM","id":491},{"q":"What is an interview?","a":"A method where the researcher asks questions directly, usually face-to-face or by phone","t":"RM","id":492},{"q":"What is a structured interview?","a":"An interview with pre-set questions in a fixed order that everyone is asked","t":"RM","id":493},{"q":"What is an unstructured interview?","a":"An interview where only the topic is fixed and questions depend on the answers given","t":"RM","id":494},{"q":"What is a semi-structured interview?","a":"An interview with some pre-set questions plus follow-up questions based on the answers","t":"RM","id":495},{"q":"Why is a semi-structured interview arguably the best type?","a":"It allows comparison between interviewees but also detail through follow-up questions","t":"RM","id":496},{"q":"Give a weakness of interviews.","a":"Time-consuming; social desirability bias; interviewer bias","t":"RM","id":497},{"q":"What is a questionnaire?","a":"A set of standard questions about a topic given to all participants","t":"RM","id":498},{"q":"What is an open question?","a":"A question where participants can answer freely in their own words (qualitative data)","t":"RM","id":499},{"q":"What is a closed question?","a":"A question with fixed answers to choose from (quantitative data)","t":"RM","id":500},{"q":"Name three types of closed question.","a":"Fixed choice, Likert scale, Rating scale","t":"RM","id":501},{"q":"What is a Likert scale?","a":"A scale where respondents choose how far they agree or disagree with a statement","t":"RM","id":502},{"q":"Identify an advantage of a questionnaire.","a":"Quick and cheap to give to a large number of people","t":"RM","id":503},{"q":"Give a weakness of questionnaires.","a":"Social desirability bias – people may lie to look good","t":"RM","id":504},{"q":"What is social desirability bias?","a":"Answering in a way that makes you look good rather than honestly","t":"RM","id":505},{"q":"Identify a weakness of a correlational study.","a":"It can't show cause and effect","t":"RM","id":506},{"q":"When does brain development begin in the womb?","a":"In the third week of pregnancy, when the neural plate forms and folds into the neural tube","t":"Development","id":507},{"q":"What happens to the neural tube in the 4th week of pregnancy?","a":"It divides into the spinal cord, forebrain, midbrain and hindbrain","t":"Development","id":508},{"q":"What happens in the 6th week of pregnancy?","a":"The forebrain divides into the cortex and thalamus, and the brain stem is formed","t":"Development","id":509},{"q":"When has the cerebellum formed?","a":"By the 15th week of pregnancy","t":"Development","id":510},{"q":"What happens to the cortex in the last three months of pregnancy?","a":"Folds begin to form, making the brain look wrinkled at birth","t":"Development","id":511},{"q":"What is the most highly developed part of the brain at birth?","a":"The brain stem","t":"Development","id":512},{"q":"Why is the brain stem the most developed part of the brain at birth?","a":"It controls functions we need to survive, such as breathing and heartbeat","t":"Development","id":513},{"q":"Which part of the brain controls autonomic functions?","a":"The brain stem","t":"Development","id":514},{"q":"What are autonomic functions?","a":"Basic life functions that happen automatically, like breathing, heart rate and digestion","t":"Development","id":515},{"q":"Which part of the brain controls sensorimotor activities?","a":"The cerebellum","t":"Development","id":516},{"q":"What does sensorimotor mean?","a":"Matching information from the senses with the correct motor (movement) response","t":"Development","id":517},{"q":"What does 'cerebellum' mean?","a":"'Little brain'","t":"Development","id":518},{"q":"Apart from movement and balance, what other functions does the cerebellum have?","a":"Language and emotions","t":"Development","id":519},{"q":"Where is the thalamus and what is its role?","a":"Deep in the middle of the brain (one in each hemisphere); it receives, sorts and relays sensory and motor information to the right area of the cortex","t":"Development","id":520},{"q":"What other names are there for the cortex?","a":"The cerebral cortex (or cerebrum)","t":"Development","id":521},{"q":"What are the two halves of the cortex called?","a":"Hemispheres","t":"Development","id":522},{"q":"Where does cognition (thinking) occur?","a":"In the cortex","t":"Development","id":523},{"q":"What is the last part of the brain to reach maturity?","a":"The cortex (especially the frontal lobe)","t":"Development","id":524},{"q":"Name the four lobes of the cortex.","a":"Frontal, Parietal, Temporal, Occipital","t":"Development","id":525},{"q":"Which lobe is responsible for vision?","a":"The occipital lobe","t":"Development","id":526},{"q":"Which lobe is responsible for thinking, problem-solving and speech?","a":"The frontal lobe","t":"Development","id":527},{"q":"Which lobe is responsible for hearing?","a":"The temporal lobe","t":"Development","id":528},{"q":"Which lobe processes touch, heat and pain?","a":"The parietal lobe","t":"Development","id":529},{"q":"What is the nature–nurture debate?","a":"Whether behaviour is caused by genes we inherit (nature) or by the environment and experience (nurture)","t":"Development","id":530},{"q":"What does nature mean?","a":"Characteristics we are born with, inherited through our genes","t":"Development","id":531},{"q":"What does nurture mean?","a":"Influences from the environment and experience","t":"Development","id":532},{"q":"How do identical twins show nurture affects brain development?","a":"They have the same genes but often have differences in brain structure, so the environment in the womb must have an effect","t":"Development","id":533},{"q":"If a pregnant mother smokes, what impact can this have on brain development?","a":"Nicotine slows brain growth, affecting the size of the brain","t":"Development","id":534},{"q":"If a baby in the womb is exposed to rubella, what damage can this cause?","a":"Problems such as deafness, blindness or brain damage","t":"Development","id":535},{"q":"What is Edwards' syndrome?","a":"A genetic condition where a baby has three copies of chromosome 18, which severely disrupts development","t":"Development","id":536},{"q":"How does Edwards' syndrome support the nature side of the debate?","a":"It is caused by genes (an extra chromosome), not the environment","t":"Development","id":537},{"q":"Describe DeCasper and Spence's (1986) study.","a":"Mothers read The Cat in the Hat aloud during pregnancy; after birth, babies sucked more on a special dummy when they heard that story, suggesting they recognised it","t":"Development","id":538},{"q":"What does DeCasper and Spence's study show?","a":"The brain responds to the environment even in the womb (nurture)","t":"Development","id":539},{"q":"What did animal studies find about enriched environments?","a":"Rats kept in cages with toys and other rats developed bigger brains than those kept alone without toys","t":"Development","id":540},{"q":"Why is it a problem to apply animal studies to humans?","a":"Animals' brains are different from humans', so results may not be valid for people (extrapolation)","t":"Development","id":541},{"q":"Why is it useful to study newborn babies in the nature–nurture debate?","a":"They have had little exposure to the environment, so their abilities are likely to be innate","t":"Development","id":542},{"q":"What is cognitive development?","a":"Changes in mental processes as a child grows and experiences more of the world","t":"Development","id":543},{"q":"Who proposed the stage theory of cognitive development?","a":"Jean Piaget","t":"Development","id":544},{"q":"What is a schema (Piaget)?","a":"A mental framework of knowledge about something, built from experience","t":"Development","id":545},{"q":"What is equilibrium?","a":"A balanced state where new information fits existing schemas","t":"Development","id":546},{"q":"Name Piaget's four stages in order.","a":"Sensorimotor, Pre-operational, Concrete operational, Formal operational","t":"Development","id":547},{"q":"What is the first stage of Piaget's theory and what ages does it cover?","a":"Sensorimotor, 0–2 years","t":"Development","id":548},{"q":"What is the second stage of Piaget's theory and what ages does it cover?","a":"Pre-operational, 2–7 years","t":"Development","id":549},{"q":"What is the third stage of Piaget's theory and what ages does it cover?","a":"Concrete operational, 7–11 years","t":"Development","id":550},{"q":"What is the fourth stage of Piaget's theory and what ages does it cover?","a":"Formal operational, 11+ years","t":"Development","id":551},{"q":"How do children learn in the sensorimotor stage?","a":"Through their senses and motor (movement) skills","t":"Development","id":552},{"q":"What is object permanence?","a":"Understanding that objects still exist when they are out of sight","t":"Development","id":553},{"q":"When does object permanence develop?","a":"From about 8 months, in the sensorimotor stage","t":"Development","id":554},{"q":"How did Piaget test object permanence?","a":"He hid a toy under a blanket while a baby watched – babies with object permanence searched for it","t":"Development","id":555},{"q":"What is symbolic thinking?","a":"Using an object to represent something else, e.g. pretending a broom is a horse (pre-operational stage)","t":"Development","id":556},{"q":"What is egocentrism?","a":"Only being able to see the world from your own point of view","t":"Development","id":557},{"q":"How did Piaget test egocentrism?","a":"The three mountains task – children were asked what a doll could see from a different position; pre-operational children chose their own view","t":"Development","id":558},{"q":"What is conservation?","a":"Understanding that the quantity of something stays the same even if it looks different","t":"Development","id":559},{"q":"How did Piaget test conservation?","a":"Pouring liquid from a short wide glass into a tall thin one, or spreading out a row of counters, then asking if the amount was the same","t":"Development","id":560},{"q":"At which stage can children conserve?","a":"Concrete operational (7–11)","t":"Development","id":561},{"q":"At which stage can children think logically?","a":"Concrete operational – but only about physical, concrete objects","t":"Development","id":562},{"q":"At which stage can children think abstractly?","a":"Formal operational (11+)","t":"Development","id":563},{"q":"What is hypothetical thinking?","a":"Being able to reason about possibilities and ideas that aren't real (formal operational stage)","t":"Development","id":564},{"q":"Which researcher did the policeman doll study?","a":"Hughes (1975)","t":"Development","id":565},{"q":"What was the policeman doll study testing?","a":"Egocentrism","t":"Development","id":566},{"q":"What criticism of Piaget's mountain study was Hughes addressing?","a":"The three mountains task was confusing and meaningless to young children","t":"Development","id":567},{"q":"Describe Hughes' policeman doll study.","a":"Children aged 3½–5 had to hide a boy doll from one or two policeman dolls, which meant taking the policemen's point of view","t":"Development","id":568},{"q":"What percentage of children aged 3–5 could hide the doll from the policemen?","a":"90%","t":"Development","id":569},{"q":"What did Hughes conclude?","a":"Children can decentre (take another's view) much younger than Piaget thought, if the task makes sense to them","t":"Development","id":570},{"q":"Describe McGarrigle and Donaldson's naughty teddy study.","a":"Children saw two rows of counters; 'naughty teddy' then messed up one row 'accidentally', and children were asked if the rows were still the same","t":"Development","id":571},{"q":"What was McGarrigle and Donaldson's study testing?","a":"Conservation of number","t":"Development","id":572},{"q":"What age were the children in McGarrigle and Donaldson's study?","a":"4–6 years (Scottish children)","t":"Development","id":573},{"q":"What did McGarrigle and Donaldson find?","a":"Far more children could conserve when naughty teddy changed the row (62%) than when the adult changed it (16%)","t":"Development","id":574},{"q":"Did the naughty teddy study show that Piaget had underestimated or overestimated children's abilities?","a":"Underestimated – young children can conserve earlier than he thought","t":"Development","id":575},{"q":"Which study, Hughes or McGarrigle and Donaldson, used a repeated measures design?","a":"McGarrigle and Donaldson – each child did both the adult and the naughty teddy versions","t":"Development","id":576},{"q":"Why might children have failed Piaget's conservation task?","a":"The adult deliberately changed the row, so children thought they were expected to give a different answer","t":"Development","id":577},{"q":"Piaget conducted his own experiments. What was the problem with this?","a":"He designed and interpreted the tasks himself, so there could be researcher bias; the tasks may have confused children","t":"Development","id":578},{"q":"Who did Piaget study?","a":"A small number of Swiss children, including his own children","t":"Development","id":579},{"q":"How can Piaget be said to have overestimated some abilities?","a":"Not everyone reaches the formal operational stage – many adults can't think abstractly","t":"Development","id":580},{"q":"Give a strength of Piaget's theory.","a":"It has been applied to education (e.g. the Plowden Report 1967 and discovery learning)","t":"Development","id":581},{"q":"Give a weakness of Piaget's theory.","a":"Research such as Hughes and McGarrigle and Donaldson shows children develop earlier than he said","t":"Development","id":582},{"q":"What is the readiness approach?","a":"Teachers should only teach children things they are cognitively ready for at their stage","t":"Development","id":583},{"q":"Give an example of readiness.","a":"A 6-year-old should be given concrete aids (like an abacus) for maths rather than abstract problems","t":"Development","id":584},{"q":"What is discovery learning?","a":"Children learn best by finding things out for themselves through activities and experiments, rather than copying notes","t":"Development","id":585},{"q":"What is individual learning in Piaget's approach to education?","a":"Children go through the stages at different rates, so they should work at their own pace","t":"Development","id":586},{"q":"Which report was influenced by Piaget?","a":"The Plowden Report (1967) on primary education","t":"Development","id":587},{"q":"What did Bennett (1976) find about discovery learning?","a":"It was not the best approach for maths, English and reading","t":"Development","id":588},{"q":"What did Bryant and Trabasso (1971) find?","a":"Children who weren't 'ready' could still improve with practice, challenging readiness","t":"Development","id":589},{"q":"Who developed mindset theory?","a":"Carol Dweck","t":"Development","id":590},{"q":"What is a fixed mindset?","a":"The belief that intelligence and ability are innate and can't be changed","t":"Development","id":591},{"q":"What is a growth mindset?","a":"The belief that intelligence and ability can grow with hard work and effort","t":"Development","id":592},{"q":"How will someone with a growth mindset approach failure?","a":"Positively – as an opportunity to learn and improve","t":"Development","id":593},{"q":"How will someone with a fixed mindset approach failure?","a":"Poorly – they may give up, thinking they aren't good enough","t":"Development","id":594},{"q":"What type of goals do people with a fixed mindset focus on?","a":"Performance goals (e.g. the grade they get)","t":"Development","id":595},{"q":"What type of goals do people with a growth mindset focus on?","a":"Learning goals","t":"Development","id":596},{"q":"Describe Dweck's study of 48 students.","a":"Underachieving 12–13-year-olds did a study skills course; half were taught the brain is like a muscle that grows with exercise (growth mindset), half learned about memory","t":"Development","id":597},{"q":"What did Dweck's growth mindset group show?","a":"Improved motivation and grades","t":"Development","id":598},{"q":"What did Yeager (2019) find?","a":"Just one hour of growth mindset teaching raised the maths grades of low-achieving students","t":"Development","id":599},{"q":"What is praise?","a":"A reward expressing approval, which increases motivation","t":"Development","id":600},{"q":"What kind of praise will increase a growth mindset?","a":"Praise for effort and process (e.g. 'You worked really hard'), not ability","t":"Development","id":601},{"q":"What makes praise effective?","a":"It must be honest, sincere, deserved and linked to the quality of performance","t":"Development","id":602},{"q":"Both of Dweck's mindsets involve praise. Why is this a problem?","a":"Praise is external, so students may rely on it rather than developing their own motivation","t":"Development","id":603},{"q":"What is self-efficacy?","a":"The belief in your own ability to succeed at a task","t":"Development","id":604},{"q":"Who developed the idea of self-efficacy?","a":"Bandura","t":"Development","id":605},{"q":"What is the relationship between self-efficacy and motivation?","a":"High self-efficacy increases motivation – people put in more effort and persist longer","t":"Development","id":606},{"q":"How does self-efficacy develop?","a":"Through past experience of success or failure, and feedback from others","t":"Development","id":607},{"q":"What are learning styles?","a":"The different ways people prefer to take in, process and remember information","t":"Development","id":608},{"q":"What are the three types of learning style?","a":"Visual, Auditory (verbal), Kinaesthetic","t":"Development","id":609},{"q":"What is a visualiser?","a":"Someone who prefers to process information by looking at it (pictures, diagrams)","t":"Development","id":610},{"q":"What is a verbaliser?","a":"Someone who prefers to process information through words – speaking, listening and reading","t":"Development","id":611},{"q":"What is a kinaesthetic learner?","a":"Someone who prefers hands-on activities and learning by doing","t":"Development","id":612},{"q":"If someone prefers reading text and listening to instructions but hates diagrams, what type of learner are they?","a":"A verbaliser, not a visualiser","t":"Development","id":613},{"q":"Give a strength of learning styles.","a":"It changed how teachers teach, moving away from one traditional method","t":"Development","id":614},{"q":"Why is the learning styles theory widely criticised?","a":"There is little experimental evidence that teaching to learning styles improves learning","t":"Development","id":615},{"q":"How many learning styles did Coffield (2004) find?","a":"71","t":"Development","id":616},{"q":"Which researcher criticised learning styles?","a":"Daniel Willingham","t":"Development","id":617},{"q":"What did Willingham say about how students should be taught?","a":"Using the method that best suits the content being taught, not the student's preferred learning style","t":"Development","id":618},{"q":"What kind of praise does Willingham encourage, and why?","a":"Unexpected praise, because it increases internal (intrinsic) motivation","t":"Development","id":619},{"q":"Willingham said cued recall should support learning. What is this?","a":"Creating useful cues when learning so they can trigger recall later","t":"Development","id":620},{"q":"Willingham said retrieval practice should support learning. What is this?","a":"Practising recalling information from memory, rather than just re-reading it","t":"Development","id":621},{"q":"What is delayed gratification?","a":"Being able to wait for a bigger reward later rather than a smaller one now","t":"Development","id":622},{"q":"Why does delayed gratification lead to learning?","a":"It develops self-control and self-regulation, so students keep working towards long-term goals","t":"Development","id":623},{"q":"Willingham said scans could be used to diagnose learning difficulties. What is the problem with this?","a":"Scans are expensive and not always available, and brain differences don't always tell us how to teach","t":"Development","id":624},{"q":"Give a criticism of Willingham's ideas.","a":"They don't value modern teaching and may discourage creativity","t":"Development","id":625},{"q":"Does Piaget argue that language comes before or after thought?","a":"After – thought comes first and language follows","t":"Language, thought & communication","id":626},{"q":"Whose theory argued that thought comes before language?","a":"Piaget's","t":"Language, thought & communication","id":627},{"q":"What do children have to develop before they can speak about a concept, according to Piaget?","a":"An understanding of the concept (a schema)","t":"Language, thought & communication","id":628},{"q":"How do children develop language according to Piaget?","a":"By matching words to their existing knowledge of the world (schemas)","t":"Language, thought & communication","id":629},{"q":"What did Piaget compare children who use words they don't understand to?","a":"Parrots – repeating words without understanding them","t":"Language, thought & communication","id":630},{"q":"In which stage is children's language egocentric according to Piaget?","a":"The pre-operational stage (2–7 years)","t":"Language, thought & communication","id":631},{"q":"What is egocentric speech?","a":"Children talking to themselves or speaking only from their own point of view","t":"Language, thought & communication","id":632},{"q":"What did Cromer (1974) find?","a":"Young children said things like 'mummy sock', showing they understood possession before they could use full sentences","t":"Language, thought & communication","id":633},{"q":"Why might Piaget's research be subject to experimenter bias?","a":"He observed and interpreted children's behaviour himself, including his own children","t":"Language, thought & communication","id":634},{"q":"Piaget's theory is based on schemas which can't be measured. Which evaluation term applies?","a":"It is unfalsifiable (not scientific)","t":"Language, thought & communication","id":635},{"q":"Which psychologists argued that language is a prerequisite to thought?","a":"Sapir and Whorf","t":"Language, thought & communication","id":636},{"q":"What does the Sapir-Whorf hypothesis say?","a":"Language comes before thought – the language we speak shapes how we think","t":"Language, thought & communication","id":637},{"q":"What is the strong version of the Sapir-Whorf hypothesis?","a":"Language determines thought – if there is no word for something, we can't think about it","t":"Language, thought & communication","id":638},{"q":"What is the weak version of the Sapir-Whorf hypothesis?","a":"Language influences thought – we can think about things without words, but words make it easier","t":"Language, thought & communication","id":639},{"q":"Sapir and Whorf did many cross-cultural studies. What does this mean?","a":"Studies comparing people from different cultures","t":"Language, thought & communication","id":640},{"q":"What did Whorf find about the Hopi people?","a":"Their language has no words for past, present and future, so he said they experience time differently","t":"Language, thought & communication","id":641},{"q":"Why might Whorf's conclusion about the Hopi not be valid?","a":"He based it on one individual (Naquayouma), so it can't be generalised","t":"Language, thought & communication","id":642},{"q":"Why could the claim that Inuit have more thoughts about snow be challenged?","a":"They may have more words for snow because they experience more snow (thought first), and English also has many snow words","t":"Language, thought & communication","id":643},{"q":"Who studied the Zuni people?","a":"Brown and Lenneberg (1954)","t":"Language, thought & communication","id":644},{"q":"What did Brown and Lenneberg find about the Zuni?","a":"They have one word for yellow and orange and found it harder to recall these colours than English speakers","t":"Language, thought & communication","id":645},{"q":"Whose theory does the Zuni research support – Piaget's or Sapir-Whorf's?","a":"Sapir-Whorf's","t":"Language, thought & communication","id":646},{"q":"How many basic colour words do the Berinmo have?","a":"Five","t":"Language, thought & communication","id":647},{"q":"What did research with the Berinmo find?","a":"They were better at distinguishing colours across their own 'nol' and 'wor' boundary than across the English blue–green boundary, and English speakers showed the opposite","t":"Language, thought & communication","id":648},{"q":"Who studied the Dani tribe and colour?","a":"Heider and Oliver (1972)","t":"Language, thought & communication","id":649},{"q":"How many colour words do the Dani have?","a":"Two (roughly light/warm and dark/cool)","t":"Language, thought & communication","id":650},{"q":"What did Heider and Oliver find?","a":"The Dani could recognise and match colours about as well as English speakers, despite having only two colour words","t":"Language, thought & communication","id":651},{"q":"Why was Heider and Oliver's non-verbal method better?","a":"It tested colour recognition without relying on language, so it measured thought more validly","t":"Language, thought & communication","id":652},{"q":"Whose theory does Heider and Oliver's study support?","a":"Piaget's (thought is not limited by language)","t":"Language, thought & communication","id":653},{"q":"Variation in recall of events and colour between cultures provides evidence for which theory?","a":"The Sapir-Whorf hypothesis","t":"Language, thought & communication","id":654},{"q":"Why are many studies into language and thought ethnocentric?","a":"They compare other cultures to English speakers and judge them by Western standards","t":"Language, thought & communication","id":655},{"q":"What is elaborated code vs restricted code?","a":"Elaborated code is complex, detailed language (Bernstein linked it to the middle class); restricted code is simpler, shorter language (linked to the working class)","t":"Language, thought & communication","id":656},{"q":"How do elaborated and restricted codes show that language comes before thought?","a":"Children using restricted code may find abstract thinking harder, e.g. at school, so language affects thinking","t":"Language, thought & communication","id":657},{"q":"Who proposed elaborated and restricted codes?","a":"Bernstein","t":"Language, thought & communication","id":658},{"q":"What is language?","a":"A system of communication used by a group of people, unique to humans","t":"Language, thought & communication","id":659},{"q":"What is communication?","a":"Sending or receiving information between people or animals","t":"Language, thought & communication","id":660},{"q":"Define verbal communication.","a":"Sending and receiving messages using words","t":"Language, thought & communication","id":661},{"q":"Define non-verbal communication.","a":"Sending and receiving messages without words, e.g. eye contact, body language, personal space","t":"Language, thought & communication","id":662},{"q":"Define paralinguistics.","a":"The vocal features of speech that aren't words, e.g. tone, pitch, volume and speed","t":"Language, thought & communication","id":663},{"q":"What are the four functions of animal communication?","a":"Survival, Reproduction, Territory, Food","t":"Language, thought & communication","id":664},{"q":"Give an example of animal communication for survival.","a":"Vervet monkeys use different alarm calls for snakes and eagles","t":"Language, thought & communication","id":665},{"q":"Give an example of animal communication for reproduction.","a":"A peacock fanning its tail to attract a mate","t":"Language, thought & communication","id":666},{"q":"Give an example of animal communication for territory.","a":"Dogs urinating (scent marking), or birds singing","t":"Language, thought & communication","id":667},{"q":"Give an example of animal communication for food.","a":"Bees doing the waggle dance, or ants leaving a pheromone trail","t":"Language, thought & communication","id":668},{"q":"What is scent marking and which function is it used for?","a":"Leaving a smell (e.g. urine) to claim an area – territory (and reproduction)","t":"Language, thought & communication","id":669},{"q":"What are pheromones?","a":"Chemicals released by animals that affect the behaviour of others of the same species","t":"Language, thought & communication","id":670},{"q":"Give an example of visual and sound animal communication.","a":"Visual – a peacock's tail; Sound – a lion roaring or a bird singing","t":"Language, thought & communication","id":671},{"q":"What is displacement, and is it a feature of animal or human communication?","a":"Talking about things that aren't present (past, future or imaginary) – human","t":"Language, thought & communication","id":672},{"q":"Give an example of displacement in human communication.","a":"Talking about what you did last weekend or plans for next year","t":"Language, thought & communication","id":673},{"q":"What is a closed system, and is it a feature of animal or human communication?","a":"A fixed, limited set of signals with set meanings – animal","t":"Language, thought & communication","id":674},{"q":"What is creativity in communication, and is it animal or human?","a":"Being able to create new words, ideas and sentences – human","t":"Language, thought & communication","id":675},{"q":"What is single-channel communication, and is it animal or human?","a":"Using one channel at a time (e.g. only scent or sound) – animal","t":"Language, thought & communication","id":676},{"q":"Who studied bee communication?","a":"Karl von Frisch","t":"Language, thought & communication","id":677},{"q":"What was von Frisch's job?","a":"An ethologist – someone who studies animals in their natural habitat","t":"Language, thought & communication","id":678},{"q":"When do bees do the round dance?","a":"When food is close to the hive","t":"Language, thought & communication","id":679},{"q":"When do bees do the waggle dance?","a":"When food is further away – it shows the direction and distance of the food","t":"Language, thought & communication","id":680},{"q":"What did von Frisch change in his studies?","a":"Where the food source was placed – close to the hive (10–20m) or far away (e.g. 300m)","t":"Language, thought & communication","id":681},{"q":"What kind of observation was von Frisch's study?","a":"A controlled observation of bees in their natural setting","t":"Language, thought & communication","id":682},{"q":"Over how long did von Frisch conduct his observations?","a":"Over about 20 years","t":"Language, thought & communication","id":683},{"q":"Is von Frisch's study about verbal or non-verbal communication?","a":"Non-verbal (animal) communication","t":"Language, thought & communication","id":684},{"q":"Give two reasons von Frisch's study lacks mundane realism.","a":"The food sources were artificially placed, and the bees may have been marked or handled","t":"Language, thought & communication","id":685},{"q":"What extraneous variables might have affected which dance the bees did?","a":"Weather, wind, the type of food, or the number of bees","t":"Language, thought & communication","id":686},{"q":"Give a strength of von Frisch's research.","a":"It made an important contribution to science and he won a Nobel Prize","t":"Language, thought & communication","id":687},{"q":"What are the three functions of eye contact?","a":"Regulating the flow of conversation, Signalling attraction, Expressing emotion","t":"Language, thought & communication","id":688},{"q":"How does eye contact regulate conversation?","a":"We look away when we've finished talking and look back to signal the other person should speak","t":"Language, thought & communication","id":689},{"q":"Describe Kendon's (1967) study.","a":"Pairs meeting for the first time were watched through a two-way mirror; speakers looked away when finishing, signalling turn-taking","t":"Language, thought & communication","id":690},{"q":"What happened in conversations when a participant wore dark glasses?","a":"There were more pauses and interruptions, showing eye contact regulates conversation","t":"Language, thought & communication","id":691},{"q":"What did Conway et al. (2007) find?","a":"Faces making eye contact were rated as more attractive","t":"Language, thought & communication","id":692},{"q":"What did Adams and Kleck (2005) find?","a":"Joy and anger were rated most intense with a direct gaze; fear and sadness with an averted gaze","t":"Language, thought & communication","id":693},{"q":"Give an example of how eye contact research can be applied.","a":"Training for job interviews, or teachers using eye contact to manage discussions","t":"Language, thought & communication","id":694},{"q":"What is body language?","a":"Conscious and unconscious postures, gestures and movements that express thoughts and feelings","t":"Language, thought & communication","id":695},{"q":"What is posture?","a":"The position of the body when standing or sitting","t":"Language, thought & communication","id":696},{"q":"What is an open posture?","a":"Arms and legs uncrossed – shows friendliness and openness","t":"Language, thought & communication","id":697},{"q":"What is a closed posture?","a":"Arms folded and/or legs crossed – may show disagreement or feeling closed off","t":"Language, thought & communication","id":698},{"q":"What is postural echo?","a":"Mirroring another person's body position, which shows agreement or liking","t":"Language, thought & communication","id":699},{"q":"How can the findings of posture research be applied?","a":"Using open posture and postural echo in interviews or therapy to build rapport","t":"Language, thought & communication","id":700},{"q":"How does touch affect someone's attitude towards a person?","a":"A light touch can make people feel more positive towards them","t":"Language, thought & communication","id":701},{"q":"In which location did Fisher conduct a study of touch?","a":"A university library","t":"Language, thought & communication","id":702},{"q":"Describe Fisher et al.'s (1976) study.","a":"A librarian lightly touched some students' hands when returning library cards; touched students rated the librarian and library more positively","t":"Language, thought & communication","id":703},{"q":"Why are studies into posture and touch often unethical but valid?","a":"Participants don't know they're being studied (no consent), but this means they behave naturally","t":"Language, thought & communication","id":704},{"q":"Define personal space.","a":"The physical distance we like to keep between ourselves and others to feel comfortable","t":"Language, thought & communication","id":705},{"q":"Identify three factors which affect personal space.","a":"Culture, Gender, Status","t":"Language, thought & communication","id":706},{"q":"What did Hall (1966) say about contact and non-contact cultures?","a":"Contact cultures (e.g. Italy, Spain, Latin America) stand closer; non-contact cultures (e.g. UK, USA) keep more distance","t":"Language, thought & communication","id":707},{"q":"Give an example of a close-contact culture.","a":"Italy, Spain, Arab countries or Latin America","t":"Language, thought & communication","id":708},{"q":"What did Sommer find about British and Arab men?","a":"Arab men stood and sat closer together than British men","t":"Language, thought & communication","id":709},{"q":"What did Collett (1971) find?","a":"English men trained to use Arab-style personal space were liked more by Arab men","t":"Language, thought & communication","id":710},{"q":"What did Zahn (1991) find about status and personal space?","a":"People of equal status keep closer personal space; people approached higher-status colleagues less","t":"Language, thought & communication","id":711},{"q":"What did Gifford (1987) find about gender and personal space?","a":"Men prefer more personal space with other men than women do with other women","t":"Language, thought & communication","id":712},{"q":"Women prefer their personal space to be 'invaded' from the front rather than the side – true or false?","a":"True – Fisher and Byrne (1975) found women disliked strangers sitting beside them, while men disliked them sitting opposite","t":"Language, thought & communication","id":713},{"q":"Identify three extraneous variables that might affect personal space.","a":"Personality, how well people know each other, the setting (e.g. crowded or not), age","t":"Language, thought & communication","id":714},{"q":"Who created the evolutionary theory of non-verbal behaviour?","a":"Charles Darwin","t":"Language, thought & communication","id":715},{"q":"Define an adaptive behaviour.","a":"A behaviour that helps survival or reproduction, so it is naturally selected and passed on","t":"Language, thought & communication","id":716},{"q":"What is a serviceable habit?","a":"A behaviour that was once useful for survival in animals and is now used by humans to express emotion","t":"Language, thought & communication","id":717},{"q":"Why do some adaptive behaviours remain in humans even though they're no longer needed?","a":"They are still in our genes, passed on through generations","t":"Language, thought & communication","id":718},{"q":"Widening the eyes is adaptive in animals. What does it help the animal do?","a":"Assess the situation and find escape routes when threatened","t":"Language, thought & communication","id":719},{"q":"What does widening the eyes help humans do?","a":"Express fear or surprise","t":"Language, thought & communication","id":720},{"q":"Give another example of a serviceable habit.","a":"Wrinkling the nose – once to avoid breathing in something dangerous, now to show disgust","t":"Language, thought & communication","id":721},{"q":"Is non-verbal behaviour innate or learned according to Darwin?","a":"Innate – it has evolved","t":"Language, thought & communication","id":722},{"q":"Define innate.","a":"Inborn or genetic, rather than learned","t":"Language, thought & communication","id":723},{"q":"What is neonate research?","a":"Studying newborn babies (less than a month old) to see which behaviours are present from birth","t":"Language, thought & communication","id":724},{"q":"What are social releasers?","a":"Innate behaviours in babies, like smiling and eye contact, that make adults want to care for them","t":"Language, thought & communication","id":725},{"q":"Do social releasers show that non-verbal behaviour is innate or learned?","a":"Innate","t":"Language, thought & communication","id":726},{"q":"Who suggested babies are born with social releasers?","a":"John Bowlby","t":"Language, thought & communication","id":727},{"q":"What does sensory deprived mean?","a":"Receiving little or no information from one or more senses, e.g. being born blind","t":"Language, thought & communication","id":728},{"q":"What could sensory deprived children do which shows non-verbal behaviour is innate?","a":"Blind children make the same facial expressions as sighted children, even though they've never seen them","t":"Language, thought & communication","id":729},{"q":"Describe Thompson's (1941) study.","a":"Blind children (from birth) showed the same facial expressions for surprise and anger as sighted children","t":"Language, thought & communication","id":730},{"q":"Do differences between contact and non-contact cultures show non-verbal communication is innate or learned?","a":"Learned","t":"Language, thought & communication","id":731},{"q":"How do gestures show non-verbal communication is learned?","a":"The same gesture means different things in different cultures (e.g. the 'OK' sign)","t":"Language, thought & communication","id":732},{"q":"Which theory explains cultural differences in non-verbal communication?","a":"Social learning theory – we learn by observing and imitating others","t":"Language, thought & communication","id":733},{"q":"What is an emoticon?","a":"A combination of 'emotion' and 'icon' – a symbol showing mood in written messages","t":"Language, thought & communication","id":734},{"q":"From which two countries was the sample in Yuki's study taken?","a":"The USA and Japan","t":"Language, thought & communication","id":735},{"q":"What was the aim of Yuki's study?","a":"To see if there are cultural differences in how people read emotions from the eyes and mouth of emoticons","t":"Language, thought & communication","id":736},{"q":"Did Yuki find that Japanese participants rated happiness higher when the eyes or the mouth were happy?","a":"The eyes","t":"Language, thought & communication","id":737},{"q":"What did Yuki find about American participants?","a":"They focused on the mouth when judging emotion","t":"Language, thought & communication","id":738},{"q":"What design was Yuki's study?","a":"Independent groups (American and Japanese participants)","t":"Language, thought & communication","id":739},{"q":"How was Yuki's study redone to increase mundane realism?","a":"Using photographs of real faces instead of emoticons","t":"Language, thought & communication","id":740},{"q":"What conclusions can be drawn from Yuki's study?","a":"Culture affects how we interpret facial expressions, so non-verbal communication is partly learned","t":"Language, thought & communication","id":741},{"q":"Give a weakness of Yuki's study.","a":"It used artificial emoticons and only looked at two emotions (happiness and sadness)","t":"Language, thought & communication","id":742},{"q":"Why might Yuki's study lack validity due to rating scales?","a":"Ratings are subjective and may not truly measure how people perceive emotion","t":"Language, thought & communication","id":743},{"q":"What are the named studies for Language, thought and communication?","a":"Von Frisch (bees), Yuki (emoticons)","t":"Language, thought & communication","id":744},{"q":"What are the two main divisions of the nervous system?","a":"Central nervous system (CNS), Peripheral nervous system (PNS)","t":"Brain & neuropsychology","id":745},{"q":"What makes up the central nervous system?","a":"The brain and spinal cord","t":"Brain & neuropsychology","id":746},{"q":"What are the two divisions of the peripheral nervous system?","a":"Somatic nervous system, Autonomic nervous system","t":"Brain & neuropsychology","id":747},{"q":"Does the somatic nervous system deal with voluntary or automatic behaviour?","a":"Voluntary behaviour (e.g. moving muscles on purpose)","t":"Brain & neuropsychology","id":748},{"q":"What does the autonomic nervous system control?","a":"Automatic body functions like heart rate, breathing and digestion","t":"Brain & neuropsychology","id":749},{"q":"What are the two divisions of the autonomic nervous system?","a":"Sympathetic nervous system, Parasympathetic nervous system","t":"Brain & neuropsychology","id":750},{"q":"Which part of the nervous system controls digestion?","a":"The autonomic nervous system (parasympathetic division)","t":"Brain & neuropsychology","id":751},{"q":"Which two parts of the nervous system control reflex actions?","a":"The spinal cord and the somatic (peripheral) nervous system","t":"Brain & neuropsychology","id":752},{"q":"Which part of the nervous system is responsible for the fight or flight response?","a":"The sympathetic nervous system","t":"Brain & neuropsychology","id":753},{"q":"After fight or flight, what state does the parasympathetic nervous system put the body into?","a":"Rest and digest","t":"Brain & neuropsychology","id":754},{"q":"What is the fight or flight response?","a":"An automatic physical reaction to a threat that prepares the body to fight or run away","t":"Brain & neuropsychology","id":755},{"q":"Which part of the brain is alerted when a stressor is noticed?","a":"The hypothalamus","t":"Brain & neuropsychology","id":756},{"q":"Which hormone is responsible for the fight or flight response?","a":"Adrenaline","t":"Brain & neuropsychology","id":757},{"q":"Where is adrenaline released from?","a":"The adrenal glands","t":"Brain & neuropsychology","id":758},{"q":"Identify a physiological change during fight or flight.","a":"Increased heart rate, faster breathing, dilated pupils, tense muscles, digestion slows, sweating","t":"Brain & neuropsychology","id":759},{"q":"Why does heart rate increase in fight or flight?","a":"To pump more blood and oxygen to the muscles","t":"Brain & neuropsychology","id":760},{"q":"Why does digestion slow down during fight or flight?","a":"Energy is directed to the muscles instead","t":"Brain & neuropsychology","id":761},{"q":"Is adrenaline a hormone or a neurotransmitter?","a":"Both – a hormone when released into the blood, a neurotransmitter at synapses","t":"Brain & neuropsychology","id":762},{"q":"What does the James-Lange theory of emotion say?","a":"Physical arousal comes first, then we interpret it as an emotion","t":"Brain & neuropsychology","id":763},{"q":"What are the stages of the James-Lange theory?","a":"Event (stressor), Physiological arousal, Interpretation of the arousal, Emotion","t":"Brain & neuropsychology","id":764},{"q":"What is the second stage of the James-Lange theory?","a":"Physiological arousal – the body reacts (e.g. heart rate increases)","t":"Brain & neuropsychology","id":765},{"q":"Give an example of the James-Lange theory.","a":"You hear a noise in a dark alley, your heart races, and you conclude you are scared because your heart is racing","t":"Brain & neuropsychology","id":766},{"q":"Which psychologist's alternative theory says emotion and arousal happen at the same time?","a":"Cannon (the Cannon-Bard theory)","t":"Brain & neuropsychology","id":767},{"q":"What does Schachter and Singer's two-factor theory add to the James-Lange theory?","a":"A cognitive element – we use social cues to decide what our arousal means","t":"Brain & neuropsychology","id":768},{"q":"Give a weakness of the James-Lange theory.","a":"People with paralysis and no bodily sensation still feel emotions","t":"Brain & neuropsychology","id":769},{"q":"Why does the James-Lange theory lack scientific validity?","a":"It was based on clinical observations and correlations, not experiments","t":"Brain & neuropsychology","id":770},{"q":"What is a neuron?","a":"A nerve cell that sends electrical and chemical messages","t":"Brain & neuropsychology","id":771},{"q":"Name the three types of neuron.","a":"Sensory neuron, Relay neuron, Motor neuron","t":"Brain & neuropsychology","id":772},{"q":"What type of neurons carry information from sensory receptors to the CNS?","a":"Sensory neurons","t":"Brain & neuropsychology","id":773},{"q":"What type of neurons carry information within the CNS?","a":"Relay neurons","t":"Brain & neuropsychology","id":774},{"q":"Where do motor neurons carry information to?","a":"From the CNS to effectors (muscles and glands)","t":"Brain & neuropsychology","id":775},{"q":"Do motor neurons have short or long axons?","a":"Long axons (and short dendrites)","t":"Brain & neuropsychology","id":776},{"q":"Do sensory neurons have short or long dendrites?","a":"Long dendrites (and short axons)","t":"Brain & neuropsychology","id":777},{"q":"Do relay neurons have short or long axons?","a":"Short axons and short dendrites","t":"Brain & neuropsychology","id":778},{"q":"What do dendrites do?","a":"Receive messages from other neurons","t":"Brain & neuropsychology","id":779},{"q":"What does the cell body contain?","a":"The nucleus","t":"Brain & neuropsychology","id":780},{"q":"What does the axon do?","a":"Carries the electrical impulse away from the cell body","t":"Brain & neuropsychology","id":781},{"q":"What is the purpose of the myelin sheath?","a":"It insulates and protects the axon and speeds up the electrical impulse","t":"Brain & neuropsychology","id":782},{"q":"What are the gaps along the myelin sheath called?","a":"Nodes of Ranvier","t":"Brain & neuropsychology","id":783},{"q":"What is found at the end of the axon?","a":"Axon terminals (terminal buttons), which release neurotransmitters","t":"Brain & neuropsychology","id":784},{"q":"If a motor neuron touches an effector, what is at the end of the axon terminal?","a":"A motor end plate (neuromuscular junction) connecting to the muscle","t":"Brain & neuropsychology","id":785},{"q":"What is the proper word for when a neuron fires?","a":"An action potential","t":"Brain & neuropsychology","id":786},{"q":"When a message passes along a neuron, is it electrical or chemical?","a":"Electrical","t":"Brain & neuropsychology","id":787},{"q":"When a message passes between neurons, is it electrical or chemical?","a":"Chemical","t":"Brain & neuropsychology","id":788},{"q":"What is the gap between two neurons called?","a":"The synapse (synaptic cleft/gap)","t":"Brain & neuropsychology","id":789},{"q":"What is the process where messages pass between neurons using neurotransmitters?","a":"Synaptic transmission","t":"Brain & neuropsychology","id":790},{"q":"What are neurotransmitters?","a":"Chemical messengers released across the synapse by one neuron and picked up by the next","t":"Brain & neuropsychology","id":791},{"q":"Describe the process of synaptic transmission.","a":"An electrical impulse reaches the axon terminal, vesicles release neurotransmitters into the synapse, they diffuse across and bind to receptor sites on the next neuron's dendrites","t":"Brain & neuropsychology","id":792},{"q":"What are vesicles?","a":"Small sacs in the axon terminal that contain neurotransmitters","t":"Brain & neuropsychology","id":793},{"q":"What are receptor sites?","a":"Places on the next neuron where specific neurotransmitters bind","t":"Brain & neuropsychology","id":794},{"q":"What does it mean if a neurotransmitter has an excitatory effect?","a":"It makes the next neuron more likely to fire","t":"Brain & neuropsychology","id":795},{"q":"What does it mean if a neurotransmitter has an inhibitory effect?","a":"It makes the next neuron less likely to fire","t":"Brain & neuropsychology","id":796},{"q":"Give an example of an excitatory and an inhibitory neurotransmitter.","a":"Excitatory – adrenaline; Inhibitory – serotonin","t":"Brain & neuropsychology","id":797},{"q":"What is summation?","a":"Adding up all the excitatory and inhibitory messages to decide if the next neuron fires","t":"Brain & neuropsychology","id":798},{"q":"What does Hebb's theory of learning say?","a":"The brain changes as we learn – connections between neurons get stronger the more they are used","t":"Brain & neuropsychology","id":799},{"q":"What is an engram?","a":"A memory trace left in the brain when we learn something","t":"Brain & neuropsychology","id":800},{"q":"According to Hebb, how can an engram be strengthened?","a":"Through repeated practice and rehearsal","t":"Brain & neuropsychology","id":801},{"q":"When neurons connect and work together, what is this called?","a":"A cell assembly","t":"Brain & neuropsychology","id":802},{"q":"When one neuron repeatedly excites another and the synaptic knob grows, what is this called?","a":"Neuronal growth","t":"Brain & neuropsychology","id":803},{"q":"Why was Hebb's theory important?","a":"It was the first to suggest the brain is not fixed and can change with learning (plasticity)","t":"Brain & neuropsychology","id":804},{"q":"Hebb explains all learning in terms of neuron connections. Why is this a problem?","a":"It is reductionist – it ignores other factors such as motivation, environment and emotion","t":"Brain & neuropsychology","id":805},{"q":"Give a strength of Hebb's theory.","a":"It can be applied to education – practice and revision strengthen learning","t":"Brain & neuropsychology","id":806},{"q":"What is localisation of function?","a":"The idea that different areas of the brain are responsible for specific functions","t":"Brain & neuropsychology","id":807},{"q":"Where is the motor area?","a":"In the frontal lobe (at the back of it)","t":"Brain & neuropsychology","id":808},{"q":"What does the motor area do?","a":"Controls voluntary movement","t":"Brain & neuropsychology","id":809},{"q":"Which area of the brain is responsible for pressure, heat and touch?","a":"The somatosensory area in the parietal lobe","t":"Brain & neuropsychology","id":810},{"q":"Where is the visua
