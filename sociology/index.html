<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fount of Knowledge (GCSE Sociology)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7B5BE0">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fount Sociology">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap"></noscript>
<style>
:root{
  --paper:#EEF1F7; --card:#FFFFFF; --ink:#18203A; --muted:#566082; --line:#D3D9E6; --soft:#E3E8F2;
  --good:#187651; --good-bg:#DDF3E8; --warn:#A24B18; --warn-bg:#FBE7D9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
    --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121829; --card:#1B233B; --ink:#E9EDF7; --muted:#9CA6C2; --line:#2B3557; --soft:#232C49;
  --good:#4CC896; --good-bg:#153A2E; --warn:#F39A63; --warn-bg:#3E2616; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus,#4D7CFE);outline-offset:2px;border-radius:6px}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,56px);line-height:.95;letter-spacing:-.02em;margin:0}
h1 span:not(.h1t){display:block;font-size:.42em;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:10px;line-height:1.2}
h1 span b{font-weight:500}
.meter{min-width:220px;flex:0 1 300px}
.meter p{margin:0 0 6px;font-size:15px;color:var(--muted)}
.meter b{color:var(--ink);font-family:var(--display);font-size:22px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack i{display:block;height:100%}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;width:max-content;max-width:100%;margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:10px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}

/* topics */
.topics{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin-bottom:22px}
.topics-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.topics-head h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 6px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:8px}
.chip{--c:#888;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:5px;border:2px solid var(--line);background:transparent;border-radius:12px;padding:8px 11px 9px;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.chip .row{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;line-height:1.2}
.chip .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none;opacity:.35}
.chip .foot2{display:flex;align-items:center;gap:8px}
.chip .n{font-weight:400;color:var(--muted);font-size:13px;white-space:nowrap}
.chip .bar{flex:1;height:5px;border-radius:9px;background:var(--soft);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip[aria-pressed="true"] .dot{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}

/* shared */
.panel[hidden]{display:none}
.bar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 14px;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.btn{border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:12px;font-weight:700;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
kbd{font-family:var(--body);font-size:12px;border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7;margin-left:6px}
.spacer{flex:1}

/* flashcard: the one bold thing */
.stage{perspective:1600px}
.card{--c:#888;position:relative;display:grid;min-height:340px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px 30px 46px;display:flex;flex-direction:column}
.face::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:var(--c);border-radius:20px 0 0 20px}
.face.back{transform:rotateY(180deg);background:color-mix(in srgb,var(--c) 6%,var(--card))}
.tag{font-size:14px;font-weight:700;color:var(--c);display:flex;justify-content:space-between;gap:10px;position:relative}
.tag .muted{font-weight:400}
.q{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,36px);line-height:1.15;letter-spacing:-.01em;margin:auto 0;padding:20px 0}
.face.back .q-small{font-size:15px;color:var(--muted);margin:14px 0 10px;position:relative}
.a{font-size:clamp(18px,2.2vw,21px);line-height:1.55;position:relative;margin-bottom:auto}
.a ul{margin:0;padding-left:1.1em}
.a li{margin:3px 0}
.a li::marker{color:var(--c)}
.hint{position:relative;margin-top:14px;font-size:14px;color:var(--muted)}
.card-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.card-actions .btn{flex:1 1 120px}
.nav{display:flex;gap:8px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:44px;font-size:20px}
.progressline{height:4px;background:var(--soft);border-radius:4px;margin:0 0 14px;overflow:hidden}
.progressline i{display:block;height:100%;background:var(--ink);transition:width .3s}

.empty{background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:40px 28px;text-align:center}
.empty h3{font-family:var(--display);font-size:26px;margin:0 0 8px}
.empty p{margin:0 auto 18px;max-width:46ch;color:var(--muted)}

/* quiz */
.quiz-q{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 28px;border-top:10px solid var(--c)}
.quiz-q .q{margin:10px 0 18px;padding:0;font-size:clamp(22px,3vw,30px)}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:12px 14px;resize:vertical;font-size:17px;line-height:1.5}
textarea:focus{border-color:var(--c);outline:none}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.compare > div{border-radius:12px;padding:14px 16px;background:var(--soft)}
.compare h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:700}
.compare .model{background:color-mix(in srgb,var(--c) 12%,var(--card))}
@media (max-width:640px){.compare{grid-template-columns:1fr}}
.score{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;margin:0}
.results{list-style:none;padding:0;margin:20px 0;text-align:left;display:grid;gap:8px}
.results li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 44px;position:relative}
.results li::before{position:absolute;left:14px;top:11px;font-weight:800;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px}
.results li.ok::before{content:"✓";background:var(--good-bg);color:var(--good)}
.results li.no::before{content:"✗";background:var(--warn-bg);color:var(--warn)}
.results li .ans{font-size:15px;color:var(--muted);margin-top:4px}
.size-pick{display:flex;gap:10px;justify-content:center;margin:0 0 20px;flex-wrap:wrap}
.size-pick button{width:74px;height:74px;border-radius:16px;border:2px solid var(--line);background:var(--card);font-family:var(--display);font-weight:800;font-size:28px}
.size-pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}

/* browse */
.search{flex:1 1 260px;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:10px 14px;font-size:16px}
.search:focus{border-color:var(--ink);outline:none}
.list{display:grid;gap:8px}
.item{--c:#888;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px}
.item summary{list-style:none;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:baseline}
.item summary::-webkit-details-marker{display:none}
.item summary .num{font-size:13px;color:var(--muted);min-width:2.6em}
.item summary .qt{font-weight:700;flex:1}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.k{background:var(--good-bg);color:var(--good)}
.pill.l{background:var(--warn-bg);color:var(--warn)}
.item .body{padding:0 16px 14px calc(16px + 2.6em + 12px)}
.item .body .a{font-size:17px}
.item .body .mini{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .body .mini button{border:1px solid var(--line);background:transparent;border-radius:9px;padding:5px 12px;font-size:14px}
.item .body .mini button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
mark{background:#FFE17A;color:#18203A;border-radius:3px;padding:0 1px}
.foot{margin-top:40px;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

@media (max-width:560px){
  .wrap{padding:18px 14px 40px}
  .face{padding:24px 20px 24px 34px}
  .face::before{width:10px}
  .card{min-height:300px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .chip{padding:6px 9px 7px;border-width:1.5px}
  .chip .row{font-size:14px}
  .topics{padding:12px 10px 10px}
  .card-actions .nav{order:3;width:100%;justify-content:center}
  .tabs{width:100%}.tabs button{flex:1;padding:9px 6px}
}
@media (hover:none){kbd{display:none}}
@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .progressline i{transition:none}
}

/* ================= GAME LAYER ================= */
.hud{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 12px;margin:0 0 18px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px}
.hud .lvl{position:relative;width:50px;height:50px;border:0;background:none;padding:0;flex:none}
.hud .lvl svg{width:50px;height:50px;transform:rotate(-90deg)}
.hud .lvl b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;line-height:1}
.hud .lvl small{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;letter-spacing:.06em;background:var(--ink);color:var(--paper);border-radius:5px;padding:0 4px}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:5}
.ring-fg{fill:none;stroke:url(#xpGrad);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.3,.7,.2,1)}
.xpbox{flex:1 1 180px;min-width:150px}
.xprow{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.xprow b{font-family:var(--display);font-size:16px}
.xprow span{color:var(--muted);white-space:nowrap}
.xpbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7B5BE0,#D6478F,#F39A3C);transition:width .6s cubic-bezier(.3,.7,.2,1)}
.hud-stat{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1;border:0;background:var(--soft);border-radius:12px;padding:8px 11px;white-space:nowrap}
.hud-stat .lab{font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);display:block;margin-top:2px}
.hud-stat .ico{font-size:22px}
.hud-stat.cold .ico{filter:grayscale(1);opacity:.5}
.goalring{width:30px;height:30px;transform:rotate(-90deg);flex:none}
.goalring .ring-fg{stroke:var(--good)}
.goalring .ring-bg{stroke:var(--line)}
.combo{pointer-events:none;display:none;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#F39A3C,#E0533D);border-radius:12px;padding:8px 12px;white-space:nowrap}
.combo.on{display:flex}
.combo.hot{background:linear-gradient(135deg,#D6478F,#7B5BE0)}
.combo.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.25) rotate(-4deg)}}
.hud-spacer{display:none}
.iconbtn{border:0;background:var(--soft);border-radius:12px;width:42px;height:42px;font-size:19px;flex:none}
@media (max-width:560px){
  .hud{gap:8px;padding:8px 10px;border-radius:14px;margin-bottom:14px}
  .hud{flex-wrap:wrap;row-gap:6px}
  .hud-spacer{display:block;flex:1}
  .xpbox{order:5;flex:1 1 100%;min-width:0}
  .xprow{margin-bottom:3px;font-size:12px}
  .xprow span{display:none}
  .xprow b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .xpbar{height:6px}
  .hud .lvl,.hud .lvl svg{width:44px;height:44px}
  .iconbtn{width:36px;height:36px;font-size:16px}
  .combo{position:absolute;right:8px;top:calc(100% + 6px);font-size:16px;padding:6px 10px}
  .hud-stat{font-size:16px;padding:7px 8px;gap:4px}
  .hud-stat .ico{font-size:18px}
  .hud-stat .lab{display:none}
}

/* floaters, toasts, modal, fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.floater{position:fixed;z-index:95;pointer-events:none;font-family:var(--display);font-weight:800;font-size:22px;color:var(--good);text-shadow:0 2px 0 var(--card);animation:floatUp 1.1s ease-out forwards;white-space:nowrap;transform:translateX(-50%)}
.floater.big{font-size:30px;color:#E0A100}
.floater.meh{color:var(--warn);font-size:18px}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-80px}}
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);pointer-events:none;z-index:96;display:grid;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastIn .4s cubic-bezier(.2,1.4,.4,1)}
.toast .ti{font-size:30px;line-height:1}
.toast b{display:block;font-family:var(--display);font-size:17px}
.toast span{font-size:14px;opacity:.8}
.toast.out{animation:toastOut .3s forwards}
@media (min-width:900px){#toasts{left:auto;right:20px;transform:none;width:340px}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}
.overlay{position:fixed;inset:0;z-index:97;display:grid;place-items:center;background:rgba(10,14,30,.55);padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.levelup{background:var(--card);border-radius:24px;padding:32px 28px;text-align:center;max-width:360px;width:100%;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.levelup .kick{font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);text-transform:uppercase}
.levelup .num{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;margin:6px 0;background:linear-gradient(135deg,#7B5BE0,#D6478F,#F39A3C);-webkit-background-clip:text;background-clip:text;color:transparent}
.levelup h3{font-family:var(--display);font-size:24px;margin:0 0 6px}
.levelup p{color:var(--muted);margin:0 0 20px}

/* golden card */
.card.golden .face{border:2px solid #E0A100;box-shadow:0 0 0 4px color-mix(in srgb,#E0A100 22%,transparent)}
.card.golden .face.front{background:linear-gradient(135deg,color-mix(in srgb,#FFD54A 16%,var(--card)),var(--card) 55%,color-mix(in srgb,#FFD54A 12%,var(--card)))}
.card.golden .face.front::after{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(110deg,transparent 35%,rgba(255,236,150,.45) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.goldtag{color:#B07E00;font-weight:800}
:root[data-theme="dark"] .goldtag{color:#FFD54A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .goldtag{color:#FFD54A}}
.chip .medal{margin-left:auto;font-size:15px}

/* arcade */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{--c:#7B5BE0;position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:20px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.mode:hover{transform:translateY(-3px);border-color:var(--c)}
.mode .mi{font-size:40px;line-height:1}
.mode h3{font-family:var(--display);font-size:24px;margin:4px 0 0}
.mode p{margin:0;color:var(--muted);font-size:15px}
.mode .best{margin-top:auto;padding-top:10px;font-weight:700;font-size:15px;color:var(--c)}
.mode .new{position:absolute;top:14px;right:14px;background:#E0533D;color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.arc-note{margin:14px 2px 0;font-size:14px;color:var(--muted)}
.arc-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-weight:700}
.arc-top .big{font-family:var(--display);font-size:26px;font-weight:800}
.arc-top .spacer{flex:1}
.timebar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,#1C8A5E,#4CC896);border-radius:99px}
.timebar.low i{background:linear-gradient(90deg,#E0533D,#F39A3C)}

.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;transition:border-color .12s,transform .12s}

.newbest{display:inline-block;background:linear-gradient(135deg,#F39A3C,#E0533D);color:#fff;font-weight:800;border-radius:99px;padding:4px 14px;margin-bottom:8px;animation:pulse 1.2s infinite}

.gapsp{width:14px}
.gapch{font-weight:800;font-size:18px;padding:0 2px}
.gapin{width:100%;font-size:19px}
.gapfb{min-height:26px;margin-top:8px;font-size:16px}
.shake{animation:shake .35s}
.mode.featured{border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,var(--card))}

/* spaced repetition */
.duebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--good-bg);color:var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:16px}
.duebar span{flex:1}
/* boss battles */
.bossbar{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--c);border-radius:20px;padding:14px 16px;margin-bottom:10px}

.boss-info{flex:1;min-width:0}

.hp{height:14px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 2px}

.boss-info .muted{font-size:13px}

.boss-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}

@keyframes hurt{0%{box-shadow:inset 0 0 0 0 rgba(224,83,61,0)}30%{box-shadow:inset 0 0 0 9999px rgba(224,83,61,.12)}100%{box-shadow:inset 0 0 0 0 rgba(224,83,61,0)}}
@media (max-width:560px){.boss-ico{font-size:42px}.bossbar{gap:10px;padding:12px}.boss-info b{font-size:17px}}
/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.theme{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}

.theme b{font-size:15px}
.theme span:last-child{font-size:13px;color:var(--muted)}
.theme.on{border-color:var(--ink)}
.theme:disabled{opacity:.55;cursor:default}
@media (prefers-reduced-motion:reduce){.boss-ico.hit,#arcArea.hurt{animation:none}}

/* ---------- teacher page + projector ---------- */

.proj-sc{font-size:clamp(20px,2.2vw,30px);color:var(--muted);margin-bottom:14px;line-height:1.4}

}

/* certificates */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.certbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:2px solid color-mix(in srgb,#E0A100 55%,var(--line));background:color-mix(in srgb,#FFD54A 10%,var(--card));border-radius:14px;padding:12px}
.certbtn .ci{font-size:28px}
.certbtn b{font-size:15px}
.certbtn span:last-child{font-size:13px;color:var(--muted)}
.certbtn.locked{border-color:var(--line);background:var(--paper);opacity:.6;cursor:default}
.cert-overlay{align-content:start;overflow:auto;gap:12px}
.cert-tools{display:flex;gap:10px;align-items:end;flex-wrap:wrap;justify-content:center;background:var(--card);padding:12px;border-radius:14px;max-width:880px;width:100%}
.cert-tools label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;flex:1 1 220px}
.cert-tools input{flex:none;width:100%}
.cert{width:min(880px,100%);aspect-ratio:297/210;background:#FFFDF6;color:#2A2416;padding:2.2%;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.35);font-family:Georgia,"Times New Roman",serif}
.cert-in{height:100%;border:3px double #B8860B;outline:1.5px solid #B8860B;outline-offset:-10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3% 6%;gap:.6em;background:radial-gradient(circle at 50% 40%,#FFF8E1 0,transparent 70%)}
.cert-seal{font-size:clamp(30px,5vw,54px);width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:radial-gradient(#FFE58A,#D4A017);box-shadow:0 0 0 4px #FFFDF6,0 0 0 6px #B8860B}
.cert-kick{font-family:var(--display);font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:clamp(14px,2.4vw,26px);color:#8A6508}
.cert-small{margin:0;font-size:clamp(11px,1.6vw,17px);font-style:italic;color:#5A4E33}
.cert-name{font-family:var(--display);font-weight:800;font-size:clamp(26px,5.4vw,58px);line-height:1.05;border-bottom:2px solid #B8860B;padding:0 .4em .1em;min-width:50%}
.cert-ach{font-family:var(--display);font-weight:700;font-size:clamp(16px,3vw,32px);color:#1F3A5F}
.cert-foot{display:flex;justify-content:space-between;width:80%;margin-top:4%;gap:20px}
.cert-foot{align-items:flex-end}
.cert-foot > div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1}
.cert-sig{font-size:clamp(12px,2vw,20px);min-height:1.4em}
.cert-sig.sig{font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;font-size:clamp(18px,3.4vw,36px);color:#1F3A5F}
.cert-line{border-top:1px solid #5A4E33;width:100%;font-size:clamp(10px,1.3vw,13px);color:#5A4E33;padding-top:2px}
@media (max-width:700px){.cert{aspect-ratio:auto}.cert-in{padding:8% 6%}.cert-seal{margin-top:6px}}
@page{size:A4 landscape;margin:0}
@media print{
  body.printing-cert > *:not(.cert-overlay){display:none!important}
  body.printing-cert .cert-overlay{position:static;background:none;padding:0;display:block}
  body.printing-cert .cert-tools{display:none}
  body.printing-cert .cert{width:297mm;height:210mm;max-width:none;box-shadow:none;border-radius:0;aspect-ratio:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* secret scrolls */
.scroll-bonus{display:block;margin-top:6px;font-size:12px;font-weight:800;color:#9A6324}
.seal{display:flex;flex-direction:column;gap:4px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;font-weight:700;color:var(--muted);width:100%}
.seal.open{color:var(--good)}
.seal-bar{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.seal-bar i{display:block;height:100%;background:#9A6324}
.seal-n{font-weight:600}
.scrolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.scrollcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px dashed var(--line);background:var(--paper);border-radius:14px;padding:12px}
.scrollcard .si{font-size:26px}.scrollcard b{font-size:15px}.scrollcard span:last-child{font-size:13px;color:var(--muted);font-style:italic}
.scrollcard.got{border:2px solid #C9A227;background:linear-gradient(135deg,#FBF1D3,#F3E2B3);color:#3B2F12}
.scrollcard.got span:last-child{color:#6B5A2E;font-style:normal}
.badge.secret span{font-style:italic}
.scroll{width:min(460px,100%);animation:unroll .7s cubic-bezier(.2,.9,.3,1)}
@keyframes unroll{from{transform:scaleY(.06);opacity:.4}to{transform:none;opacity:1}}
.scroll-rod{height:18px;border-radius:9px;background:linear-gradient(#8A5A2B,#C68A4A,#8A5A2B);margin:0 -10px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.scroll-body{background:linear-gradient(90deg,#E9D6A6,#F8EBC8 15%,#F8EBC8 85%,#E9D6A6);color:#3B2F12;padding:26px 28px;text-align:center;font-family:Georgia,"Times New Roman",serif}
.scroll-kick{font-family:var(--display);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:#8A6508}
.scroll-body h3{font-family:var(--display);font-size:28px;margin:8px 0 12px;color:#2A210C}
.scroll-body p{font-size:18px;line-height:1.55;margin:0 0 20px}
.scroll-body .btn{background:#3B2F12;border-color:#3B2F12;color:#F8EBC8}
.scroll.blues .scroll-body{background:linear-gradient(90deg,#1733A6,#1F3FBF 15%,#1F3FBF 85%,#1733A6);color:#fff}
.scroll.blues h3,.scroll.blues .scroll-kick{color:#fff}
.scroll.blues .scroll-rod{background:linear-gradient(#DDE4FF,#FFFFFF,#DDE4FF)}
.scroll.blues .btn{background:#fff;border-color:#fff;color:#1F3FBF}
@media (prefers-reduced-motion:reduce){.scroll{animation:none}}
.gapcard{margin-bottom:0}
.gapcard.golden{border:2px solid #E0A100;border-top:10px solid #E0A100;box-shadow:0 0 0 4px color-mix(in srgb,#E0A100 22%,transparent)}
.install-btn{padding:6px 14px;font-size:14px}
@media (display-mode: standalone){.install-btn{display:none!important}}

.ext-sec{font-family:var(--display);font-weight:800;font-size:14px;margin:12px 0 4px!important;text-transform:uppercase;letter-spacing:.04em}
.ext-sec span{font-family:var(--body);font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.tdeep{line-height:1.7}
.tdeep span,.td-key span{border-radius:5px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tdl{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:5px;font-size:11px;margin-right:4px;color:#fff;vertical-align:1px}
.td-t{background:color-mix(in srgb,#7B5BE0 16%,transparent)}.td-t .tdl{background:#7B5BE0}
.td-d{background:color-mix(in srgb,#2596B0 16%,transparent)}.td-d .tdl{background:#2596B0}
.td-e{background:color-mix(in srgb,#D98E0F 18%,transparent)}.td-e .tdl{background:#D98E0F}
.td-x{background:color-mix(in srgb,#1C8A5E 16%,transparent)}.td-x .tdl{background:#1C8A5E}
.td-key{font-size:13px;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px!important}
.fw-tag{display:inline-block;margin:10px 0 2px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--ink);color:var(--paper)}
.fw-tag b{font-family:var(--display)}
.mt-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px}
.mt-col{display:grid;gap:8px;align-content:start}
.mt-grid .opt{min-height:56px}
.mt-l.sel{border-color:#9A6324;box-shadow:0 0 0 2px #9A6324 inset;background:#fff6e0}
.sw-stage{position:relative;min-height:220px;display:grid;place-items:center;margin:12px 0}
.sw-card{width:min(520px,100%);min-height:170px;display:grid;place-items:center;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;font-size:21px;font-weight:700;line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.08);transition:transform .25s,opacity .25s;touch-action:none;cursor:grab;user-select:none}
.sw-card p{margin:0}
.sw-card.tl{border-color:#2C6BE0}.sw-card.tr{border-color:#C2410C}
.sw-fb{min-height:24px;text-align:center;margin-top:8px}
.sw-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw-btns .btn{font-size:17px;padding:14px}
.sw-l{border-color:#2C6BE0!important}.sw-r{border-color:#C2410C!important}
.ws-clues{margin:8px 0 14px;padding-left:24px;display:grid;gap:6px;font-size:18px}
.ws-clues li:last-child{font-weight:800;animation:bump .3s}
.ws-opts{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.psy-clue{margin:4px 0 12px;font-size:16px}
.psy-board{display:grid;gap:6px;justify-content:center;margin:8px 0 12px}
.psy-row{display:flex;gap:6px;justify-content:center}
.psy-tile{width:clamp(34px,9vw,52px);height:clamp(34px,9vw,52px);display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;font-family:var(--display);font-weight:800;font-size:clamp(18px,4.5vw,26px);background:var(--card)}
.psy-tile.typed{border-color:var(--ink)}
.psy-tile.g,.psy-k.g{background:#1C8A5E;border-color:#1C8A5E;color:#fff}
.psy-tile.y,.psy-k.y{background:#D9A400;border-color:#D9A400;color:#fff}
.psy-tile.b,.psy-k.b{background:#6B7280;border-color:#6B7280;color:#fff}
.psy-kb{display:grid;gap:6px;max-width:560px;margin:0 auto}
.psy-kr{display:flex;gap:4px;justify-content:center}
.psy-k{flex:1;min-width:0;max-width:44px;height:48px;border:0;border-radius:8px;background:var(--soft);font-weight:800;font-size:15px;color:var(--ink)}
.psy-k.wide{max-width:72px;flex:1.6;font-size:13px}
.petstrip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:2px 14px 2px 4px;margin:0 0 14px;color:var(--ink);font-size:16px;line-height:1.35}
.petstrip[hidden]{display:none}
.petstrip:hover{background:var(--soft)}
.petstrip .ps-art{flex:none;display:block;line-height:0}
.petstrip .ps-txt{flex:1;min-width:0}
.petstrip .ps-cheese{flex:none;font-size:18px;letter-spacing:2px}
.petstrip .ps-cheese i{font-style:normal;opacity:.25}
.petstrip.sleepy,.petstrip.asleep{border-style:dashed}
.petstrip.ecstatic{border-color:var(--good);background:var(--good-bg)}
@media (max-width:560px){.petstrip{font-size:14px;gap:8px}.petstrip .ps-art svg{width:84px;height:63px}.petstrip .ps-cheese{font-size:14px}}
.petbtn{width:auto;padding:0 4px;overflow:hidden}
.petbtn svg{display:block}
.petbtn.sleepy{filter:saturate(.6)}
.pet-box{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pet-art{flex:none}
.pet-info{flex:1;min-width:220px}
.pet-msg{margin:0;font-size:17px}
.box .pet-info h3{display:flex;align-items:baseline;gap:8px;justify-content:flex-start}
@media (max-width:560px){.petbtn svg{width:34px;height:26px}.hud{gap:6px!important}.hud .iconbtn{width:36px;min-width:36px;height:38px;padding:0}.hud .petbtn{width:auto;padding:0 2px}.hud .focusbtn{width:auto;min-width:36px;padding:0 6px}.hud .hud-stat{padding-left:8px;padding-right:8px}.hud #hudGoal .goalring{display:none}}
.pet-svg.ecstatic .pet-body{animation:petdance .7s ease-in-out infinite alternate;transform-origin:80px 110px;transform-box:view-box}
.pet-svg.happy .pet-tail{animation:petwag 1s ease-in-out infinite alternate;transform-origin:118px 96px;transform-box:view-box}
.pet-z text{animation:petz 2.4s ease-in-out infinite}
.pet-z text:nth-child(2){animation-delay:.4s}.pet-z text:nth-child(3){animation-delay:.8s}
@keyframes petdance{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
@keyframes petwag{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
@keyframes petz{0%,100%{opacity:.2;transform:translateY(4px)}50%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.pet-svg *{animation:none!important}}
.proj-scores.race{grid-template-columns:1fr;gap:8px}
.race-lane{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:10px;align-items:center}
.race-track{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.race-sq{aspect-ratio:1;display:grid;place-items:center;border-radius:8px;background:var(--soft);border:2px solid var(--line);font-size:clamp(14px,1.6vw,22px)}
.race-sq.up{background:#DDF3E8}.race-sq.down{background:#FDE3D3}.race-sq.fin{background:#FFF3C4;border-color:#E0A100}
.race-tok{font-style:normal;width:80%;height:80%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;background:hsl(var(--h) 70% 45%);box-shadow:0 2px 6px rgba(0,0,0,.25);animation:bump .3s}
.gotd-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(90deg,#FFF3C4,#FFE7A0);border:2px solid #E0A100;border-radius:16px;padding:12px 16px;margin-bottom:14px;color:#3A2A00}
.gotd-bar>div{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.gotd-bar span{font-size:14px}
.gotd-ico{font-size:30px}
.mode.gotd{outline:3px solid #E0A100;outline-offset:2px}
.gotd-tag{background:#E0A100!important;color:#3A2A00!important}
.hardbtn{display:inline-block;margin-top:8px;padding:5px 10px;border-radius:99px;background:#E0533D;color:#fff;font-weight:800;font-size:13px}
.hardbtn:hover{filter:brightness(1.1)}
.why{margin-top:8px;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,#E0A100 14%,var(--card));font-size:15px;line-height:1.4;color:var(--ink)}
.flip-commit{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
.flip-commit input{flex:1;min-width:200px}
.flip-verdict{margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:700;font-size:15px}
.flip-verdict.yes{background:var(--good-bg);color:var(--good)}
.flip-verdict.close{background:#FFF3C4;color:#7A5A00}
.flip-verdict.no{background:var(--warn-bg);color:var(--warn)}
mark.hit{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--ink);font-weight:800;border-bottom:3px solid var(--good);border-radius:3px;padding:0 2px}
.flip-mine{margin-top:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;font-size:15px}
.mc-card .opts{margin-top:12px}
.th-note{font-size:12px!important;font-style:italic;line-height:1.3;margin:2px 0 4px}
.ord-done{margin:10px 0 12px;padding-left:28px;display:grid;gap:6px}
.ord-done li{background:var(--good-bg);border-radius:10px;padding:8px 12px;font-size:16px}
.ord-done li.ord-empty{background:var(--soft);min-height:38px;border:2px dashed var(--line)}
.ord-pool{display:grid;gap:8px}
.ord-step{cursor:grab}
.ord-step.dragging{opacity:.4}
.ord-grip{color:var(--muted);font-size:18px;line-height:1}
.ord-done li.ord-empty.over{border-color:#9A6324;background:#FFF3C4}
.ord-tip{font-size:14px;margin:8px 0 0}
@media (hover:none){.ord-grip{display:none}.ord-tip{display:none}}
.ord-step{justify-content:flex-start}
.focusbtn{width:auto;min-width:44px;padding:0 10px;font-weight:800;white-space:nowrap}
.focusbtn.on{background:#1C8A5E;color:#fff}
.x2{display:inline-block;font-family:var(--body);font-size:11px;font-weight:800;color:#3b2f00;background:#ffe14d;border-radius:2px 2px 6px 2px;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:0;transform:rotate(-4deg);box-shadow:1px 2px 4px rgba(0,0,0,.18)}
.sticky{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05;color:#3b2f00;background:linear-gradient(180deg,#fff27a,#ffe14d);padding:8px 10px 7px;margin-left:10px;transform:rotate(-5deg);box-shadow:2px 4px 8px rgba(0,0,0,.18);border-radius:2px 2px 10px 2px;vertical-align:middle;position:relative;letter-spacing:0}
.sticky::before{content:"";position:absolute;top:-6px;left:50%;width:34px;height:12px;transform:translateX(-50%) rotate(3deg);background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.06)}
.sticky small{font-family:var(--body);font-size:11px;font-weight:700;margin-top:2px}
.sticky.sm{position:absolute;top:-10px;right:-6px;margin:0;font-size:12px;padding:4px 6px;transform:rotate(6deg);z-index:1}
.sticky.sm::before{width:20px;height:8px;top:-4px}
.tp-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;padding:5px;background:var(--soft);border-radius:14px}
.tp-tabs button{flex:1 1 auto;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px;color:var(--muted)}
.tp-tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tp-n{font-size:12px;font-weight:700;background:var(--line);border-radius:99px;padding:1px 7px;margin-left:4px}
.tp-h{font-family:var(--display);font-size:18px;margin:18px 0 8px}
.weak-list{display:grid;gap:10px}
.weak-row{border-left:6px solid var(--c);margin:0}
.weak-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.weak-head .spacer{flex:1}
.weak-tag{color:#fff;font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px}
.weak-pct{font-family:var(--display);font-size:20px}
.weak-bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin:8px 0}
.weak-bar i{display:block;height:100%}
.weak-stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.weak-stats b{color:var(--ink)}
/* trophies */
.profile{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin-bottom:14px}
.profile .bigring{position:relative;width:110px;height:110px;flex:none}
.profile .bigring svg{width:110px;height:110px;transform:rotate(-90deg)}
.profile .bigring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:40px}
.profile h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.1}
.profile p{margin:4px 0 0;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.tile span{font-size:14px;color:var(--muted)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:14px}
.box h3{font-family:var(--display);font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.box h3 small{font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:16px;gap:4px;overflow-x:auto}
.heat i{border-radius:4px;background:var(--soft)}
.heat i.l1{background:color-mix(in srgb,var(--good) 30%,var(--soft))}
.heat i.l2{background:color-mix(in srgb,var(--good) 60%,var(--soft))}
.heat i.l3{background:var(--good)}
.heat i.today{outline:2px solid var(--ink);outline-offset:1px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;background:var(--paper)}
.badge .bi{font-size:36px;line-height:1.1}
.badge b{display:block;font-size:15px;margin-top:6px}
.badge span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.badge.locked .bi{filter:grayscale(1);opacity:.3}
.badge.locked b{color:var(--muted)}
.badge.got{border-color:color-mix(in srgb,#E0A100 60%,var(--line));background:color-mix(in srgb,#FFD54A 10%,var(--card))}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap}
@media (max-width:560px){.tabs button{font-size:14px;padding:9px 4px}}
.tabs{flex-wrap:wrap;overflow:visible;width:auto}
.tabs{gap:2px}.tabs button{flex:0 1 auto;padding:9px 8px;font-size:14.5px}

<script type="application/json" id="data-cards">[{"q":"What is sociology?","a":"The study of human social life and social relationships. Sociologists investigate and explain the social world and our behaviour in it","t":"Key concepts","id":1},{"q":"When did sociology develop as a subject?","a":"In the 19th century, during a time of rapid economic and social change (industrialisation and capitalism)","t":"Key concepts","id":2},{"q":"Who are seen as the three founders of sociology?","a":"Karl Marx, Emile Durkheim and Max Weber","t":"Key concepts","id":3},{"q":"Who is often called the first female sociologist?","a":"Harriet Martineau","t":"Key concepts","id":4},{"q":"Why is it significant that Martineau is not usually counted as a founder of sociology?","a":"It suggests women's contributions were overlooked, which feminists see as an example of patriarchy in academic life","t":"Key concepts","id":5},{"q":"What are values?","a":"Beliefs and ideas about what is seen as desirable or worth striving for in a society, such as privacy and respect for life","t":"Key concepts","id":6},{"q":"What are norms?","a":"The rules that define appropriate and expected behaviour in particular social settings, for example in a cinema or on an aeroplane","t":"Key concepts","id":7},{"q":"How are norms and values linked?","a":"Norms are based on values: for example, valuing privacy leads to the norm of knocking before entering a room","t":"Key concepts","id":8},{"q":"What is culture?","a":"The whole way of life of a society or social group, including its values, norms, customs, beliefs, knowledge, skills and language","t":"Key concepts","id":9},{"q":"Give an example of how cultures differ.","a":"The Apache of North America gave away property inherited when a relative died, rather than keeping it as people in the UK usually do","t":"Key concepts","id":10},{"q":"What is socialisation?","a":"The process whereby people learn the culture, norms and values of the group or society they were born into","t":"Key concepts","id":11},{"q":"What is primary socialisation?","a":"Early childhood learning, usually in families, during which children acquire the basic behaviour patterns, language and skills they need in later life","t":"Key concepts","id":12},{"q":"What is secondary socialisation?","a":"Socialisation that begins in later childhood and continues throughout adult life, through agencies such as peer groups, schools, religion and the mass media","t":"Key concepts","id":13},{"q":"What is the main agency of primary socialisation?","a":"The family","t":"Key concepts","id":14},{"q":"Name three agencies of secondary socialisation.","a":"Peer groups, schools (education), religion, the mass media and the workplace","t":"Key concepts","id":15},{"q":"What is the nature versus nurture debate?","a":"The debate over how far behaviour is caused by genes and biology (nature) or learned through socialisation (nurture)","t":"Key concepts","id":16},{"q":"Which side of the nature–nurture debate do sociologists mostly favour?","a":"Nurture: they argue most behaviour is learned through socialisation","t":"Key concepts","id":17},{"q":"What is sex?","a":"Whether a person is considered male or female, based on biological differences such as their bodies and roles in reproduction","t":"Key concepts","id":18},{"q":"What is gender?","a":"The different social practices, expectations and ideas associated with masculinity and femininity","t":"Key concepts","id":19},{"q":"What is the difference between sex and gender?","a":"Sex is biological (ascribed at birth), whereas gender is social: the expectations a society attaches to being masculine or feminine","t":"Key concepts","id":20},{"q":"What is canalisation?","a":"The way parents channel a child's interests into toys and activities seen as appropriate for their gender","t":"Key concepts","id":21},{"q":"Give an example of canalisation.","a":"Giving girls dolls and toy kitchens and boys action figures and footballs","t":"Key concepts","id":22},{"q":"What are gender roles?","a":"The behaviour expected of people based on their gender, associated with femininity and masculinity","t":"Key concepts","id":23},{"q":"What is a gender identity?","a":"How a person sees themselves in terms of being masculine or feminine","t":"Key concepts","id":24},{"q":"What is a social construct?","a":"Patterns of behaviour based on the norms and values of society, and therefore a product of society or culture rather than nature","t":"Key concepts","id":25},{"q":"What evidence suggests gender is a social construct?","a":"Gender norms vary between cultures and over time, e.g. pink was once seen as a masculine colour in North America","t":"Key concepts","id":26},{"q":"What is ethnicity?","a":"Cultural traditions, norms and values that distinguish the members of a particular social group from other groups","t":"Key concepts","id":27},{"q":"What is an ethnic group?","a":"A social group whose members share an identity based on their cultural traditions, religion and language","t":"Key concepts","id":28},{"q":"What is an ethnic minority?","a":"A group of people from a different ethnic group from the general population (the ethnic majority)","t":"Key concepts","id":29},{"q":"Why do sociologists prefer the term ethnicity to race?","a":"Race was based on discredited 18th and 19th century ideas about biological differences, whereas ethnicity focuses on cultural differences","t":"Key concepts","id":30},{"q":"What is discrimination?","a":"Less favourable or unfair treatment of someone based on, for example, their ethnicity, gender or age","t":"Key concepts","id":31},{"q":"What is institutional racism?","a":"When organisations such as the police fail to provide an appropriate service to people because of their ethnic origin, culture or colour, even if individuals don't intend it","t":"Key concepts","id":32},{"q":"What does BAME stand for?","a":"Black, Asian and minority ethnic: a term used for members of non-white communities in the UK","t":"Key concepts","id":33},{"q":"What is social class?","a":"A form of social stratification based on economic factors such as occupation and income","t":"Key concepts","id":34},{"q":"What is social stratification?","a":"The way society is divided into hierarchical layers (strata), with the most privileged at the top and the least favoured at the bottom","t":"Key concepts","id":35},{"q":"What is the occupational structure?","a":"The hierarchy of occupations in a society","t":"Key concepts","id":36},{"q":"What are professions?","a":"Occupations that require specialised higher-level education, such as doctors or lawyers","t":"Key concepts","id":37},{"q":"What is a white-collar worker?","a":"A non-manual worker in a professional or office job, seen as middle class, e.g. a lawyer","t":"Key concepts","id":38},{"q":"What is a blue-collar worker?","a":"A manual worker in a non-professional job, seen as working class, e.g. an electrician","t":"Key concepts","id":39},{"q":"What is the working class?","a":"A social class made up of people in manual occupations","t":"Key concepts","id":40},{"q":"What is the middle class?","a":"A social class made up of people in non-manual, managerial and professional occupations","t":"Key concepts","id":41},{"q":"What is the upper class?","a":"A social class made up of the rich and powerful, particularly those who have inherited wealth","t":"Key concepts","id":42},{"q":"According to Giddens, who makes up the upper class?","a":"The top 1% of owners of wealth, whose wealth gives them access to power and leading positions","t":"Key concepts","id":43},{"q":"What are life chances?","a":"An individual's chances of achieving positive or negative outcomes (in health, education, housing and so on) as they go through life","t":"Key concepts","id":44},{"q":"How can social class affect life chances?","a":"Higher classes usually have better access to good health care, education, housing and jobs, so they tend to live longer and earn more","t":"Key concepts","id":45},{"q":"What is a theoretical perspective?","a":"An approach such as functionalism, Marxism or feminism that provides a set of ideas to explain the social world","t":"Key concepts","id":46},{"q":"What is the 'we are all middle class now' argument?","a":"The idea that class no longer matters because old working-class jobs have declined and living standards have risen","t":"Key concepts","id":47},{"q":"What is meritocracy?","a":"A system where people's positions are based on their talent and effort, not on their social background","t":"Key concepts","id":48},{"q":"What is status?","a":"A social position (such as teacher or child), or the prestige and social standing a group gives to someone in that position","t":"Key concepts","id":49},{"q":"What is power?","a":"The dominance and control of one individual or group over others","t":"Key concepts","id":50},{"q":"What is deviance?","a":"Behaviour which goes against the norms and values of society","t":"Key concepts","id":51},{"q":"What is a function?","a":"The 'job' or role a social structure such as the family or education system fulfils for individuals or society","t":"Key concepts","id":52},{"q":"What is social cohesion?","a":"The idea that people in society share values and attitudes that unite them and bring them together","t":"Key concepts","id":53},{"q":"What is a role model?","a":"A person whose behaviour others copy, which helps pass on norms and values","t":"Key concepts","id":54},{"q":"What are sanctions?","a":"Rewards (positive sanctions) or punishments (negative sanctions) used to encourage people to follow norms","t":"Key concepts","id":55},{"q":"What is an agency of social control?","a":"A group or organisation that controls behaviour and makes people conform, such as the police, family or school","t":"Key concepts","id":56},{"q":"What is the difference between ascribed and achieved status?","a":"Ascribed status is fixed at birth (e.g. a royal title), while achieved status is earned through talent or effort (e.g. becoming a doctor)","t":"Key concepts","id":57},{"q":"What is identity?","a":"How we see ourselves and how others see us, shaped by factors like gender, ethnicity, class and age","t":"Key concepts","id":58},{"q":"What is the mass media?","a":"Forms of communication that reach large audiences, such as TV, newspapers and social media","t":"Key concepts","id":59},{"q":"How can the media act as an agency of socialisation?","a":"It presents role models and messages about how to behave, e.g. stereotyped images of men and women in adverts","t":"Key concepts","id":60},{"q":"How can peer groups socialise young people?","a":"Through approval and disapproval: young people copy friends' norms to fit in, and may be teased for not conforming","t":"Key concepts","id":61},{"q":"How can religion socialise people?","a":"It teaches moral values and rules of behaviour, e.g. the Ten Commandments, and rewards or punishes conformity","t":"Key concepts","id":62},{"q":"What is intersectionality?","a":"The idea that people's experiences of inequality are shaped by several factors at once, such as gender, ethnicity, class and sexuality","t":"Key concepts","id":63},{"q":"What is a stereotype?","a":"A fixed, standardised or distorted view of the characteristics of a particular group of people","t":"Key concepts","id":64},{"q":"What is gender socialisation?","a":"The process by which children learn the behaviour expected of their gender, e.g. through canalisation and verbal appeals like 'big boys don't cry'","t":"Key concepts","id":65},{"q":"Who was Karl Marx?","a":"A German thinker (1818–1883) whose ideas formed the Marxist perspective, focusing on social class and capitalism","t":"Theories","id":66},{"q":"What is capitalism?","a":"An economic system in which private owners invest in businesses to make profit, generating extreme wealth for the bourgeoisie","t":"Theories","id":67},{"q":"What are the means of production?","a":"The raw materials and tools used in production. Under capitalism these include property, factories and machinery","t":"Theories","id":68},{"q":"What is the bourgeoisie?","a":"The ruling class who own the means of production and exploit the proletariat to make huge profits","t":"Theories","id":69},{"q":"What is the proletariat?","a":"Wage labourers who do not own the means of production and live by selling their labour to the bourgeoisie","t":"Theories","id":70},{"q":"What is Marxism?","a":"A sociological approach that draws on the ideas of Karl Marx and applies them to modern capitalist societies","t":"Theories","id":71},{"q":"What is class struggle?","a":"Conflict between the bourgeoisie and proletariat, who have different interests (profits versus higher wages)","t":"Theories","id":72},{"q":"What is a classless society?","a":"A society in which there is no private ownership of property and so no social classes","t":"Theories","id":73},{"q":"What is communism?","a":"A system involving communal (shared) ownership rather than individual ownership of private property","t":"Theories","id":74},{"q":"What is false class consciousness?","a":"When subordinate groups such as the proletariat do not recognise that they are being exploited or what their true interests are","t":"Theories","id":75},{"q":"What is ruling class ideology?","a":"A set of dominant ideas that distort reality and serve the interests of the bourgeoisie","t":"Theories","id":76},{"q":"What did Marx predict would happen to capitalism?","a":"The proletariat would grow poorer, become aware of their exploitation, overthrow the bourgeoisie and create a classless, communist society","t":"Theories","id":77},{"q":"Give one criticism of Marxism.","a":"Marx's predicted revolution hasn't happened, and a large middle class has grown instead","t":"Theories","id":78},{"q":"What is alienation?","a":"When workers lack control over production and the products of their labour, so work feels meaningless","t":"Theories","id":79},{"q":"What is the petty bourgeoisie?","a":"Owners of small businesses, who Marx thought would sink into the proletariat","t":"Theories","id":80},{"q":"What is the lumpenproletariat?","a":"The 'drop-outs' and criminals at the very bottom of society, according to Marx","t":"Theories","id":81},{"q":"Who was Max Weber?","a":"A German sociologist (1864–1920) who argued stratification is based on class, status and power, not just economics","t":"Theories","id":82},{"q":"How did Weber's view of class differ from Marx's?","a":"Weber agreed property was important but argued class is also linked to skills and qualifications, and that status and power matter too","t":"Theories","id":83},{"q":"According to Weber, what is status?","a":"The prestige or social standing a group has, which does not always match income, e.g. nurses have high status but modest pay","t":"Theories","id":84},{"q":"How did Weber define power?","a":"The ability of an individual or group to get what they want, despite opposition from others","t":"Theories","id":85},{"q":"What is coercion?","a":"Power exercised through force or the threat of force","t":"Theories","id":86},{"q":"What is authority?","a":"Power that people accept as legitimate, so they obey willingly","t":"Theories","id":87},{"q":"What did Weber argue about status and income?","a":"They do not always go together: some high earners (e.g. some second-hand car dealers) have low status","t":"Theories","id":88},{"q":"What is feminism?","a":"A movement that fights for gender equality, wanting equal power, status and rights for women and men","t":"Theories","id":89},{"q":"What is patriarchy?","a":"Male power, authority and dominance over women in society or the family","t":"Theories","id":90},{"q":"What is a radical feminist?","a":"A feminist who sees women's oppression as based on patriarchy and wants a society in which male supremacy is eliminated","t":"Theories","id":91},{"q":"What is a liberal feminist?","a":"A feminist who believes changes to laws, social attitudes and actions will bring equality between genders","t":"Theories","id":92},{"q":"What is a Marxist feminist?","a":"A feminist who believes women are oppressed by both patriarchy and the capitalist system","t":"Theories","id":93},{"q":"Which feminists want the most drastic changes in society?","a":"Radical feminists","t":"Theories","id":94},{"q":"Name one law that liberal feminists would see as progress.","a":"The Equal Pay Act 1970 or the Sex Discrimination Act 1975","t":"Theories","id":95},{"q":"When did women gain equal voting rights with men in the UK?","a":"1928, with the Equal Franchise Act","t":"Theories","id":96},{"q":"What are consensus approaches?","a":"Sociological approaches which think there is broad agreement on norms and values in society, such as functionalism","t":"Theories","id":97},{"q":"What are conflict approaches?","a":"Sociological approaches which think there is conflict between groups in society, such as Marxism and feminism","t":"Theories","id":98},{"q":"What is value consensus?","a":"Broad agreement among members of society about shared values","t":"Theories","id":99},{"q":"Why is feminism a conflict approach?","a":"Feminists see society as divided between men and women, with men exploiting and dominating women","t":"Theories","id":100},{"q":"Who was Emile Durkheim?","a":"A French sociologist (1858–1917) and a founding figure of functionalism","t":"Theories","id":101},{"q":"What did Durkheim argue about crime?","a":"Crime is normal and inevitable, and a certain amount is functional (beneficial) for society","t":"Theories","id":102},{"q":"What is anomie?","a":"A situation where the normal norms and values of society break down, so people feel they are no longer part of wider society","t":"Theories","id":103},{"q":"What did Durkheim say could cause anomie?","a":"Rapid social change","t":"Theories","id":104},{"q":"How did Durkheim study suicide?","a":"Using official suicide statistics, showing that suicide has social rather than just individual causes","t":"Theories","id":105},{"q":"What did Durkheim say education does?","a":"Links the individual to society (e.g. teaching history) and creates a sense of belonging and social cohesion","t":"Theories","id":106},{"q":"What is functionalism?","a":"A sociological approach that examines society's structures in terms of the functions they perform for society and individuals","t":"Theories","id":107},{"q":"What is the organic analogy?","a":"The functionalist view that society works like a human body, with institutions acting like organs that each perform a vital function","t":"Theories","id":108},{"q":"Give one criticism of functionalism.","a":"It ignores the negative (dysfunctional) sides of institutions, e.g. crime harms victims and family life can involve abuse","t":"Theories","id":109},{"q":"How would Marxists criticise functionalism?","a":"They argue institutions pass on ruling class ideology, not shared values that benefit everyone","t":"Theories","id":110},{"q":"What is a structural approach?","a":"An approach that focuses on how social structures and culture shape behaviour, rather than how individuals interact","t":"Theories","id":111},{"q":"What is the New Right?","a":"A right-wing perspective linked to Thatcher and Reagan in the 1980s, supporting free markets, traditional values and less welfare","t":"Theories","id":112},{"q":"Name three key features of New Right thinking.","a":"Emphasis on the individual, support for free enterprise (market capitalism), competition and choice, and reduced welfare benefits","t":"Theories","id":113},{"q":"What is neo-liberalism?","a":"Right-wing political views that support market capitalism","t":"Theories","id":114},{"q":"What is market capitalism?","a":"An economic system that supports private business in a competitive market","t":"Theories","id":115},{"q":"What is the welfare state?","a":"Government systems for supporting the health and well-being of the population, such as the NHS and benefits","t":"Theories","id":116},{"q":"What is a culture of dependency?","a":"The idea that welfare systems encourage people to stay on benefits rather than support themselves through work","t":"Theories","id":117},{"q":"What is the underclass?","a":"A group at the very bottom of the social scale who are dependent on welfare benefits","t":"Theories","id":118},{"q":"Who developed the idea of the underclass?","a":"Charles Murray (New Right)","t":"Theories","id":119},{"q":"What is the culture of poverty?","a":"An acceptance, passed down generations, that if you are poor you will always be poor","t":"Theories","id":120},{"q":"Who first introduced the idea of a culture of poverty?","a":"The anthropologist Oscar Lewis, based on research in South America","t":"Theories","id":121},{"q":"Give a criticism of Murray's underclass theory.","a":"It blames the poor and ignores structural causes such as low wages and unemployment","t":"Theories","id":122},{"q":"What is anthropology?","a":"The scientific study of the origins and development of human society","t":"Theories","id":123},{"q":"What are social action (interpretivist) approaches?","a":"Approaches that try to understand the meanings and motives people give to their behaviour, rather than seeing them as shaped by social forces","t":"Theories","id":124},{"q":"What is interactionism?","a":"A social action approach that focuses on small-scale interactions and the meanings people give to them","t":"Theories","id":125},{"q":"What is labelling?","a":"When a label applied to an individual influences both their behaviour and how others respond to them","t":"Theories","id":126},{"q":"What is master status?","a":"A status such as 'criminal' that overrides all of a person's other statuses, like daughter, friend or employee","t":"Theories","id":127},{"q":"What is self-concept?","a":"The idea an individual has of the kind of person they are","t":"Theories","id":128},{"q":"What is a self-fulfilling prophecy?","a":"When an individual accepts the label others have given them and acts accordingly, so the label comes true","t":"Theories","id":129},{"q":"Give one criticism of interactionism.","a":"It ignores wider structural factors like social class and economic inequality","t":"Theories","id":130},{"q":"What is the difference between structural and social action approaches?","a":"Structural approaches see behaviour as shaped by society (top-down); social action approaches see individuals as active in creating society (bottom-up)","t":"Theories","id":131},{"q":"Which perspectives are structural?","a":"Functionalism, Marxism and (most) feminism","t":"Theories","id":132},{"q":"Which perspective is a social action approach?","a":"Interactionism","t":"Theories","id":133},{"q":"Who argued that inequality is functional and necessary?","a":"Davis and Moore (functionalists)","t":"Theories","id":134},{"q":"What does 'determinism' mean in sociology?","a":"The idea that behaviour is controlled by social structures, leaving little room for free will","t":"Theories","id":135},{"q":"What is Walby's main idea?","a":"Patriarchy is a system of six structures (pillars) through which men dominate, oppress and exploit women","t":"Theories","id":136},{"q":"Name Walby's six pillars of patriarchy.","a":"Paid employment, the household, culture, sexuality, male violence and the state","t":"Theories","id":137},{"q":"What is postmodernism?","a":"A view that society is now so diverse and fast-changing that big theories like Marxism and functionalism no longer explain it","t":"Theories","id":138},{"q":"What is research design?","a":"The overall plan sociologists use to carry out a study step by step, including aims, methods, sample, type of data and ethics","t":"RM","id":139},{"q":"What is a research aim?","a":"A statement that sets out what a researcher plans to investigate and gives the study a focus","t":"RM","id":140},{"q":"What is a hypothesis?","a":"An informed guess, written as a statement, that can be tested and then supported or proven wrong by evidence","t":"RM","id":141},{"q":"What is a literature review?","a":"A review of existing academic research (books, journal articles) on a topic, carried out before starting new research","t":"RM","id":142},{"q":"What is a pilot study?","a":"A small-scale trial run of a research project before the main study, to test whether the methods and questions work","t":"RM","id":143},{"q":"Give one advantage of a pilot study.","a":"Problems such as confusing questions can be fixed before the main study, saving time and money and improving validity","t":"RM","id":144},{"q":"What is quantitative data?","a":"Information in numerical form, such as statistics, graphs and tables","t":"RM","id":145},{"q":"What is qualitative data?","a":"Information in words or images rather than numbers, giving depth and detail","t":"RM","id":146},{"q":"Which type of data do positivists prefer?","a":"Quantitative data","t":"RM","id":147},{"q":"Which type of data do interpretivists prefer?","a":"Qualitative data","t":"RM","id":148},{"q":"Give one advantage of quantitative data.","a":"It is quick to analyse and easy to compare, so patterns and trends can be spotted","t":"RM","id":149},{"q":"Give one advantage of qualitative data.","a":"It gives a depth and richness of information about people's meanings and feelings, so it is high in validity","t":"RM","id":150},{"q":"What is reliability?","a":"Whether research can be repeated and get the same results: consistency","t":"RM","id":151},{"q":"What is validity?","a":"Whether research gives a true, accurate picture of what is being studied","t":"RM","id":152},{"q":"What is representativeness?","a":"Whether a sample is a typical cross-section of the wider group being studied","t":"RM","id":153},{"q":"What is generalisability?","a":"Whether findings from a sample can be applied to the wider population","t":"RM","id":154},{"q":"What is an interview?","a":"A research method where a researcher asks questions face to face, by phone or online","t":"RM","id":155},{"q":"What is a structured interview?","a":"An interview with a fixed list of pre-written questions asked in the same order to everyone","t":"RM","id":156},{"q":"What is an unstructured interview?","a":"An informal interview with no set questions, guided by the conversation","t":"RM","id":157},{"q":"What is a semi-structured interview?","a":"An interview with some prepared questions and others improvised in response to answers","t":"RM","id":158},{"q":"What is rapport?","a":"A relationship of trust between researcher and participant, helping them feel comfortable and give honest answers","t":"RM","id":159},{"q":"What is interviewer bias?","a":"When the interviewer's characteristics, tone or assumptions influence the answers given","t":"RM","id":160},{"q":"What is social desirability?","a":"When people give answers that make them look good rather than truthful ones","t":"RM","id":161},{"q":"What is a group interview?","a":"An interview with several people at once, where participants can discuss ideas together","t":"RM","id":162},{"q":"Give one advantage of unstructured interviews.","a":"They build rapport and allow follow-up questions, giving detailed, valid qualitative data","t":"RM","id":163},{"q":"Give one disadvantage of unstructured interviews.","a":"They are time-consuming and hard to repeat, so they are low in reliability and samples are small","t":"RM","id":164},{"q":"Give one advantage of structured interviews.","a":"They are standardised, so they are reliable and answers are easy to compare","t":"RM","id":165},{"q":"What is an observation?","a":"A research method where the researcher watches and records people's behaviour in real-life settings","t":"RM","id":166},{"q":"What is participant observation?","a":"When the researcher joins the group they are studying and takes part in its activities","t":"RM","id":167},{"q":"What is non-participant observation?","a":"When the researcher watches the group from a distance without taking part","t":"RM","id":168},{"q":"What is covert observation?","a":"When the researcher is undercover and participants don't know they are being studied","t":"RM","id":169},{"q":"What is overt observation?","a":"When the researcher is open about who they are and participants know they are being studied","t":"RM","id":170},{"q":"Give one advantage of covert observation.","a":"Participants act naturally because they don't know they are being watched, giving valid data and access to hard-to-reach groups such as gangs","t":"RM","id":171},{"q":"Give one disadvantage of covert observation.","a":"It is unethical because there is no informed consent and it involves deception; it can also be dangerous","t":"RM","id":172},{"q":"What is the Hawthorne effect?","a":"When people change their behaviour because they know they are being observed","t":"RM","id":173},{"q":"What does 'going native' mean?","a":"When a participant observer becomes so involved with the group that they lose objectivity","t":"RM","id":174},{"q":"Who studied violent Glasgow gangs by secretly joining one?","a":"James Patrick (covert participant observation)","t":"RM","id":175},{"q":"What is a questionnaire?","a":"A set of written questions that respondents answer themselves, on paper or online","t":"RM","id":176},{"q":"What is a closed question?","a":"A question with pre-set answers to choose from, producing quantitative data","t":"RM","id":177},{"q":"What is an open question?","a":"A question with no pre-set answers, so respondents can explain in their own words","t":"RM","id":178},{"q":"What is a leading question?","a":"A question worded to push the respondent towards a particular answer","t":"RM","id":179},{"q":"Give one advantage of questionnaires.","a":"They are cheap and quick and can reach large samples over a wide area, giving reliable, comparable data","t":"RM","id":180},{"q":"Give one disadvantage of questionnaires.","a":"They lack depth, the researcher can't explain questions, and there may be low response rates","t":"RM","id":181},{"q":"What is a response rate?","a":"The proportion of people who complete and return a questionnaire","t":"RM","id":182},{"q":"What is a social survey?","a":"Collecting information from a large number of people, usually through questionnaires or structured interviews","t":"RM","id":183},{"q":"What is the difference between a questionnaire and a survey?","a":"A questionnaire is the research tool (the list of questions); a survey is the whole process, including sampling and analysis","t":"RM","id":184},{"q":"What is a postal questionnaire?","a":"A questionnaire sent to respondents by post to complete and return","t":"RM","id":185},{"q":"What are mixed methods?","a":"Using more than one research method in a study, also called methodological pluralism","t":"RM","id":186},{"q":"What is triangulation?","a":"Cross-checking findings from one method against another, e.g. qualitative against quantitative","t":"RM","id":187},{"q":"Give one advantage of mixed methods.","a":"The strengths of one method make up for the weaknesses of another, giving a fuller, more valid picture","t":"RM","id":188},{"q":"Give one disadvantage of mixed methods.","a":"It takes more time and money, and results from different methods may contradict each other","t":"RM","id":189},{"q":"What is positivism?","a":"The view that sociology should use scientific methods to discover facts, focusing on behaviour that can be measured","t":"RM","id":190},{"q":"What is interpretivism?","a":"The view that sociologists should understand the meanings behind behaviour by seeing it from people's point of view","t":"RM","id":191},{"q":"Which methods do positivists favour?","a":"Quantitative methods such as large-scale surveys, questionnaires and official statistics","t":"RM","id":192},{"q":"Which methods do interpretivists favour?","a":"Qualitative methods such as unstructured interviews and participant observation","t":"RM","id":193},{"q":"What is primary data?","a":"Information collected first-hand by the researcher, through methods such as interviews, questionnaires and observations","t":"RM","id":194},{"q":"What is secondary data?","a":"Information that already exists, collected by others, such as official statistics, media and other sociologists' studies","t":"RM","id":195},{"q":"Give one advantage of primary data.","a":"It is collected for the researcher's own purpose, so it is relevant and they know how it was gathered","t":"RM","id":196},{"q":"Give one disadvantage of primary data.","a":"It can be very time-consuming and expensive to collect","t":"RM","id":197},{"q":"Give one advantage of secondary data.","a":"It is cheap and quick to access, and lots of data is available, e.g. over long periods","t":"RM","id":198},{"q":"Give one disadvantage of secondary data.","a":"It may be biased or collected for a different purpose, so it may not fit the research aims","t":"RM","id":199},{"q":"What are official statistics?","a":"Numerical data collected by the government, such as the census, crime figures and exam results","t":"RM","id":200},{"q":"What is the census?","a":"A survey of every household in the UK, carried out every ten years","t":"RM","id":201},{"q":"What are personal documents?","a":"Diaries, letters, photographs and autobiographies, which give qualitative secondary data","t":"RM","id":202},{"q":"What is content analysis?","a":"Analysing documents or images by creating categories, coding the content and counting how often each theme appears","t":"RM","id":203},{"q":"Give an example of content analysis.","a":"Counting how often words like 'violent' or 'gang' appear in newspaper reports about young people","t":"RM","id":204},{"q":"What is a case study?","a":"A detailed study of one person, group, event or institution","t":"RM","id":205},{"q":"Give one advantage of a case study.","a":"It gives in-depth, detailed information about one case","t":"RM","id":206},{"q":"What is a longitudinal study?","a":"A study of the same group of people over a long period of time, sometimes 20 years or more","t":"RM","id":207},{"q":"Give one advantage of a longitudinal study.","a":"It shows changes over time and can help identify cause and effect","t":"RM","id":208},{"q":"Give one disadvantage of a longitudinal study.","a":"People drop out over time, so the sample may become unrepresentative; it is also costly","t":"RM","id":209},{"q":"What does PET stand for in research?","a":"Practical, Ethical and Theoretical issues that influence the choice of topic and method","t":"RM","id":210},{"q":"Name the main practical issues in research.","a":"Time, money (cost), funding and access","t":"RM","id":211},{"q":"What is access in research?","a":"How easy it is to reach and study a group; some groups and institutions are hard to access","t":"RM","id":212},{"q":"What is a gatekeeper?","a":"Someone who controls access to a group, such as a head teacher or gang leader","t":"RM","id":213},{"q":"What is informed consent?","a":"When participants agree to take part after the researcher has explained what the research is about and why","t":"RM","id":214},{"q":"What is anonymity?","a":"When neither the researcher nor the reader can identify a respondent from their answers","t":"RM","id":215},{"q":"What is confidentiality?","a":"Not publishing participants' personal details without their consent","t":"RM","id":216},{"q":"What is the right to withdraw?","a":"Participants can leave the study at any time and remove their data","t":"RM","id":217},{"q":"What is deception in research?","a":"Misleading participants about the true aim of the research","t":"RM","id":218},{"q":"What is harm to participants?","a":"Physical or emotional damage caused by taking part in research, which researchers must avoid","t":"RM","id":219},{"q":"Which organisation publishes an ethical code for sociologists?","a":"The British Sociological Association (BSA)","t":"RM","id":220},{"q":"What is a sample?","a":"A smaller group selected from the population to take part in research","t":"RM","id":221},{"q":"What is a sampling frame?","a":"A list of all the members of the population a sample is drawn from, e.g. a school register","t":"RM","id":222},{"q":"What is a target population?","a":"The whole group the researcher wants to find out about","t":"RM","id":223},{"q":"What is a random sample?","a":"A sample where everyone in the population has an equal chance of being selected","t":"RM","id":224},{"q":"What is a systematic sample?","a":"A sample made by picking every nth name from a list, e.g. every 10th person","t":"RM","id":225},{"q":"What is a stratified sample?","a":"A sample selected in proportion to subgroups in the population, e.g. 50% men and 50% women","t":"RM","id":226},{"q":"What is a multi-stage sample?","a":"A sample made by a series of selections, drawing smaller samples from a first sample","t":"RM","id":227},{"q":"What is a snowball sample?","a":"Starting with one or two participants who introduce the researcher to others like them","t":"RM","id":228},{"q":"When is snowball sampling useful?","a":"For hard-to-reach groups with no list of names, such as gang members or the homeless","t":"RM","id":229},{"q":"What is a quota sample?","a":"Selecting a set number of people from certain categories, e.g. ten women over 65","t":"RM","id":230},{"q":"What is a voluntary sample?","a":"People offer to take part, e.g. by answering an advert; it may be biased towards certain types of people","t":"RM","id":231},{"q":"What is probability sampling?","a":"Sampling where everyone has a known chance of selection, e.g. random, systematic and stratified samples","t":"RM","id":232},{"q":"What is non-probability sampling?","a":"Sampling used when there is no sampling frame, e.g. snowball, quota and voluntary samples","t":"RM","id":233},{"q":"What is a focus group?","a":"A group interview focused on a particular topic, where participants discuss their views","t":"RM","id":234},{"q":"What is objectivity?","a":"Not letting your own views or values bias the research","t":"RM","id":235},{"q":"What is a responden
