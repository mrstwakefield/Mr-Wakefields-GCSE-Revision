"]}]}]},{"id":"s1-5","stim":[],"parts":[{"no":"","q":"Describe one example of the hidden curriculum.","m":3,"ms":[{"h":"","b":["1 mark: a valid example, e.g. punctuality, obedience, respect for authority, uniform rules.","+1: explains it is learned through school organisation rather than lessons.","+1: link, e.g. Bowles and Gintis: prepares pupils for obedient work (correspondence principle)."]}]}]},{"id":"s1-6","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'dark figure of crime'.","m":3,"ms":[{"h":"","b":["1 mark: crime that is not reported to or recorded by the police.","+1: means official statistics underestimate crime.","+1: example/evidence, e.g. CSEW suggests only around 4 in 10 crimes are reported; domestic violence is under-reported."]}]}]},{"id":"s1-7","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'relative poverty'.","m":3,"ms":[{"h":"","b":["1 mark: income well below the average in society, so people can't afford the normal standard of living.","+1: compared with absolute poverty (lacking basic survival needs).","+1: example/sociologist, e.g. Townsend's relative deprivation; can't afford school trips; below 60% of median income."]}]}]},{"id":"s1-8","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'master status'.","m":3,"ms":[{"h":"","b":["1 mark: a label/status that overrides all a person's other statuses.","+1: e.g. 'criminal' overrides daughter, friend, employee.","+1: link to Becker/labelling and the self-fulfilling prophecy or deviant career."]}]}]},{"id":"s1-9","stim":[],"parts":[{"no":"","q":"Describe one form of stratification.","m":3,"ms":[{"h":"","b":["1 mark: names a form, e.g. caste, feudalism, apartheid, social class, slavery.","+1: describes how it is organised.","+1: explains whether status is ascribed/achieved or the system is open/closed."]}]}]}]},{"n":2,"title":"Identify and describe one…","icon":"🎯","tag":"1 mark to identify · 2 marks to describe with evidence.","steps":[["Identify","Name one clear, relevant point."],["Describe","Explain what it means or how it works."],["Support","Add a sociologist, study, example or statistic."]],"watch":"Only the first point counts. Don't list three things: pick one and develop it.","items":[{"id":"s2-1","stim":[],"parts":[{"no":"","q":"Identify and describe one function of the family identified by Parsons.","m":3,"ms":[{"h":"","b":["1 mark: primary socialisation OR stabilisation of adult personalities.","+2: developed description, e.g. children learn shared norms and values so society stays stable; the family relieves stress like a 'warm bath'."]}]}]},{"id":"s2-2","stim":[],"parts":[{"no":"","q":"Identify and describe one type of family diversity identified by Rapoport and Rapoport.","m":3,"ms":[{"h":"","b":["1 mark: organisational, cultural, social class, life-course or cohort.","+2: developed description with an example, e.g. cohort: divorce is less stigmatised now, so younger couples divorce more easily."]}]}]},{"id":"s2-3","stim":[],"parts":[{"no":"","q":"Identify and describe one alternative to nuclear family households.","m":3,"ms":[{"h":"","b":["1 mark: commune, kibbutz, single-person household, etc.","+2: description, e.g. kibbutzim are communal settlements in Israel where members value equality and children were raised together in children's houses."]}]}]},{"id":"s2-4","stim":[],"parts":[{"no":"","q":"Identify and describe one agent of formal social control.","m":3,"ms":[{"h":"","b":["1 mark: police, courts, government, prison service, etc.","+2: description, e.g. the police detect and investigate crime and act as gatekeepers to the criminal justice system, using sanctions like arrests."]}]}]},{"id":"s2-5","stim":[],"parts":[{"no":"","q":"Identify and describe one similarity between Weber's and Marx's approaches to social class.","m":3,"ms":[{"h":"","b":["1 mark: both see class as based on economic factors / property ownership as important / both are conflict views of inequality.","+2: developed, e.g. both agreed owning property is a key basis of class division, though Weber added skills, status and power."]}]}]},{"id":"s2-6","stim":[],"parts":[{"no":"","q":"Identify and describe one reason why women appear to commit less crime than men.","m":3,"ms":[{"h":"","b":["1 mark: social control, socialisation, chivalry thesis, etc.","+2: developed with sociologist, e.g. Heidensohn: women are more controlled at home (childcare), in public (fear of violence) and at work, reducing opportunities."]}]}]},{"id":"s2-7","stim":[],"parts":[{"no":"","q":"Identify and describe one type of authority identified by Weber.","m":3,"ms":[{"h":"","b":["1 mark: traditional, charismatic or rational-legal.","+2: description with example, e.g. rational-legal: based on accepted laws and rules, such as a judge."]}]}]},{"id":"s2-8","stim":[],"parts":[{"no":"","q":"Identify and describe one alternative form of education.","m":3,"ms":[{"h":"","b":["1 mark: home schooling, de-schooling, private schools, etc.","+2: description, e.g. home schooling: parents take responsibility for education, perhaps for religious reasons or because a child is unhappy at school."]}]}]}]},{"n":3,"title":"Examine a strength or weakness of the research","icon":"🔍","tag":"Name it from your knowledge · prove it with the Item.","steps":[["Identify","Name a strength or weakness, e.g. small sample, generalisability, validity, ethics."],["Evidence","Use a detail from the Item to show it applies here."]],"watch":"The answer isn't written in the Item. Use your research methods knowledge for the first mark and the Item for the second.","items":[{"id":"s3-1","stim":[{"p":"Item A: A sociologist carried out unstructured interviews with 30 mothers in one town in the north of England about how housework is shared in their homes. Each interview lasted around two hours."}],"parts":[{"no":"","q":"From Item A, examine one weakness of the research.","m":2,"ms":[{"h":"","b":["1 mark: identifies a weakness, e.g. not representative/generalisable; only women's views; time-consuming; hard to replicate.","+1: evidence from the item, e.g. only 30 mothers from one town, so findings can't be generalised to all families."]}]}]},{"id":"s3-2","stim":[{"p":"Item B: The Crime Survey of England and Wales asks around 50,000 people aged 16 and over, living in private households, about crimes they have experienced in the last year."}],"parts":[{"no":"","q":"From Item B, examine one strength of the research.","m":2,"ms":[{"h":"","b":["1 mark: identifies a strength, e.g. large/representative sample; uncovers the dark figure; reliable.","+1: evidence from the item, e.g. around 50,000 people means results can be generalised."]}]}]},{"id":"s3-3","stim":[{"p":"Item C: Halsey carried out a longitudinal study of over 8,000 males born between 1913 and 1952 to examine class inequalities in education."}],"parts":[{"no":"","q":"From Item C, examine one weakness of the research.","m":2,"ms":[{"h":"","b":["1 mark: identifies a weakness, e.g. only males so not generalisable to females; data now dated.","+1: evidence from the item, e.g. the sample was only males born 1913–1952."]}]}]},{"id":"s3-4","stim":[{"p":"Item D: Carlen carried out detailed, unstructured, taped interviews with 39 women aged 15–45 who had been convicted of crimes. Most were working class."}],"parts":[{"no":"","q":"From Item D, examine one strength of the research.","m":2,"ms":[{"h":"","b":["1 mark: identifies a strength, e.g. high validity; rich qualitative data; rapport.","+1: evidence from the item, e.g. detailed unstructured interviews allowed the women to explain their experiences in their own words."]}]}]},{"id":"s3-5","stim":[{"p":"Item E: Townsend issued questionnaires to over 2,000 households across various areas of the UK, using a deprivation index to measure poverty."}],"parts":[{"no":"","q":"From Item E, examine one weakness of the research.","m":2,"ms":[{"h":"","b":["1 mark: identifies a weakness, e.g. index may not measure poverty validly; questionnaires lack depth.","+1: evidence, e.g. items on the deprivation index (like no cooked breakfast) may reflect choice rather than poverty."]}]}]}]},{"n":4,"title":"Identify and explain one… (from an Item)","icon":"🧾","tag":"1 mark: the point · 3 marks: a developed, evidenced explanation.","steps":[["Identify","Name one relevant factor, reason or issue."],["Explain","Say how or why it causes the thing in the question."],["Evidence","Support with a sociologist, study or statistic."],["Link","Tie it back to the exact question or the Item."]],"watch":"A bare point is 1 mark. To reach 4, develop it fully: 'This means…', 'For example…', 'Therefore…'.","items":[{"id":"s4-1","stim":[{"p":"Item A: Between 1971 and 1993 the number of divorces in England and Wales rose sharply."}],"parts":[{"no":"","q":"Identify and explain one factor that may have led to the increase in divorce referred to in Item A.","m":4,"ms":[{"h":"","b":["1 mark: identifies a factor, e.g. changes in the law, changing position of women, secularisation, changing attitudes.","Up to 3 marks: explains it, e.g. the Divorce Reform Act 1969 (in force 1971) made 'irretrievable breakdown' the only ground, so couples no longer had to prove fault, making divorce easier and quicker; supported with evidence."]}]}]},{"id":"s4-2","stim":[{"p":"Item B: Girls have outperformed boys at GCSE every year since the late 1980s."}],"parts":[{"no":"","q":"Identify and explain one factor that may have led to girls outperforming boys as referred to in Item B.","m":4,"ms":[{"h":"","b":["1 mark: identifies a factor, e.g. changing ambitions/genderquake, feminism, equal opportunities, crisis of masculinity.","Up to 3 marks: explains it, e.g. feminism and more women in work have raised girls' aspirations, so they see education as the route to a career, while declining male manual jobs may make some boys see school as pointless."]}]}]},{"id":"s4-3","stim":[{"p":"Item C: Former private school pupils make up around 7% of the population but hold around 65% of top jobs in the UK."}],"parts":[{"no":"","q":"Identify and explain one factor that may explain the pattern in Item C.","m":4,"ms":[{"h":"","b":["1 mark: identifies a factor, e.g. cultural capital, social networks, better resources, smaller classes.","Up to 3 marks: explains it, e.g. private schools give pupils social capital (contacts) and cultural capital (confidence, 'polish') that elite employers value; Marxists see this as reproducing class privilege."]}]}]},{"id":"s4-4","stim":[{"p":"Item D: The Ministry of Justice (2019) found Black people were around 4.5 times more likely to be stopped and searched than white people."}],"parts":[{"no":"","q":"Identify and explain one reason for the pattern shown in Item D.","m":4,"ms":[{"h":"","b":["1 mark: identifies a reason, e.g. institutional racism, labelling, canteen culture, media stereotypes.","Up to 3 marks: explains it, e.g. the Macpherson Report found institutional racism in the police; officers may stereotype Black youths, so they are targeted more, which raises recorded crime (Becker's labelling)."]}]}]},{"id":"s4-5","stim":[{"p":"Item E: The wealthiest 10% of households in Britain own around 45% of the country's wealth, while the poorest 50% own around 9%."}],"parts":[{"no":"","q":"Identify and explain one reason why wealth may be unequally distributed as shown in Item E.","m":4,"ms":[{"h":"","b":["1 mark: identifies a reason, e.g. inheritance, ownership of the means of production, tax changes, pay gap.","Up to 3 marks: explains it, e.g. wealth is passed down through inheritance, so advantage is reproduced across generations; Marxists argue the bourgeoisie keep control of property and capital."]}]}]},{"id":"s4-6","stim":[{"p":"Item F: Official statistics show that the working class appear to commit more crime than other social classes."}],"parts":[{"no":"","q":"Identify and explain one reason why official statistics may show this pattern.","m":4,"ms":[{"h":"","b":["1 mark: identifies a reason, e.g. police targeting/labelling, white-collar crime is hidden, strain/material deprivation.","Up to 3 marks: explains it, e.g. white-collar and corporate crimes are hard to detect and rarely prosecuted, so middle-class crime is under-represented; Marxists argue the law and police focus on working-class crime."]}]}]}]},{"n":5,"title":"Research methods in context","icon":"🔬","tag":"Advantage or disadvantage · applied to THIS topic.","steps":[["Identify","Name one advantage or disadvantage of the method."],["Explain","Say why it is an advantage/disadvantage, using RM terms (validity, reliability, representativeness, ethics)."],["Apply","Link it specifically to the topic in the question."]],"watch":"If your answer would work for any topic, it's not applied. Mention the topic (e.g. 'victims of domestic violence') in your explanation.","items":[{"id":"s5-1","stim":[],"parts":[{"no":"","q":"Identify and explain one advantage of using questionnaires to investigate changes in marriage.","m":4,"ms":[{"h":"","b":["1 mark: e.g. large sample/representative; cheap and quick; reliable; anonymous.","Up to 3 marks: applied explanation, e.g. questionnaires can be sent to thousands of married and cohabiting adults across the UK, so trends such as later marriage can be generalised and compared over time."]}]}]},{"id":"s5-2","stim":[],"parts":[{"no":"","q":"Identify and explain one advantage of using victim surveys to investigate domestic violence.","m":4,"ms":[{"h":"","b":["1 mark: e.g. uncovers unreported crime; anonymity encourages honesty.","Up to 3 marks: applied, e.g. many victims don't report to the police due to fear or shame; a confidential survey like the CSEW can reveal more of the dark figure of domestic violence."]}]}]},{"id":"s5-3","stim":[],"parts":[{"no":"","q":"Identify and explain one disadvantage of using covert participant observation to investigate gangs.","m":4,"ms":[{"h":"","b":["1 mark: e.g. unethical (no consent, deception); dangerous; may 'go native'.","Up to 3 marks: applied, e.g. the researcher may be pressured to take part in crimes or face violence if discovered, putting themselves at risk, and gang members haven't consented."]}]}]},{"id":"s5-4","stim":[],"parts":[{"no":"","q":"Identify and explain one advantage of using unstructured interviews to investigate conjugal roles.","m":4,"ms":[{"h":"","b":["1 mark: e.g. rich qualitative data, rapport, valid, flexible.","Up to 3 marks: applied, e.g. couples can explain in their own words how tasks and decisions are really shared, revealing hidden inequalities (e.g. who 'helps') that closed questions miss."]}]}]},{"id":"s5-5","stim":[],"parts":[{"no":"","q":"Identify and explain one disadvantage of using official statistics to investigate the level of crime.","m":4,"ms":[{"h":"","b":["1 mark: e.g. misses the dark figure; affected by police recording; socially constructed.","Up to 3 marks: applied, e.g. only around 4 in 10 crimes are reported, and police don't record all reported crime, so statistics underestimate crime, especially domestic violence and corporate crime."]}]}]},{"id":"s5-6","stim":[],"parts":[{"no":"","q":"Identify and explain one advantage of using a longitudinal study to investigate the impact of education on future outcomes.","m":4,"ms":[{"h":"","b":["1 mark: e.g. tracks change over time; shows cause and effect.","Up to 3 marks: applied, e.g. following the same pupils from school into work shows how qualifications affect jobs and income, as Halsey's study showed class inequality across generations."]}]}]},{"id":"s5-7","stim":[],"parts":[{"no":"","q":"Identify and explain one advantage of using snowball sampling to research homelessness.","m":4,"ms":[{"h":"","b":["1 mark: e.g. gains access to hard-to-reach groups with no sampling frame.","Up to 3 marks: applied, e.g. there is no list of homeless people, but one participant can introduce the researcher to others they trust, building access to a hidden group."]}]}]},{"id":"s5-8","stim":[],"parts":[{"no":"","q":"Identify and explain one disadvantage of using quantitative methods to research status in the UK.","m":4,"ms":[{"h":"","b":["1 mark: e.g. lacks depth/validity; can't capture meanings.","Up to 3 marks: applied, e.g. status is about prestige and how people see each other, which numbers can't fully capture; closed questions miss why some jobs have high status despite low pay."]}]}]}]},{"n":6,"title":"Named studies","icon":"📖","tag":"Know who, method, findings and evaluation for each AQA study.","steps":[["Identify","Name the relevant aspect of the study, e.g. its method or a key finding."],["Explain","Describe the study accurately."],["Evaluate or link","Add why it matters or a strength/weakness."]],"watch":"Mixing up studies costs marks. Learn the AQA named studies: Murdock, Parsons, Rapoports, Zaretsky, Delphy and Leonard, Oakley, Willmott and Young, Bowles and Gintis, Willis, Ball, Halsey, Becker, Merton, Cohen, Heidensohn, Carlen, Davis and Moore, Marx, Weber, Devine, Townsend, Murray, Walby.","items":[{"id":"s6-1","stim":[{"p":"Item A: Willmott and Young used historical research and social surveys, interviewing nearly 2,000 people in London, to trace the development of the family."}],"parts":[{"no":"","q":"From Item A, identify and explain one finding of Willmott and Young's research.","m":4,"ms":[{"h":"","b":["1 mark: identifies a finding, e.g. the family has become symmetrical; stratified diffusion; four stages.","Up to 3 marks: explains, e.g. by the 1970s couples shared more tasks, decisions and leisure at home, and changes spread from the middle class down (stratified diffusion); Oakley criticised this as exaggerated."]}]}]},{"id":"s6-2","stim":[{"p":"Item B: Bowles and Gintis studied 237 New York high school students, as well as drawing on other research."}],"parts":[{"no":"","q":"From Item B, identify and explain one conclusion of Bowles and Gintis's research.","m":4,"ms":[{"h":"","b":["1 mark: identifies, e.g. the correspondence principle; schools produce an obedient workforce; meritocracy is a myth.","Up to 3 marks: explains, e.g. schools rewarded obedient pupils and gave lower grades to creative ones, mirroring the workplace; this reproduces capitalism; criticised as dated and American."]}]}]},{"id":"s6-3","stim":[{"p":"Item C: Oakley studied women's experiences of housework and the 'conventional family'."}],"parts":[{"no":"","q":"From Item C, identify and explain one finding of Oakley's research.","m":4,"ms":[{"h":"","b":["1 mark: identifies, e.g. 70% dissatisfied; 77-hour week; disliked housework most; conventional family persists.","Up to 3 marks: explains, e.g. housewives worked on average 77 hours a week and most were dissatisfied, showing the conventional family is patriarchal and women carry a dual burden."]}]}]},{"id":"s6-4","stim":[{"p":"Item D: Albert Cohen studied delinquent subcultures among working-class boys."}],"parts":[{"no":"","q":"From Item D, identify and explain one aspect of Cohen's theory.","m":4,"ms":[{"h":"","b":["1 mark: identifies, e.g. status frustration; delinquent subcultures; non-utilitarian crime.","Up to 3 marks: explains, e.g. boys who fail at school feel frustrated at their low status, so they form subcultures that reward deviance like vandalism, giving them status; criticised for ignoring girls."]}]}]},{"id":"s6-5","stim":[{"p":"Item E: Devine revisited Luton in the 1980s, over twenty years after Goldthorpe's affluent worker study."}],"parts":[{"no":"","q":"From Item E, identify and explain one aspect of Devine's research.","m":4,"ms":[{"h":"","b":["1 mark: identifies, e.g. method (intensive interviews with 62 people); finding (no new working class).","Up to 3 marks: explains, e.g. she found working-class lives were not purely privatised or instrumental and there was still solidarity, challenging Goldthorpe; limited by being only in Luton."]}]}]},{"id":"s6-6","stim":[{"p":"Item F: Davis and Moore developed a functionalist theory of stratification."}],"parts":[{"no":"","q":"From Item F, identify and explain one aspect of Davis and Moore's theory.","m":4,"ms":[{"h":"","b":["1 mark: identifies, e.g. functionally important roles; role allocation; inequality is necessary.","Up to 3 marks: explains, e.g. important jobs need talented people who train for years, so they must be rewarded with high pay and status; criticised because nurses are vital but poorly paid."]}]}]}]},{"n":7,"title":"Designing your own research","icon":"📐","tag":"Pick the factor · choose a method · say who and why, in context.","steps":[["Identify","Name one factor relevant to the question."],["Method","Choose a suitable research method (and type of data)."],["Sample","Say who you'd study and how you'd sample them."],["Justify","Explain why this method suits this topic (validity, ethics, practicality)."]],"watch":"Answer both parts: the factor AND how you'd investigate it. Generic method descriptions don't get full marks.","items":[{"id":"s7-1","stim":[],"parts":[{"no":"","q":"Identify one internal factor that may impact educational achievement and explain how you would investigate this using interviews.","m":4,"ms":[{"h":"","b":["1 mark: identifies an internal factor, e.g. labelling, setting, hidden curriculum, subcultures.","Up to 3 marks: e.g. use semi-structured interviews with a stratified sample of pupils from different sets about how teachers treat them; rapport allows them to explain how labels affect their motivation, giving valid data; gain consent and keep answers anonymous."]}]}]},{"id":"s7-2","stim":[],"parts":[{"no":"","q":"Identify one factor that may explain class differences in achievement and explain how you would investigate this using secondary data.","m":4,"ms":[{"h":"","b":["1 mark: identifies a factor, e.g. material deprivation (FSM), cultural capital.","Up to 3 marks: e.g. compare government statistics on GCSE results of FSM and non-FSM pupils across schools over several years; cheap, large and reliable data shows patterns; but can't explain why."]}]}]},{"id":"s7-3","stim":[],"parts":[{"no":"","q":"Identify one ethical issue you would need to consider when investigating domestic violence and explain how you would deal with it.","m":4,"ms":[{"h":"","b":["1 mark: e.g. harm to participants, confidentiality/anonymity, informed consent, safety.","Up to 3 marks: e.g. victims may be distressed by recalling abuse, so use a sensitive interviewer, allow them to withdraw, provide contacts for support services and use pseudonyms so abusers can't identify them."]}]}]},{"id":"s7-4","stim":[],"parts":[{"no":"","q":"Identify one advantage private schools offer and explain how you would investigate this using secondary data.","m":4,"ms":[{"h":"","b":["1 mark: e.g. smaller classes, better results, more resources, contacts.","Up to 3 marks: e.g. compare Department for Education data on A-level grades in private and state schools, and Sutton Trust data on top jobs; large, national data allows comparison."]}]}]},{"id":"s7-5","stim":[],"parts":[{"no":"","q":"Identify one factor that may explain differences in achievement between genders and explain how you would investigate this using observations.","m":4,"ms":[{"h":"","b":["1 mark: e.g. teacher attention, classroom behaviour, subcultures, laddish culture.","Up to 3 marks: e.g. overt non-participant observation of mixed classes, recording how often boys and girls are praised or told off; consent from school and parents; Hawthorne effect is a risk."]}]}]},{"id":"s7-6","stim":[],"parts":[{"no":"","q":"Identify one reason people may live in poverty and explain how you would investigate this using a questionnaire.","m":4,"ms":[{"h":"","b":["1 mark: e.g. low wages, unemployment, lone parenthood, disability.","Up to 3 marks: e.g. anonymous questionnaires to a stratified sample of low-income households (via a food bank or charity as gatekeeper) with closed questions on income and employment; anonymity helps with a sensitive topic."]}]}]}]},{"n":8,"title":"Interpreting data","icon":"📊","tag":"Read the table · quote the numbers · say what it shows.","steps":[["Pattern","State the main trend or difference."],["Figures","Quote the numbers from the table."],["Meaning","Say what this suggests sociologically."]],"watch":"Describing the type of chart, or saying 'it's quantitative data', earns nothing. Quote figures and explain what they show.","items":[{"id":"s8-1","stim":[{"p":"Item A: Attitudes to male and female roles (British Social Attitudes)."},{"table":[["","1989","2012"],["Agree 'a man's job is to earn money; a woman's job is to look after the home'","28%","13%"],["Agree 'a pre-school child is likely to suffer if their mother works'","46%","30%"]]}],"parts":[{"no":"","q":"Identify one trend shown in Item A and explain what it suggests about gender roles.","m":2,"ms":[{"h":"","b":["1 mark: identifies a trend with figures, e.g. agreement that a man's job is to earn money fell from 28% to 13%.","+1: explains, e.g. attitudes to traditional segregated roles have weakened, supporting the idea of more equal roles (though attitudes may not match behaviour)."]}]}]},{"id":"s8-2","stim":[{"p":"Item B: Percentage of pupils achieving 5+ GCSEs at grades A*–C (Youth Cohort Study)."},{"table":[["","1989","1996","2002"],["Males","28","40","46"],["Females","31","49","56"]]}],"parts":[{"no":"","q":"Using Item B, describe the gap in achievement between boys and girls.","m":2,"ms":[{"h":"","b":["1 mark: girls achieved more than boys every year, e.g. 56% vs 46% in 2002.","+1: the gap widened over time, from 3 points in 1989 to 10 points in 2002."]}]}]},{"id":"s8-3","stim":[{"p":"Item C: Percentage achieving 5+ A*–C including English and maths, 2013–14."},{"table":[["Ethnic group","%"],["Chinese","74.4"],["Indian","72.9"],["National average","56.6"],["White British","56.4"],["Black Caribbean","47.0"]]}],"parts":[{"no":"","q":"Using Item C, identify which group achieved highest and how far above the national average it was.","m":2,"ms":[{"h":"","b":["1 mark: Chinese pupils achieved highest (74.4%).","+1: 17.8 percentage points above the national average (74.4 − 56.6)."]}]}]},{"id":"s8-4","stim":[{"p":"Item D: Crimes recorded in England and Wales, 12 months to Sept 2024 (selected)."},{"table":[["Crime type","Count"],["Violence against the person","1,968,992"],["Shoplifting","452,635"],["Burglary","238,893"],["Robbery","74,048"]]}],"parts":[{"no":"","q":"Using Item D, identify the most common crime type and suggest one reason why these figures may not show the true level of crime.","m":2,"ms":[{"h":"","b":["1 mark: violence against the person is most common (about 1.97 million).","+1: e.g. the dark figure: many crimes such as domestic violence are not reported or recorded."]}]}]}]},{"n":9,"title":"12-mark essays","icon":"🧩","tag":"Intro · two PEEL paragraphs with evaluation · a clear conclusion.","steps":[["Introduction","Define key terms and set out your argument."],["For","PEEL paragraph supporting the statement, with a named sociologist, then evaluate it."],["Against","PEEL paragraph from another perspective, then evaluate it."],["Conclusion","Say how far sociologists agree, and which view is most convincing."]],"watch":"No conclusion caps your mark. Make a judgement: 'Overall, sociologists would only partly agree because…'.","items":[{"id":"s9-1","stim":[],"parts":[{"no":"","q":"Discuss how far sociologists would agree that families have segregated conjugal roles. (Write your answer, then mark it against the level descriptors.)","m":12,"ms":[{"h":"","b":["Level 4 (10–12): detailed knowledge (Bott, Willmott and Young, Oakley, Scott and Clery, Edgell), clearly applied, well-evaluated with a reasoned conclusion.","Level 3 (7–9): good knowledge, some application, evaluation but less developed.","Level 2 (4–6): basic knowledge, limited application and evaluation.","Level 1 (1–3): fragments of knowledge, little relevance."]}]}]},{"id":"s9-2","stim":[],"parts":[{"no":"","q":"Discuss how far sociologists would agree that crime is the result of status frustration. (Write your answer, then mark it against the level descriptors.)","m":12,"ms":[{"h":"","b":["Level 4 (10–12): detailed knowledge of Cohen plus alternatives (Merton, Marxism, labelling, feminism), applied and evaluated with a clear conclusion.","Level 3 (7–9): good knowledge, some application and evaluation.","Level 2 (4–6): basic knowledge with limited evaluation.","Level 1 (1–3): fragments, little relevance."]}]}]}]}]</script>
<script>
const DATA = JSON.parse(document.getElementById("data-cards").textContent);

/* ================= EXTRA CONTENT: exam skills + generated RM scenarios/maths ================= */
function rngFrom(seed){ let a=0; for(const ch of String(seed)) a=(a*31+ch.charCodeAt(0))|0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffleR(a,rng){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pickR = (a,rng) => a[Math.floor(rng()*a.length)];

/* Exam skills: q, opt (correct MC option), wrong (3 distractors), a (full answer) */
const EXAM = [
 ["Which command word needs you to choose the correct answer from a list, for 1 mark?","Select",["Discuss","Explain","Examine"],"Questions 1 and 2 are multiple choice: select the correct definition or term."],
 ["How many marks is a 'Describe one…' question worth?","3 marks",["1 mark","4 marks","12 marks"],"'Describe one…' is 3 marks: a short, clear paragraph with a developed point."],
 ["In an 'Identify and describe one…' (3 mark) question, how are the marks split?","1 for identifying, 2 for describing it in detail",["3 for identifying","2 for identifying, 1 for describing","All 3 for using a key study"],"One mark for identifying, two for the description, backed up with an example, evidence or a sociologist."],
 ["How many marks is 'Examine one strength/weakness of the research in Item A' worth?","2 marks",["1 mark","3 marks","4 marks"],"2 marks: one for identifying the strength or weakness, one for evidence from the item."],
 ["For 'Examine one weakness of the research in Item A', where is the answer found?","You use the item for evidence, but the strength or weakness itself comes from your own knowledge",["Copy a sentence straight from the item","It is always the sample size","You don't need the item at all"],"Use your research methods knowledge to name it, then use the item for the second mark."],
 ["How are the marks split in a 4-mark 'Identify and explain one…' question?","1 for identifying, 3 for explaining",["2 and 2","4 for identifying","3 for identifying, 1 for explaining"],"One mark for the point, three for a developed explanation with evidence or a sociologist."],
 ["In a 4-mark research methods question, what do you need for full marks?","Apply the advantage or disadvantage to the specific topic in the question",["Name as many methods as possible","Write a general definition of the method","Include a 12-mark conclusion"],"Answers that stay general can't get full marks. Link the method to the exact topic, e.g. domestic violence."],
 ["What does the 'named studies' question (from Item…) ask you to do?","Identify an aspect of a named AQA study, such as its method, and explain it",["Design your own study","Discuss two perspectives","Calculate a percentage"],"You need to know the named studies: who, method, findings and evaluation."],
 ["What does 'Identify one… and explain how you would investigate this' require?","Pick a factor, then explain a research method you'd use, applied to that topic",["Describe a theory in detail","Give a definition only","List ethical issues only"],"Say which method, who you'd study (sample), and why it suits that topic."],
 ["How do 12-mark questions always begin?","'Discuss how far sociologists would agree…'",["'Describe one…'","'Examine one…'","'Identify and explain…'"],"12-markers are mini essays weighing up both sides of a statement."],
 ["How long should you spend on a 12-mark answer?","At least 12 minutes, ideally 15",["5 minutes","30 minutes","2 minutes"],"Roughly a minute a mark, plus planning."],
 ["What structure should each main paragraph of a 12-marker use?","PEEL: Point, Evidence, Explain, Link (plus evaluation)",["Only a list of key terms","One long sentence","Introduction, conclusion only"],"PEEL keeps paragraphs focused and linked back to the question."],
 ["What must a 12-mark conclusion do?","State clearly how far sociologists agree or disagree with the statement",["Introduce a brand new theory","Repeat the question word for word","Summarise only one paragraph"],"Make a judgement: which view is most convincing and why."],
 ["How many main paragraphs should a 12-marker have at least?","Two: one for and one against (or one on each perspective)",["One","Five","None, just a conclusion"],"At least two developed paragraphs, then a conclusion."],
 ["What is AO1?","Knowledge and understanding of theories, concepts, evidence and methods",["Application","Analysis and evaluation","Spelling and grammar"],"AO1 = knowledge. In a 12-marker it's worth 4 marks."],
 ["What is AO2?","Applying your knowledge to the question or issue",["Knowledge","Evaluation","Remembering key terms only"],"AO2 = application. Worth 4 marks in a 12-marker."],
 ["What is AO3?","Analysing and evaluating theories, evidence and methods to make judgements",["Knowledge","Application","Describing a study"],"AO3 = analysis and evaluation. Worth 4 marks in a 12-marker."],
 ["Which phrase signals evaluation in an answer?","'However, a criticism of this view is…'",["'Firstly…'","'Sociology is the study of…'","'In this essay I will…'"],"Evaluative language like 'however' and 'on the other hand' earns AO3."],
 ["What makes a 3-mark 'describe' answer score full marks?","A clear point developed with an example, evidence or sociologist",["Just a single key word","A list of three words","A full essay"],"Keep it brief but developed: definition plus an example."],
 ["Which is the best evidence to back up a point about the family?","A named sociologist or study, such as Oakley's 77-hour finding",["'Everyone knows that…'","Your own opinion only","A made-up statistic"],"Named sociologists and real data are what examiners reward."],
 ["What is a synoptic link?","A link to another topic, e.g. using Willis (education) in a crime answer",["A link to a website","A key term definition","A research method"],"Synoptic links show wider understanding and can strengthen 12-markers."],
 ["In AQA GCSE Sociology, which paper covers Families and Education?","Paper 1",["Paper 2","Paper 3","Neither"],"Paper 1: Families and Education (with research methods)."],
 ["Which paper covers Crime and deviance and Social stratification?","Paper 2",["Paper 1","Paper 3","Neither"],"Paper 2: Crime and deviance, and Social stratification (with research methods)."],
 ["How long is each GCSE Sociology paper?","1 hour 45 minutes",["1 hour","2 hours 30 minutes","45 minutes"],"Each paper is 1 hour 45 minutes and worth 100 marks."],
 ["What is the PET mnemonic used for?","Evaluating research: Practical, Ethical and Theoretical issues",["Remembering the perspectives","Structuring a conclusion","Naming types of family"],"PET helps you evaluate any research method."],
 ["You are asked for one advantage of questionnaires for researching marriage. Which answer applies it best?","Questionnaires can reach a large sample of married couples cheaply, so trends in marriage can be generalised",["Questionnaires are cheap","Questionnaires use closed questions","Questionnaires are a primary method"],"The best answer links the method to marriage, the topic in the question."],
 ["Which is a 2-mark answer to 'Examine one weakness of the research in Item A' where 40 women in one town were interviewed?","The sample is small and from one town (only 40 women), so the findings can't be generalised",["It is unethical","Interviews are qualitative","It was a good study"],"Name the weakness (generalisability) and use evidence from the item (40 women, one town)."],
 ["What does 'Discuss' mean in a 12-mark question?","Look at different sides of the argument and come to a judgement",["Define a key term","Name one thing","Draw a diagram"],"Discuss = for and against, with evaluation and a conclusion."],
 ["Which introduction is strongest for a 12-marker?","One that defines key terms and sets out the line of argument",["'I am going to answer this question'","A copy of the question","A conclusion"],"A short introduction clarifies terms and shows where your argument is going."],
 ["What is the best way to use a statistic in an answer?","Quote it and explain what it shows about the question",["Just write the number","Make one up if you can't remember","Avoid statistics entirely"],"Data plus explanation turns a fact into evidence."],
];

/* Unseen-scenario bank for research methods (sociology) */
const SCEN = [

const METHODS = [
 {n:"Structured interview", txt:"asked 200 people the same list of pre-written questions face to face, in the same order",
  s:"It is standardised, so it is reliable and answers are easy to compare", w:"There is little chance to explore answers in depth, so it may lack validity"},
 {n:"Unstructured interview", txt:"had long, informal conversations with 15 people, letting the discussion go wherever the participant wanted",
  s:"Rapport and follow-up questions give rich, detailed and valid qualitative data", w:"It is time-consuming and hard to repeat, so it is low in reliability"},
 {n:"Questionnaire", txt:"sent a set of written, mostly closed questions to 1,000 households to fill in themselves",
  s:"It is cheap and quick and can reach a large, representative sample", w:"Response rates may be low and the researcher can't explain confusing questions"},
 {n:"Covert participant observation", txt:"secretly joined the group for six months without revealing they were a researcher",
  s:"People act naturally because they don't know they are being studied, so it is high in validity", w:"There is no informed consent and it involves deception, so it is unethical"},
 {n:"Overt non-participant observation", txt:"sat at the back of classrooms, with permission, watching and recording behaviour without joining in",
  s:"It is ethical because participants have given informed consent", w:"People may change their behaviour because they know they are being watched (Hawthorne effect)"},
 {n:"Content analysis", txt:"counted how often certain themes appeared in 200 newspaper articles",
  s:"It is cheap and the coding categories can be reused, so it is reliable", w:"Deciding what each piece of content means can be subjective"},
 {n:"Official statistics", txt:"used government figures that had already been published",
  s:"They are cheap, easy to access and cover the whole country over many years", w:"They were collected for another purpose and may hide the real picture (e.g. the dark figure)"},
 {n:"Longitudinal study", txt:"followed the same 400 people for 20 years, interviewing them every few years",
  s:"It shows how things change over time and can help show cause and effect", w:"People drop out over time, so the sample may become unrepresentative"},
];
const SAMPLES = [

const fmtN = x => String(Math.round(x*10)/10);
const gcd = (a,b) => b ? gcd(b, a%b) : a;
const sup = e => String(e).split("").map(ch=>({"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"}[ch])).join("");
function ints(n,lo,hi,rng){ return Array.from({length:n},()=>lo+Math.floor(rng()*(hi-lo+1))); }
function distinctInts(n,lo,hi,rng){ const s=new Set(); while(s.size<n) s.add(lo+Math.floor(rng()*(hi-lo+1))); return [...s]; }
function mk(sc,q,opt,cands,a,kind){
  opt=String(opt); const wrong=[];
  for(const c of cands.map(String)) if(c!==opt && !wrong.includes(c)) wrong.push(c);
  let k=1; while(wrong.length<3 && /^-?\d+(\.\d+)?$/.test(opt)){ const v=fmtN(+opt+k*(k%2?1:-1)); if(v!==opt && !wrong.includes(v)) wrong.push(v); k++; }
  return {t:"RM", sc, q, opt, wrong:wrong.slice(0,3), a:a||opt, kind};
}

    const sc=[`A sociologist found that as ${x} increased, ${y} also increased.`,`A sociologist found that as ${x} increased, ${y} decreased.`,`A sociologist found no pattern between ${x} and ${y}.`][k];
    const n=["Positive correlation","Negative correlation","No correlation"][k];
    return mk(sc,"What type of relationship (correlation) is this?",n,["Positive correlation","Negative correlation","No correlation","Proof that one causes the other"],`${n}. Remember: a correlation does not prove cause and effect.`,"maths"); },
  mean:rng=>{ const s=pickR(SCEN,rng), n=5+Math.floor(rng()*2), xs=ints(n,s.lo,s.hi,rng), sum=xs.reduce((a,b)=>a+b,0), m=sum/n, so=xs.slice().sort((a,b)=>a-b), med=n%2?so[(n-1)/2]:(so[n/2-1]+so[n/2])/2;

  median:rng=>{ const s=pickR(SCEN,rng), xs=ints(7,s.lo,s.hi,rng), so=xs.slice().sort((a,b)=>a-b), med=so[3], m=xs.reduce((a,b)=>a+b,0)/7;

  mode:rng=>{ const s=pickR(SCEN,rng), base=distinctInts(5,s.lo,s.hi,rng), md=base[Math.floor(rng()*5)], xs=shuffleR(base.concat([md]),rng), m=xs.reduce((a,b)=>a+b,0)/6, so=xs.slice().sort((a,b)=>a-b);

  range:rng=>{ const s=pickR(SCEN,rng), xs=distinctInts(6,s.lo,s.hi,rng), mx=Math.max(...xs), mn=Math.min(...xs);

};

let actx;
function tone(f,d,type="sine",t0=0,vol=.07){
  if(!G.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+t0;
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+.05);
  }catch(e){}
}
function sfx(k){
  if(k==="ok"){ const f=523*Math.pow(1.0595,Math.min(combo,14)); tone(f,.12,"triangle"); tone(f*1.5,.16,"triangle",.06); }
  else if(k==="no") tone(140,.22,"sawtooth",0,.04);
  else if(k==="lvl") [523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,"triangle",i*.09));
  else if(k==="badge") [784,1175,1568].forEach((f,i)=>tone(f,.25,"sine",i*.08));
  else if(k==="gold") [1047,1319,1568,2093].forEach((f,i)=>tone(f,.2,"sine",i*.06,.05));
  else if(k==="tick") tone(880,.05,"square",0,.02);
}

/* ---- confetti ---- */
let parts=[], fxRun=false;
function confetti(n=140, colours){
  if(reduced()) return;
  const cv=$("#fx"), dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  const cols=colours||TOPICS.map(t=>t.c).concat(["#FFD54A","#4CC896"]);
  for(let i=0;i<n;i++){ const side=i%2; parts.push({x:(side?innerWidth*.85:innerWidth*.15), y:innerHeight*.6, vx:(side?-1:1)*(2+Math.random()*7), vy:-(8+Math.random()*9), r:4+Math.random()*5, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.4, life:0}); }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  const cv=$("#fx"), ctx=cv.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.y<innerHeight+30 && p.life<260);
  parts.forEach(p=>{ p.life++; p.vy+=.28; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r*.45,p.r*2,p.r*.9); ctx.restore(); });
  if(parts.length) requestAnimationFrame(fxLoop); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---- floaters, toasts, modal ---- */
function floater(text, el, cls=""){
  if(reduced()) return;
  let x=innerWidth/2, y=innerHeight/2;
  if(el && el.getBoundingClientRect){ const r=el.getBoundingClientRect(); if(r.width){ x=r.left+r.width/2; y=r.top; } }
  const f=document.createElement("div"); f.className="floater "+cls; f.textContent=text; f.style.left=x+"px"; f.style.top=(y-10)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(),1200);
}
function toast(icon,title,sub="",force=false){
  if(!force && typeof focusOn==="function" && focusOn()) return;   // focus mode pauses pop-ups
  const w=$("#toasts"), t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status");
  t.innerHTML=`<span class="ti">${icon}</span><div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>`;
  w.appendChild(t); while(w.children.length>2) w.firstChild.remove();
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),300); }, 2800);
}

function addXP(n, el, label){
  if(n<=0) return;
  G.xp+=n;
  if(el!==false) floater(label||("+"+n+" XP"), el, n>=40?"big":"");

function checkStreak(){
  if(!G.last) return;
  const gap=dayNum(today())-dayNum(G.last);
  if(gap<=1) return;
  const missed=gap-1;
  if(G.streak>0 && G.freeze>=missed){
    G.freeze-=missed; const y=new Date(); y.setDate(y.getDate()-1); G.last=ymd(y);
    setTimeout(()=>toast("🧊","Streak freeze used",`Your ${G.streak}-day streak is safe. Hit today's goal to keep it.`),800);
  } else {
    if(G.streak>1) setTimeout(()=>toast("💔",`Your ${G.streak}-day streak ended`,"Start a new one today. Hit your daily goal."),800);
    G.streak=0;
  }
  save();
}
function goalMet(){
  const t=today();
  G.streak = (G.last && dayNum(t)-dayNum(G.last)===1) ? G.streak+1 : 1;
  G.last=t; if(G.streak>G.best) G.best=G.streak;
  confetti(160); sfx("badge");
  toast("🎯","Daily goal smashed! +50 XP", G.streak>1?`🔥 ${G.streak}-day streak`:"Streak started. Come back tomorrow to build it.");
  addXP(50,false);
  if(G.streak%7===0 && G.freeze<2){ G.freeze++; setTimeout(()=>toast("🧊","Streak freeze earned","It saves your streak if you miss a day."),1200); }
}
function answer({ok, el, mode, gold, x2, review, topic, boss, typed}){
  checkStreak();
  const t=today();
  G.st.cards++; if(ok) G.st.right++;
  if(!ok && combo===7) G.flags.miller=1;
  if(EXAMS.some(e=>e.mock && dayNum(e.d)-dayNum(t)===1)) G.flags.nightbefore=1;
  if(t.slice(5)==="12-25") G.flags.festive=1;
  if(ok){ combo++; if(combo>G.st.combo) G.st.combo=combo; } else combo=0;
  const base = (mode==="quiz" ? (ok?15:4) : mode==="arcade" ? (ok?6:1) : (ok?10:3)) * (typed && ok ? 2 : 1);   // typed answers earn double
  let mult = (ok ? comboMult() : 1) * ((x2 || topic==="Exam skills") ? 2 : 1) * eventMult(topic, boss);   // exam skills always earn double XP
  if(gold && ok){ mult*=5; G.st.gold++; }
  if(mode==="arcade") mult*=gotdMult();   // game of the day: double XP
  const xp=Math.round(base*mult)+(review?5:0);
  G.hist[t]=(G.hist[t]||0)+1;
  if(topic && TMAP[topic]){ G.tacc=G.tacc||{}; const ta=G.tacc[topic]=G.tacc[topic]||[0,0]; ta[1]++; if(ok) ta[0]++; }   // per-topic accuracy for Weak spots
  if(topic){ if(!G.tday || G.tday.d!==t) G.tday={d:t, c:{}}; G.tday.c[topic]=(G.tday.c[topic]||0)+1; }
  if(gold && ok){ sfx("gold"); confetti(70); } else sfx(ok?"ok":"no");
  addXP(xp, el, "+"+xp+" XP"+(mult>1?"  ×"+mult:""));
  if(!ok) floater("+"+xp+" XP for honesty", el, "meh");
  bumpCombo(ok);
  if(G.hist[t]>=G.goal && G.last!==t) goalMet();
  checkBadges(); save(); renderHud();
  return xp;
}

// what kind of answer a card asks for, so wrong options are the same kind
function qKind(q){
  const s=q.toLowerCase();
  if(/\b(weakness|strength|criticis|evaluat|problem with|limitation|advantage|disadvantage|lack|why is .* (said|not|criticised)|how reliable|valid)/.test(s)) return "eval";
  if(/\b(how many|what percentage|what %|how long|how old|what age|how much)\b/.test(s)) return "num";
  if(/^(who|which sociologist|which researcher|which study|name (a|the|one|two)? ?(study|studies|researcher|sociologist)|what was the name|what are the named)/.test(s)) return "name";
  if(/\baim\b/.test(s)) return "aim";
  if(/\b(iv|dv|independent variable|dependent variable|extraneous)\b/.test(s)) return "var";
  if(/\bhypothesis\b/.test(s)) return "hyp";
  if(/\b(method|procedure|describe how|what did .* do|sample|design|how did)\b/.test(s)) return "method";
  if(/\b(found|result|discover|conclude|conclusion|show)\b/.test(s) || /\bfind\b(?! out)/.test(s)) return "find";
  if(/\b(applied|application|used in|real-life|real world|help)\b/.test(s)) return "apply";
  if(/\b(example|e\.g\.)\b/.test(s)) return "eg";
  if(/\b(which (process|stage|factor|cue|type|part|lobe|explanation)|what (process|stage|type))\b/.test(s)) return "term";
  if(/^(what is|what are|what does|define|what do we mean|explain what is meant)/.test(s)) return "def";
  return "other";
}
const NAMES_RE=/\b([A-Z][a-z]+(?:'s)?)\b/g, NOT_NAMES=new Set(["What","Which","Who","Give","Name","How","Why","Describe","Explain","Write","Is","Are","The","A","An","In","Outline","Identify","State","Does","Do","When","Where","If","One","Two","Under","UK","AQA","CSEW","CJS","NS-SEC","EBacc","PEEL","BAME","STEM"]);
const qNames = q => new Set((q.match(NAMES_RE)||[]).map(n=>n.replace(/'s$/,"")).filter(n=>!NOT_NAMES.has(n)));
function mcFor(d, rng=Math.random){
  if(d.wrong){ const right=d.opt||d.a, opts=shuffleR([right,...d.wrong.slice(0,3)],rng); return {opts, correct:opts.indexOf(right)}; }
  const L=d.a.length, seen=new Set([d.a.toLowerCase()]), kind=qKind(d.q), names=qNames(d.q), hasNum=/\d/.test(d.a);
  const cands=DATA.filter(x=>!x.wrong && x.id!==d.id && x.id<5000 && x.t!=="Exam skills").map(x=>{
    const k=qKind(x.q);
    // never offer another valid answer about the same study/theory for evaluation or finding questions
    if((kind==="eval"||kind==="find") && k===kind && [...qNames(x.q)].some(n=>names.has(n))) return null;
    let s=Math.abs(x.a.length-L)*.6 + rng()*30;
    if(k!==kind) s+=400;
    if(x.t!==d.t) s+=80;
    if(/\d/.test(x.a)!==hasNum) s+=60;
    return [s, x.a];
  }).filter(Boolean).sort((a,b)=>a[0]-b[0]);
  const picks=[];
  for(const [,a] of cands.slice(0,10).sort(()=>rng()-.5)){ const k=a.toLowerCase(); if(!seen.has(k)){ seen.add(k); picks.push(a); } if(picks.length===3) break; }
  const opts=shuffleR([d.a,...picks],rng);
  return {opts, correct:opts.indexOf(d.a)};
}

/* ---- key-term gap fills (built from "What is X?" definitions) ---- */
const TERMS = (()=>{
  const res=[/^What (?:is|are) (?:an? |the )?(.+?)\?$/i, /^Key term: what is meant by '(.+?)'\?$/i], out=[], seen=new Set();
  DATA.forEach(d=>{
    if(d.id>=5000) return;
    let term=null; for(const r of res){ const m=d.q.match(r); if(m){ term=m[1]; break; } }
    if(!term) return;
    term=term.replace(/^['"]|['"]$/g,"").trim();
    if(term.split(/\s+/).length>4 || /\d|^(one|two|three|four|five|the difference|formula|capacity|duration|encoding of|role|aim|purpose|meant|main|key|strength|weakness)\b/i.test(term)) return;
    if(/\b(name|named|names|for|used|responsible|explanation|in|of|studies|study)\b/i.test(term)) return;
    if(/^(very|mainly|unlimited|limited|about|around|up to|\d)/i.test(d.a) || d.a.length<20) return;
    const k=term.toLowerCase(); if(seen.has(k)) return; seen.add(k);
    const main=term.replace(/\s*\(.*?\)\s*/g," ").trim(), paren=(term.match(/\((.*?)\)/)||[])[1];
    const alts=[main, term, paren, main.replace(/^\S+'s\s+/,"")].filter(Boolean);
    let def=d.a; alts.forEach(a=>{ if(a.length>3) def=def.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"),"_____"); });
    out.push({id:d.id, t:d.t, term:main, alts, def, q:"Key term: "+main, a:d.a});
  });
  return out;
})();
const TERM_BY_ID = Object.fromEntries(TERMS.map(x=>[x.id,x]));
const normT = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"").replace(/s$/,"");
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
function termMatch(input, item){ const x=normT(input); if(!x) return false; return item.alts.some(a=>{ const y=normT(a), tol=y.length<5?0:y.length<10?1:2; return lev(x,y)<=tol; }); }

function gapHint(){ if(arc.locked) return; const d=arc.items[arc.i], letters=d.term.replace(/[^a-z0-9]/gi,"").length; if(arc.hints>=letters-1) return; arc.hints++; $("#blanks").innerHTML=blanksHTML(d); $("#gapIn").focus(); sfx("tick"); }
function gapCheck(){
  if(arc.locked) return; const inp=$("#gapIn"), d=arc.items[arc.i];
  if(!inp.value.trim()){ inp.focus(); return; }

  if(termMatch(inp.value,d)) return gapDone(true);

}
function gapDone(ok){

  const d=arc.items[arc.i], pts = ok ? Math.max(1,3-arc.hints) : 0;

function arcFinish(){
  if(arc.phase!=="play") return;
  clearInterval(arc.timer); arc.phase="done"; arc.best=false;
  let bonus=0; const st=G.st;
  if(arc.mode==="blitz"){ bonus=arc.right*2; if(arc.score>st.blitz && arc.score>0){ st.blitz=arc.score; arc.best=true; } if(arc.right>st.blitzR) st.blitzR=arc.right; }
  if(arc.mode==="surv"){ bonus=arc.right*3; if(arc.right>st.surv && arc.right>0){ st.surv=arc.right; arc.best=true; } }
  if(arc.mode==="exam"){ bonus=20+arc.right*6; if(arc.right>st.exam){ st.exam=arc.right; arc.best=true; } }
  if(arc.mode==="maths"){ bonus=10+arc.right*4; if(arc.right>st.mathsBest){ st.mathsBest=arc.right; arc.best=true; } }
  if(arc.mode==="boss"){
    const win=arc.hp<=0, flaw=win&&arc.lives===3, r=G.bosses[arc.boss]||{tries:0,wins:0,bestHp:BOSS_HP};
    r.tries++; r.bestHp=Math.min(r.bestHp,arc.hp);
    if(win && arc.hard){ if(!r.hardWon) arc.best=true; r.hardWon=true; G.st.hardWins=(G.st.hardWins||0)+1; }
    else if(win){ if(!r.won) arc.best=true; r.won=true; r.wins=(r.wins||0)+1; if(flaw){ if(!r.flawless) arc.best=true; r.flawless=true; } }
    G.bosses[arc.boss]=r; bonus = win ? (arc.hard?200:100)+(flaw?50:0) : arc.right*3;
    if(win){ G.st.bossWins=(G.st.bossWins||0)+1; if(flaw) G.st.flawless=(G.st.flawless||0)+1; }
  }
  if(arc.mode==="fix"){ bonus=arc.right*3; }
  if(arc.mode==="terms"){ bonus=10+arc.score*2; if(arc.score>st.terms){ st.terms=arc.score; arc.best=true; } }
  if(arc.mode==="daily"){
    const log=arc.items.map((x,i)=>arc.log[i]?arc.log[i].ok:false), score=log.filter(Boolean).length;
    G.daily[today()]={started:true, done:true, score, time:Date.now()-arc.t0, log, items:arc.items.map(slim)};
    arc.log=arc.items.map((x,i)=>({item:x, ok:log[i]}));
    bonus=30+score*5; if(score===10) bonus+=50;
  }
  if(Date.now()-arc.t0<5000) G.flags.ragequit=1;
  if(arc.mode==="blitz" && arc.score===450) G.flags.shock450=1;
  if(arc.mode==="boss"){ const win=arc.hp<=0;
    if(win && arc.lives===1) G.flags.comeback=1;
    if(!win && arc.lives<=0 && arc.log.length<=3) G.flags.ouch=1;
    if(win){ const t=today(); G.bossDays={[t]:[...new Set([...(G.bossDays[t]||[]), arc.boss])]}; if(G.bossDays[t].length>=3) G.flags.bossrush=1; } }
  bonus*=gotdMult(); arc.xp+=bonus; addXP(bonus,false); checkPal();
  if(arc.best || (arc.mode==="daily" && G.daily[today()].score>=8)){ confetti(200); sfx("lvl"); }
  checkBadges(); save(); renderArcade();
}

  Object.assign(ws,{items:shuffle(CLUESETS).slice(0,8), i:0, clue:0, score:0, xp:0, locked:false, log:[]}); resetCombo(); wsNew(); arcToTop();
}
function wsNew(){ const s=ws.items[ws.i]; ws.clue=0; ws.locked=false; ws.opts=shuffle([s[0],...shuffle(CLUESETS.filter(x=>x!==s)).slice(0,5).map(x=>x[0])]); wsRender(); }
function wsRender(){
  const s=ws.items[ws.i], pts=5-ws.clue;
  $("#arcArea").innerHTML=`<div class="arc-top"><span class="big">🕵️ Which Study?</span><span class="spacer"></span><span>Points</span><span class="big">${ws.score}</span><span class="big">${ws.i+1}/8</span></div>
    <div class="progressline"><i style="width:${ws.i/8*100}%"></i></div>
    <div class="quiz-q" style="--c:#9A6324"><div class="tag">Clue ${ws.clue+1} of 5 <span class="muted">· worth ${pts} point${pts===1?"":"s"}</span></div>
      <ol class="ws-clues">${s[1].slice(0,ws.clue+1).map(c=>`<li>${esc(c)}</li>`).join("")}</ol>
      <div class="opts ws-opts">${ws.opts.map((o,i)=>`<button class="opt" data-ws="${i}"><span class="k">${"ABCDEF"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      <div class="card-actions"><button class="btn ghost" id="wsMore" ${ws.clue>=4?"disabled":""}>Another clue (−1 point)</button></div><div id="wsFb" class="gapfb" aria-live="polite"></div></div>
    <p style="text-align:right;margin-top:10px"><button class="linkbtn" id="arcQuit">End game</button></p>`;
  $("#wsMore").onclick=()=>{ if(ws.clue<4){ ws.clue++; sfx("tick"); wsRender(); } };
  document.querySelectorAll("[data-ws]").forEach(b=>b.onclick=()=>wsPick(+b.dataset.ws, b));
  $("#arcQuit").onclick=()=>wsFinish();
}
function wsPick(i, btn){
  if(ws.locked) return;
  const s=ws.items[ws.i], ok=ws.opts[i]===s[0];
  if(!ok && ws.clue<4){ btn.disabled=true; btn.classList.add("wrong"); ws.clue++; sfx("no"); $("#wsFb").innerHTML=`<span style="color:var(--warn)">Not ${esc(ws.opts[i])}. Here's another clue…</span>`;
    setTimeout(()=>{ if(!ws.locked) wsRender(); },900); return; }
  ws.locked=true; const pts=ok?5-ws.clue:0; ws.score+=pts; ws.log.push({s, ok, pts});
  document.querySelectorAll("[data-ws]").forEach((b,j)=>{ b.disabled=true; if(ws.opts[j]===s[0]) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  ws.xp+=answer({ok, el:btn, mode:"arcade", topic:"Exam skills"});
  $("#wsFb").innerHTML = ok ? `<b style="color:var(--good)">✓ ${esc(s[0])} · +${pts}</b>` : `<b style="color:var(--warn)">It was ${esc(s[0])}</b>`;
  setTimeout(()=>{ ws.i++; if(ws.i>=8) wsFinish(); else wsNew(); }, ok?1100:1900);
}
function wsFinish(){
  if(arc.phase!=="which") return; arc.phase="wdone";
  const best=ws.score>(G.st.whichBest||0); if(best) G.st.whichBest=ws.score;
  const bonus=(10+ws.score*2)*2*gotdMult(); ws.xp+=bonus; addXP(bonus,false); if(best&&ws.score>0){ confetti(150); sfx("lvl"); }
  checkBadges(); save();
  const missed=ws.log.filter(x=>!x.ok);
  $("#arcArea").innerHTML=`<div class="empty">${best&&ws.score>0?'<div class="newbest">🏆 NEW PERSONAL BEST</div>':""}<h3>🕵️ Which Study? over</h3><p class="score">${ws.score}/40</p><p class="muted">+${ws.xp} XP (2× exam skills XP)</p>
    <button class="btn" id="arcAgain">Play again</button> <button class="btn ghost" id="arcMenu">Arcade menu</button>
    ${missed.length?`<ul class="results" style="margin-top:22px"><li style="padding-left:14px;background:none;border:0"><b>Learn from these:</b></li>${missed.map(x=>`<li class="no"><b>${esc(x.s[0])}</b><div class="ans">${esc(x.s[1].join(" "))}</div></li>`).join("")}</ul>`:""}</div>`;
  $("#arcAgain").onclick=wsStart; $("#arcMenu").onclick=()=>{ arc.phase="menu"; renderArcade(); };
}

/* ================= PSYCHLE (daily key term) ================= */
const PSY_WORDS = (()=>{ const seen=new Set(); return TERMS.filter(x=>/^[a-z]{5,8}$/i.test(x.term) && !seen.has(x.term.toLowerCase()) && seen.add(x.term.toLowerCase())); })();
const psyNo = () => dayNum(today())-dayNum("2026-11-01")+1;
const PSY_ORDER = shuffleR(PSY_WORDS, rngFrom("psychle-order-v1"));
function psyToday(){ const n=psyNo(); return PSY_ORDER[((n%PSY_ORDER.length)+PSY_ORDER.length)%PSY_ORDER.length]; }
function psyState(){ G.psychle=G.psychle||{}; return G.psychle[today()] = G.psychle[today()] || {g:[], done:false, won:false}; }
function psyMarks(guess, ans){
  const g=guess.split(""), a=ans.split(""), res=g.map(()=>"b"), left={};
  a.forEach((ch,i)=>{ if(g[i]===ch) res[i]="g"; else left[ch]=(left[ch]||0)+1; });
  g.forEach((ch,i)=>{ if(res[i]!=="g" && left[ch]){ res[i]="y"; left[ch]--; } });
  return res;
}
let psyCur="";
function psyStart(){ clearInterval(arc.timer); arc.phase="psychle"; arc.mode="psychle"; psyCur=""; psyRender(); arcToTop(); }
function psyRender(){
  const w=psyToday(), ans=w.term.toLowerCase(), L=ans.length, st=psyState(), t=TMAP[w.t];
  const rows=[]; for(let r=0;r<6;r++){ const g=st.g[r]; const m=g?psyMarks(g,ans):null; const cur=!g && r===st.g.length && !st.done;
    rows.push(`<div class="psy-row">${Array.from({length:L},(_,i)=>{ const ch=g?g[i]:cur?(psyCur[i]||""):""; return `<span class="psy-tile ${m?m[i]:""} ${cur&&psyCur[i]?"typed":""}">${esc(ch.toUpperCase())}</span>`; }).join("")}</div>`); }
  const used={}; st.g.forEach(g=>psyMarks(g,ans).forEach((m,i)=>{ const c=g[i], rank={g:3,y:2,b:1}; if(!used[c]||rank[m]>rank[used[c]]) used[c]=m; }));
  const kb=["qwertyuiop","asdfghjkl","zxcvbnm"].map((row,ri)=>`<div class="psy-kr">${ri===2?'<button class="psy-k wide" data-pk="enter">Enter</button>':""}${row.split("").map(c=>`<button class="psy-k ${used[c]||""}" data-pk="${c}">${c.toUpperCase()}</button>`).join("")}${ri===2?'<button class="psy-k wide" data-pk="back" aria-label="Delete">⌫</button>':""}</div>`).join("");
  $("#arcArea").innerHTML=`<div class="arc-top"><span class="big">🔤 Sociodle #${psyNo()}</span><span class="spacer"></span><button class="btn ghost" id="arcMenu" style="padding:7px 14px">Back</button></div>
    <p class="muted" style="margin:0 0 6px">Guess today's ${L}-letter key term in 6 tries. 🟩 right letter, right place · 🟨 in the word, wrong place.</p>
    <p class="psy-clue"><span class="tag" style="color:${t.c}">${esc(t.name)}</span>${st.g.length>=3||st.done?` · <b>Clue:</b> ${esc(w.def)}`:` · <span class="muted">Definition clue after 3 guesses</span>`}</p>
    <div class="psy-board">${rows.join("")}</div>
    <div id="psyMsg" class="gapfb" aria-live="polite" style="text-align:center">${st.done?(st.won?`<b style="color:var(--good)">🎉 Got it in ${st.g.length}! It was ${esc(w.term)}.</b>`:`<b style="color:var(--warn)">It was ${esc(w.term)}. New word tomorrow!</b>`):""}</div>
    ${st.done?`<div class="share">${esc(psyShare())}</div><div class="card-actions" style="justify-content:center"><button class="btn ghost" id="psyCopy">Copy result</button></div><p class="muted" style="text-align:center">Next Sociodle in ${untilMidnight()}.</p>`:`<div class="psy-kb">${kb}</div>`}`;
  $("#arcMenu").onclick=()=>{ arc.phase="menu"; renderArcade(); };
  document.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>psyKey(b.dataset.pk));
  const c=$("#psyCopy"); if(c) c.onclick=()=>{ navigator.clipboard && navigator.clipboard.writeText(psyShare()).then(()=>{ c.textContent="Copied ✓"; }).catch(()=>{}); };
}
function psyShare(){ const ans=psyToday().term.toLowerCase(), st=psyState(); return `Sociodle #${psyNo()} ${st.won?st.g.length:"X"}/6\n`+st.g.map(g=>psyMarks(g,ans).map(m=>m==="g"?"🟩":m==="y"?"🟨":"⬛").join("")).join("\n"); }
function psyKey(k){
  const st=psyState(); if(st.done) return; const ans=psyToday().term.toLowerCase(), L=ans.length;
  if(k==="back"){ psyCur=psyCur.slice(0,-1); psyRender(); return; }
  if(k==="enter"){
    if(psyCur.length<L){ const m=$("#psyMsg"); m.innerHTML=`<span style="color:var(--warn)">Not enough letters</span>`; return; }
    st.g.push(psyCur); const won=psyCur===ans; psyCur="";
    if(won||st.g.length>=6){ st.done=true; st.won=won; const xp=won?(10+(7-st.g.length)*8)*2:10; addXP(xp,false); sfx(won?"lvl":"no"); if(won) confetti(160);
      G.st.psyWins=(G.st.psyWins||0)+(won?1:0); G.hist[today()]=(G.hist[today()]||0)+1; checkBadges(); }
    else sfx("tick");
    save(); psyRender(); return;
  }
  if(/^[a-z]$/.test(k) && psyCur.length<L){ psyCur+=k; psyRender(); }
}
document.addEventListener("keydown",e=>{ if(arc.phase!=="psychle" || e.target.matches("input,textarea") || e.metaKey||e.ctrlKey||e.altKey) return;
  const k=e.key.toLowerCase(); if(k==="enter"){ e.preventDefault(); psyKey("enter"); } else if(k==="backspace"){ e.preventDefault(); psyKey("back"); } else if(/^[a-z]$/.test(k)){ e.preventDefault(); psyKey(k); } });

function cleanName(raw){
  // returns a tidy name, or null if it's empty, uses odd characters or contains a rude word
  const n=String(raw||"").replace(/\s+/g," ").trim().slice(0,20);
  if(n.length<2 || !/^[A-Za-zÀ-ÿ' .-]+$/.test(n)) return null;
  const leet=s=>s.toLowerCase().replace(/[0@]/g,m=>m==="0"?"o":"a").replace(/1|!|\|/g,"i").replace(/3/g,"e").replace(/4/g,"a").replace(/5|\$/g,"s").replace(/7/g,"t");
  const squash=s=>s.replace(/(.)\1+/g,"$1");
  const flat=squash(leet(n).replace(/[^a-z]/g,""));
  if(NAME_BLOCK[0].some(w=>flat.includes(squash(w)))) return null;
  const words=leet(n).split(/[^a-z]+/).filter(Boolean).map(squash);
  if(words.some(w=>NAME_BLOCK[1].some(b=>squash(b)===w)) || NAME_BLOCK[1].some(b=>squash(b)===flat)) return null;
  return n;
}

const b64e = bytes => { let s=""; for(let i=0;i<bytes.length;i+=8192) s+=String.fromCharCode.apply(null, bytes.subarray(i,i+8192)); return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function makeSave(){
  const json=JSON.stringify({v:1, p:store.p, sel:store.sel, all:store.all, g:store.g});
  if(window.CompressionStream){ const st=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip")); return "FOUNT-Z:"+b64e(new Uint8Array(await new Response(st).arrayBuffer())); }
  return "FOUNT-J:"+b64e(new TextEncoder().encode(json));
}
async function readSave(code){
  code=code.trim().replace(/\s+/g,""); let json;
  if(code.startsWith("FOUNT-Z:")){ const st=new Blob([b64d(code.slice(8))]).stream().pipeThrough(new DecompressionStream("gzip")); json=await new Response(st).text(); }
  else if(code.startsWith("FOUNT-J:")) json=new TextDecoder().decode(b64d(code.slice(8)));
  else throw new Error("not a save code");
  const s=JSON.parse(json); if(!s || typeof s.p!=="object" || typeof s.g!=="object") throw new Error("bad save"); return s;
}

/* ================= PROGRESS REPORT CODES ================= */
// Format "FR1." + base64url(bytes). Bytes: version, name, then varints/bytes in a fixed order, then a 16-bit checksum.
function varint(arr, n){ n=Math.max(0,Math.floor(n||0)); while(n>=128){ arr.push((n%128)|128); n=Math.floor(n/128); } arr.push(n); }
function readVar(b, p){ let n=0, m=1, x; do{ x=b[p.i++]; if(x===undefined) throw new Error("short"); n+=(x&127)*m; m*=128; }while(x&128); return n; }
const ck16 = bytes => { let h=0x811c9dc5; for(const x of bytes){ h^=x; h=Math.imul(h,16777619)>>>0; } return (h ^ (h>>>16)) & 0xffff; };
const b64u = bytes => b64e(bytes).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => b64d(s.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((s.length+3)%4));
const popcount = n => { let c=0; while(n){ c+=n&1; n=Math.floor(n/2); } return c; };
function makeReport(){
  const bytes=[1];
  const nm=[...new TextEncoder().encode((G.name||"").trim().slice(0,24))].slice(0,40); bytes.push(nm.length, ...nm);
  varint(bytes, dayNum(today())-dayNum("2026-01-01"));
  varint(bytes, G.xp); varint(bytes, knownTotal());
  const ts=topicStats(); ts.forEach(s=>bytes.push(s.k)); ts.forEach(s=>bytes.push(s.l));
  bytes.push(G.st.cards ? Math.round(G.st.right/G.st.cards*100) : 0);
  varint(bytes, liveStreak()); varint(bytes, G.best);
  let bm=0; TOPICS.forEach((t,i)=>{ if(G.bosses[t.key] && G.bosses[t.key].won) bm+=Math.pow(2,i); }); varint(bytes, bm);
  varint(bytes, G.st.cards);
  let act=0; for(let i=0;i<14;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(G.hist[ymd(d)]) act+=Math.pow(2,i); } varint(bytes, act);
  const c=ck16(bytes); bytes.push(c>>8, c&255);
  return "FR1."+b64u(new Uint8Array(bytes));
}
function parseReport(code){
  const b=unb64u(code.slice(4)); if(b.length<12) throw new Error("short");
  const body=b.slice(0,-2), c=(b[b.length-2]<<8)|b[b.length-1]; if(ck16(body)!==c) throw new Error("checksum");
  const p={i:0}; if(body[p.i++]!==1) throw new Error("version");
  const nl=body[p.i++]; const name=new TextDecoder().decode(body.slice(p.i,p.i+nl)).trim(); p.i+=nl;
  const day=readVar(body,p), xp=readVar(body,p), known=readVar(body,p);
  const k=[], l=[]; for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); k.push(v); }
  for(let i=0;i<TOPICS.length;i++){ const v=body[p.i++]; if(v===undefined||v>100) throw new Error("bad"); l.push(v); }
  const acc=body[p.i++], streak=readVar(body,p), best=readVar(body,p), bm=readVar(body,p), qs=readVar(body,p), act=readVar(body,p);
  if(p.i!==body.length) throw new Error("length");
  const d=new Date(2026,0,1); d.setDate(d.getDate()+day);
  let last=-1; for(let i=0;i<14;i++) if(Math.floor(act/Math.pow(2,i))%2){ last=i; break; }
  return {name:name||"(no name)", date:ymd(d), xp, level:lvlFor(xp), known, k, l, acc, streak, best, bosses:popcount(bm), qs, act14:popcount(act), act7:popcount(act%128), lastDaysAgo:last};
}

const RACE_LEN=15, RACE_SQ={3:2,6:-2,9:2,12:-2};   // 🪜 +2, 🐍 −2

      <div class="box"><h3>Game</h3>

      <button class="btn proj-go" id="pGo" ${P.sel.length?"":"disabled"}>Start the game</button>
      <p class="muted" style="text-align:center">Keys: <b>Space</b> reveal / next · <b>1–6</b> give a team the point · nothing here is saved or affects students' XP.</p>
    </div></div>`;
  tp.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; P.sel=P.sel.includes(k)?P.sel.filter(x=>x!==k):[...P.sel,k]; projSetup(); });
  $("#pMock").onclick=()=>{ P.sel=[...MOCK_TOPICS]; projSetup(); };

  tp.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ P.n=+b.dataset.n; projSetup(); });
  tp.querySelectorAll("[data-pmode]").forEach(b=>b.onclick=()=>{ P.mode=b.dataset.pmode; if(P.mode==="race" && P.n<20) P.n=20; projSetup(); });
  tp.querySelectorAll("[data-secs]").forEach(b=>b.onclick=()=>{ P.secs=+b.dataset.secs; projSetup(); });
  $("#pFull").onclick=projFull; $("#pExit").onclick=()=>{ clearInterval(P.timer); if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };

function projFull(){ const el=document.documentElement; if(!document.fullscreenElement) el.requestFullscreen && el.requestFullscreen().catch(()=>{}); else document.exitFullscreen().catch(()=>{}); }
function projScore(){ if(P.mode==="race") return projTrack(); return `<div class="proj-scores">${P.teams.map((t,i)=>`<button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b><span class="pts">${P.scores[i]}</span></button>`).join("")}</div>`; }
function projQ(){
  clearInterval(P.timer); P.revealed=false; P.awarded=new Set();
  const d=P.items[P.i], t=TMAP[d.t];
  P.opts = d.wrong ? mcFor(d, rngFrom("proj-"+d.id+"-"+P.i)) : null;
  $("#teacherApp").innerHTML=`<div class="proj play" style="--c:${t.c}"><div class="proj-bar"><b>Question ${P.i+1} of ${P.items.length}</b><span class="proj-topic">${esc(t.name)}</span><span class="spacer"></span><span class="proj-time" id="pTime"></span><button class="btn ghost" id="pFull">⛶</button><button class="btn ghost" id="pEnd">End</button></div>
    ${P.secs?`<div class="timebar" id="ptb"><i id="ptbFill"></i></div>`:""}
    <div class="proj-card">${d.sc?`<div class="proj-sc">${esc(d.sc)}</div>`:""}<div class="proj-q">${esc(d.q)}</div>

      <div class="proj-a" id="pAns" hidden><div class="tag">Answer</div><div class="a">${P.opts?esc(P.opts.opts[P.opts.correct]):fmtAnswer(d.a,d.id)}</div>${whyHTML(d)}</div></div>
    <div class="proj-actions"><button class="btn proj-go" id="pReveal">Reveal answer <kbd>Space</kbd></button></div>
    ${projScore()}</div>`;

function projTick(){
  const left=P.end-Date.now(), f=$("#ptbFill"), tm=$("#pTime"); if(!f){ clearInterval(P.timer); return; }
  f.style.width=Math.max(0,left/(P.secs*1000)*100)+"%"; $("#ptb").classList.toggle("low", left<5000);
  tm.textContent=Math.max(0,Math.ceil(left/1000))+"s";
  if(left<=0){ clearInterval(P.timer); tm.textContent="Time!"; sfx("no"); }
}
function wireProj(){
  $("#pFull").onclick=projFull;
  $("#pEnd").onclick=projEnd;
  const r=$("#pReveal"); if(r) r.onclick=projReveal;
  document.querySelectorAll("[data-award]").forEach(b=>b.onclick=()=>projAward(+b.dataset.award));
  const n=$("#pNext"); if(n) n.onclick=projNext;
  const nb=$("#pNobody"); if(nb) nb.onclick=projNext;
}
function projReveal(){
  if(P.revealed) return; P.revealed=true; clearInterval(P.timer);
  $("#pAns").hidden=false; sfx("badge");
  if(P.opts){ document.querySelectorAll(".proj-opts li").forEach(li=>li.classList.add(+li.dataset.o===P.opts.correct?"right":"dim")); }
  document.querySelector(".proj-actions").innerHTML=`<button class="btn ghost" id="pNobody">Nobody got it</button><button class="btn proj-go" id="pNext">${P.i+1>=P.items.length?"See the winners":"Next question"} <kbd>Space</kbd></button>`;
  document.querySelector(".proj-scores").outerHTML=projScore();
  wireProj();
}
function projTrack(){
  const sq=n=>RACE_SQ[n]>0?"🪜":RACE_SQ[n]<0?"🐍":n===RACE_LEN?"🏁":"";
  return `<div class="proj-scores race">${P.teams.map((t,i)=>`<div class="race-lane"><button class="proj-team ${P.awarded.has(i)?"won":""}" data-award="${i}" ${P.revealed?"":"disabled"}><span class="k">${i+1}</span><b>${esc(t)}</b></button>
    <div class="race-track">${Array.from({length:RACE_LEN+1},(_,n)=>`<span class="race-sq ${n===RACE_LEN?"fin":""} ${RACE_SQ[n]>0?"up":RACE_SQ[n]<0?"down":""}">${P.pos[i]===n?`<i class="race-tok" style="--h:${i*57}">${i+1}</i>`:sq(n)}</span>`).join("")}</div></div>`).join("")}</div>`;
}
function projAward(i){
  if(!P.revealed || i>=P.teams.length) return;
  if(P.mode==="race"){
    if(P.awarded.has(i)){ P.awarded.delete(i); P.pos[i]=P.prev[i]; }
    else { P.awarded.add(i); P.prev[i]=P.pos[i]; let n=Math.min(RACE_LEN,P.pos[i]+1); const fx=RACE_SQ[n]||0; n=Math.max(0,Math.min(RACE_LEN,n+fx)); P.pos[i]=n; sfx(fx<0?"no":"ok"); confetti(fx>0?60:30); }
    P.scores=P.pos.slice(); document.querySelector(".proj-scores").outerHTML=projScore(); wireProj(); return;
  }
  if(P.awarded.has(i)){ P.awarded.delete(i); P.scores[i]--; } else { P.awarded.add(i); P.scores[i]++; sfx("ok"); confetti(40); }
  document.querySelector(".proj-scores").outerHTML=projScore(); wireProj();
}
function projNext(){ P.i++; if(P.i>=P.items.length || (P.mode==="race" && P.pos.some(x=>x>=RACE_LEN))) projEnd(); else projQ(); }
function projEnd(){
  clearInterval(P.timer);
  const order=P.teams.map((t,i)=>({t,s:P.scores[i]})).sort((a,b)=>b.s-a.s);
  const top=order[0]?order[0].s:0, winners=order.filter(o=>o.s===top);
  const pod=[order[1],order[0],order[2]];

    <div class="podium">${pod.map((o,j)=>o?`<div class="pod p${[2,1,3][j]}"><b>${esc(o.t)}</b><span>${P.mode==="race"?(o.s>=RACE_LEN?"🏁 Finished":"Square "+o.s):`${o.s} pt${o.s===1?"":"s"}`}</span><div class="block">${[2,1,3][j]}</div></div>`:"<div></div>").join("")}</div>
    ${order.length>3?`<p class="muted" style="text-align:center">${order.slice(3).map((o,j)=>`${j+4}. ${esc(o.t)} (${o.s})`).join(" · ")}</p>`:""}
    <div class="proj-actions"><button class="btn proj-go" id="pAgain">Play again</button><button class="btn ghost" id="pSetup">Change settings</button><button class="btn ghost" id="pExit">Back to teacher tools</button></div></div>`;
  sfx("lvl"); confetti(260);
  $("#pFull").onclick=projFull;
  $("#pAgain").onclick=()=>{ const s=new Set(P.sel); P.items=shuffle(DATA.filter(d=>s.has(d.t))).slice(0,P.n); P.i=0; P.scores=P.teams.map(()=>0); P.pos=P.teams.map(()=>0); projQ(); };
  $("#pSetup").onclick=projSetup;
  $("#pExit").onclick=()=>{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); tMain(); };
}
document.addEventListener("keydown",e=>{
