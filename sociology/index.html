function selectTopics(keys){ store.sel=[...keys]; save(); renderChips(); topicsChanged(); }
function renderPlan(){
  const el=$("#plan"); if(!el || TEACHER) return;
  const t=today();
  if(!G.plan || G.plan.d!==t) G.plan={d:t, weak:weakestTopic(), done:false};
  const next=EXAMS.find(x=>x.d>=t), weak=G.plan.weak;
  let count;
  if(!next) count = EXAMS.length ? `<span>🎓 Exams are done. You smashed it, good luck with results!</span>` : `<span>📚 Little and often: ten minutes a day adds up to a lot by exam time.</span>`;
  else { const days=dayNum(next.d)-dayNum(t);
    count = days===0 ? `<span>🍀 <b>Today: ${esc(next.name)}.</b> Good luck!</span>`
      : `<span><b class="plan-days">${next.mock?"🎯":"⏳"} ${days}</b> day${days===1?"":"s"} to your <b>${esc(next.name)}</b> <span class="muted">(${niceDate(next.d)})</span></span>`;
    if(next.mock) count+=`<button class="btn ghost plan-btn" id="planMock">Revise mock topics</button>`;
  }
  const dueAll=DATA.filter(d=>isDue(d.id)).length, dd=G.daily[t], weakN=(G.tday&&G.tday.d===t&&G.tday.c[weak])||0;
  const tasks=[
    {id:"planDue", done:dueAll===0, txt: dueAll? `Clear today's ${dueAll} due review${dueAll===1?"":"s"}` : "Due reviews all done"},
    {id:"planDaily", done:!!(dd&&dd.done), txt:"Play the Daily 10"},
    {id:"planWeak", done:weakN>=10, txt:`10 cards on ${esc(TMAP[weak].name)} <span class="muted">(${Math.min(weakN,10)}/10)</span>`},
  ];
  const all=tasks.every(x=>x.done);
  if(all && !G.plan.done){ G.plan.done=true; G.st.plans=(G.st.plans||0)+1; save();
    setTimeout(()=>{ toast("🗒️",`Today's plan complete! +${PLAN_BONUS} XP`,"See you tomorrow."); confetti(160); sfx("badge"); addXP(PLAN_BONUS,false); checkBadges(); save(); },600); }
  el.innerHTML=`<div class="plan-count">${count}</div>
    <div class="plan-tasks"><b class="plan-h">Today's plan</b>${tasks.map(x=>`<button class="task ${x.done?"done":""}" id="${x.id}" ${x.done&&x.id==="planDaily"?"disabled":""}><span class="tick">${x.done?"✅":"⬜"}</span><span>${x.txt}</span></button>`).join("")}
    <span class="plan-bonus ${all?"got":""}">${all?`✓ +${PLAN_BONUS} XP earned`:`All 3 = +${PLAN_BONUS} XP`}</span></div>`;
  const m=$("#planMock"); if(m) m.onclick=()=>{ selectTopics(MOCK_TOPICS); toast("🎯","Mock topics selected","All topics."); };
  $("#planDue").onclick=()=>{ if(!dueAll) return; selectTopics(TOPICS.map(x=>x.key)); goTab("cards"); setFilter("due"); };
  $("#planDaily").onclick=()=>{ goTab("arcade"); startArc("daily"); };
  $("#planWeak").onclick=()=>{ selectTopics([weak]); goTab("cards"); setFilter("notknown"); $("#cardArea").scrollIntoView({behavior:reduced()?"auto":"smooth", block:"center"}); };
}
$("#mockTopics").onclick=()=>selectTopics(MOCK_TOPICS);
if(!mockPeriod()) $("#mockTopics").hidden=true;

/* ================= 9-MARK EXTENDED ANSWER PRACTICE (content) =================
   Department structure: describe (4 marks: a study = aim, method, results, conclusion; a theory = four key points),
   then three TDEE paragraphs (5 marks): Term, Define, Evidence, Explain. GRAVE for studies, SPACER for theories.
   tdee entries are [Term, Define, Evidence, Explain]. */
const EXT = [
 // ---------- FAMILIES ----------
 {id:"f1", t:"Families", q:"Discuss how far sociologists would agree that the nuclear family is a beneficial institution.",
  model:"The nuclear family is a family of two parents and their dependent children living together. Functionalists see it as beneficial for individuals and society, but Marxists and feminists argue it mainly benefits capitalism or men.\n\nFunctionalists would strongly agree. Murdock studied 250 societies and argued the nuclear family is a universal institution performing four vital functions: sexual, reproductive, economic and educational. Parsons added that it carries out primary socialisation, teaching children society's shared norms and values, and stabilises adult personalities like a 'warm bath'. This suggests the nuclear family benefits both individuals and society by creating stable, well-socialised members. However, critics argue this view is outdated and ignores the darker side of family life, such as domestic violence and child abuse, as well as the growth of family diversity identified by the Rapoports.\n\nMarxists would disagree. Zaretsky argues the family benefits capitalism rather than everyone: women's unpaid domestic labour supports the workforce for free, the family reproduces the next generation of workers, the bourgeoisie pass on wealth through inheritance, and the family acts as a unit of consumption buying capitalism's products. This means the family maintains class inequality rather than benefiting all. However, functionalists would argue Marxists ignore the emotional support and positive functions families provide, and most people say they are happy with family life.\n\nFeminists such as Delphy and Leonard argue the nuclear family is patriarchal. Men exploit women's unpaid labour, sit at the top of the family hierarchy and make the important decisions. Oakley found housewives worked on average 77 hours a week and 70% were dissatisfied, and Duncombe and Marsden argue women now work a triple shift. This shows the family benefits men more than women. However, liberal feminists would point out that roles are becoming more equal, supporting Willmott and Young's idea of the symmetrical family.\n\nIn conclusion, functionalists would agree that the nuclear family is beneficial, but conflict theorists show these benefits are not shared equally. Overall, sociologists would only partly agree: the family can benefit individuals, but it can also reproduce class and gender inequality.",
  ao:{AO1:["Accurate definition of the nuclear family","Murdock's four functions and Parsons' two functions","Zaretsky's ways the family serves capitalism","Delphy and Leonard / Oakley / triple shift"],
      AO2:["Applies each perspective directly to whether the family is 'beneficial'","Uses evidence (250 societies, 77 hours, 70% dissatisfied) to support points"],
      AO3:["Evaluates functionalism (dark side, diversity)","Evaluates Marxism and feminism (positive functions, symmetrical family)","Clear conclusion saying how far sociologists agree"]}},
 {id:"f2", t:"Families", q:"Discuss how far sociologists would agree that the changing social position of women is the main reason for the rise in divorce over the past 50 years.",
  model:"Divorce is the legal ending of a marriage. Divorce rose sharply after 1971, and sociologists offer several explanations, including women's changing position, changes in the law, secularisation and changing attitudes.\n\nMany sociologists, especially feminists, would agree that women's changing position is the main reason. More women are now in paid employment, giving them financial independence, so they no longer have to stay in unhappy marriages for economic security. Women file most divorce petitions, which suggests they are more willing to end marriages that don't meet their expectations of equality. Feminists such as Oakley argue the conventional family is patriarchal, so rising divorce may show women rejecting this. However, financial independence alone does not explain why the divorce rate rose so quickly after a single point in time.\n\nOthers argue changes in the law were more important. The Divorce Reform Act 1969 made 'irretrievable breakdown' the only ground for divorce, so couples no longer had to prove adultery or cruelty, and legal aid from 1949 made divorce affordable. More recently, no-fault divorce in 2022 made the process even easier. This explains the sudden jumps in divorce after new laws. However, laws only make divorce possible: they don't explain why people want to divorce, so they work alongside other factors.\n\nSecularisation and changing attitudes also matter. As religion has declined, fewer people see divorce as morally wrong, and the stigma attached to divorce has fallen. The media's focus on romantic love may also raise expectations of marriage, so more marriages fail to meet them. Functionalists even see divorce as positive, as it ends dysfunctional marriages and allows people to remarry. However, these explanations are hard to measure, and religion still matters to some groups.\n\nIn conclusion, the changing position of women is a very important reason for rising divorce, but most sociologists would argue it works together with legal change, secularisation and changing attitudes. Sociologists would therefore only partly agree that it is the main reason.",
  ao:{AO1:["Women's employment and financial independence","Divorce law changes (1949, 1969, 2022)","Secularisation, attitudes and media influence"],
      AO2:["Links each factor to the rise in divorce","Uses facts such as women filing most petitions"],
      AO3:["Evaluates whether each factor alone explains the rise","Considers functionalist and feminist views of divorce","Reaches a clear judgement on 'main reason'"]}},
 {id:"f3", t:"Families", q:"Discuss how far sociologists would agree that conjugal roles have become more equal.",
  model:"Conjugal roles are the domestic roles of married or cohabiting partners. Bott distinguished between segregated roles, with a clear division of labour, and joint roles, where tasks and leisure are shared.\n\nWillmott and Young, functionalists, would agree. Using historical research and surveys of nearly 2,000 people in London, they argued the family had become symmetrical: husbands and wives still did different tasks but made similar contributions, sharing chores, decisions and leisure time at home. Through stratified diffusion, they predicted these changes would spread from the middle class to the working class. British Social Attitudes data supports changing attitudes: agreement that 'a man's job is to earn money and a woman's is to look after the home' fell from 28% in 1989 to 13% in 2012. However, attitudes are not the same as behaviour.\n\nFeminists would disagree. Oakley criticised Willmott and Young for counting a husband who helped once a week as sharing, and found housewives worked 77 hours a week. Scott and Clery (2013) found that although attitudes had changed, women still did most of the laundry and housework, working a double shift. Duncombe and Marsden argue women now work a triple shift of paid work, housework and emotional work. This shows inequality continues even when women are in paid work.\n\nPower and decision-making also remain unequal. Edgell found that men made the important decisions, such as moving house, while women made minor ones, and Pahl found money management reflects who earns more. However, Pahl also found more financial independence among younger couples and where women worked full time, suggesting some change.\n\nIn conclusion, there is evidence that conjugal roles have become more equal in attitudes and in some couples, as Willmott and Young suggest. But feminist research shows women still do most domestic work and men hold more power. Sociologists would therefore only partly agree.",
  ao:{AO1:["Bott's segregated and joint roles","Willmott and Young's symmetrical family and stratified diffusion","Oakley, Scott and Clery, triple shift, Edgell, Pahl"],
      AO2:["Uses statistics (28% to 13%) and findings to address 'more equal'","Distinguishes attitudes from behaviour"],
      AO3:["Evaluates Willmott and Young using Oakley","Weighs evidence of change against continuing inequality","Clear conclusion"]}},
 // ---------- EDUCATION ----------
 {id:"e1", t:"Education", q:"Discuss how far sociologists would agree that the main function of education is to create social cohesion.",
  model:"Social cohesion is a sense of belonging to wider society, where people are bound together by shared values. Functionalists see this as education's main role, while Marxists argue education mainly serves the ruling class.\n\nFunctionalists would agree. Durkheim argued the main function of education is to pass on society's norms and values, making society a united whole. Teaching subjects like history gives pupils a shared sense of identity and links the individual to wider society, while learning to cooperate at school prepares them for adult life. Parsons saw school as a bridge between the family and wider society, where pupils are judged by universalistic standards that apply to everyone. However, critics argue that an ethnocentric curriculum may exclude minority ethnic pupils, so education may not create cohesion for everyone.\n\nParsons also highlighted other functions, such as role allocation: education sorts people into the jobs that suit their talents through a meritocratic system. This suggests cohesion is not the only function. However, Halsey's longitudinal study found service-class boys were 11 times more likely than working-class boys to go to university, which challenges the idea that education is meritocratic.\n\nMarxists would disagree. Bowles and Gintis argue that through the correspondence principle, school mirrors the workplace: the hidden curriculum teaches obedience and acceptance of hierarchy, producing a passive workforce for capitalism. The myth of meritocracy makes working-class pupils blame themselves for failure. Willis' study of 12 working-class 'lads' showed how a counter-school culture prepared them for manual jobs. However, Willis also shows that pupils don't passively accept the hidden curriculum, and Bowles and Gintis' study of American pupils is now dated.\n\nIn conclusion, functionalists would agree that education creates social cohesion, but Marxists argue its main function is to reproduce class inequality. Since evidence shows class still shapes achievement, sociologists would only partly agree.",
  ao:{AO1:["Durkheim on norms, values and social cohesion","Parsons: bridge, universalistic standards, role allocation","Bowles and Gintis, Willis, Halsey"],
      AO2:["Applies examples (history lessons, hidden curriculum) to the question","Uses Halsey's figures as evidence"],
      AO3:["Evaluates functionalism (ethnocentric curriculum, meritocracy myth)","Evaluates Marxism (Willis, dated study)","Clear conclusion"]}},
 {id:"e2", t:"Education", q:"Discuss how far sociologists would agree that social class is the biggest factor affecting educational achievement.",
  model:"Educational achievement varies by social class, gender and ethnicity. Many sociologists see class as the most important factor, but others highlight gender and ethnicity.\n\nMany sociologists would agree that class is the biggest factor. Material deprivation means working-class pupils may lack a quiet place to study, books or a computer, while pupils on free school meals are much less likely to get good GCSEs. Middle-class pupils benefit from cultural capital: the knowledge, values and experiences schools reward. Halsey found service-class boys were 11 times more likely to reach university, and Ball, Bowe and Gewirtz showed middle-class parents use their knowledge and money to get into the best schools. Marxists such as Bowles and Gintis argue education reproduces class inequality. However, this can overlook pupils who succeed despite disadvantage, and it may underestimate other factors.\n\nInternal factors also link to class. Ball found in Beachside Comprehensive that higher-class pupils were more likely to be placed in top bands, and teacher expectations shaped behaviour. Rosenthal and Jacobson's study shows the power of the self-fulfilling prophecy. This suggests class works through labelling inside school, not just home background.\n\nOthers would argue gender is now more important. Girls have outperformed boys at GCSE since the late 1980s, which liberal feminists link to changing ambitions (the 'genderquake') and equal opportunities policies. Some argue a crisis of masculinity leads boys to underachieve. However, the gender gap is smaller than the class gap, and middle-class boys still do better than working-class girls.\n\nEthnicity also matters: Chinese and Indian pupils achieve highest, while Black Caribbean pupils achieve less. Wright found teachers stereotyped Black Caribbean boys as troublemakers, showing labelling and institutional racism. However, Reid argued ethnicity often 'doubles up' with class disadvantage.\n\nIn conclusion, gender and ethnicity matter, but they often interact with class. Most sociologists would largely agree that social class is the biggest single factor in educational achievement.",
  ao:{AO1:["Material and cultural deprivation, cultural capital","Halsey, Ball, Ball Bowe and Gewirtz, Rosenthal and Jacobson","Gender (genderquake) and ethnicity (Wright, Reid)"],
      AO2:["Applies factors to differences in achievement between groups","Uses statistics and studies as evidence"],
      AO3:["Weighs class against gender and ethnicity","Recognises interaction between factors (doubling up)","Clear conclusion"]}},
 {id:"e3", t:"Education", q:"Discuss how far sociologists would agree that private schools create inequality in society.",
  model:"Private (independent) schools are funded by fees rather than the state. About 7% of UK children attend them, and sociologists disagree about whether they create inequality.\n\nMarxists would strongly agree. They argue private schools allow the wealthy to buy advantage and pass privilege to their children, reproducing class inequality. Private schools often have smaller classes and better resources, and in 2021 47.5% of private school students got A or A* at A-level compared to 25.3% in state schools. The Sutton Trust found that although only 7% attend private schools, former private pupils hold around 65% of top jobs. Pupils also gain cultural and social capital, such as networks that help them into elite careers. However, some of this difference reflects family background rather than the school itself.\n\nFunctionalists might disagree. They could argue private schools offer choice, high standards and competition, and help to allocate talented people into functionally important roles. Parents also have a right to spend their money on education. However, this assumes society is meritocratic, when access to private schools depends on wealth rather than talent.\n\nOthers argue the state system creates inequality too. Grammar schools select by ability, and Ball, Bowe and Gewirtz found marketisation meant middle-class parents could use their knowledge and money to get into the best state schools. This suggests inequality comes from class advantages throughout education, not just private schools. Also, many successful people attended state schools.\n\nIn conclusion, Marxists would argue private schools clearly create and reproduce inequality, and the evidence on top jobs supports this. However, inequality also exists within the state system. Sociologists would largely agree that private schools add to inequality, though they are not the only cause.",
  ao:{AO1:["Definition and 7% figure","Marxist view, cultural and social capital","Functionalist view, marketisation (Ball, Bowe and Gewirtz)"],
      AO2:["Uses statistics (47.5% vs 25.3%, 65% of top jobs)","Applies perspectives to private schools specifically"],
      AO3:["Evaluates whether results reflect school or background","Considers inequality within state schools","Clear conclusion"]}},
 // ---------- CRIME ----------
 {id:"c1", t:"Crime", q:"Discuss how far sociologists would agree that strain theory is the best explanation of crime in society today.",
  model:"Merton's strain theory argues that crime happens when people can't reach society's goals, such as the American Dream of wealth and success, through legitimate means. Other theories offer different explanations.\n\nFunctionalists such as Merton would agree. He argued society sets goals for everyone, but not everyone has equal access to legitimate means like education and good jobs. This creates strain and anomie, leading to five responses: conformity, innovation, ritualism, retreatism and rebellion. Innovation, such as theft or fraud to get money, explains why working-class people appear more in crime statistics. Reiner argues Merton also explains middle-class crime, because there is no limit to success. However, Valier argues not everyone shares the same goals, and the theory can't explain non-utilitarian crime such as vandalism.\n\nCohen's status frustration theory develops Merton. Working-class boys who fail at school feel frustrated by their low status and form delinquent subcultures where they gain status through non-utilitarian crime. This explains group crime and vandalism, which Merton doesn't. However, not all working-class boys who fail turn to crime, and it ignores girls.\n\nMarxists would argue capitalism is a better explanation. Crime results from poverty and the greed and materialism capitalism encourages, and laws protect the ruling class. Chambliss argues crime happens at all levels, including corporate crime, which strain theory largely ignores (Taylor, Walton and Young). However, Marxism doesn't explain why most poor people don't commit crime.\n\nInteractionists such as Becker argue crime is created by labelling: police target certain groups, and labels become a master status. Feminists like Heidensohn and Carlen explain gender differences that strain theory ignores.\n\nIn conclusion, strain theory explains utilitarian working-class crime well but can't explain non-utilitarian crime, crimes of the powerful or gender differences. Sociologists would only partly agree it is the best explanation.",
  ao:{AO1:["Merton's goals, means and five responses","Cohen's status frustration","Marxist, interactionist and feminist explanations"],
      AO2:["Applies responses to types of crime (innovation, vandalism, fraud)","Links to crime statistics"],
      AO3:["Criticisms (Valier; Taylor, Walton and Young; Reiner's defence)","Weighs alternatives","Clear conclusion"]}},
 {id:"c2", t:"Crime", q:"Discuss how far sociologists would agree that official statistics give an accurate picture of crime.",
  model:"Official crime statistics are government figures based on crimes recorded by the police. Sociologists disagree about how accurate they are.\n\nSome would argue they are useful. They have been collected since 1857, so they allow trends to be compared over time, and they are cheap and easy to access. Positivists value them as reliable quantitative data covering the whole country. They are fairly accurate for crimes that are almost always reported, such as car theft, because victims need to report for insurance. However, they still miss much crime.\n\nMany sociologists would disagree because of the dark figure of crime. The Crime Survey of England and Wales suggests only around 4 in 10 crimes are reported to the police. People may not report crimes because they see them as trivial, fear revenge or distrust the police. Domestic violence is heavily under-reported due to fear, shame and a desire for privacy. The police also don't record all reported crimes, for example when there is little evidence. However, victim surveys also have weaknesses: they exclude people not in private households and miss crimes without a direct victim.\n\nMarxists argue statistics are biased. Corporate and white-collar crimes are hard to detect and rarely prosecuted, so crimes of the powerful are under-represented, while police focus on working-class areas. Interactionists add that statistics reflect labelling: for example, Black people are about 4.5 times more likely to be stopped and searched, so more of their crime is recorded. This means statistics may tell us more about policing than about crime.\n\nFeminists point to the chivalry thesis, which suggests women may be treated more leniently, so female crime may be under-recorded.\n\nIn conclusion, official statistics are useful for trends but miss the dark figure and reflect biased policing. Most sociologists would disagree that they give an accurate picture, and recommend using them alongside victim surveys and self-report studies.",
  ao:{AO1:["Definition of official statistics and the dark figure","CSEW, reasons for non-reporting and non-recording","Marxist, interactionist and feminist critiques"],
      AO2:["Applies examples (car theft, domestic violence, stop and search)","Uses 4 in 10 and 4.5 times statistics"],
      AO3:["Evaluates strengths and weaknesses of statistics and alternatives","Considers theoretical perspectives","Clear conclusion"]}},
 {id:"c3", t:"Crime", q:"Discuss how far sociologists would agree that women commit less crime than men because they are more controlled.",
  model:"Official statistics show women commit much less crime than men: around 4% of the prison population are women, and in 2023 87% of those found guilty or cautioned for serious offences were men.\n\nFeminists such as Heidensohn would agree. She argues women's behaviour is marked by conformity because patriarchal society controls them more closely. At home, housework and childcare limit their time and movement, and partners may use violence or financial control. In public, fear of male violence and of losing their reputation restrict women. At work, they are often supervised by men. This reduces women's opportunities to offend. However, Heidensohn has been criticised for generalising about all women and not always supporting her ideas with strong evidence.\n\nCarlen offers a related explanation. She interviewed 39 convicted working-class women and found they are controlled through the promise of rewards: the class deal and the gender deal. When poverty, care or addiction blocked these rewards, crime became worth the risk. This suggests control explains conformity, and its breakdown explains female crime. However, the sample of 39 women is small and can't be generalised.\n\nOthers argue the statistics are misleading. The chivalry thesis suggests women are treated more leniently by the police and courts, so less female crime is recorded. However, the double deviance thesis argues some women, like Myra Hindley, are punished more harshly for breaking gender norms, which challenges this.\n\nDifferent socialisation could also explain the gap: girls may be taught to be caring and passive, while boys are encouraged to be tough and take risks. Functionalists might link this to expressive and instrumental roles.\n\nIn conclusion, control theory offers a strong explanation, supported by Heidensohn and Carlen, but socialisation and how the CJS treats women also matter. Sociologists would largely agree, but not completely.",
  ao:{AO1:["Statistics on gender and crime","Heidensohn's control at home, in public and at work","Carlen's class and gender deals; chivalry and double deviance"],
      AO2:["Applies control theory to explain the gender gap","Uses examples such as Myra Hindley"],
      AO3:["Criticisms of Heidensohn and Carlen","Alternative explanations (chivalry, socialisation)","Clear conclusion"]}},
 // ---------- STRATIFICATION ----------
 {id:"s1", t:"Stratification", q:"Discuss how far sociologists would agree that inequality is beneficial for society.",
  model:"Social inequality is the uneven distribution of resources and life chances. Functionalists see inequality as beneficial, while Marxists and feminists see it as harmful.\n\nFunctionalists Davis and Moore would agree. They argue every society must fill functionally important roles, such as doctors, which need exceptional talent and long, costly training. These roles must offer high pay and status to attract the most talented people. Inequality therefore ensures the best people do the most important jobs, which benefits everyone, and people accept it as fair because society is meritocratic. However, many vital jobs, such as nurses and refuse collectors, have low pay or status, while footballers and celebrities earn huge amounts.\n\nMarxists would disagree. Marx argued inequality comes from the bourgeoisie owning the means of production and exploiting the proletariat. Inequality benefits only the ruling class, who use ruling-class ideology to create false class consciousness so workers accept it. Today, the richest 10% own around 45% of wealth while the bottom half own about 9%, and Scambler argues a tiny global elite holds real power. However, Marx's prediction of revolution hasn't happened and a large middle class has grown.\n\nFeminists such as Walby argue inequality benefits men. Patriarchy operates through six structures, including paid employment (the gender pay gap of about 8.9%) and the household (the triple shift). This inequality harms women's life chances. However, Walby accepts that changes in the law have reduced patriarchy.\n\nInequality also affects life chances: the Marmot Review found people in lower socio-economic positions have worse health and die earlier, which suggests inequality harms society as a whole.\n\nIn conclusion, functionalists would agree that inequality is beneficial, but evidence on pay, wealth and health suggests inequality mainly benefits the powerful. Most sociologists would disagree.",
  ao:{AO1:["Davis and Moore: functionally important roles, meritocracy","Marx: bourgeoisie, proletariat, ideology","Walby's six structures; Marmot Review"],
      AO2:["Applies examples of jobs and pay","Uses wealth and pay gap statistics"],
      AO3:["Criticisms of Davis and Moore and of Marx","Considers life chances evidence","Clear conclusion"]}},
 {id:"s2", t:"Stratification", q:"Discuss how far sociologists would agree that social class is the most important factor affecting life chances.",
  model:"Life chances are people's chances of achieving positive or negative outcomes, such as good health, education and income. Sociologists disagree about whether class, gender or ethnicity matters most.\n\nMarxists would agree that class is the most important. Marx argued society is divided into the bourgeoisie, who own the means of production, and the exploited proletariat. Class shapes access to education, health and jobs. The Marmot Review found people in higher socio-economic positions have better health and live longer, and Halsey showed service-class boys were far more likely to reach university. Weber also saw class as linked to market situation and life chances, though he added status and power. However, critics argue Marxism ignores other inequalities, such as gender and ethnicity.\n\nFeminists would argue gender is just as important. Walby identifies six structures of patriarchy, including paid employment and the household. Women face a gender pay gap of about 8.9%, and many work part-time because of childcare, as well as carrying the triple shift. This limits women's life chances whatever their class. However, Carlen shows class still shapes women's lives: working-class women face harsher conditions when the class deal fails.\n\nOthers highlight ethnicity. Black people are more likely to be stopped and searched and over-represented in prisons, and Li found some ethnic groups face disadvantage in employment while Indian and Chinese people do as well as white British peers. Interactionists like Becker show how labelling affects life chances. However, ethnic disadvantage often overlaps with class, as Reid's idea of 'doubling up' suggests.\n\nIntersectional feminists argue we must consider how these factors combine.\n\nIn conclusion, class remains a crucial factor affecting life chances, but gender and ethnicity also matter and interact with class. Sociologists would partly agree that class is the most important single factor.",
  ao:{AO1:["Definition of life chances","Marx and Weber on class; Marmot; Halsey","Walby, pay gap, ethnicity evidence (Li), intersectionality"],
      AO2:["Applies factors to health, education and income","Uses statistics as evidence"],
      AO3:["Evaluates Marxism (ignores gender/ethnicity)","Shows interaction between factors","Clear conclusion"]}},
 {id:"s3", t:"Stratification", q:"Discuss how far sociologists would agree that poverty is caused by the behaviour of the poor.",
  model:"Poverty can be absolute (lacking the minimum needed to survive) or relative (falling well below the normal standard of living). Explanations divide into individual (cultural) and structural accounts.\n\nThe New Right would agree. Murray argues generous welfare benefits create a culture of dependency and an underclass who don't work, have children outside marriage and are linked to crime. Lewis's culture of poverty suggests the poor develop values such as fatalism and living for the present, which are passed down generations, creating a cycle of deprivation. This places responsibility on the behaviour of the poor. However, critics argue this blames and scapegoats the poor and fails to explain why people fall into poverty in the first place.\n\nStructural explanations would disagree. Townsend found over 22% of people were living in relative deprivation, far more than the state measure suggested, showing poverty is widespread rather than limited to a small group with bad values. Butler and Watt link rising poverty to a growing pay gap, tax changes that benefit the rich and more low-income groups like pensioners. Marxists argue capitalism creates poverty through low wages and keeping a pool of cheap labour, so poverty benefits the bourgeoisie. However, structural theories may underestimate individual choices.\n\nFeminists highlight that women are more likely to be poor because of the gender pay gap, part-time work, caring responsibilities and lone parenthood, which are structural rather than behavioural causes.\n\nIn conclusion, the New Right would agree that poverty is caused by the behaviour of the poor, but evidence of widespread relative deprivation and structural inequality suggests poverty mainly results from how society is organised. Most sociologists would disagree.",
  ao:{AO1:["Absolute and relative poverty","Murray's underclass and Lewis's culture of poverty","Townsend, Butler and Watt, Marxist and feminist views"],
      AO2:["Applies explanations to the question of behaviour","Uses Townsend's 22% finding"],
      AO3:["Criticises cultural explanations (blaming the poor)","Evaluates structural explanations","Clear conclusion"]}},
 // ---------- THEORIES / KEY CONCEPTS ----------
 {id:"t1", t:"Theories", q:"Discuss how far sociologists would agree that society is generally harmonious and free from conflict.",
  model:"Sociologists divide into consensus approaches, which see society as based on shared values, and conflict approaches, which see society as divided.\n\nFunctionalists such as Durkheim would agree. They use the organic analogy, comparing society to a body in which institutions like the family, education and religion act as organs, each performing functions that keep society stable. Value consensus, taught through socialisation, binds people together. Durkheim even argued crime can be functional because punishment reaffirms shared values and creates social cohesion. However, critics argue functionalism ignores the negative effects of institutions, such as religious conflict and the harm crime causes victims.\n\nMarxists would disagree. Marx argued capitalist society is based on class conflict between the bourgeoisie, who own the means of production, and the proletariat, who are exploited. Any apparent harmony is the result of ruling-class ideology and false class consciousness. Bowles and Gintis argue schools teach obedience to prepare a passive workforce. However, the revolution Marx predicted hasn't happened, which may suggest more consensus than Marxists claim.\n\nFeminists would also disagree. They see society as patriarchal, with conflict between men and women. Walby identifies six structures, including paid employment and male violence, through which men dominate women. Radical feminists argue patriarchy runs through all institutions, especially the family. However, liberal feminists argue progress such as the Equal Pay Act shows conflict can be reduced through reform.\n\nInteractionists focus on small-scale interactions rather than whether society is harmonious, showing how labelling can create conflict between groups such as the police and young people.\n\nIn conclusion, functionalists would agree that society is generally harmonious, but Marxists and feminists provide strong evidence of conflict based on class and gender. Most sociologists would disagree with the statement.",
  ao:{AO1:["Consensus vs conflict","Durkheim, organic analogy, value consensus","Marx, ideology; Walby, types of feminism"],
      AO2:["Applies perspectives to whether society is harmonious","Uses examples (schools, crime, Equal Pay Act)"],
      AO3:["Evaluates functionalism, Marxism and feminism","Brings in interactionism","Clear conclusion"]}},
 {id:"t2", t:"Theories", q:"Discuss how far sociologists would agree that human behaviour is shaped by social structures.",
  model:"Structural approaches argue that social structures such as the family, education and the economy shape behaviour. Social action approaches argue individuals actively create their social world through interaction.\n\nFunctionalists would agree. Durkheim argued education teaches shared norms and values, and Parsons argued the family carries out primary socialisation, shaping children's personalities. Behaviour is shaped by institutions that keep society stable. However, this is deterministic: it suggests people are passive and can't explain why individuals behave differently.\n\nMarxists also agree, but see structures as shaping behaviour in the interests of the ruling class. The capitalist economy determines life chances, and institutions like education pass on ruling-class ideology so that workers accept their position. Bowles and Gintis' correspondence principle shows how school shapes behaviour for work. However, Willis' lads actively rebelled, suggesting people are not simply shaped by structures.\n\nFeminists argue patriarchal structures shape behaviour: canalisation and gender socialisation in the family teach girls and boys different roles, and Walby shows how six structures limit women's choices. However, changing gender roles suggest people can resist these pressures.\n\nInteractionists would disagree. They argue behaviour comes from the meanings people give to situations. Becker shows that labels applied in interaction, rather than structures, can create a self-fulfilling prophecy and deviant career. However, critics argue interactionism ignores how wider structures such as class and racism affect who gets labelled.\n\nIn conclusion, most perspectives agree social structures shape behaviour, though they disagree about whether this is positive. Interactionists show individuals also have agency. Sociologists would largely agree, but recognise that behaviour is shaped by both structure and action.",
  ao:{AO1:["Structural vs social action approaches","Functionalist, Marxist and feminist examples","Interactionism, labelling (Becker)"],
      AO2:["Applies examples of socialisation and institutions to behaviour","Uses studies (Willis, Bowles and Gintis)"],
      AO3:["Criticises determinism","Uses Willis and interactionism as counter-evidence","Clear conclusion"]}},
 {id:"k1", t:"Key concepts", q:"Discuss how far sociologists would agree that gender is a social construct.",
  model:"Sex refers to biological differences between males and females, while gender refers to the social expectations attached to masculinity and femininity. A social construct is something created by society rather than nature.\n\nMany sociologists would agree. Gender norms vary between cultures and over time: in some cultures men wear long, flowing garments, and pink was once seen as a masculine colour in North America. If gender were purely biological, it would not vary like this. Gender is learned through socialisation: canalisation means parents channel children into gender-'appropriate' toys and activities, and the media present stereotyped role models. This suggests gender is created by society. However, some argue that biological differences, such as hormones, may also influence behaviour.\n\nFeminists would strongly agree. They argue gender roles have been constructed to benefit men. Oakley showed how women are expected to take on the domestic role, and Walby argues patriarchal structures such as culture and paid employment reinforce gender roles. Liberal feminists point to changing gender roles, such as more women in paid work, as evidence that gender can change because it is social. However, Scott and Clery found behaviour changes more slowly than attitudes.\n\nFunctionalists such as Parsons might partly disagree, seeing the expressive role as women's 'natural' role, linked to biology and childbearing. Murdock argued the sexual division of labour arose from biological differences in strength. However, these views are criticised as outdated and as justifying inequality.\n\nIn conclusion, the variation of gender norms across time and cultures, and the role of socialisation, provide strong evidence that gender is a social construct. Most sociologists would agree, although some accept biology may play a small part.",
  ao:{AO1:["Sex vs gender; social construct","Socialisation, canalisation, media","Feminist and functionalist views"],

      AO3:["Considers biological arguments","Evaluates functionalism","Clear conclusion"]}},

function extModelHTML(x){
  if(!x.tdee) return x.model.split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("");
  const lab=["T","D","E","E"], cls=["td-t","td-d","td-e","td-x"];
  return `<p class="ext-sec">Description <span>(AO1)</span></p><p>${esc(x.desc)}</p>`
    + (x.apply?`<p class="ext-sec">Application <span>(AO2)</span></p><p>${esc(x.apply)}</p>`:"")
    + `<p class="ext-sec">Evaluation <span>(AO3) · three TDEE paragraphs</span></p>`
    + x.tdee.map((par,pi)=>{ const L=(EXT_TAGS[x.id]||"")[pi], fw=x.kind==="study"?"GRAVE":"SPACER", nm=L&&(x.kind==="study"?GRAVE_N:SPACER_N)[L];
        return (nm?`<span class="fw-tag">${fw}: <b>${L}</b> · ${nm}</span>`:"")+`<p class="tdeep">${par.map((s,i)=>`<span class="${cls[i]}"><b class="tdl">${lab[i]}</b>${esc(s)}</span>`).join(" ")}</p>`; }).join("")
    + `<p class="td-key"><span class="td-t"><b class="tdl">T</b>Term</span> <span class="td-d"><b class="tdl">D</b>Define</span> <span class="td-e"><b class="tdl">E</b>Evidence</span> <span class="td-x"><b class="tdl">E</b>Explain</span></p>`;
}

const pm = {phase:"setup", items:[], i:0, shown:false, res:[], topics:null, n:10, kind:"mix"};
function pmPickTopics(){ const W=weakData().filter(w=>w.t.key!=="Exam skills"); const started=W.filter(w=>w.seen).sort((a,b)=>a.strength-b.strength); return (started.length?started:W).slice(0,3).map(w=>w.t.key); }
function pmBuild(){
  const topics=pm.topics, prio=d=>status(d.id)==="l"?0:G.mistakes[d.id]!==undefined?0:isDue(d.id)?1:status(d.id)===""?2:3;
  let qs=[];
  if(pm.kind!=="terms") qs=qs.concat(DATA.filter(d=>topics.includes(d.t) && d.id<5000 && d.a.length<=160).map(d=>({id:d.id, t:d.t, q:d.q, a:d.a, kind:"q"})));
  if(pm.kind!=="qs") qs=qs.concat(TERMS.filter(x=>topics.includes(x.t)).map(x=>({id:x.id, t:x.t, q:`What is the key term for this? “${x.def}”`, a:x.term, kind:"term"})));
  qs=shuffle(qs).sort((a,b)=>prio(a)-prio(b));
  const seen=new Set(); pm.items=qs.filter(x=>!seen.has(x.id) && seen.add(x.id)).slice(0,pm.n);
}
function renderParent(){
  const area=$("#parentArea");
  if(pm.phase==="setup"){
    if(!pm.topics) pm.topics=pmPickTopics();
    area.innerHTML=`<div class="box parent-box"><h3 style="margin-top:0">👪 Parent mode <small>Test your child, no sociology knowledge needed</small></h3>
      <ol class="parent-how"><li>Read each question out loud.</li><li>Let your child answer in their own words.</li><li>Tap <b>Show answer</b> and compare. Close enough counts: it doesn't need to be word for word.</li><li>Tap how they did. Their progress and XP update automatically.</li></ol>
      <h4>Topics <small class="muted">${!pm.topics.length?"Pick at least one":weakData().some(w=>w.seen)?"We've picked their weakest topics. Change them if you like.":"Pick the topics they're revising."}</small></h4>
      <div class="parent-topics">${TOPICS.filter(t=>t.key!=="Exam skills").map(t=>`<button class="extf" style="--c:${t.c}" aria-pressed="${pm.topics.includes(t.key)}" data-pt="${esc(t.key)}">${esc(t.name)}</button>`).join("")}</div>
      <h4>Type of question</h4>
      <div class="seg" role="group" aria-label="Type of question">${[["mix","A mix"],["qs","Questions"],["terms","Key terms"]].map(([k,l])=>`<button aria-pressed="${pm.kind===k}" data-pk="${k}">${l}</button>`).join("")}</div>
      <h4>How many?</h4>
      <div class="seg" role="group" aria-label="Number of questions">${[5,10,20].map(n=>`<button aria-pressed="${pm.n===n}" data-pn="${n}">${n} questions</button>`).join("")}</div>
      <div class="card-actions"><button class="btn" id="pmGo" ${pm.topics.length?"":"disabled"}>Start testing</button></div>
      <p class="muted" style="font-size:14px;margin:8px 0 0">Questions they find hardest come up first: ones they're still learning, have got wrong before, or are due to review. <a href="guide.html">Printable guide for parents</a>.</p></div>`;
    area.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{ const k=b.dataset.pt; pm.topics=pm.topics.includes(k)?pm.topics.filter(x=>x!==k):[...pm.topics,k]; renderParent(); });
    area.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{ pm.kind=b.dataset.pk; renderParent(); });
    area.querySelectorAll("[data-pn]").forEach(b=>b.onclick=()=>{ pm.n=+b.dataset.pn; renderParent(); });
    $("#pmGo").onclick=()=>{ pmBuild(); if(!pm.items.length) return toast("👪","No questions found for those topics","",true); pm.i=0; pm.res=[]; pm.shown=false; pm.phase="run"; resetCombo(); renderParent(); area.scrollIntoView({behavior:reduced()?"auto":"smooth"}); };
    return;
  }
  if(pm.phase==="run"){
    const d=pm.items[pm.i], t=TMAP[d.t];
    area.innerHTML=`<div class="arc-top"><span class="big">👪 Parent mode</span><span class="spacer"></span><span class="big">${pm.i+1}/${pm.items.length}</span></div>
      <div class="progressline"><i style="width:${pm.i/pm.items.length*100}%"></i></div>
      <div class="quiz-q parent-q" style="--c:${t.c}"><div class="tag">${esc(t.name)} <span class="muted">${d.kind==="term"?"Key term":"Question"} · read it out loud</span></div>
        <div class="q">${esc(d.q)}</div>
        ${pm.shown?`<div class="parent-ans"><span class="muted">Answer</span><b>${esc(d.a)}</b>${whyHTML(BY_ID[d.id])}</div>
          <p class="muted" style="margin:6px 0 10px;font-size:15px">How did they do?</p>
          <div class="parent-rate"><button class="btn good" data-pr="k">✅ Got it</button><button class="btn ghost" data-pr="h">🟨 Partly</button><button class="btn ghost" data-pr="l">❌ Not yet</button></div>`
        :`<div class="card-actions"><button class="btn" id="pmShow">Show answer</button></div>`}</div>
      <p style="text-align:right;margin-top:10px"><button class="linkbtn" id="pmStop">Finish early</button></p>`;
    const sh=$("#pmShow"); if(sh){ sh.onclick=()=>{ pm.shown=true; renderParent(); }; sh.focus({preventScroll:true}); }
    area.querySelectorAll("[data-pr]").forEach(b=>b.onclick=()=>pmRate(b.dataset.pr, b));
    $("#pmStop").onclick=()=>{ pm.phase="done"; renderParent(); };
    return;
  }
  // done
  const got=pm.res.filter(r=>r.r==="k").length, part=pm.res.filter(r=>r.r==="h").length, n=pm.res.length;
  const revisit=pm.res.filter(r=>r.r!=="k");
  const msg = !n ? "No questions answered this time." : got/n>=.8 ? "Brilliant! They really know this." : got/n>=.5 ? "Good effort. A few to go over again." : "These topics need more practice. Little and often is best.";
  if(n && !pm.claimed){ pm.claimed=true; const bonus=10+got*3; addXP(bonus,false); G.st.parent=(G.st.parent||0)+1; checkBadges(); save(); }
  area.innerHTML=`<div class="empty"><h3>👪 Parent quiz complete</h3><p class="score">${got}/${n}</p><p class="muted">${part?`${part} partly right · `:""}${msg}</p>
    <button class="btn" id="pmAgain">Test again</button> <button class="btn ghost" id="pmBack">Change topics</button></div>
    ${revisit.length?`<div class="box"><h3 style="margin-top:0">To go over together</h3><ul class="results">${revisit.map(r=>`<li class="no"><b>${esc(r.d.q)}</b><div class="ans">${esc(r.d.a)}</div>${whyHTML(BY_ID[r.d.id])}</li>`).join("")}</ul>
      <p class="muted" style="font-size:14px">These have been added to your child's "still learning" pile and their 🩹 Fix my mistakes list, so the site will bring them back.</p></div>`:""}`;
  $("#pmAgain").onclick=()=>{ pmBuild(); pm.i=0; pm.res=[]; pm.shown=false; pm.claimed=false; pm.phase="run"; renderParent(); };
  $("#pmBack").onclick=()=>{ pm.phase="setup"; pm.claimed=false; renderParent(); };
}
function pmRate(r, el){
  const d=pm.items[pm.i]; pm.res.push({d, r});
  const ok=r==="k";
  if(BY_ID[d.id]){ if(ok) mark(d.id,"k"); else if(status(d.id)!=="k" || r==="l") mark(d.id,"l"); trackMistake(d.id, ok); }
  answer({ok, el, mode:"cards", topic:d.t});
  pm.i++; pm.shown=false;
  if(pm.i>=pm.items.length){ pm.phase="done"; pm.claimed=false; }
  renderParent();
}

/* ================= PRINTABLE CERTIFICATES ================= */
const CERT_LEVELS = [5,10,20,30,40,50,60,70,80];
function certList(){
  const n=lvlFor(G.xp);
  const l=CERT_LEVELS.map(v=>({id:"L"+v, open:n>=v, title:`Level ${v}: ${rankFor(v)}`, need:`Reach level ${v}`}));
  l.push({id:"dungeon", open:!!G.badges.bossall, title:"Dungeon cleared: every boss defeated", need:"Defeat all 9 bosses"});
  G.certs=G.certs||{}; l.forEach(c=>{ if(c.open && !G.certs[c.id]) G.certs[c.id]=today(); c.date=G.certs[c.id]; });
  return l;
}
function certBoxHTML(){
  const l=certList(), got=l.filter(c=>c.open).length;
  return `<div class="box"><h3>🏅 Certificates <small>${got} of ${l.length} unlocked · print or save as PDF</small></h3>
    <div class="certs">${l.map(c=>`<button class="certbtn ${c.open?"":"locked"}" data-cert="${c.id}" ${c.open?"":"disabled"}><span class="ci">${c.open?"🏅":"🔒"}</span><b>${esc(c.title)}</b><span>${c.open?"Tap to view and print":esc(c.need)}</span></button>`).join("")}</div></div>`;
}
function openCert(id){
  const c=certList().find(x=>x.id===id); if(!c||!c.open) return;
  const o=document.createElement("div"); o.className="overlay cert-overlay";
  const draw=()=>`<div class="cert-tools"><label>Name on certificate <input id="certName" class="search" maxlength="24" value="${esc(G.name||"")}" placeholder="Type your name"></label><button class="btn" id="certPrint">🖨️ Print / save as PDF</button><button class="btn ghost" id="certClose">Close</button></div>
    <div class="cert"><div class="cert-in">
      <div class="cert-seal">⛲</div>
      <div class="cert-kick">Certificate of Achievement</div>
      <p class="cert-small">This is to certify that</p>
      <div class="cert-name" id="certNameOut">${esc(G.name||"Your name")}</div>
      <p class="cert-small">has achieved</p>
      <div class="cert-ach">${esc(c.title)}</div>
      <p class="cert-small">in <b>The Fount of Knowledge and Wisdom</b> · GCSE Sociology</p>
      <div class="cert-foot"><div><span class="cert-sig">${esc(new Date(c.date+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"}))}</span><span class="cert-line">Date</span></div><div><span class="cert-sig sig">&nbsp;</span><span class="cert-line">Teacher signature</span></div></div>
    </div></div>`;
  o.innerHTML=draw(); document.body.appendChild(o);
  const close=()=>{ o.remove(); document.body.classList.remove("printing-cert"); document.removeEventListener("keydown",k,true); };
  const k=e=>{ if(e.key==="Escape"){ e.stopPropagation(); close(); } };
  document.addEventListener("keydown",k,true);
  $("#certName").oninput=e=>{ G.name=e.target.value.trim().slice(0,24); save(); $("#certNameOut").textContent=G.name||"Your name"; };
  $("#certClose").onclick=close;
  o.onclick=e=>{ if(e.target===o) close(); };
  $("#certPrint").onclick=()=>{ if(!G.name){ $("#certName").focus(); return; } document.body.classList.add("printing-cert"); window.print(); setTimeout(()=>document.body.classList.remove("printing-cert"),500); };
  sfx("badge");
}

/* ================= DOUBLE XP EVENTS — edit dates here =================
   from/to: "MM-DD" repeats every year, "YYYY-MM-DD" is a one-off.
   mult = XP multiplier · scope:"boss" = boss battles only · topics = only these topics · gold = golden cards × as common.
   If two events overlap, the bigger multiplier wins (they don't stack). */
const EVENTS = [
  {id:"firstwknd", rule:"firstWeekend", mult:2,   banner:"⚡ Double XP weekend: everything earns 2× XP"},
  {id:"halloween", from:"10-25", to:"10-31", mult:2, scope:"boss", banner:"🎃 Halloween Boss Rush: 2× XP in boss battles"},
  {id:"advent",    from:"12-01", to:"12-24", gold:2, banner:"🎄 Advent: golden cards are twice as common"},
  {id:"newyear",   from:"01-01", to:"01-07", mult:1.5, banner:"🎆 New Year resolution week: 1.5× XP on everything"},
];
function eventActive(e, d=new Date()){
  if(e.rule==="firstWeekend"){ const day=d.getDay(), dt=d.getDate(); return (day===6 && dt<=7) || (day===0 && dt>=2 && dt<=8); }
  const s=ymd(d), md=s.slice(5);
  if(e.from.length===5) return e.from<=e.to ? (md>=e.from && md<=e.to) : (md>=e.from || md<=e.to);
  return s>=e.from && s<=e.to;
}
const activeEvents = (d) => EVENTS.filter(e=>eventActive(e,d));
function eventMult(topic, boss){ let m=1; activeEvents().forEach(e=>{ if(!e.mult) return; if(e.scope==="boss" && !boss) return; if(e.topics && !e.topics.includes(topic)) return; m=Math.max(m,e.mult); }); return m; }
function goldMult(){ return Math.max(1, ...activeEvents().map(e=>e.gold||1)); }
function eventUntil(e){ if(e.rule==="firstWeekend") return "until Sunday night"; const y=new Date().getFullYear(); const to=e.to.length===5?`${y}-${e.to}`:e.to; return "until "+niceDate(to); }
function renderEvents(){ const el=$("#evbar"); if(!el) return; const a=activeEvents(); el.hidden=!a.length;
  el.innerHTML=a.map(e=>`<span class="ev">${esc(e.banner)} <small>${eventUntil(e)}</small></span>`).join(""); }

function foundScroll(id){
  if(TEACHER) return; const s=SECRET_SCROLLS.find(x=>x.id===id); if(!s) return;
  if(document.querySelector(".scroll-overlay")) return;
  const first=!G.scrolls[id];
  if(first){ G.scrolls[id]=today(); save(); }
  showScroll(s, first);
  if(first){
    setTimeout(()=>{ addXP(30,false); toast("📜",`Secret scroll ${Object.keys(G.scrolls).length} of ${SECRET_SCROLLS.length} found`,"+30 XP"); },700);
    const sth=THEMES.find(t=>t.scroll===id); if(sth) setTimeout(()=>{ if(sealDone(sth.k)){ G.seals=G.seals||{}; G.seals[sth.k]=today(); save(); toast("🎨",`${sth.name} theme unlocked!`,"Switch it on in the Themes tab.",true); confetti(160,sth.sw); } else toast("🔒",`You found the ${sth.name} theme, but it's sealed`,`To break the seal: ${SEALS[sth.k].text}.`,true); },1600);
    if(SECRET_SCROLLS.every(x=>G.scrolls[x.id])){ G.flags.keeper=1; save(); setTimeout(()=>{ checkBadges(); toast("✦","Scholar Mode theme unlocked","Find it in the Themes tab."); confetti(200,["#E6C35C","#0D2A1E","#F6F0DC"]); },2200); }
  }
}
function showScroll(s, first){
  const blues=s.id==="blues", big=s.id==="konami";
  const o=document.createElement("div"); o.className="overlay scroll-overlay";
  o.innerHTML=`<div class="scroll ${blues?"blues":""}" role="dialog" aria-modal="true" aria-label="Secret scroll"><div class="scroll-rod"></div><div class="scroll-body">
    <div class="scroll-kick">${first?"📜 Secret scroll found!":"📜 Secret scroll"}</div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p>
    <button class="btn" id="scrollOk">Roll it up</button></div><div class="scroll-rod"></div></div>`;
  document.body.appendChild(o);

  const k=e=>{ if(e.key==="Tab") return; e.stopPropagation(); if(["Escape","Enter"," "].includes(e.key)){ e.preventDefault(); close(); } };
  document.addEventListener("keydown",k,true);

// easter-egg triggers
let keyBuf=[];
const KONAMI=["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
document.addEventListener("keydown",e=>{
  if(TEACHER || e.target.matches("input,textarea,select") || e.metaKey||e.ctrlKey||e.altKey || document.querySelector(".scroll-overlay") || arc.phase==="psychle") return;
  keyBuf.push(e.key.toLowerCase()); keyBuf=keyBuf.slice(-12);
  const s="|"+keyBuf.join("|"), ends=seq=>s.endsWith("|"+seq.join("|"));
  if(ends(KONAMI)) foundScroll("konami");
  else if(ends([..."marx"])) foundScroll("marx");
  else if(ends([..."durkheim"])) foundScroll("durkheim");
  else if(ends([..."weber"])) foundScroll("weber");
  else if(ends([..."becker"])) foundScroll("becker");
  else if(ends([..."martineau"])) foundScroll("martineau");
});
const tapper=(el, n, ms, fn)=>{ if(!el) return; let ts=[]; el.addEventListener("click",()=>{ const now=Date.now(); ts=ts.filter(x=>now-x<ms); ts.push(now); if(ts.length>=n){ ts=[]; fn(); } }); };

tapper($("#hudLvl"), 10, 4000, ()=>{ flag("ring"); setTimeout(()=>foundScroll("ring"),150); });

function markBackup(){ G.backupAt=today(); delete G.backupSnooze; save(); nudgeCheck(); }
function nudgeCheck(){
  const n=$("#nudge"); if(!n) return; if(TEACHER){ n.hidden=true; return; }
  const t=today(), since=G.backupAt ? dayNum(t)-dayNum(G.backupAt) : 999, snoozed=G.backupSnooze && dayNum(t)-dayNum(G.backupSnooze)<3;
  const due=(G.st.cards||0)>=40 && since>=7 && !snoozed;
  n.hidden=!due; if(!due){ n.innerHTML=""; return; }
  const pet=(G.pet&&G.pet.name)||"your revision rat";
  n.innerHTML=`<span class="nd-ico" aria-hidden="true">💾</span><span class="nd-txt"><b>${G.backupAt?`It's been ${since} days since your last backup.`:"You haven't backed up yet."}</b> Your level ${lvlFor(G.xp)} progress, badges and ${esc(pet)} only live in this browser. It takes 30 seconds.</span>
    <button class="btn" id="ndGo">Back up now</button><button class="linkbtn" id="ndLater">Not now</button>`;
  $("#ndGo").onclick=()=>{ goTab("trophies","save"); setTimeout(()=>{ const b=$("#saveCopy"); if(b){ b.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"}); b.focus({preventScroll:true}); } },60); };
  $("#ndLater").onclick=()=>{ G.backupSnooze=t; save(); nudgeCheck(); };
}

/* ================= WELCOME TOUR + WHAT'S NEW ================= */

  ["🗂️","Flashcards","<p>Pick your topics, then answer each card.</p><ul><li><b>Multiple choice</b>: press A–D or tap an answer.</li><li><b>🔤 Gap fill</b> and <b>✍️ Type it</b>: type your answer and it's marked for you. These earn <b>2× XP</b>.</li></ul><p>Cards you get wrong come back until you know them.</p>"],
  ["📝","Quiz","<p>Quick quizzes, 12-mark practice, <b>🧩 Exam skills</b> (2× XP) and full <b>mock papers</b> for Paper 1 and Paper 2.</p><p>Parents can test you too in <b>👪 Parent mode</b>.</p>"],
  ["🕹️","Arcade","<p>Boss battles, Sociodle, Swipe Sort, Which Study?, Study Matcher, Spot the Flaw and more.</p><p>Check the <b>Game of the day</b> for bonus XP.</p>"],
  ["🐀","Level up","<p>Every answer earns XP. Climb 80 levels, keep your 🔥 streak, collect badges and unlock themes.</p><p>Your revision rat, <b>Professor Squeaks</b>, grows as you revise and gets sleepy if you stay away.</p><p>Psst… there are secret scrolls hidden around the site. 📜</p>"],
  ["💾","Keep your progress safe","<p>Your progress is saved in <b>this browser only</b>. Nothing goes online.</p><p>Back it up in the <b>💾 Save</b> tab every week or so, especially before you change phone or clear your browser.</p><p>Good luck!</p>"],
];
// bump WHATS_NEW_V and edit WHATS_NEW when you add features; returning students see it once
const WHATS_NEW_V = 1;
const WHATS_NEW = ["🧠 GCSE Sociology: flashcards, quizzes, 12-mark practice, exam skills and mock papers","🕹️ Arcade games, boss battles and Sociodle","🎨 80 levels and loads of themes to unlock"];
function showTour(steps, onDone){
  let i=0; const o=document.createElement("div"); o.className="overlay";
  const close=()=>{ o.remove(); document.removeEventListener("keydown",kd,true); if(onDone) onDone(); };
  const draw=()=>{ const [ico,title,body]=steps[i], last=i===steps.length-1;
    o.innerHTML=`<div class="levelup tour" role="dialog" aria-modal="true" aria-labelledby="tourH"><div class="tour-ico" aria-hidden="true">${ico}</div><h3 id="tourH">${title}</h3>${body}
      ${steps.length>1?`<div class="tour-dots" aria-label="Step ${i+1} of ${steps.length}">${steps.map((_,j)=>`<i class="${j===i?"on":""}"></i>`).join("")}</div>`:""}
      <div class="tour-nav">${i>0?`<button class="btn ghost" id="tourBack">Back</button>`:`<button class="linkbtn" id="tourSkip">${steps.length>1?"Skip tour":""}</button>`}<button class="btn" id="tourNext">${last?"Let's go!":"Next"}</button></div></div>`;
    $("#tourNext").onclick=()=>{ last ? close() : (i++, draw()); };
    const b=$("#tourBack"); if(b) b.onclick=()=>{ i--; draw(); };
    const s=$("#tourSkip"); if(s) s.onclick=close;
    $("#tourNext").focus(); };
  const kd=e=>{ if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); close(); } else if(e.key==="ArrowRight"){ e.stopPropagation(); $("#tourNext").click(); } else if(e.key==="ArrowLeft" && i>0){ e.stopPropagation(); i--; draw(); } else if(e.key!=="Tab"&&e.key!=="Enter"&&e.key!==" ") e.stopPropagation(); };
  document.addEventListener("keydown",kd,true);
  o.onclick=e=>{ if(e.target===o) close(); };
  document.body.appendChild(o); draw();
}
function welcomeCheck(){
  if(TEACHER || /(^|[?&#])parent\b/i.test(location.search+location.hash)) return;
  const fresh=!G.xp && !(G.st.cards||0);
  if(!G.toured && fresh){ G.toured=1; G.newsSeen=WHATS_NEW_V; save(); setTimeout(()=>showTour(TOUR),400); return; }
  if((G.newsSeen||0)<WHATS_NEW_V){ G.toured=1; G.newsSeen=WHATS_NEW_V; save();
    setTimeout(()=>showTour([["✨","What's new",`<ul>${WHATS_NEW.map(x=>`<li>${x}</li>`).join("")}</ul><p class="muted" style="font-size:14px">Want the full tour? Tap <b>📖 How it works</b> at the bottom of the page.</p>`]]),500); }
}
$("#tourLink").onclick=()=>showTour(TOUR);

/* ================= INSTALL AS AN APP (PWA) ================= */
if("serviceWorker" in navigator && location.protocol.startsWith("http")) addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
let installEvt=null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function showInstallHelp(){
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="levelup" role="dialog" aria-modal="true" aria-label="Install the app" style="text-align:left"><div style="text-align:center"><img src="icons/icon-192.png" alt="" width="84" height="84" style="border-radius:20px"></div>
    <h3 style="text-align:center;margin-top:10px">Add Fount GCSE to your home screen</h3>
    ${isIOS?`<ol style="padding-left:1.2em;line-height:1.6"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button (the square with an arrow).</li><li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>`
      :`<ol style="padding-left:1.2em;line-height:1.6"><li>Open the browser menu (<b>⋮</b> or <b>⋯</b>).</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li></ol><p class="muted" style="font-size:14px">On a computer, look for the install icon at the right of the address bar.</p>`}
    <p class="muted" style="font-size:14px">It opens full screen like an app and works offline.</p>
    ${isIOS?`<p style="font-size:14px;background:var(--warn-bg);border-radius:10px;padding:8px 10px">⚠️ On iPhone and iPad the home-screen app keeps its own progress. Before installing, go to <b>Save → Copy save code</b>, then paste it into the Save tab in the app.</p>`:`<p class="muted" style="font-size:14px">Your progress comes with you.</p>`}
    <div style="text-align:center"><button class="btn" id="instOk">Got it</button></div></div>`;
  document.body.appendChild(o); o.onclick=e=>{ if(e.target===o||e.target.id==="instOk") o.remove(); }; $("#instOk").focus();
}
addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); installEvt=e; if(!TEACHER) $("#installBtn").hidden=false; });
addEventListener("appinstalled",()=>{ $("#installBtn").hidden=true; installEvt=null; if(!TEACHER) toast("📲","App installed!","Find Fount GCSE on your home screen."); });
if(!TEACHER && !standalone() && (isIOS || "serviceWorker" in navigator)) $("#installBtn").hidden=false;
$("#installBtn").onclick=async()=>{ if(installEvt){ installEvt.prompt(); const c=await installEvt.userChoice.catch(()=>null); installEvt=null; if(c&&c.outcome==="accepted") $("#installBtn").hidden=true; } else showInstallHelp(); };

if(TEACHER){ startTeacher(); }
else { if(G.cardMode==="gap"||G.cardMode==="flip"){ cardMode=G.cardMode; document.querySelectorAll("[data-cm]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.cm===cardMode)); }
  dateEggs(); checkStreak(); checkBadges(); save(); renderMeter(); renderChips(); newDeck(); renderQuiz(); renderHud(); renderArcade(); renderPlan(); renderEvents(); }

$("#focusBtn").onclick=focusClick; if(G.focus && G.focus.end){ if(Date.now()>=G.focus.end) focusEnd(true); else { focusTimer=setInterval(focusTick,1000); focusBtnRender(); } }
$("#parentLink").onclick=()=>{ goTab("quiz"); setQuizMode("parent"); $("#parentArea").scrollIntoView({behavior:reduced()?"auto":"smooth"}); };
if(!TEACHER && /(^|[?&#])parent\b/i.test(location.search+location.hash)){ goTab("quiz"); setQuizMode("parent"); }
$("#petStrip").onclick=()=>{ goTab("trophies","progress"); };
if(!TEACHER){ petCheck(); nudgeCheck(); welcomeCheck(); }
</script>
