t?","a":"A person who answers questions in research","t":"RM","id":236},{"q":"What is a pseudonym?","a":"A false name used to protect a participant's identity","t":"RM","id":237},{"q":"What does representative sample mean in practice?","a":"It contains the same mix of people (e.g. age, gender, ethnicity) as the population, so findings can be generalised","t":"RM","id":238},{"q":"What are the eight steps of research design?","a":"Review literature, set aims or hypothesis, choose methods, pilot study, select sample, collect data, analyse data, evaluate","t":"RM","id":239},{"q":"What is a victim survey?","a":"A survey asking people about crimes they have experienced, whether reported or not, e.g. the CSEW","t":"RM","id":240},{"q":"What is a self-report study?","a":"A survey asking people to admit crimes they have committed but not been caught for","t":"RM","id":241},{"q":"What is ethnography?","a":"Studying the way of life of a group by spending a long time with them, usually through participant observation","t":"RM","id":242},{"q":"What is a family?","a":"A couple who are married, civil partners or cohabiting, with or without dependent children, or a lone parent with their child or children","t":"Families","id":243},{"q":"What is a household?","a":"One person living alone, or a group of people living at the same address who share at least one meal a day or facilities such as a living room","t":"Families","id":244},{"q":"What is the difference between a family and a household?","a":"A family is linked by marriage, partnership or blood; a household is anyone living together at the same address, who need not be related","t":"Families","id":245},{"q":"What is the narrow definition of the family?","a":"A married couple and their biological children who all live together","t":"Families","id":246},{"q":"Why do some sociologists prefer a broad definition of the family?","a":"A narrow definition excludes many family types, such as lone-parent, same-sex and cohabiting families","t":"Families","id":247},{"q":"What is a nuclear family?","a":"A father, mother and their biological children: two generations living together in the same household","t":"Families","id":248},{"q":"What is a reconstituted family?","a":"A family in which one or both partners have a child or children from a previous relationship","t":"Families","id":249},{"q":"What is a lone-parent family?","a":"One parent and a child or children living together","t":"Families","id":250},{"q":"What is a same-sex family?","a":"A family in which a same-sex couple live together with their child or children","t":"Families","id":251},{"q":"What is an extended family?","a":"Relatives beyond the nuclear family; the classic extended family has three generations living together or nearby","t":"Families","id":252},{"q":"What is a beanpole family?","a":"A family with many generations but few relatives in each generation, as people have fewer children and live longer","t":"Families","id":253},{"q":"What is an empty nest family?","a":"A couple whose children have grown up and left home","t":"Families","id":254},{"q":"What is a single-person household?","a":"A household in which one person lives alone","t":"Families","id":255},{"q":"What is cohabitation?","a":"A couple living together without being married","t":"Families","id":256},{"q":"What is family diversity?","a":"The different types of family, and differences in class, culture, life course, cohort and organisation","t":"Families","id":257},{"q":"Who identified five types of family diversity?","a":"Rapoport and Rapoport (1982)","t":"Families","id":258},{"q":"Name the Rapoports' five types of family diversity.","a":"Organisational, cultural, social class, life-course and cohort","t":"Families","id":259},{"q":"What is organisational diversity?","a":"Differences in family structure, how domestic tasks are divided and links to extended family, e.g. dual-worker or reconstituted families","t":"Families","id":260},{"q":"What is cultural diversity in families?","a":"Differences in families' cultural and religious values and beliefs, affecting gender roles and childrearing","t":"Families","id":261},{"q":"What is social class diversity in families?","a":"Differences in family life linked to class, e.g. resources available and attitudes to roles and childrearing","t":"Families","id":262},{"q":"What is life-course diversity?","a":"Differences based on the stage of the family life cycle, e.g. newlyweds versus retired couples whose children have left home","t":"Families","id":263},{"q":"What is cohort diversity?","a":"Differences linked to the historical period a family lives through, e.g. divorce is less stigmatised now than in the past","t":"Families","id":264},{"q":"Were the Rapoports optimistic or pessimistic about family diversity?","a":"Optimistic: they thought it showed people had more freedom and choice, and that there is no single 'right' family","t":"Families","id":265},{"q":"How would Oakley criticise the Rapoports?","a":"She argues the patriarchal conventional family is still dominant and there is not as much diversity as the Rapoports claim","t":"Families","id":266},{"q":"Give three reasons for growing family diversity.","a":"Changes in the law (e.g. divorce, same-sex marriage), changing social attitudes, secularisation, women's employment, immigration and longer life expectancy","t":"Families","id":267},{"q":"How has immigration added to family diversity?","a":"Some migrant groups bring different family traditions, such as extended families or arranged marriages","t":"Families","id":268},{"q":"How has longer life expectancy affected families?","a":"More older people live alone or in beanpole families, and grandparents may help with childcare","t":"Families","id":269},{"q":"What is the 'cereal packet family'?","a":"Leach's term for the stereotypical nuclear family shown in adverts: a married couple and children, with the husband as breadwinner","t":"Families","id":270},{"q":"Who coined the term 'cereal packet family'?","a":"Edmund Leach (1967)","t":"Families","id":271},{"q":"What is the instrumental role?","a":"The 'breadwinner' role of going out to work to support the family financially; Parsons saw this as the man's role","t":"Families","id":272},{"q":"What is the expressive role?","a":"The caring, emotional, nurturing role in the family; Parsons saw this as the woman's natural role","t":"Families","id":273},{"q":"What is the life course?","a":"The sequence of stages an individual passes through over their lifetime, or the course of a family's life over time","t":"Families","id":274},{"q":"What is childrearing?","a":"The process of bringing up children","t":"Families","id":275},{"q":"What is a commune?","a":"A group of people who share living accommodation, possessions, wealth and property","t":"Families","id":276},{"q":"When were communes most popular?","a":"In the 1960s and 1970s, especially in the USA","t":"Families","id":277},{"q":"What are kibbutzim?","a":"Communal settlements in Israel whose members value equality and cooperation","t":"Families","id":278},{"q":"How were children traditionally raised on a kibbutz?","a":"They lived in children's quarters, cared for by 'kibbutz mothers', and saw their parents for a few hours a day","t":"Families","id":279},{"q":"What was China's one-child policy?","a":"A law from 1979 to 2016 limiting city couples to one child to control population growth","t":"Families","id":280},{"q":"Why did China end the one-child policy?","a":"An ageing population and low birth rate meant more young people were needed for the workforce and to care for elderly relatives","t":"Families","id":281},{"q":"What is a universal institution?","a":"Murdock's claim that the nuclear family exists in some form in every society, based on his study of 250 societies","t":"Families","id":282},{"q":"How many societies did Murdock study?","a":"250","t":"Families","id":283},{"q":"Name Murdock's four functions of the family.","a":"Sexual, reproductive, economic and educational","t":"Families","id":284},{"q":"What is the sexual function of the family?","a":"Regulating sexual behaviour within marriage, which maintains the couple's relationship","t":"Families","id":285},{"q":"What is the reproductive function of the family?","a":"Producing new members of society through procreation and childbearing, so society survives","t":"Families","id":286},{"q":"What is the economic function of the family?","a":"Providing members with financial support, based on a division of labour between husband and wife","t":"Families","id":287},{"q":"What is the educational function of the family?","a":"Socialising children into the norms and values (culture) of society","t":"Families","id":288},{"q":"How would feminists criticise Murdock?","a":"Delphy and Leonard argue he ignores the darker side of family life and its negative impact on women","t":"Families","id":289},{"q":"Why might Murdock's functions be outdated?","a":"Other institutions now perform some functions (schools educate, the state provides welfare) and many children are born outside marriage","t":"Families","id":290},{"q":"What did Parsons argue about the loss of functions?","a":"Over time the family has lost functions such as education and production to other institutions, but it is still vital","t":"Families","id":291},{"q":"Name Parsons' two key functions of the nuclear family.","a":"Primary socialisation of children and the stabilisation of adult personalities","t":"Families","id":292},{"q":"What is the stabilisation of adult personalities?","a":"The emotional security and support the family gives adults, relieving the stress of daily life","t":"Families","id":293},{"q":"What is the 'warm bath' theory?","a":"Parsons' idea that a man coming home from work could relax into his family like a warm bath, which refreshed him for the next day","t":"Families","id":294},{"q":"Why did Parsons call families 'factories'?","a":"Because they produce human personalities through primary socialisation","t":"Families","id":295},{"q":"How would Zaretsky criticise Parsons' warm bath theory?","a":"He argues it only props up capitalism by keeping workers fit to be exploited, maintaining the power of the bourgeoisie","t":"Families","id":296},{"q":"Give one feminist criticism of Parsons.","a":"His expressive and instrumental roles assume women should do the caring and housework, which keeps them dependent on men","t":"Families","id":297},{"q":"How do Marxists view the nuclear family?","a":"It supports capitalism and passes inequality from one generation to the next","t":"Families","id":298},{"q":"What did Zaretsky argue about the family before the 19th century?","a":"It was a unit of production, e.g. families made cloth together at home","t":"Families","id":299},{"q":"Name three ways the family serves capitalism according to Zaretsky.","a":"Women's unpaid domestic labour, reproducing the labour force, passing on wealth and advantage, and acting as a unit of consumption","t":"Families","id":300},{"q":"What is a unit of consumption?","a":"Marxists' idea that the family buys the products of capitalism, which keeps the bourgeoisie making profit","t":"Families","id":301},{"q":"How does inheritance support capitalism according to Marxists?","a":"The bourgeoisie pass their wealth to their children, which keeps the class system going","t":"Families","id":302},{"q":"Give one criticism of the Marxist view of the family.","a":"It ignores the positive functions families provide and the fact that most people are happy with family life","t":"Families","id":303},{"q":"Give another criticism of the Marxist view of the family.","a":"It ignores family diversity and focuses on class while ignoring gender inequality","t":"Families","id":304},{"q":"How do feminists view the family?","a":"As patriarchal: it benefits men and oppresses women","t":"Families","id":305},{"q":"What is oppression?","a":"Prolonged cruel or unjust treatment or exercise of authority","t":"Families","id":306},{"q":"How do Delphy and Leonard define housework?","a":"Unpaid work done by women in or related to the household, including less visible tasks like booking holidays and sending birthday cards","t":"Families","id":307},{"q":"Why is housework unpaid according to Delphy and Leonard?","a":"Not because of the tasks themselves but because women do them for husbands within a patriarchal relationship","t":"Families","id":308},{"q":"What did Delphy and Leonard say about family hierarchy?","a":"The husband is at the top and makes the important decisions, while others are in subordinate positions","t":"Families","id":309},{"q":"In what ways are wives exploited according to Delphy and Leonard?","a":"Their labour is used by husbands, their work is not valued, they are financially dependent and they have a subordinate position","t":"Families","id":310},{"q":"How would Marxists criticise Delphy and Leonard?","a":"Zaretsky argues they ignore the impact of class and capitalism on the family","t":"Families","id":311},{"q":"Give a general criticism of the feminist view of the family.","a":"It may be outdated, as many couples now share roles, and not all women see themselves as exploited","t":"Families","id":312},{"q":"How did Oakley define the conventional family?","a":"Nuclear families made up of legally married couples, voluntarily choosing to be parents of one or more children","t":"Families","id":313},{"q":"What did Oakley find about housewives?","a":"70% were dissatisfied, they disliked housework the most, and they worked on average 77 hours a week","t":"Families","id":314},{"q":"What is the dual burden?","a":"Oakley's idea that working women do both paid work and most of the unpaid domestic work","t":"Families","id":315},{"q":"What is the triple shift?","a":"Duncombe and Marsden's idea that women are responsible for paid work, domestic work/childcare and emotional work","t":"Families","id":316},{"q":"What is emotional work?","a":"Making family members feel good and keeping relationships running smoothly","t":"Families","id":317},{"q":"How would functionalists criticise Oakley?","a":"Murdock and Parsons argue she ignores the positive functions of the nuclear family and the expressive and instrumental roles","t":"Families","id":318},{"q":"What is monogamy?","a":"Being married to only one person at a time","t":"Families","id":319},{"q":"What is serial monogamy?","a":"Marrying, divorcing, remarrying and divorcing again, having one partner at a time","t":"Families","id":320},{"q":"What is secularisation?","a":"The process whereby the influence of religion in society declines","t":"Families","id":321},{"q":"What is marriage?","a":"A legal union between two people","t":"Families","id":322},{"q":"Name three changes in marriage patterns in the UK.","a":"Fewer marriages, people marrying later, more cohabitation, same-sex marriage, more births outside marriage and fewer religious ceremonies","t":"Families","id":323},{"q":"Why are people marrying later?","a":"Women are focusing on careers, people stay in education longer, and cohabitation is more acceptable","t":"Families","id":324},{"q":"Why has cohabitation increased?","a":"Less stigma, secularisation, fear of divorce, and the cost of weddings","t":"Families","id":325},{"q":"When did same-sex marriage become legal in England and Wales?","a":"2014 (under the Marriage (Same Sex Couples) Act 2013)","t":"Families","id":326},{"q":"How might secularisation affect marriage?","a":"Fewer people believe living together without marriage is wrong, so more cohabit and fewer marry in church","t":"Families","id":327},{"q":"What is divorce?","a":"The legal termination of a marriage","t":"Families","id":328},{"q":"What was divorce like before 1857?","a":"Virtually non-existent: it needed a costly act of parliament, and women were legally the property of men","t":"Families","id":329},{"q":"What changed in 1923 for divorce?","a":"Grounds for divorce were equalised between men and women","t":"Families","id":330},{"q":"Why did divorce become more affordable after 1949?","a":"Legal aid became available","t":"Families","id":331},{"q":"What was the Divorce Reform Act 1969?","a":"It made 'irretrievable breakdown of marriage' the only ground for divorce, making it easier; it came into force in 1971","t":"Families","id":332},{"q":"What changed in 1984 for divorce?","a":"The minimum length of marriage before divorce was reduced from three years to one","t":"Families","id":333},{"q":"What is no-fault divorce?","a":"Divorce without either partner having to blame the other; introduced in England and Wales in April 2022","t":"Families","id":334},{"q":"Name five reasons for the rise in divorce.","a":"Changes in the law, changing social attitudes, secularisation, the changing position of women and media influence","t":"Families","id":335},{"q":"How has the changing position of women affected divorce?","a":"More women are in paid work and financially independent, so they can leave unhappy marriages; women file most divorce petitions","t":"Families","id":336},{"q":"How might the media increase divorce?","a":"It emphasises romantic love, so people have unrealistically high expectations of marriage","t":"Families","id":337},{"q":"Which age group has the highest divorce rate?","a":"Couples in their late twenties; teenage marriages are about twice as likely to end in divorce","t":"Families","id":338},{"q":"How do functionalists view divorce?","a":"Divorce can be functional: it ends unhappy, dysfunctional marriages and allows people to remarry happier partners","t":"Families","id":339},{"q":"How might feminists view rising divorce?","a":"Positively, as it shows women are less willing to accept patriarchal, unequal marriages","t":"Families","id":340},{"q":"How might the New Right view rising divorce?","a":"Negatively, as it weakens the nuclear family and creates lone-parent families","t":"Families","id":341},{"q":"Name two consequences of divorce for children.","a":"Possible emotional distress, moving home, less contact with one parent, and living in a reconstituted or lone-parent family","t":"Families","id":342},{"q":"What are conjugal roles?","a":"The domestic roles of married or cohabiting partners","t":"Families","id":343},{"q":"Who identified segregated and joint conjugal roles?","a":"Elizabeth Bott","t":"Families","id":344},{"q":"What are segregated conjugal roles?","a":"A clear division of labour where the husband and wife spend little leisure time together","t":"Families","id":345},{"q":"What are joint conjugal roles?","a":"No rigid division of labour, with husband and wife sharing tasks and spending leisure time together","t":"Families","id":346},{"q":"What is the domestic division of labour?","a":"How tasks such as housework and childcare are divided between partners","t":"Families","id":347},{"q":"Who studied the symmetrical family?","a":"Willmott and Young (functionalists)","t":"Families","id":348},{"q":"What is a symmetrical family?","a":"A family where spouses do different tasks but make similar contributions to the home","t":"Families","id":349},{"q":"What research methods did Willmott and Young use?","a":"Historical research and social surveys; nearly 2,000 people were interviewed in London","t":"Families","id":350},{"q":"Name Willmott and Young's four stages of family development.","a":"Pre-industrial, early industrial, symmetrical, and the principle of stratified diffusion","t":"Families","id":351},{"q":"What was the pre-industrial family like according to Willmott and Young?","a":"A unit of production, with husband, wife and children working together, usually in agriculture","t":"Families","id":352},{"q":"What was the early industrial family like?","a":"Family members worked in factories and the wider family provided security and support","t":"Families","id":353},{"q":"What is stratified diffusion?","a":"The theory that changes start at the top of the class system and filter down, e.g. from the middle class to the working class","t":"Families","id":354},{"q":"Give one criticism of Willmott and Young.","a":"Oakley found husbands who 'helped' once a week were counted as sharing, so equality was exaggerated","t":"Families","id":355},{"q":"What did Scott and Clery (2013) find about gender roles?","a":"Attitudes have changed but behaviour hasn't: women still do most housework, e.g. laundry, so they work a double shift","t":"Families","id":356},{"q":"What did Edgell (1980) find?","a":"In middle-class couples, men made the important decisions (e.g. moving house) while women made minor ones (e.g. children's clothes)","t":"Families","id":357},{"q":"What did Pahl find about money management?","a":"It reflects who earns the most; financial independence was more likely in younger couples and where women worked full time","t":"Families","id":358},{"q":"What is a dual-career family?","a":"A family where both partners have careers","t":"Families","id":359},{"q":"What is domestic violence?","a":"Behaviour used to gain or maintain power and control in a relationship, including physical, sexual, emotional and financial abuse","t":"Families","id":360},{"q":"Why is domestic violence under-reported?","a":"Fear of the abuser, shame, a desire for privacy, financial dependence and fear of family break-up","t":"Families","id":361},{"q":"What did the British Social Attitudes survey show about gender roles from 1989 to 2012?","a":"Fewer agreed that 'a man's job is to earn money and a woman's job is to look after the home' (28% fell to 13%)","t":"Families","id":362},{"q":"What is an arranged marriage?","a":"A marriage where families help choose the partners, with the consent of both people","t":"Families","id":363},{"q":"What is a dysfunctional family?","a":"A family that fails to perform its functions properly, e.g. through abuse or neglect","t":"Families","id":364},{"q":"Name two criticisms of families in the specification.","a":"Isolation, unrealistic idealisation, loss of functions, loss of contact with wider kin, the role of women, marital breakdown and dysfunctional families","t":"Families","id":365},{"q":"How do the New Right view the nuclear family?","a":"As the best and only 'normal' family type, ideal for socialising children","t":"Families","id":366},{"q":"What is the privatised nuclear family?","a":"A nuclear family cut off from wider kin whose life is centred on the home","t":"Families","id":367},{"q":"How have relationships between parents and children changed?","a":"Families are more child-centred, children have more rights and spend longer dependent on parents","t":"Families","id":368},{"q":"What is education?","a":"The process of giving and receiving knowledge","t":"Education","id":369},{"q":"What is compulsory state education?","a":"Education required by law; in the UK from age 5 to 18 (in education or training after 16)","t":"Education","id":370},{"q":"What is the formal curriculum?","a":"The timetabled subjects taught in school, such as maths and English","t":"Education","id":371},{"q":"What is the hidden curriculum?","a":"The values and attitudes taught through the way school is organised, not as part of the formal curriculum, e.g. punctuality and respect for authority","t":"Education","id":372},{"q":"Give an example of the hidden curriculum.","a":"Learning to obey teachers, arrive on time, wear uniform and wait your turn","t":"Education","id":373},{"q":"What was the 1870 Forster Act?","a":"The Elementary Education Act, which set up state elementary schools so all children could get a basic education","t":"Education","id":374},{"q":"What was the 1944 Butler Act?","a":"It introduced free secondary education for all and the tripartite system","t":"Education","id":375},{"q":"What was the tripartite system?","a":"Three types of secondary school: grammar, secondary technical and secondary modern, allocated by the 11+ exam","t":"Education","id":376},{"q":"What was the 11+?","a":"An exam taken at the end of primary school to decide which type of secondary school a child would attend","t":"Education","id":377},{"q":"When were comprehensive schools introduced?","a":"From 1965, under a Labour government","t":"Education","id":378},{"q":"What is a comprehensive school?","a":"A state secondary school that does not select pupils on the basis of ability","t":"Education","id":379},{"q":"What was the 1988 Education Reform Act?","a":"A Conservative act that introduced marketisation: the national curriculum, SATs, league tables, parental choice and formula funding","t":"Education","id":380},{"q":"What is marketisation of education?","a":"Changes from the late 1980s that made education more business-like, based on competition between schools and consumer (parental) choice","t":"Education","id":381},{"q":"What is the national curriculum?","a":"Subjects that must be taught in all local authority schools in England","t":"Education","id":382},{"q":"What are league tables?","a":"Published rankings of schools by exam results, so parents can compare them","t":"Education","id":383},{"q":"What are academies?","a":"Schools set up and managed by sponsors such as businesses, faith or voluntary groups, funded directly by government and free from local authority control","t":"Education","id":384},{"q":"Which government introduced academies?","a":"New Labour, in 2000, to improve failing schools","t":"Education","id":385},{"q":"What are free schools?","a":"Schools set up by teachers, charities, community groups, faith groups, universities or parents, funded by the state","t":"Education","id":386},{"q":"What is a faith school?","a":"A school with a religious affiliation","t":"Education","id":387},{"q":"What is a grammar school?","a":"A school that selects pupils based on academic ability, usually through the 11+","t":"Education","id":388},{"q":"What is an independent (private) school?","a":"A school funded by fees paid by parents and by investors, rather than the state","t":"Education","id":389},{"q":"What percentage of UK children go to private schools?","a":"About 7%","t":"Education","id":390},{"q":"What is a public school?","a":"A high-status, expensive private school, such as Eton","t":"Education","id":391},{"q":"What is home schooling?","a":"When parents take full responsibility for their child's education instead of sending them to school","t":"Education","id":392},{"q":"Give two reasons parents choose home schooling.","a":"Religious or philosophical beliefs, a child's special needs, unhappiness at school, or not getting a place at a chosen school","t":"Education","id":393},{"q":"What is de-schooling?","a":"The idea that schools should be abolished and replaced with informal learning in small groups with shared interests","t":"Education","id":394},{"q":"Who argued for de-schooling?","a":"Ivan Illich","t":"Education","id":395},{"q":"Why did Illich criticise schools?","a":"He argued they repress children and promote passive conformity instead of creative, independent thinking","t":"Education","id":396},{"q":"What is vocational education?","a":"Education designed to provide skills for work","t":"Education","id":397},{"q":"What is vocationalism?","a":"Education designed to provide the skills needed for work","t":"Education","id":398},{"q":"What is STEM?","a":"Science, Technology, Engineering and Maths","t":"Education","id":399},{"q":"What is the pupil premium?","a":"Extra funding for state schools in England to raise the attainment of disadvantaged pupils","t":"Education","id":400},{"q":"What are free school meals?","a":"School meals paid for by the government for disadvantaged children; often used as a measure of poverty","t":"Education","id":401},{"q":"Why do sociologists use free school meals as a measure of class?","a":"Eligibility is based on low family income, so it is an easy, available indicator of disadvantage","t":"Education","id":402},{"q":"What is Progress 8?","a":"A measure introduced in 2016 of the progress pupils make from the end of primary to the end of secondary school","t":"Education","id":403},{"q":"What is Attainment 8?","a":"A pupil's total points across eight GCSE subjects, with English and maths counted twice","t":"Education","id":404},{"q":"What is the EBacc?","a":"The English Baccalaureate: a measure based on five subjects: English, maths, sciences, history or geography, and a language","t":"Education","id":405},{"q":"How do functionalists view education?","a":"As meeting society's needs: passing on shared values, creating social cohesion and allocating people to suitable jobs fairly","t":"Education","id":406},{"q":"What did Durkheim argue is the main function of education?","a":"Passing on society's norms and values to create social cohesion, making society a united whole","t":"Education","id":407},{"q":"How did Durkheim think teaching history helps society?","a":"It links the individual to society and gives a shared sense of belonging","t":"Education","id":408},{"q":"What is social cohesion?","a":"A sense of belonging to wider society, with people bound together by shared values","t":"Education","id":409},{"q":"What did Parsons call the school?","a":"A bridge between the family and wider society","t":"Education","id":410},{"q":"What are particularistic standards?","a":"Judgements based on individual characteristics, as in the family, where children are judged as individuals","t":"Education","id":411},{"q":"What are universalistic standards?","a":"Standards applied in the same way to everyone, as in school and wider society","t":"Education","id":412},{"q":"What is role allocation?","a":"Parsons' idea that education sorts people into the jobs that best suit their talents","t":"Education","id":413},{"q":"What is meritocracy?","a":"A system where achievement is based on talent and effort rather than social background","t":"Education","id":414},{"q":"What is achieved status?","a":"A social position earned through talent or effort","t":"Education","id":415},{"q":"What is ascribed status?","a":"A social position fixed at birth and unchanging over a long period","t":"Education","id":416},{"q":"Give one criticism of the functionalist view of education.","a":"Education isn't truly meritocratic: class, gender and ethnicity still affect achievement","t":"Education","id":417},{"q":"How do Marxists view education?","a":"As serving the ruling class by reproducing class inequality and producing an obedient workforce","t":"Education","id":418},{"q":"What is the correspondence principle?","a":"Bowles and Gintis' idea that what is learned in school mirrors what is required in the workplace","t":"Education","id":419},{"q":"Give an example of the correspondence principle.","a":"Obeying teachers at school mirrors obeying managers at work; getting rewarded with grades mirrors getting paid wages","t":"Education","id":420},{"q":"How many students did Bowles and Gintis study?","a":"237 New York high school students","t":"Education","id":421},{"q":"What did Bowles and Gintis find about rewarded traits?","a":"Schools rewarded obedience and conformity, while creative, independent students got lower grades","t":"Education","id":422},{"q":"What is the myth of meritocracy?","a":"Marxists' idea that people are told success is based on merit so they blame themselves for failure, rather than the class system","t":"Education","id":423},{"q":"Give one criticism of Bowles and Gintis.","a":"Their study is old and American, and not all students passively accept the hidden curriculum (e.g. Willis' lads)","t":"Education","id":424},{"q":"Who studied the 12 'lads'?","a":"Paul Willis (Marxist)","t":"Education","id":425},{"q":"What did Willis find?","a":"The working-class lads formed a counter-school culture, messing about and rejecting school, which prepared them for manual jobs","t":"Education","id":426},{"q":"What is a counter-school culture?","a":"A subculture of students who reject the values of the school","t":"Education","id":427},{"q":"What research method did Willis use?","a":"Participant observation and interviews with 12 working-class boys","t":"Education","id":428},{"q":"What is a subculture?","a":"A group with a distinctive set of values and behaviours that sets itself apart from wider society","t":"Education","id":429},{"q":"What is labelling in education?","a":"When teachers attach a label (e.g. 'bright' or 'troublemaker') to pupils, which can affect their behaviour and achievement","t":"Education","id":430},{"q":"What did Rosenthal and Jacobson find?","a":"Randomly selected 'spurters' gained more IQ because teachers expected them to: evidence of the self-fulfilling prophecy","t":"Education","id":431},{"q":"What is the self-fulfilling prophecy in education?","a":"When a pupil lives up to the label a teacher has given them, so the prediction comes true","t":"Education","id":432},{"q":"What did Ball study at Beachside Comprehensive?","a":"How banding affected pupils; top-band pupils were expected to behave well and lower bands were expected to be difficult","t":"Education","id":433},{"q":"What research method did Ball use in Beachside?","a":"Participant observation over three years","t":"Education","id":434},{"q":"What did Ball find about class and banding?","a":"Pupils from higher social classes were more likely to be placed in the top band","t":"Education","id":435},{"q":"What is setting?","a":"Dividing students into groups for particular subjects based on their ability in that subject","t":"Education","id":436},{"q":"What is streaming?","a":"Dividing students into groups based on general ability for all subjects","t":"Education","id":437},{"q":"What is mixed ability teaching?","a":"Students of all abilities taught together in the same class","t":"Education","id":438},{"q":"What did Ball, Bowe and Gewirtz study?","a":"The effects of parental choice and league tables on 15 schools in 3 local education authorities","t":"Education","id":439},{"q":"What did Ball, Bowe and Gewirtz find?","a":"League tables led schools to focus on able students and reintroduce setting; less able and special needs students were neglected","t":"Education","id":440},{"q":"Why do middle-class parents have an advantage in school choice?","a":"They have the knowledge and contacts to find good schools, can move into catchment areas, and can afford travel to distant schools","t":"Education","id":441},{"q":"What did Halsey's study find?","a":"Service-class boys were 11 times more likely than working-class boys to go to university","t":"Education","id":442},{"q":"What method did Halsey use?","a":"A longitudinal study of over 8,000 males born between 1913 and 1952","t":"Education","id":443},{"q":"What is cultural capital?","a":"The skills, knowledge and values middle-class parents pass on to their children, which help them succeed in education","t":"Education","id":444},{"q":"What is cultural deprivation?","a":"Lacking the cultural capital (language, values, attitudes) needed to succeed in education","t":"Education","id":445},{"q":"What is material deprivation?","a":"Being unable to afford the goods and activities that are typical in society, such as books, a computer or a quiet place to study","t":"Education","id":446},{"q":"Name three external factors affecting achievement.","a":"Material deprivation, cultural deprivation, parents' attitudes, language, home socialisation and the job market","t":"Education","id":447},{"q":"Name three internal factors affecting achievement.","a":"Labelling, setting and streaming, the hidden curriculum, school ethos and subcultures","t":"Education","id":448},{"q":"What is an external factor?","a":"A factor outside the school that affects achievement, such as home background","t":"Education","id":449},{"q":"What is an internal factor?","a":"A factor inside the school that affects achievement, such as labelling or setting","t":"Education","id":450},{"q":"What is school ethos?","a":"The character, values and atmosphere of a school","t":"Education","id":451},{"q":"What is an ethnocentric curriculum?","a":"A curriculum that reflects the culture and beliefs of one group (usually white British) and ignores others","t":"Education","id":452},{"q":"What is institutional racism in education?","a":"School procedures, practices and attitudes that intentionally or unintentionally discriminate against ethnic minority pupils","t":"Education","id":453},{"q":"What is the genderquake?","a":"A fundamental change in society where young women are increasingly striving for fulfilling careers","t":"Education","id":454},{"q":"Who achieves better at GCSE, boys or girls?","a":"Girls have outperformed boys at GCSE since the late 1980s","t":"Education","id":455},{"q":"Give two reasons girls now outperform boys.","a":"Feminism and changing ambitions, more women in work as role models, equal opportunity policies and coursework that suits girls","t":"Education","id":456},{"q":"How might the crisis of masculinity affect boys' achievement?","a":"The decline in traditional male jobs may make boys feel education is pointless, so they underachieve","t":"Education","id":457},{"q":"Which ethnic groups tend to achieve highest at GCSE?","a":"Chinese and Indian pupils","t":"Education","id":458},{"q":"What did Wright (1992) find about teachers and ethnicity?","a":"Teachers had positive expectations of Asian girls but stereotyped Black Caribbean boys as troublemakers","t":"Education","id":459},{"q":"What did Mirza (1997) find?","a":"Young African-Caribbean girls had strong motivation to succeed, which helped them reject negative labels","t":"Education","id":460},{"q":"What did Reid mean by 'doubling up'?","a":"Some ethnic minority pupils face disadvantages of both class and ethnicity at the same time","t":"Education","id":461},{"q":"What did Bhatti (1999) find?","a":"Some Asian parents, often poorly educated themselves, had a strong desire to help their children's education","t":"Education","id":462},{"q":"What is social mobility?","a":"Movement up or down the layers of the social structure, e.g. from working class to middle class","t":"Education","id":463},{"q":"What did the Sutton Trust find about private school alumni?","a":"Although only 7% of pupils go to private schools, former private school pupils hold around 65% of top jobs","t":"Education","id":464},{"q":"How would Marxists view private schools?","a":"As a way for the wealthy to buy advantage and pass on privilege, reproducing class inequality","t":"Education","id":465},{"q":"How would functionalists view private schools?","a":"They offer choice and high standards, and help allocate talented people to important roles","t":"Education","id":466},{"q":"What is Finland's education system known for?","a":"No national exams until 18, highly trained teachers, equality and a focus on well-being","t":"Education","id":467},{"q":"What is Japan's education system known for?","a":"Rigorous exams, discipline, long school days and group responsibility (pupils clean classrooms)","t":"Education","id":468},{"q":"What is Ofsted?","a":"The Office for Standards in Education, which inspects schools in England","t":"Education","id":469},{"q":"How might feminists view education?","a":"It used to disadvantage girls through gender stereotyping and subject choices, though girls now do better, partly due to feminism","t":"Education","id":470},{"q":"What is a pro-school subculture?","a":"A group of pupils who value school and work hard to succeed","t":"Education","id":471},{"q":"What is crime?","a":"Behaviour which breaks the formal written laws of a society","t":"Crime","id":472},{"q":"What is deviance?","a":"Behaviour which does not conform to the dominant norms of a society","t":"Crime","id":473},{"q":"Is all deviance illegal?","a":"No: some deviance is legal (e.g. burping in a restaurant) and some crimes are not seen as deviant by everyone","t":"Crime","id":474},{"q":"Give an example of an act that is both criminal and deviant.","a":"Murder, or shoplifting","t":"Crime","id":475},{"q":"Give an example of legal deviance.","a":"Body modification, burping after a meal, or wearing fancy dress to work","t":"Crime","id":476},{"q":"Why are crime and deviance social constructs?","a":"What counts as criminal or deviant changes with time, place, culture and social situation","t":"Crime","id":477},{"q":"Give an example of deviance changing over time.","a":"Smoking was widely accepted in the 1950s but is now seen as deviant in many places","t":"Crime","id":478},{"q":"Give an example of deviance varying by culture.","a":"Drinking alcohol is acceptable in Britain but deviant and sometimes illegal in some Islamic countries","t":"Crime","id":479},{"q":"Give an example of deviance depending on social situation.","a":"Wearing fancy dress is deviant at work but normal at a fancy dress party","t":"Crime","id":480},{"q":"What is the difference between mild and extreme deviance?","a":"Goode argued mild deviance (e.g. lying) gets a small reaction, while extreme deviance (e.g. full-face piercings) causes a strong reaction","t":"Crime","id":481},{"q":"What is reported crime?","a":"Crime that is reported to the police; not all reported crime is recorded","t":"Crime","id":482},{"q":"What is recorded crime?","a":"Crime that is reported to and recorded by the police","t":"Crime","id":483},{"q":"What is the dark figure of crime?","a":"The unknown amount of crime that is not discovered, reported to or recorded by the police","t":"Crime","id":484},{"q":"Give three reasons people don't report crime.","a":"They see it as too trivial, fear revenge, don't trust the police, don't know it happened, or want privacy","t":"Crime","id":485},{"q":"Why might the police not record all crimes?","a":"Lack of evidence, the crime seems trivial, the victim withdraws the complaint, or pressure to keep crime figures low","t":"Crime","id":486},{"q":"What are official crime statistics?","a":"Government statistics on crime based on police records, collected since 1857","t":"Crime","id":487},{"q":"Give one weakness of official crime statistics.","a":"They miss the dark figure of crime, so they underestimate the true amount of crime","t":"Crime","id":488},{"q":"What is the Crime Survey of England and Wales (CSEW)?","a":"A victim survey asking around 50,000 people aged 16+ in private households about crimes they have experienced in the last year","t":"Crime","id":489},{"q":"What was the CSEW previously called?","a":"The British Crime Survey","t":"Crime","id":490},{"q":"Roughly what proportion of crimes does the CSEW suggest are reported to police?","a":"Only around 4 in 10","t":"Crime","id":491},{"q":"Who is not included in the CSEW?","a":"People not living in private households, such as the homeless or people in care homes and prisons","t":"Crime","id":492},{"q":"What is a victim survey?","a":"A survey asking people about crimes they have experienced, whether reported or not","t":"Crime","id":493},{"q":"Give one advantage of victim surveys.","a":"They uncover crimes not reported to police, revealing some of the dark figure","t":"Crime","id":494},{"q":"Give one weakness of victim surveys.","a":"People may forget or misremember crimes, and some crimes, like corporate crime, are left out","t":"Crime","id":495},{"q":"What is a self-report study?","a":"A survey asking people to identify crimes they have committed but not been caught for","t":"Crime","id":496},{"q":"Give one advantage of self-report studies.","a":"They reveal hidden offenders and victimless crimes such as drug use","t":"Crime","id":497},{"q":"Give one weakness of self-report studies.","a":"People may lie or exaggerate, and samples are usually young people, so crimes uncovered tend to be trivial","t":"Crime","id":498},{"q":"What is social control?","a":"Control or constraints over people's actions and behaviour from society or groups","t":"Crime","id":499},{"q":"What is formal social control?","a":"Official, organised ways of enforcing conformity, e.g. getting a parking ticket","t":"Crime","id":500},{"q":"What is informal social control?","a":"Controlling behaviour through other people's approval and disapproval, e.g. praise or a telling off","t":"Crime","id":501},{"q":"Name three agencies of formal social control.","a":"The police, the courts, the government, the prison service, the Home Office and the Ministry of Justice","t":"Crime","id":502},{"q":"Name three agencies of informal social control.","a":"The family, peer group, school, workplace and religion","t":"Crime","id":503},{"q":"What is a sanction?","a":"A penalty (or reward) for behaviour, used to enforce norms or laws","t":"Crime","id":504},{"q":"What is the criminal justice system?","a":"The agencies involved in law enforcement, such as the police, courts, prisons and probation","t":"Crime","id":505},{"q":"What is Wilson and Kelling's broken windows theory?","a":"Leaving small signs of disorder unrepaired (like broken windows) signals nobody cares, which leads to more serious crime","t":"Crime","id":506},{"q":"What is zero tolerance policing?","a":"A policing approach that cracks down on even minor offences to stop crime escalating","t":"Crime","id":507},{"q":"What did Lombroso argue?","a":"Criminals could be identified by physical features and were less evolved: a biological explanation now rejected and seen as racist","t":"Crime","id":508},{"q":"What are biological explanations of crime?","a":"Explanations that see crime as caused by genes or physical features passed down through families","t":"Crime","id":509},{"q":"What are psychological explanations of crime?","a":"Explanations that focus on personality traits, such as impulsiveness, that lead people to commit crime","t":"Crime","id":510},{"q":"Give one criticism of biological explanations.","a":"They ignore social factors like poverty and socialisation, and can't explain why crime rates change over time","t":"Crime","id":511},{"q":"What did Durkheim argue about crime?","a":"Crime is normal and inevitable, and a certain amount is functional for society","t":"Crime","id":512},{"q":"Name two positive functions of crime according to Durkheim.","a":"It reaffirms boundaries (reminds people of the rules), strengthens social cohesion, and allows social change","t":"Crime","id":513},{"q":"What is the collective conscience?","a":"The shared values and moral beliefs of a society","t":"Crime","id":514},{"q":"What is anomie?","a":"Normlessness: when the normal rules of society break down, which Durkheim linked to rising crime","t":"Crime","id":515},{"q":"What was Durkheim's 'society of saints'?","a":"Even in a society of perfect people, deviance would exist because standards would be so high that tiny slips would be punished","t":"Crime","id":516},{"q":"How might Durkheim explain crime after Hurricane Katrina?","a":"The disaster caused anomie as norms broke down, leading to a wave of crime","t":"Crime","id":517},{"q":"What is strain theory?","a":"Merton's idea that crime happens when people can't reach society's goals (like the American Dream) by legitimate means","t":"Crime","id":518},{"q":"Name Merton's five responses to strain.","a":"Conformity, innovation, ritualism, retreatism and rebellion","t":"Crime","id":519},{"q":"What is innovation in Merton's theory?","a":"Accepting society's goals but using illegitimate means, e.g. theft or fraud, to reach them","t":"Crime","id":520},{"q":"What is retreatism in Merton's theory?","a":"Rejecting both goals and means and dropping out of society, e.g. drug addicts","t":"Crime","id":521},{"q":"What is ritualism in Merton's theory?","a":"Giving up on the goals but still sticking to the rules, e.g. staying in a dead-end job","t":"Crime","id":522},{"q":"What is rebellion in Merton's theory?","a":"Rejecting society's goals and means and replacing them with new ones, e.g. revolutionaries","t":"Crime","id":523},{"q":"What is the American Dream?","a":"The belief that anyone can achieve wealth and success through hard work","t":"Crime","id":524},{"q":"Give one criticism of Merton.","a":"Not everyone shares the same goals (Valier), and he focuses on working-class crime, ignoring crimes of the powerful","t":"Crime","id":525},{"q":"What is status frustration?","a":"Cohen's idea that working-class boys who fail at school feel frustrated by their low status","t":"Crime","id":526},{"q":"What are delinquent subcultures?","a":"Groups that reject mainstream values and gain status through deviant acts, according to Cohen","t":"Crime","id":527},{"q":"What is non-utilitarian crime?","a":"Crime not motivated by money or gain, such as vandalism","t":"Crime","id":528},{"q":"Whose theory explains non-utilitarian crime?","a":"Albert Cohen's status frustration theory","t":"Crime","id":529},{"q":"What is a deviant career?","a":"A process where a person progresses through stages of deviant behaviour over time","t":"Crime","id":530},{"q":"Give one criticism of Cohen.","a":"Not all working-class boys who fail at school turn to crime, and his theory ignores female delinquency","t":"Crime","id":531},{"q":"How do Marxists explain crime?","a":"Capitalism causes crime through poverty, greed and materialism, and laws protect the interests of the ruling class","t":"Crime","id":532},{"q":"What did Chambliss argue?","a":"Capitalism encourages crime at all levels, including in corporate boardrooms","t":"Crime","id":533},{"q":"What did Miliband argue about the judiciary?","a":"Judges come from the same backgrounds as the ruling class, so they protect its interests","t":"Crime","id":534},{"q":"What is white-collar crime?","a":"Crime committed by middle-class people in the course of their jobs, e.g. fraud; first used by Sutherland in the 1940s","t":"Crime","id":535},{"q":"What is corporate crime?","a":"Crime committed by employees on behalf of their company, e.g. making unsafe products","t":"Crime","id":536},{"q":"Why is corporate crime under-represented in statistics?","a":"It is hard to detect, often has no obvious victim, and the powerful can afford good lawyers","t":"Crime","id":537},{"q":"How might Marxists criticise zero tolerance policing?","a":"It targets working-class crime on the streets while ignoring crimes of the powerful","t":"Crime","id":538},{"q":"What is the chivalry thesis?","a":"The idea that female offenders are treated more leniently by the criminal justice system than men","t":"Crime","id":539},{"q":"What is double deviance?","a":"The idea that some women are punished more harshly because they have broken both the law and gender norms","t":"Crime","id":540},{"q":"Give an example of double deviance.","a":"Myra Hindley was treated as especially evil because her crimes went against expectations of women as caring","t":"Crime","id":541},{"q":"What did Heidensohn argue?","a":"Women commit less crime because patriarchal society controls them more closely at home, in public and at work","t":"Crime","id":542},{"q":"How are women controlled at home according to Heidensohn?","a":"Housework and childcare restrict their time and movement, and partners may use violence or financial control","t":"Crime","id":543},{"q":"How are women controlled in public according to Heidensohn?","a":"Fear of male violence and of losing their reputation","t":"Crime","id":544},{"q":"Give one criticism of Heidensohn.","a":"She generalises about all women and doesn't always support her claims with strong evidence","t":"Crime","id":545},{"q":"What did Carlen study?","a":"39 mostly working-class women convicted of crimes, using unstructured interviews","t":"Crime","id":546},{"q":"What are Carlen's 'class deal' and 'gender deal'?","a":"Rewards women are promised for conforming: material goods from working (class deal) and a happy family life with a male breadwinner (gender deal)","t":"Crime","id":547},{"q":"When do women commit crime according to Carlen?","a":"When the class and gender deals break down due to poverty, living in care or drug addiction, so crime seems worth it","t":"Crime","id":548},{"q":"Give one weakness of Carlen's study.","a":"Only 39 women were studied, so it can't be generalised","t":"Crime","id":549},{"q":"What did Becker argue about deviance?","a":"No act is deviant in itself: behaviour only becomes deviant when powerful people label it as such","t":"Crime","id":550},{"q":"What is master status?","a":"A label such as 'criminal' that overrides all of a person's other statuses","t":"Crime","id":551},{"q":"What is the self-fulfilling prophecy in crime?","a":"When someone accepts a criminal label and continues to act in line with it","t":"Crime","id":552},{"q":"Give one criticism of labelling theory.","a":"It removes blame from the offender and ignores why people commit the first deviant act","t":"Crime","id":553},{"q":"What did Murray argue about crime?","a":"The underclass, especially boys raised by lone mothers without male role models, are more likely to commit crime","t":"Crime","id":554},{"q":"What was the Cambridge Study in Delinquent Development?","a":"A longitudinal study of 411 working-class boys in south London from age 8 to 48, by West and Farrington","t":"Crime","id":555},{"q":"What is inadequate socialisation?","a":"When families fail to teach children society's norms and values, which may lead to crime","t":"Crime","id":556},{"q":"What does the peer group have to do with crime?","a":"Young people may be pressured into crime to fit in or gain status in their group","t":"Crime","id":557},{"q":"Which social class appears to commit most crime in official statistics?","a":"The working class","t":"Crime","id":558},{"q":"How do labelling theorists explain high working-class crime rates?","a":"Police target working-class areas and stereotype working-class youths, so more of their crimes are recorded","t":"Crime","id":559},{"q":"What did the Ministry of Justice (2019) report about Black people and the CJS?","a":"They were about 4.5 times more likely to be stopped and searched and around 3 times more likely to be arrested","t":"Crime","id":560},{"q":"What is canteen culture?","a":"A police culture of informal attitudes, including racist and sexist ones, shared among officers","t":"Crime","id":561},{"q":"What did the Macpherson Report conclude?","a":"After the murder of Stephen Lawrence, it found institutional racism in the Metropolitan Police","t":"Crime","id":562},{"q":"What did Hall argue in 'Policing the Crisis'?","a":"The media created a moral panic about Black muggers, scapegoating them during an economic crisis in capitalism","t":"Crime","id":563},{"q":"What is a scapegoat?","a":"An individual or group blamed for something that is not their fault","t":"Crime","id":564},{"q":"Roughly what percentage of the prison population are women?","a":"About 4%","t":"Crime","id":565},{"q":"Give one reason why women commit less crime than men.","a":"Greater social control (Heidensohn), different socialisation, or the chivalry thesis means they are less likely to be convicted","t":"Crime","id":566},{"q":"Which age group commits the most crime?","a":"Teenagers and young adults","t":"Crime","id":567},{"q":"What is edgework?","a":"Risky behaviour, often by young people, done for the thrill and excitement","t":"Crime","id":568},{"q":"What is the age of criminal responsibility in England and Wales?","a":"10","t":"Crime","id":569},{"q":"Name two sentences for young offenders.","a":"A fine, referral order, youth rehabilitation order or custodial sentence","t":"Crime","id":570},{"q":"What is a referral order?","a":"A sentence where a young offender agrees a contract with a youth offender panel to make up for harm caused","t":"Crime","id":571},{"q":"What is rehabilitation?","a":"Helping offenders change their behaviour so they don't reoffend","t":"Crime","id":572},{"q":"What is a custodial sentence?","a":"A prison sentence","t":"Crime","id":573},{"q":"Give one argument for prisons.","a":"They protect the public from dangerous offenders and may deter others","t":"Crime","id":574},{"q":"Give one argument against prisons.","a":"Many prisoners reoffend (57% of adults within two years), and prison can break up families and cause job loss","t":"Crime","id":575},{"q":"What did the 2012 law change mean for violent offenders?","a":"A second serious violent or sexual offence leads to a life sentence","t":"Crime","id":576},{"q":"What is probation?","a":"Offenders are released into society under the supervision of the probation service instead of, or after, prison","t":"Crime","id":577},{"q":"What is community service?","a":"A sentence of unpaid work in the community","t":"Crime","id":578},{"q":"What are news values?","a":"The criteria journalists use to decide what is newsworthy, e.g. violence, children, celebrities and graphic images","t":"Crime","id":579},{"q":"What did Ditton and Duffy find?","a":"46% of media crime reports were about violent and sexual crimes, though these were only 3% of recorded crime","t":"Crime","id":580},{"q":"What is a moral panic?","a":"An exaggerated public reaction to a group seen as a threat, often fuelled by the media","t":"Crime","id":581},{"q":"What is a folk devil?","a":"A group defined as a threat to society's values, e.g. the mods and rockers","t":"Crime","id":582},{"q":"Who studied the mods and rockers?","a":"Stanley Cohen","t":"Crime","id":583},{"q":"What is deviancy amplification?","a":"When media exaggeration of an issue leads to more control and more deviance, making the problem worse","t":"Crime","id":584},{"q":"What is agenda setting?","a":"The media's ability to focus public attention on particular topics and direct debate","t":"Crime","id":585},{"q":"What is media amplification?","a":"Media reporting that exaggerates the significance of an event","t":"Crime","id":586},{"q":"What is a magistrate?","a":"A volunteer who sits in a magistrates' court and deals with less serious crime","t":"Crime","id":587},{"q":"What is the judiciary?","a":"Judges and magistrates who apply the law in court","t":"Crime","id":588},{"q":"What is an indictable offence?","a":"A serious offence such as murder or robbery, tried in the Crown Court before a judge and jury","t":"Crime","id":589},{"q":"What is a miscarriage of justice?","a":"When a court fails to deliver justice, e.g. finding an innocent person guilty","t":"Crime","id":590},{"q":"What is a police caution?","a":"A formal warning given for a minor crime","t":"Crime","id":591},{"q":"What is juvenile delinquency?","a":"Minor crime and deviance usually committed by young people","t":"Crime","id":592},{"q":"What is youth crime?","a":"Crime committed by people too young to be sent to adult prison (in the UK, aged 10–17)","t":"Crime","id":593},{"q":"What is the difference between utilitarian and non-utilitarian crime?","a":"Utilitarian crime is for gain (e.g. theft); non-utilitarian crime isn't (e.g. vandalism)","t":"Crime","id":594},{"q":"What is social exclusion?","a":"Being shut out of participation in society's social, economic, political and cultural life","t":"Crime","id":595},{"q":"What is social stigma?","a":"The shame or disgrace attached to something","t":"Crime","id":596},{"q":"What is terrorism?","a":"The use of violence or intimidation to achieve political aims","t":"Crime","id":597},{"q":"What is a stereotype?","a":"A fixed, standardised or distorted view of a group of people","t":"Crime","id":598},{"q":"What is social stratification?","a":"The way society is divided into hierarchical layers, with the most privileged at the top and the least favoured at the bottom","t":"Stratification","id":599},{"q":"What is a social hierarchy?","a":"A pyramid-shaped structure where each layer is smaller but more powerful than the one below","t":"Stratification","id":600},{"q":"What is social inequality?","a":"The uneven distribution of resources (money, power) and life chances (education, health, jobs)","t":"Stratification","id":601},{"q":"What is wealth?","a":"Assets such as property, land, savings and shares, measured at a particular point in time","t":"Stratification","id":602},{"q":"What is income?","a":"The flow of money (or benefits in kind) received over a period, e.g. wages, benefits and pensions","t":"Stratification","id":603},{"q":"Which is distributed more unequally in Britain: wealth or income?","a":"Wealth","t":"Stratification","id":604},{"q":"What share of wealth did the richest 10% of households own (2012–14)?","a":"About 45%, while the bottom 50% owned only about 9%","t":"Stratification","id":605},{"q":"What is slavery as a form of stratification?","a":"A system where one group claims to own another group and treats them as property","t":"Stratification","id":606},{"q":"What was feudalism?","a":"A medieval system of four estates (king, nobles, knights, peasants) where position was ascribed and mobility almost impossible","t":"Stratification","id":607},{"q":"What is the caste system?","a":"A closed system in traditional India where people are born into a caste (e.g. Brahmin, Dalit) linked to their occupation","t":"Stratification","id":608},{"q":"What was apartheid?","a":"A system of racial segregation in South Africa where position was based on ethnicity and ascribed at birth","t":"Stratification","id":609},{"q":"What is an open stratification system?","a":"One where people can move between strata, e.g. the class system","t":"Stratification","id":610},{"q":"What is a closed stratification system?","a":"One where movement between strata is very unlikely, e.g. caste or apartheid","t":"Stratification","id":611},{"q":"What is social mobility?","a":"Movement up or down the layers of society","t":"Stratification","id":612},{"q":"What is intra-generational social mobility?","a":"Movement of an individual between classes during their own lifetime, e.g. through promotion","t":"Stratification","id":613},{"q":"What is inter-generational social mobility?","a":"Movement between generations, when a child ends up in a different class from their parents","t":"Stratification","id":614},{"q":"What did Davis and Moore argue?","a":"Stratification is functional: unequal rewards ensure the most talented people fill the most functionally important roles","t":"Stratification","id":615},{"q":"What are functionally important roles?","a":"Roles that provide essential services and ensure society's long-term survival, e.g. doctors","t":"Stratification","id":616},{"q":"Why do functionally important roles get high rewards according to Davis and Moore?","a":"To attract the most talented people and reward them for long, costly training","t":"Stratification","id":617},{"q":"Give one criticism of Davis and Moore.","a":"Many vital jobs, such as nurses and refuse collectors, have low pay or status, while some unimportant jobs are highly paid","t":"Stratification","id":618},{"q":"How would Marxists criticise Davis and Moore?","a":"Stratification is a way for a privileged minority to exploit others, not a fair system that benefits everyone","t":"Stratification","id":619},{"q":"What are Marx's two main classes?","a":"The bourgeoisie (owners of the means of production) and the proletariat (wage labourers)","t":"Stratification","id":620},{"q":"What did Scambler argue about global capitalism?","a":"We are in an era of financial capitalism where less than 1% hold true wealth and power, including global financiers and chief executives","t":"Stratification","id":621},{"q":"What were Weber's four main social classes?","a":"Property owners, professionals, the petty bourgeoisie and the working class","t":"Stratification","id":622},{"q":"What did Weber say forms a class?","a":"People with similar life chances in the labour market","t":"Stratification","id":623},{"q":"Give an example of high status but low wealth according to Weber.","a":"An aristocrat with a title but no savings, or a nurse or religious leader","t":"Stratification","id":624},{"q":"Give an example of high wealth but low status.","a":"A National Lottery millionaire","t":"Stratification","id":625},{"q":"What was the Registrar General's scale?","a":"The UK's official class scale from 1911 to 1998, dividing occupations into manual and non-manual","t":"Stratification","id":626},{"q":"Give one criticism of the Registrar General's scale.","a":"It used the man's job to classify the whole family and couldn't classify the unemployed","t":"Stratification","id":627},{"q":"What is the NS-SEC?","a":"The National Statistics Socio-economic Classification, which groups jobs by rewards, security, employment status and responsibility","t":"Stratification","id":628},{"q":"Why is the NS-SEC better than the Registrar General's scale?","a":"It is more up to date and includes more people, such as the long-term unemployed","t":"Stratification","id":629},{"q":"What did the Marmot Review (2010) find?","a":"People in higher socio-economic positions have better health and live longer","t":"Stratification","id":630},{"q":"What is morbidity?","a":"Having an illness or disease","t":"Stratification","id":631},{"q":"What is infant mortality?","a":"Deaths of babies in their first year of life","t":"Stratification","id":632},{"q":"What is the embourgeoisement thesis?","a":"The idea that affluent working-class people were becoming middle class in their norms and values","t":"Stratification","id":633},{"q":"Who tested the embourgeoisement thesis in Luton?","a":"Goldthorpe and his colleagues in the 1960s","t":"Stratification","id":634},{"q":"What did Goldthorpe conclude?","a":"Affluent workers had not become middle class, but formed a 'new working class' with privatised, home-centred lives","t":"Stratification","id":635},{"q":"What is instrumentalism?","a":"Seeing something (e.g. work) only as a means to an end, such as earning money","t":"Stratification","id":636},{"q":"What is instrumental collectivism?","a":"Joining collective action such as trade unions only to further your own pay","t":"Stratification","id":637},{"q":"Who revisited the affluent workers in Luton?","a":"Fiona Devine (1992)","t":"Stratification","id":638},{"q":"What method did Devine use?","a":"Intensive interviews with 62 Luton residents linked to the Vauxhall car factory","t":"Stratification","id":639},{"q":"What did Devine find?","a":"Working-class lifestyles had not changed much: there was still solidarity and lives were not purely home-centred or instrumental","t":"Stratification","id":640},{"q":"Give one weakness of Devine's study.","a":"It only studied people in Luton, so the findings can't be generalised","t":"Stratification","id":641},{"q":"What is class alignment?","a":"Strong links between class and voting: working class vote Labour, middle class vote Conservative","t":"Stratification","id":642},{"q":"What is class dealignment?","a":"The weakening of the link between social class and voting behaviour","t":"Stratification","id":643},{"q":"What did the 2016 British Social Attitudes survey find about class identity?","a":"60% of people identified as working class, the same as in 1983, even though fewer did working-class jobs","t":"Stratification","id":644},{"q":"What did Saunders argue about class?","a":"Class origins matter less than ability and effort in where people end up","t":"Stratification","id":645},{"q":"What did the Social Mobility Commission find about 'polish'?","a":"Elite firms judge candidates on confidence, dress and accent, advantaging people from privileged backgrounds","t":"Stratification","id":646},{"q":"What did Goldthorpe's mobility study show?","a":"Working-class children could move up, but were much less likely than middle-class children to get professional jobs","t":"Stratification","id":647},{"q":"Is social mobility rising or falling in Britain?","a":"Evidence suggests it fell towards the end of the 20th century (Crompton)","t":"Stratification","id":648},{"q":"Who is Sylvia Walby?","a":"A feminist who defines patriarchy as a system of social structures through which men dominate, oppress and exploit women","t":"Stratification","id":649},{"q":"How did Walby say patriarchy has changed?","a":"It has moved from private patriarchy (in the home) to public patriarchy (in the workplace and society)","t":"Stratification","id":650},{"q":"What is the gender pay gap?","a":"The difference between men's and women's average earnings; about 8.9% for full-time workers in 2023","t":"Stratification","id":651},{"q":"Give two reasons gender inequality at work persists.","a":"Sex discrimination, the triple shift, expensive childcare, and women working part-time","t":"Stratification","id":652},{"q":"What is the crisis of masculinity?","a":"Men feeling their traditional identity is threatened by the decline of manual jobs, leaving low-paid service jobs or unemployment","t":"Stratification","id":653},{"q":"What does Reni Eddo-Lodge argue?","a":"Mainstream feminism has centred white women's experiences and needs to be more intersectional","t":"Stratification","id":654},{"q":"What is assimilation?","a":"When immigrants give up their own culture and adapt to the norms and values of the dominant culture","t":"Stratification","id":655},{"q":"What did Li and colleagues (2008) find?","a":"Indian and Chinese people had the same chances of professional jobs as white British peers, but other groups faced disadvantage","t":"Stratification","id":656},{"q":"What is chronological age?","a":"How long someone has been alive, which sets rights like driving and voting","t":"Stratification","id":657},{"q":"What is biological age?","a":"Age linked to physical changes in the body, such as puberty or grey hair","t":"Stratification","id":658},{"q":"What is age as a social category?","a":"The different expectations and treatment people face depending on how old others think they are","t":"Stratification","id":659},{"q":"What is ageism?","a":"Discrimination against people because of their age","t":"Stratification","id":660},{"q":"What is absolute poverty?","a":"When income is too low to obtain the minimum needed to survive, such as food and shelter","t":"Stratification","id":661},{"q":"What is relative poverty?","a":"When income is well below average, so people can't afford the normal standard of living in their society","t":"Stratification","id":662},{"q":"What is relative deprivation?","a":"Townsend's term for lacking the diet, activities and living conditions that are normal in your society","t":"Stratification","id":663},{"q":"Who created the term relative deprivation?","a":"Peter Townsend","t":"Stratification","id":664},{"q":"What did Townsend find?","a":"Over 22% of the population were in poverty by his deprivation index, compared to about 6% using the state's measure","t":"Stratification","id":665},{"q":"What method did Townsend use?","a":"Questionnaires (face-to-face surveys) with over 2,000 households","t":"Stratification","id":666},{"q":"Give one criticism of Townsend's deprivation index.","a":"Some items, like not eating a cooked breakfast or fresh meat, may reflect choice or belief rather than poverty","t":"Stratification","id":667},{"q":"What is the official UK measure of low income?","a":"Income below 60% of the median household income after housing costs","t":"Stratification","id":668},{"q":"What is subjective poverty?","a":"Whether people see themselves as living in poverty","t":"Stratification","id":669},{"q":"What is environmental poverty?","a":"Deprivation in living conditions, such as poor housing, no garden or air pollution","t":"Stratification","id":670},{"q":"What is the cycle of deprivation?","a":"The idea that poverty passes from one generation to the next through low income, poor education and poor jobs","t":"Stratification","id":671},{"q":"What did Murray argue about the underclass?","a":"Generous welfare creates a culture of dependency and an underclass who don't work and are linked to crime and lone parenthood","t":"Stratification","id":672},{"q":"Give one criticism of Murray.","a":"He blames the poor and ignores structural causes such as unemployment and low wages","t":"Stratification","id":673},{"q":"What are structural explanations of poverty?","a":"Explanations that blame the way society is organised, e.g. low pay, unemployment and inequality, rather than individuals","t":"Stratification","id":674},{"q":"How do Marxists explain poverty?","a":"Capitalism creates poverty by paying low wages and keeping a reserve army of cheap labour","t":"Stratification","id":675},{"q":"How might feminists explain poverty?","a":"Women are more likely to be poor because of the pay gap, part-time work, caring roles and being lone parents","t":"Stratification","id":676},{"q":"What did Butler and Watt identify as causes of rising inequality?","a":"A growing pay gap between skilled and unskilled workers, tax cuts benefiting the rich, and more low-income groups like pensioners","t":"Stratification","id":677},{"q":"What is the 'overclass'?","a":"Beresford's term for the super-rich and powerful who profit from economic problems","t":"Stratification","id":678},{"q":"What is the welfare state?","a":"A system where the state protects citizens' health and welfare through services (like the NHS) and benefits","t":"Stratification","id":679},{"q":"When was the welfare state set up?","a":"After the Second World War, based on the 1942 Beveridge Report","t":"Stratification","id":680},{"q":"What is means testing?","a":"Checking that a claimant is in financial need before they receive help from the state","t":"Stratification","id":681},{"q":"What is a universal benefit?","a":"A benefit everyone in a group gets regardless of income, e.g. the state pension","t":"Stratification","id":682},{"q":"What is power according to Weber?","a":"Getting what you want despite opposition from others","t":"Stratification","id":683},{"q":"What is traditional authority?","a":"Authority based on custom and tradition, e.g. the monarchy","t":"Stratification","id":684},{"q":"What is charismatic authority?","a":"Authority based on a leader's extraordinary personal qualities that inspire people, e.g. religious leaders","t":"Stratification","id":685},{"q":"What is rational-legal authority?","a":"Authority based on accepted laws and rules, e.g. a judge or police officer","t":"Stratification","id":686},{"q":"What is formal power?","a":"Power based on an official position, such as a manager or MP","t":"Stratification","id":687},{"q":"What is informal power?","a":"Power that comes from influence rather than an official position, e.g. peer pressure","t":"Stratification","id":688},{"q":"What is a dictatorship?","a":"A government controlled by one person or a small group, often suppressing opposition","t":"Stratification","id":689},{"q":"What is censorship?","a":"Suppression of information or ideas by authorities to control what people see and think","t":"Stratification","id":690},{"q":"What is propaganda?","a":"Biased information used to promote a political cause","t":"Stratification","id":691},{"q":"What is first-past-the-post?","a":"An electoral system where the candidate with the most votes in a constituency wins the seat","t":"Stratification","id":692},{"q":"What is proportional representation?","a":"An electoral system where parties get seats in proportion to the votes they receive","t":"Stratification","id":693},{"q":"What is a constituency?","a":"A voting area that elects a representative, such as an MP","t":"Stratification","id":694},{"q":"What is a pressure group?","a":"An organisation that tries to influence government policy without standing for election, e.g. Greenpeace","t":"Stratification","id":695},{"q":"What is a political party?","a":"A group with shared beliefs that works to win elections and form a government","t":"Stratification","id":696},{"q":"How might a functionalist view power?","a":"Power is used for the benefit of society as a whole and based on shared values","t":"Stratification","id":697},{"q":"How might a Marxist view power?","a":"Power lies with the ruling class, who use it to protect their wealth","t":"Stratification","id":698},{"q":"How might a feminist view power?","a":"Power is held mainly by men, e.g. women are under-represented in Parliament","t":"Stratification","id":699},{"q":"What is disability as a source of inequality?","a":"Disabled people face lower employment rates (about 53% versus 82% in 2022) and extra costs","t":"Stratification","id":700}]</script>
<script type="application/json" id="data-skills">[{"n":1,"title":"Describing a key term","icon":"💡","tag":"Define it clearly, then develop it with an example.","steps":[["Define","Give an accurate definition using sociological language."],["Develop","Add detail: how it works or why it matters."],["Example","Back it up with an example, a sociologist or evidence."]],"watch":"A one-line definition only gets 1 mark. For 3 marks, develop it and add an example or sociologist. Keep it brief: it's not an essay.","items":[{"id":"s1-1","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'socialisation'.","m":3,"ms":[{"h":"","b":["1 mark: the process of learning the norms, values and culture of society.","+1: distinguishes primary (family, early childhood) and/or secondary (school, peers, media).","+1: example, e.g. children learn to say please and thank you from parents; peer groups reward fitting in."]}]}]},{"id":"s1-2","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'bourgeoisie'.","m":3,"ms":[{"h":"","b":["1 mark: the ruling class who own the means of production.","+1: they exploit the proletariat to make profit.","+1: example or link to Marx, e.g. factory owners; class conflict with the proletariat."]}]}]},{"id":"s1-3","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'patriarchy'.","m":3,"ms":[{"h":"","b":["1 mark: male dominance/power over women in society or the family.","+1: developed, e.g. men hold more power, status and decision-making.","+1: example/sociologist, e.g. Walby's six structures; the gender pay gap; Delphy and Leonard on family hierarchy."]}]}]},{"id":"s1-4","stim":[],"parts":[{"no":"","q":"Describe what sociologists mean by the term 'nuclear family'.","m":3,"ms":[{"h":"","b":["1 mark: a mother, father and their dependent (biological) children.","+1: two generations living in one household.","+1: example/link, e.g. Murdock saw it as universal; Leach's 'cereal packet family'.
